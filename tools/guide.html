<style>
/* Layout: sổ tay phòng lab — thanh lộ trình bên trái, trang bài lab ở giữa như một phiếu thực hành */
:root{

  --term-bg:#111C2D; --term-fg:#DDE6F1; --term-dim:#8193AB; --term-acc:#F2B04A; --term-key:#9DBEFF; --term-ok:#5BD3B5;

  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;

}

  --accent:#8AABFF; --accent-soft:#1B2C4C; --ok:#4CCBA6; --ok-soft:#10302A; --warn:#F2AE4B; --warn-soft:#3A2A11; --bad:#F27570; --bad-soft:#3D1E1E;
  --term-bg:#070E18; --d-trouble:#F27570; --d-arch:#8AABFF; --d-net:#F2AE4B; --d-work:#4CCBA6; --d-stor:#B993F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1320; --paper:#121D2D; --paper-2:#0E1827; --ink:#E3E9F2; --muted:#95A3B7; --line:#26354B;
  --accent:#8AABFF; --accent-soft:#1B2C4C; --ok:#4CCBA6; --ok-soft:#10302A; --warn:#F2AE4B; --warn-soft:#3A2A11; --bad:#F27570; --bad-soft:#3D1E1E;
  --term-bg:#070E18; --d-trouble:#F27570; --d-arch:#8AABFF; --d-net:#F2AE4B; --d-work:#4CCBA6; --d-stor:#B993F0; color-scheme:dark}

<script>
"use strict";
const DATA = /*__DATA__*/null;
const REPO = "https://github.com/TomJennyDev/cka-labs";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const pad = n => String(n).padStart(2, "0");
const DCOL = { trouble: "var(--d-trouble)", arch: "var(--d-arch)", net: "var(--d-net)", work: "var(--d-work)", stor: "var(--d-stor)" };
const ENVTXT = { any: "kind hoặc kubeadm", kind: "cần vào node (kind/kubeadm)", vm: "kubeadm trên máy ảo" };
const store = {
  get(k, d) { try { const v = localStorage.getItem("ckalabs:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ckalabs:" + k, JSON.stringify(v)); } catch (e) {} }
};
let state = store.get("state", { done: {}, tasks: {} });
const save = () => store.set("state", state);
state.steps = state.steps || {}; state.guideHidden = state.guideHidden || {};
const labStatus = id => state.done[id] ? "done" : Object.keys(state.tasks).some(k => k.startsWith(id + ":") && state.tasks[k]) ? "wip" : "";
const byId = id => DATA.labs.find(l => l.id === id);

function copyBtn(wrap, getText) {
  const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Chép";
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(getText()); b.textContent = "Đã chép"; }
    catch (e) { const pre = wrap.querySelector("pre, .cmd"); const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = "Đã chọn"; }
    setTimeout(() => b.textContent = "Chép", 1300);
  };
  wrap.style.position = "relative"; wrap.appendChild(b);
}
function enhance(root) {

let mermaidLoad = null;

function diagrams(root) {
  const codes = $$("code.language-mermaid", root);
  if (!codes.length) return;
  const nodes = codes.map(c => { const pre = c.parentElement, box = document.createElement("div"), m = document.createElement("pre"); box.className = "mmd"; m.className = "mermaid"; m.textContent = c.textContent; box.appendChild(m); pre.replaceWith(box); return m; });
  mermaidLoad = mermaidLoad || new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  mermaidLoad.then(() => {
    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "neutral", fontFamily: "Be Vietnam Pro, system-ui, sans-serif", sequence: { mirrorActors: false } });
    return window.mermaid.run({ nodes: nodes.filter(n => n.isConnected) });
  }).then(() => nodes.forEach(n => {
    const box = n.parentElement, svg = box && box.querySelector("svg"); if (!svg) return;

}

    let ms = end ? end - Date.now() : 120 * 60000;
    if (ms < 0) ms = 0;
    const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
    el.textContent = pad(m) + ":" + pad(s);
    $("#timer").classList.toggle("low", !!end && m < 15);
    $("#tStart").hidden = !!end;
    if (end && ms === 0) $("#tNote").textContent = "Hết giờ. Chạy ./lab check để xem điểm.";
  };
  $("#tStart").onclick = () => { store.set("examEnd", Date.now() + 120 * 60000); tick(); };
  $("#tReset").onclick = () => { store.set("examEnd", 0); $("#tNote").textContent = "Đồng hồ chạy tiếp kể cả khi bạn đóng trang."; tick(); };
  tick(); timerInt = setInterval(tick, 1000);
}

function render() {
  const h = location.hash.slice(1) || "home";
  const m = h.match(/^lab-(\d+)$/);
  const main = $("#main");
  clearInterval(timerInt);
  if (m && byId(+m[1])) { main.innerHTML = lab(+m[1]); diagrams(main); enhance(main); wireLab(+m[1]); document.title = "Lab " + m[1] + " · CKA Labs"; }
  else if (h === "setup") { main.innerHTML = setup(); enhance(main); document.title = "Môi trường · CKA Labs"; }
  else { main.innerHTML = home(); enhance(main); document.title = "CKA Labs"; }
  renderSide($("#q").value); progress();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); if (innerWidth < 1024) $("#side").classList.remove("open"); });
$("#q").addEventListener("input", e => { renderSide(e.target.value); if (e.target.value) $("#side").classList.add("open"); });
$("#sideToggle").onclick = () => { const s = $("#side"); s.classList.toggle("open"); $("#sideToggle").textContent = s.classList.contains("open") ? "Ẩn danh sách bài ▴" : "Hiện danh sách bài ▾"; };
render();
</script>
