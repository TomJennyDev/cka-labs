<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CKAD Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phòng điều khiển cluster — rail module bên trái, sân khấu SVG rộng cho animation, code dạng terminal */
:root{
  --bg:#EAEFF4; --paper:#FFFFFF; --paper-2:#F4F6F9; --ink:#0F1E31; --muted:#56657A; --line:#D2DAE4;
  --accent:#2457D6; --accent-soft:#E0E8FB;
  --node:#0C8770; --node-soft:#DBF2EC;
  --data:#7C46C4; --data-soft:#EEE4FA;
  --pkt:#DB8506; --pkt-soft:#FCEED6;
  --bad:#C93A35; --bad-soft:#FBE2E1;
  --term-bg:#12223A; --term-fg:#DCE6F2; --term-dim:#8396AF; --term-acc:#F2B04A; --term-ok:#5BD3B5; --term-key:#9DBEFF; --term-bad:#FF8A84;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1320; --paper:#111D2E; --paper-2:#0D1828; --ink:#E2E9F2; --muted:#93A2B6; --line:#24344C;
  --accent:#86A8FF; --accent-soft:#1A2B4B; --node:#45C9AC; --node-soft:#11302B; --data:#BA90F2; --data-soft:#291F42;
  --pkt:#F4AD47; --pkt-soft:#3A2A10; --bad:#F2746E; --bad-soft:#3D1D1D;
  --term-bg:#060D17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1320; --paper:#111D2E; --paper-2:#0D1828; --ink:#E2E9F2; --muted:#93A2B6; --line:#24344C;
  --accent:#86A8FF; --accent-soft:#1A2B4B; --node:#45C9AC; --node-soft:#11302B; --data:#BA90F2; --data-soft:#291F42;
  --pkt:#F4AD47; --pkt-soft:#3A2A10; --bad:#F2746E; --bad-soft:#3D1D1D;
  --term-bg:#060D17; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--paper-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--pkt);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;height:52px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.xnav{display:flex;gap:4px;margin-left:6px}.xnav a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}.xnav a[aria-current="page"]{color:var(--ink);background:var(--paper-2)}
@media (max-width:560px){.xnav{margin-left:0}.xnav a{padding:6px 7px;font-size:13px}.top .meta,.brand .tag{display:none!important}.top{gap:8px}}
.plan li>div{min-width:0;overflow-wrap:anywhere}
.mmd{overflow-x:auto;text-align:center;padding:4px 0;contain:paint}
.mmd pre.mermaid{background:none;margin:0;font:12px/1.5 var(--f-mono);color:var(--ink);text-align:left;white-space:pre-wrap}
.mmd svg{height:auto}
@media (max-width:640px){.mmd svg{min-width:560px}}
#kindsCmp th:first-child,#kindsCmp tbody th{position:sticky;left:0;background:var(--paper)}
#kindsCmp td{min-width:120px;font-size:13.5px}
.brand .tag{font:600 11px/1 var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:5px 7px;border-radius:4px}
.top .meta{margin-left:auto;display:flex;align-items:center;gap:10px;font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.meter{width:80px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--node);transition:width .4s}

.layout{display:grid;grid-template-columns:minmax(0,1fr)}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.rail ol{display:flex;gap:2px;list-style:none;margin:0;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));white-space:nowrap}
.rail .grp{display:none}
.rail a{display:flex;gap:9px;align-items:baseline;padding:6px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;line-height:1.35}
.rail a .n{font:600 11px var(--f-mono);opacity:.75}
.rail a:hover{color:var(--ink)}
.rail a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.rail a[aria-current="page"] .n{color:var(--accent);opacity:1}
@media (min-width:1024px){
  .layout{grid-template-columns:236px minmax(0,1fr)}
  .rail{top:calc(env(safe-area-inset-top,0px) + 52px);height:calc(100vh - 52px);align-self:start;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
  .rail ol{flex-direction:column;padding:14px 12px 40px;white-space:normal}
  .rail .grp{display:block;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
  .rail .grp:first-child{padding-top:4px}
}

main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.vh{display:flex;flex-direction:column;gap:6px}
.vh h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,42px);line-height:1.06;letter-spacing:-.02em;margin:0;text-wrap:balance}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0}
.lead{max-width:72ch;color:var(--muted);margin:0;font-size:16px}
h3{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
h4{font-size:15px;margin:0 0 6px;font-weight:700}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:920px){.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (min-width:920px) and (max-width:1439px){.split.wide{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
ul.tight,ol.tight{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow-x:auto;min-width:0}
.stage svg{display:block;width:100%;min-width:760px;height:auto}
.stage.sm svg{min-width:560px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:13px;color:var(--muted)}
.btn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;background:var(--paper-2);border:1px solid var(--line);border-radius:8px}
.seg button{font:600 12.5px var(--f-body);border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=search]{font:14px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input[type=range]{accent-color:var(--accent);width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--node);width:16px;height:16px}
.formrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

pre.code{background:var(--term-bg);color:var(--term-fg);font:12.8px/1.62 var(--f-mono);padding:14px 16px;border-radius:8px;overflow-x:auto;margin:0;position:relative;tab-size:2}
pre.code .c{color:var(--term-dim)}
pre.code .k{color:var(--term-key)}
pre.code .p{color:var(--term-acc)}
pre.code .s{color:var(--term-ok)}
.codewrap{position:relative;min-width:0}
pre.code{padding-right:58px}
.copy{position:absolute;top:8px;right:8px;font:600 11px var(--f-mono);background:rgba(255,255,255,.08);color:var(--term-fg);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:4px 8px;cursor:pointer;z-index:2}
.copy:hover{background:rgba(255,255,255,.16)}

.tbl{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td code{white-space:nowrap}
td.num,th.num{font-variant-numeric:tabular-nums}

.pill{display:inline-block;font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--node-soft);border-color:transparent;color:var(--node)}
.pill.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.warn{background:var(--pkt-soft);border-color:transparent;color:var(--pkt)}
.pill.cp{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* SVG primitives */
.sv-t{fill:var(--ink);font:600 14px var(--f-body)}
.sv-tb{fill:var(--ink);font:700 15px var(--f-body)}
.sv-s{fill:var(--muted);font:11.5px var(--f-mono)}
.sv-lbl{fill:var(--muted);font:600 11px var(--f-mono);letter-spacing:.08em}
.sv-box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.sv-cp{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.sv-node{fill:var(--node-soft);stroke:var(--node);stroke-width:1.5}
.sv-data{fill:var(--data-soft);stroke:var(--data);stroke-width:1.5}
.sv-pkt{fill:var(--pkt-soft);stroke:var(--pkt);stroke-width:1.5}
.sv-bad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
.sv-zone{fill:none;stroke:var(--muted);stroke-opacity:.5;stroke-width:1.3;stroke-dasharray:6 5}
.sv-zonefill{fill:var(--paper-2);stroke:var(--line);stroke-width:1.3}
.sv-wire{stroke:var(--line);stroke-width:1.6;fill:none}
.sv-wire.on{stroke:var(--pkt);stroke-width:2.4}
.sv-life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 5}
.pkt{fill:var(--pkt);stroke:var(--paper);stroke-width:2}
.pkt.blue{fill:var(--accent)}
.comp{cursor:pointer}
.comp:hover rect{stroke-width:2.4}
.comp.sel rect{stroke:var(--pkt);stroke-width:3}
.lit rect,.lit path.shape{stroke:var(--pkt) !important;stroke-width:3 !important}
.dim{opacity:.32}
.future{opacity:.14}
.fstep.dim{opacity:.5}
.fade-in{animation:fi .35s ease both}
@keyframes fi{from{opacity:.2}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:center}
@media (min-width:980px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,5.6vw,62px);line-height:1;letter-spacing:-.03em;margin:8px 0 14px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.term{background:var(--term-bg);color:var(--term-fg);border-radius:10px;font:13px/1.6 var(--f-mono);padding:16px;min-height:300px;overflow-x:auto;white-space:pre;min-width:0}
.term .p{color:var(--term-acc)} .term .ok{color:var(--term-ok)} .term .dim{color:var(--term-dim);opacity:1} .term .bad{color:var(--term-bad)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--term-acc);vertical-align:-2px;animation:pulse 1s steps(2) infinite}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts>div{padding:14px 16px 14px 0;display:flex;flex-direction:column;gap:2px}
.facts b{font:800 30px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}

.wbar{display:flex;height:40px;border-radius:7px;overflow:hidden;margin:6px 0 16px}
.wbar button{border:0;color:#fff;font:700 13px var(--f-mono);cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0;padding:0 4px}
.domains{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.dom{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.dom-h{display:flex;align-items:center;gap:10px}
.dom-h .sw{width:10px;height:10px;border-radius:2px;flex:none}
.dom-h b{font-size:14.5px;line-height:1.3}
.dom-h .pc{margin-left:auto;font:600 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.dom .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.dom .bar i{display:block;height:100%;width:0;transition:width .3s}
.dom label{font-size:13.5px;align-items:flex-start;line-height:1.4}
.dom label input{margin-top:2px;flex:none}
.dom a.go{font-size:13px;font-weight:600;text-decoration:none;margin-top:auto}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plan li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .wk{font:600 12px var(--f-mono);color:var(--accent);padding-top:2px}

/* Detail panel */
.detail h3{margin-bottom:4px}
.detail .kv{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}
.detail .kv>div{border-top:1px solid var(--line);padding-top:10px}
.detail .k{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.stepbox{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){.stepbox{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.stepnum{font:600 12px var(--f-mono);color:var(--pkt);letter-spacing:.05em}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--paper);font:600 10px var(--f-mono);color:var(--muted);cursor:pointer;padding:0}
.dots button.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dots button.cur{background:var(--pkt);color:var(--paper);border-color:var(--pkt)}

/* chips explorer */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{font:600 12.5px var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 10px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.out>div{background:var(--paper);padding:10px 12px;min-width:0}
.out .k{font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.out .v{font:600 14px var(--f-mono);overflow-wrap:anywhere;margin-top:2px}

/* Rolling update */
.pods{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;padding:14px;background:var(--paper-2);border-radius:8px;border:1px solid var(--line)}
.pod{width:64px;height:54px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px var(--f-mono);border:2px solid;transition:opacity .4s,transform .4s}
.pod small{font-size:9.5px;font-weight:400;opacity:.85}
.pod.v1{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pod.v2{background:var(--node-soft);border-color:var(--node);color:var(--node)}
.pod.starting{border-style:dashed;animation:pulse 1s infinite}
.pod.terminating{opacity:.35;transform:scale(.9);border-style:dotted}
.stats{display:flex;flex-wrap:wrap;gap:16px;font:13px var(--f-mono);color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.log{font:12px/1.55 var(--f-mono);background:var(--term-bg);color:var(--term-fg);border-radius:8px;padding:10px 12px;height:120px;overflow-y:auto;white-space:pre-wrap}

/* scheduler */
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ncard{border:2px solid var(--line);border-radius:9px;padding:12px;background:var(--paper);display:flex;flex-direction:column;gap:6px;transition:border-color .3s,opacity .3s;min-width:0}
.ncard .nm{font:700 14px var(--f-mono)}
.ncard .res{font:12px var(--f-mono);color:var(--muted)}
.ncard .why{font-size:12.5px;min-height:20px}
.ncard.fail{border-color:var(--bad);opacity:.6}
.ncard.pass{border-color:var(--node)}
.ncard.win{border-color:var(--pkt);box-shadow:0 0 0 3px var(--pkt-soft)}
.ncard.check{border-color:var(--accent)}
.score{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.score i{display:block;height:100%;width:0;background:var(--node);transition:width .5s}

/* RBAC */
.rbac-q{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.verdict{font:700 15px var(--f-mono);padding:10px 14px;border-radius:8px}
.verdict.yes{background:var(--node-soft);color:var(--node)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}

/* tree */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;margin-bottom:12px}
.crumbs button{font:500 13px var(--f-body);border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.crumbs span{color:var(--muted)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:12px}
.opt{text-align:left;font:600 14px var(--f-body);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--accent)}
.opt small{font-weight:400;color:var(--muted);font-size:12.5px}
.fix{border-left:3px solid var(--node);padding:4px 0 4px 14px;margin-top:12px}

/* QoS */
.qos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.qcard{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:opacity .4s}
.qcard.evicted{opacity:.35}
.qcard .hdr{display:flex;justify-content:space-between;gap:8px;align-items:center}

ol.qchk .qi{font:700 13px var(--f-mono);width:16px;flex:none}
ol.qchk li.ok .qi{color:var(--node)}ol.qchk li.bad .qi{color:var(--bad)}ol.qchk li.warn .qi{color:var(--pkt)}
ol.qchk b{flex:none}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tb-chips b.okc{color:var(--node)}.tb-chips b.warnc{color:var(--pkt)}
.qterm{min-height:0}
#qChips b{font-family:var(--f-body);font-size:12.5px}
/* best practice list */
details.bp{border-top:1px solid var(--line);padding:12px 0}
details.bp:first-of-type{border-top:0}
details.bp summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:baseline}
details.bp summary::-webkit-details-marker{display:none}
details.bp summary::before{content:"+";font:600 14px var(--f-mono);color:var(--accent);width:12px;flex:none}
details.bp[open] summary::before{content:"−"}
details.bp .body{padding:8px 0 0 22px;display:flex;flex-direction:column;gap:10px}

/* terminal sim */
.tsim{background:var(--term-bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tsim .scr{font:12.8px/1.55 var(--f-mono);color:var(--term-fg);padding:14px;height:360px;overflow:auto;white-space:pre}
.tsim .scr .p{color:var(--term-acc)} .tsim .scr .dim{color:var(--term-dim);opacity:1} .tsim .scr .ok{color:var(--term-ok)} .tsim .scr .bad{color:var(--term-bad)}
.tsim form{display:flex;gap:8px;align-items:center;border-top:1px solid rgba(255,255,255,.1);padding:10px 14px}
.tsim form span{color:var(--term-acc);font:13px var(--f-mono)}
.tsim input{flex:1;min-width:0;background:transparent;border:0;color:var(--term-fg);font:13px var(--f-mono);outline:none;padding:4px 0}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{font:12px var(--f-mono);background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:4px 8px;cursor:pointer}
.cheat{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media (max-width:420px){.cheat{grid-template-columns:minmax(0,1fr)}}
.cheat .panel{display:flex;flex-direction:column;gap:10px}
.cmdrow{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:7px 0;border-top:1px solid var(--line)}
.cmdrow:first-of-type{border-top:0}
.cmdrow code{background:none;border:0;padding:0;font-size:12.5px;color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.cmdrow code:hover{color:var(--accent)}
.cmdrow span{font-size:12.5px;color:var(--muted)}

/* quiz */
.q{display:flex;flex-direction:column;gap:10px}
.q .choices{display:grid;gap:8px}
.q .choices button{text-align:left;font:500 14px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
.q .choices button.right{border-color:var(--node);background:var(--node-soft)}
.q .choices button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .choices button:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);padding-left:12px;font-size:14px}

/* cases */
.case{display:flex;flex-direction:column;gap:10px}
.case .tags{display:flex;flex-wrap:wrap;gap:5px}
.phase{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.phase:first-child{border-top:0}
.phase .ix{font:600 11px var(--f-mono);color:var(--muted)}
.phase .st{font:600 11px var(--f-mono)}
.phase.run{background:linear-gradient(90deg,var(--pkt-soft),transparent)}
.phase.ok .st{color:var(--node)}
.runbook li{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.runbook{list-style:none;padding:0;margin:0}
.runbook li:first-child{border-top:0}


/* v2 additions */
.sp-ok{fill:var(--node-soft);stroke:var(--node)} .sp-bad{fill:var(--bad-soft);stroke:var(--bad)} .sp-warn{fill:var(--pkt-soft);stroke:var(--pkt)} .sp-cp{fill:var(--accent-soft);stroke:var(--accent)} .sp-mut{fill:var(--paper-2);stroke:var(--line)}
.sv-pt{fill:var(--ink);font:600 11px var(--f-mono)}
.mech-tabs{margin-top:0;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opt.on{border-color:var(--pkt);box-shadow:inset 0 0 0 1px var(--pkt)}
.cx-h{margin:22px 0 10px;font-size:19px}
.cx-h:first-child{margin-top:4px}
.cxgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
@media (max-width:420px){.cxgrid{grid-template-columns:minmax(0,1fr)}}
details.cx{background:var(--paper);border:1px solid var(--line);border-radius:9px;min-width:0}
details.cx[open]{border-color:var(--accent)}
details.cx summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline}
details.cx summary::-webkit-details-marker{display:none}
details.cx summary b{font-size:14.5px}
.cx-doms{display:inline-flex;gap:4px;flex-wrap:wrap}
.cx-sum{flex-basis:100%;font-size:13.5px;color:var(--muted);line-height:1.5}
details.cx[open] .cx-sum{color:var(--ink)}
.cx-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cx-links a{font-weight:600;text-decoration:none}
.lab{display:flex;flex-direction:column;gap:8px}
.lab h4{font-size:16px;margin:0}
.lab p{margin:0;max-width:80ch}
.lab-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab-n{font:600 12px var(--f-mono);color:var(--accent)}
.lab .pill .sw,.dom .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.linkbtn{font:600 12.5px var(--f-body);border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.ckrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ckrow .linkbtn{flex:none;font-size:12px;margin-top:2px;text-decoration:none}
.dom .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto}
.dom .links a,.dom .links button{font-size:13px;font-weight:600;text-decoration:none}


/* v3 */
.pkt.red{fill:var(--bad)}
.lit.bad rect{stroke:var(--bad) !important}
.arch-pane[hidden]{display:none !important}
ol.cycle{list-style:none;margin:0;padding:0;counter-reset:c}
ol.cycle li{counter-increment:c;display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:8px;padding:9px 0;border-top:1px solid var(--line)}
ol.cycle li:first-child{border-top:0}
ol.cycle li::before{content:counter(c);grid-row:span 3;font:600 12px var(--f-mono);color:var(--accent);padding-top:2px}
.domap{display:flex;flex-direction:column;gap:0}
.comp{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.comp:first-of-type{margin-top:8px}
.comp-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.comp-h b{font-size:14.5px}
.comp-cx{display:flex;flex-wrap:wrap;gap:6px}
.comp-cx button{font:500 12.5px var(--f-body);border:1px solid var(--line);background:var(--paper-2);color:var(--ink);padding:4px 10px;border-radius:999px;cursor:pointer}
.comp-cx button:hover{border-color:var(--accent)}
.comp-cx button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.comp-open:empty{display:none}


/* v4 control plane */
.cp-rules{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cp-rules>div{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.cp-rules p{margin:4px 0 0}
.cps-flow{list-style:none;margin:10px 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.cps-flow li{font-size:13.5px;background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline}
.cps-flow li span{flex-basis:100%;font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.cpc{display:flex;flex-direction:column;gap:12px;min-width:0}
.cpc-lead{font-size:15.5px;max-width:82ch;margin:0}
.cpc h4{margin:6px 0 0}
#cpMap .comp:hover > rect{stroke-width:2.6}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
[hidden]{display:none!important}
</style>
