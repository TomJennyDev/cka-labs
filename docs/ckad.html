\n", "trap": "Đề hay bắt lưu image ra file tar hoặc đổi tag rồi push: đọc kỹ tên và tag được yêu cầu.", "anim": "layers", "docs": "https://kubernetes.io/docs/concepts/containers/images/", "src": [["dgk", "j.podman.md"], ["bmc", "exercises/01-container"]]}, {"t": "Choose and use the right workload resource (Deployment, DaemonSet, CronJob, etc.)", "vi": "Chạy mãi → Deployment; mỗi node một Pod → DaemonSet; chạy xong → Job; theo lịch → CronJob; cần tên và đĩa cố định → StatefulSet.", "cmd": "k create cronjob backup --image=busybox:1.36 --schedule='*/5 * * * *' -- sh -c 'date'", "yaml": "apiVersion: batch/v1\nkind: Job\nmetadata: {name: pi}\nspec:\n  completions: 5\n  parallelism: 2\n  backoffLimit: 2\n  activeDeadlineSeconds: 60\n  template:\n    spec:\n      restartPolicy: Never\n      containers: [{name: pi, image: busybox:1.36, command: [\"sh\", \"-c\", \"echo $((6*7))\"]}]\n", "trap": "Job và CronJob bắt buộc restartPolicy Never hoặc OnFailure; Deployment chỉ nhận Always.", "learn": "kinds", "docs": "https://kubernetes.io/docs/concepts/workloads/", "src": [["dgk", "c.pod_design.md"], ["bmc", "exercises/03-job"]]}, {"t": "Understand multi-container Pod design patterns (e.g. sidecar, init and others)", "vi": "init chạy trước rồi thoát; sidecar chạy cùng suốt đời Pod; adapter đổi định dạng đầu ra; ambassador làm proxy ra ngoài.", "cmd": "k get pod app -o jsonpath='{.spec.initContainers[*].name}'; k logs app -c log-tail", "yaml": "spec:\n  initContainers:\n    - name: log-tail            # sidecar kiểu mới (GA từ v1.33)\n      image: busybox:1.36\n      restartPolicy: Always     # chạy song song với container chính\n      command: [\"sh\", \"-c\", \"tail -F /var/log/app/app.log\"]\n      volumeMounts: [{name: logs, mountPath: /var/log/app}]\n  containers:\n    - name: app\n      image: busybox:1.36\n      command: [\"sh\", \"-c\", \"while true; do date >> /var/log/app/app.log; sleep 2; done\"]\n      volumeMounts: [{name: logs, mountPath: /var/log/app}]\n  volumes: [{name: logs, emptyDir: {}}]\n", "trap": "Muốn xem log hay exec phải chỉ đúng container bằng -c; init container lỗi thì Pod đứng Init:CrashLoopBackOff.", "anim": "multi", "docs": "https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/", "src": [["dgk", "b.multi_container_pods.md"], ["bmg", "ch08"], ["bmc", "exercises/07-init-container"]]}, {"t": "Utilize persistent and ephemeral volumes", "vi": "emptyDir sống theo Pod; PVC xin đĩa, PV là đĩa thật; StorageClass tạo PV tự động.", "cmd": "k get pv,pvc; k describe pvc data", "yaml": "apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: data}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual\n  resources: {requests: {storage: 500Mi}}\n", "trap": "PVC Pending vì storageClassName, accessModes hoặc dung lượng không khớp PV nào.", "learn": "storage", "docs": "https://kubernetes.io/docs/concepts/storage/volumes/", "src": [["dgk", "g.state.md"], ["bmc", "exercises/06-persistentvolume-static-provisioning"]]}]}, {"id": "deploy", "w": 20, "t": "Application Deployment", "vi": "Triển khai ứng dụng", "topics": [{"t": "Use Kubernetes primitives to implement common deployment strategies (e.g. blue/green or canary)", "vi": "Blue/green đổi selector của Service sang bản mới; canary chạy song song hai Deployment chung label, tỉ lệ theo số replicas.", "cmd": "k patch svc shop -p '{\"spec\":{\"selector\":{\"app\":\"shop\",\"version\":\"green\"}}}'", "yaml": "# Service chọn theo cả version: đổi một dòng là chuyển toàn bộ traffic\nspec:\n  selector: {app: shop, version: blue}\n", "trap": "Canary bằng replicas chỉ chia gần đúng theo số Pod; muốn chia theo phần trăm chính xác phải dùng Gateway/Ingress có trọng số.", "anim": "strategy", "docs": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "src": [["bmc", "exercises/13-deployment-blue-green"], ["bmg", "ch11"], ["dgk", "c.pod_design.md"]]}, {"t": "Understand Deployments and how to perform rolling updates", "vi": "set image tạo ReplicaSet mới; maxSurge và maxUnavailable quyết định tốc độ; rollout undo quay lại revision cũ.", "cmd": "k set image deploy/web web=nginx:1.28 && k rollout status deploy/web && k rollout undo deploy/web --to-revision=1", "yaml": "spec:\n  strategy:\n    type: RollingUpdate\n    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}\n", "trap": "Tên container trong set image phải đúng (k get deploy web -o jsonpath='{..containers[*].name}'). Đang pause thì set image không chạy.", "learn": "workloads", "docs": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#rolling-back-a-deployment", "src": [["dgk", "c.pod_design.md"], ["bmc", "exercises/11-deployment-rolling-update"]]}, {"t": "Use the Helm package manager to deploy existing packages", "vi": "repo add → search → install với --set hoặc -f → upgrade → rollback → uninstall.", "cmd": "helm install web podinfo/podinfo -n web --create-namespace --set replicaCount=2", "yaml": "helm repo add podinfo https://stefanprodan.github.io/podinfo\nhelm search repo podinfo --versions | head\nhelm show values podinfo/podinfo > values.yaml\nhelm upgrade web podinfo/podinfo -n web -f values.yaml\nhelm history web -n web && helm rollback web 1 -n web\nhelm list -A --all            # cả release pending/failed\n", "trap": "Quên -n: Helm lưu release theo namespace nên list/upgrade không thấy. Dùng helm list -A.", "learn": "best", "docs": "https://helm.sh/docs/intro/using_helm/", "src": [["dgk", "h.helm.md"], ["bmc", "exercises/14-helm-consume-chart"], ["helm", ""]]}, {"t": "Kustomize", "vi": "base dùng chung, overlay chỉ ghi phần khác; generator sinh ConfigMap/Secret có hậu tố hash.", "cmd": "k kustomize overlays/prod && k apply -k overlays/prod", "yaml": "# overlays/prod/kustomization.yaml\nresources: [../../base]\nnamespace: prod\nnamePrefix: prod-\nreplicas: [{name: web, count: 3}]\nimages: [{name: nginx, newTag: \"1.28\"}]\nconfigMapGenerator: [{name: web-cfg, literals: [MODE=prod]}]\n", "trap": "k apply -k nhận thư mục, không nhận file; xem kết quả trước bằng k kustomize.", "learn": "best", "docs": "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/", "src": [["bmc", "exercises/16-kustomize-secret-patch"]]}]}, {"id": "obs", "w": 15, "t": "Application Observability and Maintenance", "vi": "Quan sát và bảo trì", "topics": [{"t": "Understand API deprecations", "vi": "apiVersion cũ bị gỡ thì apply báo no matches for kind; tìm version còn phục vụ bằng api-resources và explain.", "cmd": "k api-resources | grep -i horizontal; k explain hpa --api-version=autoscaling/v2", "yaml": "# cũ (đã gỡ ở v1.26)          # mới\napiVersion: autoscaling/v2beta2   apiVersion: autoscaling/v2\n", "trap": "Đổi apiVersion xong vẫn phải đối chiếu trường đã đổi tên (k explain); kubectl convert là plugin, có thể không có sẵn.", "docs": "https://kubernetes.io/docs/reference/using-api/deprecation-guide/", "src": [["bmc", "exercises/17-api-deprecation"], ["bmg", "ch13"]]}, {"t": "Implement probes and health checks", "vi": "startup chờ app khởi động; liveness hỏng thì restart; readiness hỏng thì rút khỏi Service.", "cmd": "k describe pod web | grep -iE 'liveness|readiness|startup|unhealthy'", "yaml": "readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}\nlivenessProbe: {exec: {command: [\"ls\", \"/\"]}, initialDelaySeconds: 5, periodSeconds: 10}\nstartupProbe: {tcpSocket: {port: 80}, failureThreshold: 30, periodSeconds: 2}\n", "trap": "Liveness sai path làm container bị giết liên tục dù app khỏe; readiness không bao giờ restart.", "learn": "probes", "docs": "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/", "src": [["dgk", "e.observability.md"], ["bmc", "exercises/18-pod-probes"]]}, {"t": "Use built-in CLI tools to monitor Kubernetes applications", "vi": "k top cho CPU/RAM hiện tại (cần metrics-server); k get -w và events cho thay đổi.", "cmd": "k top pod -A --sort-by=memory | head -5; k events -n app --types=Warning", "yaml": "", "trap": "k top báo Metrics API not available khi chưa có metrics-server.", "learn": "scale", "docs": "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/", "src": [["dgk", "e.observability.md"], ["bmc", "exercises/19-pod-metrics"]]}, {"t": "Utilize container logs", "vi": "logs theo container, lần chạy trước, khoảng thời gian, theo label.", "cmd": "k logs web -c app --previous; k logs -l app=web --all-containers --prefix --since=10m", "yaml": "", "trap": "Pod nhiều container mà không có -c thì kubectl báo phải chọn container (hoặc lấy container mặc định).", "docs": "https://kubernetes.io/docs/concepts/cluster-administration/logging/", "src": [["dgk", "e.observability.md"]]}, {"t": "Debugging in Kubernetes", "vi": "describe xem Events; logs --previous; exec vào trong; debug gắn container tạm vào Pod không có shell.", "cmd": "k debug -it web --image=busybox:1.36 --target=web", "yaml": "", "trap": "Đọc cột STATUS trước: ImagePullBackOff, CrashLoopBackOff, Pending mỗi cái có chỗ xem khác nhau.", "learn": "trouble", "docs": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "src": [["dgk", "e.observability.md"], ["bmc", "exercises/20-troubleshooting-pod"]]}]}, {"id": "env", "w": 25, "t": "Application Environment, Configuration and Security", "vi": "Môi trường, cấu hình và bảo mật", "topics": [{"t": "Discover and use resources that extend Kubernetes (CRD, Operators)", "vi": "CRD thêm kind mới vào API; Operator là controller xử lý kind đó. Dùng như mọi object khác.", "cmd": "k get crd; k api-resources --api-group=stable.example.com; k explain backup.spec", "yaml": "apiVersion: stable.example.com/v1\nkind: Backup\nmetadata: {name: nightly}\nspec: {schedule: \"0 2 * * *\", target: db}\n", "trap": "Tên đầy đủ của CRD là <plural>.<group>; k get backups.stable.example.com khi có kind trùng tên.", "docs": "https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/", "src": [["dgk", "i.crd.md"], ["bmc", "exercises/21-crd"]]}, {"t": "Understand authentication, authorization and admission control", "vi": "request đi qua xác thực (ai), phân quyền RBAC (được làm gì), admission (có hợp lệ không).", "cmd": "k auth can-i list pods -n app --as=system:serviceaccount:app:reader", "yaml": "k create role pod-reader -n app --verb=get,list,watch --resource=pods\nk create rolebinding reader -n app --role=pod-reader --serviceaccount=app:reader\n", "trap": "--serviceaccount nhận <namespace>:<tên>, không phải chỉ tên.", "learn": "security", "docs": "https://kubernetes.io/docs/reference/access-authn-authz/rbac/", "src": [["bmc", "exercises/22-rbac-serviceaccount"], ["bmg", "ch17"]]}, {"t": "Understand requests, limits, quotas", "vi": "requests để xếp lịch và tính quota; limits bị kernel chặn; ResourceQuota và LimitRange giới hạn theo namespace.", "cmd": "k create quota q -n app --hard=requests.cpu=1,requests.memory=1Gi,pods=5", "yaml": "apiVersion: v1\nkind: LimitRange\nmetadata: {name: defaults}\nspec:\n  limits:\n    - type: Container\n      defaultRequest: {cpu: 100m, memory: 128Mi}\n      default: {cpu: 200m, memory: 256Mi}\n", "trap": "Có quota CPU/RAM mà Pod không khai requests thì bị từ chối, trừ khi có LimitRange điền mặc định.", "learn": "scale", "docs": "https://kubernetes.io/docs/concepts/policy/resource-quotas/", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/24-resourcequota"], ["bmc", "exercises/25-limitrange"]]}, {"t": "Define resource requirements", "vi": "Khai requests và limits cho từng container; requests = limits ở mọi container thì QoS là Guaranteed.", "cmd": "k set resources deploy/web --requests=cpu=100m,memory=128Mi --limits=cpu=200m,memory=256Mi", "yaml": "resources:\n  requests: {cpu: 100m, memory: 128Mi}\n  limits: {cpu: 200m, memory: 256Mi}\n", "trap": "Đơn vị: 0.5 = 500m CPU; 1Gi khác 1G.", "learn": "perf", "docs": "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/23-resource-requests-limits"]]}, {"t": "Understand ConfigMaps", "vi": "Cấu hình không bí mật; đưa vào Pod bằng env, envFrom hoặc volume (volume tự cập nhật, env thì không).", "cmd": "k create cm app-cfg --from-literal=MODE=dev --from-file=app.properties", "yaml": "env:\n  - name: MODE\n    valueFrom: {configMapKeyRef: {name: app-cfg, key: MODE}}\nenvFrom: [{configMapRef: {name: app-cfg}}]\n", "trap": "Sửa ConfigMap không làm env của Pod đang chạy đổi: phải restart (k rollout restart).", "docs": "https://kubernetes.io/docs/concepts/configuration/configmap/", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/26-configmap"]]}, {"t": "Create & consume Secrets", "vi": "Như ConfigMap nhưng cho dữ liệu nhạy cảm; base64 chỉ là cách viết, không phải mã hóa.", "cmd": "k create secret generic db --from-literal=password=s3cr3t; k get secret db -o jsonpath='{.data.password}' | base64 -d", "yaml": "volumes: [{name: db, secret: {secretName: db}}]\n# container\nvolumeMounts: [{name: db, mountPath: /etc/db, readOnly: true}]\n", "trap": "Viết YAML bằng data: thì giá trị phải base64; dùng stringData: để viết chữ thường.", "learn": "wire", "docs": "https://kubernetes.io/docs/concepts/configuration/secret/", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/27-secret"]]}, {"t": "Understand ServiceAccounts", "vi": "Danh tính của Pod khi gọi API; mỗi namespace có SA default; tắt automount nếu app không gọi API.", "cmd": "k create sa app; k create token app --duration=1h", "yaml": "spec:\n  serviceAccountName: app\n  automountServiceAccountToken: false\n", "trap": "serviceAccountName của Pod đang chạy không sửa được: sửa Deployment để tạo Pod mới.", "learn": "security", "docs": "https://kubernetes.io/docs/concepts/security/service-accounts/", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/22-rbac-serviceaccount"]]}, {"t": "Understand Application Security (SecurityContexts, Capabilities, etc.)", "vi": "Chạy bằng user không phải root, không leo quyền, bỏ capability thừa, root filesystem chỉ đọc.", "cmd": "k exec secure -- id", "yaml": "securityContext:                 # cấp Pod\n  runAsUser: 1000\n  runAsNonRoot: true\n  fsGroup: 2000\ncontainers:\n  - name: app\n    securityContext:             # cấp container (ghi đè cấp Pod)\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}\n", "trap": "capabilities và readOnlyRootFilesystem chỉ có ở cấp container; fsGroup chỉ có ở cấp Pod.", "learn": "security", "docs": "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/28-securitycontext"]]}]}, {"id": "net", "w": 20, "t": "Services and Networking", "vi": "Service và mạng", "topics": [{"t": "Demonstrate basic understanding of NetworkPolicies", "vi": "Có policy chọn Pod thì Pod đó chỉ nhận/gửi những gì được liệt kê; nhớ mở DNS khi chặn egress.", "cmd": "k get netpol -n app; k describe netpol db-allow -n app", "yaml": "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: db-allow}\nspec:\n  podSelector: {matchLabels: {app: db}}\n  policyTypes: [Ingress]\n  ingress:\n    - from: [{podSelector: {matchLabels: {access: granted}}}]\n      ports: [{port: 5432}]\n", "trap": "from có hai phần tử (- namespaceSelector, - podSelector) là HOẶC; gộp vào một phần tử là VÀ.", "learn": "network", "docs": "https://kubernetes.io/docs/concepts/services-networking/network-policies/", "src": [["dgk", "f.services.md"], ["bmc", "exercises/32-networkpolicy"]]}, {"t": "Provide and troubleshoot access to applications via services", "vi": "Service chọn Pod bằng label; không có endpoint thì kiểm selector, targetPort, readiness.", "cmd": "k expose deploy web --port=80 --target-port=8080; k get endpointslices -l kubernetes.io/service-name=web", "yaml": "spec:\n  type: NodePort\n  selector: {app: web}\n  ports: [{port: 80, targetPort: 8080, nodePort: 30080}]\n", "trap": "Service không có endpoint gần như luôn là selector sai hoặc targetPort sai.", "learn": "network", "docs": "https://kubernetes.io/docs/concepts/services-networking/service/", "src": [["dgk", "f.services.md"], ["bmc", "exercises/29-service"], ["bmc", "exercises/30-troubleshooting-service"]]}, {"t": "Use Ingress rules to expose applications", "vi": "Ingress định tuyến HTTP theo host và path tới Service; cần ingress controller và ingressClassName.", "cmd": "k create ingress shop --class=nginx --rule='shop.lab/app*=app:80' --rule='shop.lab/api*=api:8080'", "yaml": "spec:\n  ingressClassName: nginx\n  rules:\n    - host: shop.lab\n      http:\n        paths:\n          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 8080}}}}\n", "trap": "pathType bắt buộc (Prefix hoặc Exact); backend trỏ tới Service cùng namespace với Ingress.", "learn": "network", "docs": "https://kubernetes.io/docs/concepts/services-networking/ingress/", "src": [["dgk", "f.services.md"], ["bmc", "exercises/31-ingress"]]}]}], "exercises": [{"id": "b-image", "d": "build", "tp": 0, "title": "Build image, đổi tag và lưu ra file", "ns": "", "mins": 6, "test": false, "task": "Trong thư mục /opt/web có file index.html.\n1. Viết Dockerfile dùng nginx:1.27-alpine, chép index.html vào /usr/share/nginx/html/.\n2. Build image tên web:1.0 bằng podman (hoặc docker).\n3. Gắn thêm tag registry.lab:5000/web:1.0 và lưu image web:1.0 ra file /opt/web-1.0.tar.\n", "hint": "podman build -t, podman tag, podman save -o", "sol": "cd /opt/web\ncat > Dockerfile <<'EOF'\nFROM nginx:1.27-alpine\nCOPY index.html /usr/share/nginx/html/\nEOF\npodman build -t web:1.0 .\npodman tag web:1.0 registry.lab:5000/web:1.0\npodman save -o /opt/web-1.0.tar web:1.0\npodman images | grep web            # kiểm tra\npodman image history web:1.0        # mỗi dòng Dockerfile một layer\n", "check": "ls -lh /opt/web-1.0.tar && tar -tf /opt/web-1.0.tar | head", "src": [["dgk", "j.podman.md"], ["bmc", "exercises/01-container"]]}, {"id": "b-job", "d": "build", "tp": 1, "title": "Job chạy 5 lần, 2 Pod song song, có hạn giờ", "ns": "ck-jobs", "mins": 4, "task": "Namespace ck-jobs. Tạo Job calc với image busybox:1.36 chạy lệnh sh -c 'echo $((6*7))'.\nJob phải hoàn thành 5 lần, tối đa 2 Pod chạy cùng lúc, thử lại tối đa 2 lần và bị dừng nếu chạy quá 60 giây.\nĐợi Job xong và in kết quả của một Pod.\n", "hint": "k create job --dry-run=client -o yaml rồi thêm completions, parallelism, backoffLimit, activeDeadlineSeconds", "sol": "k config set-context --current --namespace=ck-jobs\nk create job calc --image=busybox:1.36 --dry-run=client -o yaml -- sh -c 'echo $((6*7))' > calc.yaml\n# sửa calc.yaml bằng vim, phần spec thành như dưới:\ncat > calc.yaml <<'EOF'\napiVersion: batch/v1\nkind: Job\nmetadata: {name: calc}\nspec:\n  completions: 5\n  parallelism: 2\n  backoffLimit: 2\n  activeDeadlineSeconds: 60\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n        - name: calc\n          image: busybox:1.36\n          command: [\"sh\", \"-c\", \"echo $((6*7))\"]\nEOF\nk apply -f calc.yaml\nk wait --for=condition=complete job/calc --timeout=120s\nk logs job/calc            # một Pod bất kỳ của Job\n", "check": "test \"$(k get job calc -n ck-jobs -o jsonpath='{.spec.completions}/{.spec.parallelism}/{.spec.backoffLimit}/{.spec.activeDeadlineSeconds}')\" = \"5/2/2/60\"\nk wait -n ck-jobs --for=condition=complete job/calc --timeout=120s >/dev/null\ntest \"$(k logs -n ck-jobs job/calc)\" = \"42\"\n", "src": [["dgk", "c.pod_design.md"], ["bmc", "exercises/03-job"]]}, {"id": "b-cron", "d": "build", "tp": 1, "title": "CronJob giữ lịch sử ngắn, không chạy chồng", "ns": "ck-cron", "mins": 4, "task": "Namespace ck-cron. Tạo CronJob report chạy mỗi 5 phút với image busybox:1.36, lệnh sh -c 'date; echo report'.\nChỉ giữ 2 Job thành công và 1 Job lỗi gần nhất, không cho hai lần chạy chồng lên nhau.\nSau đó chạy ngay một lần bằng tay thành Job tên report-manual.\n", "hint": "successfulJobsHistoryLimit, failedJobsHistoryLimit, concurrencyPolicy: Forbid; k create job --from=cronjob/…", "sol": "k config set-context --current --namespace=ck-cron\nk create cronjob report --image=busybox:1.36 --schedule='*/5 * * * *' -- sh -c 'date; echo report'\nk patch cj report --type=merge -p '{\"spec\":{\"successfulJobsHistoryLimit\":2,\"failedJobsHistoryLimit\":1,\"concurrencyPolicy\":\"Forbid\"}}'\nk create job report-manual --from=cronjob/report\nk wait --for=condition=complete job/report-manual --timeout=90s && k logs job/report-manual\n", "check": "test \"$(k get cj report -n ck-cron -o jsonpath='{.spec.schedule}|{.spec.successfulJobsHistoryLimit}|{.spec.failedJobsHistoryLimit}|{.spec.concurrencyPolicy}')\" = \"*/5 * * * *|2|1|Forbid\"\nk wait -n ck-cron --for=condition=complete job/report-manual --timeout=90s >/dev/null\nk logs -n ck-cron job/report-manual | grep -q report\n", "src": [["dgk", "c.pod_design.md"], ["bmc", "exercises/04-cronjob"]]}, {"id": "b-ds", "d": "build", "tp": 1, "title": "DaemonSet chạy trên mọi node, kể cả control plane", "ns": "ck-ds", "mins": 4, "task": "Namespace ck-ds. Tạo DaemonSet node-agent (image busybox:1.36, lệnh sleep 3600) chạy một Pod trên mọi node,\nkể cả node control plane đang có taint node-role.kubernetes.io/control-plane:NoSchedule.\n", "hint": "Không có lệnh create daemonset: tạo Deployment dry-run rồi đổi kind, bỏ replicas và strategy, thêm toleration", "sol": "k config set-context --current --namespace=ck-ds\nk create deploy node-agent --image=busybox:1.36 --dry-run=client -o yaml -- sleep 3600 > ds.yaml\n# vim ds.yaml: kind: DaemonSet, xóa replicas, strategy, status; thêm tolerations. Kết quả:\ncat > ds.yaml <<'EOF'\napiVersion: apps/v1\nkind: DaemonSet\nmetadata: {name: node-agent, labels: {app: node-agent}}\nspec:\n  selector: {matchLabels: {app: node-agent}}\n  template:\n    metadata: {labels: {app: node-agent}}\n    spec:\n      tolerations:\n        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}\n      containers:\n        - name: busybox\n          image: busybox:1.36\n          command: [\"sleep\", \"3600\"]\nEOF\nk apply -f ds.yaml\nk rollout status ds/node-agent\nk get pod -o wide\n", "check": "k rollout status ds/node-agent -n ck-ds --timeout=120s >/dev/null\ntest \"$(k get ds node-agent -n ck-ds -o jsonpath='{.status.numberReady}')\" = \"$(k get nodes --no-headers | wc -l | tr -d ' ')\"\n", "src": [["dgk", "c.pod_design.md"], ["bmg", "ch10"]]}, {"id": "b-sidecar", "d": "build", "tp": 2, "title": "Sidecar đọc log qua emptyDir (sidecar kiểu mới)", "ns": "ck-multi", "mins": 6, "task": "Namespace ck-multi. Tạo Pod app gồm:\n- container app (busybox:1.36) ghi một dòng date vào /var/log/app/app.log mỗi 2 giây;\n- sidecar log-tail (busybox:1.36) chạy tail -F /var/log/app/app.log, khai báo là init container có restartPolicy: Always;\n- cả hai dùng chung volume emptyDir tên logs.\nKiểm tra log của log-tail có dữ liệu.\n", "hint": "Sidecar kiểu mới nằm trong initContainers với restartPolicy: Always, khởi động trước và chạy suốt đời Pod", "sol": "k config set-context --current --namespace=ck-multi\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: app}\nspec:\n  initContainers:\n    - name: log-tail\n      image: busybox:1.36\n      restartPolicy: Always\n      command: [\"sh\", \"-c\", \"tail -F /var/log/app/app.log\"]\n      volumeMounts: [{name: logs, mountPath: /var/log/app}]\n  containers:\n    - name: app\n      image: busybox:1.36\n      command: [\"sh\", \"-c\", \"while true; do date >> /var/log/app/app.log; sleep 2; done\"]\n      volumeMounts: [{name: logs, mountPath: /var/log/app}]\n  volumes: [{name: logs, emptyDir: {}}]\nEOF\nk wait --for=condition=Ready pod/app --timeout=90s\nsleep 5; k logs app -c log-tail --tail=3\n", "check": "k wait -n ck-multi --for=condition=Ready pod/app --timeout=90s >/dev/null\ntest \"$(k get pod app -n ck-multi -o jsonpath='{.spec.initContainers[0].restartPolicy}')\" = \"Always\"\nfor i in 1 2 3 4 5 6; do k logs -n ck-multi app -c log-tail --tail=1 | grep -q UTC && exit 0; sleep 2; done; exit 1\n", "src": [["bmg", "ch08"], ["k8sdocs", "content/en/docs/concepts/workloads/pods/sidecar-containers.md"]]}, {"id": "b-init", "d": "build", "tp": 2, "title": "Init container chuẩn bị nội dung cho nginx", "ns": "ck-multi", "mins": 5, "task": "Namespace ck-multi. Tạo Pod web với container nginx (nginx:1.27) phục vụ /usr/share/nginx/html.\nThêm init container prepare (busybox:1.36) ghi chữ \"Hello CKAD\" vào index.html của một emptyDir dùng chung,\nđể nginx trả về nội dung đó.\n", "hint": "Init container ghi vào emptyDir mount ở /work, nginx mount cùng volume ở /usr/share/nginx/html", "sol": "k config set-context --current --namespace=ck-multi\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: web}\nspec:\n  initContainers:\n    - name: prepare\n      image: busybox:1.36\n      command: [\"sh\", \"-c\", \"echo 'Hello CKAD' > /work/index.html\"]\n      volumeMounts: [{name: html, mountPath: /work}]\n  containers:\n    - name: nginx\n      image: nginx:1.27\n      ports: [{containerPort: 80}]\n      volumeMounts: [{name: html, mountPath: /usr/share/nginx/html}]\n  volumes: [{name: html, emptyDir: {}}]\nEOF\nk wait --for=condition=Ready pod/web --timeout=90s\nIP=$(k get pod web -o jsonpath='{.status.podIP}')\nk run tmp --rm -i --restart=Never --image=busybox:1.36 -- wget -qO- -T 5 http://$IP\n", "check": "k wait -n ck-multi --for=condition=Ready pod/web --timeout=90s >/dev/null\nIP=$(k get pod web -n ck-multi -o jsonpath='{.status.podIP}')\nk run tmp-chk -n ck-multi --rm -i --restart=Never --image=busybox:1.36 -- wget -qO- -T 5 http://$IP | grep -q \"Hello CKAD\"\n", "src": [["dgk", "b.multi_container_pods.md"], ["bmc", "exercises/07-init-container"]]}, {"id": "b-adapter", "d": "build", "tp": 2, "title": "Adapter đổi định dạng đầu ra", "ns": "ck-multi", "mins": 6, "task": "Namespace ck-multi. Pod metrics có container app (busybox:1.36) cứ 3 giây ghi một dòng dạng \"cpu=37,mem=512\" vào /var/log/raw.log.\nThêm container adapter (busybox:1.36) đọc file đó và in ra stdout dạng \"CPU 37% MEM 512Mi\".\n", "hint": "Hai container chung emptyDir; adapter dùng tail -F | awk (nhớ fflush để log ra ngay)", "sol": "k config set-context --current --namespace=ck-multi\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: metrics}\nspec:\n  containers:\n    - name: app\n      image: busybox:1.36\n      command: [\"sh\", \"-c\", \"while true; do echo cpu=$((RANDOM%100)),mem=512 >> /var/log/raw.log; sleep 3; done\"]\n      volumeMounts: [{name: logs, mountPath: /var/log}]\n    - name: adapter\n      image: busybox:1.36\n      command: [\"sh\", \"-c\", \"tail -F /var/log/raw.log | awk -F'[=,]' '{print \\\"CPU \\\" $2 \\\"% MEM \\\" $4 \\\"Mi\\\"; fflush()}'\"]\n      volumeMounts: [{name: logs, mountPath: /var/log}]\n  volumes: [{name: logs, emptyDir: {}}]\nEOF\nsleep 8; k logs metrics -c adapter --tail=2\n", "check": "k wait -n ck-multi --for=condition=Ready pod/metrics --timeout=90s >/dev/null\nfor i in 1 2 3 4 5 6 7 8; do k logs -n ck-multi metrics -c adapter --tail=1 | grep -qE '^CPU [0-9]+% MEM 512Mi$' && exit 0; sleep 2; done; exit 1\n", "src": [["bmc", "exercises/08-adapter-pattern"], ["bmg", "ch08"]]}, {"id": "b-pvc", "d": "build", "tp": 3, "title": "PV tĩnh, PVC và Pod ghi dữ liệu", "ns": "ck-store", "mins": 7, "task": "Tạo PersistentVolume pv-ck (1Gi, ReadWriteOnce, storageClassName manual, hostPath /tmp/pv-ck).\nTrong namespace ck-store tạo PVC data xin 500Mi cùng storageClassName, rồi Pod writer (busybox:1.36)\nmount PVC ở /data và ghi \"saved\" vào /data/out.txt rồi ngủ.\n", "hint": "PVC chỉ gắn với PV khi storageClassName, accessModes khớp và dung lượng PV ≥ yêu cầu", "sol": "k config set-context --current --namespace=ck-store\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: PersistentVolume\nmetadata: {name: pv-ck}\nspec:\n  capacity: {storage: 1Gi}\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual\n  hostPath: {path: /tmp/pv-ck}\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: data}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual\n  resources: {requests: {storage: 500Mi}}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: writer}\nspec:\n  containers:\n    - name: writer\n      image: busybox:1.36\n      command: [\"sh\", \"-c\", \"echo saved > /data/out.txt && sleep 3600\"]\n      volumeMounts: [{name: data, mountPath: /data}]\n  volumes: [{name: data, persistentVolumeClaim: {claimName: data}}]\nEOF\nk get pv pv-ck; k get pvc data\nk wait --for=condition=Ready pod/writer --timeout=90s && k exec writer -- cat /data/out.txt\n", "check": "test \"$(k get pvc data -n ck-store -o jsonpath='{.status.phase}/{.spec.volumeName}')\" = \"Bound/pv-ck\"\nk wait -n ck-store --for=condition=Ready pod/writer --timeout=90s >/dev/null\ntest \"$(k exec -n ck-store writer -- cat /data/out.txt)\" = \"saved\"\n", "cleanup": "k delete pod writer -n ck-store --wait=false; k delete pvc data -n ck-store --wait=false; k delete pv pv-ck --wait=false", "src": [["dgk", "g.state.md"], ["bmc", "exercises/06-persistentvolume-static-provisioning"]]}, {"id": "b-labels", "d": "build", "tp": 1, "title": "Label, selector và annotation", "ns": "ck-labels", "mins": 4, "task": "Namespace ck-labels. Tạo 3 Pod nginx1, nginx2, nginx3 (nginx:1.27) có label app=v1.\nĐổi label của nginx2 thành app=v2, thêm tier=web cho mọi Pod có app là v1 hoặc v2,\ngắn annotation owner=marketing cho Pod app=v2, rồi liệt kê Pod có cột APP.\n", "hint": "k label --overwrite; selector dạng tập hợp: -l 'app in (v1,v2)'; k get -L app", "sol": "k config set-context --current --namespace=ck-labels\nfor n in 1 2 3; do k run nginx$n --image=nginx:1.27 -l app=v1; done\nk label pod nginx2 app=v2 --overwrite\nk label pod -l 'app in (v1,v2)' tier=web\nk annotate pod -l app=v2 owner=marketing\nk get pod -L app,tier\n", "check": "test \"$(k get pod -n ck-labels -l 'app=v1,tier=web' --no-headers | wc -l | tr -d ' ')\" = \"2\"\ntest \"$(k get pod nginx2 -n ck-labels -o jsonpath='{.metadata.labels.app}/{.metadata.labels.tier}/{.metadata.annotations.owner}')\" = \"v2/web/marketing\"\n", "src": [["dgk", "c.pod_design.md"], ["bmc", "exercises/10-labels-annotations-cli"]]}, {"id": "d-rolling", "d": "deploy", "tp": 1, "title": "Rolling update có ghi nguyên nhân, rồi quay lại bản cũ", "ns": "ck-roll", "mins": 6, "task": "Namespace ck-roll. Tạo Deployment web (nginx:1.27, 3 replicas) với maxSurge 1, maxUnavailable 0.\nCập nhật lên nginx:1.28 và ghi change-cause \"upgrade to 1.28\".\nXem lịch sử rollout, rồi quay lại revision 1 và xác nhận image là nginx:1.27.\n", "hint": "k annotate deploy web kubernetes.io/change-cause=…; k rollout history; k rollout undo --to-revision=1", "sol": "k config set-context --current --namespace=ck-roll\nk create deploy web --image=nginx:1.27 --replicas=3\nk patch deploy web -p '{\"spec\":{\"strategy\":{\"rollingUpdate\":{\"maxSurge\":1,\"maxUnavailable\":0}}}}'\nk rollout status deploy/web\nk set image deploy/web nginx=nginx:1.28\nk annotate deploy/web kubernetes.io/change-cause=\"upgrade to 1.28\"\nk rollout status deploy/web\nk rollout history deploy/web\nk rollout undo deploy/web --to-revision=1 && k rollout status deploy/web\nk get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}'\n", "check": "k rollout status deploy/web -n ck-roll --timeout=120s >/dev/null\ntest \"$(k get deploy web -n ck-roll -o jsonpath='{.spec.template.spec.containers[0].image}|{.spec.strategy.rollingUpdate.maxSurge}|{.spec.strategy.rollingUpdate.maxUnavailable}')\" = \"nginx:1.27|1|0\"\nk rollout history deploy/web -n ck-roll | grep -q \"upgrade to 1.28\"\n", "src": [["dgk", "c.pod_design.md"], ["bmc", "exercises/11-deployment-rolling-update"]]}, {"id": "d-pause", "d": "deploy", "tp": 1, "title": "Gom nhiều thay đổi vào một lần rollout (pause/resume)", "ns": "ck-roll", "mins": 4, "task": "Namespace ck-roll. Tạo Deployment api (nginx:1.27, 2 replicas). Tạm dừng rollout, đổi image sang nginx:1.28\nvà đặt requests cpu=50m,memory=64Mi, rồi tiếp tục để mọi thay đổi ra trong một ReplicaSet mới.\n", "hint": "k rollout pause; k set image; k set resources; k rollout resume", "sol": "k config set-context --current --namespace=ck-roll\nk create deploy api --image=nginx:1.27 --replicas=2\nk rollout status deploy/api\nk rollout pause deploy/api\nk set image deploy/api nginx=nginx:1.28\nk set resources deploy/api --requests=cpu=50m,memory=64Mi\nk get rs -l app=api                 # chưa có ReplicaSet mới khi đang pause\nk rollout resume deploy/api && k rollout status deploy/api\n", "check": "k rollout status deploy/api -n ck-roll --timeout=120s >/dev/null\ntest \"$(k get deploy api -n ck-roll -o jsonpath='{.spec.paused}')\" != \"true\"\ntest \"$(k get rs -n ck-roll -l app=api --no-headers | wc -l | tr -d ' ')\" = \"2\"\ntest \"$(k get deploy api -n ck-roll -o jsonpath='{.spec.template.spec.containers[0].image}|{.spec.template.spec.containers[0].resources.requests.cpu}')\" = \"nginx:1.28|50m\"\n", "src": [["dgk", "c.pod_design.md"]]}, {"id": "d-bluegreen", "d": "deploy", "tp": 0, "title": "Blue/green bằng cách đổi selector của Service", "ns": "ck-bg", "mins": 7, "task": "Namespace ck-bg. Deployment shop-blue (nginx:1.27, 2 replicas, label app=shop, version=blue)\nvà Service shop (ClusterIP, port 80) chọn app=shop, version=blue.\nTạo shop-green (nginx:1.28, 2 replicas, version=green), đợi Ready, chuyển Service sang green rồi xóa shop-blue.\n", "hint": "Deployment cần label riêng trong template; k patch svc để đổi selector", "sol": "k config set-context --current --namespace=ck-bg\ndeploy() {   # $1 = blue|green, $2 = tag\ncat <<EOF | k apply -f -\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: shop-$1}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: shop, version: $1}}\n  template:\n    metadata: {labels: {app: shop, version: $1}}\n    spec: {containers: [{name: nginx, image: \"nginx:$2\"}]}\nEOF\n}\ndeploy blue 1.27\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Service\nmetadata: {name: shop}\nspec:\n  selector: {app: shop, version: blue}\n  ports: [{port: 80, targetPort: 80}]\nEOF\ndeploy green 1.28\nk rollout status deploy/shop-green\nk patch svc shop -p '{\"spec\":{\"selector\":{\"app\":\"shop\",\"version\":\"green\"}}}'\nk delete deploy shop-blue\nk get endpointslices -l kubernetes.io/service-name=shop\n", "check": "test \"$(k get svc shop -n ck-bg -o jsonpath='{.spec.selector.version}')\" = \"green\"\n! k get deploy shop-blue -n ck-bg >/dev/null 2>&1\nk rollout status deploy/shop-green -n ck-bg --timeout=120s >/dev/null\nfor i in $(seq 1 15); do n=$(k get endpointslices -n ck-bg -l kubernetes.io/service-name=shop -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]} {end}' | wc -w); [ \"$n\" = \"2\" ] && exit 0; sleep 2; done; exit 1\n", "src": [["bmc", "exercises/13-deployment-blue-green"], ["bmg", "ch11"]]}, {"id": "d-canary", "d": "deploy", "tp": 0, "title": "Canary 20% bằng số replicas", "ns": "ck-canary", "mins": 6, "task": "Namespace ck-canary. Service api chọn app=api. Deployment api-stable (nginx:1.27, 4 replicas, track=stable)\nvà api-canary (nginx:1.28, 1 replica, track=canary), cả hai có label app=api, để khoảng 20% request vào bản mới.\n", "hint": "Service chỉ chọn app=api nên phủ cả hai Deployment; tỉ lệ = số Pod", "sol": "k config set-context --current --namespace=ck-canary\ndeploy() {   # $1 = track, $2 = tag, $3 = replicas\ncat <<EOF | k apply -f -\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: api-$1}\nspec:\n  replicas: $3\n  selector: {matchLabels: {app: api, track: $1}}\n  template:\n    metadata: {labels: {app: api, track: $1}}\n    spec: {containers: [{name: nginx, image: \"nginx:$2\"}]}\nEOF\n}\ndeploy stable 1.27 4\ndeploy canary 1.28 1\nk create svc clusterip api --tcp=80:80     # selector mặc định app=api\nk get endpointslices -l kubernetes.io/service-name=api -o wide\n", "check": "test \"$(k get svc api -n ck-canary -o jsonpath='{.spec.selector}')\" = '{\"app\":\"api\"}'\nk rollout status deploy/api-stable -n ck-canary --timeout=120s >/dev/null && k rollout status deploy/api-canary -n ck-canary --timeout=120s >/dev/null\nfor i in $(seq 1 15); do n=$(k get endpointslices -n ck-canary -l kubernetes.io/service-name=api -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]} {end}' | wc -w); [ \"$n\" = \"5\" ] && exit 0; sleep 2; done; exit 1\n", "src": [["dgk", "c.pod_design.md"], ["bmg", "ch11"]]}, {"id": "d-helm", "d": "deploy", "tp": 2, "title": "Cài, nâng cấp và quay lại release Helm", "ns": "", "mins": 7, "test": false, "task": "Thêm repo podinfo (https://stefanprodan.github.io/podinfo). Cài chart podinfo/podinfo thành release web\ntrong namespace web (tạo mới) với replicaCount=2. Nâng cấp release đặt replicaCount=3,\nxem lịch sử, quay lại revision 1, cuối cùng liệt kê mọi release kể cả đang lỗi trên toàn cluster.\n", "hint": "helm repo add/update, helm install -n --create-namespace --set, helm upgrade, helm history, helm rollback, helm list -A --all", "sol": "helm repo add podinfo https://stefanprodan.github.io/podinfo && helm repo update\nhelm install web podinfo/podinfo -n web --create-namespace --set replicaCount=2\nhelm upgrade web podinfo/podinfo -n web --set replicaCount=3\nhelm history web -n web\nhelm rollback web 1 -n web\nhelm get values web -n web            # giá trị đang dùng\nhelm list -A --all\n", "check": "test \"$(kubectl get deploy -n web -l app.kubernetes.io/instance=web -o jsonpath='{.items[0].spec.replicas}')\" = 2", "src": [["dgk", "h.helm.md"], ["bmc", "exercises/14-helm-consume-chart"], ["helm", "docs/intro/using_helm.mdx"]]}, {"id": "d-helm-find", "d": "deploy", "tp": 2, "title": "Tìm và gỡ release Helm đang lỗi", "ns": "", "mins": 4, "test": false, "task": "Trên cluster có release bị kẹt ở trạng thái pending-install hoặc failed. Tìm chúng ở mọi namespace,\nghi tên release và namespace vào /opt/broken-releases.txt rồi gỡ chúng.\n", "hint": "helm list -A --pending --failed; helm uninstall -n", "sol": "helm list -A --pending --failed\nhelm list -A --pending --failed -o json | jq -r '.[] | \"\\(.name) \\(.namespace)\"' > /opt/broken-releases.txt\nwhile read name ns; do helm uninstall \"$name\" -n \"$ns\"; done < /opt/broken-releases.txt\n", "check": "test -z \"$(helm list -A --pending --failed -q)\"", "src": [["dgk", "h.helm.md"]]}, {"id": "d-kustomize", "d": "deploy", "tp": 3, "title": "Kustomize base và overlay prod", "ns": "ck-kz", "mins": 8, "task": "Trong thư mục /opt/kz có base gồm Deployment web (nginx:1.27, 1 replica).\nTạo overlay /opt/kz/overlays/prod: namespace ck-kz, tiền tố tên prod-, 3 replicas, image nginx:1.28,\nthêm ConfigMap web-cfg sinh ra từ MODE=prod. Áp overlay lên cluster.\n", "hint": "kustomization.yaml: resources, namespace, namePrefix, replicas, images, configMapGenerator; k apply -k", "sol": "mkdir -p /opt/kz/base /opt/kz/overlays/prod\nk create deploy web --image=nginx:1.27 --dry-run=client -o yaml > /opt/kz/base/deployment.yaml\ncat > /opt/kz/base/kustomization.yaml <<'EOF'\nresources: [deployment.yaml]\nEOF\ncat > /opt/kz/overlays/prod/kustomization.yaml <<'EOF'\nresources: [../../base]\nnamespace: ck-kz\nnamePrefix: prod-\nreplicas: [{name: web, count: 3}]\nimages: [{name: nginx, newTag: \"1.28\"}]\nconfigMapGenerator: [{name: web-cfg, literals: [MODE=prod]}]\nEOF\nk kustomize /opt/kz/overlays/prod      # xem trước\nk apply -k /opt/kz/overlays/prod\n", "check": "test \"$(k get deploy prod-web -n ck-kz -o jsonpath='{.spec.replicas}|{.spec.template.spec.containers[0].image}')\" = \"3|nginx:1.28\"\nk get cm -n ck-kz -o name | grep -q 'configmap/prod-web-cfg-'\n", "workdir": "/opt/kz", "src": [["bmc", "exercises/16-kustomize-secret-patch"], ["k8sdocs", "content/en/docs/tasks/manage-kubernetes-objects/kustomization.md"]]}, {"id": "d-kz-secret", "d": "deploy", "tp": 3, "title": "Kustomize sinh Secret và patch env vào Deployment", "ns": "ck-kz2", "mins": 7, "task": "Thư mục /opt/kz2 chứa deployment.yaml (Deployment api, nginx:1.27, container nginx).\nViết kustomization.yaml sinh Secret api-secret từ DB_PASS=s3cr3t và patch Deployment\nđể container nginx nhận biến DB_PASS từ Secret đó. Áp vào namespace ck-kz2.\n", "hint": "secretGenerator; patches với target kind Deployment; tên Secret được tự thêm hậu tố hash và tự sửa ở chỗ tham chiếu", "sol": "mkdir -p /opt/kz2 && cd /opt/kz2\nk create deploy api --image=nginx:1.27 --dry-run=client -o yaml > deployment.yaml\ncat > kustomization.yaml <<'EOF'\nnamespace: ck-kz2\nresources: [deployment.yaml]\nsecretGenerator:\n  - name: api-secret\n    literals: [DB_PASS=s3cr3t]\npatches:\n  - target: {kind: Deployment, name: api}\n    patch: |-\n      - op: add\n        path: /spec/template/spec/containers/0/env\n        value:\n          - name: DB_PASS\n            valueFrom: {secretKeyRef: {name: api-secret, key: DB_PASS}}\nEOF\nk kustomize . | grep -A3 secretKeyRef      # tên đã có hậu tố hash\nk apply -k .\n", "check": "s=$(k get deploy api -n ck-kz2 -o jsonpath='{.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name}')\ncase \"$s\" in api-secret-*) ;; *) exit 1;; esac\ntest \"$(k get secret \"$s\" -n ck-kz2 -o jsonpath='{.data.DB_PASS}' | base64 -d)\" = \"s3cr3t\"\n", "workdir": "/opt/kz2", "src": [["bmc", "exercises/16-kustomize-secret-patch"]]}, {"id": "d-hpa", "d": "deploy", "tp": 1, "title": "Scale và HorizontalPodAutoscaler", "ns": "ck-hpa", "mins": 4, "task": "Namespace ck-hpa. Tạo Deployment load (nginx:1.27) với requests cpu=50m, scale lên 3 replicas,\nrồi tạo HPA giữ từ 2 tới 6 Pod, mục tiêu CPU 70%.\n", "hint": "HPA tính % trên requests: không có requests thì TARGETS là <unknown>", "sol": "k config set-context --current --namespace=ck-hpa\nk create deploy load --image=nginx:1.27\nk set resources deploy/load --requests=cpu=50m\nk scale deploy/load --replicas=3\nk autoscale deploy/load --min=2 --max=6 --cpu=70%\nk get hpa load\n", "check": "test \"$(k get hpa load -n ck-hpa -o jsonpath='{.spec.minReplicas}/{.spec.maxReplicas}/{.spec.metrics[0].resource.target.averageUtilization}')\" = \"2/6/70\"\ntest \"$(k get deploy load -n ck-hpa -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}')\" = \"50m\"\n", "src": [["dgk", "c.pod_design.md"], ["bmc", "exercises/12-deployment-horizontal-pod-autoscaler"]]}, {"id": "o-deprec", "d": "obs", "tp": 0, "title": "Sửa manifest dùng API đã bị gỡ", "ns": "ck-api", "mins": 5, "task": "File /opt/hpa-old.yaml dùng apiVersion autoscaling/v2beta2 cho HorizontalPodAutoscaler web (min 1, max 4, CPU 60%)\nnên apply báo lỗi. Tìm apiVersion còn phục vụ, sửa file và áp vào namespace ck-api (Deployment web có sẵn).\n", "hint": "k api-resources | grep -i horizontal; k explain hpa.spec.metrics --api-version=autoscaling/v2", "sol": "k config set-context --current --namespace=ck-api\nk create deploy web --image=nginx:1.27 2>/dev/null || true\nk api-resources | grep -i horizontalpodautoscalers     # APIVERSION: autoscaling/v2\ncat > /opt/hpa-new.yaml <<'EOF'\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata: {name: web}\nspec:\n  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}\n  minReplicas: 1\n  maxReplicas: 4\n  metrics:\n    - type: Resource\n      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}\nEOF\nk apply -f /opt/hpa-new.yaml\n", "check": "test \"$(k get hpa.v2.autoscaling web -n ck-api -o jsonpath='{.spec.maxReplicas}/{.spec.metrics[0].resource.target.averageUtilization}')\" = \"4/60\"\n", "src": [["bmc", "exercises/17-api-deprecation"], ["bmg", "ch13"], ["k8sdocs", "content/en/docs/reference/using-api/deprecation-guide.md"]]}, {"id": "o-probes", "d": "obs", "tp": 1, "title": "Đủ ba loại probe", "ns": "ck-probe", "mins": 6, "task": "Namespace ck-probe. Tạo Pod web (nginx:1.27, port 80) có:\nstartupProbe tcpSocket cổng 80 (tối đa 30 lần, mỗi 2 giây),\nreadinessProbe httpGet / cổng 80 mỗi 5 giây,\nlivenessProbe exec \"ls /usr/share/nginx/html\" bắt đầu sau 5 giây, mỗi 10 giây.\n", "hint": "Lấy YAML bằng k run --dry-run=client -o yaml rồi thêm ba khối probe", "sol": "k config set-context --current --namespace=ck-probe\nk run web --image=nginx:1.27 --port=80 --dry-run=client -o yaml > web.yaml\n# vim web.yaml, thêm ba khối probe vào container:\ncat > web.yaml <<'EOF'\napiVersion: v1\nkind: Pod\nmetadata: {name: web, labels: {run: web}}\nspec:\n  containers:\n    - name: web\n      image: nginx:1.27\n      ports: [{containerPort: 80}]\n      startupProbe: {tcpSocket: {port: 80}, failureThreshold: 30, periodSeconds: 2}\n      readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}\n      livenessProbe:\n        exec: {command: [\"ls\", \"/usr/share/nginx/html\"]}\n        initialDelaySeconds: 5\n        periodSeconds: 10\nEOF\nk apply -f web.yaml\nk wait --for=condition=Ready pod/web --timeout=90s\nk describe pod web | grep -E 'Liveness|Readiness|Startup'\n", "check": "k wait -n ck-probe --for=condition=Ready pod/web --timeout=90s >/dev/null\ntest \"$(k get pod web -n ck-probe -o jsonpath='{.spec.containers[0].startupProbe.failureThreshold}|{.spec.containers[0].readinessProbe.httpGet.path}|{.spec.containers[0].livenessProbe.initialDelaySeconds}')\" = \"30|/|5\"\n", "src": [["dgk", "e.observability.md"], ["bmc", "exercises/18-pod-probes"]]}, {"id": "o-findprobe", "d": "obs", "tp": 1, "title": "Tìm Pod có liveness probe đang hỏng", "ns": "ck-probe2", "mins": 5, "task": "Namespace ck-probe2 có nhiều Pod. Một Pod có liveness probe gọi sai path nên bị restart liên tục.\nTìm Pod đó qua Events và ghi tên Pod vào /opt/bad-probe.txt, rồi sửa probe (path đúng là /).\n", "hint": "k get events --field-selector reason=Unhealthy; Pod đang chạy không sửa được probe: xuất YAML, sửa, tạo lại", "setup": "k run ok1 --image=nginx:1.27 -n ck-probe2\nprintf 'apiVersion: v1\\nkind: Pod\\nmetadata: {name: sick}\\nspec:\\n  containers:\\n    - name: sick\\n      image: nginx:1.27\\n      livenessProbe: {httpGet: {path: /healthz, port: 80}, periodSeconds: 3, failureThreshold: 1}\\n' | k apply -n ck-probe2 -f -\nsleep 15\n", "sol": "k config set-context --current --namespace=ck-probe2\nk get events --field-selector reason=Unhealthy -o custom-columns=POD:.involvedObject.name,MSG:.message\nk get events --field-selector reason=Unhealthy -o jsonpath='{.items[0].involvedObject.name}' > /opt/bad-probe.txt\nk get pod sick -o yaml > sick.yaml\nsed -i 's#path: /healthz#path: /#' sick.yaml\nk replace --force -f sick.yaml\n", "check": "test \"$(cat /opt/bad-probe.txt)\" = \"sick\"\ntest \"$(k get pod sick -n ck-probe2 -o jsonpath='{.spec.containers[0].livenessProbe.httpGet.path}')\" = \"/\"\n", "src": [["dgk", "e.observability.md"]]}, {"id": "o-logs", "d": "obs", "tp": 3, "title": "Lấy log đúng container, đúng khoảng", "ns": "ck-logs", "mins": 4, "task": "Namespace ck-logs. Tạo Pod counter (busybox:1.36) in \"i: <date>\" mỗi giây với i tăng dần.\nGhi 5 dòng log mới nhất vào /opt/counter.log. Cho biết lệnh lấy log của lần chạy trước nếu container đã restart.\n", "hint": "k logs --tail=5 > file; k logs --previous", "sol": "k config set-context --current --namespace=ck-logs\nk run counter --image=busybox:1.36 -- sh -c 'i=0; while true; do echo \"$i: $(date)\"; i=$((i+1)); sleep 1; done'\nk wait --for=condition=Ready pod/counter --timeout=60s; sleep 6\nk logs counter --tail=5 > /opt/counter.log\n# lần chạy trước (khi RESTARTS > 0):\n# k logs counter --previous\n", "check": "test \"$(wc -l < /opt/counter.log | tr -d ' ')\" = \"5\"\ngrep -qE '^[0-9]+: ' /opt/counter.log\n", "src": [["dgk", "e.observability.md"]]}, {"id": "o-debug", "d": "obs", "tp": 4, "title": "Sửa Deployment bị CrashLoopBackOff", "ns": "ck-debug", "mins": 6, "task": "Namespace ck-debug. Deployment worker không lên: Pod CrashLoopBackOff.\nTìm nguyên nhân bằng describe và logs --previous, sửa để Pod chạy (lệnh đúng là sh -c 'sleep 3600').\n", "hint": "Đọc Last State và Exit Code; k logs --previous; k edit hoặc k patch deploy", "setup": "k create deploy worker -n ck-debug --image=busybox:1.36 -- sh -c 'ls /notexist'\nsleep 10\n", "sol": "k config set-context --current --namespace=ck-debug\nk get pod -l app=worker\nk describe pod -l app=worker | grep -A4 'Last State'\nk logs deploy/worker --previous || k logs deploy/worker   # ls: /notexist: No such file or directory\nk patch deploy worker --type=json -p '[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/command\",\"value\":[\"sh\",\"-c\",\"sleep 3600\"]}]'\nk rollout status deploy/worker\n", "check": "k rollout status deploy/worker -n ck-debug --timeout=120s >/dev/null\ntest \"$(k get pod -n ck-debug -l app=worker --field-selector=status.phase=Running --no-headers | wc -l | tr -d ' ')\" -ge 1\n", "src": [["dgk", "e.observability.md"], ["bmc", "exercises/20-troubleshooting-pod"], ["bmg", "ch15"]]}, {"id": "o-top", "d": "obs", "tp": 2, "title": "Pod tốn RAM nhất", "ns": "", "mins": 3, "task": "Tìm Pod dùng nhiều memory nhất trong toàn cluster và ghi \"<namespace>/<tên>\" vào /opt/top-mem.txt.\n", "hint": "k top pod -A --sort-by=memory --no-headers", "sol": "k top pod -A --sort-by=memory --no-headers | head -1 | awk '{print $1\"/\"$2}' > /opt/top-mem.txt\ncat /opt/top-mem.txt\n", "check": "grep -qE '^[a-z0-9-]+/[a-z0-9.-]+$' /opt/top-mem.txt", "src": [["dgk", "e.observability.md"], ["bmc", "exercises/19-pod-metrics"]]}, {"id": "o-ephemeral", "d": "obs", "tp": 4, "title": "Gỡ lỗi Pod không có shell bằng container tạm", "ns": "ck-debug", "mins": 4, "test": false, "task": "Pod app trong ck-debug dùng image không có shell. Gắn một container gỡ lỗi busybox:1.36 dùng chung\nnamespace tiến trình với container app để xem các tiến trình đang chạy.\n", "hint": "k debug -it <pod> --image=… --target=<container>", "sol": "k debug -it app -n ck-debug --image=busybox:1.36 --target=app -- sh\n# trong shell: ps aux   (thấy tiến trình của container app)\nk get pod app -n ck-debug -o jsonpath='{.spec.ephemeralContainers[*].name}'\n", "check": "k get pod app -n ck-debug -o jsonpath='{.spec.ephemeralContainers[*].name}' | grep -q debugger", "src": [["k8sdocs", "content/en/docs/tasks/debug/debug-application/debug-running-pod.md"]]}, {"id": "e-cm", "d": "env", "tp": 4, "title": "ConfigMap qua env, envFrom và volume", "ns": "ck-cfg", "mins": 6, "task": "Namespace ck-cfg. Tạo ConfigMap app-cfg có MODE=dev và LEVEL=info.\nTạo Pod cfg (busybox:1.36, sleep 3600): biến APP_MODE lấy từ khóa MODE, nạp toàn bộ app-cfg làm biến môi trường,\nvà mount app-cfg ở /etc/app.\n", "hint": "valueFrom.configMapKeyRef, envFrom.configMapRef, volumes.configMap", "sol": "k config set-context --current --namespace=ck-cfg\nk create cm app-cfg --from-literal=MODE=dev --from-literal=LEVEL=info\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: cfg}\nspec:\n  containers:\n    - name: cfg\n      image: busybox:1.36\n      command: [\"sleep\", \"3600\"]\n      env:\n        - name: APP_MODE\n          valueFrom: {configMapKeyRef: {name: app-cfg, key: MODE}}\n      envFrom: [{configMapRef: {name: app-cfg}}]\n      volumeMounts: [{name: cfg, mountPath: /etc/app}]\n  volumes: [{name: cfg, configMap: {name: app-cfg}}]\nEOF\nk wait --for=condition=Ready pod/cfg --timeout=60s\nk exec cfg -- sh -c 'echo $APP_MODE $LEVEL; cat /etc/app/MODE'\n", "check": "k wait -n ck-cfg --for=condition=Ready pod/cfg --timeout=60s >/dev/null\ntest \"$(k exec -n ck-cfg cfg -- sh -c 'echo $APP_MODE $LEVEL $(cat /etc/app/MODE)')\" = \"dev info dev\"\n", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/26-configmap"]]}, {"id": "e-secret", "d": "env", "tp": 5, "title": "Secret qua volume chỉ đọc và một biến môi trường", "ns": "ck-sec", "mins": 5, "task": "Namespace ck-sec. Tạo Secret db có username=admin, password=s3cr3t.\nPod db-client (busybox:1.36, sleep 3600) mount Secret ở /etc/db chỉ đọc và có biến DB_USER lấy từ khóa username.\nIn ra giá trị password đã giải mã bằng kubectl.\n", "hint": "k create secret generic --from-literal; jsonpath .data.password | base64 -d", "sol": "k config set-context --current --namespace=ck-sec\nk create secret generic db --from-literal=username=admin --from-literal=password=s3cr3t\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: db-client}\nspec:\n  containers:\n    - name: c\n      image: busybox:1.36\n      command: [\"sleep\", \"3600\"]\n      env:\n        - name: DB_USER\n          valueFrom: {secretKeyRef: {name: db, key: username}}\n      volumeMounts: [{name: db, mountPath: /etc/db, readOnly: true}]\n  volumes: [{name: db, secret: {secretName: db}}]\nEOF\nk get secret db -o jsonpath='{.data.password}' | base64 -d; echo\n", "check": "k wait -n ck-sec --for=condition=Ready pod/db-client --timeout=60s >/dev/null\ntest \"$(k exec -n ck-sec db-client -- sh -c 'echo $DB_USER $(cat /etc/db/password)')\" = \"admin s3cr3t\"\ntest \"$(k get pod db-client -n ck-sec -o jsonpath='{.spec.containers[0].volumeMounts[0].readOnly}')\" = \"true\"\n", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/27-secret"]]}, {"id": "e-tls", "d": "env", "tp": 5, "title": "Secret kiểu TLS từ cặp file", "ns": "ck-sec", "mins": 4, "task": "Tạo khóa và chứng chỉ tự ký cho shop.lab bằng openssl (hạn 30 ngày), rồi tạo Secret shop-tls kiểu kubernetes.io/tls trong ck-sec.\n", "hint": "openssl req -x509 -newkey rsa:2048 -nodes; k create secret tls --cert --key", "sol": "openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj \"/CN=shop.lab\" -keyout /tmp/tls.key -out /tmp/tls.crt\nk create secret tls shop-tls -n ck-sec --cert=/tmp/tls.crt --key=/tmp/tls.key\nk get secret shop-tls -n ck-sec -o jsonpath='{.type}'\n", "check": "test \"$(k get secret shop-tls -n ck-sec -o jsonpath='{.type}')\" = \"kubernetes.io/tls\"\nk get secret shop-tls -n ck-sec -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -subject | grep -q shop.lab\n", "src": [["dgk", "d.configuration.md"], ["k8sdocs", "content/en/docs/concepts/configuration/secret.md"]]}, {"id": "e-secctx", "d": "env", "tp": 7, "title": "SecurityContext không root, không leo quyền", "ns": "ck-secctx", "mins": 6, "task": "Namespace ck-secctx. Pod secure (busybox:1.36, sleep 3600) chạy với user 1000, group 3000, fsGroup 2000, runAsNonRoot.\nContainer không được leo quyền, root filesystem chỉ đọc, bỏ mọi capability.\nMount emptyDir ở /tmp để vẫn ghi được file tạm.\n", "hint": "runAsUser, runAsGroup, fsGroup, runAsNonRoot ở cấp Pod; allowPrivilegeEscalation, readOnlyRootFilesystem, capabilities ở cấp container", "sol": "k config set-context --current --namespace=ck-secctx\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: secure}\nspec:\n  securityContext: {runAsUser: 1000, runAsGroup: 3000, fsGroup: 2000, runAsNonRoot: true}\n  containers:\n    - name: app\n      image: busybox:1.36\n      command: [\"sleep\", \"3600\"]\n      securityContext:\n        allowPrivilegeEscalation: false\n        readOnlyRootFilesystem: true\n        capabilities: {drop: [ALL]}\n      volumeMounts: [{name: tmp, mountPath: /tmp}]\n  volumes: [{name: tmp, emptyDir: {}}]\nEOF\nk wait --for=condition=Ready pod/secure --timeout=60s\nk exec secure -- id                         # uid=1000 gid=3000 groups=2000,3000\nk exec secure -- touch /x || echo \"root fs chỉ đọc: đúng\"\nk exec secure -- touch /tmp/ok && echo \"/tmp ghi được\"\n", "check": "k wait -n ck-secctx --for=condition=Ready pod/secure --timeout=60s >/dev/null\nk exec -n ck-secctx secure -- id | grep -q 'uid=1000 gid=3000'\n! k exec -n ck-secctx secure -- touch /x 2>/dev/null\nk exec -n ck-secctx secure -- touch /tmp/ok\n", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/28-securitycontext"], ["bmg", "ch20"]]}, {"id": "e-sa", "d": "env", "tp": 6, "title": "ServiceAccount riêng, chỉ được đọc Pod", "ns": "ck-rbac", "mins": 6, "task": "Namespace ck-rbac. Tạo ServiceAccount reader, Role pod-reader (get, list, watch pods) và RoleBinding gắn hai thứ đó.\nTạo Pod viewer (busybox:1.36, sleep 3600) dùng SA reader. Xác nhận SA đọc được Pod nhưng không xóa được.\n", "hint": "k create sa/role/rolebinding --serviceaccount=ck-rbac:reader; k auth can-i --as=system:serviceaccount:…", "sol": "k config set-context --current --namespace=ck-rbac\nk create sa reader\nk create role pod-reader --verb=get,list,watch --resource=pods\nk create rolebinding reader --role=pod-reader --serviceaccount=ck-rbac:reader\nk run viewer --image=busybox:1.36 --overrides='{\"spec\":{\"serviceAccountName\":\"reader\"}}' -- sleep 3600\nk auth can-i list pods --as=system:serviceaccount:ck-rbac:reader      # yes\nk auth can-i delete pods --as=system:serviceaccount:ck-rbac:reader || true   # no (mã thoát 1)\n", "check": "test \"$(k auth can-i list pods -n ck-rbac --as=system:serviceaccount:ck-rbac:reader)\" = \"yes\"\ntest \"$(k auth can-i delete pods -n ck-rbac --as=system:serviceaccount:ck-rbac:reader)\" = \"no\"\ntest \"$(k get pod viewer -n ck-rbac -o jsonpath='{.spec.serviceAccountName}')\" = \"reader\"\n", "src": [["bmc", "exercises/22-rbac-serviceaccount"], ["bmg", "ch17"], ["dgk", "d.configuration.md"]]}, {"id": "e-token", "d": "env", "tp": 6, "title": "Tắt token tự gắn và xin token có hạn", "ns": "ck-rbac", "mins": 3, "task": "Namespace ck-rbac. Tạo ServiceAccount batch với automountServiceAccountToken: false.\nXin một token cho batch có hạn 10 phút và lưu vào /opt/batch.token.\n", "hint": "k patch sa; k create token --duration", "sol": "k create sa batch -n ck-rbac\nk patch sa batch -n ck-rbac -p '{\"automountServiceAccountToken\":false}'\nk create token batch -n ck-rbac --duration=10m > /opt/batch.token\ncut -d. -f2 /opt/batch.token | tr '_-' '/+' | base64 -d 2>/dev/null | head -c 200; echo\n", "check": "test \"$(k get sa batch -n ck-rbac -o jsonpath='{.automountServiceAccountToken}')\" = \"false\"\ntest \"$(cut -d. -f1 /opt/batch.token | cut -c1-3)\" = \"eyJ\"\n", "src": [["dgk", "d.configuration.md"]]}, {"id": "e-resources", "d": "env", "tp": 3, "title": "Requests, limits và lớp QoS", "ns": "ck-res", "mins": 4, "task": "Namespace ck-res. Tạo Pod g (nginx:1.27) có QoS Guaranteed với 100m CPU, 128Mi RAM\nvà Pod b (nginx:1.27) có QoS Burstable: requests 50m/64Mi, limits memory 256Mi.\n", "hint": "Guaranteed: mọi container requests = limits cho cả CPU và RAM", "sol": "k config set-context --current --namespace=ck-res\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: g}\nspec:\n  containers:\n    - name: g\n      image: nginx:1.27\n      resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 100m, memory: 128Mi}}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: b}\nspec:\n  containers:\n    - name: b\n      image: nginx:1.27\n      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}\nEOF\nk get pod -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass\n", "check": "test \"$(k get pod g -n ck-res -o jsonpath='{.status.qosClass}')\" = \"Guaranteed\"\ntest \"$(k get pod b -n ck-res -o jsonpath='{.status.qosClass}')\" = \"Burstable\"\n", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/23-resource-requests-limits"]]}, {"id": "e-quota", "d": "env", "tp": 2, "title": "ResourceQuota chặn Pod quá tay", "ns": "ck-quota", "mins": 5, "task": "Namespace ck-quota. Tạo ResourceQuota team với requests.cpu=1, requests.memory=1Gi, limits.cpu=2, limits.memory=2Gi, pods=3.\nThử tạo Pod big xin requests cpu=2 (sẽ bị từ chối), rồi tạo Pod small (nginx:1.27) requests 500m/512Mi, limits 1/1Gi.\n", "hint": "k create quota --hard=…; k describe quota xem Used/Hard", "sol": "k config set-context --current --namespace=ck-quota\nk create quota team --hard=requests.cpu=1,requests.memory=1Gi,limits.cpu=2,limits.memory=2Gi,pods=3\npod() {   # $1 tên, $2 req cpu, $3 req mem, $4 lim cpu, $5 lim mem\ncat <<EOF | k apply -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: $1}\nspec:\n  containers:\n    - name: $1\n      image: nginx:1.27\n      resources: {requests: {cpu: \"$2\", memory: $3}, limits: {cpu: \"$4\", memory: $5}}\nEOF\n}\npod big 2 1Gi 3 2Gi || echo \"bị từ chối: exceeded quota\"\npod small 500m 512Mi 1 1Gi\nk describe quota team\n", "check": "! k get pod big -n ck-quota >/dev/null 2>&1\nk get pod small -n ck-quota >/dev/null\ntest \"$(k get quota team -n ck-quota -o jsonpath='{.status.used.requests\\.cpu}')\" = \"500m\"\n", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/24-resourcequota"]]}, {"id": "e-limitrange", "d": "env", "tp": 2, "title": "LimitRange tự điền requests", "ns": "ck-lr", "mins": 4, "task": "Namespace ck-lr. Tạo LimitRange defaults cho Container: defaultRequest cpu 100m / memory 128Mi,\ndefault (limit) cpu 200m / memory 256Mi, max memory 512Mi. Tạo Pod plain (nginx:1.27) không khai resources\nvà xác nhận nó nhận giá trị mặc định.\n", "hint": "LimitRange không có lệnh create: viết YAML; xem kết quả trong spec của Pod", "sol": "k config set-context --current --namespace=ck-lr\ncat <<'EOF' | k apply -f -\napiVersion: v1\nkind: LimitRange\nmetadata: {name: defaults}\nspec:\n  limits:\n    - type: Container\n      defaultRequest: {cpu: 100m, memory: 128Mi}\n      default: {cpu: 200m, memory: 256Mi}\n      max: {memory: 512Mi}\nEOF\nk run plain --image=nginx:1.27\nk get pod plain -o jsonpath='{.spec.containers[0].resources}'\n", "check": "test \"$(k get pod plain -n ck-lr -o jsonpath='{.spec.containers[0].resources.requests.cpu}|{.spec.containers[0].resources.limits.memory}')\" = \"100m|256Mi\"\n", "src": [["dgk", "d.configuration.md"], ["bmc", "exercises/25-limitrange"]]}, {"id": "e-crd", "d": "env", "tp": 0, "title": "Dùng CustomResourceDefinition", "ns": "ck-crd", "mins": 6, "task": "Tạo CRD backups.stable.example.com (kind Backup, scope Namespaced, version v1, spec có schedule: string, target: string, cả hai bắt buộc).\nTạo object nightly trong ck-crd với schedule \"0 2 * * *\", target db, rồi liệt kê bằng kubectl.\n", "hint": "openAPIV3Schema bắt buộc; k api-resources --api-group=stable.example.com; k explain backup.spec", "sol": "cat <<'EOF' | k apply -f -\napiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata: {name: backups.stable.example.com}\nspec:\n  group: stable.example.com\n  scope: Namespaced\n  names: {plural: backups, singular: backup, kind: Backup, shortNames: [bk]}\n  versions:\n    - name: v1\n      served: true\n      storage: true\n      schema:\n        openAPIV3Schema:\n          type: object\n          properties:\n            spec:\n              type: object\n              required: [schedule, target]\n              properties:\n                schedule: {type: string}\n                target: {type: string}\nEOF\nk wait --for=condition=Established crd/backups.stable.example.com\ncat <<'EOF' | k apply -n ck-crd -f -\napiVersion: stable.example.com/v1\nkind: Backup\nmetadata: {name: nightly}\nspec: {schedule: \"0 2 * * *\", target: db}\nEOF\nk get bk -n ck-crd; k explain backup.spec\n", "check": "test \"$(k get backup nightly -n ck-crd -o jsonpath='{.spec.target}')\" = \"db\"\n! printf 'apiVersion: stable.example.com/v1\\nkind: Backup\\nmetadata: {name: bad}\\nspec: {target: x}\\n' | k apply -n ck-crd --dry-run=server -f - >/dev/null 2>&1\n", "cleanup": "k delete crd backups.stable.example.com --wait=false", "src": [["dgk", "i.crd.md"], ["bmc", "exercises/21-crd"], ["bmg", "ch16"]]}, {"id": "e-psa", "d": "env", "tp": 1, "title": "Admission Pod Security: làm Pod hợp lệ với restricted", "ns": "ck-psa", "mins": 6, "task": "Gắn label pod-security.kubernetes.io/enforce=restricted cho namespace ck-psa.\nTạo Pod hardened (busybox:1.36, sleep 3600) được admission chấp nhận.\n", "hint": "Thiếu trường nào thì thông báo lỗi liệt kê đúng trường đó: thử --dry-run=server", "sol": "k label ns ck-psa pod-security.kubernetes.io/enforce=restricted --overwrite\nk run test --image=busybox:1.36 -n ck-psa --dry-run=server -- sleep 3600 || true   # đọc danh sách trường thiếu\ncat <<'EOF' | k apply -n ck-psa -f -\napiVersion: v1\nkind: Pod\nmetadata: {name: hardened}\nspec:\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 1000\n    seccompProfile: {type: RuntimeDefault}\n  containers:\n    - name: app\n      image: busybox:1.36\n      command: [\"sleep\", \"3600\"]\n      securityContext:\n        allowPrivilegeEscalation: false\n        capabilities: {drop: [ALL]}\nEOF\n", "check": "test \"$(k get ns ck-psa -o jsonpath='{.metadata.labels.pod-security\\.kubernetes\\.io/enforce}')\" = \"restricted\"\nk get pod hardened -n ck-psa >/dev/null\n", "src": [["bmg", "ch17"], ["k8sdocs", "content/en/docs/concepts/security/pod-security-admission.md"]]}, {"id": "n-expose", "d": "net", "tp": 1, "title": "Expose Deployment và gọi thử từ Pod tạm", "ns": "ck-svc", "mins": 4, "task": "Namespace ck-svc. Deployment echo (nginx:1.27, 3 replicas). Tạo Service ClusterIP echo cổng 8080 trỏ về cổng 80 của Pod,\nrồi dùng một Pod busybox tạm (tự xóa) gọi http://echo:8080.\n", "hint": "k expose --port --target-port; k run tmp --rm -it --restart=Never --image=busybox:1.36 -- wget -qO- …", "sol": "k config set-context --current --namespace=ck-svc\nk create deploy echo --image=nginx:1.27 --replicas=3\nk expose deploy echo --port=8080 --target-port=80\nk rollout status deploy/echo\nk run tmp --rm -i --restart=Never --image=busybox:1.36 -- wget -qO- -T 5 http://echo:8080 | head -4\n", "check": "k rollout status deploy/echo -n ck-svc --timeout=120s >/dev/null\ntest \"$(k get svc echo -n ck-svc -o jsonpath='{.spec.ports[0].port}/{.spec.ports[0].targetPort}')\" = \"8080/80\"\nk run tmp-check -n ck-svc --rm -i --restart=Never --image=busybox:1.36 -- wget -qO- -T 5 http://echo:8080 | grep -q nginx\n", "src": [["dgk", "f.services.md"], ["bmc", "exercises/29-service"]]}, {"id": "n-nodeport", "d": "net", "tp": 1, "title": "NodePort cố định", "ns": "ck-svc", "mins": 3, "task": "Namespace ck-svc. Tạo Service web-np kiểu NodePort cho Deployment echo, port 80, nodePort 30080.\n", "hint": "k expose --type=NodePort rồi patch nodePort, hoặc k create svc nodeport --  2, "title": "Ingress định tuyến theo host và path", "ns": "ck-ing", "mins": 6, "task": "Namespace ck-ing có Service app (cổng 80) và api (cổng 8080). Tạo Ingress shop với ingressClassName traefik\n(trong đề sẽ cho tên class), host shop.lab: /app* tới app:80, /api* tới api:8080.\n", "hint": "k create ingress --class --rule='host/path*=svc:port' (dấu * nghĩa là pathType Prefix)", "setup": "k create svc clusterip app -n ck-ing --tcp=80:80\nk create svc clusterip api -n ck-ing --tcp=8080:8080\n", "sol": "k create ingress shop -n ck-ing --class=traefik \\\n  --rule='shop.lab/app*=app:80' --rule='shop.lab/api*=api:8080'\nk describe ingress shop -n ck-ing\n", "check": "test \"$(k get ingress shop -n ck-ing -o jsonpath='{.spec.ingressClassName}|{.spec.rules[0].host}|{.spec.rules[0].http.paths[1].path}|{.spec.rules[0].http.paths[1].pathType}|{.spec.rules[0].http.paths[1].backend.service.port.number}')\" = \"traefik|shop.lab|/api|Prefix|8080\"\n", "src": [["dgk", "f.services.md"], ["bmc", "exercises/31-ingress"], ["bmg", "ch22"]]}, {"id": "n-netpol", "d": "net", "tp": 0, "title": "NetworkPolicy chỉ cho Pod có nhãn truy cập database", "ns": "ck-np", "mins": 7, "task": "Namespace ck-np. Pod db (nginx:1.27, label app=db). Tạo NetworkPolicy db-allow: Pod db chỉ nhận kết nối cổng 80\ntừ Pod có label access=granted trong cùng namespace. Kiểm tra bằng hai Pod busybox tạm, một có nhãn, một không.\n", "hint": "podSelector chọn Pod được bảo vệ; ingress.from.podSelector chọn Pod được phép; policyTypes [Ingress]", "sol": "k config set-context --current --namespace=ck-np\nk run db --image=nginx:1.27 -l app=db --port=80\ncat <<'EOF' | k apply -f -\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: db-allow}\nspec:\n  podSelector: {matchLabels: {app: db}}\n  policyTypes: [Ingress]\n  ingress:\n    - from: [{podSelector: {matchLabels: {access: granted}}}]\n      ports: [{protocol: TCP, port: 80}]\nEOF\nk wait --for=condition=Ready pod/db --timeout=60s\nIP=$(k get pod d function mockNew() {
  const pick = [];
  Object.entries(MOCK_N).forEach(([d, n]) => { const pool = EX.filter(e => e.d === d).sort(() => Math.random() - .5); pick.push(...pool.slice(0, n).map(e => e.id)); });
  store.set("mock", { ids: pick, start: Date.now(), res: {}, end: 0 }); mockRender();
}
function mockScore(m) {
  const tot = m.ids.reduce((a, id) => a + EX.find(e => e.id === id).mins, 0);
  const got = m.ids.filter(id => m.res[id] === "pass").reduce((a, id) => a + EX.find(e => e.id === id).mins, 0);
  return Math.round(got / tot * 100);
}
function mockRender() {
  const box = $("#mockBox"), m = mockState();
  clearInterval(mockTimer);
  if (!m) { box.innerHTML = '<div class="panel col">' + tl(["Phân bổ: Build 3 · Deploy 3 · Observability 2 · Environment 4 · Networking 3.", "Điểm mỗi task tính theo số phút ước tính; đậu từ <b>66%</b> như đề thật.", "Lời giải ẩn tới khi bấm, nên tự kiểm tra trước bằng lệnh check."]) + '<div class="controls"><button class="btn primary" type="button" id="mockGo">▶ Bắt đầu đề mới</button></div></div>'; $("#mockGo").onclick = mockNew; return; }
  const finished = !!m.end;
  const score = mockScore(m);
  let h = '<div class="ck-mock-top"><div><span class="small muted">Còn lại</span><div class="ck-clock" id="mockClock">--:--</div></div><div><span class="small muted">Điểm tự chấm</span><div class="ck-clock">' + score + "%</div></div>" +
    '<div class="controls" style="margin:0">' + (finished ? "" : '<button class="btn primary" type="button" id="mockEnd">Nộp bài</button>') + '<button class="btn" type="button" id="mockNew">Đề mới</button></div></div>';
  if (finished) {
    const per = D.map(d => { const ids = m.ids.filter(id => EX.find(e => e.id === id).d === d.id); return [d, ids.filter(id => m.res[id] === "pass").length, ids.length]; });
    h += '<div class="panel col"><div class="ck-score" style="color:' + (score >= 66 ? "var(--node)" : "var(--bad)") + '">' + score + "% · " + (score >= 66 ? "Đậu" : "Chưa đậu") + "</div>" +
      per.map(([d, a, b]) => '<div class="ck-bar" style="cursor:default"><span class="lab"><b>' + esc(d.vi) + '</b><span class="track"><i style="width:' + (b ? a / b * 100 : 0) + "%;background:" + DCOL[d.id] + '"></i></span></span><span class="w">' + a + "/" + b + '</span><span class="m"></span></div>').join("") + "</div>";
  }
  h += m.ids.map((id, i) => {
    const e = EX.find(x => x.id === id), r = m.res[id];
    return '<div class="ck-mtask' + (r ? " " + r : "") + '"><div class="hd"><span class="ck-dom dom-' + e.d + '">' + (i + 1) + "</span><b>" + esc(e.title) + '</b><span class="mins small muted">' + e.mins + " điểm</span></div>" +
      '<div class="task" style="white-space:pre-line;font-size:14px">' + esc(e.task.trim()) + "</div>" + det("Lệnh kiểm tra", code(e.check)) + det("Lời giải", code(e.sol)) +
      '<div class="controls" style="margin:0"><button class="btn" type="button" data-mr="pass" data-id="' + id + '"' + (r === "pass" ? ' aria-pressed="true"' : "") + ">✓ Đạt</button><button class=\"btn\" type=\"button\" data-mr=\"fail\" data-id=\"" + id + '"' + (r === "fail" ? ' aria-pressed="true"' : "") + ">✕ Chưa đạt</button></div></div>";
  }).join("");
  box.innerHTML = h; addCopies(box);
  const tick = () => { const left = Math.max(0, 7200 - Math.floor(((m.end || Date.now()) - m.start) / 1000)); const c = $("#mockClock"); if (!c) return; c.textContent = String(Math.floor(left / 3600)) + ":" + String(Math.floor(left % 3600 / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0"); c.classList.toggle("low", left < 900); if (!left && !m.end) { m.end = Date.now(); store.set("mock", m); mockRender(); } };
  tick(); if (!finished) mockTimer = setInterval(tick, 1000);
  box.onclick = e => {
    const b = e.target.closest("[data-mr]"); if (b) { const s = mockState(); s.res[b.dataset.id] = b.dataset.mr; store.set("mock", s); mockRender(); return; }
    if (e.target.closest("#mockEnd")) { const s = mockState(); s.end = Date.now(); store.set("mock", s); mockRender(); }
    if (e.target.closest("#mockNew")) { if (!m.end && !confirm("Bỏ đề đang làm và tạo đề mới?")) return; mockNew(); }
  };
}
AFTER.mock = ON.mock = () => mockRender();

/* ---------- mẹo ---------- */
RENDER.tips = () => '<header class="vh"><p class="eyebrow">Tra cứu</p><h2>Mẹo làm bài CKAD</h2><p class="lead">Ít gõ YAML tay, đúng namespace, kiểm tra lại trước khi sang task khác.</p></header>' +
  '<div class="panel col">' + tl(["Mỗi task: đọc ô thông tin, <b>ssh</b> đúng máy, làm xong thì <b>exit</b> (không ssh lồng nhau).", "Sinh YAML bằng lệnh, chỉ sửa phần còn thiếu: nhanh và ít lỗi thụt dòng.", "Sai tên, sai namespace, sai đường dẫn file là mất trọn điểm task."]) + "</div>" +
  '<div class="panel col"><h4>30 giây đầu giờ</h4>' + code(`# máy thi đã có alias k và tự hoàn thành lệnh
export do="--dry-run=client -o yaml"     # k run web --image=nginx:1.27 $do > web.yaml
export now="--force --grace-period=0"    # k delete pod web $now
echo 'set expandtab tabstop=2 shiftwidth=2' >> ~/.vimrc`) + "</div>" +
  '<div class="panel col"><h4>Lệnh sinh YAML nhanh</h4><div class="tbl ck-cheat"><table><thead><tr><th>Cần</th><th>Lệnh</th></tr></thead><tbody>' + [
    ["Pod", "k run web --image=nginx:1.27 --port=80 -l app=web $do"], ["Pod chạy lệnh", "k run t --image=busybox:1.36 $do -- sh -c 'sleep 3600'"], ["Deployment", "k create deploy web --image=nginx:1.27 --replicas=3 $do"],
    ["Job", "k create job calc --image=busybox:1.36 $do -- sh -c 'echo hi'"], ["CronJob", "k create cronjob r --image=busybox:1.36 --schedule='*/5 * * * *' $do -- date"], ["Job từ CronJob", "k create job r-now --from=cronjob/r"],
    ["Service", "k expose deploy web --port=80 --target-port=8080 [--type=NodePort]"], ["Ingress", "k create ingress web --class=nginx --rule='web.lab/*=web:80'"], ["ConfigMap", "k create cm cfg --from-literal=A=1 --from-file=app.conf"],
    ["Secret", "k create secret generic db --from-literal=pass=x"], ["ServiceAccount, token", "k create sa app; k create token app"], ["Role, RoleBinding", "k create role r --verb=get,list --resource=pods; k create rolebinding rb --role=r --serviceaccount=ns:app"],
    ["ResourceQuota", "k create quota q --hard=pods=5,requests.cpu=1"], ["HPA", "k autoscale deploy web --min=2 --max=6 --cpu=70%"], ["Đổi image, resources, env", "k set image | k set resources | k set env deploy/web"]
  ].map(r => "<tr><td><b>" + esc(r[0]) + "</b></td><td><code>" + esc(r[1]) + "</code></td></tr>").join("") + "</tbody></table></div></div>" +
  '<div class="panel col"><h4>Tra trường YAML không cần mở web</h4>' + code(`k explain pod.spec.containers.securityContext
k explain deploy.spec.strategy --recursive
k api-resources | grep -i cronjob        # tên ngắn, apiVersion, namespaced?`) + "</div>" +
  '<div class="panel col"><h4>Tài liệu được mở trong lúc thi</h4><ul class="tight"><li><a href="https://kubernetes.io/docs" target="_blank" rel="noopener">kubernetes.io/docs</a> và <a href="https://kubernetes.io/blog/" target="_blank" rel="noopener">kubernetes.io/blog</a></li><li><a href="https://helm.sh/docs" target="_blank" rel="noopener">helm.sh/docs</a></li><li>Tài liệu riêng được dẫn trong ô Quick Reference của từng task</li></ul><p class="small muted" style="margin:0">Theo <a href="https://docs.linuxfoundation.org/tc-docs/certification/certification-resources-allowed" target="_blank" rel="noopener">Linux Foundation: Resources Allowed</a>. Gateway API docs chỉ dành cho CKA.</p></div>' +
  '<div class="panel col"><h4>Chia thời gian</h4><ul class="tight"><li>Khoảng 6–8 phút mỗi task. Task dễ, điểm cao làm trước; task kẹt quá 10 phút thì đánh dấu và quay lại.</li><li>Pod đang chạy hầu như không sửa được spec: <code>k get pod x -o yaml > x.yaml</code>, sửa, <code>k replace --force -f x.yaml</code>.</li><li>Trước khi sang task: <code>k get</code> lại object, đúng tên, đúng namespace, file lưu đúng chỗ đề hỏi.</li></ul></div>';

/* ---------- nguồn ---------- */

  return '<header class="vh"><p class="eyebrow">Tra cứu</p><h2>Nguồn tham khảo</h2><p class="lead">Chỉ dùng repo chính thức hoặc được cộng đồng dùng rộng rãi. Bài tập được viết lại bằng tiếng Việt, không chép nguyên văn.</p></header>' +
    '<div class="panel col">' + tl(["<b>Danh sách domain và tỉ trọng</b> lấy từ curriculum chính thức của CNCF.", "<b>Lời giải</b> được chạy thử tự động trên cluster k3s v1.34 bằng <code>tools/check_ckad.py</code>, trừ bài cần podman hoặc Helm.", "Mỗi mục và mỗi bài ghi rõ repo đã gợi ý chủ đề đó."]) + "</div>" +
    '<div class="ck-topics">' + Object.entries(SRC).map(([k, s]) => '<article class="ck-topic"><a href="' + esc(s.url) + '" target="_blank" rel="noopener" class="vi">' + esc(s.name) + " ↗</a><span>" + esc(s.note) + '</span><div class="ck-links"><span class="ck-badge no">' + esc(s.license) + "</span>" + (cnt(k) ? '<span class="ck-badge ok">dẫn ở ' + cnt(k) + " chỗ</span>" : "") + "</div></article>").join("") + "</div>";
};
