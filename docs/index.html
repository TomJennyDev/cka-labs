g dẫn HTML có đồng hồ đếm ngược.<\/p>", "tasks": ["<p><strong>(4%)<\/strong> Tạo namespace <code>mock-x<\/code> có label <code>env=exam<\/code>.<\/p>", "<p><strong>(8%)<\/strong> Trong <code>mock-a<\/code>, tạo Deployment <code>frontend<\/code>: 3 replica, <code>nginx:1.27<\/code>, request CPU <code>100m<\/code>, rolling update <code>maxSurge: 1<\/code>, <code>maxUnavailable: 0<\/code>. Sau đó nâng lên <code>nginx:1.28<\/code> với change-cause <code>exam upgrade<\/code>.<\/p>", "<p><strong>(5%)<\/strong> Trong <code>mock-a<\/code>, tạo ConfigMap <code>exam-cfg<\/code> (<code>LEVEL=hard<\/code>) và Secret <code>exam-sec<\/code> (<code>token=abc123<\/code>). Tạo Pod <code>cfg-pod<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có biến <code>LEVEL<\/code> từ ConfigMap và <code>TOKEN<\/code> từ key <code>token<\/code> của Secret.<\/p>", "<p><strong>(6%)<\/strong> Tạo HPA cho <code>frontend<\/code>: 3 tới 6 replica, CPU mục tiêu 60%.<\/p>", "<p><strong>(6%)<\/strong> <code>$NODE2<\/code> có label <code>exam-role=gpu<\/code> và taint <code>exam=true:NoSchedule<\/code>. Tạo Pod <code>gpu-pod<\/code> (<code>nginx:1.27<\/code>) trong <code>mock-a<\/code> chạy trên đúng node đó.<\/p>", "<p><strong>(5%)<\/strong> Tạo Pod <code>logger<\/code> trong <code>mock-a<\/code>: container <code>app<\/code> (<code>busybox:1.36<\/code>) ghi <code>tick<\/code> vào <code>/var/log/app.log<\/code> mỗi 2 giây; sidecar kiểu native tên <code>tail<\/code> (<code>busybox:1.36<\/code>) chạy <code>tail -F /var/log/app.log<\/code>. Hai container dùng chung emptyDir.<\/p>", "<p><strong>(6%)<\/strong> Tạo Service <code>frontend-np<\/code> kiểu NodePort cho <code>frontend<\/code>, cổng 80, nodePort <code>30090<\/code>.<\/p>", "<p><strong>(8%)<\/strong> Trong <code>mock-b<\/code>, tạo NetworkPolicy <code>db-access<\/code>: Pod <code>app=db<\/code> chỉ nhận TCP 80 từ Pod <code>app=api<\/code> <strong>trong namespace <code>mock-a<\/code><\/strong>.<\/p>", "<p><strong>(5%)<\/strong> Tạo Ingress <code>frontend<\/code> trong <code>mock-a<\/code>: host <code>exam.local<\/code>, path <code>/<\/code> (Prefix) tới <code>frontend-np:80<\/code>.<\/p>", "<p><strong>(6%)<\/strong> Tạo PVC <code>exam-data<\/code> (1Gi, RWO, StorageClass mặc định) trong <code>mock-a<\/code> và Pod <code>writer<\/code> (<code>busybox:1.36<\/code>) gắn nó tại <code>/data<\/code>, ghi file <code>/data/ok<\/code> rồi <code>sleep 3600<\/code>.<\/p>", "<p><strong>(6%)<\/strong> Tạo ServiceAccount <code>ci<\/code> trong <code>mock-a<\/code>, chỉ được <code>create<\/code> Deployment và <code>get, list<\/code> Pod trong <code>mock-a<\/code>.<\/p>", "<p><strong>(6%)<\/strong> Tạo static pod <code>exam-static<\/code> (<code>nginx:1.27<\/code>) trên <code>$NODE1<\/code>.<\/p>", "<p><strong>(10%)<\/strong> Deployment <code>broken-api<\/code> trong <code>mock-c<\/code> không có Pod nào sẵn sàng. Sửa để 2/2 sẵn sàng, giữ readinessProbe.<\/p>", "<p><strong>(8%)<\/strong> Service <code>backend<\/code> trong <code>mock-c<\/code> không có endpoint. Sửa để gọi <code>http://backend.mock-c<\/code> được (không sửa Deployment <code>backend<\/code>).<\/p>", "<p><strong>(6%)<\/strong> Ghi vào <code>~/cka-answers/38-nodes.txt<\/code> mỗi node một dòng dạng <code>&lt;tên&gt; &lt;phiên bản kubelet&gt;<\/code>, sắp theo tên.<\/p>", "<p><strong>(5%)<\/strong> Tạo PriorityClass <code>exam-high<\/code> (value <code>100000<\/code>) và Pod <code>vip<\/code> (<code>nginx:1.27<\/code>) trong <code>mock-a<\/code> dùng nó.<\/p>"], "hints": [["Câu 8: AND giữa namespace và Pod", "<p><code>namespaceSelector<\/code> và <code>podSelector<\/code> nằm <strong>cùng một<\/strong> phần tử của <code>from<\/code>.<\/p>"], ["Câu 13 có hai lỗi", "<p>Một lỗi làm Pod không chạy, một lỗi làm Pod chạy mà không Ready.<\/p>"]], "solution": "<pre><code class=\"language-bash\">eval &quot;$(./lab env)&quot;\n# 1\nkubectl create ns mock-x &amp;&amp; kubectl label ns mock-x env=exam\n# 2\nkubectl create deploy frontend -n mock-a --image=nginx:1.27 --replicas=3\nkubectl set resources deploy frontend -n mock-a --requests=cpu=100m\nkubectl patch deploy frontend -n mock-a -p '{&quot;spec&quot;:{&quot;strategy&quot;:{&quot;rollingUpdate&quot;:{&quot;maxSurge&quot;:1,&quot;maxUnavailable&quot;:0}}}}'\nkubectl set image deploy/frontend -n mock-a nginx=nginx:1.28\nkubectl annotate deploy/frontend -n mock-a kubernetes.io/change-cause='exam upgrade' --overwrite\n# 3\nkubectl create cm exam-cfg -n mock-a --from-literal=LEVEL=hard\nkubectl create secret generic exam-sec -n mock-a --from-literal=token=abc123\n#   cfg-pod: env LEVEL ← configMapKeyRef exam-cfg/LEVEL, TOKEN ← secretKeyRef exam-sec/token\n# 4\nkubectl autoscale deploy frontend -n mock-a --min=3 --max=6 --cpu-percent=60\n# 5  gpu-pod: tolerations exam=true:NoSchedule + nodeSelector exam-role: gpu\n# 6  logger: initContainers[tail] restartPolicy: Always, emptyDir chung tại /var/log\n# 7\nkubectl expose deploy frontend -n mock-a --name=frontend-np --type=NodePort --port=80 $do &gt; np.yaml  # thêm nodePort: 30090\n# 8  NetworkPolicy: podSelector app=db; from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mock-a}}, podSelector: {matchLabels: {app: api}}}]\n# 9\nkubectl create ingress frontend -n mock-a --rule=&quot;exam.local/*=frontend-np:80&quot;\n# 10 PVC exam-data + Pod writer\n# 11\nkubectl create sa ci -n mock-a\nkubectl create role ci -n mock-a --verb=create --resource=deployments\nkubectl edit role ci -n mock-a       # thêm rule get,list cho pods\nkubectl create rolebinding ci -n mock-a --role=ci --serviceaccount=mock-a:ci\n# 12 static pod: file YAML vào staticPodPath của $NODE1\n# 13\nkubectl describe pod -n mock-c -l app=broken-api    # image sai + readiness port 8080\nkubectl set image deploy/broken-api -n mock-c nginx=nginx:1.27\nkubectl patch deploy broken-api -n mock-c --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/readinessProbe/httpGet/port&quot;,&quot;value&quot;:80}]'\n# 14\nkubectl patch svc backend -n mock-c -p '{&quot;spec&quot;:{&quot;selector&quot;:{&quot;app&quot;:&quot;backend&quot;}}}'\n# 15\nkubectl get nodes --sort-by=.metadata.name -o jsonpath='{range .items[*]}{.metadata.name} {.status.nodeInfo.kubeletVersion}{&quot;\\n&quot;}{end}' &gt; ~/cka-answers/38-nodes.txt\n# 16\nkubectl create priorityclass exam-high --value=100000\n#   vip: spec.priorityClassName: exam-high\n<\/code><\/pre>\n<p>YAML đầy đủ của từng câu nằm trong <code>tests/solutions/38.sh<\/code> của repo.<\/p>", "docs": [["CKA curriculum", "https://github.com/cncf/curriculum"], ["Linux Foundation CKA", "https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/"], ["kubectl quick reference", "https://kubernetes.io/docs/reference/kubectl/quick-reference/"]]}]};

function wireLab(id) {
  const l = byId(id);
  const count = () => { const n = l.tasks.filter((_, i) => state.tasks[id + ":" + i]).length; $("#tcount").textContent = n + "/" + l.tasks.length + " đã làm"; };
  count();
  $$("[data-task]").forEach(c => c.onchange = () => { state.tasks[c.dataset.task] = c.checked; c.closest(".task").classList.toggle("done", c.checked); save(); count(); renderSide($("#q").value); });
  $("#solBtn").onclick = () => { const b = $("#solBody"), o = b.hidden; b.hidden = !o; $("#sol").dataset.open = o ? "1" : "0"; $("#solBtn").textContent = o ? "Ẩn lời giải" : "Tự làm xong rồi, xem lời giải"; };
  $("#doneBtn").onclick = () => { state.done[id] = !state.done[id]; save(); progress(); render(); };
  if (id === 38) timer();
}
function timer() {
  clearInterval(timerInt);
  const tick = () => {
    const end = store.get("examEnd", 0), el = $("#tLeft"); if (!el) return clearInterval(timerInt);
    let ms = end ? end - Date.now() : 120 * 60000;
    if (ms < 0) ms = 0;
    const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
    el.textContent = pad(m) + ":" + pad(s);
    $("#timer").classList.toggle("low", !!end && m < 15);
    $("#tStart").hidden = !!end;
    if (end && ms === 0) $("#tNote").textContent = "Hết giờ. Chạy ./lab check 38 để xem điểm.";
  };
  $("#tStart").onclick = () => { store.set("examEnd", Date.now() + 120 * 60000); tick(); };
  $("#tReset").onclick = () => { store.set("examEnd", 0); $("#tNote").textContent = "Đồng hồ chạy tiếp kể cả khi bạn đóng trang."; tick(); };
  tick(); timerInt = setInterval(tick, 1000);
}

function render() {
  const h = location.hash.slice(1) || "home";
  const m = h.match(/^lab-(\d+)$/);
  const main = $("#main");
  clearInterval(timerInt);
  if (m && byId(+m[1])) { main.innerHTML = lab(+m[1]); enhance(main); wireLab(+m[1]); document.title = "Lab " + m[1] + " · CKA Labs"; }
  else if (h === "setup") { main.innerHTML = setup(); enhance(main); document.title = "Môi trường · CKA Labs"; }
  else { main.innerHTML = home(); enhance(main); document.title = "CKA Labs"; }
  renderSide($("#q").value); progress();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); if (innerWidth < 1024) $("#side").classList.remove("open"); });
$("#q").addEventListener("input", e => { renderSide(e.target.value); if (e.target.value) $("#side").classList.add("open"); });
$("#sideToggle").onclick = () => { const s = $("#side"); s.classList.toggle("open"); $("#sideToggle").textContent = s.classList.contains("open") ? "Ẩn danh sách bài ▴" : "Hiện danh sách bài ▾"; };
render();
</script>

</body>
