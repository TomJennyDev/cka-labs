<html><body><script>const DATA={"levels": {"0": ["Chuẩn bị môi trường", "Dựng cluster lab và làm quen công cụ."], "1": ["Nền tảng kubectl", "Làm chủ kubectl, object, YAML và cách trích xuất dữ liệu."], "2": ["Workloads", "Deployment, cấu hình, probe, multi-container, Job, tài nguyên và autoscaling."], "3": ["Scheduling", "Điều khiển Pod chạy ở node nào, static pod, bảo trì node."], "4": ["Services & Networking", "Service, DNS, NetworkPolicy, Ingress và Gateway API."], "5": ["Storage", "Volume, PV/PVC, StorageClass và StatefulSet."], "6": ["Bảo mật", "RBAC, ServiceAccount, user và chứng chỉ, Pod Security."], "7": ["Vận hành cluster", "Helm, Kustomize, CRD, etcd, nâng cấp, chứng chỉ, HA."], "8": ["Troubleshooting", "Chẩn đoán và sửa ứng dụng, mạng, control plane và node."], "9": ["Thi thử", "Đề tổng hợp 2 giờ theo trọng số đề thi thật."]}, "domains": {"trouble": ["Troubleshooting", 30, ["Troubleshoot cluster và node", "Troubleshoot thành phần control plane", "Theo dõi tài nguyên cluster và ứng dụng", "Quản lý và đánh giá output, log của container", "Troubleshoot Service và networking"]], "arch": ["Cluster Architecture, Installation & Configuration", 25, ["Quản lý RBAC", "Chuẩn bị hạ tầng để cài cluster", "Tạo và quản lý cluster bằng kubeadm", "Quản lý vòng đời cluster (nâng cấp)", "Control plane high-availability", "Cài thành phần bằng Helm và Kustomize", "Interface mở rộng: CNI, CSI, CRI", "CRD, cài và cấu hình Operator"]], "net": ["Services & Networking", 20, ["Kết nối giữa các Pod", "NetworkPolicy", "Service ClusterIP, NodePort, LoadBalancer và endpoints", "Gateway API", "Ingress controller và Ingress", "CoreDNS"]], "work": ["Workloads & Scheduling", 15, ["Deployment, rolling update, rollback", "ConfigMap và Secret", "Autoscaling", "Primitive cho ứng dụng tự phục hồi", "Admission và scheduling của Pod"]], "stor": ["Storage", 10, ["StorageClass và dynamic provisioning", "Volume type, access mode, reclaim policy", "PersistentVolume và PersistentVolumeClaim"]]}, "env": {"any": "kind hoặc kubeadm", "kind": "kind hoặc kubeadm (cần vào node)", "vm": "kubeadm trên máy ảo"}, "labs": [{"id": 0, "slug": "lab-environment", "dir": "00-lab-environment", "title": "Dựng cluster lab và làm quen công cụ", "level": 0, "env": "any", "minutes": 30, "comps": [], "goal": "<p>Có một cluster 3 node (1 control plane, 2 worker) chạy Kubernetes v1.35 để làm mọi bài lab, cấu hình terminal giống phòng thi và biết cách dùng <code>./lab<\/code>.<\/p>", "concepts": "<ul>\n<li><strong>kind<\/strong> (Kubernetes in Docker) dựng mỗi node thành một container. Bên trong là kubeadm, kubelet chạy bằng systemd và control plane dạng static pod, giống hệt cluster thật. Gần như mọi lab chạy trên kind.<\/li>\n<li><strong>Cluster kubeadm trên máy ảo<\/strong> (thư mục <code>env/kubeadm<\/code>) chỉ cần cho các bài cài đặt, nâng cấp và HA (lab 01, 30, 32).<\/li>\n<li><code>./lab start &lt;id&gt;<\/code> dựng tình huống, <code>./lab check &lt;id&gt;<\/code> chấm bài, <code>./lab reset &lt;id&gt;<\/code> dọn dẹp.<\/li>\n<li>Một số bài yêu cầu ghi đáp án ra file. Thư mục đáp án mặc định là <code>~/cka-answers<\/code>; đổi bằng biến <code>CKA_ANSWERS<\/code>.<\/li>\n<li>Trong bài, <code>$CP<\/code>, <code>$NODE1<\/code>, <code>$NODE2<\/code> là tên node control plane và hai worker. Nạp chúng bằng <code>eval \"$(./lab env)\"<\/code>. Với kind, tên là <code>cka-control-plane<\/code>, <code>cka-worker<\/code>, <code>cka-worker2<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Cài Docker, <a href=\"https://kind.sigs.k8s.io/docs/user/quick-start/#installation\">kind<\/a> v0.33+ và kubectl v1.35, rồi dựng cluster:<\/p>\n<pre><code class=\"language-bash\">./env/kind/up.sh\n<\/code><\/pre>", "<p>Cấu hình shell giống phòng thi. Thêm vào <code>~/.bashrc<\/code> rồi <code>source ~/.bashrc<\/code>:<\/p>\n<pre><code class=\"language-bash\">alias k=kubectl\nsource &lt;(kubectl completion bash)\ncomplete -o default -F __start_kubectl k\nexport do=&quot;--dry-run=client -o yaml&quot;\nexport now=&quot;--force --grace-period 0&quot;\n<\/code><\/pre>", "<p>Chạy <code>./lab doctor<\/code> và <code>eval \"$(./lab env)\"<\/code>. Ghi tên node control plane vào <code>~/cka-answers/00-cp.txt<\/code>.<\/p>", "<p>Ghi phiên bản kubelet của <code>$NODE1<\/code> (ví dụ <code>v1.35.8<\/code>) vào <code>~/cka-answers/00-kubelet.txt<\/code>. Lấy từ <code>kubectl get node<\/code>, không gõ tay.<\/p>", "<p>Vào shell của <code>$NODE1<\/code> bằng <code>./lab ssh $NODE1<\/code>, chạy <code>crictl ps<\/code> để thấy container trên node, rồi <code>exit<\/code>.<\/p>"], "hints": [["Lấy phiên bản kubelet", "<p><code>kubectl get node $NODE1 -o jsonpath='{.status.nodeInfo.kubeletVersion}'<\/code><\/p>"], ["Máy dùng chip Apple", "<p>kind tự chọn image arm64. Cần Docker Desktop hoặc OrbStack với ít nhất 4 CPU và 6 GB RAM.<\/p>"]], "solution": "<pre><code class=\"language-bash\">./env/kind/up.sh\ncat &gt;&gt; ~/.bashrc &lt;&lt;'EOF'\nalias k=kubectl\nsource &lt;(kubectl completion bash)\ncomplete -o default -F __start_kubectl k\nexport do=&quot;--dry-run=client -o yaml&quot;\nexport now=&quot;--force --grace-period 0&quot;\nEOF\nsource ~/.bashrc\neval &quot;$(./lab env)&quot;\nmkdir -p ~/cka-answers\necho &quot;$CP&quot; &gt; ~/cka-answers/00-cp.txt\nkubectl get node &quot;$NODE1&quot; -o jsonpath='{.status.nodeInfo.kubeletVersion}' &gt; ~/cka-answers/00-kubelet.txt\n./lab ssh &quot;$NODE1&quot;     # rồi: crictl ps ; exit\n<\/code><\/pre>", "docs": [["kind quick start", "https://kind.sigs.k8s.io/docs/user/quick-start/"], ["kubectl cheat sheet", "https://kubernetes.io/docs/reference/kubectl/quick-reference/"]]}, {"id": 1, "slug": "kubeadm-install", "dir": "01-kubeadm-install", "title": "Cài cluster bằng kubeadm trên máy ảo", "level": 0, "env": "vm", "minutes": 60, "comps": ["arch:1", "arch:2", "arch:6"], "goal": "<p>Tự tay dựng cluster kubeadm 3 node: chuẩn bị node, <code>kubeadm init<\/code>, cài CNI, join worker. Đây là năng lực \"Prepare underlying infrastructure\" và \"Create and manage clusters using kubeadm\" của đề thi.<\/p>", "concepts": "<ul>\n<li>Mỗi node cần: tắt swap, module <code>overlay<\/code> và <code>br_netfilter<\/code>, sysctl <code>net.ipv4.ip_forward=1<\/code>, container runtime (containerd với <code>SystemdCgroup = true<\/code>), và 3 gói <code>kubeadm kubelet kubectl<\/code> cùng phiên bản, được <code>apt-mark hold<\/code>.<\/li>\n<li><code>kubeadm init<\/code> sinh chứng chỉ trong <code>/etc/kubernetes/pki<\/code>, kubeconfig trong <code>/etc/kubernetes/*.conf<\/code>, static pod trong <code>/etc/kubernetes/manifests<\/code>, rồi in lệnh <code>kubeadm join<\/code>.<\/li>\n<li>Node chỉ <code>Ready<\/code> khi đã có CNI. Lab này dùng Calico vì nó hỗ trợ NetworkPolicy.<\/li>\n<li><code>--control-plane-endpoint k8s-api:6443<\/code> đặt tên chung cho API server, để sau này thêm control plane thứ hai (lab 32).<\/li>\n<\/ul>", "setup_note": "<p>Lab này không dùng <code>./lab start<\/code>. Dựng 3 máy ảo trước:<\/p>\n<pre><code class=\"language-bash\">cd env/kubeadm &amp;&amp; vagrant up      # cp-1, worker-1, worker-2 với Kubernetes v1.34\nvagrant ssh cp-1\n<\/code><\/pre>\n<p><code>prepare-node.sh<\/code> đã chuẩn bị sẵn từng node (swap, module, sysctl, containerd, các gói kube*). Hãy đọc file đó: đề thi có thể yêu cầu bạn tự làm từng bước.<\/p>", "tasks": ["<p>Trên <code>cp-1<\/code>, kiểm tra node đã sẵn sàng: <code>swapon --show<\/code> trống, <code>sysctl net.ipv4.ip_forward<\/code> bằng 1, <code>systemctl is-active containerd<\/code> là active, <code>kubeadm version<\/code>.<\/p>", "<p>Khởi tạo control plane với: endpoint <code>k8s-api:6443<\/code>, pod CIDR <code>10.244.0.0/16<\/code>, địa chỉ quảng bá <code>192.168.56.10<\/code>, và tải cert lên để join control plane sau này.<\/p>", "<p>Cấu hình kubectl cho user <code>vagrant<\/code>.<\/p>", "<p>Cài Calico v3.32.2 với pool IP <code>10.244.0.0/16<\/code>.<\/p>", "<p>Join <code>worker-1<\/code> và <code>worker-2<\/code>. Chờ cả 3 node <code>Ready<\/code>.<\/p>", "<p>Clone repo này trên <code>cp-1<\/code> và chạy <code>./lab check 1<\/code>.<\/p>"], "hints": [["Lệnh init", "<p><code>kubeadm init --control-plane-endpoint ... --pod-network-cidr ... --apiserver-advertise-address ... --upload-certs<\/code><\/p>"], ["Mất lệnh join?", "<p><code>kubeadm token create --print-join-command<\/code><\/p>"], ["Calico manifest", "<p>Tải <code>calico.yaml<\/code>, bỏ comment biến <code>CALICO_IPV4POOL_CIDR<\/code> và đặt giá trị <code>10.244.0.0/16<\/code> trước khi apply.<\/p>"]], "solution": "<pre><code class=\"language-bash\"># trên cp-1\nsudo kubeadm init --control-plane-endpoint k8s-api:6443 \\\n  --pod-network-cidr 10.244.0.0/16 --apiserver-advertise-address 192.168.56.10 --upload-certs\nmkdir -p $HOME/.kube\nsudo cp /etc/kubernetes/admin.conf $HOME/.kube/config\nsudo chown $(id -u):$(id -g) $HOME/.kube/config\n\ncurl -LO https://raw.githubusercontent.com/projectcalico/calico/v3.32.2/manifests/calico.yaml\nsed -i 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|; s|#   value: &quot;192.168.0.0/16&quot;|  value: &quot;10.244.0.0/16&quot;|' calico.yaml\nkubectl apply -f calico.yaml\n\nkubeadm token create --print-join-command\n# chạy lệnh in ra trên worker-1 và worker-2 với sudo:\nssh worker-1 sudo kubeadm join k8s-api:6443 --token &lt;token&gt; --discovery-token-ca-cert-hash sha256:&lt;hash&gt;\nssh worker-2 sudo kubeadm join k8s-api:6443 --token &lt;token&gt; --discovery-token-ca-cert-hash sha256:&lt;hash&gt;\nkubectl get nodes -w\n<\/code><\/pre>\n<p>Nếu node đứng <code>NotReady<\/code>: <code>kubectl -n kube-system get pods -l k8s-app=calico-node<\/code> và <code>journalctl -u kubelet<\/code> trên node đó.<\/p>", "docs": [["Creating a cluster with kubeadm", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/"], ["Container runtimes", "https://kubernetes.io/docs/setup/production-environment/container-runtimes/"]]}, {"id": 2, "slug": "kubectl-api", "dir": "02-kubectl-api", "title": "kubectl, namespace, context và Kubernetes API", "level": 1, "env": "any", "minutes": 20, "comps": [], "goal": "<p>Thao tác nhanh với namespace và context, tra cứu API bằng <code>api-resources<\/code> và <code>explain<\/code>, đọc trạng thái cluster mà không cần mở tài liệu.<\/p>", "concepts": "<ul>\n<li>Mọi object có <code>apiVersion<\/code>, <code>kind<\/code>, <code>metadata<\/code>, <code>spec<\/code>, <code>status<\/code>. Deployment thuộc group <code>apps<\/code>, version <code>v1<\/code>; Pod thuộc core group nên chỉ ghi <code>v1<\/code>.<\/li>\n<li>Một số resource thuộc namespace (Pod, Service), một số thuộc cả cluster (Node, PersistentVolume, ClusterRole). <code>kubectl api-resources --namespaced=false<\/code> liệt kê nhóm sau.<\/li>\n<li>Context = cluster + user + namespace mặc định. Mỗi câu thi bắt đầu bằng <code>kubectl config use-context …<\/code>.<\/li>\n<li><code>kubectl explain pod.spec.containers --recursive<\/code> là cách nhanh nhất để nhớ tên field.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo namespace <code>lab02<\/code> có label <code>team=blue<\/code>.<\/p>", "<p>Tạo context <code>lab02-ctx<\/code> dùng cùng cluster và user với context hiện tại, namespace mặc định <code>lab02<\/code>. <strong>Không<\/strong> chuyển sang context đó.<\/p>", "<p>Ghi <code>apiVersion<\/code> của CronJob (ví dụ dạng <code>group/version<\/code>) vào <code>~/cka-answers/02-cronjob-api.txt<\/code>.<\/p>", "<p>Ghi <strong>số lượng<\/strong> loại resource cluster-scoped mà cluster hỗ trợ vào <code>~/cka-answers/02-cluster-scoped.txt<\/code>.<\/p>", "<p>Namespace <code>lab02-apps<\/code> (đã tạo sẵn) có nhiều Pod. Ghi tên Pod có label <code>tier=db<\/code> vào <code>~/cka-answers/02-db-pod.txt<\/code>, và tên node nó đang chạy vào <code>~/cka-answers/02-db-node.txt<\/code>.<\/p>"], "hints": [["Tạo context", "<p><code>kubectl config set-context lab02-ctx --cluster=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}') --user=... --namespace=lab02<\/code><\/p>"], ["Đếm resource", "<p><code>kubectl api-resources --namespaced=false --no-headers | wc -l<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create ns lab02\nkubectl label ns lab02 team=blue\n\nCL=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')\nUS=$(kubectl config view --minify -o jsonpath='{.users[0].name}')\nkubectl config set-context lab02-ctx --cluster=&quot;$CL&quot; --user=&quot;$US&quot; --namespace=lab02\n\nkubectl api-resources | grep -i cronjob          # cronjobs  cj  batch/v1  true  CronJob\necho batch/v1 &gt; ~/cka-answers/02-cronjob-api.txt\n\nkubectl api-resources --namespaced=false --no-headers | wc -l &gt; ~/cka-answers/02-cluster-scoped.txt\n\nkubectl get pods -n lab02-apps -l tier=db -o wide\nkubectl get pods -n lab02-apps -l tier=db -o jsonpath='{.items[0].metadata.name}' &gt; ~/cka-answers/02-db-pod.txt\nkubectl get pods -n lab02-apps -l tier=db -o jsonpath='{.items[0].spec.nodeName}' &gt; ~/cka-answers/02-db-node.txt\n<\/code><\/pre>", "docs": [["Namespaces", "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"], ["Organizing access with kubeconfig", "https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/"]]}, {"id": 3, "slug": "pods", "dir": "03-pods", "title": "Pod, label, log và exec", "level": 1, "env": "any", "minutes": 25, "comps": ["trouble:3"], "goal": "<p>Tạo và sửa Pod thật nhanh bằng lệnh imperative, đọc log, chạy lệnh trong container, và biết field nào của Pod đang chạy thì sửa được.<\/p>", "concepts": "<ul>\n<li><code>kubectl run<\/code> tạo Pod; <code>--labels<\/code>, <code>--env<\/code>, <code>--port<\/code>, <code>--command -- …<\/code> bao phủ phần lớn yêu cầu.<\/li>\n<li>Phần lớn spec của Pod đang chạy là bất biến. Sửa được tại chỗ: <code>image<\/code> của container, <code>activeDeadlineSeconds<\/code>, <code>tolerations<\/code> (chỉ thêm), label và annotation.<\/li>\n<li>Field khác (command, env, resources…) phải xóa rồi tạo lại: <code>kubectl get pod x -o yaml &gt; x.yaml<\/code>, sửa, <code>kubectl replace --force -f x.yaml<\/code>.<\/li>\n<li><code>kubectl logs<\/code> đọc stdout/stderr; <code>--previous<\/code> cho lần chạy trước khi container bị restart; <code>-c<\/code> chọn container.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong namespace <code>lab03<\/code>, tạo Pod <code>web<\/code> image <code>nginx:1.27<\/code>, label <code>app=web<\/code> và <code>tier=front<\/code>, khai báo containerPort 80.<\/p>", "<p>Tạo Pod <code>worker<\/code> image <code>busybox:1.36<\/code>, biến môi trường <code>MODE=lab<\/code>, chạy lệnh <code>sh -c 'echo started; sleep 3600'<\/code>.<\/p>", "<p>Pod <code>noisy<\/code> đang ghi log. Ghi mọi dòng chứa <code>ERROR<\/code> trong log của nó vào <code>~/cka-answers/03-errors.txt<\/code>.<\/p>", "<p>Pod <code>broken<\/code> đứng <code>ImagePullBackOff<\/code>. Sửa nó chạy được với image <code>nginx:1.27<\/code> mà <strong>không xóa Pod<\/strong>.<\/p>", "<p>Ghi hostname bên trong container của Pod <code>web<\/code> vào <code>~/cka-answers/03-hostname.txt<\/code> (lấy bằng <code>kubectl exec<\/code>).<\/p>", "<p>Xóa ngay Pod <code>old<\/code> (không chờ grace period).<\/p>"], "hints": [["Đặt namespace mặc định cho đỡ gõ", "<p><code>kubectl config set-context --current --namespace=lab03<\/code> (nhớ đổi lại <code>default<\/code> sau lab).<\/p>"], ["Sửa image tại chỗ", "<p><code>kubectl set image pod/broken &lt;tên-container&gt;=nginx:1.27<\/code>. Tên container xem bằng <code>kubectl get pod broken -o jsonpath='{.spec.containers[*].name}'<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl run web -n lab03 --image=nginx:1.27 --labels=app=web,tier=front --port=80\nkubectl run worker -n lab03 --image=busybox:1.36 --env=MODE=lab --command -- sh -c 'echo started; sleep 3600'\nkubectl logs noisy -n lab03 | grep ERROR &gt; ~/cka-answers/03-errors.txt\nkubectl get pod broken -n lab03 -o jsonpath='{.spec.containers[*].name}'   # app\nkubectl set image pod/broken -n lab03 app=nginx:1.27\nkubectl exec web -n lab03 -- hostname &gt; ~/cka-answers/03-hostname.txt\nkubectl delete pod old -n lab03 --force --grace-period 0\n<\/code><\/pre>", "docs": [["Pods", "https://kubernetes.io/docs/concepts/workloads/pods/"], ["kubectl run", "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/"]]}, {"id": 4, "slug": "yaml-jsonpath", "dir": "04-yaml-jsonpath", "title": "Sinh YAML nhanh và trích xuất bằng jsonpath", "level": 1, "env": "any", "minutes": 25, "comps": ["trouble:2"], "goal": "<p>Viết YAML bằng <code>--dry-run=client -o yaml<\/code> thay vì gõ tay, và trích đúng dữ liệu đề yêu cầu bằng jsonpath, custom-columns, sort-by.<\/p>", "concepts": "<ul>\n<li><code>kubectl create deploy … $do &gt; file.yaml<\/code> cho khung YAML đúng cú pháp; chỉ cần sửa phần còn thiếu.<\/li>\n<li>jsonpath: <code>{.items[*].metadata.name}<\/code> lấy danh sách; <code>{range .items[*]}{.a} {.b}{\"\\n\"}{end}<\/code> in từng dòng; <code>[?(@.type==\"InternalIP\")]<\/code> lọc phần tử.<\/li>\n<li><code>-o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[*].image<\/code> in bảng theo ý muốn; <code>--sort-by=.metadata.name<\/code> sắp xếp.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Sinh YAML Deployment <code>api<\/code> (image <code>nginx:1.27<\/code>, 2 replica) bằng dry-run, lưu vào <code>~/cka-answers/04-api.yaml<\/code>. Sửa file để Pod template có thêm label <code>tier=backend<\/code>, rồi apply vào namespace <code>lab04<\/code>.<\/p>", "<p>Ghi vào <code>~/cka-answers/04-pod-ips.txt<\/code> mỗi dòng một Pod trong <code>lab04<\/code> theo dạng <code>&lt;tên&gt; &lt;podIP&gt;<\/code>.<\/p>", "<p>Ghi InternalIP của mọi node vào <code>~/cka-answers/04-node-ips.txt<\/code>, cách nhau bởi dấu cách, trên một dòng.<\/p>", "<p>Ghi vào <code>~/cka-answers/04-images.txt<\/code> bảng hai cột <code>POD<\/code> và <code>IMAGE<\/code> của các Pod trong <code>lab04<\/code>, sắp xếp theo tên Pod.<\/p>"], "hints": [["Một dòng cho mỗi Pod", "<p><code>kubectl get pods -n lab04 -o jsonpath='{range .items[*]}{.metadata.name} {.status.podIP}{\"\\n\"}{end}'<\/code><\/p>"], ["Lọc theo type", "<p><code>{.items[*].status.addresses[?(@.type==\"InternalIP\")].address}<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create deploy api --image=nginx:1.27 --replicas=2 $do &gt; ~/cka-answers/04-api.yaml\n# sửa file: dưới spec.template.metadata.labels thêm  tier: backend\nkubectl apply -n lab04 -f ~/cka-answers/04-api.yaml\nkubectl rollout status deploy/api -n lab04\n\nkubectl get pods -n lab04 -o jsonpath='{range .items[*]}{.metadata.name} {.status.podIP}{&quot;\\n&quot;}{end}' &gt; ~/cka-answers/04-pod-ips.txt\nkubectl get nodes -o jsonpath='{.items[*].status.addresses[?(@.type==&quot;InternalIP&quot;)].address}' &gt; ~/cka-answers/04-node-ips.txt\nkubectl get pods -n lab04 --sort-by=.metadata.name -o custom-columns=POD:.metadata.name,IMAGE:.spec.containers[*].image &gt; ~/cka-answers/04-images.txt\n<\/code><\/pre>", "docs": [["JSONPath support", "https://kubernetes.io/docs/reference/kubectl/jsonpath/"], ["kubectl quick reference", "https://kubernetes.io/docs/reference/kubectl/quick-reference/"]]}, {"id": 5, "slug": "deployment-rollout", "dir": "05-deployment-rollout", "title": "Deployment: scale, rolling update, rollback", "level": 2, "env": "any", "minutes": 30, "comps": ["work:0"], "goal": "<p>Điều khiển vòng đời một Deployment: scale, chỉnh chiến lược cập nhật, nâng image có ghi chú, nhận ra rollout bị kẹt và quay lại phiên bản tốt.<\/p>", "concepts": "<ul>\n<li>Deployment quản lý ReplicaSet; mỗi lần đổi <strong>Pod template<\/strong> (image, env…) tạo ReplicaSet mới. Đổi <code>replicas<\/code> thì không.<\/li>\n<li><code>RollingUpdate<\/code> với <code>maxSurge<\/code> (được tạo dư bao nhiêu Pod) và <code>maxUnavailable<\/code> (được thiếu bao nhiêu Pod sẵn sàng). <code>maxUnavailable: 0<\/code> là không gián đoạn. <code>Recreate<\/code> xóa hết Pod cũ rồi mới tạo mới.<\/li>\n<li><code>kubectl rollout history<\/code> đọc annotation <code>kubernetes.io/change-cause<\/code> của từng ReplicaSet. <code>rollout undo --to-revision=N<\/code> quay về một revision; revision đó được đánh số mới.<\/li>\n<li>Image sai thì Pod mới đứng <code>ImagePullBackOff<\/code>. Với <code>maxUnavailable: 0<\/code>, Pod cũ vẫn phục vụ: rollout kẹt nhưng không sập dịch vụ.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Scale Deployment <code>shop<\/code> trong namespace <code>lab05<\/code> lên <strong>4<\/strong> replica.<\/p>", "<p>Đặt chiến lược cho <code>shop<\/code>: <code>RollingUpdate<\/code>, <code>maxSurge: 1<\/code>, <code>maxUnavailable: 0<\/code>, và giữ tối đa <strong>5<\/strong> revision.<\/p>", "<p>Nâng <code>shop<\/code> lên <code>nginx:1.28<\/code> với change-cause <code>nang cap nginx 1.28<\/code>. Chờ rollout xong.<\/p>", "<p>Một đồng nghiệp đẩy <code>nginx:1.99<\/code> (không tồn tại) lên <code>shop<\/code>. Hãy làm điều đó, quan sát rollout kẹt, rồi <strong>rollback<\/strong> về revision chạy <code>nginx:1.28<\/code>.<\/p>", "<p>Deployment <code>legacy<\/code> không được phép chạy hai phiên bản cùng lúc. Đổi chiến lược của nó sang <code>Recreate<\/code>.<\/p>"], "hints": [["Ghi change-cause", "<p>Sau <code>kubectl set image<\/code>, chạy <code>kubectl annotate deploy/shop kubernetes.io/change-cause='…' --overwrite<\/code>.<\/p>"], ["Đổi sang Recreate", "<p>Khi chuyển sang <code>Recreate<\/code> phải xóa luôn khối <code>rollingUpdate<\/code>, nếu không API báo lỗi. <code>kubectl edit<\/code> hoặc patch với <code>\"rollingUpdate\": null<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl scale deploy shop -n lab05 --replicas=4\nkubectl patch deploy shop -n lab05 -p '{&quot;spec&quot;:{&quot;revisionHistoryLimit&quot;:5,&quot;strategy&quot;:{&quot;type&quot;:&quot;RollingUpdate&quot;,&quot;rollingUpdate&quot;:{&quot;maxSurge&quot;:1,&quot;maxUnavailable&quot;:0}}}}'\n\nkubectl set image deploy/shop -n lab05 nginx=nginx:1.28\nkubectl annotate deploy/shop -n lab05 kubernetes.io/change-cause='nang cap nginx 1.28' --overwrite\nkubectl rollout status deploy/shop -n lab05\n\nkubectl set image deploy/shop -n lab05 nginx=nginx:1.99\nkubectl annotate deploy/shop -n lab05 kubernetes.io/change-cause='thu nginx 1.99' --overwrite\nkubectl rollout status deploy/shop -n lab05 --timeout=30s     # kẹt\nkubectl get pods -n lab05                                     # 1 Pod ImagePullBackOff, 4 Pod cũ vẫn chạy\nkubectl rollout history deploy/shop -n lab05\nkubectl rollout undo deploy/shop -n lab05                     # về revision trước (1.28)\n\nkubectl patch deploy legacy -n lab05 -p '{&quot;spec&quot;:{&quot;strategy&quot;:{&quot;type&quot;:&quot;Recreate&quot;,&quot;rollingUpdate&quot;:null}}}'\n<\/code><\/pre>", "docs": [["Deployments", "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"], ["kubectl rollout", "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/"]]}, {"id": 6, "slug": "configmap-secret", "dir": "06-configmap-secret", "title": "ConfigMap và Secret", "level": 2, "env": "any", "minutes": 30, "comps": ["work:1"], "goal": "<p>Tách cấu hình khỏi image: tạo ConfigMap và Secret từ literal và file, đưa vào container qua biến môi trường và volume, đọc giá trị Secret có sẵn.<\/p>", "concepts": "<ul>\n<li><code>envFrom<\/code> nạp mọi key của ConfigMap/Secret thành biến môi trường; <code>env[].valueFrom.secretKeyRef<\/code> lấy một key.<\/li>\n<li>ConfigMap gắn qua volume: mỗi key thành một file. File tự cập nhật khi ConfigMap đổi (trừ khi dùng <code>subPath<\/code>); biến môi trường thì <strong>không<\/strong>, phải restart Pod.<\/li>\n<li>Secret chỉ được <strong>base64<\/strong>, không mã hóa. Đọc: <code>kubectl get secret x -o jsonpath='{.data.key}' | base64 -d<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong namespace <code>lab06<\/code>, tạo ConfigMap <code>app-config<\/code> với <code>APP_MODE=production<\/code> và <code>APP_PORT=8080<\/code>.<\/p>", "<p>Tạo ConfigMap <code>app-files<\/code> từ file <code>~/cka-answers/06-app.properties<\/code> (setup đã tạo sẵn), key là <code>app.properties<\/code>.<\/p>", "<p>Tạo Secret <code>db-cred<\/code> với <code>username=admin<\/code> và <code>password=S3cr3t-pass<\/code>.<\/p>", "<p>Tạo Deployment <code>app<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) sao cho container có:\nmọi key của <code>app-config<\/code> thành biến môi trường; biến <code>DB_PASSWORD<\/code> lấy từ key <code>password<\/code> của <code>db-cred<\/code>; ConfigMap <code>app-files<\/code> gắn chỉ đọc tại <code>/etc/app<\/code>.<\/p>", "<p>Secret <code>legacy-token<\/code> có sẵn. Giải mã key <code>token<\/code> và ghi giá trị vào <code>~/cka-answers/06-token.txt<\/code>.<\/p>"], "hints": [["Khung YAML", "<p><code>kubectl create deploy app --image=busybox:1.36 $do -- sleep 3600 &gt; app.yaml<\/code> rồi thêm <code>envFrom<\/code>, <code>env<\/code>, <code>volumes<\/code>, <code>volumeMounts<\/code>.<\/p>"], ["Thêm biến từ Secret bằng lệnh", "<p><code>kubectl set env deploy/app --from=secret/db-cred --keys=password --prefix=DB_<\/code> tạo <code>DB_PASSWORD<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create cm app-config -n lab06 --from-literal=APP_MODE=production --from-literal=APP_PORT=8080\nkubectl create cm app-files -n lab06 --from-file=app.properties=$HOME/cka-answers/06-app.properties\nkubectl create secret generic db-cred -n lab06 --from-literal=username=admin --from-literal=password=S3cr3t-pass\nkubectl get secret legacy-token -n lab06 -o jsonpath='{.data.token}' | base64 -d &gt; ~/cka-answers/06-token.txt\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: app, namespace: lab06}\nspec:\n  selector: {matchLabels: {app: app}}\n  template:\n    metadata: {labels: {app: app}}\n    spec:\n      containers:\n      - name: busybox\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        envFrom:\n        - configMapRef: {name: app-config}\n        env:\n        - name: DB_PASSWORD\n          valueFrom: {secretKeyRef: {name: db-cred, key: password}}\n        volumeMounts:\n        - {name: files, mountPath: /etc/app, readOnly: true}\n      volumes:\n      - name: files\n        configMap: {name: app-files}\n<\/code><\/pre>\n<p>Kiểm tra: <code>kubectl exec -n lab06 deploy/app -- sh -c 'env | grep -E \"APP_|DB_\"; cat /etc/app/app.properties'<\/code><\/p>", "docs": [["ConfigMaps", "https://kubernetes.io/docs/concepts/configuration/configmap/"], ["Secrets", "https://kubernetes.io/docs/concepts/configuration/secret/"], ["Configure a Pod to use a ConfigMap", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/"]]}, {"id": 7, "slug": "probes", "dir": "07-probes", "title": "Liveness, readiness và startup probe", "level": 2, "env": "any", "minutes": 30, "comps": ["work:3", "trouble:3"], "goal": "<p>Chẩn đoán một ứng dụng bị kubelet giết liên tục vì probe sai, sửa bằng startupProbe, và thêm readiness để Service chỉ gửi traffic khi Pod sẵn sàng.<\/p>", "concepts": "<ul>\n<li><strong>liveness<\/strong> trượt <code>failureThreshold<\/code> lần liên tiếp thì kubelet giết container. <strong>readiness<\/strong> trượt chỉ rút Pod khỏi EndpointSlice, không restart. <strong>startup<\/strong> chặn hai probe kia cho tới khi app khởi động xong; thời gian tối đa = <code>failureThreshold × periodSeconds<\/code>.<\/li>\n<li>Kiểu probe: <code>httpGet<\/code> (mã 200–399), <code>tcpSocket<\/code>, <code>exec<\/code> (thoát 0), <code>grpc<\/code>. Mặc định <code>periodSeconds: 10<\/code>, <code>timeoutSeconds: 1<\/code>, <code>failureThreshold: 3<\/code>.<\/li>\n<li>Dấu hiệu probe sai: event <code>Unhealthy<\/code> và <code>Killing<\/code>, RESTARTS tăng dần, <code>READY 0/1<\/code> dù <code>STATUS Running<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Deployment <code>slow-api<\/code> trong <code>lab07<\/code> cần khoảng <strong>25 giây<\/strong> để khởi động và restart liên tục. Tìm probe nào gây restart, ghi tên probe (<code>liveness<\/code>, <code>readiness<\/code> hoặc <code>startup<\/code>) vào <code>~/cka-answers/07-culprit.txt<\/code>.<\/p>", "<p>Sửa <code>slow-api<\/code> mà <strong>không<\/strong> tăng <code>initialDelaySeconds<\/code> của liveness: thêm <code>startupProbe<\/code> HTTP <code>GET /healthz<\/code> cổng 8080, cho phép tối đa ít nhất 60 giây để khởi động.<\/p>", "<p>Readiness của <code>slow-api<\/code> đang trỏ sai cổng. Sửa để nó kiểm tra <code>GET /ready<\/code> cổng 8080. Cả 2 Pod phải <code>READY 1/1<\/code> và không restart nữa.<\/p>", "<p>Deployment <code>cache<\/code> chưa có readiness. Thêm <code>readinessProbe<\/code> kiểu <code>exec<\/code> chạy <code>cat /tmp/ready<\/code>, chu kỳ 5 giây.<\/p>"], "hints": [["Xem probe nào đang trượt", "<p><code>kubectl describe pod -n lab07 -l app=slow-api | grep -E 'Liveness|Readiness|Startup|Killing'<\/code><\/p>"], ["Sửa nhanh", "<p><code>kubectl edit deploy slow-api -n lab07<\/code>. Thêm <code>startupProbe<\/code> ngang hàng với <code>livenessProbe<\/code>.<\/p>"]], "solution": "<p><code>kubectl describe pod<\/code> cho thấy event <code>Liveness probe failed … connection refused<\/code> và <code>Killing<\/code>: liveness giết app trước khi nó kịp khởi động.<\/p>\n<pre><code class=\"language-bash\">echo liveness &gt; ~/cka-answers/07-culprit.txt\nkubectl edit deploy slow-api -n lab07\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">        startupProbe:\n          httpGet: {path: /healthz, port: 8080}\n          periodSeconds: 5\n          failureThreshold: 12        # 60 giây\n        livenessProbe:                # giữ nguyên\n          httpGet: {path: /healthz, port: 8080}\n          periodSeconds: 5\n          failureThreshold: 2\n        readinessProbe:\n          httpGet: {path: /ready, port: 8080}   # trước đây là 8081\n          periodSeconds: 5\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl patch deploy cache -n lab07 --type=json -p '[{&quot;op&quot;:&quot;add&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/readinessProbe&quot;,&quot;value&quot;:{&quot;exec&quot;:{&quot;command&quot;:[&quot;cat&quot;,&quot;/tmp/ready&quot;]},&quot;periodSeconds&quot;:5}}]'\nkubectl rollout status deploy/slow-api -n lab07 --timeout=180s\nkubectl get pods -n lab07\n<\/code><\/pre>", "docs": [["Configure liveness, readiness and startup probes", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"], ["Pod lifecycle", "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"]]}, {"id": 8, "slug": "init-sidecar", "dir": "08-init-sidecar", "title": "Init container và sidecar container", "level": 2, "env": "any", "minutes": 30, "comps": ["work:3", "trouble:3"], "goal": "<p>Dùng init container để chờ phụ thuộc, và thêm sidecar đọc log file của ứng dụng cũ ra stdout để <code>kubectl logs<\/code> đọc được.<\/p>", "concepts": "<ul>\n<li>Init container chạy <strong>tuần tự<\/strong> trước container chính, mỗi cái phải thoát 0. Pod hiển thị <code>Init:0/1<\/code> trong lúc chờ.<\/li>\n<li>Sidecar kiểu mới (GA từ v1.33): khai báo trong <code>initContainers<\/code> với <code>restartPolicy: Always<\/code>. Nó khởi động trước app, chạy suốt đời Pod và dừng sau app.<\/li>\n<li>Các container trong Pod dùng chung volume (<code>emptyDir<\/code>) và network namespace (gọi nhau qua <code>localhost<\/code>).<\/li>\n<li>Spec của Pod đang chạy gần như bất biến: muốn thêm container phải xuất YAML, sửa, rồi <code>kubectl replace --force -f<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab08<\/code>, tạo Pod <code>web<\/code> (image <code>nginx:1.27<\/code>) có init container <code>wait-db<\/code> (image <code>busybox:1.36<\/code>) chờ tới khi phân giải được tên <code>db.lab08.svc.cluster.local<\/code>. Pod phải đứng ở <code>Init:0/1<\/code>.<\/p>", "<p>Tạo Service <code>db<\/code> kiểu ClusterIP cổng 5432 (không cần selector). Xác nhận Pod <code>web<\/code> chuyển sang <code>Running<\/code>.<\/p>", "<p>Pod <code>legacy<\/code> ghi log vào file <code>/var/log/app/app.log<\/code> (volume <code>logs<\/code>). Thêm sidecar tên <code>log-tail<\/code> (image <code>busybox:1.36<\/code>) dạng native sidecar, chạy <code>tail -n+1 -F /var/log/app/app.log<\/code>, để <code>kubectl logs legacy -c log-tail<\/code> thấy log.<\/p>"], "hints": [["Lệnh chờ DNS", "<p><code>until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done<\/code><\/p>"], ["Thêm container vào Pod đang chạy", "<p><code>kubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml<\/code>, sửa, rồi <code>kubectl replace --force -f legacy.yaml<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: web, namespace: lab08}\nspec:\n  initContainers:\n  - name: wait-db\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done&quot;]\n  containers:\n  - {name: web, image: nginx:1.27}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pod web -n lab08          # Init:0/1\nkubectl create svc clusterip db -n lab08 --tcp=5432\nkubectl get pod web -n lab08 -w       # → Running\nkubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code> của <code>legacy.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  initContainers:\n  - name: log-tail\n    image: busybox:1.36\n    restartPolicy: Always\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -n+1 -F /var/log/app/app.log&quot;]\n    volumeMounts:\n    - {name: logs, mountPath: /var/log/app}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl replace --force -f legacy.yaml\nkubectl logs legacy -n lab08 -c log-tail\n<\/code><\/pre>", "docs": [["Init containers", "https://kubernetes.io/docs/concepts/workloads/pods/init-containers/"], ["Sidecar containers", "https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/"], ["Logging architecture", "https://kubernetes.io/docs/concepts/cluster-administration/logging/"]]}, {"id": 9, "slug": "daemonset-job-cronjob", "dir": "09-daemonset-job-cronjob", "title": "DaemonSet, Job và CronJob", "level": 2, "env": "any", "minutes": 30, "comps": ["work:3"], "goal": "<p>Chọn đúng loại workload: một Pod trên mỗi node (DaemonSet), tác vụ chạy tới khi xong (Job), tác vụ theo lịch (CronJob).<\/p>", "concepts": "<ul>\n<li>Không có <code>kubectl create daemonset<\/code>: sinh YAML Deployment rồi đổi <code>kind: DaemonSet<\/code>, bỏ <code>replicas<\/code> và <code>strategy<\/code>. Muốn chạy cả trên control plane phải tolerate taint <code>node-role.kubernetes.io/control-plane:NoSchedule<\/code>.<\/li>\n<li>Job: <code>completions<\/code> (cần bao nhiêu lần thành công), <code>parallelism<\/code> (chạy song song bao nhiêu), <code>backoffLimit<\/code> (số lần thử lại), <code>ttlSecondsAfterFinished<\/code> (tự xóa). <code>restartPolicy<\/code> chỉ được <code>Never<\/code> hoặc <code>OnFailure<\/code>.<\/li>\n<li>CronJob: <code>schedule<\/code> theo cú pháp cron, <code>concurrencyPolicy<\/code> (<code>Allow<\/code>, <code>Forbid<\/code>, <code>Replace<\/code>), giới hạn lịch sử job. <code>kubectl create job x --from=cronjob/y<\/code> chạy ngay một lần.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab09<\/code>, tạo DaemonSet <code>node-agent<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) chạy trên <strong>mọi<\/strong> node, kể cả control plane.<\/p>", "<p>Tạo Job <code>batch-sum<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sh -c 'echo done'<\/code>) cần <strong>4<\/strong> lần thành công, chạy song song tối đa <strong>2<\/strong>, thử lại tối đa <strong>2<\/strong> lần, tự xóa sau <strong>300<\/strong> giây khi xong. Job phải hoàn thành.<\/p>", "<p>Tạo CronJob <code>report<\/code> chạy mỗi 15 phút (image <code>busybox:1.36<\/code>, lệnh <code>date<\/code>), không cho chạy chồng (<code>Forbid<\/code>), giữ lại 2 job thành công.<\/p>", "<p>Chạy ngay một lần CronJob <code>report<\/code> bằng Job tên <code>report-now<\/code>. Job phải hoàn thành.<\/p>"], "hints": [["Sinh YAML Job và CronJob", "<p><code>kubectl create job batch-sum --image=busybox:1.36 $do -- sh -c 'echo done'<\/code> và <code>kubectl create cronjob report --image=busybox:1.36 --schedule='*/15 * * * *' $do -- date<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: DaemonSet\nmetadata: {name: node-agent, namespace: lab09}\nspec:\n  selector: {matchLabels: {app: node-agent}}\n  template:\n    metadata: {labels: {app: node-agent}}\n    spec:\n      tolerations:\n      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}\n      containers:\n      - {name: agent, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n---\napiVersion: batch/v1\nkind: Job\nmetadata: {name: batch-sum, namespace: lab09}\nspec:\n  completions: 4\n  parallelism: 2\n  backoffLimit: 2\n  ttlSecondsAfterFinished: 300\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n      - {name: sum, image: busybox:1.36, command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo done&quot;]}\n---\napiVersion: batch/v1\nkind: CronJob\nmetadata: {name: report, namespace: lab09}\nspec:\n  schedule: &quot;*/15 * * * *&quot;\n  concurrencyPolicy: Forbid\n  successfulJobsHistoryLimit: 2\n  jobTemplate:\n    spec:\n      template:\n        spec:\n          restartPolicy: OnFailure\n          containers:\n          - {name: report, image: busybox:1.36, command: [&quot;date&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create job report-now -n lab09 --from=cronjob/report\nkubectl get ds,job,cronjob -n lab09\n<\/code><\/pre>", "docs": [["DaemonSet", "https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/"], ["Jobs", "https://kubernetes.io/docs/concepts/workloads/controllers/job/"], ["CronJob", "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"]]}, {"id": 10, "slug": "resources-quota", "dir": "10-resources-quota", "title": "Requests, limits, LimitRange và ResourceQuota", "level": 2, "env": "any", "minutes": 35, "comps": ["work:4", "trouble:2"], "goal": "<p>Hiểu requests/limits tác động thế nào tới scheduling và QoS, tìm vì sao Deployment không đủ Pod khi namespace có quota, và đặt giá trị mặc định bằng LimitRange.<\/p>", "concepts": "<ul>\n<li>Scheduler chỉ nhìn <strong>requests<\/strong>. Vượt memory <strong>limit<\/strong> thì container bị OOMKilled; vượt CPU limit thì bị throttle.<\/li>\n<li>QoS: <code>Guaranteed<\/code> (mọi container có requests = limits cho CPU và memory), <code>Burstable<\/code>, <code>BestEffort<\/code> (không đặt gì, bị evict đầu tiên).<\/li>\n<li>ResourceQuota giới hạn tổng của namespace. Khi quota có <code>requests.cpu<\/code>, mọi Pod <strong>bắt buộc<\/strong> khai báo requests CPU, nếu không bị từ chối.<\/li>\n<li>Pod bị quota từ chối không tồn tại, nên lỗi nằm ở <strong>event của ReplicaSet<\/strong> (<code>FailedCreate<\/code>), không ở Deployment.<\/li>\n<li>LimitRange điền requests/limits mặc định cho container không khai báo, và có thể đặt min/max.<\/li>\n<li>Quota sát giới hạn có thể làm rolling update <strong>kẹt<\/strong>: Deployment cần tạo Pod mới (maxSurge) trước khi xóa Pod cũ, nhưng quota không cho tạo. Gỡ bằng cách tạm tăng <code>maxUnavailable<\/code>, giảm <code>replicas<\/code>, hoặc nới quota.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Deployment <code>heavy<\/code> trong <code>lab10<\/code> muốn 3 replica nhưng chỉ có 2 Pod. Tìm resource nào của quota bị vượt (ví dụ <code>limits.memory<\/code>) và ghi vào <code>~/cka-answers/10-quota.txt<\/code>.<\/p>", "<p>Sửa <code>heavy<\/code> để đủ 3 replica: requests <code>cpu: 200m<\/code>, <code>memory: 128Mi<\/code>; limits <code>memory: 256Mi<\/code>.<\/p>", "<p>Tạo LimitRange <code>defaults<\/code> trong <code>lab10<\/code>: container không khai báo sẽ nhận request <code>cpu: 100m<\/code>, <code>memory: 64Mi<\/code> và limit <code>cpu: 200m<\/code>, <code>memory: 128Mi<\/code>.<\/p>", "<p>Tạo Pod <code>plain<\/code> (image <code>nginx:1.27<\/code>, không khai báo resources). Nó phải chạy được nhờ LimitRange.<\/p>", "<p>Tạo Pod <code>gold<\/code> (image <code>nginx:1.27<\/code>) thuộc QoS class <code>Guaranteed<\/code> với CPU 100m và memory 64Mi.<\/p>"], "hints": [["Tìm lý do", "<p><code>kubectl describe rs -n lab10 -l app=heavy | grep -A3 FailedCreate<\/code> và <code>kubectl describe quota -n lab10<\/code><\/p>"], ["Sửa resources nhanh", "<p><code>kubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl describe rs -n lab10 -l app=heavy | grep FailedCreate\n#   exceeded quota: team-quota, requested: requests.cpu=800m, used: requests.cpu=1600m, limited: requests.cpu=2\necho requests.cpu &gt; ~/cka-answers/10-quota.txt\nkubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: LimitRange\nmetadata: {name: defaults, namespace: lab10}\nspec:\n  limits:\n  - type: Container\n    defaultRequest: {cpu: 100m, memory: 64Mi}\n    default: {cpu: 200m, memory: 128Mi}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl run plain -n lab10 --image=nginx:1.27\nkubectl get pod plain -n lab10 -o jsonpath='{.spec.containers[0].resources}'\nkubectl run gold -n lab10 --image=nginx:1.27 $do &gt; gold.yaml\n# thêm resources: requests và limits đều cpu: 100m, memory: 64Mi\nkubectl apply -f gold.yaml\nkubectl get pod gold -n lab10 -o jsonpath='{.status.qosClass}'   # Guaranteed\n<\/code><\/pre>", "docs": [["Resource management for Pods and containers", "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"], ["Resource quotas", "https://kubernetes.io/docs/concepts/policy/resource-quotas/"], ["Limit ranges", "https://kubernetes.io/docs/concepts/policy/limit-range/"], ["Pod QoS classes", "https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/"]]}, {"id": 11, "slug": "hpa-metrics", "dir": "11-hpa-metrics", "title": "metrics-server và HorizontalPodAutoscaler", "level": 2, "env": "any", "minutes": 30, "comps": ["work:2", "trouble:2"], "goal": "<p>Theo dõi CPU/RAM bằng <code>kubectl top<\/code>, tạo HPA có behavior, và sửa HPA hiện <code>&lt;unknown&gt;<\/code> vì Pod không khai báo requests.<\/p>", "concepts": "<ul>\n<li>metrics-server lấy số liệu từ kubelet và phục vụ Metrics API cho <code>kubectl top<\/code> và HPA. Lab 00 đã cài nó trên kind.<\/li>\n<li>HPA tính <code>desiredReplicas = ceil(replicas × giá trị hiện tại / mục tiêu)<\/code>. Utilization tính theo <strong>requests<\/strong>, nên Pod không có CPU request thì HPA không tính được (<code>&lt;unknown&gt;<\/code>).<\/li>\n<li><code>behavior.scaleDown.stabilizationWindowSeconds<\/code> (mặc định 300) chống dao động: khi giảm, HPA lấy khuyến nghị cao nhất trong cửa sổ.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi tên Pod trong namespace <code>kube-system<\/code> đang dùng <strong>nhiều memory nhất<\/strong> vào <code>~/cka-answers/11-top-pod.txt<\/code>.<\/p>", "<p>Trong <code>lab11<\/code>, tạo HPA cho Deployment <code>web<\/code>: tối thiểu 2, tối đa 6 replica, mục tiêu CPU <strong>50%<\/strong>, và scale down chờ <strong>60 giây<\/strong>.<\/p>", "<p>HPA <code>api<\/code> đã có sẵn nhưng hiển thị <code>&lt;unknown&gt;<\/code>. Sửa Deployment <code>api<\/code> để HPA đọc được metric (CPU request <code>100m<\/code>).<\/p>", "<p>(Không chấm) Tạo tải để thấy HPA scale up: <code>kubectl run load -n lab11 --image=busybox:1.36 -- sh -c 'while true; do wget -qO- http://web &gt;/dev/null; done'<\/code> rồi <code>kubectl get hpa -n lab11 -w<\/code>.<\/p>"], "hints": [["Sắp xếp theo memory", "<p><code>kubectl top pod -n kube-system --sort-by=memory --no-headers | head -1<\/code><\/p>"], ["HPA có behavior", "<p><code>kubectl autoscale<\/code> không đặt được behavior. Sinh YAML (<code>$do<\/code>) rồi thêm <code>spec.behavior<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl top pod -n kube-system --sort-by=memory --no-headers | head -1 | awk '{print $1}' &gt; ~/cka-answers/11-top-pod.txt\nkubectl autoscale deploy web -n lab11 --min=2 --max=6 --cpu-percent=50 $do &gt; hpa.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code> của <code>hpa.yaml<\/code> rồi <code>kubectl apply -f hpa.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 60\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl describe hpa api -n lab11        # failed to get cpu utilization: missing request for cpu\nkubectl set resources deploy api -n lab11 --requests=cpu=100m\nkubectl get hpa -n lab11                 # sau khoảng 1 phút TARGETS hiện %\n<\/code><\/pre>", "docs": [["Horizontal Pod Autoscaling", "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"], ["HPA walkthrough", "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale-walkthrough/"], ["Resource metrics pipeline", "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"]]}, {"id": 12, "slug": "node-selection", "dir": "12-node-selection", "title": "nodeSelector, node affinity, taint và toleration", "level": 3, "env": "any", "minutes": 30, "comps": ["work:4"], "goal": "<p>Đặt Pod lên đúng node: chọn node bằng label, giữ riêng một node cho workload đặc biệt bằng taint, và cho đúng workload đó vào bằng toleration cộng affinity.<\/p>", "concepts": "<ul>\n<li><code>nodeSelector<\/code> là điều kiện cứng đơn giản. <code>nodeAffinity<\/code> có <code>requiredDuringScheduling…<\/code> (cứng) và <code>preferredDuringScheduling…<\/code> (cộng điểm, có <code>weight<\/code>).<\/li>\n<li><strong>Taint<\/strong> đẩy Pod ra khỏi node (<code>NoSchedule<\/code>, <code>PreferNoSchedule<\/code>, <code>NoExecute<\/code>). <strong>Toleration<\/strong> chỉ <em>cho phép<\/em> Pod vào node có taint, không <em>ép<\/em> Pod vào đó. Muốn dành riêng node: taint + toleration + affinity.<\/li>\n<li><code>IgnoredDuringExecution<\/code>: đổi label node sau khi Pod đã chạy không đuổi Pod. Riêng taint <code>NoExecute<\/code> thì đuổi.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Gắn label <code>disktype=ssd<\/code> cho <code>$NODE1<\/code> và <code>disktype=hdd<\/code> cho <code>$NODE2<\/code>.<\/p>", "<p>Trong <code>lab12<\/code>, tạo Pod <code>fast<\/code> (image <code>nginx:1.27<\/code>) chỉ chạy trên node có <code>disktype=ssd<\/code>, dùng <code>nodeSelector<\/code>.<\/p>", "<p>Dành <code>$NODE2<\/code> cho workload GPU: gắn taint <code>dedicated=gpu:NoSchedule<\/code> và label <code>accelerator=nvidia<\/code>.<\/p>", "<p>Tạo Deployment <code>gpu-job<\/code> (2 replica, image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) chạy <strong>chỉ<\/strong> trên <code>$NODE2<\/code>: tolerate taint ở trên và dùng <code>requiredDuringSchedulingIgnoredDuringExecution<\/code> với label <code>accelerator=nvidia<\/code>.<\/p>", "<p>Tạo Pod <code>flex<\/code> (image <code>nginx:1.27<\/code>) <strong>ưu tiên<\/strong> (không bắt buộc) node có <code>disktype=hdd<\/code>, weight 80.<\/p>"], "hints": [["Gỡ taint", "<p>Thêm dấu <code>-<\/code> ở cuối: <code>kubectl taint node $NODE2 dedicated-<\/code><\/p>"], ["Vì sao Pod tolerate rồi vẫn chạy sang node khác?", "<p>Toleration không chọn node. Cần thêm affinity hoặc nodeSelector.<\/p>"]], "solution": "<pre><code class=\"language-bash\">eval &quot;$(./lab env)&quot;\nkubectl label node $NODE1 disktype=ssd\nkubectl label node $NODE2 disktype=hdd accelerator=nvidia\nkubectl taint node $NODE2 dedicated=gpu:NoSchedule\nkubectl run fast -n lab12 --image=nginx:1.27 $do &gt; fast.yaml   # thêm nodeSelector rồi apply\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># fast\nspec:\n  nodeSelector: {disktype: ssd}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: gpu-job, namespace: lab12}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: gpu-job}}\n  template:\n    metadata: {labels: {app: gpu-job}}\n    spec:\n      tolerations:\n      - {key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}\n      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n            nodeSelectorTerms:\n            - matchExpressions:\n              - {key: accelerator, operator: In, values: [nvidia]}\n      containers:\n      - {name: job, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: flex, namespace: lab12}\nspec:\n  affinity:\n    nodeAffinity:\n      preferredDuringSchedulingIgnoredDuringExecution:\n      - weight: 80\n        preference:\n          matchExpressions:\n          - {key: disktype, operator: In, values: [hdd]}\n  containers:\n  - {name: flex, image: nginx:1.27}\n<\/code><\/pre>", "docs": [["Assigning Pods to nodes", "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"], ["Taints and tolerations", "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"]]}, {"id": 13, "slug": "spread-priority", "dir": "13-spread-priority", "title": "Anti-affinity, topology spread và PriorityClass", "level": 3, "env": "any", "minutes": 30, "comps": ["work:4"], "goal": "<p>Tách replica ra các node khác nhau để chịu lỗi, chia đều Pod theo topology, và gán độ ưu tiên cho workload quan trọng.<\/p>", "concepts": "<ul>\n<li><code>podAntiAffinity<\/code> với <code>topologyKey: kubernetes.io/hostname<\/code> cấm hai Pod cùng label nằm chung node. Nếu <code>required<\/code> mà không đủ node, Pod thừa đứng Pending.<\/li>\n<li><code>topologySpreadConstraints<\/code>: <code>maxSkew<\/code> là chênh lệch tối đa giữa các miền, <code>whenUnsatisfiable: DoNotSchedule<\/code> (cứng) hoặc <code>ScheduleAnyway<\/code>. <code>nodeTaintsPolicy: Honor<\/code> loại khỏi phép tính các node có taint mà Pod không tolerate (mặc định là <code>Ignore<\/code>, tức vẫn tính).<\/li>\n<li>PriorityClass gán số ưu tiên; Pod ưu tiên cao có thể <strong>preempt<\/strong> (đuổi) Pod thấp hơn khi thiếu chỗ. Một PriorityClass có thể là <code>globalDefault<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab13<\/code>, tạo Deployment <code>web<\/code> (2 replica, <code>nginx:1.27<\/code>, label <code>app=web<\/code>) mà hai Pod <strong>bắt buộc<\/strong> nằm trên hai node khác nhau.<\/p>", "<p>Tạo Deployment <code>spread<\/code> (4 replica, <code>nginx:1.27<\/code>, label <code>app=spread<\/code>) chia đều theo node (<code>kubernetes.io/hostname<\/code>), <code>maxSkew: 1<\/code>, không được vi phạm. Cả 4 Pod phải chạy.<\/p>", "<p>Cluster có một PriorityClass là mặc định toàn cục. Ghi tên của nó vào <code>~/cka-answers/13-default-pc.txt<\/code>.<\/p>", "<p>Tạo PriorityClass <code>critical-app<\/code> với value <code>1000000<\/code>, không phải mặc định, mô tả <code>payment<\/code>. Tạo Pod <code>vip<\/code> (<code>nginx:1.27<\/code>) dùng nó.<\/p>"], "hints": [["spread chỉ chạy được 2 Pod?", "<p>Control plane cũng được tính là một \"miền\" với 0 Pod, nên mỗi worker chỉ được 1 Pod. Đặt <code>nodeTaintsPolicy: Honor<\/code> để bỏ qua node có taint mà Pod không tolerate.<\/p>"], ["Tìm PriorityClass mặc định", "<p><code>kubectl get priorityclass<\/code> rồi xem cột <code>GLOBAL-DEFAULT<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web, namespace: lab13}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: web}}\n  template:\n    metadata: {labels: {app: web}}\n    spec:\n      affinity:\n        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n          - topologyKey: kubernetes.io/hostname\n            labelSelector: {matchLabels: {app: web}}\n      containers:\n      - {name: nginx, image: nginx:1.27}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: spread, namespace: lab13}\nspec:\n  replicas: 4\n  selector: {matchLabels: {app: spread}}\n  template:\n    metadata: {labels: {app: spread}}\n    spec:\n      topologySpreadConstraints:\n      - maxSkew: 1\n        topologyKey: kubernetes.io/hostname\n        whenUnsatisfiable: DoNotSchedule\n        nodeTaintsPolicy: Honor\n        labelSelector: {matchLabels: {app: spread}}\n      containers:\n      - {name: nginx, image: nginx:1.27}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pc                     # cột GLOBAL-DEFAULT\necho team-default &gt; ~/cka-answers/13-default-pc.txt\nkubectl create priorityclass critical-app --value=1000000 --description=payment\nkubectl run vip -n lab13 --image=nginx:1.27 $do &gt; vip.yaml   # thêm spec.priorityClassName: critical-app\nkubectl apply -f vip.yaml\nkubectl get pod vip -n lab13 -o jsonpath='{.spec.priority}'   # 1000000\n<\/code><\/pre>\n<p>Nếu thiếu <code>nodeTaintsPolicy: Honor<\/code>, control plane (có taint) vẫn được tính là một miền với 0 Pod, nên mỗi worker chỉ nhận 1 Pod và 2 Pod còn lại đứng Pending. Có <code>Honor<\/code> thì chỉ tính 2 worker: 2 + 2.<\/p>", "docs": [["Inter-pod affinity and anti-affinity", "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity"], ["Pod topology spread constraints", "https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"], ["Pod priority and preemption", "https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/"]]}, {"id": 14, "slug": "static-pod-maintenance", "dir": "14-static-pod-maintenance", "title": "Static pod, lập lịch thủ công và bảo trì node", "level": 3, "env": "kind", "minutes": 35, "comps": ["work:4", "work:3", "trouble:0"], "goal": "<p>Chạy Pod không qua scheduler (static pod, <code>nodeName<\/code>), và đưa một node vào bảo trì an toàn với PodDisruptionBudget, <code>cordon<\/code> và <code>drain<\/code>.<\/p>", "concepts": "<ul>\n<li><strong>Static pod<\/strong>: kubelet đọc file YAML trong <code>staticPodPath<\/code> (kubeadm: <code>/etc/kubernetes/manifests<\/code>) và chạy Pod mà không cần API server. API chỉ thấy một \"mirror pod\" tên <code>&lt;tên&gt;-&lt;node&gt;<\/code>; xóa bằng kubectl không có tác dụng, phải xóa file.<\/li>\n<li>Đặt <code>spec.nodeName<\/code> thì bỏ qua scheduler: kubelet của node đó nhận Pod luôn. Hữu ích khi scheduler chết.<\/li>\n<li><code>cordon<\/code> chặn Pod mới; <code>drain<\/code> = cordon + đuổi Pod qua Eviction API, tôn trọng <strong>PodDisruptionBudget<\/strong>. DaemonSet và mirror pod không bị đuổi; cần <code>--ignore-daemonsets<\/code>, <code>--delete-emptydir-data<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo static pod <code>static-web<\/code> (image <code>nginx:1.27<\/code>) trên <code>$NODE1<\/code>. Tìm đúng thư mục từ cấu hình kubelet của node.<\/p>", "<p>Giả sử scheduler đang hỏng. Tạo Pod <code>manual<\/code> (image <code>nginx:1.27<\/code>) trong <code>lab14<\/code> chạy trên <code>$NODE2<\/code> <strong>mà không qua scheduler<\/strong>.<\/p>", "<p>Deployment <code>web<\/code> trong <code>lab14<\/code> có 3 replica. Tạo PodDisruptionBudget <code>web-pdb<\/code> đảm bảo luôn còn ít nhất 2 Pod <code>app=web<\/code>.<\/p>", "<p>Đưa <code>$NODE1<\/code> vào bảo trì: không nhận Pod mới và mọi Pod thường đã dời đi. Để nguyên trạng thái này khi chấm; <code>./lab reset 14<\/code> sẽ đưa node trở lại.<\/p>"], "hints": [["Tìm thư mục static pod", "<p><code>./lab ssh $NODE1<\/code> rồi <code>grep staticPodPath /var/lib/kubelet/config.yaml<\/code><\/p>"], ["Drain bị chặn?", "<p>Đọc thông báo: thường do DaemonSet (<code>--ignore-daemonsets<\/code>), Pod dùng emptyDir (<code>--delete-emptydir-data<\/code>), hoặc Pod không có controller (Pod trần, cần <code>--force<\/code>, và Pod đó sẽ mất hẳn). Pod trần còn sót từ lab khác: <code>./lab reset &lt;id&gt;<\/code> hoặc thêm <code>--force<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">eval &quot;$(./lab env)&quot;\nkubectl run static-web --image=nginx:1.27 $do &gt; static-web.yaml\n./lab ssh $NODE1\n#   trên node:\n#   grep staticPodPath /var/lib/kubelet/config.yaml     → /etc/kubernetes/manifests\n#   cat &gt; /etc/kubernetes/manifests/static-web.yaml     (dán nội dung) ; exit\nkubectl get pod static-web-$NODE1                         # mirror pod\n\nkubectl run manual -n lab14 --image=nginx:1.27 $do &gt; manual.yaml\n# thêm  spec.nodeName: &lt;tên NODE2&gt;  rồi apply\nkubectl apply -f manual.yaml\n\nkubectl create pdb web-pdb -n lab14 --selector=app=web --min-available=2\nkubectl drain $NODE1 --ignore-daemonsets --delete-emptydir-data\nkubectl get nodes          # NODE1: Ready,SchedulingDisabled\n<\/code><\/pre>", "docs": [["Create static Pods", "https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/"], ["Safely drain a node", "https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/"], ["Disruptions", "https://kubernetes.io/docs/concepts/workloads/pods/disruptions/"]]}, {"id": 15, "slug": "services", "dir": "15-services", "title": "Service, EndpointSlice và kết nối giữa các Pod", "level": 4, "env": "any", "minutes": 35, "comps": ["net:2", "net:0", "trouble:4"], "goal": "<p>Tạo đủ loại Service, hiểu Service tìm Pod bằng selector và EndpointSlice, sửa Service không có endpoint, và trỏ Service ra ngoài cluster.<\/p>", "concepts": "<ul>\n<li>Service chọn Pod bằng <strong>label selector<\/strong>; EndpointSlice controller ghi IP:port của các Pod <strong>Ready<\/strong> khớp selector. Service không có endpoint gần như luôn do selector sai hoặc Pod chưa Ready.<\/li>\n<li><code>port<\/code> là cổng của Service, <code>targetPort<\/code> là cổng của container (có thể dùng tên cổng), <code>nodePort<\/code> là cổng mở trên mọi node (30000–32767).<\/li>\n<li><strong>Headless<\/strong> (<code>clusterIP: None<\/code>): DNS trả thẳng IP Pod; với StatefulSet mỗi Pod có tên riêng <code>db-0.db.&lt;ns&gt;.svc.cluster.local<\/code>.<\/li>\n<li>Service <strong>không selector<\/strong> cộng EndpointSlice tự tạo (label <code>kubernetes.io/service-name<\/code>) để trỏ tới máy ngoài cluster.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab15<\/code>, expose Deployment <code>web<\/code> thành Service ClusterIP tên <code>web<\/code>, cổng 80. Ghi ClusterIP của nó vào <code>~/cka-answers/15-web-ip.txt<\/code>.<\/p>", "<p>Tạo Service <code>web-np<\/code> kiểu NodePort cho <code>web<\/code>: cổng 80, nodePort <code>30080<\/code>.<\/p>", "<p>Service <code>api-svc<\/code> không trả lời. Sửa nó (không sửa Deployment <code>api<\/code>) để gọi <code>http://api-svc.lab15<\/code> từ Pod khác nhận được trang nginx.<\/p>", "<p>StatefulSet <code>db<\/code> đã có nhưng thiếu Service. Tạo headless Service <code>db<\/code> cổng 5432 để tên <code>db-0.db.lab15.svc.cluster.local<\/code> phân giải được.<\/p>", "<p>Tạo Service <code>legacy-db<\/code> (cổng 5432, không selector) trỏ tới máy <code>10.0.5.20:5432<\/code> bằng một EndpointSlice tự viết tên <code>legacy-db-1<\/code>.<\/p>"], "hints": [["Vì sao Service không có endpoint?", "<p>So <code>kubectl get svc api-svc -n lab15 -o jsonpath='{.spec.selector}'<\/code> với <code>kubectl get pods -n lab15 --show-labels<\/code>, và <code>targetPort<\/code> với cổng container.<\/p>"], ["Thử gọi Service", "<p><code>kubectl run t -n lab15 --rm -it --image=busybox:1.36 --restart=Never -- wget -qO- -T3 api-svc<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl expose deploy web -n lab15 --port=80\nkubectl get svc web -n lab15 -o jsonpath='{.spec.clusterIP}' &gt; ~/cka-answers/15-web-ip.txt\nkubectl expose deploy web -n lab15 --name=web-np --type=NodePort --port=80 $do &gt; np.yaml\n# thêm nodePort: 30080 dưới ports[0], rồi\nkubectl apply -f np.yaml\n\nkubectl get svc api-svc -n lab15 -o yaml       # selector app=apis, targetPort 8080\nkubectl get pods -n lab15 --show-labels        # Pod có app=api, nginx nghe cổng 80\nkubectl patch svc api-svc -n lab15 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/selector&quot;,&quot;value&quot;:{&quot;app&quot;:&quot;api&quot;}},{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/ports/0/targetPort&quot;,&quot;value&quot;:80}]'\nkubectl get endpointslices -n lab15 -l kubernetes.io/service-name=api-svc\n\nkubectl create svc clusterip db -n lab15 --clusterip=None --tcp=5432\n# selector của Service tạo bằng lệnh trên là app=db, khớp label Pod của StatefulSet\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Service\nmetadata: {name: legacy-db, namespace: lab15}\nspec:\n  ports: [{port: 5432, protocol: TCP}]\n---\napiVersion: discovery.k8s.io/v1\nkind: EndpointSlice\nmetadata:\n  name: legacy-db-1\n  namespace: lab15\n  labels: {kubernetes.io/service-name: legacy-db}\naddressType: IPv4\nports: [{port: 5432, protocol: TCP}]\nendpoints: [{addresses: [&quot;10.0.5.20&quot;]}]\n<\/code><\/pre>", "docs": [["Service", "https://kubernetes.io/docs/concepts/services-networking/service/"], ["EndpointSlices", "https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/"], ["Debug Services", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"]]}, {"id": 16, "slug": "dns-coredns", "dir": "16-dns-coredns", "title": "DNS trong cluster và CoreDNS", "level": 4, "env": "any", "minutes": 30, "comps": ["net:5", "trouble:4"], "goal": "<p>Hiểu tên DNS của Service và Pod, đọc cấu hình DNS của Pod, tùy chỉnh <code>dnsPolicy<\/code>, và sửa Corefile của CoreDNS để phân giải tên nội bộ của công ty.<\/p>", "concepts": "<ul>\n<li>Service: <code>&lt;svc&gt;.&lt;ns&gt;.svc.&lt;cluster-domain&gt;<\/code> (mặc định <code>cluster.local<\/code>). Pod đọc <code>/etc/resolv.conf<\/code>: nameserver là ClusterIP của Service <code>kube-dns<\/code>, có <code>search &lt;ns&gt;.svc.cluster.local svc.cluster.local cluster.local<\/code> và <code>ndots:5<\/code>.<\/li>\n<li><code>dnsPolicy<\/code>: <code>ClusterFirst<\/code> (mặc định, dùng CoreDNS), <code>Default<\/code> (dùng DNS của node, <strong>không<\/strong> phân giải được Service), <code>None<\/code> (tự khai báo trong <code>dnsConfig<\/code>).<\/li>\n<li>CoreDNS cấu hình bằng ConfigMap <code>coredns<\/code> trong <code>kube-system<\/code> (Corefile). Có thể thêm server block riêng cho một zone. Plugin <code>reload<\/code> tự nạp lại sau khoảng 30 giây; muốn nhanh thì <code>kubectl -n kube-system rollout restart deploy coredns<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi ClusterIP của Service DNS của cluster vào <code>~/cka-answers/16-dns-ip.txt<\/code>, và cluster domain vào <code>~/cka-answers/16-domain.txt<\/code>.<\/p>", "<p>Pod <code>client<\/code> trong <code>lab16<\/code> không phân giải được tên Service nào. Tìm nguyên nhân và sửa để từ <code>client<\/code> chạy <code>nslookup web.lab16<\/code> thành công. Giữ nguyên tên Pod và image.<\/p>", "<p>Tạo Pod <code>custom-dns<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) <strong>chỉ<\/strong> dùng nameserver <code>1.1.1.1<\/code>, search domain <code>lab16.svc.cluster.local<\/code>, option <code>ndots: 2<\/code>.<\/p>", "<p>Công ty có máy <code>legacy.corp.internal<\/code> ở <code>10.10.10.10<\/code> mà DNS công cộng không biết. Sửa CoreDNS để mọi Pod phân giải được tên này, không làm hỏng DNS của cluster.<\/p>"], "hints": [["Tìm cluster domain", "<p><code>kubectl -n kube-system get cm coredns -o yaml<\/code> (dòng <code>kubernetes cluster.local …<\/code>) hoặc <code>clusterDomain<\/code> trong <code>/var/lib/kubelet/config.yaml<\/code> của node.<\/p>"], ["Thêm zone vào Corefile", "<p>Thêm một server block mới ở cuối Corefile, dùng plugin <code>hosts<\/code>:<\/p>\n<pre><code>corp.internal:53 {\n    errors\n    hosts {\n        10.10.10.10 legacy.corp.internal\n    }\n}\n<\/code><\/pre>"]], "solution": "<pre><code class=\"language-bash\">kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}' &gt; ~/cka-answers/16-dns-ip.txt\necho cluster.local &gt; ~/cka-answers/16-domain.txt\n\nkubectl get pod client -n lab16 -o jsonpath='{.spec.dnsPolicy}'   # Default → dùng DNS của node\nkubectl get pod client -n lab16 -o yaml &gt; client.yaml\n# đổi dnsPolicy: Default → ClusterFirst (hoặc xóa dòng), rồi\nkubectl replace --force -f client.yaml\nkubectl exec client -n lab16 -- nslookup web.lab16\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: custom-dns, namespace: lab16}\nspec:\n  dnsPolicy: None\n  dnsConfig:\n    nameservers: [&quot;1.1.1.1&quot;]\n    searches: [&quot;lab16.svc.cluster.local&quot;]\n    options: [{name: ndots, value: &quot;2&quot;}]\n  containers:\n  - {name: c, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl -n kube-system edit cm coredns     # thêm server block corp.internal ở cuối Corefile\nkubectl -n kube-system rollout restart deploy coredns\nkubectl run t --rm -it --image=busybox:1.36 --restart=Never -- nslookup legacy.corp.internal\n<\/code><\/pre>", "docs": [["DNS for Services and Pods", "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"], ["Customizing DNS Service", "https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/"], ["Debugging DNS resolution", "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"]]}, {"id": 17, "slug": "network-policy", "dir": "17-network-policy", "title": "NetworkPolicy theo mô hình mặc định chặn", "level": 4, "env": "any", "minutes": 40, "comps": ["net:1", "net:0"], "goal": "<p>Khóa một ứng dụng ba tầng web → api → db: chặn mặc định, chỉ mở đúng các đường cần thiết, kể cả theo namespace và chiều đi ra (egress).<\/p>", "concepts": "<ul>\n<li>Pod không bị policy nào chọn thì nhận mọi traffic. Một khi bị chọn cho chiều <code>Ingress<\/code> (hoặc <code>Egress<\/code>), chỉ traffic được liệt kê mới qua.<\/li>\n<li>Trong một phần tử <code>from<\/code>, <code>podSelector<\/code> và <code>namespaceSelector<\/code> đặt <strong>cùng một gạch đầu dòng<\/strong> là AND; tách thành <strong>hai gạch đầu dòng<\/strong> là OR.<\/li>\n<li>Namespace luôn có label <code>kubernetes.io/metadata.name=&lt;tên&gt;<\/code>, tiện để chọn một namespace cụ thể.<\/li>\n<li>Chặn egress thì phải mở UDP/TCP 53 tới CoreDNS, nếu không mọi lần gọi bằng tên đều lỗi.<\/li>\n<li>Policy chỉ có hiệu lực khi CNI hỗ trợ (kindnet, Calico, Cilium… có; Flannel thuần thì không).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab17<\/code>, tạo policy <code>default-deny<\/code> chặn <strong>mọi ingress<\/strong> tới mọi Pod.<\/p>", "<p>Tạo policy <code>web-to-api<\/code>: Pod <code>app=api<\/code> chỉ nhận traffic TCP 80 từ Pod <code>app=web<\/code> cùng namespace.<\/p>", "<p>Tạo policy <code>api-to-db<\/code>: Pod <code>app=db<\/code> chỉ nhận TCP 80 từ Pod <code>app=api<\/code>.<\/p>", "<p>Tạo policy <code>monitoring-to-api<\/code>: Pod trong các namespace có label <code>purpose=monitoring<\/code> được gọi <code>app=api<\/code> cổng 80. Namespace <code>lab17-mon<\/code> đã có label đó; namespace <code>lab17-other<\/code> thì không và phải bị chặn.<\/p>", "<p>Tạo policy <code>api-egress<\/code>: Pod <code>app=api<\/code> chỉ được gọi ra Pod <code>app=db<\/code> cổng 80 và DNS (cổng 53 UDP và TCP).<\/p>"], "hints": [["Kiểm tra bằng Pod có label giả lập", "<p><code>kubectl run t -n lab17 --rm -it --image=busybox:1.36 --labels=app=web --restart=Never -- wget -qO- -T3 api<\/code><\/p>"], ["DNS cho egress", "<p><code>to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]<\/code> với <code>ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: default-deny, namespace: lab17}\nspec:\n  podSelector: {}\n  policyTypes: [Ingress]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: web-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: web}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-to-db, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: db}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: api}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: monitoring-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{namespaceSelector: {matchLabels: {purpose: monitoring}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-egress, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Egress]\n  egress:\n  - to: [{podSelector: {matchLabels: {app: db}}}]\n    ports: [{protocol: TCP, port: 80}]\n  - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]\n    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]\n<\/code><\/pre>\n<p>Các policy cộng dồn: <code>api<\/code> nhận được từ <code>web<\/code> (policy 2) <strong>hoặc<\/strong> từ namespace monitoring (policy 4).<\/p>", "docs": [["Network Policies", "https://kubernetes.io/docs/concepts/services-networking/network-policies/"], ["Declare Network Policy", "https://kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/"]]}, {"id": 18, "slug": "ingress", "dir": "18-ingress", "title": "Ingress, IngressClass và TLS", "level": 4, "env": "any", "minutes": 30, "comps": ["net:4"], "goal": "<p>Viết Ingress định tuyến theo host và path tới nhiều Service, gắn chứng chỉ TLS, và chọn IngressClass mặc định.<\/p>", "concepts": "<ul>\n<li>Ingress chỉ là bản mô tả; cần một <strong>Ingress controller<\/strong> (Traefik, HAProxy, NGINX…) để thực thi. <code>ingressClassName<\/code> chọn controller nào xử lý.<\/li>\n<li><code>pathType<\/code>: <code>Prefix<\/code> (khớp theo từng đoạn <code>/<\/code>), <code>Exact<\/code> (khớp đúng), <code>ImplementationSpecific<\/code>.<\/li>\n<li>TLS: Secret kiểu <code>kubernetes.io/tls<\/code> có <code>tls.crt<\/code> và <code>tls.key<\/code>, khai báo trong <code>spec.tls<\/code> cùng danh sách host.<\/li>\n<li>Annotation <code>ingressclass.kubernetes.io/is-default-class: \"true\"<\/code> trên IngressClass làm nó mặc định cho Ingress không ghi class.<\/li>\n<li>Dự án ingress-nginx đã ngừng phát triển; hướng mới là Gateway API (lab 19). Đề thi vẫn hỏi cả hai.<\/li>\n<\/ul>", "setup_note": "<p>Lab chấm theo nội dung object, không cần controller. Muốn thấy traffic thật, cài một controller (ví dụ Traefik bằng Helm) và đổi <code>ingressClassName<\/code> cho khớp.<\/p>", "tasks": ["<p>Tạo chứng chỉ tự ký cho <code>shop.lab.local<\/code> và Secret TLS <code>shop-tls<\/code> trong <code>lab18<\/code>.<\/p>", "<p>Tạo Ingress <code>shop<\/code> (class <code>lab-ingress<\/code>) cho host <code>shop.lab.local<\/code>: path <code>/api<\/code> (Prefix) tới Service <code>api<\/code> cổng 8080, path <code>/<\/code> (Prefix) tới Service <code>web<\/code> cổng 80, dùng TLS <code>shop-tls<\/code>.<\/p>", "<p>Tạo Ingress <code>docs<\/code> không ghi <code>ingressClassName<\/code>, host <code>docs.lab.local<\/code>, path <code>/guide<\/code> kiểu <strong>Exact<\/strong> tới <code>web:80<\/code>.<\/p>", "<p>Đặt IngressClass <code>lab-ingress<\/code> làm mặc định của cluster.<\/p>"], "hints": [["Tạo cert và Secret", "<p><code>openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj \"/CN=shop.lab.local\"<\/code> rồi <code>kubectl create secret tls shop-tls --cert=tls.crt --key=tls.key -n lab18<\/code><\/p>"], ["Sinh Ingress bằng lệnh", "<p><code>kubectl create ingress shop -n lab18 --class=lab-ingress --rule=\"shop.lab.local/api*=api:8080,tls=shop-tls\" --rule=\"shop.lab.local/*=web:80,tls=shop-tls\"<\/code> (dấu <code>*<\/code> = Prefix)<\/p>"]], "solution": "<pre><code class=\"language-bash\">openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj &quot;/CN=shop.lab.local&quot;\nkubectl create secret tls shop-tls -n lab18 --cert=tls.crt --key=tls.key\nkubectl create ingress shop -n lab18 --class=lab-ingress \\\n  --rule=&quot;shop.lab.local/api*=api:8080,tls=shop-tls&quot; \\\n  --rule=&quot;shop.lab.local/*=web:80,tls=shop-tls&quot;\nkubectl create ingress docs -n lab18 --rule=&quot;docs.lab.local/guide=web:80&quot;\nkubectl annotate ingressclass lab-ingress ingressclass.kubernetes.io/is-default-class=true\nkubectl describe ingress shop -n lab18\n<\/code><\/pre>", "docs": [["Ingress", "https://kubernetes.io/docs/concepts/services-networking/ingress/"], ["Ingress controllers", "https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/"]]}, {"id": 19, "slug": "gateway-api", "dir": "19-gateway-api", "title": "Gateway API, HTTPRoute và ReferenceGrant", "level": 4, "env": "any", "minutes": 40, "comps": ["net:3"], "goal": "<p>Dựng định tuyến L7 bằng Gateway API: Gateway do đội hạ tầng quản lý, HTTPRoute của đội ứng dụng, chia traffic canary theo weight và theo header, và cho phép tham chiếu chéo namespace.<\/p>", "concepts": "<ul>\n<li><strong>GatewayClass<\/strong> (loại controller) → <strong>Gateway<\/strong> (listener: cổng, giao thức, TLS, namespace nào được gắn route) → <strong>HTTPRoute<\/strong> (match theo host, path, header; gửi tới <code>backendRefs<\/code> có <code>weight<\/code>).<\/li>\n<li><code>allowedRoutes.namespaces.from<\/code>: <code>Same<\/code> (mặc định), <code>All<\/code>, hoặc <code>Selector<\/code> theo label namespace.<\/li>\n<li>Route tham chiếu Service ở <strong>namespace khác<\/strong> chỉ hợp lệ khi namespace đích có <strong>ReferenceGrant<\/strong> cho phép.<\/li>\n<li>Kiểm tra trạng thái: <code>kubectl describe httproute<\/code>, các condition <code>Accepted<\/code> và <code>ResolvedRefs<\/code> (cần controller thật).<\/li>\n<\/ul>", "setup_note": "<p>Setup cài CRD Gateway API v1.6.3 (bản standard) từ GitHub nếu cluster chưa có, và tạo GatewayClass <code>lab-gc<\/code>. Lab chấm theo nội dung object. Muốn thấy traffic thật, cài một implementation như Envoy Gateway hoặc NGINX Gateway Fabric và đổi <code>gatewayClassName<\/code>.<\/p>", "tasks": ["<p>Gắn label <code>gateway-access=true<\/code> cho namespace <code>lab19-app<\/code>.<\/p>", "<p>Trong <code>lab19-infra<\/code>, tạo Gateway <code>public<\/code> (class <code>lab-gc<\/code>) có listener tên <code>http<\/code>, HTTP cổng 80, chỉ nhận route từ namespace có label <code>gateway-access=true<\/code>.<\/p>", "<p>Trong <code>lab19-app<\/code>, tạo HTTPRoute <code>shop<\/code> gắn vào <code>public<\/code>, host <code>shop.lab.local<\/code>, gồm 3 rule:\nrequest có header <code>x-canary: \"true\"<\/code> đi <strong>hết<\/strong> vào <code>api-v2:8080<\/code>;\npath <code>/api<\/code> (PathPrefix) chia <code>api:8080<\/code> weight 90 và <code>api-v2:8080<\/code> weight 10;\ncòn lại (<code>/<\/code>) vào <code>web:80<\/code>.<\/p>", "<p>Đội hạ tầng tạo HTTPRoute <code>admin<\/code> trong <code>lab19-infra<\/code> (host <code>admin.lab.local<\/code>) gửi tới Service <code>admin<\/code> cổng 80 ở <code>lab19-app<\/code>. Tạo route đó và ReferenceGrant <code>allow-infra-routes<\/code> trong <code>lab19-app<\/code> cho phép HTTPRoute từ <code>lab19-infra<\/code> tham chiếu Service.<\/p>"], "hints": [["Khung Gateway", "<p><code>kubectl explain gateway.spec.listeners.allowedRoutes --recursive<\/code><\/p>"], ["Match theo header", "<p><code>matches: [{headers: [{name: x-canary, value: \"true\"}]}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl label ns lab19-app gateway-access=true\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata: {name: public, namespace: lab19-infra}\nspec:\n  gatewayClassName: lab-gc\n  listeners:\n  - name: http\n    protocol: HTTP\n    port: 80\n    allowedRoutes:\n      namespaces:\n        from: Selector\n        selector: {matchLabels: {gateway-access: &quot;true&quot;}}\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: shop, namespace: lab19-app}\nspec:\n  parentRefs: [{name: public, namespace: lab19-infra}]\n  hostnames: [&quot;shop.lab.local&quot;]\n  rules:\n  - matches: [{headers: [{name: x-canary, value: &quot;true&quot;}]}]\n    backendRefs: [{name: api-v2, port: 8080}]\n  - matches: [{path: {type: PathPrefix, value: /api}}]\n    backendRefs:\n    - {name: api, port: 8080, weight: 90}\n    - {name: api-v2, port: 8080, weight: 10}\n  - matches: [{path: {type: PathPrefix, value: /}}]\n    backendRefs: [{name: web, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: admin, namespace: lab19-infra}\nspec:\n  parentRefs: [{name: public}]\n  hostnames: [&quot;admin.lab.local&quot;]\n  rules:\n  - backendRefs: [{name: admin, namespace: lab19-app, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: ReferenceGrant\nmetadata: {name: allow-infra-routes, namespace: lab19-app}\nspec:\n  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: lab19-infra}]\n  to: [{group: &quot;&quot;, kind: Service}]\n<\/code><\/pre>", "docs": [["Gateway API (Kubernetes docs)", "https://kubernetes.io/docs/concepts/services-networking/gateway/"], ["Gateway API guides", "https://gateway-api.sigs.k8s.io/guides/"], ["HTTP traffic splitting", "https://gateway-api.sigs.k8s.io/guides/traffic-splitting/"]]}, {"id": 20, "slug": "volumes", "dir": "20-volumes", "title": "Volume: emptyDir, hostPath, projected và Downward API", "level": 5, "env": "kind", "minutes": 30, "comps": ["stor:1"], "goal": "<p>Chọn đúng loại volume cho từng nhu cầu: chia sẻ dữ liệu giữa container trong Pod, đọc ghi thư mục của node, và gom nhiều nguồn cấu hình vào một thư mục.<\/p>", "concepts": "<ul>\n<li><strong>emptyDir<\/strong> sống theo Pod, dùng chung giữa các container. <code>medium: Memory<\/code> là tmpfs (tính vào memory limit), <code>sizeLimit<\/code> giới hạn dung lượng.<\/li>\n<li><strong>hostPath<\/strong> gắn thư mục của node vào Pod; dữ liệu gắn với một node và là rủi ro bảo mật. <code>type: DirectoryOrCreate<\/code> tự tạo thư mục.<\/li>\n<li><strong>projected<\/strong> gộp <code>configMap<\/code>, <code>secret<\/code>, <code>downwardAPI<\/code>, <code>serviceAccountToken<\/code> vào một thư mục.<\/li>\n<li><strong>Downward API<\/strong> đưa thông tin của chính Pod (tên, namespace, IP, node, label, resources) vào biến môi trường hoặc file.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab20<\/code>, tạo Pod <code>shared<\/code> có 2 container dùng chung emptyDir <code>data<\/code> (tmpfs, tối đa 64Mi) gắn tại <code>/data<\/code>: container <code>writer<\/code> (<code>busybox:1.36<\/code>) ghi <code>date<\/code> vào <code>/data/out.log<\/code> mỗi 2 giây; container <code>reader<\/code> (<code>busybox:1.36<\/code>) chạy <code>tail -F /data/out.log<\/code>.<\/p>", "<p>Tạo Pod <code>hostlog<\/code> (<code>busybox:1.36<\/code>) chạy trên <code>$NODE1<\/code>, gắn hostPath <code>/var/log/lab20<\/code> (tự tạo nếu chưa có) tại <code>/logs<\/code>, và ghi file <code>/logs/hello.txt<\/code> có nội dung <code>hello from pod<\/code>.<\/p>", "<p>Tạo Pod <code>info<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có biến <code>POD_IP<\/code> và <code>NODE_NAME<\/code> lấy từ Downward API, và một projected volume tại <code>/etc/info<\/code> gồm: ConfigMap <code>app-cfg<\/code>
