ess).<\/p>", "concepts": "<ul>\n<li>Pod không bị policy nào chọn thì nhận mọi traffic. Một khi bị chọn cho chiều <code>Ingress<\/code> (hoặc <code>Egress<\/code>), chỉ traffic được liệt kê mới qua.<\/li>\n<li>Trong một phần tử <code>from<\/code>, <code>podSelector<\/code> và <code>namespaceSelector<\/code> đặt <strong>cùng một gạch đầu dòng<\/strong> là AND; tách thành <strong>hai gạch đầu dòng<\/strong> là OR.<\/li>\n<li>Namespace luôn có label <code>kubernetes.io/metadata.name=&lt;tên&gt;<\/code>, tiện để chọn một namespace cụ thể.<\/li>\n<li>Chặn egress thì phải mở UDP/TCP 53 tới CoreDNS, nếu không mọi lần gọi bằng tên đều lỗi.<\/li>\n<li>Policy chỉ có hiệu lực khi CNI hỗ trợ (kindnet, Calico, Cilium… có; Flannel thuần thì không).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab17<\/code>, tạo policy <code>default-deny<\/code> chặn <strong>mọi ingress<\/strong> tới mọi Pod.<\/p>", "<p>Tạo policy <code>web-to-api<\/code>: Pod <code>app=api<\/code> chỉ nhận traffic TCP 80 từ Pod <code>app=web<\/code> cùng namespace.<\/p>", "<p>Tạo policy <code>api-to-db<\/code>: Pod <code>app=db<\/code> chỉ nhận TCP 80 từ Pod <code>app=api<\/code>.<\/p>", "<p>Tạo policy <code>monitoring-to-api<\/code>: Pod trong các namespace có label <code>purpose=monitoring<\/code> được gọi <code>app=api<\/code> cổng 80. Namespace <code>lab17-mon<\/code> đã có label đó; namespace <code>lab17-other<\/code> thì không và phải bị chặn.<\/p>", "<p>Tạo policy <code>api-egress<\/code>: Pod <code>app=api<\/code> chỉ được gọi ra Pod <code>app=db<\/code> cổng 80 và DNS (cổng 53 UDP và TCP).<\/p>"], "hints": [["Kiểm tra bằng Pod có label giả lập", "<p><code>kubectl run t -n lab17 --rm -it --image=busybox:1.36 --labels=app=web --restart=Never -- wget -qO- -T3 api<\/code><\/p>"], ["DNS cho egress", "<p><code>to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]<\/code> với <code>ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: default-deny, namespace: lab17}\nspec:\n  podSelector: {}\n  policyTypes: [Ingress]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: web-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: web}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-to-db, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: db}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: api}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: monitoring-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{namespaceSelector: {matchLabels: {purpose: monitoring}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-egress, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Egress]\n  egress:\n  - to: [{podSelector: {matchLabels: {app: db}}}]\n    ports: [{protocol: TCP, port: 80}]\n  - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]\n    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]\n<\/code><\/pre>\n<p>Các policy cộng dồn: <code>api<\/code> nhận được từ <code>web<\/code> (policy 2) <strong>hoặc<\/strong> từ namespace monitoring (policy 4).<\/p>", "docs": [["Network Policies", "https://kubernetes.io/docs/concepts/services-networking/network-policies/"], ["Declare Network Policy", "https://kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/"]]}, {"id": 18, "slug": "ingress", "dir": "18-ingress", "title": "Ingress, IngressClass và TLS", "level": 4, "env": "any", "minutes": 30, "comps": ["net:4"], "goal": "<p>Viết Ingress định tuyến theo host và path tới nhiều Service, gắn chứng chỉ TLS, và chọn IngressClass mặc định.<\/p>", "concepts": "<ul>\n<li>Ingress chỉ là bản mô tả; cần một <strong>Ingress controller<\/strong> (Traefik, HAProxy, NGINX…) để thực thi. <code>ingressClassName<\/code> chọn controller nào xử lý.<\/li>\n<li><code>pathType<\/code>: <code>Prefix<\/code> (khớp theo từng đoạn <code>/<\/code>), <code>Exact<\/code> (khớp đúng), <code>ImplementationSpecific<\/code>.<\/li>\n<li>TLS: Secret kiểu <code>kubernetes.io/tls<\/code> có <code>tls.crt<\/code> và <code>tls.key<\/code>, khai báo trong <code>spec.tls<\/code> cùng danh sách host.<\/li>\n<li>Annotation <code>ingressclass.kubernetes.io/is-default-class: \"true\"<\/code> trên IngressClass làm nó mặc định cho Ingress không ghi class.<\/li>\n<li>Dự án ingress-nginx đã ngừng phát triển; hướng mới là Gateway API (lab 19). Đề thi vẫn hỏi cả hai.<\/li>\n<\/ul>", "setup_note": "<p>Lab chấm theo nội dung object, không cần controller. Muốn thấy traffic thật, cài một controller (ví dụ Traefik bằng Helm) và đổi <code>ingressClassName<\/code> cho khớp.<\/p>", "tasks": ["<p>Tạo chứng chỉ tự ký cho <code>shop.lab.local<\/code> và Secret TLS <code>shop-tls<\/code> trong <code>lab18<\/code>.<\/p>", "<p>Tạo Ingress <code>shop<\/code> (class <code>lab-ingress<\/code>) cho host <code>shop.lab.local<\/code>: path <code>/api<\/code> (Prefix) tới Service <code>api<\/code> cổng 8080, path <code>/<\/code> (Prefix) tới Service <code>web<\/code> cổng 80, dùng TLS <code>shop-tls<\/code>.<\/p>", "<p>Tạo Ingress <code>docs<\/code> không ghi <code>ingressClassName<\/code>, host <code>docs.lab.local<\/code>, path <code>/guide<\/code> kiểu <strong>Exact<\/strong> tới <code>web:80<\/code>.<\/p>", "<p>Đặt IngressClass <code>lab-ingress<\/code> làm mặc định của cluster.<\/p>"], "hints": [["Tạo cert và Secret", "<p><code>openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj \"/CN=shop.lab.local\"<\/code> rồi <code>kubectl create secret tls shop-tls --cert=tls.crt --key=tls.key -n lab18<\/code><\/p>"], ["Sinh Ingress bằng lệnh", "<p><code>kubectl create ingress shop -n lab18 --class=lab-ingress --rule=\"shop.lab.local/api*=api:8080,tls=shop-tls\" --rule=\"shop.lab.local/*=web:80,tls=shop-tls\"<\/code> (dấu <code>*<\/code> = Prefix)<\/p>"]], "solution": "<pre><code class=\"language-bash\">openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj &quot;/CN=shop.lab.local&quot;\nkubectl create secret tls shop-tls -n lab18 --cert=tls.crt --key=tls.key\nkubectl create ingress shop -n lab18 --class=lab-ingress \\\n  --rule=&quot;shop.lab.local/api*=api:8080,tls=shop-tls&quot; \\\n  --rule=&quot;shop.lab.local/*=web:80,tls=shop-tls&quot;\nkubectl create ingress docs -n lab18 --rule=&quot;docs.lab.local/guide=web:80&quot;\nkubectl annotate ingressclass lab-ingress ingressclass.kubernetes.io/is-default-class=true\nkubectl describe ingress shop -n lab18\n<\/code><\/pre>", "docs": [["Ingress", "https://kubernetes.io/docs/concepts/services-networking/ingress/"], ["Ingress controllers", "https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/"]]}, {"id": 19, "slug": "gateway-api", "dir": "19-gateway-api", "title": "Gateway API, HTTPRoute và ReferenceGrant", "level": 4, "env": "any", "minutes": 40, "comps": ["net:3"], "goal": "<p>Dựng định tuyến L7 bằng Gateway API: Gateway do đội hạ tầng quản lý, HTTPRoute của đội ứng dụng, chia traffic canary theo weight và theo header, và cho phép tham chiếu chéo namespace.<\/p>", "concepts": "<ul>\n<li><strong>GatewayClass<\/strong> (loại controller) → <strong>Gateway<\/strong> (listener: cổng, giao thức, TLS, namespace nào được gắn route) → <strong>HTTPRoute<\/strong> (match theo host, path, header; gửi tới <code>backendRefs<\/code> có <code>weight<\/code>).<\/li>\n<li><code>allowedRoutes.namespaces.from<\/code>: <code>Same<\/code> (mặc định), <code>All<\/code>, hoặc <code>Selector<\/code> theo label namespace.<\/li>\n<li>Route tham chiếu Service ở <strong>namespace khác<\/strong> chỉ hợp lệ khi namespace đích có <strong>ReferenceGrant<\/strong> cho phép.<\/li>\n<li>Kiểm tra trạng thái: <code>kubectl describe httproute<\/code>, các condition <code>Accepted<\/code> và <code>ResolvedRefs<\/code> (cần controller thật).<\/li>\n<\/ul>", "setup_note": "<p>Setup cài CRD Gateway API v1.6.3 (bản standard) từ GitHub nếu cluster chưa có, và tạo GatewayClass <code>lab-gc<\/code>. Lab chấm theo nội dung object. Muốn thấy traffic thật, cài một implementation như Envoy Gateway hoặc NGINX Gateway Fabric và đổi <code>gatewayClassName<\/code>.<\/p>", "tasks": ["<p>Gắn label <code>gateway-access=true<\/code> cho namespace <code>lab19-app<\/code>.<\/p>", "<p>Trong <code>lab19-infra<\/code>, tạo Gateway <code>public<\/code> (class <code>lab-gc<\/code>) có listener tên <code>http<\/code>, HTTP cổng 80, chỉ nhận route từ namespace có label <code>gateway-access=true<\/code>.<\/p>", "<p>Trong <code>lab19-app<\/code>, tạo HTTPRoute <code>shop<\/code> gắn vào <code>public<\/code>, host <code>shop.lab.local<\/code>, gồm 3 rule:\nrequest có header <code>x-canary: \"true\"<\/code> đi <strong>hết<\/strong> vào <code>api-v2:8080<\/code>;\npath <code>/api<\/code> (PathPrefix) chia <code>api:8080<\/code> weight 90 và <code>api-v2:8080<\/code> weight 10;\ncòn lại (<code>/<\/code>) vào <code>web:80<\/code>.<\/p>", "<p>Đội hạ tầng tạo HTTPRoute <code>admin<\/code> trong <code>lab19-infra<\/code> (host <code>admin.lab.local<\/code>) gửi tới Service <code>admin<\/code> cổng 80 ở <code>lab19-app<\/code>. Tạo route đó và ReferenceGrant <code>allow-infra-routes<\/code> trong <code>lab19-app<\/code> cho phép HTTPRoute từ <code>lab19-infra<\/code> tham chiếu Service.<\/p>"], "hints": [["Khung Gateway", "<p><code>kubectl explain gateway.spec.listeners.allowedRoutes --recursive<\/code><\/p>"], ["Match theo header", "<p><code>matches: [{headers: [{name: x-canary, value: \"true\"}]}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl label ns lab19-app gateway-access=true\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata: {name: public, namespace: lab19-infra}\nspec:\n  gatewayClassName: lab-gc\n  listeners:\n  - name: http\n    protocol: HTTP\n    port: 80\n    allowedRoutes:\n      namespaces:\n        from: Selector\n        selector: {matchLabels: {gateway-access: &quot;true&quot;}}\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: shop, namespace: lab19-app}\nspec:\n  parentRefs: [{name: public, namespace: lab19-infra}]\n  hostnames: [&quot;shop.lab.local&quot;]\n  rules:\n  - matches: [{headers: [{name: x-canary, value: &quot;true&quot;}]}]\n    backendRefs: [{name: api-v2, port: 8080}]\n  - matches: [{path: {type: PathPrefix, value: /api}}]\n    backendRefs:\n    - {name: api, port: 8080, weight: 90}\n    - {name: api-v2, port: 8080, weight: 10}\n  - matches: [{path: {type: PathPrefix, value: /}}]\n    backendRefs: [{name: web, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: admin, namespace: lab19-infra}\nspec:\n  parentRefs: [{name: public}]\n  hostnames: [&quot;admin.lab.local&quot;]\n  rules:\n  - backendRefs: [{name: admin, namespace: lab19-app, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: ReferenceGrant\nmetadata: {name: allow-infra-routes, namespace: lab19-app}\nspec:\n  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: lab19-infra}]\n  to: [{group: &quot;&quot;, kind: Service}]\n<\/code><\/pre>", "docs": [["Gateway API (Kubernetes docs)", "https://kubernetes.io/docs/concepts/services-networking/gateway/"], ["Gateway API guides", "https://gateway-api.sigs.k8s.io/guides/"], ["HTTP traffic splitting", "https://gateway-api.sigs.k8s.io/guides/traffic-splitting/"]]}, {"id": 20, "slug": "volumes", "dir": "20-volumes", "title": "Volume: emptyDir, hostPath, projected và Downward API", "level": 5, "env": "kind", "minutes": 30, "comps": ["stor:1"], "goal": "<p>Chọn đúng loại volume cho từng nhu cầu: chia sẻ dữ liệu giữa container trong Pod, đọc ghi thư mục của node, và gom nhiều nguồn cấu hình vào một thư mục.<\/p>", "concepts": "<ul>\n<li><strong>emptyDir<\/strong> sống theo Pod, dùng chung giữa các container. <code>medium: Memory<\/code> là tmpfs (tính vào memory limit), <code>sizeLimit<\/code> giới hạn dung lượng.<\/li>\n<li><strong>hostPath<\/strong> gắn thư mục của node vào Pod; dữ liệu gắn với một node và là rủi ro bảo mật. <code>type: DirectoryOrCreate<\/code> tự tạo thư mục.<\/li>\n<li><strong>projected<\/strong> gộp <code>configMap<\/code>, <code>secret<\/code>, <code>downwardAPI<\/code>, <code>serviceAccountToken<\/code> vào một thư mục.<\/li>\n<li><strong>Downward API<\/strong> đưa thông tin của chính Pod (tên, namespace, IP, node, label, resources) vào biến môi trường hoặc file.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab20<\/code>, tạo Pod <code>shared<\/code> có 2 container dùng chung emptyDir <code>data<\/code> (tmpfs, tối đa 64Mi) gắn tại <code>/data<\/code>: container <code>writer<\/code> (<code>busybox:1.36<\/code>) ghi <code>date<\/code> vào <code>/data/out.log<\/code> mỗi 2 giây; container <code>reader<\/code> (<code>busybox:1.36<\/code>) chạy <code>tail -F /data/out.log<\/code>.<\/p>", "<p>Tạo Pod <code>hostlog<\/code> (<code>busybox:1.36<\/code>) chạy trên <code>$NODE1<\/code>, gắn hostPath <code>/var/log/lab20<\/code> (tự tạo nếu chưa có) tại <code>/logs<\/code>, và ghi file <code>/logs/hello.txt<\/code> có nội dung <code>hello from pod<\/code>.<\/p>", "<p>Tạo Pod <code>info<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có biến <code>POD_IP<\/code> và <code>NODE_NAME<\/code> lấy từ Downward API, và một projected volume tại <code>/etc/info<\/code> gồm: ConfigMap <code>app-cfg<\/code> (có sẵn), label của Pod vào file <code>labels<\/code>, và token ServiceAccount hạn 3600 giây vào file <code>token<\/code>.<\/p>"], "hints": [["Ghi vào emptyDir trong vòng lặp", "<p><code>sh -c 'while true; do date &gt;&gt; /data/out.log; sleep 2; done'<\/code><\/p>"], ["Pod chạy trên một node cụ thể", "<p>Dùng <code>nodeName: &lt;node&gt;<\/code> hoặc <code>nodeSelector: {kubernetes.io/hostname: &lt;node&gt;}<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: shared, namespace: lab20}\nspec:\n  volumes:\n  - name: data\n    emptyDir: {medium: Memory, sizeLimit: 64Mi}\n  containers:\n  - name: writer\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;while true; do date &gt;&gt; /data/out.log; sleep 2; done&quot;]\n    volumeMounts: [{name: data, mountPath: /data}]\n  - name: reader\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -F /data/out.log&quot;]\n    volumeMounts: [{name: data, mountPath: /data}]\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: hostlog, namespace: lab20}\nspec:\n  nodeSelector: {kubernetes.io/hostname: &lt;NODE1&gt;}\n  volumes:\n  - name: logs\n    hostPath: {path: /var/log/lab20, type: DirectoryOrCreate}\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo 'hello from pod' &gt; /logs/hello.txt; sleep 3600&quot;]\n    volumeMounts: [{name: logs, mountPath: /logs}]\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: info, namespace: lab20, labels: {app: info, tier: demo}}\nspec:\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    env:\n    - name: POD_IP\n      valueFrom: {fieldRef: {fieldPath: status.podIP}}\n    - name: NODE_NAME\n      valueFrom: {fieldRef: {fieldPath: spec.nodeName}}\n    volumeMounts: [{name: info, mountPath: /etc/info}]\n  volumes:\n  - name: info\n    projected:\n      sources:\n      - configMap: {name: app-cfg}\n      - downwardAPI:\n          items: [{path: labels, fieldRef: {fieldPath: metadata.labels}}]\n      - serviceAccountToken: {path: token, expirationSeconds: 3600}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl logs shared -n lab20 -c reader\n./lab ssh $NODE1      # cat /var/log/lab20/hello.txt\nkubectl exec info -n lab20 -- sh -c 'env | grep -E &quot;POD_IP|NODE_NAME&quot;; ls /etc/info'\n<\/code><\/pre>", "docs": [["Volumes", "https://kubernetes.io/docs/concepts/storage/volumes/"], ["Projected volumes", "https://kubernetes.io/docs/concepts/storage/projected-volumes/"], ["Downward API", "https://kubernetes.io/docs/concepts/workloads/pods/downward-api/"]]}, {"id": 21, "slug": "pv-pvc", "dir": "21-pv-pvc", "title": "PersistentVolume, PVC và reclaim policy", "level": 5, "env": "any", "minutes": 30, "comps": ["stor:2", "stor:1"], "goal": "<p>Cấp phát lưu trữ thủ công: tạo PV, để PVC bind đúng PV, dùng trong Pod, và tái sử dụng một PV đã <code>Released<\/code> mà không mất dữ liệu.<\/p>", "concepts": "<ul>\n<li>PVC bind với PV khi khớp <strong>storageClassName<\/strong>, <strong>accessModes<\/strong> (PV phải có mode PVC xin) và <strong>dung lượng<\/strong> (PV ≥ PVC). Một PV chỉ bind với một PVC.<\/li>\n<li>Access mode: <code>ReadWriteOnce<\/code> (một node), <code>ReadOnlyMany<\/code>, <code>ReadWriteMany<\/code>, <code>ReadWriteOncePod<\/code> (một Pod).<\/li>\n<li>Reclaim policy: <code>Retain<\/code> (xóa PVC thì PV thành <code>Released<\/code>, dữ liệu còn), <code>Delete<\/code> (xóa luôn disk). PV <code>Released<\/code> vẫn giữ <code>claimRef<\/code> cũ nên không bind lại được cho tới khi admin gỡ <code>claimRef<\/code>.<\/li>\n<li><code>spec.volumeName<\/code> trong PVC chỉ định đích danh PV muốn bind.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo PV <code>pv-log<\/code>: 1Gi, <code>ReadWriteOnce<\/code>, reclaim <code>Retain<\/code>, storageClassName <code>manual<\/code>, hostPath <code>/mnt/lab21/log<\/code> (tự tạo).<\/p>", "<p>Trong <code>lab21<\/code>, tạo PVC <code>log-claim<\/code> xin 500Mi <code>ReadWriteOnce<\/code> class <code>manual<\/code>. Nó phải bind với <code>pv-log<\/code>.<\/p>", "<p>Tạo Pod <code>logger<\/code> (<code>busybox:1.36<\/code>) dùng <code>log-claim<\/code> tại <code>/log<\/code>, ghi <code>ok<\/code> vào <code>/log/app.log<\/code> rồi <code>sleep 3600<\/code>.<\/p>", "<p>PV <code>pv-old<\/code> đang ở trạng thái <code>Released<\/code> sau khi PVC cũ bị xóa. Đưa nó về <code>Available<\/code> <strong>mà không xóa và tạo lại PV<\/strong>, rồi tạo PVC <code>reuse<\/code> trong <code>lab21<\/code> bind <strong>đích danh<\/strong> vào <code>pv-old<\/code>.<\/p>"], "hints": [["PVC đứng Pending?", "<p><code>kubectl describe pvc log-claim -n lab21<\/code> và so storageClassName, accessModes, dung lượng với PV.<\/p>"], ["Gỡ claimRef", "<p><code>kubectl patch pv pv-old --type=json -p '[{\"op\":\"remove\",\"path\":\"/spec/claimRef\"}]'<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: PersistentVolume\nmetadata: {name: pv-log}\nspec:\n  capacity: {storage: 1Gi}\n  accessModes: [ReadWriteOnce]\n  persistentVolumeReclaimPolicy: Retain\n  storageClassName: manual\n  hostPath: {path: /mnt/lab21/log, type: DirectoryOrCreate}\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: log-claim, namespace: lab21}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual\n  resources: {requests: {storage: 500Mi}}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: logger, namespace: lab21}\nspec:\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo ok &gt; /log/app.log; sleep 3600&quot;]\n    volumeMounts: [{name: log, mountPath: /log}]\n  volumes:\n  - name: log\n    persistentVolumeClaim: {claimName: log-claim}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pv pv-old                     # STATUS Released, CLAIM lab21-old/data\nkubectl patch pv pv-old --type=json -p '[{&quot;op&quot;:&quot;remove&quot;,&quot;path&quot;:&quot;/spec/claimRef&quot;}]'\nkubectl get pv pv-old                     # Available\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: reuse, namespace: lab21}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual-old\n  volumeName: pv-old\n  resources: {requests: {storage: 1Gi}}\n<\/code><\/pre>", "docs": [["Persistent Volumes", "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"], ["Configure a Pod to use a PersistentVolume", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-persistent-volume-storage/"]]}, {"id": 22, "slug": "storageclass-statefulset", "dir": "22-storageclass-statefulset", "title": "StorageClass, dynamic provisioning và StatefulSet", "level": 5, "env": "any", "minutes": 35, "comps": ["stor:0", "stor:2"], "goal": "<p>Để cluster tự cấp phát volume: tạo StorageClass, đặt nó làm mặc định, hiểu <code>WaitForFirstConsumer<\/code>, và cho mỗi replica của StatefulSet một volume riêng.<\/p>", "concepts": "<ul>\n<li>StorageClass gồm <code>provisioner<\/code>, <code>parameters<\/code>, <code>reclaimPolicy<\/code> (mặc định <code>Delete<\/code>), <code>volumeBindingMode<\/code> (<code>Immediate<\/code> hoặc <code>WaitForFirstConsumer<\/code>), <code>allowVolumeExpansion<\/code>.<\/li>\n<li><code>WaitForFirstConsumer<\/code>: PVC đứng <code>Pending<\/code> cho tới khi có Pod dùng nó, để disk được tạo đúng zone/node của Pod.<\/li>\n<li>Annotation <code>storageclass.kubernetes.io/is-default-class: \"true\"<\/code> chọn lớp mặc định cho PVC không ghi <code>storageClassName<\/code>. Chỉ nên có <strong>một<\/strong> lớp mặc định.<\/li>\n<li>StatefulSet với <code>volumeClaimTemplates<\/code> tạo PVC tên <code>&lt;template&gt;-&lt;sts&gt;-&lt;số&gt;<\/code>; PVC <strong>không<\/strong> bị xóa khi scale xuống (trừ khi đặt <code>persistentVolumeClaimRetentionPolicy<\/code>).<\/li>\n<\/ul>", "setup_note": "<p>Setup in ra provisioner của StorageClass mặc định hiện tại (với kind là <code>rancher.io/local-path<\/code>). Dùng đúng provisioner đó cho StorageClass mới.<\/p>", "tasks": ["<p>Tạo StorageClass <code>fast<\/code> dùng cùng provisioner với StorageClass mặc định hiện tại, reclaim <code>Retain<\/code>, <code>WaitForFirstConsumer<\/code>, cho phép mở rộng volume.<\/p>", "<p>Đặt <code>fast<\/code> làm StorageClass mặc định, và lớp mặc định cũ <strong>không<\/strong> còn là mặc định.<\/p>", "<p>Trong <code>lab22<\/code>, tạo PVC <code>data<\/code> 1Gi <code>ReadWriteOnce<\/code> <strong>không ghi<\/strong> <code>storageClassName<\/code>. Ghi trạng thái của nó ngay sau khi tạo (<code>Pending<\/code> hay <code>Bound<\/code>) vào <code>~/cka-answers/22-phase.txt<\/code>. Sau đó tạo Pod <code>app<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) dùng PVC này tại <code>/data<\/code> để PVC chuyển <code>Bound<\/code>.<\/p>", "<p>Tạo headless Service <code>db<\/code> và StatefulSet <code>db<\/code> (2 replica, <code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có <code>volumeClaimTemplates<\/code> tên <code>data<\/code>, 1Gi, class <code>fast<\/code>, gắn tại <code>/var/lib/db<\/code>.<\/p>"], "hints": [["Xem provisioner và lớp mặc định", "<p><code>kubectl get sc<\/code> (cột PROVISIONER, dòng có <code>(default)<\/code>)<\/p>"], ["Bỏ mặc định của lớp cũ", "<p><code>kubectl patch sc &lt;tên&gt; -p '{\"metadata\":{\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"false\"}}}'<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get sc        # standard (default)   rancher.io/local-path\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: fast\n  annotations: {storageclass.kubernetes.io/is-default-class: &quot;true&quot;}\nprovisioner: rancher.io/local-path\nreclaimPolicy: Retain\nvolumeBindingMode: WaitForFirstConsumer\nallowVolumeExpansion: true\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl patch sc standard -p '{&quot;metadata&quot;:{&quot;annotations&quot;:{&quot;storageclass.kubernetes.io/is-default-class&quot;:&quot;false&quot;}}}'\nkubectl create -f pvc-data.yaml &amp;&amp; kubectl get pvc data -n lab22   # Pending (chờ consumer)\necho Pending &gt; ~/cka-answers/22-phase.txt\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: app, namespace: lab22}\nspec:\n  containers:\n  - {name: c, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;], volumeMounts: [{name: d, mountPath: /data}]}\n  volumes:\n  - {name: d, persistentVolumeClaim: {claimName: data}}\n---\napiVersion: v1\nkind: Service\nmetadata: {name: db, namespace: lab22}\nspec:\n  clusterIP: None\n  selector: {app: db}\n  ports: [{port: 5432}]\n---\napiVersion: apps/v1\nkind: StatefulSet\nmetadata: {name: db, namespace: lab22}\nspec:\n  serviceName: db\n  replicas: 2\n  selector: {matchLabels: {app: db}}\n  template:\n    metadata: {labels: {app: db}}\n    spec:\n      containers:\n      - name: db\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        volumeMounts: [{name: data, mountPath: /var/lib/db}]\n  volumeClaimTemplates:\n  - metadata: {name: data}\n    spec:\n      accessModes: [ReadWriteOnce]\n      storageClassName: fast\n      resources: {requests: {storage: 1Gi}}\n<\/code><\/pre>", "docs": [["Storage classes", "https://kubernetes.io/docs/concepts/storage/storage-classes/"], ["Dynamic provisioning", "https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/"], ["StatefulSets", "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"]]}, {"id": 23, "slug": "rbac", "dir": "23-rbac", "title": "RBAC với Role, ClusterRole và ServiceAccount", "level": 6, "env": "any", "minutes": 35, "comps": ["arch:0"], "goal": "<p>Cấp đúng và đủ quyền theo nguyên tắc tối thiểu cho ServiceAccount, user và group; kiểm tra bằng <code>kubectl auth can-i<\/code>; tìm và gỡ một quyền thừa.<\/p>", "concepts": "<ul>\n<li><strong>Role<\/strong> (trong namespace) và <strong>ClusterRole<\/strong> (toàn cluster) chứa <code>rules<\/code>: <code>apiGroups<\/code>, <code>resources<\/code> (kể cả subresource như <code>pods/log<\/code>, <code>pods/exec<\/code>), <code>verbs<\/code>, tùy chọn <code>resourceNames<\/code>.<\/li>\n<li><strong>RoleBinding<\/strong> gắn Role <em>hoặc ClusterRole<\/em> cho chủ thể <strong>trong một namespace<\/strong>. <strong>ClusterRoleBinding<\/strong> gắn ClusterRole cho toàn cluster.<\/li>\n<li>Chủ thể: <code>User<\/code>, <code>Group<\/code>, <code>ServiceAccount<\/code> (<code>system:serviceaccount:&lt;ns&gt;:&lt;tên&gt;<\/code>). RBAC chỉ <strong>cho phép<\/strong>, không có luật từ chối.<\/li>\n<li>ClusterRole có sẵn: <code>view<\/code>, <code>edit<\/code>, <code>admin<\/code>, <code>cluster-admin<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab23<\/code>, tạo ServiceAccount <code>deployer<\/code> và Role <code>deploy-manager<\/code> cho phép <code>get, list, watch, create, update, patch, delete<\/code> trên <code>deployments<\/code> và chỉ <code>get, list<\/code> trên <code>pods<\/code>. Gắn Role cho <code>deployer<\/code> bằng RoleBinding <code>deployer-binding<\/code>.<\/p>", "<p>Tạo ClusterRole <code>node-reader<\/code> (<code>get, list, watch<\/code> trên <code>nodes<\/code>) và ClusterRoleBinding <code>ops-node-reader<\/code> gắn cho group <code>ops-team<\/code>.<\/p>", "<p>User <code>jane<\/code> chỉ được đọc Pod và log của Pod trong <code>lab23<\/code>. Tạo Role <code>log-reader<\/code> và RoleBinding <code>jane-logs<\/code>.<\/p>", "<p>ServiceAccount <code>auditor<\/code> (tạo mới trong <code>lab23<\/code>) được quyền của ClusterRole có sẵn <code>view<\/code>, nhưng <strong>chỉ trong<\/strong> namespace <code>lab23<\/code>.<\/p>", "<p>ServiceAccount <code>legacy-bot<\/code> trong <code>lab23<\/code> đang xóa được Secret, việc này không được phép. Tìm binding cấp quyền đó, ghi tên binding vào <code>~/cka-answers/23-binding.txt<\/code>, rồi xóa binding.<\/p>"], "hints": [["Kiểm tra quyền", "<p><code>kubectl auth can-i delete deployments -n lab23 --as=system:serviceaccount:lab23:deployer<\/code> hoặc <code>--as=jane<\/code>, <code>--as=x --as-group=ops-team<\/code><\/p>"], ["Tìm binding của một ServiceAccount", "<p><code>kubectl get rolebinding,clusterrolebinding -A -o wide | grep legacy-bot<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create sa deployer -n lab23\nkubectl create role deploy-manager -n lab23 --verb=get,list,watch,create,update,patch,delete --resource=deployments\n# Role tạo bằng lệnh chỉ có một bộ verb; thêm rule cho pods bằng edit:\nkubectl edit role deploy-manager -n lab23\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">rules:\n- apiGroups: [&quot;apps&quot;]\n  resources: [&quot;deployments&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;, &quot;watch&quot;, &quot;create&quot;, &quot;update&quot;, &quot;patch&quot;, &quot;delete&quot;]\n- apiGroups: [&quot;&quot;]\n  resources: [&quot;pods&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;]\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create rolebinding deployer-binding -n lab23 --role=deploy-manager --serviceaccount=lab23:deployer\nkubectl create clusterrole node-reader --verb=get,list,watch --resource=nodes\nkubectl create clusterrolebinding ops-node-reader --clusterrole=node-reader --group=ops-team\nkubectl create role log-reader -n lab23 --verb=get,list --resource=pods,pods/log\nkubectl create rolebinding jane-logs -n lab23 --role=log-reader --user=jane\nkubectl create sa auditor -n lab23\nkubectl create rolebinding auditor-view -n lab23 --clusterrole=view --serviceaccount=lab23:auditor\n\nkubectl get rolebinding,clusterrolebinding -A -o wide | grep legacy-bot\necho ci-secrets-admin &gt; ~/cka-answers/23-binding.txt\nkubectl delete clusterrolebinding ci-secrets-admin\n\nkubectl auth can-i delete secrets -n lab23 --as=system:serviceaccount:lab23:legacy-bot   # no\n<\/code><\/pre>", "docs": [["Using RBAC Authorization", "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"], ["Service accounts", "https://kubernetes.io/docs/concepts/security/service-accounts/"]]}, {"id": 24, "slug": "users-csr-kubeconfig", "dir": "24-users-csr-kubeconfig", "title": "User mới bằng chứng chỉ, CSR và kubeconfig", "level": 6, "env": "any", "minutes": 35, "comps": ["arch:0"], "goal": "<p>Cấp quyền truy cập cho một lập trình viên từ đầu: tạo khóa và CSR, để cluster ký chứng chỉ, dựng kubeconfig riêng, phân quyền theo group, và thử đăng nhập.<\/p>", "concepts": "<ul>\n<li>Kubernetes không có object User. Với chứng chỉ client: <strong>CN<\/strong> là tên user, <strong>O<\/strong> là group.<\/li>\n<li>CertificateSigningRequest với <code>signerName: kubernetes.io/kube-apiserver-client<\/code> và <code>usages: [client auth]<\/code>; admin chạy <code>kubectl certificate approve<\/code>, chứng chỉ nằm ở <code>.status.certificate<\/code>.<\/li>\n<li>kubeconfig gồm <code>clusters<\/code> (server + CA), <code>users<\/code> (cert + key), <code>contexts<\/code> (ghép hai cái trên). <code>--embed-certs<\/code> nhúng nội dung vào file thay vì trỏ đường dẫn.<\/li>\n<li>Phân quyền cho <strong>group<\/strong> tiện hơn từng user: thêm người chỉ cần cấp cert có <code>O=&lt;group&gt;<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo khóa RSA 2048 và CSR cho user <code>dev1<\/code> thuộc group <code>developers<\/code>, lưu tại <code>~/cka-answers/dev1.key<\/code> và <code>~/cka-answers/dev1.csr<\/code>.<\/p>", "<p>Gửi CertificateSigningRequest tên <code>dev1<\/code> (signer client của API server, hạn 1 ngày), duyệt nó, và lưu chứng chỉ vào <code>~/cka-answers/dev1.crt<\/code>.<\/p>", "<p>Tạo file kubeconfig <strong>riêng<\/strong> <code>~/cka-answers/dev1.kubeconfig<\/code> (không sửa <code>~/.kube/config<\/code>) có cluster giống cluster hiện tại, user <code>dev1<\/code> với cert nhúng sẵn, context <code>dev1@lab<\/code> dùng namespace <code>lab24<\/code>, và đặt nó là context hiện tại trong file đó.<\/p>", "<p>Group <code>developers<\/code> được <code>get, list, watch, create, delete<\/code> Pod và Deployment trong <code>lab24<\/code>, không gì khác.<\/p>", "<p>Kiểm tra: dùng <code>--kubeconfig ~/cka-answers/dev1.kubeconfig<\/code>, tạo được Deployment <code>hello<\/code> (<code>nginx:1.27<\/code>) trong <code>lab24<\/code> nhưng <strong>không<\/strong> xem được node.<\/p>"], "hints": [["Tạo CSR với group", "<p><code>openssl req -new -key dev1.key -subj \"/CN=dev1/O=developers\" -out dev1.csr<\/code><\/p>"], ["Lấy server và CA của cluster hiện tại", "<p><code>kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}'<\/code> và <code>…certificate-authority-data<\/code> (base64)<\/p>"]], "solution": "<pre><code class=\"language-bash\">cd ~/cka-answers\nopenssl genrsa -out dev1.key 2048\nopenssl req -new -key dev1.key -subj &quot;/CN=dev1/O=developers&quot; -out dev1.csr\ncat &lt;&lt;EOF | kubectl apply -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\nmetadata: {name: dev1}\nspec:\n  request: $(base64 -w0 &lt; dev1.csr)\n  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 86400\n  usages: [client auth]\nEOF\nkubectl certificate approve dev1\nkubectl get csr dev1 -o jsonpath='{.status.certificate}' | base64 -d &gt; dev1.crt\n\nSERVER=$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')\nkubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d &gt; ca.crt\nK=&quot;--kubeconfig=dev1.kubeconfig&quot;\nkubectl config set-cluster lab $K --server=&quot;$SERVER&quot; --certificate-authority=ca.crt --embed-certs\nkubectl config set-credentials dev1 $K --client-certificate=dev1.crt --client-key=dev1.key --embed-certs\nkubectl config set-context dev1@lab $K --cluster=lab --user=dev1 --namespace=lab24\nkubectl config use-context dev1@lab $K\n\nkubectl create role dev -n lab24 --verb=get,list,watch,create,delete --resource=pods,deployments\nkubectl create rolebinding developers -n lab24 --role=dev --group=developers\n\nkubectl $K create deploy hello --image=nginx:1.27\nkubectl $K get nodes        # Forbidden\n<\/code><\/pre>", "docs": [["Certificates and certificate signing requests", "https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/"], ["Configure access to multiple clusters", "https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/"]]}, {"id": 25, "slug": "security-context-psa", "dir": "25-security-context-psa", "title": "securityContext và Pod Security Admission", "level": 6, "env": "any", "minutes": 30, "comps": ["work:4", "arch:0"], "goal": "<p>Bắt một namespace tuân thủ chuẩn bảo mật <code>restricted<\/code>, sửa workload cũ cho đạt chuẩn, và chạy container với filesystem chỉ đọc.<\/p>", "concepts": "<ul>\n<li>Pod Security Admission bật bằng <strong>label namespace<\/strong>: <code>pod-security.kubernetes.io/&lt;enforce|audit|warn&gt;=&lt;privileged|baseline|restricted&gt;<\/code>. <code>enforce<\/code> từ chối Pod mới; Pod đang chạy <strong>không<\/strong> bị đuổi.<\/li>\n<li>Chuẩn <code>restricted<\/code> đòi: <code>runAsNonRoot: true<\/code>, <code>allowPrivilegeEscalation: false<\/code>, <code>capabilities.drop: [ALL]<\/code>, <code>seccompProfile.type: RuntimeDefault<\/code> (hoặc <code>Localhost<\/code>), không hostPath/hostNetwork/privileged.<\/li>\n<li>Với Deployment, Pod bị từ chối không xuất hiện: lỗi nằm ở event <code>FailedCreate<\/code> của ReplicaSet.<\/li>\n<li><code>readOnlyRootFilesystem: true<\/code> chặn ghi vào filesystem của image; chỗ cần ghi thì gắn <code>emptyDir<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Bật cho namespace <code>lab25<\/code> chế độ <code>enforce<\/code> và <code>warn<\/code> ở mức <code>restricted<\/code>.<\/p>", "<p>Deployment <code>api<\/code> trong <code>lab25<\/code> đang chạy với root. Sau khi bật enforce, nó không tạo được Pod mới. Sửa <code>api<\/code> đạt chuẩn <code>restricted<\/code>, chạy với UID <code>1000<\/code>, rồi rollout lại để Pod mới được tạo.<\/p>", "<p>Tạo Pod <code>secure<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) đạt chuẩn <code>restricted<\/code>, root filesystem <strong>chỉ đọc<\/strong>, và ghi được vào <code>/tmp<\/code> nhờ một emptyDir.<\/p>"], "hints": [["Xem vì sao Pod bị từ chối", "<p><code>kubectl rollout restart deploy api -n lab25<\/code> rồi <code>kubectl describe rs -n lab25 -l app=api | grep -A2 FailedCreate<\/code><\/p>"], ["Thử nhanh với dry-run phía server", "<p><code>kubectl apply -f pod.yaml --dry-run=server<\/code> báo ngay vi phạm PSA mà không tạo gì.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl label ns lab25 pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted\nkubectl edit deploy api -n lab25\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">    spec:\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 1000\n        seccompProfile: {type: RuntimeDefault}\n      containers:\n      - name: busybox\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        securityContext:\n          allowPrivilegeEscalation: false\n          capabilities: {drop: [&quot;ALL&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: secure, namespace: lab25}\nspec:\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 1000\n    seccompProfile: {type: RuntimeDefault}\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities: {drop: [&quot;ALL&quot;]}\n    volumeMounts: [{name: tmp, mountPath: /tmp}]\n  volumes:\n  - {name: tmp, emptyDir: {}}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl exec secure -n lab25 -- touch /x        # Read-only file system\nkubectl exec secure -n lab25 -- touch /tmp/x    # được\n<\/code><\/pre>", "docs": [["Pod Security Standards", "https://kubernetes.io/docs/concepts/security/pod-security-standards/"], ["Pod Security Admission", "https://kubernetes.io/docs/concepts/security/pod-security-admission/"], ["Configure a Security Context", "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"]]}, {"id": 26, "slug": "helm", "dir": "26-helm", "title": "Helm từ chart đến rollback", "level": 7, "env": "any", "minutes": 35, "comps": ["arch:5"], "goal": "<p>Dùng Helm như trong công việc thật: tạo chart, cài release với values, nâng cấp giữ values cũ, quay lại revision tốt, render YAML để kiểm tra trước, và gỡ release.<\/p>", "concepts": "<ul>\n<li><strong>Chart<\/strong> là gói template + <code>values.yaml<\/code>; <strong>release<\/strong> là một lần cài chart vào cluster; mỗi lần <code>upgrade<\/code> hoặc <code>rollback<\/code> tạo một <strong>revision<\/strong> mới (lưu dạng Secret trong namespace của release).<\/li>\n<li><code>--set<\/code> và <code>-f values.yaml<\/code> ghi đè giá trị. <code>helm upgrade<\/code> <strong>không<\/strong> giữ <code>--set<\/code> cũ trừ khi thêm <code>--reuse-values<\/code>.<\/li>\n<li><code>helm template<\/code> render YAML ở máy, không cần cluster. <code>helm get values<\/code>, <code>helm history<\/code>, <code>helm rollback &lt;release&gt; &lt;revision&gt;<\/code>.<\/li>\n<li>Chart từ repo: <code>helm repo add<\/code>, <code>helm search repo<\/code>, <code>helm install … --version<\/code>. Chart từ OCI registry: <code>helm install x oci://…<\/code>.<\/li>\n<\/ul>", "setup_note": "<p>Cần Helm v3 trên máy chạy lab (<code>helm version<\/code>). Lab dùng chart tạo tại chỗ bằng <code>helm create<\/code>, không cần internet.<\/p>", "tasks": ["<p>Tạo chart <code>webapp<\/code> trong <code>~/cka-answers/lab26/<\/code> bằng <code>helm create<\/code>.<\/p>", "<p>Cài release <code>web<\/code> từ chart đó vào namespace <code>lab26<\/code> với 2 replica và image <code>nginx:1.27<\/code> (chart mặc định dùng repository <code>nginx<\/code>, chỉ cần đặt tag).<\/p>", "<p>Nâng cấp <code>web<\/code> để Service thành <code>NodePort<\/code>, <strong>giữ<\/strong> các giá trị đã đặt trước đó.<\/p>", "<p>Nâng cấp tiếp với image tag <code>1.99<\/code> (không tồn tại), thấy Pod lỗi, rồi rollback về revision có NodePort và <code>nginx:1.27<\/code>.<\/p>", "<p>Không cài, chỉ render chart với release tên <code>preview<\/code> và 3 replica, lưu vào <code>~/cka-answers/26-rendered.yaml<\/code>.<\/p>", "<p>Cài thử release <code>tmp<\/code> vào <code>lab26<\/code> rồi gỡ nó.<\/p>"], "hints": [["Đặt nhiều giá trị", "<p><code>--set replicaCount=2,image.tag=1.27<\/code><\/p>"], ["Xem revision", "<p><code>helm history web -n lab26<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">mkdir -p ~/cka-answers/lab26 &amp;&amp; cd ~/cka-answers/lab26\nhelm create webapp\nhelm install web ./webapp -n lab26 --set replicaCount=2,image.tag=1.27\nhelm upgrade web ./webapp -n lab26 --reuse-values --set service.type=NodePort\nhelm upgrade web ./webapp -n lab26 --reuse-values --set image.tag=1.99\nkubectl get pods -n lab26                       # ImagePullBackOff\nhelm history web -n lab26\nhelm rollback web 2 -n lab26\nhelm template preview ./webapp --set replicaCount=3 &gt; ~/cka-answers/26-rendered.yaml\nhelm install tmp ./webapp -n lab26\nhelm uninstall tmp -n lab26\nhelm list -n lab26\n<\/code><\/pre>", "docs": [["Helm quickstart", "https://helm.sh/docs/intro/quickstart/"], ["helm upgrade", "https://helm.sh/docs/helm/helm_upgrade/"]]}, {"id": 27, "slug": "kustomize", "dir": "27-kustomize", "title": "Kustomize với base và overlay", "level": 7, "env": "any", "minutes": 30, "comps": ["arch:5"], "goal": "<p>Tùy biến bộ manifest cho từng môi trường mà không sửa file gốc: overlay đổi namespace, tiền tố tên, label, số replica, image, cấu hình sinh tự động và patch.<\/p>", "concepts": "<ul>\n<li><code>kustomization.yaml<\/code> liệt kê <code>resources<\/code> rồi biến đổi: <code>namespace<\/code>, <code>namePrefix<\/code>, <code>labels<\/code>, <code>images<\/code>, <code>replicas<\/code>, <code>patches<\/code>.<\/li>\n<li><code>configMapGenerator<\/code> sinh ConfigMap có <strong>hậu tố hash<\/strong> theo nội dung, và tự sửa mọi chỗ tham chiếu. Đổi cấu hình là đổi tên ConfigMap, nên Deployment tự rollout. Trong overlay dùng <code>behavior: merge<\/code> để ghi đè key của base.<\/li>\n<li><code>kubectl kustomize &lt;dir&gt;<\/code> xem kết quả; <code>kubectl apply -k &lt;dir&gt;<\/code> áp dụng. kubectl có sẵn Kustomize, không cần cài thêm.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Base có sẵn ở <code>~/cka-answers/lab27/base<\/code> (Deployment <code>web<\/code>, Service <code>web<\/code>, ConfigMap <code>app-config<\/code> sinh bằng generator). Đọc nó.<\/p>", "<p>Tạo overlay <code>~/cka-answers/lab27/overlays/prod<\/code> dùng base đó, với: namespace <code>lab27<\/code>; tiền tố tên <code>prod-<\/code>; label <code>env=prod<\/code> gắn cả vào selector; 3 replica; image <code>nginx:1.28<\/code>; <code>MODE=prod<\/code> thay cho <code>MODE=dev<\/code>; container <code>web<\/code> có request <code>cpu: 100m<\/code>.<\/p>", "<p>Lưu kết quả render của overlay vào <code>~/cka-answers/27-rendered.yaml<\/code>, rồi áp dụng overlay vào cluster.<\/p>"], "hints": [["Ghi đè ConfigMap của base", "<pre><code class=\"language-yaml\">configMapGenerator:\n- name: app-config\n  behavior: merge\n  literals: [MODE=prod]\n<\/code><\/pre>"], ["Patch resources", "<p>File <code>resources.yaml<\/code> dạng strategic merge (Deployment tên <code>web<\/code>, container <code>web<\/code>) rồi <code>patches: [{path: resources.yaml}]<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\"># ~/cka-answers/lab27/overlays/prod/kustomization.yaml\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../../base]\nnamespace: lab27\nnamePrefix: prod-\nlabels:\n- pairs: {env: prod}\n  includeSelectors: true\nreplicas:\n- {name: web, count: 3}\nimages:\n- {name: nginx, newTag: &quot;1.28&quot;}\nconfigMapGenerator:\n- name: app-config\n  behavior: merge\n  literals: [MODE=prod]\npatches:\n- path: resources.yaml\n---\n# ~/cka-answers/lab27/overlays/prod/resources.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web}\nspec:\n  template:\n    spec:\n      containers:\n      - name: web\n        resources:\n          requests: {cpu: 100m}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl kustomize ~/cka-answers/lab27/overlays/prod &gt; ~/cka-answers/27-rendered.yaml\nkubectl apply -k ~/cka-answers/lab27/overlays/prod\nkubectl get deploy,svc,cm -n lab27\n<\/code><\/pre>", "docs": [["Declarative management with Kustomize", "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"], ["Kustomize reference", "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/"]]}, {"id": 28, "slug": "crd-operator", "dir": "28-crd-operator", "title": "CustomResourceDefinition và Operator", "level": 7, "env": "any", "minutes": 30, "comps": ["arch:7", "arch:6"], "goal": "<p>Mở rộng Kubernetes API bằng loại object của riêng bạn, có kiểm tra dữ liệu, tên viết tắt và cột hiển thị; hiểu Operator dùng CRD thế nào.<\/p>", "concepts": "<ul>\n<li>CRD khai báo <code>group<\/code>, <code>names<\/code> (<code>kind<\/code>, <code>plural<\/code>, <code>singular<\/code>, <code>shortNames<\/code>), <code>scope<\/code> (<code>Namespaced<\/code> hoặc <code>Cluster<\/code>), và các <code>versions<\/code> (một version là <code>storage: true<\/code>).<\/li>\n<li><code>openAPIV3Schema<\/code> kiểm tra dữ liệu ngay khi tạo: kiểu, <code>required<\/code>, <code>minimum<\/code>/<code>maximum<\/code>, <code>enum<\/code>. Object sai bị API từ chối.<\/li>\n<li><code>additionalPrinterColumns<\/code> thêm cột cho <code>kubectl get<\/code>.<\/li>\n<li><strong>Operator<\/strong> = CRD + controller theo dõi các object đó và vận hành phần mềm thay con người (cert-manager, Prometheus Operator, CloudNativePG…). Cài thường bằng Helm hoặc manifest.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo CRD <code>backups.ops.example.com<\/code>: kind <code>Backup<\/code>, namespaced, tên ngắn <code>bk<\/code>, version <code>v1<\/code>. Schema: <code>spec.schedule<\/code> (string, <strong>bắt buộc<\/strong>), <code>spec.retention<\/code> (integer từ 1 tới 30). Thêm hai cột <code>Schedule<\/code> và <code>Retention<\/code> cho <code>kubectl get<\/code>.<\/p>", "<p>Trong <code>lab28<\/code>, tạo Backup <code>nightly<\/code> với schedule <code>0 2 * * *<\/code>, retention <code>7<\/code>.<\/p>", "<p>Thử tạo Backup <code>bad<\/code> với retention <code>100<\/code>. API phải từ chối; không được có object <code>bad<\/code>.<\/p>", "<p>Ghi các tên ngắn của resource thuộc group <code>ops.example.com<\/code> (theo <code>kubectl api-resources<\/code>) vào <code>~/cka-answers/28-short.txt<\/code>.<\/p>"], "hints": [["Khung CRD", "<p>Xem ví dụ trong tài liệu \"Extend the Kubernetes API with CustomResourceDefinitions\" rồi sửa tên. <code>kubectl explain backup.spec<\/code> chạy được khi schema đúng.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata: {name: backups.ops.example.com}\nspec:\n  group: ops.example.com\n  scope: Namespaced\n  names: {kind: Backup, plural: backups, singular: backup, shortNames: [bk]}\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n        type: object\n        properties:\n          spec:\n            type: object\n            required: [schedule]\n            properties:\n              schedule: {type: string}\n              retention: {type: integer, minimum: 1, maximum: 30}\n    additionalPrinterColumns:\n    - {name: Schedule, type: string, jsonPath: .spec.schedule}\n    - {name: Retention, type: integer, jsonPath: .spec.retention}\n---\napiVersion: ops.example.com/v1\nkind: Backup\nmetadata: {name: nightly, namespace: lab28}\nspec: {schedule: &quot;0 2 * * *&quot;, retention: 7}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get bk -n lab28                # có cột SCHEDULE, RETENTION\nkubectl explain backup.spec\n# bad: The Backup &quot;bad&quot; is invalid: spec.retention: Invalid value: 100: must be less than or equal to 30\nkubectl api-resources --api-group=ops.example.com\necho bk &gt; ~/cka-answers/28-short.txt\n<\/code><\/pre>", "docs": [["Custom resources", "https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/"], ["Extend the API with CRDs", "https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/"], ["Operator pattern", "https://kubernetes.io/docs/concepts/extend-kubernetes/operator/"]]}, {"id": 29, "slug": "etcd-backup-restore", "dir": "29-etcd-backup-restore", "title": "Sao lưu và khôi phục etcd", "level": 7, "env": "kind", "minutes": 40, "comps": ["arch:3", "arch:2"], "goal": "<p>Chụp snapshot etcd đúng cách, và khôi phục cluster về thời điểm chụp khi dữ liệu bị thay đổi sau đó.<\/p>", "concepts": "<ul>\n<li>etcd bật TLS hai chiều: <code>etcdctl<\/code> cần <code>--endpoints<\/code>, <code>--cacert<\/code>, <code>--cert<\/code>, <code>--key<\/code>. Lấy đường dẫn từ <code>/etc/kubernetes/manifests/etcd.yaml<\/code>.<\/li>\n<li><code>etcdctl snapshot save<\/code> chụp; <code>etcdutl snapshot status<\/code> kiểm tra; <code>etcdutl snapshot restore --data-dir &lt;thư mục mới&gt;<\/code> khôi phục ra thư mục <strong>mới<\/strong>.<\/li>\n<li>Sau khi restore, sửa <code>hostPath<\/code> của volume <code>etcd-data<\/code> trong <code>etcd.yaml<\/code> trỏ sang thư mục mới. kubelet tự tạo lại Pod etcd; API server có thể mất 1–2 phút để trở lại.<\/li>\n<li>Restore đưa <strong>toàn bộ<\/strong> cluster về thời điểm chụp: object tạo sau đó biến mất.<\/li>\n<\/ul>", "setup_note": "<p>Setup cài <code>etcdctl<\/code> và <code>etcdutl<\/code> v3.6.16 vào node control plane nếu chưa có (tải từ GitHub), và tạo namespace <code>lab29-before<\/code>.<\/p>", "tasks": ["<p>Vào node control plane (<code>./lab ssh $CP<\/code>). Ghi giá trị <code>--data-dir<\/code> của etcd vào <code>/root/29-datadir.txt<\/code> trên node.<\/p>", "<p>Chụp snapshot etcd vào <code>/opt/etcd-backup.db<\/code> trên node control plane và kiểm tra nó bằng <code>etcdutl snapshot status<\/code>.<\/p>", "<p><strong>Sau<\/strong> khi chụp, tạo namespace <code>lab29-after<\/code> (giả lập thay đổi xảy ra sau lần sao lưu).<\/p>", "<p>Khôi phục snapshot ra <code>/var/lib/etcd-restore<\/code> và cho etcd chạy trên dữ liệu đó. Kết quả: <code>lab29-before<\/code> còn, <code>lab29-after<\/code> không còn.<\/p>"], "hints": [["Biến cho đỡ gõ", "<p><code>export ETCDCTL_API=3; E=\"--endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key\"<\/code><\/p>"], ["API server không trả lời sau khi sửa etcd.yaml?", "<p>Chờ 1–2 phút; xem <code>crictl ps -a | grep -E 'etcd|apiserver'<\/code> và <code>crictl logs &lt;id&gt;<\/code> trên node.<\/p>"]], "solution": "<pre><code class=\"language-bash\">./lab ssh $CP\ngrep data-dir /etc/kubernetes/manifests/etcd.yaml | cut -d= -f2 &gt; /root/29-datadir.txt   # /var/lib/etcd\nE=&quot;--endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key&quot;\netcdctl $E snapshot save /opt/etcd-backup.db\netcdutl snapshot status /opt/etcd-backup.db -w table\nexit\n\nkubectl create ns lab29-after\n\n./lab ssh $CP\netcdutl snapshot restore /opt/etcd-backup.db --data-dir /var/lib/etcd-restore\nvi /etc/kubernetes/manifests/etcd.yaml\n#   volumes:\n#   - hostPath: {path: /var/lib/etcd-restore, type: DirectoryOrCreate}\n#     name: etcd-data\n# (chỉ cần đổi hostPath; --data-dir trong container vẫn là /var/lib/etcd)\nwatch crictl ps      # chờ etcd và kube-apiserver chạy lại\nexit\nkubectl get ns | grep lab29        # chỉ còn lab29-before\n<\/code><\/pre>", "docs": [["Operating etcd clusters for Kubernetes", "https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/"], ["etcd disaster recovery", "https://etcd.io/docs/v3.6/op-guide/recovery/"]]}, {"id": 30, "slug": "kubeadm-upgrade", "dir": "30-kubeadm-upgrade", "title": "Nâng cấp cluster kubeadm 1.34 → 1.35", "level": 7, "env": "vm", "minutes": 60, "comps": ["arch:3", "arch:2"], "goal": "<p>Nâng một cluster đang chạy lên minor mới mà không làm gián đoạn ứng dụng: control plane trước, từng worker sau, đúng thứ tự drain và uncordon.<\/p>", "concepts": "<ul>\n<li>Mỗi lần chỉ nâng <strong>một<\/strong> minor. Thứ tự: <code>kubeadm<\/code> trên control plane → <code>kubeadm upgrade plan<\/code> → <code>kubeadm upgrade apply<\/code> → drain → nâng <code>kubelet<\/code> và <code>kubectl<\/code> → restart kubelet → uncordon. Control plane thứ hai trở đi và worker dùng <code>kubeadm upgrade node<\/code>.<\/li>\n<li>Version skew: kubelet được cũ hơn API server tối đa 3 minor, không bao giờ mới hơn. kubectl lệch ±1 minor.<\/li>\n<li>Gói bị <code>apt-mark hold<\/code> để không vô tình nâng; phải <code>unhold<\/code> trước khi cài phiên bản mới. Repo <code>pkgs.k8s.io<\/code> chia theo minor: đổi <code>/v1.34/<\/code> thành <code>/v1.35/<\/code>.<\/li>\n<li><code>kubeadm upgrade apply<\/code> tự gia hạn chứng chỉ control plane.<\/li>\n<\/ul>", "setup_note": "<p>Cần cluster từ lab 01 (Kubernetes v1.34). Chạy lab từ <code>cp-1<\/code>.<\/p>", "tasks": ["<p>Ghi phiên bản đích mà <code>kubeadm upgrade plan<\/code> đề xuất (sau khi nâng kubeadm) vào <code>~/cka-answers/30-target.txt<\/code>.<\/p>", "<p>Nâng control plane <code>cp-1<\/code> lên v1.35 (kubeadm, control plane, kubelet, kubectl).<\/p>", "<p>Nâng lần lượt <code>worker-1<\/code> rồi <code>worker-2<\/code>, mỗi node phải được drain trước và uncordon sau.<\/p>", "<p>Mọi node <code>Ready<\/code>, kubelet v1.35.x, không node nào còn <code>SchedulingDisabled<\/code>.<\/p>"], "hints": [["Xem phiên bản có trong repo", "<p><code>apt-cache madison kubeadm | head<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\"># cp-1\nsudo sed -i 's#/v1.34/#/v1.35/#' /etc/apt/sources.list.d/kubernetes.list\nsudo apt-get update &amp;&amp; apt-cache madison kubeadm | head -3\nsudo apt-mark unhold kubeadm &amp;&amp; sudo apt-get install -y kubeadm='1.35.*' &amp;&amp; sudo apt-mark hold kubeadm\nsudo kubeadm upgrade plan\nsudo kubeadm upgrade plan | grep -o 'kubeadm upgrade apply v[0-9.]*' | head -1 | awk '{print $4}' &gt; ~/cka-answers/30-target.txt\nsudo kubeadm upgrade apply $(cat ~/cka-answers/30-target.txt)\nkubectl drain cp-1 --ignore-daemonsets\nsudo apt-mark unhold kubelet kubectl &amp;&amp; sudo apt-get install -y kubelet='1.35.*' kubectl='1.35.*' &amp;&amp; sudo apt-mark hold kubelet kubectl\nsudo systemctl daemon-reload &amp;&amp; sudo systemctl restart kubelet\nkubectl uncordon cp-1\n\n# từng worker (ví dụ worker-1)\nkubectl drain worker-1 --ignore-daemonsets --delete-emptydir-data\nssh worker-1\n  sudo sed -i 's#/v1.34/#/v1.35/#' /etc/apt/sources.list.d/kubernetes.list &amp;&amp; sudo apt-get update\n  sudo apt-mark unhold kubeadm kubelet kubectl\n  sudo apt-get install -y kubeadm='1.35.*' &amp;&amp; sudo kubeadm upgrade node\n  sudo apt-get install -y kubelet='1.35.*' kubectl='1.35.*' &amp;&amp; sudo apt-mark hold kubeadm kubelet kubectl\n  sudo systemctl daemon-reload &amp;&amp; sudo systemctl restart kubelet\n  exit\nkubectl uncordon worker-1\nkubectl get nodes\n<\/code><\/pre>", "docs": [["Upgrading kubeadm clusters", "https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/"], ["Version skew policy", "https://kubernetes.io/releases/version-skew-policy/"]]}, {"id": 31, "slug": "control-plane-config", "dir": "31-control-plane-config", "title": "Chứng chỉ, cấu hình control plane và kubelet", "level": 7, "env": "kind", "minutes": 35, "comps": ["arch:2", "trouble:1", "arch:6"], "goal": "<p>Biết cấu hình của từng thành phần nằm ở đâu, đọc và sửa cờ của static pod an toàn, gia hạn chứng chỉ, và đọc cấu hình kubelet.<\/p>", "concepts": "<ul>\n<li>Control plane kubeadm: manifest ở <code>/etc/kubernetes/manifests<\/code>, chứng chỉ ở <code>/etc/kubernetes/pki<\/code>, kubeconfig ở <code>/etc/kubernetes/*.conf<\/code>. Sửa manifest là kubelet tự tạo lại Pod.<\/li>\n<li><code>kubeadm certs check-expiration<\/code> xem hạn; <code>kubeadm certs renew &lt;tên&gt;|all<\/code> gia hạn, sau đó phải restart thành phần dùng cert đó (di chuyển manifest ra rồi vào lại, hoặc <code>crictl stop<\/code> container).<\/li>\n<li>kubelet: cấu hình ở <code>/var/lib/kubelet/config.yaml<\/code> (<code>cgroupDriver<\/code>, <code>clusterDNS<\/code>, <code>staticPodPath<\/code>…), cờ thêm ở <code>/var/lib/kubelet/kubeadm-flags.env<\/code>.<\/li>\n<li>Trước khi sửa manifest, luôn sao lưu ra <strong>ngoài<\/strong> thư mục manifests (kubelet đọc mọi file trong đó).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi dải IP của Service (<code>--service-cluster-ip-range<\/code>) vào <code>~/cka-answers/31-svc-range.txt<\/code>.<\/p>", "<p>Ghi <code>cgroupDriver<\/code> và <code>clusterDNS<\/code> trong cấu hình kubelet của <code>$NODE1<\/code> vào <code>~/cka-answers/31-kubelet.txt<\/code> theo dạng <code>systemd 10.96.0.10<\/code>.<\/p>", "<p>Gia hạn chứng chỉ <code>apiserver<\/code> bằng kubeadm và cho kube-apiserver dùng chứng chỉ mới.<\/p>", "<p>Bật thêm admission plugin <code>AlwaysPullImages<\/code> cho kube-apiserver, giữ nguyên các plugin đang bật.<\/p>"], "hints": [["Restart kube-apiserver", "<p><code>mv /etc/kubernetes/manifests/kube-apiserver.yaml /root/ &amp;&amp; sleep 20 &amp;&amp; mv /root/kube-apiserver.yaml /etc/kubernetes/manifests/<\/code><\/p>"], ["Chứng chỉ apiserver đang dùng", "<p><code>openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -dates<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">./lab ssh $CP\ngrep service-cluster-ip-range /etc/kubernetes/manifests/kube-apiserver.yaml   # 10.96.0.0/12\nkubeadm certs check-expiration\nkubeadm certs renew apiserver\ncp /etc/kubernetes/manifests/kube-apiserver.yaml /root/kube-apiserver.yaml.bak\nvi /etc/kubernetes/manifests/kube-apiserver.yaml\n#   - --enable-admission-plugins=NodeRestriction,AlwaysPullImages\n# sửa manifest cũng làm kubelet tạo lại Pod, nên chứng chỉ mới được nạp\nexit\necho 10.96.0.0/12 &gt; ~/cka-answers/31-svc-range.txt\n\n./lab ssh $NODE1\ngrep -E 'cgroupDriver|clusterDNS' -A1 /var/lib/kubelet/config.yaml\nexit\necho &quot;systemd 10.96.0.10&quot; &gt; ~/cka-answers/31-kubelet.txt\n<\/code><\/pre>", "docs": [["Certificate management with kubeadm", "https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/"], ["Admission controllers", "https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/"], ["Set kubelet parameters via a config file", "https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/"]]}, {"id": 32, "slug": "control-plane-ha", "dir": "32-control-plane-ha", "title": "Thêm control plane cho cluster HA", "level": 7, "env": "vm", "minutes": 60, "comps": ["arch:4", "arch:2"], "goal": "<p>Biến cluster một control plane thành ba control plane với etcd xếp chồng (stacked), hiểu vai trò của endpoint chung và load balancer.<\/p>", "concepts": "<ul>\n<li>HA cần: một <strong>endpoint ổn định<\/strong> cho API (<code>--control-plane-endpoint<\/code>, thường là load balancer hoặc VIP như kube-vip), <strong>số lẻ<\/strong> control plane (3 hoặc 5) để etcd giữ quorum.<\/li>\n<li><code>kubeadm init --upload-certs<\/code> lưu cert control plane (mã hóa) vào Secret <code>kubeadm-certs<\/code>, hết hạn sau 2 giờ; tạo lại bằng <code>kubeadm init phase upload-certs --upload-certs<\/code>, lệnh này in ra <strong>certificate key<\/strong>.<\/li>\n<li>Join control plane: <code>kubeadm join &lt;endpoint&gt; --token … --discovery-token-ca-cert-hash … --control-plane --certificate-key …<\/code>.<\/li>\n<li>API server chạy song song trên cả 3 node; scheduler và controller-manager chỉ một bản làm việc (leader, giữ Lease trong <code>kube-system<\/code>).<\/li>\n<\/ul>", "setup_note": "<p>Cần cluster từ lab 01. Dựng thêm 2 máy ảo <code>cp-2<\/code> (192.168.56.13) và <code>cp-3<\/code> (192.168.56.14):<\/p>\n<pre><code class=\"language-bash\">cd env/kubeadm &amp;&amp; HA=1 vagrant up cp-2 cp-3\n<\/code><\/pre>\n<p>Lab dùng tên <code>k8s-api<\/code> trong <code>/etc/hosts<\/code> trỏ về cp-1 thay cho load balancer. Trong thực tế, đặt HAProxy hoặc kube-vip trước 3 API server.<\/p>", "tasks": ["<p>Trên <code>cp-1<\/code>, tạo lại certificate key và lệnh join.<\/p>", "<p>Join <code>cp-2<\/code> và <code>cp-3<\/code> làm control plane.<\/p>", "<p>Ghi số member etcd vào <code>~/cka-answers/32-etcd-members.txt<\/code>, và tên node đang giữ Lease <code>kube-scheduler<\/code> vào <code>~/cka-answers/32-leader.txt<\/code>.<\/p>"], "hints": [["Danh sách member etcd", "<p><code>kubectl -n kube-system exec etcd-cp-1 -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key member list -w table<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\"># cp-1\nsudo kubeadm init phase upload-certs --upload-certs        # in ra certificate key\nkubeadm token create --print-join-command\n# cp-2 và cp-3:\nsudo kubeadm join k8s-api:6443 --token &lt;t&gt; --discovery-token-ca-cert-hash sha256:&lt;h&gt; \\\n  --control-plane --certificate-key &lt;key&gt; --apiserver-advertise-address &lt;ip của node&gt;\nkubectl get nodes          # 3 control-plane\nkubectl -n kube-system exec etcd-cp-1 -- etcdctl … member list | wc -l &gt; ~/cka-answers/32-etcd-members.txt\nkubectl get lease kube-scheduler -n kube-system -o jsonpath='{.spec.holderIdentity}' | cut -d_ -f1 &gt; ~/cka-answers/32-leader.txt\n<\/code><\/pre>", "docs": [["Creating highly available clusters with kubeadm", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/"], ["Options for HA topology", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/ha-topology/"]]}, {"id": 33, "slug": "troubleshoot-apps", "dir": "33-troubleshoot-apps", "title": "Troubleshooting ứng dụng: sáu Deployment hỏng", "level": 8, "env": "any", "minutes": 40, "comps": ["trouble:3", "trouble:2", "work:3"], "goal": "<p>Chẩn đoán nhanh và sửa đúng sáu lỗi ứng dụng hay gặp nhất trong đề: image sai, lệnh sai, OOM, không xếp được node, thiếu cấu hình, probe sai.<\/p>", "concepts": "<ul>\n<li>Quy trình: <code>kubectl get pods<\/code> (STATUS, RESTARTS) → <code>kubectl describe pod<\/code> (Events, Last State, Conditions) → <code>kubectl logs<\/code> và <code>logs --previous<\/code> → sửa Deployment, không sửa Pod.<\/li>\n<li>Bảng tra STATUS: <code>ImagePullBackOff<\/code>/<code>ErrImagePull<\/code> (image), <code>CrashLoopBackOff<\/code> (container chết lặp lại: xem exit code và log), <code>RunContainerError<\/code>/<code>StartError<\/code> (lệnh không chạy được), <code>CreateContainerConfigError<\/code> (thiếu ConfigMap/Secret), <code>Pending<\/code> (không xếp được node: đọc event <code>FailedScheduling<\/code>), <code>Running<\/code> nhưng <code>0/1<\/code> (readiness trượt).<\/li>\n<li>Exit code: <code>1<\/code> lỗi app, <code>126/127<\/code> lệnh không chạy được hoặc không tồn tại, <code>137<\/code> bị SIGKILL (thường <code>OOMKilled<\/code>), <code>143<\/code> SIGTERM.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Namespace <code>lab33<\/code> có sáu Deployment: <code>img<\/code>, <code>cmd<\/code>, <code>oom<\/code>, <code>pending<\/code>, <code>cfg<\/code>, <code>notready<\/code>. Mỗi cái hỏng một kiểu. Sửa để <strong>cả sáu<\/strong> đều sẵn sàng đủ replica.<\/p>", "<p>Ràng buộc khi sửa: <code>img<\/code> dùng <code>nginx:1.27<\/code>; <code>cmd<\/code> vẫn chạy <code>sleep 3600<\/code>; <code>oom<\/code> giữ nguyên lệnh và chỉ đổi memory limit thành <code>256Mi<\/code>; <code>cfg<\/code> phải đọc biến từ ConfigMap <code>app-settings<\/code> với <code>MODE=prod<\/code>; <code>notready<\/code> giữ readinessProbe nhưng kiểm tra đúng đường dẫn.<\/p>", "<p>Ghi lý do container của <code>oom<\/code> bị dừng (giá trị <code>reason<\/code> trong <code>lastState<\/code>) vào <code>~/cka-answers/33-oom.txt<\/code>.<\/p>"], "hints": [["Nhìn toàn cảnh", "<p><code>kubectl get pods -n lab33<\/code> rồi <code>kubectl get events -n lab33 --sort-by=.lastTimestamp | tail -20<\/code><\/p>"], ["Lý do lần chết trước", "<p><code>kubectl get pod &lt;pod&gt; -n lab33 -o jsonpath='{.status.containerStatuses[0].lastState.terminated.reason}'<\/code><\/p>"], ["Pod Pending", "<p><code>kubectl describe pod<\/code> → <code>0/3 nodes are available: … didn't match Pod's node affinity/selector<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get pods -n lab33\n# img: ImagePullBackOff\nkubectl set image deploy/img -n lab33 nginx=nginx:1.27\n# cmd: StartError, &quot;slep&quot;: executable file not found\nkubectl patch deploy cmd -n lab33 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/command&quot;,&quot;value&quot;:[&quot;sleep&quot;,&quot;3600&quot;]}]'\n# oom: OOMKilled, exit 137\nkubectl get pod -n lab33 -l app=oom -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}' &gt; ~/cka-answers/33-oom.txt\nkubectl set resources deploy oom -n lab33 --limits=memory=256Mi\n# pending: nodeSelector disktype=nvme không node nào có\nkubectl patch deploy pending -n lab33 --type=json -p '[{&quot;op&quot;:&quot;remove&quot;,&quot;path&quot;:&quot;/spec/template/spec/nodeSelector&quot;}]'\n# cfg: CreateContainerConfigError, configmap &quot;app-settings&quot; not found\nkubectl create cm app-settings -n lab33 --from-literal=MODE=prod\n# notready: Readiness probe failed: HTTP probe failed with statuscode: 404\nkubectl patch deploy notready -n lab33 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/readinessProbe/httpGet/path&quot;,&quot;value&quot;:&quot;/&quot;}]'\nkubectl get deploy -n lab33\n<\/code><\/pre>\n<p>Pod của <code>cfg<\/code> tự chạy lại khi ConfigMap xuất hiện (kubelet thử lại). Nếu chậm: <code>kubectl rollout restart deploy cfg -n lab33<\/code>.<\/p>", "docs": [["Debug Pods", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"], ["Determine the reason for Pod failure", "https://kubernetes.io/docs/tasks/debug/debug-application/determine-reason-pod-failure/"]]}, {"id": 34, "slug": "troubleshoot-network", "dir": "34-troubleshoot-network", "title": "Troubleshooting mạng: Service, NetworkPolicy và DNS", "level": 8, "env": "any", "minutes": 40, "comps": ["trouble:4", "net:1", "net:5"], "goal": "<p>Lần theo đường đi của một request bị hỏng ở nhiều chỗ cùng lúc: DNS, Service, endpoint, NetworkPolicy. Sửa từng lớp mà không phá bỏ chính sách bảo mật.<\/p>", "concepts": "<ul>\n<li>Thứ tự kiểm tra: <strong>DNS<\/strong> (<code>nslookup web.lab34<\/code>) → <strong>Service<\/strong> có tồn tại, đúng cổng → <strong>EndpointSlice<\/strong> có IP không (selector, readiness, targetPort) → gọi thẳng <strong>IP Pod<\/strong> → <strong>NetworkPolicy<\/strong> → kube-proxy/CNI trên node.<\/li>\n<li>Gọi bằng IP Pod được mà bằng tên Service không được: lỗi ở DNS hoặc Service. Gọi IP Pod cũng không được: app, NetworkPolicy hoặc CNI.<\/li>\n<li>CoreDNS là Deployment <code>coredns<\/code> trong <code>kube-system<\/code>, Service tên <code>kube-dns<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Pod <code>client<\/code> trong <code>lab34<\/code> (label <code>role=frontend<\/code>) không gọi được <code>http://web.lab34<\/code>. Sửa mọi lỗi trên đường đi để <code>client<\/code> nhận được trang nginx.<\/p>", "<p>Ràng buộc: <strong>không<\/strong> xóa hay sửa NetworkPolicy <code>default-deny<\/code>; <strong>không<\/strong> đổi label của <code>client<\/code> hay của Pod <code>web<\/code>; <strong>không<\/strong> tạo Service mới.<\/p>", "<p>Ghi số lỗi bạn đã sửa vào <code>~/cka-answers/34-faults.txt<\/code>.<\/p>"], "hints": [["Bắt đầu từ DNS", "<p><code>kubectl exec client -n lab34 -- nslookup web.lab34<\/code> báo lỗi? Xem <code>kubectl -n kube-system get deploy coredns<\/code>.<\/p>"], ["Gọi thẳng IP Pod để tách lỗi", "<p><code>kubectl get pod -n lab34 -l app=web -o wide<\/code> rồi <code>kubectl exec client -n lab34 -- wget -qO- -T3 &lt;pod-ip&gt;<\/code><\/p>"]], "solution": "<p>Có 4 lỗi chồng nhau:<\/p>\n<pre><code class=\"language-bash\"># 1. DNS: CoreDNS bị scale về 0\nkubectl -n kube-system get deploy coredns           # 0/0\nkubectl -n kube-system scale deploy coredns --replicas=2   # (k3s: 1)\n# 2. Service web chọn sai label\nkubectl get svc web -n lab34 -o jsonpath='{.spec.selector}'   # app=wbe\n# 3. targetPort sai (8080, nginx nghe 80)\nkubectl patch svc web -n lab34 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/selector&quot;,&quot;value&quot;:{&quot;app&quot;:&quot;web&quot;}},{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/ports/0/targetPort&quot;,&quot;value&quot;:80}]'\n# 4. Policy allow-frontend chọn sai label nguồn (role=front-end)\nkubectl get netpol allow-frontend -n lab34 -o yaml\nkubectl patch netpol allow-frontend -n lab34 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/ingress/0/from/0/podSelector/matchLabels&quot;,&quot;value&quot;:{&quot;role&quot;:&quot;frontend&quot;}}]'\nkubectl exec client -n lab34 -- wget -qO- -T3 http://web.lab34\necho 4 &gt; ~/cka-answers/34-faults.txt\n<\/code><\/pre>", "docs": [["Debug Services", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"], ["Debugging DNS resolution", "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"]]}, {"id": 35, "slug": "troubleshoot-control-plane", "dir": "35-troubleshoot-control-plane", "title": "Troubleshooting control plane: scheduler và controller-manager", "level": 8, "env": "kind", "minutes": 40, "comps": ["trouble:1"], "goal": "<p>Nhận ra thành phần control plane nào hỏng chỉ từ triệu chứng, đọc log khi kubectl không giúp được, và sửa static pod manifest.<\/p>", "concepts": "<ul>\n<li>Triệu chứng chỉ điểm: Deployment không có ReplicaSet → <strong>kube-controller-manager<\/strong>. Pod đứng <code>Pending<\/code> mà không có event → <strong>kube-scheduler<\/strong>. <code>kubectl<\/code> báo connection refused → <strong>kube-apiserver<\/strong> hoặc <strong>etcd<\/strong>.<\/li>\n<li>Control plane là static pod: log đọc bằng <code>kubectl -n kube-system logs &lt;pod&gt;<\/code>, hoặc trên node bằng <code>crictl ps -a<\/code> + <code>crictl logs &lt;id&gt;<\/code>, hoặc file trong <code>/var/log/pods/<\/code>. Pod không được tạo luôn thì xem <code>journalctl -u kubelet<\/code>.<\/li>\n<li>Sửa file trong <code>/etc/kubernetes/manifests<\/code> là đủ; kubelet tự tạo lại Pod (có thể mất 20–60 giây).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Deployment <code>probe<\/code> trong <code>lab35<\/code> (2 replica) đã được tạo nhưng không có Pod nào. Tìm thành phần control plane hỏng và sửa.<\/p>", "<p>Sau đó Pod của <code>probe<\/code> vẫn không chạy. Tìm và sửa thành phần thứ hai.<\/p>", "<p>Ghi tên hai thành phần đã sửa (ví dụ <code>kube-apiserver<\/code>), mỗi tên một dòng, vào <code>~/cka-answers/35-components.txt<\/code>.<\/p>"], "hints": [["Không có ReplicaSet", "<p><code>kubectl get rs -n lab35<\/code> trống → ai tạo ReplicaSet? <code>kubectl -n kube-system get pods | grep controller<\/code><\/p>"], ["Container control plane chết ngay khi khởi động", "<p><code>./lab ssh $CP<\/code> rồi <code>crictl ps -a | grep -E 'scheduler|controller'<\/code> và <code>crictl logs &lt;container-id&gt;<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get rs -n lab35                       # trống\nkubectl -n kube-system get pods | grep -E 'scheduler|controller'\n./lab ssh $CP\ncrictl ps -a | grep controller-manager        # Exited\ncrictl logs &lt;id&gt;                              # exec: &quot;kube-controller-manegr&quot;: executable file not found\nvi /etc/kubernetes/manifests/kube-controller-manager.yaml     # sửa thành kube-controller-manager\ncrictl ps -a | grep scheduler\ncrictl logs &lt;id&gt;                              # stat /etc/kubernetes/scheduler.config: no such file or directory\nvi /etc/kubernetes/manifests/kube-scheduler.yaml              # --kubeconfig=/etc/kubernetes/scheduler.conf\nexit\nkubectl get pods -n lab35 -w\nprintf 'kube-controller-manager\\nkube-scheduler\\n' &gt; ~/cka-answers/35-components.txt\n<\/code><\/pre>", "docs": [["Troubleshooting clusters", "https://kubernetes.io/docs/tasks/debug/debug-cluster/"], ["Debugging Kubernetes nodes with crictl", "https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/"]]}, {"id": 36, "slug": "troubleshoot-node", "dir": "36-troubleshoot-node", "title": "Troubleshooting node: worker NotReady", "level": 8, "env": "kind", "minutes": 35, "comps": ["trouble:0"], "goal": "<p>Đưa một worker <code>NotReady<\/code> trở lại: xác định kubelet có chạy không, đọc journal để tìm cấu hình sai, sửa và bảo đảm kubelet tự chạy sau khi khởi động lại máy.<\/p>", "concepts": "<ul>\n<li>Node <code>NotReady<\/code> (hoặc <code>Unknown<\/code>) phần lớn do kubelet: không chạy, chạy rồi chết vì cấu hình sai, không nói chuyện được với container runtime, hoặc chứng chỉ hết hạn.<\/li>\n<li>Trên node: <code>systemctl status kubelet<\/code>, <code>journalctl -u kubelet -n 50<\/code>, cấu hình ở <code>/var/lib/kubelet/config.yaml<\/code>, cờ ở <code>/var/lib/kubelet/kubeadm-flags.env<\/code>, unit drop-in ở <code>/usr/lib/systemd/system/kubelet.service.d/10-kubeadm.conf<\/code>.<\/li>\n<li><code>systemctl enable --now kubelet<\/code> vừa chạy ngay vừa tự chạy khi boot. Chỉ <code>start<\/code> thì sau reboot lại hỏng.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p><code>$NODE2<\/code> đang <code>NotReady<\/code>. Đưa nó về <code>Ready<\/code>.<\/p>", "<p>Bảo đảm kubelet trên <code>$NODE2<\/code> tự khởi động cùng máy.<\/p>", "<p>Ghi đường dẫn file cấu hình mà bạn đã sửa vào <code>~/cka-answers/36-file.txt<\/code>.<\/p>"], "hints": [["kubelet có chạy không?", "<p><code>./lab ssh $NODE2<\/code> rồi <code>systemctl status kubelet<\/code><\/p>"], ["kubelet chạy rồi chết", "<p><code>journalctl -u kubelet -n 30 --no-pager<\/code> và tìm dòng <code>failed to load<\/code> / <code>no such file<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get nodes                     # NODE2 NotReady\n./lab ssh $NODE2\nsystemctl status kubelet              # inactive (dead), disabled\nsystemctl enable --now kubelet\njournalctl -u kubelet -n 30 --no-pager\n#   unable to load client CA file /etc/kubernetes/pki/ca-bundle.crt: no such file\nvi /var/lib/kubelet/config.yaml       # authentication.x509.clientCAFile: /etc/kubernetes/pki/ca.crt\nsystemctl restart kubelet\nexit\necho /var/lib/kubelet/config.yaml &gt; ~/cka-answers/36-file.txt\nkubectl get nodes -w\n<\/code><\/pre>", "docs": [["Troubleshooting clusters", "https://kubernetes.io/docs/tasks/debug/debug-cluster/"], ["kubelet configuration file", "https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/"]]}, {"id": 37, "slug": "monitoring-logs", "dir": "37-monitoring-logs", "title": "Theo dõi tài nguyên, event và log", "level": 8, "env": "any", "minutes": 30, "comps": ["trouble:2", "trouble:3"], "goal": "<p>Trả lời nhanh các câu hỏi \"cái gì đang ngốn CPU\", \"vì sao nó chết\", \"log lần trước nói gì\" bằng <code>kubectl top<\/code>, event và log, và ghi đáp án ra file đúng định dạng.<\/p>", "concepts": "<ul>\n<li><code>kubectl top pod/node<\/code> cần metrics-server; <code>--sort-by=cpu|memory<\/code>, <code>--containers<\/code>, <code>-A<\/code>.<\/li>\n<li><code>kubectl get events --sort-by=.lastTimestamp<\/code>, lọc <code>--field-selector involvedObject.name=&lt;pod&gt;,type=Warning<\/code>; hoặc <code>kubectl events --for pod/&lt;tên&gt;<\/code>.<\/li>\n<li><code>kubectl logs<\/code>: <code>-c &lt;container&gt;<\/code>, <code>--previous<\/code>, <code>--since=10m<\/code>, <code>--tail=50<\/code>, <code>-l &lt;selector&gt; --all-containers --prefix<\/code>.<\/li>\n<li>Exit code và lý do: <code>.status.containerStatuses[*].lastState.terminated<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab37<\/code>, ghi tên Pod dùng <strong>nhiều CPU nhất<\/strong> vào <code>~/cka-answers/37-cpu.txt<\/code>.<\/p>", "<p>Pod <code>crashy<\/code> đang khởi động lại liên tục. Ghi các dòng chứa <code>FATAL<\/code> trong log <strong>lần chạy trước<\/strong> vào <code>~/cka-answers/37-fatal.txt<\/code>, và exit code lần chết gần nhất vào <code>~/cka-answers/37-exit.txt<\/code>.<\/p>", "<p>Pod <code>multi<\/code> có hai container. Đếm số dòng chứa <code>upstream timeout<\/code> trong log của container <code>proxy<\/code>, ghi vào <code>~/cka-answers/37-timeouts.txt<\/code>.<\/p>", "<p>Ghi <code>reason<\/code> của event cảnh báo mới nhất liên quan tới <code>crashy<\/code> vào <code>~/cka-answers/37-event.txt<\/code>.<\/p>"], "hints": [["Sắp xếp theo CPU", "<p><code>kubectl top pod -n lab37 --sort-by=cpu --no-headers | head -1<\/code><\/p>"], ["Event của một Pod", "<p><code>kubectl get events -n lab37 --field-selector involvedObject.name=crashy,type=Warning --sort-by=.lastTimestamp<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl top pod -n lab37 --sort-by=cpu --no-headers | head -1 | awk '{print $1}' &gt; ~/cka-answers/37-cpu.txt\nkubectl logs crashy -n lab37 --previous | grep FATAL &gt; ~/cka-answers/37-fatal.txt\nkubectl get pod crashy -n lab37 -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}' &gt; ~/cka-answers/37-exit.txt\nkubectl logs multi -n lab37 -c proxy | grep -c 'upstream timeout' &gt; ~/cka-answers/37-timeouts.txt\nkubectl get events -n lab37 --field-selector involvedObject.name=crashy,type=Warning --sort-by=.lastTimestamp \\\n  -o jsonpath='{.items[-1:].reason}' &gt; ~/cka-answers/37-event.txt     # BackOff\n<\/code><\/pre>", "docs": [["Resource metrics pipeline", "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"], ["Logging architecture", "https://kubernetes.io/docs/concepts/cluster-administration/logging/"], ["kubectl events", "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_events/"]]}, {"id": 38, "slug": "mock-exam", "dir": "38-mock-exam", "title": "Đề thi thử CKA (2 giờ, 16 câu)", "level": 9, "env": "kind", "minutes": 120, "comps": ["trouble:0", "trouble:3", "trouble:4", "arch:0", "net:1", "net:2", "net:4", "work:0", "work:1", "work:2", "work:3", "work:4", "stor:0", "stor:2"], "goal": "<p>Làm một đề tổng hợp trong 120 phút như phòng thi thật. Mỗi câu có trọng số; câu chỉ được điểm khi đúng <strong>toàn bộ<\/strong>. Cần <strong>66%<\/strong> để đậu.<\/p>", "concepts": "<ul>\n<li>Đọc lướt cả 16 câu trước, làm câu dễ và nặng điểm trước. Câu nào kẹt quá 8 phút thì bỏ qua, quay lại sau.<\/li>\n<li>Sinh YAML bằng <code>$do<\/code>, tra field bằng <code>kubectl explain<\/code>, chỉ mở tài liệu khi cần ví dụ dài (NetworkPolicy, PV, Ingress).<\/li>\n<li>Sau mỗi câu, kiểm tra nhanh bằng <code>kubectl get<\/code>: đề thi chấm trạng thái trong cluster, không chấm file YAML.<\/li>\n<li>Chỉ chạy <code>./lab check 38<\/code> khi đã hết giờ hoặc làm xong, để luyện cảm giác tự kiểm tra.<\/li>\n<\/ul>", "setup_note": "<p>Setup tạo sẵn các namespace <code>mock-a<\/code>, <code>mock-b<\/code>, <code>mock-c<\/code> cùng vài workload, gắn label và taint lên <code>$NODE2<\/code>, rồi in giờ bắt đầu. Bấm đồng hồ 120 phút. Trên trang hướn
