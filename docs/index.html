t để <code>kubectl logs<\/code> đọc được.<\/p>", "concepts": "<ul>\n<li>Init container chạy <strong>tuần tự<\/strong> trước container chính, mỗi cái phải thoát 0. Pod hiển thị <code>Init:0/1<\/code> trong lúc chờ.<\/li>\n<li>Sidecar kiểu mới (GA từ v1.33): khai báo trong <code>initContainers<\/code> với <code>restartPolicy: Always<\/code>. Nó khởi động trước app, chạy suốt đời Pod và dừng sau app.<\/li>\n<li>Các container trong Pod dùng chung volume (<code>emptyDir<\/code>) và network namespace (gọi nhau qua <code>localhost<\/code>).<\/li>\n<li>Spec của Pod đang chạy gần như bất biến: muốn thêm container phải xuất YAML, sửa, rồi <code>kubectl replace --force -f<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab08<\/code>, tạo Pod <code>web<\/code> (image <code>nginx:1.27<\/code>) có init container <code>wait-db<\/code> (image <code>busybox:1.36<\/code>) chờ tới khi phân giải được tên <code>db.lab08.svc.cluster.local<\/code>. Pod phải đứng ở <code>Init:0/1<\/code>.<\/p>", "<p>Tạo Service <code>db<\/code> kiểu ClusterIP cổng 5432 (không cần selector). Xác nhận Pod <code>web<\/code> chuyển sang <code>Running<\/code>.<\/p>", "<p>Pod <code>legacy<\/code> ghi log vào file <code>/var/log/app/app.log<\/code> (volume <code>logs<\/code>). Thêm sidecar tên <code>log-tail<\/code> (image <code>busybox:1.36<\/code>) dạng native sidecar, chạy <code>tail -n+1 -F /var/log/app/app.log<\/code>, để <code>kubectl logs legacy -c log-tail<\/code> thấy log.<\/p>"], "hints": [["Lệnh chờ DNS", "<p><code>until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done<\/code><\/p>"], ["Thêm container vào Pod đang chạy", "<p><code>kubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml<\/code>, sửa, rồi <code>kubectl replace --force -f legacy.yaml<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: web, namespace: lab08}\nspec:\n  initContainers:\n  - name: wait-db\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done&quot;]\n  containers:\n  - {name: web, image: nginx:1.27}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pod web -n lab08          # Init:0/1\nkubectl create svc clusterip db -n lab08 --tcp=5432\nkubectl get pod web -n lab08 -w       # → Running\nkubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code> của <code>legacy.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  initContainers:\n  - name: log-tail\n    image: busybox:1.36\n    restartPolicy: Always\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -n+1 -F /var/log/app/app.log&quot;]\n    volumeMounts:\n    - {name: logs, mountPath: /var/log/app}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl replace --force -f legacy.yaml\nkubectl logs legacy -n lab08 -c log-tail\n<\/code><\/pre>", "docs": [["Init containers", "https://kubernetes.io/docs/concepts/workloads/pods/init-containers/"], ["Sidecar containers", "https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/"], ["Logging architecture", "https://kubernetes.io/docs/concepts/cluster-administration/logging/"]], "support": "guided", "prereq": [3, 7], "guide": [["Init container chạy trước, lần lượt", "<p>Init container chạy lần lượt và phải <strong>thoát thành công<\/strong> thì container chính mới khởi động. Dùng nó để chờ phụ thuộc (DB, migration, tải cấu hình).<\/p>\n<pre><code class=\"language-bash\">./lab start 8\nkubectl run web -n lab08 --image=nginx:1.27 $do &gt; web.yaml\nvi web.yaml\n<\/code><\/pre>\n<p>Thêm <code>initContainers<\/code> vào <code>spec<\/code>, ngang hàng với <code>containers<\/code>:<\/p>\n<pre><code class=\"language-yaml\">spec:\n  initContainers:\n  - name: wait-db\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done&quot;]\n  containers:\n  - name: web\n    image: nginx:1.27\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -n lab08 -f web.yaml\nkubectl get pod web -n lab08\nkubectl logs web -n lab08 -c wait-db --tail=3\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>STATUS Init:0/1<\/code>; log init container lặp <code>waiting<\/code> vì tên <code>db<\/code> chưa tồn tại.<\/p>\n<\/blockquote>"], ["Tạo phụ thuộc và xem Pod chạy tiếp", "<p>Service không có selector vẫn có ClusterIP và tên DNS, đủ để <code>nslookup<\/code> thành công.<\/p>\n<pre><code class=\"language-bash\">kubectl create svc clusterip db -n lab08 --tcp=5432\nkubectl get pod web -n lab08 -w        # Init:0/1 → PodInitializing → Running\n<\/code><\/pre>"], ["Vì sao cần sidecar", "<p>Pod <code>legacy<\/code> ghi log vào file chứ không ra stdout, nên <code>kubectl logs<\/code> không thấy gì. Mẫu chuẩn: một container phụ cùng mount volume đó và <code>tail<\/code> file ra stdout của nó.<\/p>\n<pre><code class=\"language-bash\">kubectl logs legacy -n lab08                 # trống\nkubectl exec legacy -n lab08 -- tail -2 /var/log/app/app.log\n<\/code><\/pre>"], ["Native sidecar", "<p>Từ Kubernetes 1.29, sidecar \"chuẩn\" là <strong>init container có <code>restartPolicy: Always<\/code><\/strong>. Nó khởi động trước container chính, chạy suốt đời Pod và được tắt sau cùng. Hầu hết trường của Pod không sửa được khi đang chạy, nên xuất YAML, sửa rồi <code>replace --force<\/code> (xóa và tạo lại).<\/p>\n<pre><code class=\"language-bash\">kubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml\nvi legacy.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  initContainers:\n  - name: log-tail\n    image: busybox:1.36\n    restartPolicy: Always\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -n+1 -F /var/log/app/app.log&quot;]\n    volumeMounts:\n    - {name: logs, mountPath: /var/log/app}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl replace --force -f legacy.yaml\nkubectl get pod legacy -n lab08          # READY 2/2\nkubectl logs legacy -n lab08 -c log-tail\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> thấy các dòng <code>… heartbeat order-service<\/code>.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">./lab check 8\n<\/code><\/pre>"]]}, {"id": 9, "slug": "daemonset-job-cronjob", "dir": "09-daemonset-job-cronjob", "title": "DaemonSet, Job và CronJob", "level": 2, "env": "any", "minutes": 30, "comps": ["work:3"], "goal": "<p>Chọn đúng loại workload: một Pod trên mỗi node (DaemonSet), tác vụ chạy tới khi xong (Job), tác vụ theo lịch (CronJob).<\/p>", "concepts": "<ul>\n<li>Không có <code>kubectl create daemonset<\/code>: sinh YAML Deployment rồi đổi <code>kind: DaemonSet<\/code>, bỏ <code>replicas<\/code> và <code>strategy<\/code>. Muốn chạy cả trên control plane phải tolerate taint <code>node-role.kubernetes.io/control-plane:NoSchedule<\/code>.<\/li>\n<li>Job: <code>completions<\/code> (cần bao nhiêu lần thành công), <code>parallelism<\/code> (chạy song song bao nhiêu), <code>backoffLimit<\/code> (số lần thử lại), <code>ttlSecondsAfterFinished<\/code> (tự xóa). <code>restartPolicy<\/code> chỉ được <code>Never<\/code> hoặc <code>OnFailure<\/code>.<\/li>\n<li>CronJob: <code>schedule<\/code> theo cú pháp cron, <code>concurrencyPolicy<\/code> (<code>Allow<\/code>, <code>Forbid<\/code>, <code>Replace<\/code>), giới hạn lịch sử job. <code>kubectl create job x --from=cronjob/y<\/code> chạy ngay một lần.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab09<\/code>, tạo DaemonSet <code>node-agent<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) chạy trên <strong>mọi<\/strong> node, kể cả control plane.<\/p>", "<p>Tạo Job <code>batch-sum<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sh -c 'echo done'<\/code>) cần <strong>4<\/strong> lần thành công, chạy song song tối đa <strong>2<\/strong>, thử lại tối đa <strong>2<\/strong> lần, tự xóa sau <strong>300<\/strong> giây khi xong. Job phải hoàn thành.<\/p>", "<p>Tạo CronJob <code>report<\/code> chạy mỗi 15 phút (image <code>busybox:1.36<\/code>, lệnh <code>date<\/code>), không cho chạy chồng (<code>Forbid<\/code>), giữ lại 2 job thành công.<\/p>", "<p>Chạy ngay một lần CronJob <code>report<\/code> bằng Job tên <code>report-now<\/code>. Job phải hoàn thành.<\/p>"], "hints": [["Sinh YAML Job và CronJob", "<p><code>kubectl create job batch-sum --image=busybox:1.36 $do -- sh -c 'echo done'<\/code> và <code>kubectl create cronjob report --image=busybox:1.36 --schedule='*/15 * * * *' $do -- date<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: DaemonSet\nmetadata: {name: node-agent, namespace: lab09}\nspec:\n  selector: {matchLabels: {app: node-agent}}\n  template:\n    metadata: {labels: {app: node-agent}}\n    spec:\n      tolerations:\n      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}\n      containers:\n      - {name: agent, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n---\napiVersion: batch/v1\nkind: Job\nmetadata: {name: batch-sum, namespace: lab09}\nspec:\n  completions: 4\n  parallelism: 2\n  backoffLimit: 2\n  ttlSecondsAfterFinished: 300\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n      - {name: sum, image: busybox:1.36, command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo done&quot;]}\n---\napiVersion: batch/v1\nkind: CronJob\nmetadata: {name: report, namespace: lab09}\nspec:\n  schedule: &quot;*/15 * * * *&quot;\n  concurrencyPolicy: Forbid\n  successfulJobsHistoryLimit: 2\n  jobTemplate:\n    spec:\n      template:\n        spec:\n          restartPolicy: OnFailure\n          containers:\n          - {name: report, image: busybox:1.36, command: [&quot;date&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create job report-now -n lab09 --from=cronjob/report\nkubectl get ds,job,cronjob -n lab09\n<\/code><\/pre>", "docs": [["DaemonSet", "https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/"], ["Jobs", "https://kubernetes.io/docs/concepts/workloads/controllers/job/"], ["CronJob", "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"]], "support": "guided", "prereq": [5], "guide": [["DaemonSet: mỗi node một Pod", "<p><code>kubectl create<\/code> không có lệnh cho DaemonSet. Mẹo: sinh YAML Deployment rồi đổi <code>kind<\/code>, xóa <code>replicas<\/code> và <code>strategy<\/code>.<\/p>\n<pre><code class=\"language-bash\">./lab start 9\nkubectl create deploy node-agent -n lab09 --image=busybox:1.36 $do -- sleep 3600 &gt; ds.yaml\nsed -i 's/kind: Deployment/kind: DaemonSet/; /replicas:/d; /strategy: {}/d' ds.yaml\nkubectl apply -f ds.yaml\nkubectl get ds,pods -n lab09 -o wide\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> DESIRED 2: chỉ 2 worker. Control plane có taint <code>node-role.kubernetes.io/control-plane:NoSchedule<\/code> nên Pod không được đặt lên đó.<\/p>\n<\/blockquote>"], ["Toleration để chạy cả trên control plane", "<pre><code class=\"language-bash\">kubectl describe node &quot;$CP&quot; | grep Taints\nvi ds.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec.template.spec<\/code>:<\/p>\n<pre><code class=\"language-yaml\">      tolerations:\n      - key: node-role.kubernetes.io/control-plane\n        operator: Exists\n        effect: NoSchedule\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f ds.yaml\nkubectl get ds node-agent -n lab09\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> DESIRED 3, READY 3.<\/p>\n<\/blockquote>"], ["Job chạy nhiều lần", "<ul>\n<li><code>completions<\/code>: số lần cần thành công.<\/li>\n<li><code>parallelism<\/code>: số Pod chạy cùng lúc.<\/li>\n<li><code>backoffLimit<\/code>: số lần thử lại khi lỗi.<\/li>\n<li><code>ttlSecondsAfterFinished<\/code>: tự xóa Job sau khi xong.<\/li>\n<\/ul>\n<p>Pod của Job phải có <code>restartPolicy<\/code> là <code>Never<\/code> hoặc <code>OnFailure<\/code>.<\/p>\n<pre><code class=\"language-bash\">kubectl create job batch-sum -n lab09 --image=busybox:1.36 $do -- sh -c 'echo done' &gt; job.yaml\nvi job.yaml        # thêm 4 trường trên vào spec (ngang hàng template)\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">spec:\n  completions: 4\n  parallelism: 2\n  backoffLimit: 2\n  ttlSecondsAfterFinished: 300\n  template:\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f job.yaml\nkubectl get pods -n lab09 -l job-name=batch-sum -w\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> Pod chạy theo từng cặp, Job đạt <code>COMPLETIONS 4/4<\/code>.<\/p>\n<\/blockquote>"], ["CronJob", "<p>Lịch theo cú pháp cron: <code>phút giờ ngày tháng thứ<\/code>. <code>*/15 * * * *<\/code> là mỗi 15 phút. <code>concurrencyPolicy: Forbid<\/code> bỏ qua lần chạy mới nếu lần trước chưa xong.<\/p>\n<pre><code class=\"language-bash\">kubectl create cronjob report -n lab09 --image=busybox:1.36 --schedule='*/15 * * * *' $do -- date &gt; cj.yaml\nvi cj.yaml         # thêm vào spec:\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">spec:\n  concurrencyPolicy: Forbid\n  successfulJobsHistoryLimit: 2\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f cj.yaml\n<\/code><\/pre>"], ["Chạy CronJob ngay", "<p>Không cần chờ 15 phút: tạo Job từ template của CronJob. Đây là cách kiểm tra CronJob hay dùng nhất.<\/p>\n<pre><code class=\"language-bash\">kubectl create job report-now -n lab09 --from=cronjob/report\nkubectl logs -n lab09 job/report-now\n./lab check 9\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> log in ngày giờ hiện tại.<\/p>\n<\/blockquote>"]]}, {"id": 10, "slug": "resources-quota", "dir": "10-resources-quota", "title": "Requests, limits, LimitRange và ResourceQuota", "level": 2, "env": "any", "minutes": 35, "comps": ["work:4", "trouble:2"], "goal": "<p>Hiểu requests/limits tác động thế nào tới scheduling và QoS, tìm vì sao Deployment không đủ Pod khi namespace có quota, và đặt giá trị mặc định bằng LimitRange.<\/p>", "concepts": "<ul>\n<li>Scheduler chỉ nhìn <strong>requests<\/strong>. Vượt memory <strong>limit<\/strong> thì container bị OOMKilled; vượt CPU limit thì bị throttle.<\/li>\n<li>QoS: <code>Guaranteed<\/code> (mọi container có requests = limits cho CPU và memory), <code>Burstable<\/code>, <code>BestEffort<\/code> (không đặt gì, bị evict đầu tiên).<\/li>\n<li>ResourceQuota giới hạn tổng của namespace. Khi quota có <code>requests.cpu<\/code>, mọi Pod <strong>bắt buộc<\/strong> khai báo requests CPU, nếu không bị từ chối.<\/li>\n<li>Pod bị quota từ chối không tồn tại, nên lỗi nằm ở <strong>event của ReplicaSet<\/strong> (<code>FailedCreate<\/code>), không ở Deployment.<\/li>\n<li>LimitRange điền requests/limits mặc định cho container không khai báo, và có thể đặt min/max.<\/li>\n<li>Quota sát giới hạn có thể làm rolling update <strong>kẹt<\/strong>: Deployment cần tạo Pod mới (maxSurge) trước khi xóa Pod cũ, nhưng quota không cho tạo. Gỡ bằng cách tạm tăng <code>maxUnavailable<\/code>, giảm <code>replicas<\/code>, hoặc nới quota.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Deployment <code>heavy<\/code> trong <code>lab10<\/code> muốn 3 replica nhưng chỉ có 2 Pod. Tìm resource nào của quota bị vượt (ví dụ <code>limits.memory<\/code>) và ghi vào <code>~/cka-answers/10-quota.txt<\/code>.<\/p>", "<p>Sửa <code>heavy<\/code> để đủ 3 replica: requests <code>cpu: 200m<\/code>, <code>memory: 128Mi<\/code>; limits <code>memory: 256Mi<\/code>.<\/p>", "<p>Tạo LimitRange <code>defaults<\/code> trong <code>lab10<\/code>: container không khai báo sẽ nhận request <code>cpu: 100m<\/code>, <code>memory: 64Mi<\/code> và limit <code>cpu: 200m<\/code>, <code>memory: 128Mi<\/code>.<\/p>", "<p>Tạo Pod <code>plain<\/code> (image <code>nginx:1.27<\/code>, không khai báo resources). Nó phải chạy được nhờ LimitRange.<\/p>", "<p>Tạo Pod <code>gold<\/code> (image <code>nginx:1.27<\/code>) thuộc QoS class <code>Guaranteed<\/code> với CPU 100m và memory 64Mi.<\/p>"], "hints": [["Tìm lý do", "<p><code>kubectl describe rs -n lab10 -l app=heavy | grep -A3 FailedCreate<\/code> và <code>kubectl describe quota -n lab10<\/code><\/p>"], ["Sửa resources nhanh", "<p><code>kubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl describe rs -n lab10 -l app=heavy | grep FailedCreate\n#   exceeded quota: team-quota, requested: requests.cpu=800m, used: requests.cpu=1600m, limited: requests.cpu=2\necho requests.cpu &gt; ~/cka-answers/10-quota.txt\nkubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: LimitRange\nmetadata: {name: defaults, namespace: lab10}\nspec:\n  limits:\n  - type: Container\n    defaultRequest: {cpu: 100m, memory: 64Mi}\n    default: {cpu: 200m, memory: 128Mi}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl run plain -n lab10 --image=nginx:1.27\nkubectl get pod plain -n lab10 -o jsonpath='{.spec.containers[0].resources}'\nkubectl run gold -n lab10 --image=nginx:1.27 $do &gt; gold.yaml\n# thêm resources: requests và limits đều cpu: 100m, memory: 64Mi\nkubectl apply -f gold.yaml\nkubectl get pod gold -n lab10 -o jsonpath='{.status.qosClass}'   # Guaranteed\n<\/code><\/pre>", "docs": [["Resource management for Pods and containers", "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"], ["Resource quotas", "https://kubernetes.io/docs/concepts/policy/resource-quotas/"], ["Limit ranges", "https://kubernetes.io/docs/concepts/policy/limit-range/"], ["Pod QoS classes", "https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/"]], "support": "guided", "prereq": [5], "guide": [["Requests và limits khác nhau thế nào", "<ul>\n<li><strong>requests<\/strong>: lượng tài nguyên scheduler <strong>giữ chỗ<\/strong> trên node; Pod chỉ được đặt lên node còn đủ.<\/li>\n<li><strong>limits<\/strong>: mức trần lúc chạy. Vượt limit CPU thì bị bóp (throttle). Vượt limit memory thì bị kill (<code>OOMKilled<\/code>).<\/li>\n<\/ul>\n<p>ResourceQuota giới hạn <strong>tổng<\/strong> requests và limits của cả namespace.<\/p>"], ["Tìm vì sao thiếu Pod", "<p>Khi Deployment thiếu Pod mà không thấy Pod lỗi nào, lỗi nằm ở <strong>ReplicaSet<\/strong>: nó không tạo được Pod. Xem event của nó.<\/p>\n<pre><code class=\"language-bash\">./lab start 10\nkubectl get deploy heavy -n lab10                  # READY 2/3\nkubectl describe rs -n lab10 -l app=heavy | grep -i -A2 FailedCreate\nkubectl describe quota team-quota -n lab10\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>exceeded quota: team-quota, requested: requests.cpu=800m, used: requests.cpu=1600m, limited: requests.cpu=2<\/code>.<\/p>\n<\/blockquote>\n<pre><code class=\"language-bash\">echo requests.cpu &gt; ~/cka-answers/10-quota.txt\n<\/code><\/pre>"], ["Giảm requests", "<pre><code class=\"language-bash\">kubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi\nkubectl rollout status deploy heavy -n lab10\nkubectl describe quota team-quota -n lab10\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 3/3 Pod, cột Used của <code>requests.cpu<\/code> là <code>600m<\/code>.<\/p>\n<\/blockquote>\n<p>Rolling update cần chỗ cho Pod mới <strong>trước khi<\/strong> xóa Pod cũ. Nếu quota đã kín, Pod mới không được tạo và rollout đứng im. Khi gặp tình huống này, tạm scale về ít replica hơn hoặc nới quota.<\/p>"], ["LimitRange: giá trị mặc định cho container", "<p>Khi namespace có quota cho <code>requests.cpu<\/code>, Pod <strong>không<\/strong> khai báo requests sẽ bị từ chối. LimitRange điền sẵn giá trị mặc định:<\/p>\n<ul>\n<li><code>defaultRequest<\/code>: request mặc định.<\/li>\n<li><code>default<\/code>: limit mặc định.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">cat &lt;&lt;'EOF' | kubectl apply -f -\napiVersion: v1\nkind: LimitRange\nmetadata: {name: defaults, namespace: lab10}\nspec:\n  limits:\n  - type: Container\n    defaultRequest: {cpu: 100m, memory: 64Mi}\n    default: {cpu: 200m, memory: 128Mi}\nEOF\nkubectl run plain -n lab10 --image=nginx:1.27\nkubectl get pod plain -n lab10 -o jsonpath='{.spec.containers[0].resources}'; echo\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> Pod <code>plain<\/code> có requests và limits do LimitRange điền vào.<\/p>\n<\/blockquote>"], ["QoS class", "<ul>\n<li><strong>Guaranteed<\/strong>: mọi container có requests <strong>bằng<\/strong> limits cho cả CPU lẫn memory.<\/li>\n<li><strong>Burstable<\/strong>: có requests nhưng không đạt Guaranteed.<\/li>\n<li><strong>BestEffort<\/strong>: không có gì.<\/li>\n<\/ul>\n<p>Khi node thiếu memory, kubelet đuổi BestEffort trước, Guaranteed sau cùng.<\/p>\n<pre><code class=\"language-bash\">kubectl run gold -n lab10 --image=nginx:1.27 $do &gt; gold.yaml\nvi gold.yaml       # trong container:\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">    resources:\n      requests: {cpu: 100m, memory: 64Mi}\n      limits: {cpu: 100m, memory: 64Mi}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f gold.yaml\nkubectl get pod gold plain -n lab10 -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass\n./lab check 10\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>gold Guaranteed<\/code>, <code>plain Burstable<\/code>.<\/p>\n<\/blockquote>"]]}, {"id": 11, "slug": "hpa-metrics", "dir": "11-hpa-metrics", "title": "metrics-server và HorizontalPodAutoscaler", "level": 2, "env": "any", "minutes": 30, "comps": ["work:2", "trouble:2"], "goal": "<p>Theo dõi CPU/RAM bằng <code>kubectl top<\/code>, tạo HPA có behavior, và sửa HPA hiện <code>&lt;unknown&gt;<\/code> vì Pod không khai báo requests.<\/p>", "concepts": "<ul>\n<li>metrics-server lấy số liệu từ kubelet và phục vụ Metrics API cho <code>kubectl top<\/code> và HPA. Lab 00 đã cài nó trên kind.<\/li>\n<li>HPA tính <code>desiredReplicas = ceil(replicas × giá trị hiện tại / mục tiêu)<\/code>. Utilization tính theo <strong>requests<\/strong>, nên Pod không có CPU request thì HPA không tính được (<code>&lt;unknown&gt;<\/code>).<\/li>\n<li><code>behavior.scaleDown.stabilizationWindowSeconds<\/code> (mặc định 300) chống dao động: khi giảm, HPA lấy khuyến nghị cao nhất trong cửa sổ.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi tên Pod trong namespace <code>kube-system<\/code> đang dùng <strong>nhiều memory nhất<\/strong> vào <code>~/cka-answers/11-top-pod.txt<\/code>.<\/p>", "<p>Trong <code>lab11<\/code>, tạo HPA cho Deployment <code>web<\/code>: tối thiểu 2, tối đa 6 replica, mục tiêu CPU <strong>50%<\/strong>, và scale down chờ <strong>60 giây<\/strong>.<\/p>", "<p>HPA <code>api<\/code> đã có sẵn nhưng hiển thị <code>&lt;unknown&gt;<\/code>. Sửa Deployment <code>api<\/code> để HPA đọc được metric (CPU request <code>100m<\/code>).<\/p>", "<p>(Không chấm) Tạo tải để thấy HPA scale up: <code>kubectl run load -n lab11 --image=busybox:1.36 -- sh -c 'while true; do wget -qO- http://web &gt;/dev/null; done'<\/code> rồi <code>kubectl get hpa -n lab11 -w<\/code>.<\/p>"], "hints": [["Sắp xếp theo memory", "<p><code>kubectl top pod -n kube-system --sort-by=memory --no-headers | head -1<\/code><\/p>"], ["HPA có behavior", "<p><code>kubectl autoscale<\/code> không đặt được behavior. Sinh YAML (<code>$do<\/code>) rồi thêm <code>spec.behavior<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl top pod -n kube-system --sort-by=memory --no-headers | head -1 | awk '{print $1}' &gt; ~/cka-answers/11-top-pod.txt\nkubectl autoscale deploy web -n lab11 --min=2 --max=6 --cpu=50% $do &gt; hpa.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code> của <code>hpa.yaml<\/code> rồi <code>kubectl apply -f hpa.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 60\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl describe hpa api -n lab11        # failed to get cpu utilization: missing request for cpu\nkubectl set resources deploy api -n lab11 --requests=cpu=100m\nkubectl get hpa -n lab11                 # sau khoảng 1 phút TARGETS hiện %\n<\/code><\/pre>", "docs": [["Horizontal Pod Autoscaling", "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"], ["HPA walkthrough", "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale-walkthrough/"], ["Resource metrics pipeline", "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"]], "support": "guided", "prereq": [10], "guide": [["metrics-server là gì", "<p>metrics-server thu CPU và memory từ kubelet của mỗi node 15 giây một lần, rồi phục vụ qua API <code>metrics.k8s.io<\/code>. Cả <code>kubectl top<\/code> và HPA đọc từ API này. Nó <strong>không<\/strong> lưu lịch sử; muốn có lịch sử thì cần Prometheus.<\/p>\n<pre><code class=\"language-bash\">./lab start 11\nkubectl get apiservice v1beta1.metrics.k8s.io       # AVAILABLE True\nkubectl top nodes\n<\/code><\/pre>"], ["Tìm Pod tốn memory nhất", "<pre><code class=\"language-bash\">kubectl top pod -n kube-system --sort-by=memory\nkubectl top pod -n kube-system --sort-by=memory --no-headers | head -1 | awk '{print $1}' &gt; ~/cka-answers/11-top-pod.txt\ncat ~/cka-answers/11-top-pod.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> thường là <code>kube-apiserver-…<\/code> hoặc <code>etcd-…<\/code>. Thêm <code>--containers<\/code> để xem theo từng container.<\/p>\n<\/blockquote>"], ["Tạo HPA", "<p>HPA tính <code>số replica mong muốn = ceil(replica hiện tại × mức dùng hiện tại / mục tiêu)<\/code>. Mức dùng tính theo <strong>phần trăm của CPU request<\/strong>, nên Pod không có request thì HPA không tính được.<\/p>\n<pre><code class=\"language-bash\">kubectl autoscale deploy web -n lab11 --min=2 --max=6 --cpu=50% $do &gt; hpa.yaml\ncat hpa.yaml\n<\/code><\/pre>\n<p>Cờ cũ <code>--cpu-percent=50<\/code> vẫn chạy nhưng đã bị đánh dấu deprecated từ kubectl v1.34.<\/p>"], ["Thêm behavior", "<p><code>kubectl autoscale<\/code> không có cờ cho <code>behavior<\/code>, phải sửa YAML. <code>stabilizationWindowSeconds<\/code> của scaleDown là số giây HPA chờ, sau khi tải giảm, trước khi giảm replica. Nó chống việc scale lên xuống liên tục.<\/p>\n<pre><code class=\"language-bash\">vi hpa.yaml        # thêm vào spec:\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 60\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f hpa.yaml\nkubectl get hpa -n lab11\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>web<\/code> có MINPODS 2, MAXPODS 6; Deployment <code>web<\/code> lên 2 replica.<\/p>\n<\/blockquote>"], ["Sửa HPA hiển thị unknown", "<pre><code class=\"language-bash\">kubectl get hpa api -n lab11                         # TARGETS cpu: &lt;unknown&gt;/70%\nkubectl describe hpa api -n lab11 | grep -i -A3 warning\nkubectl set resources deploy api -n lab11 --requests=cpu=100m\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> event <code>missing request for cpu<\/code>. Sau khi thêm request và chờ khoảng 1 phút, TARGETS hiện dạng <code>0%/70%<\/code>.<\/p>\n<\/blockquote>"], ["Xem HPA scale (không chấm)", "<pre><code class=\"language-bash\">kubectl run load -n lab11 --image=busybox:1.36 -- sh -c 'while true; do wget -qO- http://web &gt;/dev/null; done'\nkubectl get hpa web -n lab11 -w          # chờ 1–2 phút\nkubectl delete pod load -n lab11\n./lab check 11\n<\/code><\/pre>"]]}, {"id": 12, "slug": "node-selection", "dir": "12-node-selection", "title": "nodeSelector, node affinity, taint và toleration", "level": 3, "env": "any", "minutes": 30, "comps": ["work:4"], "goal": "<p>Đặt Pod lên đúng node: chọn node bằng label, giữ riêng một node cho workload đặc biệt bằng taint, và cho đúng workload đó vào bằng toleration cộng affinity.<\/p>", "concepts": "<ul>\n<li><code>nodeSelector<\/code> là điều kiện cứng đơn giản. <code>nodeAffinity<\/code> có <code>requiredDuringScheduling…<\/code> (cứng) và <code>preferredDuringScheduling…<\/code> (cộng điểm, có <code>weight<\/code>).<\/li>\n<li><strong>Taint<\/strong> đẩy Pod ra khỏi node (<code>NoSchedule<\/code>, <code>PreferNoSchedule<\/code>, <code>NoExecute<\/code>). <strong>Toleration<\/strong> chỉ <em>cho phép<\/em> Pod vào node có taint, không <em>ép<\/em> Pod vào đó. Muốn dành riêng node: taint + toleration + affinity.<\/li>\n<li><code>IgnoredDuringExecution<\/code>: đổi label node sau khi Pod đã chạy không đuổi Pod. Riêng taint <code>NoExecute<\/code> thì đuổi.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Gắn label <code>disktype=ssd<\/code> cho <code>$NODE1<\/code> và <code>disktype=hdd<\/code> cho <code>$NODE2<\/code>.<\/p>", "<p>Trong <code>lab12<\/code>, tạo Pod <code>fast<\/code> (image <code>nginx:1.27<\/code>) chỉ chạy trên node có <code>disktype=ssd<\/code>, dùng <code>nodeSelector<\/code>.<\/p>", "<p>Dành <code>$NODE2<\/code> cho workload GPU: gắn taint <code>dedicated=gpu:NoSchedule<\/code> và label <code>accelerator=nvidia<\/code>.<\/p>", "<p>Tạo Deployment <code>gpu-job<\/code> (2 replica, image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) chạy <strong>chỉ<\/strong> trên <code>$NODE2<\/code>: tolerate taint ở trên và dùng <code>requiredDuringSchedulingIgnoredDuringExecution<\/code> với label <code>accelerator=nvidia<\/code>.<\/p>", "<p>Tạo Pod <code>flex<\/code> (image <code>nginx:1.27<\/code>) <strong>ưu tiên<\/strong> (không bắt buộc) node có <code>disktype=hdd<\/code>, weight 80.<\/p>"], "hints": [["Gỡ taint", "<p>Thêm dấu <code>-<\/code> ở cuối: <code>kubectl taint node $NODE2 dedicated-<\/code><\/p>"], ["Vì sao Pod tolerate rồi vẫn chạy sang node khác?", "<p>Toleration không chọn node. Cần thêm affinity hoặc nodeSelector.<\/p>"]], "solution": "<pre><code class=\"language-bash\">eval &quot;$(./lab env)&quot;\nkubectl label node $NODE1 disktype=ssd\nkubectl label node $NODE2 disktype=hdd accelerator=nvidia\nkubectl taint node $NODE2 dedicated=gpu:NoSchedule\nkubectl run fast -n lab12 --image=nginx:1.27 $do &gt; fast.yaml   # thêm nodeSelector rồi apply\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># fast\nspec:\n  nodeSelector: {disktype: ssd}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: gpu-job, namespace: lab12}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: gpu-job}}\n  template:\n    metadata: {labels: {app: gpu-job}}\n    spec:\n      tolerations:\n      - {key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}\n      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n            nodeSelectorTerms:\n            - matchExpressions:\n              - {key: accelerator, operator: In, values: [nvidia]}\n      containers:\n      - {name: job, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: flex, namespace: lab12}\nspec:\n  affinity:\n    nodeAffinity:\n      preferredDuringSchedulingIgnoredDuringExecution:\n      - weight: 80\n        preference:\n          matchExpressions:\n          - {key: disktype, operator: In, values: [hdd]}\n  containers:\n  - {name: flex, image: nginx:1.27}\n<\/code><\/pre>", "docs": [["Assigning Pods to nodes", "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"], ["Taints and tolerations", "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"]], "support": "scaffold", "prereq": [5, 9], "guide": [["Câu 1 · Gắn label cho node", "<p><strong>Khung:<\/strong> <code>kubectl label node &lt;node&gt; &lt;key&gt;=&lt;value&gt;<\/code>. Hai node, hai lệnh.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get nodes -L disktype<\/code> thêm cột <code>DISKTYPE<\/code>.<\/p>"], ["Câu 2 · nodeSelector", "<p><strong>Tra:<\/strong> <code>kubectl explain pod.spec.nodeSelector<\/code>. Đây là một map, đặt ngang hàng <code>containers<\/code>.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl run fast … $do &gt; fast.yaml<\/code>, thêm <code>nodeSelector:<\/code> vào <code>spec<\/code>, rồi apply.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pod fast -n lab12 -o wide<\/code>. Cột NODE phải là <code>$NODE1<\/code>.<\/p>"], ["Câu 3 · Taint", "<p><strong>Khung:<\/strong> <code>kubectl taint node &lt;node&gt; &lt;key&gt;=&lt;value&gt;:&lt;effect&gt;<\/code>. Label <code>accelerator<\/code> gắn như câu 1.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl describe node $NODE2 | grep Taints<\/code>.<\/p>"], ["Câu 4 · Toleration + node affinity bắt buộc", "<p>Hai cơ chế giải quyết hai việc khác nhau:<\/p>\n<ul>\n<li><strong>Toleration<\/strong> chỉ <em>cho phép<\/em> Pod chạy trên node có taint, không <em>kéo<\/em> Pod về đó.<\/li>\n<li><strong>Affinity bắt buộc<\/strong> mới <em>giới hạn<\/em> Pod chỉ chạy ở node có label.<\/li>\n<\/ul>\n<p>Bài này cần cả hai.<\/p>\n<p><strong>Tra:<\/strong> trang <em>Assigning Pods to Nodes<\/em>, mục <em>Node affinity<\/em>, có sẵn YAML mẫu để chép. <code>kubectl explain pod.spec.affinity.nodeAffinity<\/code> cho cấu trúc.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl create deploy gpu-job --replicas=2 … $do -- sleep 3600 &gt; gpu.yaml<\/code>. Trong <code>template.spec<\/code> thêm <code>tolerations:<\/code> (key, operator <code>Equal<\/code>, value, effect) và <code>affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[].matchExpressions[]<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -n lab12 -l app=gpu-job -o wide<\/code>. Cả hai Pod nằm trên <code>$NODE2<\/code>.<\/p>"], ["Câu 5 · Affinity ưu tiên", "<p><strong>Tra:<\/strong> cùng trang, ví dụ <code>preferredDuringSchedulingIgnoredDuringExecution<\/code>. Cấu trúc khác bản required: mỗi phần tử có <code>weight<\/code> và <code>preference.matchExpressions<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> <code>$NODE2<\/code> có taint, mà <code>flex<\/code> không tolerate. Vì vậy dù ưu tiên <code>hdd<\/code>, Pod vẫn phải chạy ở node khác. Đó là hành vi đúng: preferred không bao giờ thắng taint.<\/p>"]]}, {"id": 13, "slug": "spread-priority", "dir": "13-spread-priority", "title": "Anti-affinity, topology spread và PriorityClass", "level": 3, "env": "any", "minutes": 30, "comps": ["work:4"], "goal": "<p>Tách replica ra các node khác nhau để chịu lỗi, chia đều Pod theo topology, và gán độ ưu tiên cho workload quan trọng.<\/p>", "concepts": "<ul>\n<li><code>podAntiAffinity<\/code> với <code>topologyKey: kubernetes.io/hostname<\/code> cấm hai Pod cùng label nằm chung node. Nếu <code>required<\/code> mà không đủ node, Pod thừa đứng Pending.<\/li>\n<li><code>topologySpreadConstraints<\/code>: <code>maxSkew<\/code> là chênh lệch tối đa giữa các miền, <code>whenUnsatisfiable: DoNotSchedule<\/code> (cứng) hoặc <code>ScheduleAnyway<\/code>. <code>nodeTaintsPolicy: Honor<\/code> loại khỏi phép tính các node có taint mà Pod không tolerate (mặc định là <code>Ignore<\/code>, tức vẫn tính).<\/li>\n<li>PriorityClass gán số ưu tiên; Pod ưu tiên cao có thể <strong>preempt<\/strong> (đuổi) Pod thấp hơn khi thiếu chỗ. Một PriorityClass có thể là <code>globalDefault<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab13<\/code>, tạo Deployment <code>web<\/code> (2 replica, <code>nginx:1.27<\/code>, label <code>app=web<\/code>) mà hai Pod <strong>bắt buộc<\/strong> nằm trên hai node khác nhau.<\/p>", "<p>Tạo Deployment <code>spread<\/code> (4 replica, <code>nginx:1.27<\/code>, label <code>app=spread<\/code>) chia đều theo node (<code>kubernetes.io/hostname<\/code>), <code>maxSkew: 1<\/code>, không được vi phạm. Cả 4 Pod phải chạy.<\/p>", "<p>Cluster có một PriorityClass là mặc định toàn cục. Ghi tên của nó vào <code>~/cka-answers/13-default-pc.txt<\/code>.<\/p>", "<p>Tạo PriorityClass <code>critical-app<\/code> với value <code>1000000<\/code>, không phải mặc định, mô tả <code>payment<\/code>. Tạo Pod <code>vip<\/code> (<code>nginx:1.27<\/code>) dùng nó.<\/p>"], "hints": [["spread chỉ chạy được 2 Pod?", "<p>Control plane cũng được tính là một \"miền\" với 0 Pod, nên mỗi worker chỉ được 1 Pod. Đặt <code>nodeTaintsPolicy: Honor<\/code> để bỏ qua node có taint mà Pod không tolerate.<\/p>"], ["Tìm PriorityClass mặc định", "<p><code>kubectl get priorityclass<\/code> rồi xem cột <code>GLOBAL-DEFAULT<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web, namespace: lab13}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: web}}\n  template:\n    metadata: {labels: {app: web}}\n    spec:\n      affinity:\n        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n          - topologyKey: kubernetes.io/hostname\n            labelSelector: {matchLabels: {app: web}}\n      containers:\n      - {name: nginx, image: nginx:1.27}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: spread, namespace: lab13}\nspec:\n  replicas: 4\n  selector: {matchLabels: {app: spread}}\n  template:\n    metadata: {labels: {app: spread}}\n    spec:\n      topologySpreadConstraints:\n      - maxSkew: 1\n        topologyKey: kubernetes.io/hostname\n        whenUnsatisfiable: DoNotSchedule\n        nodeTaintsPolicy: Honor\n        labelSelector: {matchLabels: {app: spread}}\n      containers:\n      - {name: nginx, image: nginx:1.27}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pc                     # cột GLOBAL-DEFAULT\necho team-default &gt; ~/cka-answers/13-default-pc.txt\nkubectl create priorityclass critical-app --value=1000000 --description=payment\nkubectl run vip -n lab13 --image=nginx:1.27 $do &gt; vip.yaml   # thêm spec.priorityClassName: critical-app\nkubectl apply -f vip.yaml\nkubectl get pod vip -n lab13 -o jsonpath='{.spec.priority}'   # 1000000\n<\/code><\/pre>\n<p>Nếu thiếu <code>nodeTaintsPolicy: Honor<\/code>, control plane (có taint) vẫn được tính là một miền với 0 Pod, nên mỗi worker chỉ nhận 1 Pod và 2 Pod còn lại đứng Pending. Có <code>Honor<\/code> thì chỉ tính 2 worker: 2 + 2.<\/p>", "docs": [["Inter-pod affinity and anti-affinity", "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity"], ["Pod topology spread constraints", "https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"], ["Pod priority and preemption", "https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/"]], "support": "scaffold", "prereq": [12], "guide": [["Câu 1 · Pod anti-affinity bắt buộc", "<p><strong>Tra:<\/strong> trang <em>Assigning Pods to Nodes<\/em>, mục <em>Inter-pod affinity and anti-affinity<\/em>.<\/p>\n<p><strong>Khung:<\/strong> trong <code>template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[]<\/code> cần hai trường: <code>topologyKey<\/code> (miền: mỗi node là một miền) và <code>labelSelector<\/code> (tránh Pod nào: chính các Pod <code>app=web<\/code>).<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -n lab13 -l app=web -o wide<\/code>. Hai Pod nằm ở hai NODE khác nhau. Thử <code>kubectl scale … --replicas=3<\/code>: Pod thứ 3 phải Pending, rồi scale lại về 2.<\/p>"], ["Câu 2 · Topology spread", "<p><strong>Tra:<\/strong> trang <em>Pod Topology Spread Constraints<\/em>. Các trường cần có: <code>maxSkew<\/code>, <code>topologyKey<\/code>, <code>whenUnsatisfiable<\/code>, <code>labelSelector<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -n lab13 -l app=spread -o wide<\/code>. Phải có 4 Pod Running, 2 + 2.<\/p>\n<p><strong>Bẫy:<\/strong> nếu chỉ 2 Pod chạy và 2 Pending, đọc <code>kubectl describe pod<\/code> của Pod Pending, rồi xem lại trong trang tài liệu trường nào quyết định node <strong>có taint<\/strong> có được tính là một miền không.<\/p>"], ["Câu 3 · PriorityClass mặc định", "<p><strong>Khung:<\/strong> <code>kubectl get priorityclass<\/code>, rồi xem cột <code>GLOBAL-DEFAULT<\/code>.<\/p>"], ["Câu 4 · Tạo và dùng PriorityClass", "<p><strong>Khung:<\/strong> <code>kubectl create priorityclass --help<\/code> có đủ cờ: value, description, global-default. Pod dùng nó qua trường <code>spec.priorityClassName<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pod vip -n lab13 -o jsonpath='{.spec.priority}'<\/code>. Admission controller đã điền số <code>1000000<\/code> vào Pod.<\/p>"]]}, {"id": 14, "slug": "static-pod-maintenance", "dir": "14-static-pod-maintenance", "title": "Static pod, lập lịch thủ công và bảo trì node", "level": 3, "env": "kind", "minutes": 35, "comps": ["work:4", "work:3", "trouble:0"], "goal": "<p>Chạy Pod không qua scheduler (static pod, <code>nodeName<\/code>), và đưa một node vào bảo trì an toàn với PodDisruptionBudget, <code>cordon<\/code> và <code>drain<\/code>.<\/p>", "concepts": "<ul>\n<li><strong>Static pod<\/strong>: kubelet đọc file YAML trong <code>staticPodPath<\/code> (kubeadm: <code>/etc/kubernetes/manifests<\/code>) và chạy Pod mà không cần API server. API chỉ thấy một \"mirror pod\" tên <code>&lt;tên&gt;-&lt;node&gt;<\/code>; xóa bằng kubectl không có tác dụng, phải xóa file.<\/li>\n<li>Đặt <code>spec.nodeName<\/code> thì bỏ qua scheduler: kubelet của node đó nhận Pod luôn. Hữu ích khi scheduler chết.<\/li>\n<li><code>cordon<\/code> chặn Pod mới; <code>drain<\/code> = cordon + đuổi Pod qua Eviction API, tôn trọng <strong>PodDisruptionBudget<\/strong>. DaemonSet và mirror pod không bị đuổi; cần <code>--ignore-daemonsets<\/code>, <code>--delete-emptydir-data<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo static pod <code>static-web<\/code> (image <code>nginx:1.27<\/code>) trên <code>$NODE1<\/code>. Tìm đúng thư mục từ cấu hình kubelet của node.<\/p>", "<p>Giả sử scheduler đang hỏng. Tạo Pod <code>manual<\/code> (image <code>nginx:1.27<\/code>) trong <code>lab14<\/code> chạy trên <code>$NODE2<\/code> <strong>mà không qua scheduler<\/strong>.<\/p>", "<p>Deployment <code>web<\/code> trong <code>lab14<\/code> có 3 replica. Tạo PodDisruptionBudget <code>web-pdb<\/code> đảm bảo luôn còn ít nhất 2 Pod <code>app=web<\/code>.<\/p>", "<p>Đưa <code>$NODE1<\/code> vào bảo trì: không nhận Pod mới và mọi Pod thường đã dời đi. Để nguyên trạng thái này khi chấm; <code>./lab reset 14<\/code> sẽ đưa node trở lại.<\/p>"], "hints": [["Tìm thư mục static pod", "<p><code>./lab ssh $NODE1<\/code> rồi <code>grep staticPodPath /var/lib/kubelet/config.yaml<\/code><\/p>"], ["Drain bị chặn?", "<p>Đọc thông báo: thường do DaemonSet (<code>--ignore-daemonsets<\/code>), Pod dùng emptyDir (<code>--delete-emptydir-data<\/code>), hoặc Pod không có controller (Pod trần, cần <code>--force<\/code>, và Pod đó sẽ mất hẳn). Pod trần còn sót từ lab khác: <code>./lab reset &lt;id&gt;<\/code> hoặc thêm <code>--force<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">eval &quot;$(./lab env)&quot;\nkubectl run static-web --image=nginx:1.27 $do &gt; static-web.yaml\n./lab ssh $NODE1\n#   trên node:\n#   grep staticPodPath /var/lib/kubelet/config.yaml     → /etc/kubernetes/manifests\n#   cat &gt; /etc/kubernetes/manifests/static-web.yaml     (dán nội dung) ; exit\nkubectl get pod static-web-$NODE1                         # mirror pod\n\nkubectl run manual -n lab14 --image=nginx:1.27 $do &gt; manual.yaml\n# thêm  spec.nodeName: &lt;tên NODE2&gt;  rồi apply\nkubectl apply -f manual.yaml\n\nkubectl create pdb web-pdb -n lab14 --selector=app=web --min-available=2\nkubectl drain $NODE1 --ignore-daemonsets --delete-emptydir-data\nkubectl get nodes          # NODE1: Ready,SchedulingDisabled\n<\/code><\/pre>", "docs": [["Create static Pods", "https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/"], ["Safely drain a node", "https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/"], ["Disruptions", "https://kubernetes.io/docs/concepts/workloads/pods/disruptions/"]], "support": "scaffold", "prereq": [12], "guide": [["Câu 1 · Static pod", "<p>Static pod do <strong>kubelet<\/strong> đọc từ một thư mục trên node, không qua API server. API server chỉ thấy một \"mirror pod\" tên <code>&lt;tên&gt;-&lt;node&gt;<\/code>.<\/p>\n<p><strong>Tra:<\/strong> cấu hình kubelet ở <code>/var/lib/kubelet/config.yaml<\/code>, trường <code>staticPodPath<\/code>. Nếu không có file đó, xem cờ kubelet: <code>ps aux | grep kubelet<\/code>.<\/p>\n<p><strong>Khung:<\/strong> sinh YAML bằng <code>kubectl run … $do<\/code> ở máy bạn, <code>./lab ssh $NODE1<\/code>, rồi ghi file vào thư mục tìm được.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -A | grep static-web<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> xóa mirror pod bằng kubectl thì nó sống lại ngay. Muốn xóa static pod thì xóa file trên node.<\/p>"], ["Câu 2 · Lập lịch thủ công", "<p>Scheduler chỉ làm một việc: điền trường <code>spec.nodeName<\/code>. Tự điền trường này thì Pod bỏ qua scheduler.<\/p>\n<p><strong>Khung:<\/strong> YAML Pod + <code>nodeName: &lt;tên node&gt;<\/code> trong <code>spec<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> <code>nodeName<\/code> phải có <strong>khi tạo<\/strong> Pod. Pod đã Pending thì không sửa được, phải xóa đi tạo lại.<\/p>"], ["Câu 3 · PodDisruptionBudget", "<p><strong>Khung:<\/strong> <code>kubectl create pdb --help<\/code> (<code>--selector<\/code>, <code>--min-available<\/code>).<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pdb -n lab14<\/code>. Cột <code>ALLOWED DISRUPTIONS<\/code> là 1 (3 Pod − 2 tối thiểu).<\/p>"], ["Câu 4 · Bảo trì node", "<p><code>cordon<\/code> chỉ chặn Pod mới. <code>drain<\/code> = cordon + đuổi Pod đang chạy (có tôn trọng PDB).<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl drain &lt;node&gt;<\/code> cùng các cờ cho DaemonSet và emptyDir. Đọc thông báo lỗi: nó nói đúng cờ còn thiếu.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get nodes<\/code> thấy <code>SchedulingDisabled<\/code>; <code>kubectl get pods -A -o wide | grep $NODE1<\/code> chỉ còn Pod của DaemonSet và static pod.<\/p>\n<p><strong>Bẫy:<\/strong> Pod không có controller (Pod trần) chặn drain. Đọc kỹ thông báo trước khi thêm <code>--force<\/code>, vì Pod đó sẽ mất hẳn.<\/p>"]]}, {"id": 15, "slug": "services", "dir": "15-services", "title": "Service, EndpointSlice và kết nối giữa các Pod", "level": 4, "env": "any", "minutes": 35, "comps": ["net:2", "net:0", "trouble:4"], "goal": "<p>Tạo đủ loại Service, hiểu Service tìm Pod bằng selector và EndpointSlice, sửa Service không có endpoint, và trỏ Service ra ngoài cluster.<\/p>", "concepts": "<ul>\n<li>Service chọn Pod bằng <strong>label selector<\/strong>; EndpointSlice controller ghi IP:port của các Pod <strong>Ready<\/strong> khớp selector. Service không có endpoint gần như luôn do selector sai hoặc Pod chưa Ready.<\/li>\n<li><code>port<\/code> là cổng của Service, <code>targetPort<\/code> là cổng của container (có thể dùng tên cổng), <code>nodePort<\/code> là cổng mở trên mọi node (30000–32767).<\/li>\n<li><strong>Headless<\/strong> (<code>clusterIP: None<\/code>): DNS trả thẳng IP Pod; với StatefulSet mỗi Pod có tên riêng <code>db-0.db.&lt;ns&gt;.svc.cluster.local<\/code>.<\/li>\n<li>Service <strong>không selector<\/strong> cộng EndpointSlice tự tạo (label <code>kubernetes.io/service-name<\/code>) để trỏ tới máy ngoài cluster.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab15<\/code>, expose Deployment <code>web<\/code> thành Service ClusterIP tên <code>web<\/code>, cổng 80. Ghi ClusterIP của nó vào <code>~/cka-answers/15-web-ip.txt<\/code>.<\/p>", "<p>Tạo Service <code>web-np<\/code> kiểu NodePort cho <code>web<\/code>: cổng 80, nodePort <code>30080<\/code>.<\/p>", "<p>Service <code>api-svc<\/code> không trả lời. Sửa nó (không sửa Deployment <code>api<\/code>) để gọi <code>http://api-svc.lab15<\/code> từ Pod khác nhận được trang nginx.<\/p>", "<p>StatefulSet <code>db<\/code> đã có nhưng thiếu Service. Tạo headless Service <code>db<\/code> cổng 5432 để tên <code>db-0.db.lab15.svc.cluster.local<\/code> phân giải được.<\/p>", "<p>Tạo Service <code>legacy-db<\/code> (cổng 5432, không selector) trỏ tới máy <code>10.0.5.20:5432<\/code> bằng một EndpointSlice tự viết tên <code>legacy-db-1<\/code>.<\/p>"], "hints": [["Vì sao Service không có endpoint?", "<p>So <code>kubectl get svc api-svc -n lab15 -o jsonpath='{.spec.selector}'<\/code> với <code>kubectl get pods -n lab15 --show-labels<\/code>, và <code>targetPort<\/code> với cổng container.<\/p>"], ["Thử gọi Service", "<p><code>kubectl run t -n lab15 --rm -it --image=busybox:1.36 --restart=Never -- wget -qO- -T3 api-svc<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl expose deploy web -n lab15 --port=80\nkubectl get svc web -n lab15 -o jsonpath='{.spec.clusterIP}' &gt; ~/cka-answers/15-web-ip.txt\nkubectl expose deploy web -n lab15 --name=web-np --type=NodePort --port=80 $do &gt; np.yaml\n# thêm nodePort: 30080 dưới ports[0], rồi\nkubectl apply -f np.yaml\n\nkubectl get svc api-svc -n lab15 -o yaml       # selector app=apis, targetPort 8080\nkubectl get pods -n lab15 --show-labels        # Pod có app=api, nginx nghe cổng 80\nkubectl patch svc api-svc -n lab15 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/selector&quot;,&quot;value&quot;:{&quot;app&quot;:&quot;api&quot;}},{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/ports/0/targetPort&quot;,&quot;value&quot;:80}]'\nkubectl get endpointslices -n lab15 -l kubernetes.io/service-name=api-svc\n\nkubectl create svc clusterip db -n lab15 --clusterip=None --tcp=5432\n# selector của Service tạo bằng lệnh trên là app=db, khớp label Pod của StatefulSet\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Service\nmetadata: {name: legacy-db, namespace: lab15}\nspec:\n  ports: [{port: 5432, protocol: TCP}]\n---\napiVersion: discovery.k8s.io/v1\nkind: EndpointSlice\nmetadata:\n  name: legacy-db-1\n  namespace: lab15\n  labels: {kubernetes.io/service-name: legacy-db}\naddressType: IPv4\nports: [{port: 5432, protocol: TCP}]\nendpoints: [{addresses: [&quot;10.0.5.20&quot;]}]\n<\/code><\/pre>", "docs": [["Service", "https://kubernetes.io/docs/concepts/services-networking/service/"], ["EndpointSlices", "https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/"], ["Debug Services", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"]], "support": "scaffold", "prereq": [5], "guide": [["Câu 1 · Expose ClusterIP", "<p><strong>Khung:<\/strong> <code>kubectl expose deploy &lt;tên&gt; --port=…<\/code>, rồi lấy <code>spec.clusterIP<\/code> bằng jsonpath và ghi vào file.<\/p>"], ["Câu 2 · NodePort cố định", "<p><code>kubectl expose<\/code> không có cờ để chọn nodePort.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl expose … --name=web-np --type=NodePort $do &gt; np.yaml<\/code>, thêm <code>nodePort: 30080<\/code> vào <code>ports[0]<\/code>, rồi apply.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get svc web-np -n lab15<\/code> hiện cột PORT(S) <code>80:30080/TCP<\/code>.<\/p>"], ["Câu 3 · Service không trả lời", "<p>Service nối với Pod qua hai thứ, phải kiểm tra <strong>cả hai<\/strong>:<\/p>\n<ol>\n<li><code>selector<\/code> của Service phải khớp <strong>label<\/strong> của Pod.<\/li>\n<li><code>targetPort<\/code> phải là cổng container <strong>thật sự lắng nghe<\/strong>.<\/li>\n<\/ol>\n<p><strong>Khung:<\/strong> so <code>kubectl get svc api-svc -o yaml<\/code> với <code>kubectl get pods --show-labels<\/code> và <code>containerPort<\/code> của Pod.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get endpointslices -n lab15 -l kubernetes.io/service-name=api-svc<\/code> có địa chỉ, rồi <code>kubectl run t --rm -it --image=busybox:1.36 -n lab15 --restart=Never -- wget -qO- -T3 api-svc<\/code>.<\/p>"], ["Câu 4 · Headless Service cho StatefulSet", "<p>Headless (<code>clusterIP: None<\/code>) không có IP ảo. DNS trả thẳng IP của Pod, và mỗi Pod của StatefulSet có tên riêng <code>&lt;pod&gt;.&lt;service&gt;<\/code>.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl create svc clusterip --help<\/code>, tìm cờ cho clusterIP None.<\/p>\n<p><strong>Bẫy:<\/strong> tên Service phải trùng <code>spec.serviceName<\/code> của StatefulSet. Selector phải khớp label Pod: kiểm tra Service <code>create svc<\/code> sinh selector gì.<\/p>"], ["Câu 5 · Service trỏ ra ngoài cluster", "<p>Service <strong>không có selector<\/strong> thì control plane không tạo EndpointSlice, bạn tự viết.<\/p>\n<p><strong>Tra:<\/strong> trang <em>Service<\/em>, mục <em>Services without selectors<\/em>, có YAML EndpointSlice mẫu.<\/p>\n<p><strong>Bẫy:<\/strong> label <code>kubernetes.io/service-name<\/code> nối EndpointSlice với Service. Thiếu label này thì Service không dùng nó.<\/p>"]]}, {"id": 16, "slug": "dns-coredns", "dir": "16-dns-coredns", "title": "DNS trong cluster và CoreDNS", "level": 4, "env": "any", "minutes": 30, "comps": ["net:5", "trouble:4"], "goal": "<p>Hiểu tên DNS của Service và Pod, đọc cấu hình DNS của Pod, tùy chỉnh <code>dnsPolicy<\/code>, và sửa Corefile của CoreDNS để phân giải tên nội bộ của công ty.<\/p>", "concepts": "<ul>\n<li>Service: <code>&lt;svc&gt;.&lt;ns&gt;.svc.&lt;cluster-domain&gt;<\/code> (mặc định <code>cluster.local<\/code>). Pod đọc <code>/etc/resolv.conf<\/code>: nameserver là ClusterIP của Service <code>kube-dns<\/code>, có <code>search &lt;ns&gt;.svc.cluster.local svc.cluster.local cluster.local<\/code> và <code>ndots:5<\/code>.<\/li>\n<li><code>dnsPolicy<\/code>: <code>ClusterFirst<\/code> (mặc định, dùng CoreDNS), <code>Default<\/code> (dùng DNS của node, <strong>không<\/strong> phân giải được Service), <code>None<\/code> (tự khai báo trong <code>dnsConfig<\/code>).<\/li>\n<li>CoreDNS cấu hình bằng ConfigMap <code>coredns<\/code> trong <code>kube-system<\/code> (Corefile). Có thể thêm server block riêng cho một zone. Plugin <code>reload<\/code> tự nạp lại sau khoảng 30 giây; muốn nhanh thì <code>kubectl -n kube-system rollout restart deploy coredns<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi ClusterIP của Service DNS của cluster vào <code>~/cka-answers/16-dns-ip.txt<\/code>, và cluster domain vào <code>~/cka-answers/16-domain.txt<\/code>.<\/p>", "<p>Pod <code>client<\/code> trong <code>lab16<\/code> không phân giải được tên Service nào. Tìm nguyên nhân và sửa để từ <code>client<\/code> chạy <code>nslookup web.lab16<\/code> thành công. Giữ nguyên tên Pod và image.<\/p>", "<p>Tạo Pod <code>custom-dns<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) <strong>chỉ<\/strong> dùng nameserver <code>1.1.1.1<\/code>, search domain <code>lab16.svc.cluster.local<\/code>, option <code>ndots: 2<\/code>.<\/p>", "<p>Công ty có máy <code>legacy.corp.internal<\/code> ở <code>10.10.10.10<\/code> mà DNS công cộng không biết. Sửa CoreDNS để mọi Pod phân giải được tên này, không làm hỏng DNS của cluster.<\/p>"], "hints": [["Tìm cluster domain", "<p><code>kubectl -n kube-system get cm coredns -o yaml<\/code> (dòng <code>kubernetes cluster.local …<\/code>) hoặc <code>clusterDomain<\/code> trong <code>/var/lib/kubelet/config.yaml<\/code> của node.<\/p>"], ["Thêm zone vào Corefile", "<p>Thêm một server block mới ở cuối Corefile, dùng plugin <code>hosts<\/code>:<\/p>\n<pre><code>corp.internal:53 {\n    errors\n    hosts {\n        10.10.10.10 legacy.corp.internal\n    }\n}\n<\/code><\/pre>"]], "solution": "<pre><code class=\"language-bash\">kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}' &gt; ~/cka-answers/16-dns-ip.txt\necho cluster.local &gt; ~/cka-answers/16-domain.txt\n\nkubectl get pod client -n lab16 -o jsonpath='{.spec.dnsPolicy}'   # Default → dùng DNS của node\nkubectl get pod client -n lab16 -o yaml &gt; client.yaml\n# đổi dnsPolicy: Default → ClusterFirst (hoặc xóa dòng), rồi\nkubectl replace --force -f client.yaml\nkubectl exec client -n lab16 -- nslookup web.lab16\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: custom-dns, namespace: lab16}\nspec:\n  dnsPolicy: None\n  dnsConfig:\n    nameservers: [&quot;1.1.1.1&quot;]\n    searches: [&quot;lab16.svc.cluster.local&quot;]\n    options: [{name: ndots, value: &quot;2&quot;}]\n  containers:\n  - {name: c, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl -n kube-system edit cm coredns     # thêm server block corp.internal ở cuối Corefile\nkubectl -n kube-system rollout restart deploy coredns\nkubectl run t --rm -it --image=busybox:1.36 --restart=Never -- nslookup legacy.corp.internal\n<\/code><\/pre>", "docs": [["DNS for Services and Pods", "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"], ["Customizing DNS Service", "https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/"], ["Debugging DNS resolution", "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"]], "support": "scaffold", "prereq": [15], "guide": [["Câu 1 · DNS Service và cluster domain", "<p><strong>Khung:<\/strong> Service DNS nằm trong <code>kube-system<\/code>, tên lịch sử là <code>kube-dns<\/code>. Cluster domain nằm ở hai chỗ: Corefile (<code>kubernetes &lt;domain&gt; …<\/code>) và cấu hình kubelet (<code>clusterDomain<\/code>). Có thể xem nhanh trong <code>/etc/resolv.conf<\/code> của một Pod bất kỳ.<\/p>"], ["Câu 2 · Pod không phân giải được tên Service", "<p><strong>Tra:<\/strong> trang <em>DNS for Services and Pods<\/em>, mục <em>Pod's DNS Policy<\/em>. Đọc kỹ ý nghĩa của <code>Default<\/code>: nó <strong>không<\/strong> phải giá trị mặc định.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl exec client -n lab16 -- cat /etc/resolv.conf<\/code>, so với Pod khác. Trường này không sửa được trên Pod đang chạy: xuất YAML, sửa, <code>kubectl replace --force -f<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec client -n lab16 -- nslookup web.lab16<\/code>.<\/p>"], ["Câu 3 · dnsPolicy None + dnsConfig", "<p><strong>Tra:<\/strong> cùng trang, mục <em>Pod's DNS Config<\/em>, có YAML mẫu.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec custom-dns -n lab16 -- cat /etc/resolv.conf<\/code> có đúng 3 dòng <code>nameserver<\/code>, <code>search<\/code>, <code>options<\/code>.<\/p>"], ["Câu 4 · Thêm zone vào CoreDNS", "<p><strong>Tra:<\/strong> trang <em>Customizing DNS Service<\/em>, có ví dụ server block cho một domain riêng. Plugin <code>hosts<\/code> của CoreDNS khai báo tên → IP tĩnh.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl -n kube-system edit cm coredns<\/code>, thêm một server block <code>corp.internal:53 { … }<\/code> <strong>ở ngoài<\/strong> block <code>.:53<\/code>, rồi <code>rollout restart<\/code> CoreDNS.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl -n kube-system logs deploy/coredns<\/code> không có lỗi; <code>nslookup legacy.corp.internal<\/code> từ một Pod mới.<\/p>\n<p><strong>Bẫy:<\/strong> sai một dấu ngoặc là CoreDNS CrashLoop và <strong>cả cluster<\/strong> mất DNS. Luôn sao lưu ConfigMap trước khi sửa: <code>kubectl get cm coredns -n kube-system -o yaml &gt; coredns.bak.yaml<\/code>.<\/p>"]]}, {"id": 17, "slug": "network-policy", "dir": "17-network-policy", "title": "NetworkPolicy theo mô hình mặc định chặn", "level": 4, "env": "any", "minutes": 40, "comps": ["net:1", "net:0"], "goal": "<p>Khóa một ứng dụng ba tầng web → api → db: chặn mặc định, chỉ mở đúng các đường cần thiết, kể cả theo namespace và chiều đi ra (egress).<\/p>", "concepts": "<ul>\n<li>Pod không bị policy nào chọn thì nhận mọi traffic. Một khi bị chọn cho chiều <code>Ingress<\/code> (hoặc <code>Egress<\/code>), chỉ traffic được liệt kê mới qua.<\/li>\n<li>Trong một phần tử <code>from<\/code>, <code>podSelector<\/code> và <code>namespaceSelector<\/code> đặt <strong>cùng một gạch đầu dòng<\/strong> là AND; tách thành <strong>hai gạch đầu dòng<\/strong> là OR.<\/li>\n<li>Namespace luôn có label <code>kubernetes.io/metadata.name=&lt;tên&gt;<\/code>, tiện để chọn một namespace cụ thể.<\/li>\n<li>Chặn egress thì phải mở UDP/TCP 53 tới CoreDNS, nếu không mọi lần gọi bằng tên đều lỗi.<\/li>\n<li>Policy chỉ có hiệu lực khi CNI hỗ trợ (kindnet, Calico, Cilium… có; Flannel thuần thì không).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab17<\/code>, tạo policy <code>default-deny<\/code> chặn <strong>mọi ingress<\/strong> tới mọi Pod.<\/p>", "<p>Tạo policy <code>web-to-api<\/code>: Pod <code>app=api<\/code> chỉ nhận traffic TCP 80 từ Pod <code>app=web<\/code> cùng namespace.<\/p>", "<p>Tạo policy <code>api-to-db<\/code>: Pod <code>app=db<\/code> chỉ nhận TCP 80 từ Pod <code>app=api<\/code>.<\/p>", "<p>Tạo policy <code>monitoring-to-api<\/code>: Pod trong các namespace có label <code>purpose=monitoring<\/code> được gọi <code>app=api<\/code> cổng 80. Namespace <code>lab17-mon<\/code> đã có label đó; namespace <code>lab17-other<\/code> thì không và phải bị chặn.<\/p>", "<p>Tạo policy <code>api-egress<\/code>: Pod <code>app=api<\/code> chỉ được gọi ra Pod <code>app=db<\/code> cổng 80 và DNS (cổng 53 UDP và TCP).<\/p>"], "hints": [["Kiểm tra bằng Pod có label giả lập", "<p><code>kubectl run t -n lab17 --rm -it --image=busybox:1.36 --labels=app=web --restart=Never -- wget -qO- -T3 api<\/code><\/p>"], ["DNS cho egress", "<p><code>to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]<\/code> với <code>ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: default-deny, namespace: lab17}\nspec:\n  podSelector: {}\n  policyTypes: [Ingress]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: web-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: web}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-to-db, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: db}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: api}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: monitoring-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{namespaceSelector: {matchLabels: {purpose: monitoring}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-egress, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Egress]\n  egress:\n  - to: [{podSelector: {matchLabels: {app: db}}}]\n    ports: [{protocol: TCP, port: 80}]\n  - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]\n    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]\n<\/code><\/pre>\n<p>Các policy cộng dồn: <code>api<\/code> nhận được từ <code>web<\/code> (policy 2) <strong>hoặc<\/strong> từ namespace monitoring (policy 4).<\/p>", "docs": [["Network Policies", "https://kubernetes.io/docs/concepts/services-networking/network-policies/"], ["Declare Network Policy", "https://kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/"]], "support": "scaffold", "prereq": [15, 16], "guide": [["Cách nghĩ về NetworkPolicy", "<ul>\n<li>Khi Pod chưa bị policy nào chọn, mọi traffic tới nó đều được phép.<\/li>\n<li>Khi một policy chọn Pod theo chiều Ingress, chỉ những gì policy cho phép mới được vào. Chiều Egress cũng vậy.<\/li>\n<li>Các policy <strong>cộng dồn<\/strong> (OR): không có rule \"deny\" riêng.<\/li>\n<\/ul>\n<p>Vẽ ra giấy: Pod nào nhận từ ai, cổng nào, rồi mới viết YAML.<\/p>"], ["Câu 1 · default-deny", "<p><strong>Tra:<\/strong> trang <em>Network Policies<\/em>, mục <em>Default policies<\/em>, có YAML chép được.<\/p>"], ["Câu 2–3 · Cho phép theo label Pod", "<p><strong>Khung:<\/strong> <code>podSelector<\/code> (Pod được bảo vệ) + <code>ingress[].from[].podSelector<\/code> (ai được gọi) + <code>ingress[].ports<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> giả lập Pod nguồn bằng label:\n<code>kubectl run t -n lab17 --rm -it --image=busybox:1.36 --labels=app=web --restart=Never -- wget -qO- -T3 api<\/code>.<\/p>"], ["Câu 4 · Cho phép theo namespace", "<p><strong>Khung:<\/strong> <code>from[].namespaceSelector.matchLabels<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> trong <code>from<\/code>, <code>namespaceSelector<\/code> và <code>podSelector<\/code> <strong>cùng một phần tử<\/strong> nghĩa là AND, còn <strong>hai phần tử<\/strong> nghĩa là OR. Một dấu <code>-<\/code> thừa làm đổi nghĩa cả policy.<\/p>"], ["Câu 5 · Egress", "<p>Khi bật Egress, Pod mất luôn DNS: gọi bằng tên sẽ hỏng dù đã cho phép tới <code>db<\/code>.<\/p>\n<p><strong>Khung:<\/strong> một rule tới <code>app=db<\/code> cổng 80, một rule tới DNS cổng 53 cả UDP và TCP. Để chọn Pod CoreDNS ở namespace khác, xem label của nó: <code>kubectl get pods -n kube-system --show-labels | grep dns<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> từ Pod label <code>app=api<\/code>, <code>wget db<\/code> được và <code>wget web<\/code> bị chặn.<\/p>"]]}, {"id": 18, "slug": "ingress", "dir": "18-ingress", "title": "Ingress, IngressClass và TLS", "level": 4, "env": "any", "minutes": 30, "comps": ["net:4"], "goal": "<p>Viết Ingress định tuyến theo host và path tới nhiều Service, gắn chứng chỉ TLS, và chọn IngressClass mặc định.<\/p>", "concepts": "<ul>\n<li>Ingress chỉ là bản mô tả; cần một <strong>Ingress controller<\/strong> (Traefik, HAProxy, NGINX…) để thực thi. <code>ingressClassName<\/code> chọn controller nào xử lý.<\/li>\n<li><code>pathType<\/code>: <code>Prefix<\/code> (khớp theo từng đoạn <code>/<\/code>), <code>Exact<\/code> (khớp đúng), <code>ImplementationSpecific<\/code>.<\/li>\n<li>TLS: Secret kiểu <code>kubernetes.io/tls<\/code> có <code>tls.crt<\/code> và <code>tls.key<\/code>, khai báo trong <code>spec.tls<\/code> cùng danh sách host.<\/li>\n<li>Annotation <code>ingressclass.kubernetes.io/is-default-class: \"true\"<\/code> trên IngressClass làm nó mặc định cho Ingress không ghi class.<\/li>\n<li>Dự án ingress-nginx đã ngừng phát triển; hướng mới là Gateway API (lab 19). Đề thi vẫn hỏi cả hai.<\/li>\n<\/ul>", "setup_note": "<p>Lab chấm theo nội dung object, không cần controller. Muốn thấy traffic thật, cài một controller (ví dụ Traefik bằng Helm) và đổi <code>ingressClassName<\/code> cho khớp.<\/p>", "tasks": ["<p>Tạo chứng chỉ tự ký cho <code>shop.lab.local<\/code> và Secret TLS <code>shop-tls<\/code> trong <code>lab18<\/code>.<\/p>", "<p>Tạo Ingress <code>shop<\/code> (class <code>lab-ingress<\/code>) cho host <code>shop.lab.local<\/code>: path <code>/api<\/code> (Prefix) tới Service <code>api<\/code> cổng 8080, path <code>/<\/code> (Prefix) tới Service <code>web<\/code> cổng 80, dùng TLS <code>shop-tls<\/code>.<\/p>", "<p>Tạo Ingress <code>docs<\/code> không ghi <code>ingressClassName<\/code>, host <code>docs.lab.local<\/code>, path <code>/guide<\/code> kiểu <strong>Exact<\/strong> tới <code>web:80<\/code>.<\/p>", "<p>Đặt IngressClass <code>lab-ingress<\/code> làm mặc định của cluster.<\/p>"], "hints": [["Tạo cert và Secret", "<p><code>openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj \"/CN=shop.lab.local\"<\/code> rồi <code>kubectl create secret tls shop-tls --cert=tls.crt --key=tls.key -n lab18<\/code><\/p>"], ["Sinh Ingress bằng lệnh", "<p><code>kubectl create ingress shop -n lab18 --class=lab-ingress --rule=\"shop.lab.local/api*=api:8080,tls=shop-tls\" --rule=\"shop.lab.local/*=web:80,tls=shop-tls\"<\/code> (dấu <code>*<\/code> = Prefix)<\/p>"]], "solution": "<pre><code class=\"language-bash\">openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj &quot;/CN=shop.lab.local&quot;\nkubectl create secret tls shop-tls -n lab18 --cert=tls.crt --key=tls.key\nkubectl create ingress shop -n lab18 --class=lab-ingress \\\n  --rule=&quot;shop.lab.local/api*=api:8080,tls=shop-tls&quot; \\\n  --rule=&quot;shop.lab.local/*=web:80,tls=shop-tls&quot;\nkubectl create ingress docs -n lab18 --rule=&quot;docs.lab.local/guide=web:80&quot;\nkubectl annotate ingressclass lab-ingress ingressclass.kubernetes.io/is-default-class=true\nkubectl describe ingress shop -n lab18\n<\/code><\/pre>", "docs": [["Ingress", "https://kubernetes.io/docs/concepts/services-networking/ingress/"], ["Ingress controllers", "https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/"]], "support": "scaffold", "prereq": [15], "guide": [["Câu 1 · Chứng chỉ và Secret TLS", "<p><strong>Khung:<\/strong> <code>openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout … -out … -subj \"/CN=&lt;host&gt;\"<\/code>, rồi <code>kubectl create secret tls --help<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get secret shop-tls -n lab18<\/code> có TYPE <code>kubernetes.io/tls<\/code>.<\/p>"], ["Câu 2 · Ingress nhiều path + TLS", "<p><strong>Khung:<\/strong> <code>kubectl create ingress --help<\/code> có ví dụ cú pháp <code>--rule=\"host/path=service:port,tls=secret\"<\/code>. Path kết thúc bằng <code>*<\/code> là kiểu Prefix.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl describe ingress shop -n lab18<\/code> liệt kê 2 path, backend, và TLS. Backend <code>&lt;error: endpoints not found&gt;<\/code> nghĩa là Service hoặc cổng sai.<\/p>"], ["Câu 3 · Path kiểu Exact, không ghi class", "<p><strong>Khung:<\/strong> cùng lệnh, path không có <code>*<\/code> là Exact; bỏ cờ <code>--class<\/code>.<\/p>"], ["Câu 4 · IngressClass mặc định", "<p><strong>Tra:<\/strong> trang <em>Ingress<\/em>, mục <em>Default IngressClass<\/em>, nêu tên annotation.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get ingressclass<\/code> hiện <code>(default)<\/code>. Ingress <code>docs<\/code> không có class sẽ được controller mặc định nhận.<\/p>"]]}, {"id": 19, "slug": "gateway-api", "dir": "19-gateway-api", "title": "Gateway API, HTTPRoute và ReferenceGrant", "level": 4, "env": "any", "minutes": 40, "comps": ["net:3"], "goal": "<p>Dựng định tuyến L7 bằng Gateway API: Gateway do đội hạ tầng quản lý, HTTPRoute của đội ứng dụng, chia traffic canary theo weight và theo header, và cho phép tham chiếu chéo namespace.<\/p>", "concepts": "<ul>\n<li><strong>GatewayClass<\/strong> (loại controller) → <strong>Gateway<\/strong> (listener: cổng, giao thức, TLS, namespace nào được gắn route) → <strong>HTTPRoute<\/strong> (match theo host, path, header; gửi tới <code>backendRefs<\/code> có <code>weight<\/code>).<\/li>\n<li><code>allowedRoutes.namespaces.from<\/code>: <code>Same<\/code> (mặc định), <code>All<\/code>, hoặc <code>Selector<\/code> theo label namespace.<\/li>\n<li>Route tham chiếu Service ở <strong>namespace khác<\/strong> chỉ hợp lệ khi namespace đích có <strong>ReferenceGrant<\/strong> cho phép.<\/li>\n<li>Kiểm tra trạng thái: <code>kubectl describe httproute<\/code>, các condition <code>Accepted<\/code> và <code>ResolvedRefs<\/code> (cần controller thật).<\/li>\n<\/ul>", "setup_note": "<p>Setup cài CRD Gateway API v1.6.3 (bản standard) từ GitHub nếu cluster chưa có, và tạo GatewayClass <code>lab-gc<\/code>. Lab chấm theo nội dung object. Muốn thấy traffic thật, cài một implementation như Envoy Gateway hoặc NGINX Gateway Fabric và đổi <code>gatewayClassName<\/code>.<\/p>", "tasks": ["<p>Gắn label <code>gateway-access=true<\/code> cho namespace <code>lab19-app<\/code>.<\/p>", "<p>Trong <code>lab19-infra<\/code>, tạo Gateway <code>public<\/code> (class <code>lab-gc<\/code>) có listener tên <code>http<\/code>, HTTP cổng 80, chỉ nhận route từ namespace có label <code>gateway-access=true<\/code>.<\/p>", "<p>Trong <code>lab19-app<\/code>, tạo HTTPRoute <code>shop<\/code> gắn vào <code>public<\/code>, host <code>shop.lab.local<\/code>, gồm 3 rule:\nrequest có header <code>x-canary: \"true\"<\/code> đi <strong>hết<\/strong> vào <code>api-v2:8080<\/code>;\npath <code>/api<\/code> (PathPrefix) chia <code>api:8080<\/code> weight 90 và <code>api-v2:8080<\/code> weight 10;\ncòn lại (<code>/<\/code>) vào <code>web:80<\/code>.<\/p>", "<p>Đội hạ tầng tạo HTTPRoute <code>admin<\/code> trong <code>lab19-infra<\/code> (host <code>admin.lab.local<\/code>) gửi tới Service <code>admin<\/code> cổng 80 ở <code>lab19-app<\/code>. Tạo route đó và ReferenceGrant <code>allow-infra-routes<\/code> trong <code>lab19-app<\/code> cho phép HTTPRoute từ <code>lab19-infra<\/code> tham chiếu Service.<\/p>"], "hints": [["Khung Gateway", "<p><code>kubectl explain gateway.spec.listeners.allowedRoutes --recursive<\/code><\/p>"], ["Match theo header", "<p><code>matches: [{headers: [{name: x-canary, value: \"true\"}]}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl label ns lab19-app gateway-access=true\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata: {name: public, namespace: lab19-infra}\nspec:\n  gatewayClassName: lab-gc\n  listeners:\n  - name: http\n    protocol: HTTP\n    port: 80\n    allowedRoutes:\n      namespaces:\n        from: Selector\n        selector: {matchLabels: {gateway-access: &quot;true&quot;}}\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: shop, namespace: lab19-app}\nspec:\n  parentRefs: [{name: public, namespace: lab19-infra}]\n  hostnames: [&quot;shop.lab.local&quot;]\n  rules:\n  - matches: [{headers: [{name: x-canary, value: &quot;true&quot;}]}]\n    backendRefs: [{name: api-v2, port: 8080}]\n  - matches: [{path: {type: PathPrefix, value: /api}}]\n    backendRefs:\n    - {name: api, port: 8080, weight: 90}\n    - {name: api-v2, port: 8080, weight: 10}\n  - matches: [{path: {type: PathPrefix, value: /}}]\n    backendRefs: [{name: web, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: admin, namespace: lab19-infra}\nspec:\n  parentRefs: [{name: public}]\n  hostnames: [&quot;admin.lab.local&quot;]\n  rules:\n  - backendRefs: [{name: admin, namespace: lab19-app, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: ReferenceGrant\nmetadata: {name: allow-infra-routes, namespace: lab19-app}\nspec:\n  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: lab19-infra}]\n  to: [{group: &quot;&quot;, kind: Service}]\n<\/code><\/pre>", "docs": [["Gateway API (Kubernetes docs)", "https://kubernetes.io/docs/concepts/services-networking/gateway/"], ["Gateway API guides", "https://gateway-api.sigs.k8s.io/guides/"], ["HTTP traffic splitting", "https://gateway-api.sigs.k8s.io/guides/traffic-splitting/"]], "support": "scaffold", "prereq": [18], "guide": [["Mô hình Gateway API", "<p>Gateway API tách trách nhiệm theo vai trò:<\/p>\n<ul>\n<li><strong>GatewayClass<\/strong> (nhà cung cấp) cho biết controller nào xử lý.<\/li>\n<li><strong>Gateway<\/strong> (đội hạ tầng) mở listener và quyết định namespace nào được gắn route.<\/li>\n<li><strong>HTTPRoute<\/strong> (đội ứng dụng) khai báo luật định tuyến.<\/li>\n<\/ul>\n<p>Không có lệnh <code>kubectl create<\/code> cho các loại này. Mở trang <em>gateway-api.sigs.k8s.io<\/em> (được phép trong phòng thi) để chép YAML mẫu.<\/p>"], ["Câu 1–2 · Gateway chỉ nhận route từ namespace có label", "<p><strong>Tra:<\/strong> <code>kubectl explain gateway.spec.listeners.allowedRoutes.namespaces<\/code>. Có 3 giá trị <code>from<\/code>: <code>Same<\/code>, <code>All<\/code>, <code>Selector<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get gateway -n lab19-infra<\/code>, rồi <code>kubectl describe gateway public -n lab19-infra<\/code> để xem <code>Listeners<\/code>.<\/p>"], ["Câu 3 · HTTPRoute 3 rule", "<p><strong>Tra:<\/strong> trang <em>HTTP routing<\/em>, <em>HTTP header matching<\/em> và <em>Traffic splitting<\/em> của Gateway API.<\/p>\n<p><strong>Khung:<\/strong> <code>parentRefs<\/code> (Gateway ở namespace khác thì ghi <code>namespace<\/code>), <code>hostnames<\/code>, <code>rules[]<\/code> gồm <code>matches<\/code> + <code>backendRefs<\/code> (có <code>weight<\/code>).<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl describe httproute shop -n lab19-app<\/code>. Phần <code>Status.Parents<\/code> phải có <code>Accepted: True<\/code> và <code>ResolvedRefs: True<\/code>.<\/p>"], ["Câu 4 · Route tham chiếu Service ở namespace khác", "<p>Mặc định route chỉ được trỏ tới Service <strong>cùng namespace<\/strong>. Namespace chứa Service phải \"đồng ý\" bằng ReferenceGrant.<\/p>\n<p><strong>Tra:<\/strong> trang <em>ReferenceGrant<\/em>. <code>from<\/code> là ai tham chiếu (group, kind, namespace); <code>to<\/code> là bị tham chiếu (group <code>\"\"<\/code> cho Service).<\/p>\n<p><strong>Tự kiểm:<\/strong> trước khi tạo ReferenceGrant, <code>describe httproute admin<\/code> báo <code>RefNotPermitted<\/code>. Sau đó lỗi biến mất.<\/p>"]]}, {"id": 20, "slug": "volumes", "dir": "20-volumes", "title": "Volume: emptyDir, hostPath, projected và Downward API", "level": 5, "env": "kind", "minutes": 30, "comps": ["stor:1"], "goal": "<p>Chọn đúng loại volume cho từng nhu cầu: chia sẻ dữ liệu giữa container trong Pod, đọc ghi thư mục của node, và gom nhiều nguồn cấu hình vào một thư mục.<\/p>", "concepts": "<ul>\n<li><strong>emptyDir<\/strong> sống theo Pod, dùng chung giữa các container. <code>medium: Memory<\/code> là tmpfs (tính vào memory limit), <code>sizeLimit<\/code> giới hạn dung lượng.<\/li>\n<li><strong>hostPath<\/strong> gắn thư mục của node vào Pod; dữ liệu gắn với một node và là rủi ro bảo mật. <code>type: DirectoryOrCreate<\/code> tự tạo thư mục.<\/li>\n<li><strong>projected<\/strong> gộp <code>configMap<\/code>, <code>secret<\/code>, <code>downwardAPI<\/code>, <code>serviceAccountToken<\/code> vào một thư mục.<\/li>\n<li><strong>Downward API<\/strong> đưa thông tin của chính Pod (tên, namespace, IP, node, label, resources) vào biến môi trường hoặc file.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab20<\/code>, tạo Pod <code>shared<\/code> có 2 container dùng chung emptyDir <code>data<\/code> (tmpfs, tối đa 64Mi) gắn tại <code>/data<\/code>: container <code>writer<\/code> (<code>busybox:1.36<\/code>) ghi <code>date<\/code> vào <code>/data/out.log<\/code> mỗi 2 giây; container <code>reader<\/code> (<code>busybox:1.36<\/code>) chạy <code>tail -F /data/out.log<\/code>.<\/p>", "<p>Tạo Pod <code>hostlog<\/code> (<code>busybox:1.36<\/code>) chạy trên <code>$NODE1<\/code>, gắn hostPath <code>/var/log/lab20<\/code> (tự tạo nếu chưa có) tại <code>/logs<\/code>, và ghi file <code>/logs/hello.txt<\/code> có nội dung <code>hello from pod<\/code>.<\/p>", "<p>Tạo Pod <code>info<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có biến <code>POD_IP<\/code> và <code>NODE_NAME<\/code> lấy từ Downward API, và một projected volume tại <code>/etc/info<\/code> gồm: ConfigMap <code>app-cfg<\/code> (có sẵn), label của Pod vào file <code>labels<\/code>, và token ServiceAccount hạn 3600 giây vào file <code>token<\/code>.<\/p>"], "hints": [["Ghi vào emptyDir trong vòng lặp", "<p><code>sh -c 'while true; do date &gt;&gt; /data/out.log; sleep 2; done'<\/code><\/p>"], ["Pod chạy trên một node cụ thể", "<p>Dùng <code>nodeName: &lt;node&gt;<\/code> hoặc <code>nodeSelector: {kubernetes.io/hostname: &lt;node&gt;}<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: shared, namespace: lab20}\nspec:\n  volumes:\n  - name: data\n    emptyDir: {medium: Memory, sizeLimit: 64Mi}\n  containers:\n  - name: writer\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;while true; do date &gt;&gt; /data/out.log; sleep 2; done&quot;]\n    volumeMounts: [{name: data, mountPath: /data}]\n  - name: reader\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -F /data/out.log
