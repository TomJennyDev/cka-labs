\nkubectl $K create deploy hello --image=nginx:1.27\nkubectl $K get nodes        # Forbidden\n<\/code><\/pre>", "docs": [["Certificates and certificate signing requests", "https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/"], ["Configure access to multiple clusters", "https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/"]], "support": "scaffold", "prereq": [23], "guide": [["Kubernetes nhận diện user thế nào", "<p>Kubernetes không có object User. Với chứng chỉ client, <strong>CN<\/strong> là tên user và <strong>O<\/strong> là group. Chứng chỉ phải do CA của cluster ký: CertificateSigningRequest là cách xin chữ ký đó qua API.<\/p>"], ["Câu 1 · Khóa và CSR", "<p><strong>Khung:<\/strong> <code>openssl genrsa -out … 2048<\/code>, rồi <code>openssl req -new -key … -subj \"/CN=&lt;user&gt;/O=&lt;group&gt;\" -out …<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>openssl req -in dev1.csr -noout -subject<\/code>.<\/p>"], ["Câu 2 · CertificateSigningRequest", "<p><strong>Tra:<\/strong> trang <em>Certificates and Certificate Signing Requests<\/em>, mục <em>Normal user<\/em>, có YAML đầy đủ (signerName, usages, expirationSeconds). Trường <code>request<\/code> là file CSR mã hóa base64 trên <strong>một dòng<\/strong> (<code>base64 -w0<\/code>).<\/p>\n<p><strong>Khung:<\/strong> apply, <code>kubectl certificate approve<\/code>, rồi lấy <code>status.certificate<\/code> và giải mã base64.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>openssl x509 -in dev1.crt -noout -subject -enddate<\/code>.<\/p>"], ["Câu 3 · kubeconfig riêng", "<p><strong>Khung:<\/strong> bốn lệnh <code>kubectl config set-cluster | set-credentials | set-context | use-context<\/code>, mỗi lệnh có <code>--kubeconfig=&lt;file&gt;<\/code>, và <code>--embed-certs<\/code> để nhúng nội dung thay vì đường dẫn. Server và CA lấy từ <code>kubectl config view --minify --raw<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> quên <code>--kubeconfig<\/code> thì bạn đã sửa vào <code>~/.kube/config<\/code>.<\/p>"], ["Câu 4 · Quyền cho group", "<p><strong>Khung:<\/strong> Role + RoleBinding với <code>--group<\/code>.<\/p>"], ["Câu 5 · Tự kiểm bằng chính kubeconfig mới", "<p><strong>Tự kiểm:<\/strong> <code>kubectl --kubeconfig ~/cka-answers/dev1.kubeconfig auth whoami<\/code>, rồi <code>create deploy<\/code>, rồi <code>get nodes<\/code> (phải Forbidden).<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  key[&quot;dev1.key&quot;] --&gt; csr[&quot;dev1.csr&lt;br/&gt;CN=dev1 · O=developers&quot;]\n  csr --&gt;|&quot;base64&quot;| obj[&quot;CertificateSigningRequest dev1&quot;]\n  obj --&gt;|&quot;kubectl certificate approve&quot;| crt[&quot;dev1.crt&quot;]\n  crt &amp; key --&gt; kc[&quot;dev1.kubeconfig&lt;br/&gt;context dev1@lab · ns lab24&quot;]\n  ca[&quot;CA của cluster&quot;] --&gt; kc\n  kc --&gt; api[&quot;kube-apiserver&quot;]\n  rb[&quot;RoleBinding developers&lt;br/&gt;group developers&quot;] --&gt; role[&quot;Role: pods, deployments&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Admin\n  participant A as kube-apiserver\n  participant CS as signer (controller-manager)\n  actor D as dev1\n  U-&gt;&gt;A: tạo CSR (signer kube-apiserver-client)\n  U-&gt;&gt;A: approve\n  CS-&gt;&gt;A: ký bằng CA, ghi status.certificate\n  U-&gt;&gt;U: lấy cert, dựng kubeconfig riêng\n  D-&gt;&gt;A: request với chứng chỉ client\n  A-&gt;&gt;A: xác thực: user = CN dev1, groups = O developers\n  A-&gt;&gt;A: RBAC theo group developers\n  A--&gt;&gt;D: tạo Deployment ✔, xem node ✘ 403\n<\/code><\/pre>"]]}, {"id": 25, "slug": "security-context-psa", "dir": "25-security-context-psa", "title": "securityContext và Pod Security Admission", "level": 6, "env": "any", "minutes": 30, "comps": ["work:4", "arch:0"], "goal": "<p>Bắt một namespace tuân thủ chuẩn bảo mật <code>restricted<\/code>, sửa workload cũ cho đạt chuẩn, và chạy container với filesystem chỉ đọc.<\/p>", "concepts": "<ul>\n<li>Pod Security Admission bật bằng <strong>label namespace<\/strong>: <code>pod-security.kubernetes.io/&lt;enforce|audit|warn&gt;=&lt;privileged|baseline|restricted&gt;<\/code>. <code>enforce<\/code> từ chối Pod mới; Pod đang chạy <strong>không<\/strong> bị đuổi.<\/li>\n<li>Chuẩn <code>restricted<\/code> đòi: <code>runAsNonRoot: true<\/code>, <code>allowPrivilegeEscalation: false<\/code>, <code>capabilities.drop: [ALL]<\/code>, <code>seccompProfile.type: RuntimeDefault<\/code> (hoặc <code>Localhost<\/code>), không hostPath/hostNetwork/privileged.<\/li>\n<li>Với Deployment, Pod bị từ chối không xuất hiện: lỗi nằm ở event <code>FailedCreate<\/code> của ReplicaSet.<\/li>\n<li><code>readOnlyRootFilesystem: true<\/code> chặn ghi vào filesystem của image; chỗ cần ghi thì gắn <code>emptyDir<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Bật cho namespace <code>lab25<\/code> chế độ <code>enforce<\/code> và <code>warn<\/code> ở mức <code>restricted<\/code>.<\/p>", "<p>Deployment <code>api<\/code> trong <code>lab25<\/code> đang chạy với root. Sau khi bật enforce, nó không tạo được Pod mới. Sửa <code>api<\/code> đạt chuẩn <code>restricted<\/code>, chạy với UID <code>1000<\/code>, rồi rollout lại để Pod mới được tạo.<\/p>", "<p>Tạo Pod <code>secure<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) đạt chuẩn <code>restricted<\/code>, root filesystem <strong>chỉ đọc<\/strong>, và ghi được vào <code>/tmp<\/code> nhờ một emptyDir.<\/p>"], "hints": [["Xem vì sao Pod bị từ chối", "<p><code>kubectl rollout restart deploy api -n lab25<\/code> rồi <code>kubectl describe rs -n lab25 -l app=api | grep -A2 FailedCreate<\/code><\/p>"], ["Thử nhanh với dry-run phía server", "<p><code>kubectl apply -f pod.yaml --dry-run=server<\/code> báo ngay vi phạm PSA mà không tạo gì.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl label ns lab25 pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted\nkubectl edit deploy api -n lab25\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">    spec:\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 1000\n        seccompProfile: {type: RuntimeDefault}\n      containers:\n      - name: busybox\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        securityContext:\n          allowPrivilegeEscalation: false\n          capabilities: {drop: [&quot;ALL&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: secure, namespace: lab25}\nspec:\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 1000\n    seccompProfile: {type: RuntimeDefault}\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities: {drop: [&quot;ALL&quot;]}\n    volumeMounts: [{name: tmp, mountPath: /tmp}]\n  volumes:\n  - {name: tmp, emptyDir: {}}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl exec secure -n lab25 -- touch /x        # Read-only file system\nkubectl exec secure -n lab25 -- touch /tmp/x    # được\n<\/code><\/pre>", "docs": [["Pod Security Standards", "https://kubernetes.io/docs/concepts/security/pod-security-standards/"], ["Pod Security Admission", "https://kubernetes.io/docs/concepts/security/pod-security-admission/"], ["Configure a Security Context", "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"]], "support": "scaffold", "prereq": [7, 23], "guide": [["Câu 1 · Bật Pod Security Admission", "<p>PSA đọc label của namespace: <code>pod-security.kubernetes.io/&lt;mode&gt;=&lt;level&gt;<\/code>. Có ba mode:<\/p>\n<ul>\n<li><code>enforce<\/code>: từ chối Pod vi phạm.<\/li>\n<li><code>warn<\/code>: in cảnh báo.<\/li>\n<li><code>audit<\/code>: ghi vào audit log.<\/li>\n<\/ul>\n<p><strong>Tra:<\/strong> trang <em>Enforce Pod Security Standards with Namespace Labels<\/em>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get ns lab25 --show-labels<\/code>.<\/p>"], ["Câu 2 · Đưa Deployment đạt chuẩn restricted", "<p>Enforce chỉ chặn Pod <strong>mới<\/strong>. Pod đang chạy không bị đuổi, nên Deployment trông vẫn ổn cho tới lần rollout kế tiếp.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl rollout restart deploy api -n lab25<\/code>, rồi xem lý do bị từ chối ở <code>kubectl describe rs -n lab25<\/code> hoặc <code>kubectl get events -n lab25<\/code>. Thông báo liệt kê <strong>từng<\/strong> trường còn thiếu.<\/p>\n<p><strong>Tra:<\/strong> trang <em>Pod Security Standards<\/em>, bảng mức <em>Restricted<\/em>. Bốn trường gần như luôn cần là <code>runAsNonRoot<\/code>, <code>seccompProfile<\/code>, <code>allowPrivilegeEscalation: false<\/code>, <code>capabilities.drop: [ALL]<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> thử nhanh mà không tạo gì: <code>kubectl apply -f api.yaml --dry-run=server<\/code>. Server áp dụng PSA và in cảnh báo nếu còn thiếu.<\/p>"], ["Câu 3 · Root filesystem chỉ đọc", "<p><strong>Khung:<\/strong> <code>securityContext.readOnlyRootFilesystem: true<\/code> ở cấp container, và một emptyDir gắn vào <code>/tmp<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec secure -n lab25 -- touch /x<\/code> phải lỗi; <code>touch /tmp/x<\/code> phải được.<\/p>\n<p><strong>Bẫy:<\/strong> có trường chỉ đặt được ở cấp <strong>Pod<\/strong> (<code>fsGroup<\/code>), có trường chỉ đặt được ở cấp <strong>container<\/strong> (<code>capabilities<\/code>, <code>readOnlyRootFilesystem<\/code>). Xem bằng <code>kubectl explain pod.spec.securityContext<\/code> và <code>kubectl explain pod.spec.containers.securityContext<\/code>.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  ns[&quot;ns lab25&lt;br/&gt;enforce=restricted · warn=restricted&quot;]\n  old[&quot;Pod api cũ (root)&lt;br/&gt;vẫn chạy&quot;] --- ns\n  new[&quot;Pod api mới (root)&quot;] -.-&gt;|&quot;bị từ chối&quot;| ns\n  fix[&quot;Pod api đã sửa&lt;br/&gt;runAsNonRoot · UID 1000 · seccomp&lt;br/&gt;no privilege escalation · drop ALL&quot;] --&gt;|&quot;được nhận&quot;| ns\n  sec[&quot;Pod secure&lt;br/&gt;readOnlyRootFilesystem&lt;br/&gt;emptyDir tại /tmp&quot;] --&gt; ns\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class new bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant RS as ReplicaSet controller\n  participant A as kube-apiserver\n  participant PSA as admission PodSecurity\n  participant KL as kubelet\n  RS-&gt;&gt;A: POST Pod\n  A-&gt;&gt;PSA: đọc label pod-security của namespace\n  PSA-&gt;&gt;PSA: so spec Pod với mức restricted\n  alt vi phạm và mode enforce\n    PSA--&gt;&gt;A: từ chối, liệt kê từng trường sai\n    A--&gt;&gt;RS: event FailedCreate\n  else hợp lệ\n    A--&gt;&gt;RS: Pod đã tạo\n    KL-&gt;&gt;KL: áp securityContext: UID, seccomp, capabilities, rootfs chỉ đọc\n  end\n<\/code><\/pre>"]]}, {"id": 26, "slug": "helm", "dir": "26-helm", "title": "Helm từ chart đến rollback", "level": 7, "env": "any", "minutes": 35, "comps": ["arch:5"], "goal": "<p>Dùng Helm như trong công việc thật: tạo chart, cài release với values, nâng cấp giữ values cũ, quay lại revision tốt, render YAML để kiểm tra trước, và gỡ release.<\/p>", "concepts": "<ul>\n<li><strong>Chart<\/strong> là gói template + <code>values.yaml<\/code>; <strong>release<\/strong> là một lần cài chart vào cluster; mỗi lần <code>upgrade<\/code> hoặc <code>rollback<\/code> tạo một <strong>revision<\/strong> mới (lưu dạng Secret trong namespace của release).<\/li>\n<li><code>--set<\/code> và <code>-f values.yaml<\/code> ghi đè giá trị. <code>helm upgrade<\/code> <strong>không<\/strong> giữ <code>--set<\/code> cũ trừ khi thêm <code>--reuse-values<\/code>.<\/li>\n<li><code>helm template<\/code> render YAML ở máy, không cần cluster. <code>helm get values<\/code>, <code>helm history<\/code>, <code>helm rollback &lt;release&gt; &lt;revision&gt;<\/code>.<\/li>\n<li>Chart từ repo: <code>helm repo add<\/code>, <code>helm search repo<\/code>, <code>helm install … --version<\/code>. Chart từ OCI registry: <code>helm install x oci://…<\/code>.<\/li>\n<\/ul>", "setup_note": "<p>Cần Helm v3 trên máy chạy lab (<code>helm version<\/code>). Lab dùng chart tạo tại chỗ bằng <code>helm create<\/code>, không cần internet.<\/p>", "tasks": ["<p>Tạo chart <code>webapp<\/code> trong <code>~/cka-answers/lab26/<\/code> bằng <code>helm create<\/code>.<\/p>", "<p>Cài release <code>web<\/code> từ chart đó vào namespace <code>lab26<\/code> với 2 replica và image <code>nginx:1.27<\/code> (chart mặc định dùng repository <code>nginx<\/code>, chỉ cần đặt tag).<\/p>", "<p>Nâng cấp <code>web<\/code> để Service thành <code>NodePort<\/code>, <strong>giữ<\/strong> các giá trị đã đặt trước đó.<\/p>", "<p>Nâng cấp tiếp với image tag <code>1.99<\/code> (không tồn tại), thấy Pod lỗi, rồi rollback về revision có NodePort và <code>nginx:1.27<\/code>.<\/p>", "<p>Không cài, chỉ render chart với release tên <code>preview<\/code> và 3 replica, lưu vào <code>~/cka-answers/26-rendered.yaml<\/code>.<\/p>", "<p>Cài thử release <code>tmp<\/code> vào <code>lab26<\/code> rồi gỡ nó.<\/p>"], "hints": [["Đặt nhiều giá trị", "<p><code>--set replicaCount=2,image.tag=1.27<\/code><\/p>"], ["Xem revision", "<p><code>helm history web -n lab26<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">mkdir -p ~/cka-answers/lab26 &amp;&amp; cd ~/cka-answers/lab26\nhelm create webapp\nhelm install web ./webapp -n lab26 --set replicaCount=2,image.tag=1.27\nhelm upgrade web ./webapp -n lab26 --reuse-values --set service.type=NodePort\nhelm upgrade web ./webapp -n lab26 --reuse-values --set image.tag=1.99\nkubectl get pods -n lab26                       # ImagePullBackOff\nhelm history web -n lab26\nhelm rollback web 2 -n lab26\nhelm template preview ./webapp --set replicaCount=3 &gt; ~/cka-answers/26-rendered.yaml\nhelm install tmp ./webapp -n lab26\nhelm uninstall tmp -n lab26\nhelm list -n lab26\n<\/code><\/pre>", "docs": [["Helm quickstart", "https://helm.sh/docs/intro/quickstart/"], ["helm upgrade", "https://helm.sh/docs/helm/helm_upgrade/"]], "support": "solo", "prereq": [5], "guide": [["Quy trình", "<ol>\n<li>Đọc <code>values.yaml<\/code> của chart trước khi đặt giá trị: <code>helm show values &lt;chart&gt;<\/code> cho biết tên khóa chính xác (<code>replicaCount<\/code>, <code>image.tag<\/code>, <code>service.type<\/code>).<\/li>\n<li>Mọi lệnh thay đổi đều có <code>-n &lt;ns&gt;<\/code>. Quên namespace là lỗi phổ biến nhất với Helm.<\/li>\n<li>Sau mỗi lần <code>install<\/code>/<code>upgrade<\/code>, kiểm tra bằng <code>helm list -n …<\/code>, <code>helm get values …<\/code> và <code>kubectl get<\/code> các object thật.<\/li>\n<\/ol>"], ["Tự tra cứu", "<p><code>helm &lt;lệnh&gt; --help<\/code> có ví dụ cho mọi tình huống của bài. Hãy chú ý các cờ:<\/p>\n<ul>\n<li>giữ giá trị cũ khi nâng cấp;<\/li>\n<li>chọn revision để quay lại;<\/li>\n<li>render mà không cài.<\/li>\n<\/ul>"], ["Kiểm chứng", "<ul>\n<li><code>helm history web -n lab26<\/code> thể hiện đúng câu chuyện: install → NodePort → 1.99 → rollback.<\/li>\n<li><code>helm get values web -n lab26<\/code> của revision cuối có đủ replica, tag và loại Service.<\/li>\n<\/ul>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  ch[&quot;chart webapp&lt;br/&gt;(helm create)&quot;] --&gt; tpl[&quot;templates/*.yaml&quot;]\n  val[&quot;values.yaml&lt;br/&gt;+ --set&quot;] --&gt; tpl\n  tpl --&gt;|&quot;helm template&quot;| y[&quot;26-rendered.yaml&lt;br/&gt;(không cài)&quot;]\n  tpl --&gt;|&quot;helm install / upgrade&quot;| rel[&quot;release web · ns lab26&quot;]\n  rel --&gt; obj[&quot;Deployment, Service...&quot;]\n  rel --&gt; sec[(&quot;Secret sh.helm.release.v1.web.vN&lt;br/&gt;lưu từng revision&quot;)]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant H as helm\n  participant A as kube-apiserver\n  U-&gt;&gt;H: install web --set replicaCount=2,image.tag=1.27\n  H-&gt;&gt;H: render template với values\n  H-&gt;&gt;A: tạo object, lưu revision 1\n  U-&gt;&gt;H: upgrade --reuse-values --set service.type=NodePort\n  H-&gt;&gt;A: áp thay đổi, lưu revision 2\n  U-&gt;&gt;H: upgrade --reuse-values --set image.tag=1.99\n  H-&gt;&gt;A: revision 3, Pod mới ImagePullBackOff\n  U-&gt;&gt;H: rollback web 2\n  H-&gt;&gt;A: áp lại manifest của revision 2, lưu thành revision 4\n<\/code><\/pre>"]]}, {"id": 27, "slug": "kustomize", "dir": "27-kustomize", "title": "Kustomize với base và overlay", "level": 7, "env": "any", "minutes": 30, "comps": ["arch:5"], "goal": "<p>Tùy biến bộ manifest cho từng môi trường mà không sửa file gốc: overlay đổi namespace, tiền tố tên, label, số replica, image, cấu hình sinh tự động và patch.<\/p>", "concepts": "<ul>\n<li><code>kustomization.yaml<\/code> liệt kê <code>resources<\/code> rồi biến đổi: <code>namespace<\/code>, <code>namePrefix<\/code>, <code>labels<\/code>, <code>images<\/code>, <code>replicas<\/code>, <code>patches<\/code>.<\/li>\n<li><code>configMapGenerator<\/code> sinh ConfigMap có <strong>hậu tố hash<\/strong> theo nội dung, và tự sửa mọi chỗ tham chiếu. Đổi cấu hình là đổi tên ConfigMap, nên Deployment tự rollout. Trong overlay dùng <code>behavior: merge<\/code> để ghi đè key của base.<\/li>\n<li><code>kubectl kustomize &lt;dir&gt;<\/code> xem kết quả; <code>kubectl apply -k &lt;dir&gt;<\/code> áp dụng. kubectl có sẵn Kustomize, không cần cài thêm.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Base có sẵn ở <code>~/cka-answers/lab27/base<\/code> (Deployment <code>web<\/code>, Service <code>web<\/code>, ConfigMap <code>app-config<\/code> sinh bằng generator). Đọc nó.<\/p>", "<p>Tạo overlay <code>~/cka-answers/lab27/overlays/prod<\/code> dùng base đó, với: namespace <code>lab27<\/code>; tiền tố tên <code>prod-<\/code>; label <code>env=prod<\/code> gắn cả vào selector; 3 replica; image <code>nginx:1.28<\/code>; <code>MODE=prod<\/code> thay cho <code>MODE=dev<\/code>; container <code>web<\/code> có request <code>cpu: 100m<\/code>.<\/p>", "<p>Lưu kết quả render của overlay vào <code>~/cka-answers/27-rendered.yaml<\/code>, rồi áp dụng overlay vào cluster.<\/p>"], "hints": [["Ghi đè ConfigMap của base", "<pre><code class=\"language-yaml\">configMapGenerator:\n- name: app-config\n  behavior: merge\n  literals: [MODE=prod]\n<\/code><\/pre>"], ["Patch resources", "<p>File <code>resources.yaml<\/code> dạng strategic merge (Deployment tên <code>web<\/code>, container <code>web<\/code>) rồi <code>patches: [{path: resources.yaml}]<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\"># ~/cka-answers/lab27/overlays/prod/kustomization.yaml\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../../base]\nnamespace: lab27\nnamePrefix: prod-\nlabels:\n- pairs: {env: prod}\n  includeSelectors: true\nreplicas:\n- {name: web, count: 3}\nimages:\n- {name: nginx, newTag: &quot;1.28&quot;}\nconfigMapGenerator:\n- name: app-config\n  behavior: merge\n  literals: [MODE=prod]\npatches:\n- path: resources.yaml\n---\n# ~/cka-answers/lab27/overlays/prod/resources.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web}\nspec:\n  template:\n    spec:\n      containers:\n      - name: web\n        resources:\n          requests: {cpu: 100m}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl kustomize ~/cka-answers/lab27/overlays/prod &gt; ~/cka-answers/27-rendered.yaml\nkubectl apply -k ~/cka-answers/lab27/overlays/prod\nkubectl get deploy,svc,cm -n lab27\n<\/code><\/pre>", "docs": [["Declarative management with Kustomize", "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"], ["Kustomize reference", "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/"]], "support": "solo", "prereq": [6, 26], "guide": [["Quy trình", "<ol>\n<li>Đọc base: <code>kustomization.yaml<\/code> liệt kê resource và generator gì. Render thử <code>kubectl kustomize &lt;base&gt;<\/code> để biết tên object thực tế.<\/li>\n<li>Mỗi yêu cầu của đề ứng với một trường trong <code>kustomization.yaml<\/code> của overlay. Lập bảng trước: namespace, tiền tố tên, label (có gắn vào selector không), số replica, image, ConfigMap, patch.<\/li>\n<li>Render overlay sau <strong>mỗi<\/strong> thay đổi và đọc kết quả, chưa apply vội.<\/li>\n<\/ol>"], ["Tự tra cứu", "<ul>\n<li>Trang <em>Declarative Management of Kubernetes Objects Using Kustomize<\/em> liệt kê các trường và ví dụ.<\/li>\n<li><code>kubectl explain<\/code> không áp dụng cho kustomization. Khi cần, dùng tài liệu tham chiếu của kustomize trên kubectl.docs.kubernetes.io.<\/li>\n<\/ul>"], ["Kiểm chứng", "<ul>\n<li>Trong file render: tên có tiền tố, selector có <code>env=prod<\/code>, ConfigMap có hậu tố hash và Deployment tham chiếu đúng tên mới đó.<\/li>\n<li><code>kubectl apply -k &lt;overlay&gt;<\/code>, rồi <code>kubectl get all,cm -n lab27<\/code>.<\/li>\n<\/ul>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph base [&quot;base&quot;]\n    d[&quot;deployment.yaml&quot;]\n    s[&quot;service.yaml&quot;]\n    g[&quot;configMapGenerator&lt;br/&gt;MODE=dev&quot;]\n  end\n  subgraph prod [&quot;overlays/prod&quot;]\n    k[&quot;kustomization.yaml&lt;br/&gt;namespace · namePrefix prod-&lt;br/&gt;labels env=prod (cả selector)&lt;br/&gt;replicas 3 · image 1.28&lt;br/&gt;MODE=prod · patch CPU 100m&quot;]\n  end\n  base --&gt; k\n  k --&gt;|&quot;kubectl kustomize&quot;| out[&quot;27-rendered.yaml&quot;]\n  k --&gt;|&quot;kubectl apply -k&quot;| cl[&quot;ns lab27: prod-web, prod-app-config-hash&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant K as kubectl kustomize\n  participant B as base\n  participant O as overlay prod\n  K-&gt;&gt;B: đọc resources, sinh ConfigMap (tên + hash nội dung)\n  K-&gt;&gt;O: áp generator merge: MODE=prod thay MODE=dev\n  K-&gt;&gt;O: áp namespace, namePrefix, labels\n  K-&gt;&gt;O: áp replicas, images, patches\n  K-&gt;&gt;K: sửa mọi tham chiếu tới tên ConfigMap mới\n  K--&gt;&gt;K: in YAML cuối cùng\n<\/code><\/pre>\n<p>ConfigMap đổi nội dung thì hash đổi, Deployment tham chiếu tên mới và tự rollout.<\/p>"]]}, {"id": 28, "slug": "crd-operator", "dir": "28-crd-operator", "title": "CustomResourceDefinition và Operator", "level": 7, "env": "any", "minutes": 30, "comps": ["arch:7", "arch:6"], "goal": "<p>Mở rộng Kubernetes API bằng loại object của riêng bạn, có kiểm tra dữ liệu, tên viết tắt và cột hiển thị; hiểu Operator dùng CRD thế nào.<\/p>", "concepts": "<ul>\n<li>CRD khai báo <code>group<\/code>, <code>names<\/code> (<code>kind<\/code>, <code>plural<\/code>, <code>singular<\/code>, <code>shortNames<\/code>), <code>scope<\/code> (<code>Namespaced<\/code> hoặc <code>Cluster<\/code>), và các <code>versions<\/code> (một version là <code>storage: true<\/code>).<\/li>\n<li><code>openAPIV3Schema<\/code> kiểm tra dữ liệu ngay khi tạo: kiểu, <code>required<\/code>, <code>minimum<\/code>/<code>maximum<\/code>, <code>enum<\/code>. Object sai bị API từ chối.<\/li>\n<li><code>additionalPrinterColumns<\/code> thêm cột cho <code>kubectl get<\/code>.<\/li>\n<li><strong>Operator<\/strong> = CRD + controller theo dõi các object đó và vận hành phần mềm thay con người (cert-manager, Prometheus Operator, CloudNativePG…). Cài thường bằng Helm hoặc manifest.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo CRD <code>backups.ops.example.com<\/code>: kind <code>Backup<\/code>, namespaced, tên ngắn <code>bk<\/code>, version <code>v1<\/code>. Schema: <code>spec.schedule<\/code> (string, <strong>bắt buộc<\/strong>), <code>spec.retention<\/code> (integer từ 1 tới 30). Thêm hai cột <code>Schedule<\/code> và <code>Retention<\/code> cho <code>kubectl get<\/code>.<\/p>", "<p>Trong <code>lab28<\/code>, tạo Backup <code>nightly<\/code> với schedule <code>0 2 * * *<\/code>, retention <code>7<\/code>.<\/p>", "<p>Thử tạo Backup <code>bad<\/code> với retention <code>100<\/code>. API phải từ chối; không được có object <code>bad<\/code>.<\/p>", "<p>Ghi các tên ngắn của resource thuộc group <code>ops.example.com<\/code> (theo <code>kubectl api-resources<\/code>) vào <code>~/cka-answers/28-short.txt<\/code>.<\/p>"], "hints": [["Khung CRD", "<p>Xem ví dụ trong tài liệu \"Extend the Kubernetes API with CustomResourceDefinitions\" rồi sửa tên. <code>kubectl explain backup.spec<\/code> chạy được khi schema đúng.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata: {name: backups.ops.example.com}\nspec:\n  group: ops.example.com\n  scope: Namespaced\n  names: {kind: Backup, plural: backups, singular: backup, shortNames: [bk]}\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n        type: object\n        properties:\n          spec:\n            type: object\n            required: [schedule]\n            properties:\n              schedule: {type: string}\n              retention: {type: integer, minimum: 1, maximum: 30}\n    additionalPrinterColumns:\n    - {name: Schedule, type: string, jsonPath: .spec.schedule}\n    - {name: Retention, type: integer, jsonPath: .spec.retention}\n---\napiVersion: ops.example.com/v1\nkind: Backup\nmetadata: {name: nightly, namespace: lab28}\nspec: {schedule: &quot;0 2 * * *&quot;, retention: 7}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get bk -n lab28                # có cột SCHEDULE, RETENTION\nkubectl explain backup.spec\n# bad: The Backup &quot;bad&quot; is invalid: spec.retention: Invalid value: 100: must be less than or equal to 30\nkubectl api-resources --api-group=ops.example.com\necho bk &gt; ~/cka-answers/28-short.txt\n<\/code><\/pre>", "docs": [["Custom resources", "https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/"], ["Extend the API with CRDs", "https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/"], ["Operator pattern", "https://kubernetes.io/docs/concepts/extend-kubernetes/operator/"]], "support": "solo", "prereq": [4], "guide": [["Quy trình", "<ol>\n<li>Chép CRD mẫu từ trang <em>Extend the Kubernetes API with CustomResourceDefinitions<\/em>, rồi sửa từng phần: <code>group<\/code>, <code>names<\/code> (plural, singular, kind, shortNames), <code>scope<\/code>, <code>versions[]<\/code>.<\/li>\n<li>Schema OpenAPI nằm ở <code>versions[].schema.openAPIV3Schema<\/code>. Ràng buộc bắt buộc (<code>required<\/code>) và khoảng giá trị (<code>minimum<\/code>/<code>maximum<\/code>) viết ở đây.<\/li>\n<li>Cột hiển thị là <code>versions[].additionalPrinterColumns<\/code> với <code>jsonPath<\/code>.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>kubectl get crd backups.ops.example.com<\/code>, rồi <code>kubectl api-resources --api-group=ops.example.com<\/code>.<\/li>\n<li>Tạo một object hợp lệ và một object sai: API phải trả lỗi validation <strong>ngay lúc tạo<\/strong>.<\/li>\n<li><code>kubectl get bk -n lab28<\/code> có cột Schedule và Retention.<\/li>\n<\/ul>"], ["Liên hệ thực tế", "<p>Operator = CRD + controller theo dõi object đó. Khi cài operator (cert-manager, Prometheus Operator…), bạn sẽ thấy CRD của nó trong <code>kubectl get crd<\/code>.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  crd[&quot;CRD backups.ops.example.com&lt;br/&gt;kind Backup · short bk&lt;br/&gt;schema: schedule (bắt buộc), retention 1–30&quot;]\n  crd --&gt; api[&quot;API mới:&lt;br/&gt;/apis/ops.example.com/v1/.../backups&quot;]\n  ok[&quot;Backup nightly&lt;br/&gt;retention 7&quot;] --&gt;|&quot;hợp lệ&quot;| api\n  bad[&quot;Backup bad&lt;br/&gt;retention 100&quot;] -.-&gt;|&quot;bị từ chối&quot;| api\n  op[&quot;Operator (controller)&quot;] -.-&gt;|&quot;watch Backup, làm việc thật&quot;| api\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class bad bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant U as Bạn\n  participant A as kube-apiserver\n  participant E as etcd\n  participant OP as Operator\n  U-&gt;&gt;A: tạo CRD\n  A-&gt;&gt;A: đăng ký endpoint REST mới, kubectl api-resources thấy bk\n  U-&gt;&gt;A: tạo Backup\n  A-&gt;&gt;A: kiểm tra theo openAPIV3Schema\n  alt sai schema\n    A--&gt;&gt;U: 422 Invalid\n  else đúng\n    A-&gt;&gt;E: lưu\n    OP-&gt;&gt;A: watch Backup mới\n    OP-&gt;&gt;OP: reconcile: tạo CronJob, cập nhật status\n  end\n<\/code><\/pre>"]]}, {"id": 29, "slug": "etcd-backup-restore", "dir": "29-etcd-backup-restore", "title": "Sao lưu và khôi phục etcd", "level": 7, "env": "kind", "minutes": 40, "comps": ["arch:3", "arch:2"], "goal": "<p>Chụp snapshot etcd đúng cách, và khôi phục cluster về thời điểm chụp khi dữ liệu bị thay đổi sau đó.<\/p>", "concepts": "<ul>\n<li>etcd bật TLS hai chiều: <code>etcdctl<\/code> cần <code>--endpoints<\/code>, <code>--cacert<\/code>, <code>--cert<\/code>, <code>--key<\/code>. Lấy đường dẫn từ <code>/etc/kubernetes/manifests/etcd.yaml<\/code>.<\/li>\n<li><code>etcdctl snapshot save<\/code> chụp; <code>etcdutl snapshot status<\/code> kiểm tra; <code>etcdutl snapshot restore --data-dir &lt;thư mục mới&gt;<\/code> khôi phục ra thư mục <strong>mới<\/strong>.<\/li>\n<li>Sau khi restore, sửa <code>hostPath<\/code> của volume <code>etcd-data<\/code> trong <code>etcd.yaml<\/code> trỏ sang thư mục mới. kubelet tự tạo lại Pod etcd; API server có thể mất 1–2 phút để trở lại.<\/li>\n<li>Restore đưa <strong>toàn bộ<\/strong> cluster về thời điểm chụp: object tạo sau đó biến mất.<\/li>\n<\/ul>", "setup_note": "<p>Setup cài <code>etcdctl<\/code> và <code>etcdutl<\/code> v3.6.16 vào node control plane nếu chưa có (tải từ GitHub), và tạo namespace <code>lab29-before<\/code>.<\/p>", "tasks": ["<p>Vào node control plane (<code>./lab ssh $CP<\/code>). Ghi giá trị <code>--data-dir<\/code> của etcd vào <code>/root/29-datadir.txt<\/code> trên node.<\/p>", "<p>Chụp snapshot etcd vào <code>/opt/etcd-backup.db<\/code> trên node control plane và kiểm tra nó bằng <code>etcdutl snapshot status<\/code>.<\/p>", "<p><strong>Sau<\/strong> khi chụp, tạo namespace <code>lab29-after<\/code> (giả lập thay đổi xảy ra sau lần sao lưu).<\/p>", "<p>Khôi phục snapshot ra <code>/var/lib/etcd-restore<\/code> và cho etcd chạy trên dữ liệu đó. Kết quả: <code>lab29-before<\/code> còn, <code>lab29-after<\/code> không còn.<\/p>"], "hints": [["Biến cho đỡ gõ", "<p><code>export ETCDCTL_API=3; E=\"--endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key\"<\/code><\/p>"], ["API server không trả lời sau khi sửa etcd.yaml?", "<p>Chờ 1–2 phút; xem <code>crictl ps -a | grep -E 'etcd|apiserver'<\/code> và <code>crictl logs &lt;id&gt;<\/code> trên node.<\/p>"]], "solution": "<pre><code class=\"language-bash\">./lab ssh $CP\ngrep data-dir /etc/kubernetes/manifests/etcd.yaml | cut -d= -f2 &gt; /root/29-datadir.txt   # /var/lib/etcd\nE=&quot;--endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key&quot;\netcdctl $E snapshot save /opt/etcd-backup.db\netcdutl snapshot status /opt/etcd-backup.db -w table\nexit\n\nkubectl create ns lab29-after\n\n./lab ssh $CP\netcdutl snapshot restore /opt/etcd-backup.db --data-dir /var/lib/etcd-restore\nvi /etc/kubernetes/manifests/etcd.yaml\n#   volumes:\n#   - hostPath: {path: /var/lib/etcd-restore, type: DirectoryOrCreate}\n#     name: etcd-data\n# (chỉ cần đổi hostPath; --data-dir trong container vẫn là /var/lib/etcd)\nwatch crictl ps      # chờ etcd và kube-apiserver chạy lại\nexit\nkubectl get ns | grep lab29        # chỉ còn lab29-before\n<\/code><\/pre>", "docs": [["Operating etcd clusters for Kubernetes", "https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/"], ["etcd disaster recovery", "https://etcd.io/docs/v3.6/op-guide/recovery/"]], "support": "solo", "prereq": [14], "guide": [["Quy trình", "<ol>\n<li><strong>Thu thập trước khi gõ lệnh.<\/strong> Mọi tham số kết nối etcd (endpoint, cacert, cert, key, data-dir) đều có trong <code>/etc/kubernetes/manifests/etcd.yaml<\/code>. Đọc file đó, đặt biến shell, đừng gõ đường dẫn từ trí nhớ.<\/li>\n<li><strong>Snapshot<\/strong> bằng <code>etcdctl snapshot save<\/code> (cần TLS), <strong>kiểm tra<\/strong> bằng <code>etcdutl snapshot status<\/code>.<\/li>\n<li><strong>Restore<\/strong> bằng <code>etcdutl snapshot restore<\/code> ra thư mục <strong>mới<\/strong>. Không ghi đè thư mục đang chạy.<\/li>\n<li><strong>Trỏ etcd sang dữ liệu mới<\/strong>: sửa static pod manifest ở <strong>mọi<\/strong> chỗ nhắc tới data dir cũ.<\/li>\n<li><strong>Chờ<\/strong>: kubelet tạo lại etcd và API server. Trong 1–2 phút kubectl sẽ báo lỗi kết nối, đó là bình thường.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>crictl ps | grep -E 'etcd|apiserver'<\/code> trên node thấy container mới.<\/li>\n<li><code>kubectl get ns<\/code> có <code>lab29-before<\/code>, không có <code>lab29-after<\/code>.<\/li>\n<\/ul>"], ["Bẫy", "<p>Một manifest có hai chỗ dùng data dir: cờ <code>--data-dir<\/code> và <code>hostPath<\/code> của volume. Sửa thiếu một chỗ là etcd không lên, hoặc lên nhưng dùng dữ liệu cũ.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph cp [&quot;control plane&quot;]\n    m[&quot;manifests/etcd.yaml&lt;br/&gt;--data-dir, hostPath&quot;] --&gt; etcd[&quot;etcd&quot;]\n    d1[(&quot;/var/lib/etcd&quot;)] --- etcd\n    snap[(&quot;/opt/etcd-backup.db&quot;)]\n    d2[(&quot;/var/lib/etcd-restore&quot;)]\n  end\n  etcd --&gt;|&quot;etcdctl snapshot save (TLS)&quot;| snap\n  snap --&gt;|&quot;etcdutl snapshot restore&quot;| d2\n  d2 -.-&gt;|&quot;sửa manifest trỏ sang&quot;| m\n  api[&quot;kube-apiserver&quot;] --&gt; etcd\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn (trên node)\n  participant E as etcd\n  participant KL as kubelet\n  participant A as kube-apiserver\n  U-&gt;&gt;E: snapshot save (endpoint, cacert, cert, key)\n  E--&gt;&gt;U: backup.db\n  U-&gt;&gt;A: tạo ns lab29-after (sau snapshot)\n  U-&gt;&gt;U: snapshot restore ra thư mục mới\n  U-&gt;&gt;KL: sửa etcd.yaml trỏ data dir mới\n  KL-&gt;&gt;E: dừng etcd cũ, chạy etcd mới với dữ liệu snapshot\n  Note over A: API server mất kết nối 1–2 phút\n  A-&gt;&gt;E: kết nối lại\n  Note over A: cluster quay về thời điểm snapshot, lab29-after biến mất\n<\/code><\/pre>"]]}, {"id": 30, "slug": "kubeadm-upgrade", "dir": "30-kubeadm-upgrade", "title": "Nâng cấp cluster kubeadm 1.36 → 1.37", "level": 7, "env": "vm", "minutes": 60, "comps": ["arch:3", "arch:2"], "goal": "<p>Nâng một cluster đang chạy lên minor mới mà không làm gián đoạn ứng dụng: control plane trước, từng worker sau, đúng thứ tự drain và uncordon.<\/p>", "concepts": "<ul>\n<li>Mỗi lần chỉ nâng <strong>một<\/strong> minor. Thứ tự: <code>kubeadm<\/code> trên control plane → <code>kubeadm upgrade plan<\/code> → <code>kubeadm upgrade apply<\/code> → drain → nâng <code>kubelet<\/code> và <code>kubectl<\/code> → restart kubelet → uncordon. Control plane thứ hai trở đi và worker dùng <code>kubeadm upgrade node<\/code>.<\/li>\n<li>Version skew: kubelet được cũ hơn API server tối đa 3 minor, không bao giờ mới hơn. kubectl lệch ±1 minor.<\/li>\n<li>Gói bị <code>apt-mark hold<\/code> để không vô tình nâng; phải <code>unhold<\/code> trước khi cài phiên bản mới. Repo <code>pkgs.k8s.io<\/code> chia theo minor: đổi <code>/v1.36/<\/code> thành <code>/v1.37/<\/code>.<\/li>\n<li><code>kubeadm upgrade apply<\/code> tự gia hạn chứng chỉ control plane.<\/li>\n<\/ul>", "setup_note": "<p>Cần cluster từ lab 01 (Kubernetes v1.36). Chạy lab từ <code>cp-1<\/code>.<\/p>", "tasks": ["<p>Ghi phiên bản đích mà <code>kubeadm upgrade plan<\/code> đề xuất (sau khi nâng kubeadm) vào <code>~/cka-answers/30-target.txt<\/code>.<\/p>", "<p>Nâng control plane <code>cp-1<\/code> lên v1.37 (kubeadm, control plane, kubelet, kubectl).<\/p>", "<p>Nâng lần lượt <code>worker-1<\/code> rồi <code>worker-2<\/code>, mỗi node phải được drain trước và uncordon sau.<\/p>", "<p>Mọi node <code>Ready<\/code>, kubelet v1.37.x, không node nào còn <code>SchedulingDisabled<\/code>.<\/p>"], "hints": [["Xem phiên bản có trong repo", "<p><code>apt-cache madison kubeadm | head<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\"># cp-1\nsudo sed -i 's#/v1.36/#/v1.37/#' /etc/apt/sources.list.d/kubernetes.list\nsudo apt-get update &amp;&amp; apt-cache madison kubeadm | head -3\nsudo apt-mark unhold kubeadm &amp;&amp; sudo apt-get install -y kubeadm='1.37.*' &amp;&amp; sudo apt-mark hold kubeadm\nsudo kubeadm upgrade plan\nsudo kubeadm upgrade plan | grep -o 'kubeadm upgrade apply v[0-9.]*' | head -1 | awk '{print $4}' &gt; ~/cka-answers/30-target.txt\nsudo kubeadm upgrade apply $(cat ~/cka-answers/30-target.txt)\nkubectl drain cp-1 --ignore-daemonsets\nsudo apt-mark unhold kubelet kubectl &amp;&amp; sudo apt-get install -y kubelet='1.37.*' kubectl='1.37.*' &amp;&amp; sudo apt-mark hold kubelet kubectl\nsudo systemctl daemon-reload &amp;&amp; sudo systemctl restart kubelet\nkubectl uncordon cp-1\n\n# từng worker (ví dụ worker-1)\nkubectl drain worker-1 --ignore-daemonsets --delete-emptydir-data\nssh worker-1\n  sudo sed -i 's#/v1.36/#/v1.37/#' /etc/apt/sources.list.d/kubernetes.list &amp;&amp; sudo apt-get update\n  sudo apt-mark unhold kubeadm kubelet kubectl\n  sudo apt-get install -y kubeadm='1.37.*' &amp;&amp; sudo kubeadm upgrade node\n  sudo apt-get install -y kubelet='1.37.*' kubectl='1.37.*' &amp;&amp; sudo apt-mark hold kubeadm kubelet kubectl\n  sudo systemctl daemon-reload &amp;&amp; sudo systemctl restart kubelet\n  exit\nkubectl uncordon worker-1\nkubectl get nodes\n<\/code><\/pre>", "docs": [["Upgrading kubeadm clusters", "https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/"], ["Version skew policy", "https://kubernetes.io/releases/version-skew-policy/"]], "support": "solo", "prereq": [1, 14], "guide": [["Quy trình", "<p>Mở trang <em>Upgrading kubeadm clusters<\/em> và làm theo đúng thứ tự của nó. Đề thi chấm kết quả, nhưng sai thứ tự là cluster hỏng.<\/p>\n<ol>\n<li><strong>Repo gói<\/strong> trỏ sang minor mới (<code>/etc/apt/sources.list.d/kubernetes.list<\/code>), <code>apt update<\/code>, xem các phiên bản có sẵn.<\/li>\n<li><strong>Control plane<\/strong>: nâng <code>kubeadm<\/code>, chạy <code>kubeadm upgrade plan<\/code>, rồi <code>kubeadm upgrade apply<\/code>; sau đó drain, nâng <code>kubelet<\/code>/<code>kubectl<\/code>, <code>daemon-reload<\/code>, restart kubelet, uncordon.<\/li>\n<li><strong>Từng worker<\/strong>: nâng <code>kubeadm<\/code>, <code>kubeadm upgrade node<\/code>, drain (chạy từ cp-1), nâng <code>kubelet<\/code>/<code>kubectl<\/code>, restart, uncordon.<\/li>\n<\/ol>"], ["Kiểm chứng sau mỗi node", "<ul>\n<li><code>kubectl get nodes<\/code> cho thấy node vừa làm có VERSION mới và không còn <code>SchedulingDisabled<\/code>.<\/li>\n<li>Mọi Pod hệ thống <code>Running<\/code>.<\/li>\n<\/ul>"], ["Bẫy", "<p>Gói bị <code>apt-mark hold<\/code>. Phải <code>unhold<\/code> rồi <code>hold<\/code> lại (hoặc dùng <code>--allow-change-held-packages<\/code>).<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph b [&quot;trước: v1.36&quot;]\n    c1[&quot;cp-1&quot;]\n    w1[&quot;worker-1&quot;]\n    w2[&quot;worker-2&quot;]\n  end\n  subgraph a [&quot;sau: v1.37&quot;]\n    c2[&quot;cp-1&quot;]\n    w3[&quot;worker-1&quot;]\n    w4[&quot;worker-2&quot;]\n  end\n  c1 ==&gt;|&quot;1 · upgrade apply&quot;| c2\n  w1 ==&gt;|&quot;2 · drain → upgrade node → uncordon&quot;| w3\n  w2 ==&gt;|&quot;3 · từng node một&quot;| w4\n<\/code><\/pre>\n<p>Control plane luôn nâng trước. kubelet không được mới hơn kube-apiserver.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant CP as cp-1\n  participant W as worker\n  participant A as kube-apiserver\n  U-&gt;&gt;CP: đổi repo sang v1.37, nâng gói kubeadm\n  U-&gt;&gt;CP: kubeadm upgrade plan → upgrade apply v1.37.x\n  CP-&gt;&gt;CP: thay manifest static pod, cập nhật cấu hình kubelet\n  U-&gt;&gt;A: drain cp-1\n  U-&gt;&gt;CP: nâng kubelet + kubectl, restart kubelet\n  U-&gt;&gt;A: uncordon cp-1\n  loop mỗi worker\n    U-&gt;&gt;W: nâng kubeadm, kubeadm upgrade node\n    U-&gt;&gt;A: drain worker\n    U-&gt;&gt;W: nâng kubelet + kubectl, restart\n    U-&gt;&gt;A: uncordon worker\n  end\n<\/code><\/pre>"]]}, {"id": 31, "slug": "control-plane-config", "dir": "31-control-plane-config", "title": "Chứng chỉ, cấu hình control plane và kubelet", "level": 7, "env": "kind", "minutes": 35, "comps": ["arch:2", "trouble:1", "arch:6"], "goal": "<p>Biết cấu hình của từng thành phần nằm ở đâu, đọc và sửa cờ của static pod an toàn, gia hạn chứng chỉ, và đọc cấu hình kubelet.<\/p>", "concepts": "<ul>\n<li>Control plane kubeadm: manifest ở <code>/etc/kubernetes/manifests<\/code>, chứng chỉ ở <code>/etc/kubernetes/pki<\/code>, kubeconfig ở <code>/etc/kubernetes/*.conf<\/code>. Sửa manifest là kubelet tự tạo lại Pod.<\/li>\n<li><code>kubeadm certs check-expiration<\/code> xem hạn; <code>kubeadm certs renew &lt;tên&gt;|all<\/code> gia hạn, sau đó phải restart thành phần dùng cert đó (di chuyển manifest ra rồi vào lại, hoặc <code>crictl stop<\/code> container).<\/li>\n<li>kubelet: cấu hình ở <code>/var/lib/kubelet/config.yaml<\/code> (<code>cgroupDriver<\/code>, <code>clusterDNS<\/code>, <code>staticPodPath<\/code>…), cờ thêm ở <code>/var/lib/kubelet/kubeadm-flags.env<\/code>.<\/li>\n<li>Trước khi sửa manifest, luôn sao lưu ra <strong>ngoài<\/strong> thư mục manifests (kubelet đọc mọi file trong đó).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi dải IP của Service (<code>--service-cluster-ip-range<\/code>) vào <code>~/cka-answers/31-svc-range.txt<\/code>.<\/p>", "<p>Ghi <code>cgroupDriver<\/code> và <code>clusterDNS<\/code> trong cấu hình kubelet của <code>$NODE1<\/code> vào <code>~/cka-answers/31-kubelet.txt<\/code> theo dạng <code>systemd 10.96.0.10<\/code>.<\/p>", "<p>Gia hạn chứng chỉ <code>apiserver<\/code> bằng kubeadm và cho kube-apiserver dùng chứng chỉ mới.<\/p>", "<p>Bật thêm admission plugin <code>AlwaysPullImages<\/code> cho kube-apiserver, giữ nguyên các plugin đang bật.<\/p>"], "hints": [["Restart kube-apiserver", "<p><code>mv /etc/kubernetes/manifests/kube-apiserver.yaml /root/ &amp;&amp; sleep 20 &amp;&amp; mv /root/kube-apiserver.yaml /etc/kubernetes/manifests/<\/code><\/p>"], ["Chứng chỉ apiserver đang dùng", "<p><code>openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -dates<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">./lab ssh $CP\ngrep service-cluster-ip-range /etc/kubernetes/manifests/kube-apiserver.yaml   # 10.96.0.0/12\nkubeadm certs check-expiration\nkubeadm certs renew apiserver\ncp /etc/kubernetes/manifests/kube-apiserver.yaml /root/kube-apiserver.yaml.bak\nvi /etc/kubernetes/manifests/kube-apiserver.yaml\n#   - --enable-admission-plugins=NodeRestriction,AlwaysPullImages\n# sửa manifest cũng làm kubelet tạo lại Pod, nên chứng chỉ mới được nạp\nexit\necho 10.96.0.0/12 &gt; ~/cka-answers/31-svc-range.txt\n\n./lab ssh $NODE1\ngrep -E 'cgroupDriver|clusterDNS' -A1 /var/lib/kubelet/config.yaml\nexit\necho &quot;systemd 10.96.0.10&quot; &gt; ~/cka-answers/31-kubelet.txt\n<\/code><\/pre>", "docs": [["Certificate management with kubeadm", "https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/"], ["Admission controllers", "https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/"], ["Set kubelet parameters via a config file", "https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/"]], "support": "solo", "prereq": [29], "guide": [["Quy trình", "<ol>\n<li><strong>Biết cấu hình nằm ở đâu.<\/strong> Control plane nằm trong <code>/etc/kubernetes/manifests/*.yaml<\/code> (cờ dòng lệnh). Kubelet nằm trong <code>/var/lib/kubelet/config.yaml<\/code> và <code>/var/lib/kubelet/kubeadm-flags.env<\/code>. Chứng chỉ nằm trong <code>/etc/kubernetes/pki<\/code>.<\/li>\n<li><strong>Đọc trước khi sửa.<\/strong> <code>grep -- '--&lt;cờ&gt;' &lt;manifest&gt;<\/code> để biết giá trị hiện tại; với danh sách như admission plugin thì <strong>thêm vào<\/strong>, đừng thay thế.<\/li>\n<li><strong>Sao lưu ra ngoài thư mục manifests<\/strong> trước khi sửa: <code>cp kube-apiserver.yaml /root/<\/code>. Kubelet đọc <strong>mọi<\/strong> file trong thư mục manifests, kể cả bản sao lưu.<\/li>\n<li><strong>Áp dụng thay đổi.<\/strong> Sửa static pod manifest thì kubelet tự tạo lại Pod. Chứng chỉ mới không làm manifest đổi, nên phải tự buộc kube-apiserver khởi động lại.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>kubeadm certs check-expiration<\/code> thấy ngày hết hạn mới.<\/li>\n<li>So sánh chứng chỉ API server <strong>đang phục vụ<\/strong> với file trên đĩa (<code>openssl s_client<\/code> lấy chứng chỉ từ cổng 6443).<\/li>\n<li><code>kubectl -n kube-system get pod kube-apiserver-&lt;node&gt; -o yaml | grep admission<\/code> thấy plugin mới.<\/li>\n<\/ul>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph cp [&quot;control plane&quot;]\n    man[&quot;/etc/kubernetes/manifests/kube-apiserver.yaml&lt;br/&gt;--service-cluster-ip-range&lt;br/&gt;--enable-admission-plugins&quot;]\n    pki[&quot;/etc/kubernetes/pki/apiserver.crt&quot;]\n    man --&gt; api[&quot;kube-apiserver&quot;]\n    pki --&gt; api\n  end\n  subgraph n1 [&quot;NODE1&quot;]\n    kc[&quot;/var/lib/kubelet/config.yaml&lt;br/&gt;cgroupDriver · clusterDNS&quot;] --&gt; kl[&quot;kubelet&quot;]\n  end\n  ka[&quot;kubeadm certs renew apiserver&quot;] --&gt; pki\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant F as manifests/\n  participant KL as kubelet\n  participant API as kube-apiserver\n  U-&gt;&gt;F: sửa kube-apiserver.yaml (thêm plugin vào danh sách)\n  KL-&gt;&gt;F: phát hiện file đổi\n  KL-&gt;&gt;API: dừng Pod cũ, chạy Pod mới với cờ mới\n  U-&gt;&gt;U: kubeadm certs renew apiserver\n  Note over API: file cert mới, nhưng tiến trình vẫn dùng cert cũ trong bộ nhớ\n  U-&gt;&gt;KL: buộc static pod khởi động lại (di chuyển manifest ra rồi vào)\n  KL-&gt;&gt;API: chạy lại, nạp cert mới\n<\/code><\/pre>"]]}, {"id": 32, "slug": "control-plane-ha", "dir": "32-control-plane-ha", "title": "Thêm control plane cho cluster HA", "level": 7, "env": "vm", "minutes": 60, "comps": ["arch:4", "arch:2"], "goal": "<p>Biến cluster một control plane thành ba control plane với etcd xếp chồng (stacked), hiểu vai trò của endpoint chung và load balancer.<\/p>", "concepts": "<ul>\n<li>HA cần: một <strong>endpoint ổn định<\/strong> cho API (<code>--control-plane-endpoint<\/code>, thường là load balancer hoặc VIP như kube-vip), <strong>số lẻ<\/strong> control plane (3 hoặc 5) để etcd giữ quorum.<\/li>\n<li><code>kubeadm init --upload-certs<\/code> lưu cert control plane (mã hóa) vào Secret <code>kubeadm-certs<\/code>, hết hạn sau 2 giờ; tạo lại bằng <code>kubeadm init phase upload-certs --upload-certs<\/code>, lệnh này in ra <strong>certificate key<\/strong>.<\/li>\n<li>Join control plane: <code>kubeadm join &lt;endpoint&gt; --token … --discovery-token-ca-cert-hash … --control-plane --certificate-key …<\/code>.<\/li>\n<li>API server chạy song song trên cả 3 node; scheduler và controller-manager chỉ một bản làm việc (leader, giữ Lease trong <code>kube-system<\/code>).<\/li>\n<\/ul>", "setup_note": "<p>Cần cluster từ lab 01. Dựng thêm 2 máy ảo <code>cp-2<\/code> (192.168.56.13) và <code>cp-3<\/code> (192.168.56.14):<\/p>\n<pre><code class=\"language-bash\">cd env/kubeadm &amp;&amp; HA=1 vagrant up cp-2 cp-3\n<\/code><\/pre>\n<p>Lab dùng tên <code>k8s-api<\/code> trong <code>/etc/hosts<\/code> trỏ về cp-1 thay cho load balancer. Trong thực tế, đặt HAProxy hoặc kube-vip trước 3 API server.<\/p>", "tasks": ["<p>Trên <code>cp-1<\/code>, tạo lại certificate key và lệnh join.<\/p>", "<p>Join <code>cp-2<\/code> và <code>cp-3<\/code> làm control plane.<\/p>", "<p>Ghi số member etcd vào <code>~/cka-answers/32-etcd-members.txt<\/code>, và tên node đang giữ Lease <code>kube-scheduler<\/code> vào <code>~/cka-answers/32-leader.txt<\/code>.<\/p>"], "hints": [["Danh sách member etcd", "<p><code>kubectl -n kube-system exec etcd-cp-1 -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key member list -w table<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\"># cp-1\nsudo kubeadm init phase upload-certs --upload-certs        # in ra certificate key\nkubeadm token create --print-join-command\n# cp-2 và cp-3:\nsudo kubeadm join k8s-api:6443 --token &lt;t&gt; --discovery-token-ca-cert-hash sha256:&lt;h&gt; \\\n  --control-plane --certificate-key &lt;key&gt; --apiserver-advertise-address &lt;ip của node&gt;\nkubectl get nodes          # 3 control-plane\nkubectl -n kube-system exec etcd-cp-1 -- etcdctl … member list | wc -l &gt; ~/cka-answers/32-etcd-members.txt\nkubectl get lease kube-scheduler -n kube-system -o jsonpath='{.spec.holderIdentity}' | cut -d_ -f1 &gt; ~/cka-answers/32-leader.txt\n<\/code><\/pre>", "docs": [["Creating highly available clusters with kubeadm", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/"], ["Options for HA topology", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/ha-topology/"]], "support": "solo", "prereq": [30], "guide": [["Quy trình", "<ol>\n<li><strong>Điều kiện tiên quyết.<\/strong> Cluster được init với <code>--control-plane-endpoint<\/code> (lab 01), và node mới đã chuẩn bị như worker (runtime, gói kube*).<\/li>\n<li><strong>Chứng chỉ dùng chung.<\/strong> Control plane mới cần CA và khóa của cluster. <code>--upload-certs<\/code> đẩy chúng lên Secret tạm (hết hạn sau 2 giờ) và trả về certificate key.<\/li>\n<li><strong>Lệnh join<\/strong> cho control plane = lệnh join của worker + <code>--control-plane --certificate-key &lt;key&gt;<\/code> + địa chỉ quảng bá của node mới.<\/li>\n<li>Join <strong>lần lượt<\/strong> từng node, chờ node trước Ready rồi mới làm node sau. etcd thêm member từng cái một.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>kubectl get nodes<\/code> có 3 node <code>control-plane<\/code>.<\/li>\n<li><code>etcdctl member list<\/code> (chạy trong Pod etcd, với các cờ TLS) có 3 member <code>started<\/code>.<\/li>\n<li>Leader election: <code>kubectl get lease -n kube-system<\/code>. Trường <code>holderIdentity<\/code> cho biết node nào đang giữ.<\/li>\n<\/ul>"], ["Liên hệ thực tế", "<p>Ba control plane chịu được mất <strong>một<\/strong> node: etcd cần quá bán số member (2/3). Hai control plane không tốt hơn một: mất một node là etcd mất quorum.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart TB\n  ep([&quot;k8s-api:6443&quot;]) --&gt; a1 &amp; a2 &amp; a3\n  subgraph c1 [&quot;cp-1&quot;]\n    a1[&quot;apiserver&quot;] --- e1[(&quot;etcd&quot;)]\n  end\n  subgraph c2 [&quot;cp-2&quot;]\n    a2[&quot;apiserver&quot;] --- e2[(&quot;etcd&quot;)]\n  end\n  subgraph c3 [&quot;cp-3&quot;]\n    a3[&quot;apiserver&quot;] --- e3[(&quot;etcd&quot;)]\n  end\n  e1 &lt;--&gt;|&quot;Raft&quot;| e2\n  e2 &lt;--&gt;|&quot;Raft&quot;| e3\n  e1 &lt;--&gt;|&quot;Raft&quot;| e3\n  l[&quot;Lease kube-scheduler&lt;br/&gt;holderIdentity = leader&quot;] -.-&gt; c1\n<\/code><\/pre>\n<p>Ba etcd chịu được mất một node (cần 2/3 phiếu). Scheduler và controller-manager chạy trên cả 3 node nhưng chỉ leader làm việc.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant C1 as cp-1\n  participant A as kube-apiserver\n  participant C2 as cp-2\n  U-&gt;&gt;C1: kubeadm init phase upload-certs --upload-certs\n  C1-&gt;&gt;A: Secret kubeadm-certs (mã hóa, hạn 2 giờ)\n  C1--&gt;&gt;U: certificate key\n  U-&gt;&gt;C1: kubeadm token create --print-join-command\n  U-&gt;&gt;C2: kubeadm join ... --control-plane --certificate-key KEY\n  C2-&gt;&gt;A: tải CA và khóa từ Secret\n  C2-&gt;&gt;C2: sinh cert riêng, ghi static pod\n  C2-&gt;&gt;C1: etcd member add, đồng bộ dữ liệu\n  Note over C2: cp-2 Ready, lặp lại cho cp-3\n<\/code><\/pre>"]]}, {"id": 39, "slug": "node-runtime-prep", "dir": "39-node-runtime-prep", "title": "Chuẩn bị node - container runtime, kernel và CRI", "level": 7, "env": "kind", "minutes": 35, "comps": ["arch:1", "arch:6", "trouble:0"], "goal": "<p>Tự tay làm phần \"chuẩn bị hạ tầng\" mà đề thi hay hỏi: cài gói container runtime bằng <code>dpkg<\/code>, bật service bằng systemd, nạp module và sysctl cho Kubernetes, sửa <code>crictl<\/code>, và đọc ra node đang dùng CRI, CNI, CSI nào.<\/p>", "concepts": "<ul>\n<li><strong>CRI<\/strong> (Container Runtime Interface): kubelet nói chuyện với runtime (containerd, CRI-O, cri-dockerd) qua một Unix socket. Đường dẫn socket nằm ở <code>containerRuntimeEndpoint<\/code> trong <code>/var/lib/kubelet/config.yaml<\/code> hoặc cờ <code>--container-runtime-endpoint<\/code> trong <code>/var/lib/kubelet/kubeadm-flags.env<\/code>.<\/li>\n<li><strong>cri-dockerd<\/strong> là lớp CRI cho Docker Engine. Gói <code>.deb<\/code> cài bằng <code>dpkg -i<\/code>, rồi <code>systemctl enable --now cri-docker.service<\/code> (bật ngay và tự chạy khi khởi động máy).<\/li>\n<li>Kubernetes cần module <code>overlay<\/code> và <code>br_netfilter<\/code>, và sysctl <code>net.ipv4.ip_forward = 1<\/code>, <code>net.bridge.bridge-nf-call-iptables = 1<\/code> (IPv6: <code>net.ipv6.conf.all.forwarding = 1<\/code>). Ghi vào file trong <code>/etc/modules-load.d/<\/code> và <code>/etc/sysctl.d/<\/code> để còn sau khi khởi động lại, rồi <code>sysctl --system<\/code> để áp dụng ngay.<\/li>\n<li><strong>CNI<\/strong>: cấu hình ở <code>/etc/cni/net.d/<\/code>, binary ở <code>/opt/cni/bin/<\/code>. <strong>CSI<\/strong>: driver đăng ký object <code>CSIDriver<\/code>; provisioner của StorageClass cho biết ai tạo volume.<\/li>\n<li><code>crictl<\/code> đọc <code>/etc/crictl.yaml<\/code> để biết socket. Sai socket thì mọi lệnh <code>crictl<\/code> báo lỗi kết nối.<\/li>\n<\/ul>", "setup_note": "<p>Bài làm trên <code>$NODE1<\/code> (<code>./lab ssh $NODE1<\/code>). Setup đặt sẵn file <code>/root/pkgs/cri-dockerd_0.4.9-lab_&lt;arch&gt;.deb<\/code> trên node.<\/p>\n<p>Gói này là <strong>gói mô phỏng<\/strong> do setup tự đóng: nó có đúng tên, unit systemd <code>cri-docker.service<\/code> và <code>cri-docker.socket<\/code> như gói thật, nhưng chỉ giữ một tiến trình chạy, vì node kind không có Docker Engine. Thao tác <code>dpkg<\/code> và <code>systemctl<\/code> giống hệt khi cài gói thật trong phòng thi.<\/p>", "tasks": ["<p>Trên <code>$NODE1<\/code>, cài gói <code>cri-dockerd<\/code> từ file <code>.deb<\/code> trong <code>/root/pkgs/<\/code>. Bật <code>cri-docker.service<\/code> ngay bây giờ và tự chạy khi khởi động máy.<\/p>", "<p>Đảm bảo module <code>overlay<\/code> và <code>br_netfilter<\/code> được nạp mỗi lần khởi động, bằng file <code>/etc/modules-load.d/k8s.conf<\/code>.<\/p>", "<p>Tạo <code>/etc/sysctl.d/k8s.conf<\/code> đặt <code>net.bridge.bridge-nf-call-iptables = 1<\/code>, <code>net.ipv6.conf.all.forwarding = 1<\/code>, <code>net.ipv4.ip_forward = 1<\/code>, và áp dụng ngay không cần khởi động lại.<\/p>", "<p><code>crictl ps<\/code> trên <code>$NODE1<\/code> đang báo lỗi. Sửa cấu hình của <code>crictl<\/code> để nó dùng containerd.<\/p>", "<p>Trên máy của bạn, ghi vào <code>~/cka-answers/<\/code>: socket CRI mà kubelet của <code>$NODE1<\/code> đang dùng (dạng <code>unix:///…<\/code>) vào <code>39-endpoint.txt<\/code>; tên file cấu hình CNI trong <code>/etc/cni/net.d/<\/code> của <code>$NODE1<\/code> vào <code>39-cni.txt<\/code>; provisioner của StorageClass mặc định vào <code>39-provisioner.txt<\/code>.<\/p>"], "hints": [["Cài và bật service", "<p><code>dpkg -i &lt;file&gt;.deb<\/code>, rồi <code>systemctl daemon-reload<\/code> và <code>systemctl enable --now cri-docker.service<\/code>. Kiểm tra: <code>systemctl is-enabled<\/code> và <code>systemctl is-active<\/code>.<\/p>"], ["crictl dùng socket nào?", "<p><code>cat /etc/crictl.yaml<\/code>. Socket của containerd thường là <code>unix:///run/containerd/containerd.sock<\/code>; xem nó có tồn tại không bằng <code>ls -l /run/containerd/<\/code>.<\/p>"], ["Tìm socket CRI của kubelet", "<p><code>grep -i endpoint /var/lib/kubelet/config.yaml /var/lib/kubelet/kubeadm-flags.env<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">./lab ssh $NODE1\ndpkg -i /root/pkgs/cri-dockerd_*.deb\nsystemctl daemon-reload\nsystemctl enable --now cri-docker.service\nsystemctl is-enabled cri-docker.service; systemctl is-active cri-docker.service\n\ncat &gt; /etc/modules-load.d/k8s.conf &lt;&lt;'EOF'\noverlay\nbr_netfilter\nEOF\nmodprobe overlay; modprobe br_netfilter      # trên node kind có thể báo lỗi vì dùng kernel của máy host: bỏ qua\n\ncat &gt; /etc/sysctl.d/k8s.conf &lt;&lt;'EOF'\nnet.bridge.bridge-nf-call-iptables = 1\nnet.ipv6.conf.all.forwarding = 1\nnet.ipv4.ip_forward = 1\nEOF\nsysctl --system\n\ncat /etc/crictl.yaml                        # đang trỏ tới socket không tồn tại\ncat &gt; /etc/crictl.yaml &lt;&lt;'EOF'\nruntime-endpoint: unix:///run/containerd/containerd.sock\nimage-endpoint: unix:///run/containerd/containerd.sock\nEOF\ncrictl ps\n\ngrep -i endpoint /var/lib/kubelet/config.yaml /var/lib/kubelet/kubeadm-flags.env\nls /etc/cni/net.d/\nexit\n<\/code><\/pre>\n<pre><code class=\"language-bash\">echo unix:///run/containerd/containerd.sock &gt; ~/cka-answers/39-endpoint.txt\n./lab ssh $NODE1   # ls /etc/cni/net.d  → ví dụ 10-kindnet.conflist\necho 10-kindnet.conflist &gt; ~/cka-answers/39-cni.txt\nkubectl get sc       # cột PROVISIONER của dòng (default)\nkubectl get sc -o jsonpath='{.items[?(@.metadata.annotations.storageclass\\.kubernetes\\.io/is-default-class==&quot;true&quot;)].provisioner}' &gt; ~/cka-answers/39-provisioner.txt\nkubectl get csidriver   # kind không có CSI driver nào: local-path không phải CSI\n<\/code><\/pre>", "docs": [["Container Runtimes (cài đặt và sysctl)", "https://kubernetes.io/docs/setup/production-environment/container-runtimes/"], ["Debugging Kubernetes nodes with crictl", "https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/"], ["Network Plugins", "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"], ["CSI Volumes", "https://kubernetes.io/docs/concepts/storage/volumes/#csi"]], "support": "solo", "prereq": [14], "guide": [["Quy trình", "<ol>\n<li><strong>Đọc trước, làm sau.<\/strong> Trên node: <code>cat /etc/os-release<\/code>, <code>systemctl status &lt;service&gt;<\/code>, <code>ls /etc/sysctl.d /etc/modules-load.d<\/code>. Biết hiện trạng rồi mới sửa.<\/li>\n<li><strong>Cài gói:<\/strong> <code>dpkg -i &lt;file&gt;.deb<\/code>. Gói có unit systemd thì luôn <code>systemctl daemon-reload<\/code>, rồi <code>enable --now<\/code>. Một lệnh vừa bật khi khởi động vừa chạy ngay.<\/li>\n<li><strong>Kernel:<\/strong> ghi file trong <code>/etc/modules-load.d/<\/code> và <code>/etc/sysctl.d/<\/code> (còn sau khi khởi động lại), rồi áp dụng ngay bằng <code>modprobe<\/code> và <code>sysctl --system<\/code>.<\/li>\n<li><strong>CRI:<\/strong> socket mà kubelet dùng nằm trong cấu hình kubelet. <code>crictl<\/code> có cấu hình riêng ở <code>/etc/crictl.yaml<\/code>; hai chỗ này phải trỏ cùng một runtime.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>dpkg -l | grep &lt;gói&gt;<\/code> thấy trạng thái <code>ii<\/code>.<\/li>\n<li><code>systemctl is-enabled<\/code> và <code>systemctl is-active<\/code> trả về <code>enabled<\/code> và <code>active<\/code>.<\/li>\n<li><code>sysctl &lt;key&gt;<\/code> từng khóa trả về <code>1<\/code>.<\/li>\n<li><code>crictl ps<\/code> liệt kê container, không báo lỗi kết nối.<\/li>\n<\/ul>"], ["Bẫy", "<ul>\n<li>Quên <code>--now<\/code> thì service được bật cho lần khởi động sau nhưng chưa chạy. Quên <code>enable<\/code> thì chạy bây giờ nhưng mất sau khi khởi động lại. Đề thường chấm cả hai.<\/li>\n<li>Ghi sysctl vào <code>/etc/sysctl.conf<\/code> vẫn được, nhưng file riêng trong <code>/etc/sysctl.d/<\/code> dễ kiểm tra và đúng với tài liệu Kubernetes.<\/li>\n<\/ul>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph n1 [&quot;NODE1&quot;]\n    kl[&quot;kubelet&quot;] --&gt;|&quot;containerRuntimeEndpoint&quot;| cs[(&quot;/run/containerd/containerd.sock&quot;)]\n    cs --&gt; ctd[&quot;containerd&quot;]\n    cri[&quot;crictl&quot;] --&gt;|&quot;/etc/crictl.yaml&quot;| cs\n    deb[&quot;/root/pkgs/cri-dockerd_*.deb&quot;] --&gt;|&quot;dpkg -i&quot;| svc[&quot;cri-docker.service&lt;br/&gt;+ cri-docker.socket&quot;]\n    sd[&quot;systemd&quot;] --&gt;|&quot;enable --now&quot;| svc\n    mod[&quot;/etc/modules-load.d/k8s.conf&quot;] --&gt; kern[&quot;kernel: overlay, br_netfilter&quot;]\n    sys[&quot;/etc/sysctl.d/k8s.conf&quot;] --&gt; kern\n    cni[&quot;/etc/cni/net.d/*.conflist&quot;] --&gt; kl\n  end\n  sc[&quot;StorageClass mặc định&lt;br/&gt;provisioner&quot;] -.-&gt; csi[&quot;CSIDriver? (kubectl get csidriver)&quot;]\n<\/code><\/pre>\n<p>CRI, CNI, CSI là ba giao diện mở rộng của kubelet: runtime container, mạng Pod, lưu trữ.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant KL as kubelet\n  participant RT as runtime (CRI)\n  participant CNI as plugin CNI\n  participant CSI as driver CSI\n  KL-&gt;&gt;RT: RunPodSandbox (qua Unix socket)\n  RT-&gt;&gt;CNI: ADD: tạo network namespace, cấp IP Pod\n  CNI--&gt;&gt;RT: IP Pod\n  opt Pod có PVC dùng CSI\n    KL-&gt;&gt;CSI: NodePublishVolume: gắn volume vào thư mục của Pod\n  end\n  KL-&gt;&gt;RT: PullImage, CreateContainer, StartContainer\n  RT--&gt;&gt;KL: trạng thái container\n  Note over KL,RT: crictl nói chuyện trực tiếp với runtime, không qua API server\n<\/code><\/pre>"]]}, {"id": 40, "slug": "cni-tigera-operator", "dir": "40-cni-tigera-operator", "title": "Cài CNI Calico bằng Tigera Operator", "level": 7, "env": "any", "minutes": 40, "comps": ["arch:6", "arch:1", "net:0", "net:1"], "goal": "<p>Cài một CNI cho cluster mới hoàn toàn chưa có mạng Pod, theo đúng cách đề thi gần đây hỏi: cài Tigera Operator rồi khai báo resource <code>Installation<\/code> khớp Pod CIDR của cluster. Làm quen việc làm trên một cluster khác bằng <code>--context<\/code>.<\/p>", "concepts": "<ul>\n<li>Cluster vừa <code>kubeadm init<\/code> không có CNI: node <code>NotReady<\/code>, CoreDNS <code>Pending<\/code>. Kubelet báo <code>container runtime network not ready: cni plugin not initialized<\/code>.<\/li>\n<li><strong>Tigera Operator<\/strong> là cách cài Calico được khuyên dùng: (1) <code>kubectl create -f operator-crds.yaml<\/code>, (2) <code>kubectl create -f tigera-operator.yaml<\/code>, (3) tạo resource <code>Installation<\/code> (và <code>APIServer<\/code>) mô tả cấu hình. Operator đọc <code>Installation<\/code> rồi tự tạo DaemonSet <code>calico-node<\/code> trong namespace <code>calico-system<\/code>.<\/li>\n<li><code>Installation.spec.calicoNetwork.ipPools[].cidr<\/code> phải nằm trong Pod CIDR của cluster (<code>networking.podSubnet<\/code> trong ConfigMap <code>kubeadm-config<\/code> của <code>kube-system<\/code>).<\/li>\n<li>Dùng <code>kubectl create<\/code> cho manifest CRD lớn của Calico: <code>kubectl apply<\/code> lưu cả object vào annotation và có thể vượt giới hạn kích thước.<\/li>\n<li>Kiểm tra: <code>kubectl get tigerastatus<\/code> (cột AVAILABLE), node <code>Ready<\/code>, Pod ở hai node gọi được nhau.<\/li>\n<\/ul>", "setup_note": "<p>Setup dùng kind tạo thêm cluster <code>cka-cni<\/code> (1 control plane, 1 worker) <strong>không có CNI<\/strong>, Pod CIDR khác mặc định. Cluster <code>cka<\/code> của bạn không bị đụng tới, context hiện tại cũng được giữ nguyên. Cần <code>kind<\/code>, Docker, và internet để tải Calico.<\/p>\n<p>Làm bài trên context <code>kind-cka-cni<\/code>: hoặc <code>kubectl config use-context kind-cka-cni<\/code> (giống dòng đầu mỗi câu trong phòng thi, nhớ đổi lại sau), hoặc thêm <code>--context kind-cka-cni<\/code> vào mọi lệnh.<\/p>", "tasks": ["<p>Trên context <code>kind-cka-cni<\/code>, xác nhận node đang <code>NotReady<\/code> vì thiếu CNI. Tìm Pod CIDR của cluster và ghi vào <code>~/cka-answers/40-pod-cidr.txt<\/code>.<\/p>", "<p>Cài Tigera Operator của Calico <strong>v3.33.0<\/strong> từ manifest chính thức (<code>operator-crds.yaml<\/code> và <code>tigera-operator.yaml<\/code>).<\/p>", "<p>Tạo resource <code>Installation<\/code> tên <code>default<\/code> để operator cài Calico với một IP pool đúng bằng Pod CIDR của cluster, encapsulation <code>VXLANCrossSubnet<\/code>.<\/p>", "<p>Chờ cả hai node <code>Ready<\/code> và <code>tigerastatus<\/code> báo <code>calico<\/code> sẵn sàng.<\/p>", "<p>Kiểm tra mạng: Pod chạy trên node control plane gọi được HTTP tới Pod chạy trên worker. (Bài tự kiểm tra bằng Pod tạm.)<\/p>"], "hints": [["Pod CIDR ở đâu?", "<p><code>kubectl --context kind-cka-cni -n kube-system get cm kubeadm-config -o yaml | grep podSubnet<\/code><\/p>"], ["Khung Installation", "<p>Lấy <code>custom-resources.yaml<\/code> cùng phiên bản, sửa <code>cidr<\/code>, giữ lại khối <code>Installation<\/code> (và <code>APIServer<\/code> nếu muốn).<\/p>"], ["Operator chưa làm gì?", "<p><code>kubectl --context kind-cka-cni -n tigera-operator logs deploy/tigera-operator<\/code> và <code>kubectl --context kind-cka-cni get tigerastatus<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">K=&quot;kubectl --context kind-cka-cni&quot;\n$K get nodes                                           # NotReady\n$K -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' | grep podSubnet\nCIDR=$($K -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}' | awk '/podSubnet:/{print $2}')\necho &quot;$CIDR&quot; &gt; ~/cka-answers/40-pod-cidr.txt\n\n$K create -f https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/operator-crds.yaml\n$K create -f https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/tigera-operator.yaml\n$K wait --for=condition=Established crd/installations.operator.tigera.io --timeout=60s\n\ncat &lt;&lt;EOF | $K create -f -\napiVersion: operator.tigera.io/v1\nkind: Installation\nmetadata: {name: default}\nspec:\n  calicoNetwork:\n    ipPools:\n    - name: default-ipv4-ippool\n      blockSize: 26\n      cidr: $CIDR\n      encapsulation: VXLANCrossSubnet\n      natOutgoing: Enabled\n      nodeSelector: all()\nEOF\n$K get tigerastatus -w            # chờ calico AVAILABLE True\n$K wait --for=condition=Ready node --all --timeout=300s\n<\/code><\/pre>", "docs": [["Calico · Quickstart với operator", "https://docs.tigera.io/calico/latest/getting-started/kubernetes/quickstart"], ["Network Plugins", "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"], ["kind · disableDefaultCNI", "https://kind.sigs.k8s.io/docs/user/configuration/#disable-default-cni"]], "support": "solo", "prereq": [1, 17], "guide": [["Quy trình", "<ol>\n<li><strong>Đúng cluster trước đã.<\/strong> Chạy <code>kubectl config use-context kind-cka-cni<\/code> (như dòng đầu mỗi câu trong phòng thi), rồi <code>kubectl config current-context<\/code> để chắc chắn.<\/li>\n<li><strong>Chẩn đoán:<\/strong> <code>kubectl get nodes<\/code> (NotReady), <code>kubectl describe node<\/code> (dòng <code>NetworkPluginNotReady<\/code>), Pod CoreDNS <code>Pending<\/code>.<\/li>\n<li><strong>Tìm Pod CIDR<\/strong> trong ConfigMap <code>kubeadm-config<\/code>. Đây là con số quan trọng nhất của cả bài.<\/li>\n<li><strong>Cài operator<\/strong> theo đúng thứ tự trong tài liệu Calico: CRD → operator → <code>Installation<\/code>. Dùng <code>kubectl create<\/code>, không dùng <code>apply<\/code>.<\/li>\n<li><strong>Sửa <code>Installation<\/code><\/strong> trước khi tạo: <code>cidr<\/code> khớp Pod CIDR.<\/li>\n<li><strong>Chờ và quan sát:<\/strong> <code>kubectl get tigerastatus<\/code>, <code>kubectl get pods -n calico-system -w<\/code>.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>kubectl get nodes<\/code> cho thấy mọi node <code>Ready<\/code>.<\/li>\n<li><code>kubectl get tigerastatus<\/code> cho thấy <code>calico<\/code> <code>AVAILABLE True<\/code>.<\/li>\n<li>Hai Pod trên hai node gọi được nhau bằng IP Pod.<\/li>\n<\/ul>"], ["Bẫy", "<ul>\n<li>Để nguyên <code>cidr: 192.168.0.0/16<\/code> của file mẫu: Calico cấp IP ngoài dải của cluster, kube-proxy và NetworkPolicy chạy sai.<\/li>\n<li>Làm xong nhớ đổi context về <code>kind-cka<\/code>, nếu không các lab sau sẽ chạy nhầm cluster.<\/li>\n<\/ul>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph cl [&quot;cluster cka-cni (context kind-cka-cni)&quot;]\n    cm[&quot;ConfigMap kubeadm-config&lt;br/&gt;podSubnet 10.250.0.0/16&quot;]\n    crd[&quot;CRD operator.tigera.io&quot;] --&gt; op[&quot;Deployment tigera-operator&quot;]\n    inst[&quot;Installation default&lt;br/&gt;ipPools.cidr = podSubnet&quot;] --&gt; op\n    op --&gt;|&quot;tạo&quot;| cn[&quot;DaemonSet calico-node&lt;br/&gt;(calico-system)&quot;]\n    cn --&gt; n1[&quot;control-plane: Ready&quot;]\n    cn --&gt; n2[&quot;worker: Ready&quot;]\n  end\n  cm -.-&gt;|&quot;bạn đọc và chép vào&quot;| inst\n  you([&quot;kubectl --context kind-cka-cni&quot;]) --&gt; cl\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant A as kube-apiserver\n  participant OP as tigera-operator\n  participant N as node (kubelet)\n  U-&gt;&gt;A: create operator-crds.yaml, tigera-operator.yaml\n  OP-&gt;&gt;A: watch Installation\n  U-&gt;&gt;A: create Installation (cidr = podSubnet)\n  OP-&gt;&gt;A: tạo calico-node, typha, kube-controllers\n  N-&gt;&gt;N: calico-node ghi /etc/cni/net.d và cài binary CNI\n  N-&gt;&gt;A: NetworkReady=true → node Ready\n  OP-&gt;&gt;A: tigerastatus calico Available\n  Note over A: CoreDNS hết Pending, Pod mới có IP trong 10.250.0.0/16\n<\/code><\/pre>"]]}, {"id": 41, "slug": "helm-repo-oci", "dir": "41-helm-repo-oci", "title": "Helm với repo và OCI - Argo CD, sửa release lỗi", "level": 7, "env": "any", "minutes": 35, "comps": ["arch:5", "arch:7"], "goal": "<p>Làm các dạng câu Helm mà người thi gần đây kể lại: thêm repo, render chart của Argo CD ra file mà <strong>không<\/strong> kèm CRD, cài chart từ OCI registry đúng phiên bản và giá trị, và cứu một release đang <code>failed<\/code>.<\/p>", "concepts": "<ul>\n<li>Chart lấy từ <strong>repo HTTP<\/strong>: <code>helm repo add &lt;tên&gt; &lt;url&gt;<\/code>, <code>helm repo update<\/code>, <code>helm search repo &lt;tên&gt;/&lt;chart&gt; --versions<\/code>. Từ <strong>OCI registry<\/strong>: dùng thẳng <code>oci://…<\/code> trong <code>helm install/template/show<\/code>, không cần <code>repo add<\/code>.<\/li>\n<li><code>helm template<\/code> render ra YAML mà không cài; thêm <code>-n &lt;ns&gt;<\/code> để namespace trong YAML đúng. <code>--version<\/code> ghim phiên bản chart.<\/li>\n<li>Chart có thể cài CRD theo hai cách: thư mục <code>crds/<\/code> (bỏ bằng <code>--skip-crds<\/code>) hoặc template có điều kiện (bỏ bằng giá trị riêng của chart, như <code>crds.install=false<\/code> của Argo CD). Đọc <code>helm show values<\/code> để biết.<\/li>\n<li>Release <code>failed<\/code> vẫn còn trong <code>helm list -a<\/code>. Sửa bằng <code>helm upgrade<\/code> với giá trị đúng; <code>--reuse-values<\/code> giữ các giá trị cũ, chỉ đè cái bạn đặt.<\/li>\n<li>Mỗi revision lưu trong Secret <code>sh.helm.release.v1.&lt;release&gt;.v&lt;N&gt;<\/code> của namespace.<\/li>\n<\/ul>", "setup_note": "<p>Cần <code>helm<\/code> v3 hoặc v4 và internet. Setup tạo namespace <code>lab41<\/code> và cài release <code>shop<\/code> (chart <code>podinfo<\/code>) với một giá trị sai để nó ở trạng thái <code>failed<\/code>.<\/p>", "tasks": ["<p>Thêm repo Helm tên <code>argo<\/code> với URL <code>https://argoproj.github.io/argo-helm<\/code>. Render chart <code>argo/argo-cd<\/code> phiên bản <strong>10.11.1<\/strong>, release <code>argocd<\/code>, namespace <code>argocd<\/code>, <strong>không kèm CRD<\/strong>, ra file <code>~/cka-answers/41-argocd.yaml<\/code>. Không cài vào cluster.<\/p>", "<p>Cài release <code>podinfo<\/code> vào <code>lab41<\/code> từ OCI registry <code>oci://ghcr.io/stefanprodan/charts/podinfo<\/code> phiên bản <strong>6.15.0<\/strong>, với 2 replica và <code>ui.message<\/code> là <code>CKA<\/code>. Release phải ở trạng thái <code>deployed<\/code> và cả 2 Pod sẵn sàng.<\/p>", "<p>Release <code>shop<\/code> trong <code>lab41<\/code> đang <code>failed<\/code>. Tìm nguyên nhân và sửa để nó <code>deployed<\/code>, Service kiểu <code>ClusterIP<\/code>, <strong>giữ<\/strong> số replica đã đặt khi cài.<\/p>"], "hints": [["Tìm cách bỏ CRD", "<p><code>helm show values argo/argo-cd --version 10.11.1 | grep -n -A3 '^crds'<\/code><\/p>"], ["Kiểm tra file render", "<p><code>grep -c 'kind: CustomResourceDefinition' ~/cka-answers/41-argocd.yaml<\/code> phải là 0; <code>grep 'helm.sh/chart' … | sort -u<\/code> cho thấy phiên bản chart.<\/p>"], ["Vì sao shop failed?", "<p><code>helm list -n lab41 -a<\/code>, <code>helm history shop -n lab41<\/code>, <code>helm get values shop -n lab41<\/code>. Lỗi nằm ở giá trị nào?<\/p>"]], "solution": "<pre><code class=\"language-bash\">helm repo add argo https://argoproj.github.io/argo-helm\nhelm repo update\nhelm show values argo/argo-cd --version 10.11.1 | grep -A3 '^crds'\nhelm template argocd argo/argo-cd --version 10.11.1 -n argocd \\\n  --set crds.install=false &gt; ~/cka-answers/41-argocd.yaml\ngrep -c 'kind: CustomResourceDefinition' ~/cka-answers/41-argocd.yaml     # 0\n\nhelm install podinfo oci://ghcr.io/stefanprodan/charts/podinfo --version 6.15.0 \\\n  -n lab41 --set replicaCount=2 --set ui.message=CKA --wait\n\nhelm list -n lab41 -a                 # shop: failed\nhelm history shop -n lab41            # revision 2 failed\nhelm get values shop -n lab41         # service.type: Bogus\nhelm upgrade shop podinfo --repo https://stefanprodan.github.io/podinfo --version 6.15.0 \\\n  -n lab41 --reuse-values --set service.type=ClusterIP --wait\n<\/code><\/pre>", "docs": [["Helm · Using Helm", "https://helm.sh/docs/intro/using_helm/"], ["Helm · Registries (OCI)", "https://helm.sh/docs/topics/registries/"], ["helm template", "https://helm.sh/docs/helm/helm_template/"], ["Argo CD Helm chart", "https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd"]], "support": "solo", "prereq": [26], "guide": [["Quy trình", "<ol>\n<li><strong>Tìm chart:<\/strong> <code>helm repo add<\/code>, <code>helm repo update<\/code>, <code>helm search repo &lt;repo&gt;/&lt;chart&gt; --versions | head<\/code>. Với OCI thì không cần repo: <code>helm show chart oci://…<\/code>.<\/li>\n<li><strong>Đọc values trước khi đặt:<\/strong> <code>helm show values &lt;chart&gt; --version &lt;v&gt; | less<\/code>, tìm đúng tên khóa (<code>replicaCount<\/code>, <code>crds.install<\/code>, <code>ui.message<\/code>…).<\/li>\n<li><strong>Render để kiểm tra:<\/strong> <code>helm template … &gt; file<\/code>, rồi <code>grep<\/code> xem có đúng thứ mình muốn (và không có thứ mình cấm).<\/li>\n<li><strong>Sửa release lỗi:<\/strong> <code>helm list -a<\/code> → <code>helm history<\/code> → <code>helm get values<\/code> → <code>helm upgrade --reuse-values --set &lt;giá trị đúng&gt;<\/code>.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>helm list -n lab41 -a<\/code>: mọi release <code>deployed<\/code>, cột CHART đúng phiên bản.<\/li>\n<li><code>kubectl get deploy,svc -n lab41<\/code> khớp các giá trị đã đặt.<\/li>\n<li>File render không có <code>kind: CustomResourceDefinition<\/code>.<\/li>\n<\/ul>"], ["Bẫy", "<ul>\n<li><code>helm template<\/code> không có <code>-n<\/code> thì namespace trong YAML là <code>default<\/code>.<\/li>\n<li><code>--reuse-values<\/code> giữ cả giá trị <strong>sai<\/strong> cũ. Luôn đặt lại giá trị cần sửa bằng <code>--set<\/code>.<\/li>\n<li>Thiếu <code>--version<\/code> thì Helm lấy bản mới nhất, không phải bản đề yêu cầu.<\/li>\n<\/ul>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  repo[&quot;repo HTTP argo&lt;br/&gt;argoproj.github.io/argo-helm&quot;] --&gt;|&quot;helm template&lt;br/&gt;--set crds.install=false&quot;| file[&quot;41-argocd.yaml&lt;br/&gt;(không cài)&quot;]\n  oci[&quot;oci://ghcr.io/stefanprodan/charts/podinfo&quot;] --&gt;|&quot;helm install --version 6.15.0&quot;| rel1[&quot;release podinfo · deployed&quot;]\n  rel2[&quot;release shop&lt;br/&gt;rev 1 deployed → rev 2 failed&quot;] --&gt;|&quot;helm upgrade --reuse-values&lt;br/&gt;--set service.type=ClusterIP&quot;| rel3[&quot;rev 3 deployed&quot;]\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class rel2 bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant H as helm\n  participant R as repo / OCI registry\n  participant A as kube-apiserver\n  U-&gt;&gt;H: helm repo add + update\n  H-&gt;&gt;R: tải index.yaml\n  U-&gt;&gt;H: helm template ... --version 10.11.1\n  H-&gt;&gt;R: tải chart .tgz đúng phiên bản\n  H--&gt;&gt;U: YAML (template crds bị tắt bởi giá trị)\n  U-&gt;&gt;H: helm install oci://... --version 6.15.0\n  H-&gt;&gt;R: pull chart qua giao thức OCI\n  H-&gt;&gt;A: tạo object, lưu Secret release v1\n  U-&gt;&gt;H: helm upgrade shop --reuse-values --set ...\n  H-&gt;&gt;H: gộp values của revision trước với --set\n  H-&gt;&gt;A: áp manifest mới, lưu revision mới\n<\/code><\/pre>"]]}, {"id": 42, "slug": "operator-cert-manager", "dir": "42-operator-cert-manager", "title": "Cài và dùng một Operator thật - cert-manager", "level": 7, "env": "any", "minutes": 30, "comps": ["arch:7", "arch:5"], "goal": "<p>Cài một operator thật từ manifest chính thức, tìm và đọc tài liệu CRD của nó bằng <code>kubectl<\/code>, rồi dùng chính các CRD đó để operator làm việc cho bạn (cấp chứng chỉ TLS).<\/p>", "concepts": "<ul>\n<li>Operator gồm <strong>CRD<\/strong> (kiểu object mới) + <strong>controller<\/strong> (Deployment theo dõi các object đó). cert-manager có 3 Deployment: <code>cert-manager<\/code>, <code>cert-manager-cainjector<\/code>, <code>cert-manager-webhook<\/code>.<\/li>\n<li>Liệt kê CRD của một operator: <code>kubectl get crd | grep &lt;group&gt;<\/code> hoặc <code>kubectl api-resources --api-group=&lt;group&gt;<\/code>.<\/li>\n<li><code>kubectl explain &lt;kind&gt;.spec.&lt;field&gt;<\/code> đọc tài liệu từ schema của CRD, không cần internet. Đề thi có thể bắt ghi kết quả này ra file.<\/li>\n<li>Webhook của operator chỉ nhận request khi Pod webhook đã sẵn sàng. Tạo object quá sớm sẽ gặp lỗi <code>failed calling webhook<\/code>: chờ <code>kubectl wait --for=condition=Available<\/code> rồi thử lại.<\/li>\n<li>Luồng của cert-manager: <code>Issuer<\/code>/<code>ClusterIssuer<\/code> (ai ký) → <code>Certificate<\/code> (muốn chứng chỉ gì) → controller tạo <code>CertificateRequest<\/code>, ký, ghi kết quả vào <strong>Secret<\/strong> kiểu <code>kubernetes.io/tls<\/code>.<\/li>\n<\/ul>", "setup_note": "<p>Cần internet. Setup gỡ cert-manager nếu đã có (để bạn tự cài) và tạo namespace <code>lab42<\/code>.<\/p>", "tasks": ["<p>Cài cert-manager <strong>v1.21.3<\/strong> từ manifest chính thức của bản phát hành. Chờ cả 3 Deployment trong namespace <code>cert-manager<\/code> sẵn sàng.<\/p>", "<p>Ghi tên mọi CRD của cert-manager (group kết thúc bằng <code>cert-manager.io<\/code>) vào <code>
