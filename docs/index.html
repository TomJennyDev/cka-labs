 nslookup legacy.corp.internal\n<\/code><\/pre>", "docs": [["DNS for Services and Pods", "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"], ["Customizing DNS Service", "https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/"], ["Debugging DNS resolution", "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"]], "support": "scaffold", "prereq": [15], "guide": [["Câu 1 · DNS Service và cluster domain", "<p><strong>Khung:<\/strong> Service DNS nằm trong <code>kube-system<\/code>, tên lịch sử là <code>kube-dns<\/code>. Cluster domain nằm ở hai chỗ: Corefile (<code>kubernetes &lt;domain&gt; …<\/code>) và cấu hình kubelet (<code>clusterDomain<\/code>). Có thể xem nhanh trong <code>/etc/resolv.conf<\/code> của một Pod bất kỳ.<\/p>"], ["Câu 2 · Pod không phân giải được tên Service", "<p><strong>Tra:<\/strong> trang <em>DNS for Services and Pods<\/em>, mục <em>Pod's DNS Policy<\/em>. Đọc kỹ ý nghĩa của <code>Default<\/code>: nó <strong>không<\/strong> phải giá trị mặc định.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl exec client -n lab16 -- cat /etc/resolv.conf<\/code>, so với Pod khác. Trường này không sửa được trên Pod đang chạy: xuất YAML, sửa, <code>kubectl replace --force -f<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec client -n lab16 -- nslookup web.lab16<\/code>.<\/p>"], ["Câu 3 · dnsPolicy None + dnsConfig", "<p><strong>Tra:<\/strong> cùng trang, mục <em>Pod's DNS Config<\/em>, có YAML mẫu.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec custom-dns -n lab16 -- cat /etc/resolv.conf<\/code> có đúng 3 dòng <code>nameserver<\/code>, <code>search<\/code>, <code>options<\/code>.<\/p>"], ["Câu 4 · Thêm zone vào CoreDNS", "<p><strong>Tra:<\/strong> trang <em>Customizing DNS Service<\/em>, có ví dụ server block cho một domain riêng. Plugin <code>hosts<\/code> của CoreDNS khai báo tên → IP tĩnh.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl -n kube-system edit cm coredns<\/code>, thêm một server block <code>corp.internal:53 { … }<\/code> <strong>ở ngoài<\/strong> block <code>.:53<\/code>, rồi <code>rollout restart<\/code> CoreDNS.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl -n kube-system logs deploy/coredns<\/code> không có lỗi; <code>nslookup legacy.corp.internal<\/code> từ một Pod mới.<\/p>\n<p><strong>Bẫy:<\/strong> sai một dấu ngoặc là CoreDNS CrashLoop và <strong>cả cluster<\/strong> mất DNS. Luôn sao lưu ConfigMap trước khi sửa: <code>kubectl get cm coredns -n kube-system -o yaml &gt; coredns.bak.yaml<\/code>.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph lab16 [&quot;ns lab16&quot;]\n    client[&quot;Pod client&lt;br/&gt;dnsPolicy ?&quot;]\n    custom[&quot;Pod custom-dns&lt;br/&gt;dnsPolicy None&quot;]\n    web[&quot;Service web&quot;]\n  end\n  client --&gt;|&quot;ClusterFirst&quot;| kd[&quot;Service kube-dns&lt;br/&gt;10.96.0.10&quot;]\n  client -.-&gt;|&quot;Default: resolv.conf của node&quot;| up[&quot;DNS của node&quot;]\n  custom --&gt; cf[&quot;1.1.1.1&quot;]\n  kd --&gt; core[&quot;CoreDNS&quot;]\n  core --&gt;|&quot;cluster.local&quot;| api[&quot;kube-apiserver&lt;br/&gt;Service, Pod&quot;]\n  core --&gt;|&quot;corp.internal&quot;| hosts[&quot;hosts: 10.10.10.10 legacy&quot;]\n  core --&gt;|&quot;còn lại&quot;| up\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant P as Pod (ClusterFirst)\n  participant C as CoreDNS\n  participant A as kube-apiserver\n  Note over P: resolv.conf: nameserver 10.96.0.10, ndots 5,&lt;br/&gt;search lab16.svc.cluster.local svc.cluster.local ...\n  P-&gt;&gt;C: web.lab16.lab16.svc.cluster.local? (thử search domain trước)\n  C--&gt;&gt;P: NXDOMAIN\n  P-&gt;&gt;C: web.lab16.svc.cluster.local?\n  C-&gt;&gt;A: (đã cache qua watch) Service web\n  C--&gt;&gt;P: A 10.96.x.y\n  P-&gt;&gt;C: legacy.corp.internal?\n  C-&gt;&gt;C: khớp server block corp.internal:53, plugin hosts\n  C--&gt;&gt;P: A 10.10.10.10\n<\/code><\/pre>"]]}, {"id": 17, "slug": "network-policy", "dir": "17-network-policy", "title": "NetworkPolicy theo mô hình mặc định chặn", "level": 4, "env": "any", "minutes": 40, "comps": ["net:1", "net:0"], "goal": "<p>Khóa một ứng dụng ba tầng web → api → db: chặn mặc định, chỉ mở đúng các đường cần thiết, kể cả theo namespace và chiều đi ra (egress).<\/p>", "concepts": "<ul>\n<li>Pod không bị policy nào chọn thì nhận mọi traffic. Một khi bị chọn cho chiều <code>Ingress<\/code> (hoặc <code>Egress<\/code>), chỉ traffic được liệt kê mới qua.<\/li>\n<li>Trong một phần tử <code>from<\/code>, <code>podSelector<\/code> và <code>namespaceSelector<\/code> đặt <strong>cùng một gạch đầu dòng<\/strong> là AND; tách thành <strong>hai gạch đầu dòng<\/strong> là OR.<\/li>\n<li>Namespace luôn có label <code>kubernetes.io/metadata.name=&lt;tên&gt;<\/code>, tiện để chọn một namespace cụ thể.<\/li>\n<li>Chặn egress thì phải mở UDP/TCP 53 tới CoreDNS, nếu không mọi lần gọi bằng tên đều lỗi.<\/li>\n<li>Policy chỉ có hiệu lực khi CNI hỗ trợ (kindnet, Calico, Cilium… có; Flannel thuần thì không).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab17<\/code>, tạo policy <code>default-deny<\/code> chặn <strong>mọi ingress<\/strong> tới mọi Pod.<\/p>", "<p>Tạo policy <code>web-to-api<\/code>: Pod <code>app=api<\/code> chỉ nhận traffic TCP 80 từ Pod <code>app=web<\/code> cùng namespace.<\/p>", "<p>Tạo policy <code>api-to-db<\/code>: Pod <code>app=db<\/code> chỉ nhận TCP 80 từ Pod <code>app=api<\/code>.<\/p>", "<p>Tạo policy <code>monitoring-to-api<\/code>: Pod trong các namespace có label <code>purpose=monitoring<\/code> được gọi <code>app=api<\/code> cổng 80. Namespace <code>lab17-mon<\/code> đã có label đó; namespace <code>lab17-other<\/code> thì không và phải bị chặn.<\/p>", "<p>Tạo policy <code>api-egress<\/code>: Pod <code>app=api<\/code> chỉ được gọi ra Pod <code>app=db<\/code> cổng 80 và DNS (cổng 53 UDP và TCP).<\/p>"], "hints": [["Kiểm tra bằng Pod có label giả lập", "<p><code>kubectl run t -n lab17 --rm -it --image=busybox:1.36 --labels=app=web --restart=Never -- wget -qO- -T3 api<\/code><\/p>"], ["DNS cho egress", "<p><code>to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]<\/code> với <code>ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: default-deny, namespace: lab17}\nspec:\n  podSelector: {}\n  policyTypes: [Ingress]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: web-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: web}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-to-db, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: db}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{podSelector: {matchLabels: {app: api}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: monitoring-to-api, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Ingress]\n  ingress:\n  - from: [{namespaceSelector: {matchLabels: {purpose: monitoring}}}]\n    ports: [{protocol: TCP, port: 80}]\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: {name: api-egress, namespace: lab17}\nspec:\n  podSelector: {matchLabels: {app: api}}\n  policyTypes: [Egress]\n  egress:\n  - to: [{podSelector: {matchLabels: {app: db}}}]\n    ports: [{protocol: TCP, port: 80}]\n  - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]\n    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]\n<\/code><\/pre>\n<p>Các policy cộng dồn: <code>api<\/code> nhận được từ <code>web<\/code> (policy 2) <strong>hoặc<\/strong> từ namespace monitoring (policy 4).<\/p>", "docs": [["Network Policies", "https://kubernetes.io/docs/concepts/services-networking/network-policies/"], ["Declare Network Policy", "https://kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/"]], "support": "scaffold", "prereq": [15, 16], "guide": [["Cách nghĩ về NetworkPolicy", "<ul>\n<li>Khi Pod chưa bị policy nào chọn, mọi traffic tới nó đều được phép.<\/li>\n<li>Khi một policy chọn Pod theo chiều Ingress, chỉ những gì policy cho phép mới được vào. Chiều Egress cũng vậy.<\/li>\n<li>Các policy <strong>cộng dồn<\/strong> (OR): không có rule \"deny\" riêng.<\/li>\n<\/ul>\n<p>Vẽ ra giấy: Pod nào nhận từ ai, cổng nào, rồi mới viết YAML.<\/p>"], ["Câu 1 · default-deny", "<p><strong>Tra:<\/strong> trang <em>Network Policies<\/em>, mục <em>Default policies<\/em>, có YAML chép được.<\/p>"], ["Câu 2–3 · Cho phép theo label Pod", "<p><strong>Khung:<\/strong> <code>podSelector<\/code> (Pod được bảo vệ) + <code>ingress[].from[].podSelector<\/code> (ai được gọi) + <code>ingress[].ports<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> giả lập Pod nguồn bằng label:\n<code>kubectl run t -n lab17 --rm -it --image=busybox:1.36 --labels=app=web --restart=Never -- wget -qO- -T3 api<\/code>.<\/p>"], ["Câu 4 · Cho phép theo namespace", "<p><strong>Khung:<\/strong> <code>from[].namespaceSelector.matchLabels<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> trong <code>from<\/code>, <code>namespaceSelector<\/code> và <code>podSelector<\/code> <strong>cùng một phần tử<\/strong> nghĩa là AND, còn <strong>hai phần tử<\/strong> nghĩa là OR. Một dấu <code>-<\/code> thừa làm đổi nghĩa cả policy.<\/p>"], ["Câu 5 · Egress", "<p>Khi bật Egress, Pod mất luôn DNS: gọi bằng tên sẽ hỏng dù đã cho phép tới <code>db<\/code>.<\/p>\n<p><strong>Khung:<\/strong> một rule tới <code>app=db<\/code> cổng 80, một rule tới DNS cổng 53 cả UDP và TCP. Để chọn Pod CoreDNS ở namespace khác, xem label của nó: <code>kubectl get pods -n kube-system --show-labels | grep dns<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> từ Pod label <code>app=api<\/code>, <code>wget db<\/code> được và <code>wget web<\/code> bị chặn.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph lab17 [&quot;ns lab17 · default-deny ingress&quot;]\n    web[&quot;app=web&quot;]\n    api[&quot;app=api&lt;br/&gt;egress: chỉ db + DNS&quot;]\n    db[&quot;app=db&quot;]\n  end\n  mon[&quot;ns lab17-mon&lt;br/&gt;purpose=monitoring&quot;]\n  other[&quot;ns lab17-other&quot;]\n  web --&gt;|&quot;TCP 80 ✔&quot;| api\n  mon --&gt;|&quot;TCP 80 ✔&quot;| api\n  other -.-x|&quot;✘&quot;| api\n  api --&gt;|&quot;TCP 80 ✔&quot;| db\n  web -.-x|&quot;✘&quot;| db\n  api --&gt;|&quot;UDP/TCP 53 ✔&quot;| dns[&quot;CoreDNS ở kube-system&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant S as Pod nguồn\n  participant AG as agent NetworkPolicy (trên node)\n  participant D as Pod đích\n  Note over AG: agent watch NetworkPolicy, Pod, Namespace và dịch thành luật lọc gói\n  S-&gt;&gt;AG: gói ra (egress)\n  AG-&gt;&gt;AG: Pod nguồn bị policy Egress nào chọn?\n  alt có, và không rule nào cho phép đích\n    AG--&gt;&gt;S: drop\n  end\n  AG-&gt;&gt;D: gói vào (ingress)\n  AG-&gt;&gt;AG: Pod đích bị policy Ingress nào chọn?\n  alt không policy nào chọn\n    AG-&gt;&gt;D: cho qua\n  else có: OR mọi rule của mọi policy\n    AG-&gt;&gt;D: cho qua nếu khớp from + port\n  end\n<\/code><\/pre>"]]}, {"id": 18, "slug": "ingress", "dir": "18-ingress", "title": "Ingress, IngressClass và TLS", "level": 4, "env": "any", "minutes": 30, "comps": ["net:4"], "goal": "<p>Viết Ingress định tuyến theo host và path tới nhiều Service, gắn chứng chỉ TLS, và chọn IngressClass mặc định.<\/p>", "concepts": "<ul>\n<li>Ingress chỉ là bản mô tả; cần một <strong>Ingress controller<\/strong> (Traefik, HAProxy, NGINX…) để thực thi. <code>ingressClassName<\/code> chọn controller nào xử lý.<\/li>\n<li><code>pathType<\/code>: <code>Prefix<\/code> (khớp theo từng đoạn <code>/<\/code>), <code>Exact<\/code> (khớp đúng), <code>ImplementationSpecific<\/code>.<\/li>\n<li>TLS: Secret kiểu <code>kubernetes.io/tls<\/code> có <code>tls.crt<\/code> và <code>tls.key<\/code>, khai báo trong <code>spec.tls<\/code> cùng danh sách host.<\/li>\n<li>Annotation <code>ingressclass.kubernetes.io/is-default-class: \"true\"<\/code> trên IngressClass làm nó mặc định cho Ingress không ghi class.<\/li>\n<li>Dự án ingress-nginx đã ngừng phát triển; hướng mới là Gateway API (lab 19). Đề thi vẫn hỏi cả hai.<\/li>\n<\/ul>", "setup_note": "<p>Lab chấm theo nội dung object, không cần controller. Muốn thấy traffic thật, cài một controller (ví dụ Traefik bằng Helm) và đổi <code>ingressClassName<\/code> cho khớp.<\/p>", "tasks": ["<p>Tạo chứng chỉ tự ký cho <code>shop.lab.local<\/code> và Secret TLS <code>shop-tls<\/code> trong <code>lab18<\/code>.<\/p>", "<p>Tạo Ingress <code>shop<\/code> (class <code>lab-ingress<\/code>) cho host <code>shop.lab.local<\/code>: path <code>/api<\/code> (Prefix) tới Service <code>api<\/code> cổng 8080, path <code>/<\/code> (Prefix) tới Service <code>web<\/code> cổng 80, dùng TLS <code>shop-tls<\/code>.<\/p>", "<p>Tạo Ingress <code>docs<\/code> không ghi <code>ingressClassName<\/code>, host <code>docs.lab.local<\/code>, path <code>/guide<\/code> kiểu <strong>Exact<\/strong> tới <code>web:80<\/code>.<\/p>", "<p>Đặt IngressClass <code>lab-ingress<\/code> làm mặc định của cluster.<\/p>"], "hints": [["Tạo cert và Secret", "<p><code>openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj \"/CN=shop.lab.local\"<\/code> rồi <code>kubectl create secret tls shop-tls --cert=tls.crt --key=tls.key -n lab18<\/code><\/p>"], ["Sinh Ingress bằng lệnh", "<p><code>kubectl create ingress shop -n lab18 --class=lab-ingress --rule=\"shop.lab.local/api*=api:8080,tls=shop-tls\" --rule=\"shop.lab.local/*=web:80,tls=shop-tls\"<\/code> (dấu <code>*<\/code> = Prefix)<\/p>"]], "solution": "<pre><code class=\"language-bash\">openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj &quot;/CN=shop.lab.local&quot;\nkubectl create secret tls shop-tls -n lab18 --cert=tls.crt --key=tls.key\nkubectl create ingress shop -n lab18 --class=lab-ingress \\\n  --rule=&quot;shop.lab.local/api*=api:8080,tls=shop-tls&quot; \\\n  --rule=&quot;shop.lab.local/*=web:80,tls=shop-tls&quot;\nkubectl create ingress docs -n lab18 --rule=&quot;docs.lab.local/guide=web:80&quot;\nkubectl annotate ingressclass lab-ingress ingressclass.kubernetes.io/is-default-class=true\nkubectl describe ingress shop -n lab18\n<\/code><\/pre>", "docs": [["Ingress", "https://kubernetes.io/docs/concepts/services-networking/ingress/"], ["Ingress controllers", "https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/"]], "support": "scaffold", "prereq": [15], "guide": [["Câu 1 · Chứng chỉ và Secret TLS", "<p><strong>Khung:<\/strong> <code>openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout … -out … -subj \"/CN=&lt;host&gt;\"<\/code>, rồi <code>kubectl create secret tls --help<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get secret shop-tls -n lab18<\/code> có TYPE <code>kubernetes.io/tls<\/code>.<\/p>"], ["Câu 2 · Ingress nhiều path + TLS", "<p><strong>Khung:<\/strong> <code>kubectl create ingress --help<\/code> có ví dụ cú pháp <code>--rule=\"host/path=service:port,tls=secret\"<\/code>. Path kết thúc bằng <code>*<\/code> là kiểu Prefix.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl describe ingress shop -n lab18<\/code> liệt kê 2 path, backend, và TLS. Backend <code>&lt;error: endpoints not found&gt;<\/code> nghĩa là Service hoặc cổng sai.<\/p>"], ["Câu 3 · Path kiểu Exact, không ghi class", "<p><strong>Khung:<\/strong> cùng lệnh, path không có <code>*<\/code> là Exact; bỏ cờ <code>--class<\/code>.<\/p>"], ["Câu 4 · IngressClass mặc định", "<p><strong>Tra:<\/strong> trang <em>Ingress<\/em>, mục <em>Default IngressClass<\/em>, nêu tên annotation.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get ingressclass<\/code> hiện <code>(default)<\/code>. Ingress <code>docs<\/code> không có class sẽ được controller mặc định nhận.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  u([&quot;Trình duyệt&quot;]) --&gt;|&quot;https://shop.lab.local&quot;| ic[&quot;Ingress controller&lt;br/&gt;(class lab-ingress)&quot;]\n  ic --&gt;|&quot;TLS bằng Secret shop-tls&quot;| r{&quot;path?&quot;}\n  r --&gt;|&quot;/api (Prefix)&quot;| api[&quot;Service api:8080&quot;]\n  r --&gt;|&quot;/ (Prefix)&quot;| web[&quot;Service web:80&quot;]\n  u2([&quot;docs.lab.local/guide&quot;]) --&gt;|&quot;Exact&quot;| web\n  cls[&quot;IngressClass lab-ingress&lt;br/&gt;is-default-class&quot;] -.-&gt; ic\n<\/code><\/pre>\n<p>Bài này chỉ có IngressClass, không cài controller thật, nên chấm trên các object. Với controller thật (ingress-nginx…), luồng hoạt động như sơ đồ dưới.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant K as kubectl\n  participant A as kube-apiserver\n  participant IC as Ingress controller\n  participant B as Pod backend\n  K-&gt;&gt;A: tạo Ingress (không ghi class)\n  A-&gt;&gt;A: admission điền ingressClassName mặc định\n  IC-&gt;&gt;A: watch Ingress của class mình, Service, EndpointSlice, Secret\n  IC-&gt;&gt;IC: sinh cấu hình proxy (host, path, cert)\n  Note over IC: request tới\n  IC-&gt;&gt;IC: chọn rule theo host, rồi path dài nhất\n  IC-&gt;&gt;B: chuyển thẳng tới IP Pod (từ EndpointSlice)\n<\/code><\/pre>"]]}, {"id": 19, "slug": "gateway-api", "dir": "19-gateway-api", "title": "Gateway API, HTTPRoute và ReferenceGrant", "level": 4, "env": "any", "minutes": 40, "comps": ["net:3"], "goal": "<p>Dựng định tuyến L7 bằng Gateway API: Gateway do đội hạ tầng quản lý, HTTPRoute của đội ứng dụng, chia traffic canary theo weight và theo header, và cho phép tham chiếu chéo namespace.<\/p>", "concepts": "<ul>\n<li><strong>GatewayClass<\/strong> (loại controller) → <strong>Gateway<\/strong> (listener: cổng, giao thức, TLS, namespace nào được gắn route) → <strong>HTTPRoute<\/strong> (match theo host, path, header; gửi tới <code>backendRefs<\/code> có <code>weight<\/code>).<\/li>\n<li><code>allowedRoutes.namespaces.from<\/code>: <code>Same<\/code> (mặc định), <code>All<\/code>, hoặc <code>Selector<\/code> theo label namespace.<\/li>\n<li>Route tham chiếu Service ở <strong>namespace khác<\/strong> chỉ hợp lệ khi namespace đích có <strong>ReferenceGrant<\/strong> cho phép.<\/li>\n<li>Kiểm tra trạng thái: <code>kubectl describe httproute<\/code>, các condition <code>Accepted<\/code> và <code>ResolvedRefs<\/code> (cần controller thật).<\/li>\n<\/ul>", "setup_note": "<p>Setup cài CRD Gateway API v1.6.3 (bản standard) từ GitHub nếu cluster chưa có, và tạo GatewayClass <code>lab-gc<\/code>. Lab chấm theo nội dung object. Muốn thấy traffic thật, cài một implementation như Envoy Gateway hoặc NGINX Gateway Fabric và đổi <code>gatewayClassName<\/code>.<\/p>", "tasks": ["<p>Gắn label <code>gateway-access=true<\/code> cho namespace <code>lab19-app<\/code>.<\/p>", "<p>Trong <code>lab19-infra<\/code>, tạo Gateway <code>public<\/code> (class <code>lab-gc<\/code>) có listener tên <code>http<\/code>, HTTP cổng 80, chỉ nhận route từ namespace có label <code>gateway-access=true<\/code>.<\/p>", "<p>Trong <code>lab19-app<\/code>, tạo HTTPRoute <code>shop<\/code> gắn vào <code>public<\/code>, host <code>shop.lab.local<\/code>, gồm 3 rule:\nrequest có header <code>x-canary: \"true\"<\/code> đi <strong>hết<\/strong> vào <code>api-v2:8080<\/code>;\npath <code>/api<\/code> (PathPrefix) chia <code>api:8080<\/code> weight 90 và <code>api-v2:8080<\/code> weight 10;\ncòn lại (<code>/<\/code>) vào <code>web:80<\/code>.<\/p>", "<p>Đội hạ tầng tạo HTTPRoute <code>admin<\/code> trong <code>lab19-infra<\/code> (host <code>admin.lab.local<\/code>) gửi tới Service <code>admin<\/code> cổng 80 ở <code>lab19-app<\/code>. Tạo route đó và ReferenceGrant <code>allow-infra-routes<\/code> trong <code>lab19-app<\/code> cho phép HTTPRoute từ <code>lab19-infra<\/code> tham chiếu Service.<\/p>"], "hints": [["Khung Gateway", "<p><code>kubectl explain gateway.spec.listeners.allowedRoutes --recursive<\/code><\/p>"], ["Match theo header", "<p><code>matches: [{headers: [{name: x-canary, value: \"true\"}]}]<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl label ns lab19-app gateway-access=true\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata: {name: public, namespace: lab19-infra}\nspec:\n  gatewayClassName: lab-gc\n  listeners:\n  - name: http\n    protocol: HTTP\n    port: 80\n    allowedRoutes:\n      namespaces:\n        from: Selector\n        selector: {matchLabels: {gateway-access: &quot;true&quot;}}\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: shop, namespace: lab19-app}\nspec:\n  parentRefs: [{name: public, namespace: lab19-infra}]\n  hostnames: [&quot;shop.lab.local&quot;]\n  rules:\n  - matches: [{headers: [{name: x-canary, value: &quot;true&quot;}]}]\n    backendRefs: [{name: api-v2, port: 8080}]\n  - matches: [{path: {type: PathPrefix, value: /api}}]\n    backendRefs:\n    - {name: api, port: 8080, weight: 90}\n    - {name: api-v2, port: 8080, weight: 10}\n  - matches: [{path: {type: PathPrefix, value: /}}]\n    backendRefs: [{name: web, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: admin, namespace: lab19-infra}\nspec:\n  parentRefs: [{name: public}]\n  hostnames: [&quot;admin.lab.local&quot;]\n  rules:\n  - backendRefs: [{name: admin, namespace: lab19-app, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: ReferenceGrant\nmetadata: {name: allow-infra-routes, namespace: lab19-app}\nspec:\n  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: lab19-infra}]\n  to: [{group: &quot;&quot;, kind: Service}]\n<\/code><\/pre>", "docs": [["Gateway API (Kubernetes docs)", "https://kubernetes.io/docs/concepts/services-networking/gateway/"], ["Gateway API guides", "https://gateway-api.sigs.k8s.io/guides/"], ["HTTP traffic splitting", "https://gateway-api.sigs.k8s.io/guides/traffic-splitting/"]], "support": "scaffold", "prereq": [18], "guide": [["Mô hình Gateway API", "<p>Gateway API tách trách nhiệm theo vai trò:<\/p>\n<ul>\n<li><strong>GatewayClass<\/strong> (nhà cung cấp) cho biết controller nào xử lý.<\/li>\n<li><strong>Gateway<\/strong> (đội hạ tầng) mở listener và quyết định namespace nào được gắn route.<\/li>\n<li><strong>HTTPRoute<\/strong> (đội ứng dụng) khai báo luật định tuyến.<\/li>\n<\/ul>\n<p>Không có lệnh <code>kubectl create<\/code> cho các loại này. Mở trang <em>gateway-api.sigs.k8s.io<\/em> (được phép trong phòng thi) để chép YAML mẫu.<\/p>"], ["Câu 1–2 · Gateway chỉ nhận route từ namespace có label", "<p><strong>Tra:<\/strong> <code>kubectl explain gateway.spec.listeners.allowedRoutes.namespaces<\/code>. Có 3 giá trị <code>from<\/code>: <code>Same<\/code>, <code>All<\/code>, <code>Selector<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get gateway -n lab19-infra<\/code>, rồi <code>kubectl describe gateway public -n lab19-infra<\/code> để xem <code>Listeners<\/code>.<\/p>"], ["Câu 3 · HTTPRoute 3 rule", "<p><strong>Tra:<\/strong> trang <em>HTTP routing<\/em>, <em>HTTP header matching<\/em> và <em>Traffic splitting<\/em> của Gateway API.<\/p>\n<p><strong>Khung:<\/strong> <code>parentRefs<\/code> (Gateway ở namespace khác thì ghi <code>namespace<\/code>), <code>hostnames<\/code>, <code>rules[]<\/code> gồm <code>matches<\/code> + <code>backendRefs<\/code> (có <code>weight<\/code>).<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl describe httproute shop -n lab19-app<\/code>. Phần <code>Status.Parents<\/code> phải có <code>Accepted: True<\/code> và <code>ResolvedRefs: True<\/code>.<\/p>"], ["Câu 4 · Route tham chiếu Service ở namespace khác", "<p>Mặc định route chỉ được trỏ tới Service <strong>cùng namespace<\/strong>. Namespace chứa Service phải \"đồng ý\" bằng ReferenceGrant.<\/p>\n<p><strong>Tra:<\/strong> trang <em>ReferenceGrant<\/em>. <code>from<\/code> là ai tham chiếu (group, kind, namespace); <code>to<\/code> là bị tham chiếu (group <code>\"\"<\/code> cho Service).<\/p>\n<p><strong>Tự kiểm:<\/strong> trước khi tạo ReferenceGrant, <code>describe httproute admin<\/code> báo <code>RefNotPermitted<\/code>. Sau đó lỗi biến mất.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  gc[&quot;GatewayClass lab-gc&quot;] --&gt; gw\n  subgraph infra [&quot;ns lab19-infra&quot;]\n    gw[&quot;Gateway public&lt;br/&gt;listener http:80&lt;br/&gt;allowedRoutes: gateway-access=true&quot;]\n    adm[&quot;HTTPRoute admin&quot;]\n  end\n  subgraph app [&quot;ns lab19-app · gateway-access=true&quot;]\n    shop[&quot;HTTPRoute shop&quot;]\n    api[&quot;api:8080&quot;]\n    v2[&quot;api-v2:8080&quot;]\n    web[&quot;web:80&quot;]\n    admin[&quot;admin:80&quot;]\n    rg[&quot;ReferenceGrant&lt;br/&gt;cho HTTPRoute từ lab19-infra&quot;]\n  end\n  shop --&gt;|&quot;parentRef&quot;| gw\n  adm --&gt;|&quot;parentRef&quot;| gw\n  shop --&gt;|&quot;header x-canary&quot;| v2\n  shop --&gt;|&quot;/api 90%&quot;| api\n  shop --&gt;|&quot;/api 10%&quot;| v2\n  shop --&gt;|&quot;/&quot;| web\n  adm --&gt;|&quot;cần ReferenceGrant&quot;| admin\n  rg -.-&gt; admin\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant R as HTTPRoute shop\n  participant G as Gateway public\n  participant C as Gateway controller\n  participant RG as ReferenceGrant\n  C-&gt;&gt;G: listener có cho namespace của route không?\n  G--&gt;&gt;C: namespace có label gateway-access=true ✔\n  C-&gt;&gt;R: status.parents Accepted True\n  C-&gt;&gt;RG: backend ở namespace khác có được cho phép?\n  alt không có ReferenceGrant\n    C-&gt;&gt;R: ResolvedRefs False, RefNotPermitted\n  else có\n    C-&gt;&gt;R: ResolvedRefs True\n  end\n  Note over C: request: khớp hostname → match header/path → chia theo weight\n<\/code><\/pre>"]]}, {"id": 43, "slug": "loadbalancer-metallb", "dir": "43-loadbalancer-metallb", "title": "Service LoadBalancer với MetalLB", "level": 4, "env": "any", "minutes": 35, "comps": ["net:2", "arch:7"], "goal": "<p>Hiểu Service <code>LoadBalancer<\/code> thật sự cần gì để có địa chỉ ngoài: một controller cấp IP. Cài MetalLB, cấu hình dải IP bằng CRD của nó, xin IP cố định, và đặt <code>externalTrafficPolicy<\/code>.<\/p>", "concepts": "<ul>\n<li><code>LoadBalancer<\/code> = <code>NodePort<\/code> + một IP ngoài do <strong>load-balancer controller<\/strong> cấp. Trên cloud, controller của nhà cung cấp làm việc này. Trên cluster tự dựng không có controller nên <code>EXTERNAL-IP<\/code> đứng <code>&lt;pending&gt;<\/code> mãi.<\/li>\n<li><strong>MetalLB<\/strong> là controller cho bare-metal: <code>IPAddressPool<\/code> khai báo dải IP được cấp, <code>L2Advertisement<\/code> cho MetalLB trả lời ARP cho các IP đó trong mạng L2 của node.<\/li>\n<li>Xin một IP cụ thể: annotation <code>metallb.io/loadBalancerIPs: &lt;ip&gt;<\/code> (trường <code>spec.loadBalancerIP<\/code> đã deprecated).<\/li>\n<li><code>externalTrafficPolicy: Cluster<\/code> (mặc định) cho phép mọi node chuyển tiếp traffic, nhưng mất IP gốc của client. <code>Local<\/code> giữ IP gốc và chỉ node có Pod mới nhận traffic.<\/li>\n<li>Mỗi Service LoadBalancer vẫn có <code>nodePort<\/code> và <code>clusterIP<\/code> bên dưới: ba lớp chồng lên nhau.<\/li>\n<\/ul>", "setup_note": "<p>Cần internet để tải MetalLB. Setup tạo namespace <code>lab43<\/code> với Deployment <code>web<\/code> (2 replica), và chọn một dải IP trống cùng mạng với các node. Dải này in ra màn hình và lưu trong ConfigMap <code>lab-state<\/code> của <code>lab43<\/code> (key <code>pool<\/code> và <code>last<\/code>).<\/p>", "tasks": ["<p>Expose Deployment <code>web<\/code> trong <code>lab43<\/code> thành Service <code>web-lb<\/code> kiểu <code>LoadBalancer<\/code>, cổng 80. Quan sát cột <code>EXTERNAL-IP<\/code> trước khi có controller.<\/p>", "<p>Cài MetalLB <strong>v0.16.1<\/strong> từ manifest <code>metallb-native.yaml<\/code> chính thức. Chờ <code>controller<\/code> và <code>speaker<\/code> sẵn sàng.<\/p>", "<p>Trong <code>metallb-system<\/code>, tạo <code>IPAddressPool<\/code> tên <code>lab-pool<\/code> với dải IP trong <code>lab-state<\/code>, và <code>L2Advertisement<\/code> tên <code>lab-l2<\/code> chỉ quảng bá pool này.<\/p>", "<p><code>web-lb<\/code> phải nhận IP trong dải đó. Đặt <code>externalTrafficPolicy: Local<\/code> cho <code>web-lb<\/code>. Ghi <code>nodePort<\/code> mà Kubernetes cấp cho <code>web-lb<\/code> vào <code>~/cka-answers/43-nodeport.txt<\/code>.<\/p>", "<p>Tạo Service <code>web-fixed<\/code> kiểu <code>LoadBalancer<\/code> cho <code>web<\/code>, cổng 80, xin đúng IP <code>last<\/code> trong <code>lab-state<\/code>. Từ một Pod trong cluster gọi được <code>http://&lt;IP đó&gt;<\/code>.<\/p>"], "hints": [["Vì sao EXTERNAL-IP pending?", "<p><code>kubectl describe svc web-lb -n lab43<\/code>: không có event nào từ controller. Không có controller thì không ai cấp IP.<\/p>"], ["Lỗi webhook khi tạo IPAddressPool", "<p>Pod webhook của MetalLB (trong <code>controller<\/code>) chưa sẵn sàng. Chờ rồi tạo lại.<\/p>"], ["Khung YAML", "<p>Trang MetalLB \"Configuration\" có mẫu <code>IPAddressPool<\/code> và <code>L2Advertisement<\/code> (<code>spec.ipAddressPools<\/code>).<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl expose deploy web -n lab43 --name=web-lb --type=LoadBalancer --port=80\nkubectl get svc web-lb -n lab43                  # EXTERNAL-IP &lt;pending&gt;\n\nkubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.16.1/config/manifests/metallb-native.yaml\nkubectl -n metallb-system wait --for=condition=Available deploy/controller --timeout=300s\nkubectl -n metallb-system rollout status ds/speaker --timeout=300s\nkubectl get cm lab-state -n lab43 -o yaml        # pool, last\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: metallb.io/v1beta1\nkind: IPAddressPool\nmetadata: {name: lab-pool, namespace: metallb-system}\nspec:\n  addresses: [&quot;172.18.0.200-172.18.0.210&quot;]     # giá trị pool của bạn\n---\napiVersion: metallb.io/v1beta1\nkind: L2Advertisement\nmetadata: {name: lab-l2, namespace: metallb-system}\nspec:\n  ipAddressPools: [lab-pool]\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: web-fixed\n  namespace: lab43\n  annotations: {metallb.io/loadBalancerIPs: &quot;172.18.0.210&quot;}   # giá trị last\nspec:\n  type: LoadBalancer\n  selector: {app: web}\n  ports: [{port: 80, targetPort: 80}]\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl patch svc web-lb -n lab43 -p '{&quot;spec&quot;:{&quot;externalTrafficPolicy&quot;:&quot;Local&quot;}}'\nkubectl get svc -n lab43\nkubectl get svc web-lb -n lab43 -o jsonpath='{.spec.ports[0].nodePort}' &gt; ~/cka-answers/43-nodeport.txt\nkubectl run t -n lab43 --rm -it --image=busybox:1.36 --restart=Never -- wget -qO- -T3 http://172.18.0.210\n<\/code><\/pre>", "docs": [["Service type LoadBalancer", "https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer"], ["External traffic policy", "https://kubernetes.io/docs/concepts/services-networking/service/#traffic-policies"], ["MetalLB · Installation", "https://metallb.io/installation/"], ["MetalLB · Configuration", "https://metallb.io/configuration/"]], "support": "scaffold", "prereq": [15], "guide": [["Câu 1 · LoadBalancer khi chưa có controller", "<p><strong>Khung:<\/strong> <code>kubectl expose deploy … --type=LoadBalancer --port=80 --name=…<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get svc -n lab43<\/code> hiện <code>EXTERNAL-IP &lt;pending&gt;<\/code>. Cột PORT(S) đã có dạng <code>80:3xxxx/TCP<\/code>: phần NodePort vẫn được cấp.<\/p>"], ["Câu 2 · Cài MetalLB", "<p><strong>Tra:<\/strong> trang <em>Installation<\/em> của MetalLB, mục <em>Installation by manifest<\/em>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -n metallb-system<\/code>: <code>controller<\/code> 1/1, <code>speaker<\/code> trên mọi node.<\/p>"], ["Câu 3 · Cấu hình bằng CRD", "<p><strong>Tra:<\/strong> trang <em>Configuration<\/em> của MetalLB, mục <em>Layer 2 configuration<\/em>.<\/p>\n<p><strong>Khung:<\/strong> <code>IPAddressPool.spec.addresses<\/code> (dạng <code>a.b.c.d-a.b.c.e<\/code>) và <code>L2Advertisement.spec.ipAddressPools<\/code>. Dải lấy từ <code>kubectl get cm lab-state -n lab43 -o yaml<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> lỗi <code>failed calling webhook<\/code> nghĩa là controller chưa sẵn sàng, chờ rồi tạo lại.<\/p>"], ["Câu 4 · IP được cấp và traffic policy", "<p><strong>Tự kiểm:<\/strong> <code>kubectl get svc web-lb -n lab43 -w<\/code> cho tới khi có EXTERNAL-IP. <code>kubectl explain service.spec.externalTrafficPolicy<\/code> mô tả hai giá trị.<\/p>"], ["Câu 5 · Xin IP cố định", "<p><strong>Tra:<\/strong> trang <em>Usage<\/em> của MetalLB, mục <em>Requesting specific IPs<\/em>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl run t -n lab43 --rm -it --image=busybox:1.36 --restart=Never -- wget -qO- -T3 http://&lt;IP&gt;<\/code>.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  pool[&quot;IPAddressPool lab-pool&lt;br/&gt;x.x.x.200–210&quot;] --&gt; ctrl[&quot;MetalLB controller&lt;br/&gt;cấp IP&quot;]\n  l2[&quot;L2Advertisement lab-l2&quot;] --&gt; spk[&quot;MetalLB speaker&lt;br/&gt;trả lời ARP&quot;]\n  ctrl --&gt; lb[&quot;Service web-lb · LoadBalancer&lt;br/&gt;EXTERNAL-IP trong dải&lt;br/&gt;externalTrafficPolicy Local&quot;]\n  ctrl --&gt; fx[&quot;Service web-fixed&lt;br/&gt;IP cố định .210&quot;]\n  lb --&gt; np[&quot;NodePort 3xxxx&quot;] --&gt; cip[&quot;ClusterIP&quot;] --&gt; pods[&quot;Pod web × 2&quot;]\n  fx --&gt; pods\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant U as Bạn\n  participant A as kube-apiserver\n  participant MC as MetalLB controller\n  participant SP as speaker (mỗi node)\n  participant C as client\n  U-&gt;&gt;A: tạo Service type LoadBalancer\n  Note over A: chưa có controller → EXTERNAL-IP pending\n  MC-&gt;&gt;A: watch Service LoadBalancer\n  MC-&gt;&gt;MC: chọn IP trống trong IPAddressPool (hoặc IP xin qua annotation)\n  MC-&gt;&gt;A: ghi status.loadBalancer.ingress[0].ip\n  SP-&gt;&gt;SP: một node nhận làm &quot;chủ&quot; IP, trả lời ARP\n  C-&gt;&gt;SP: gói tới EXTERNAL-IP\n  SP-&gt;&gt;SP: kube-proxy chuyển tiếp tới Pod (Local: chỉ Pod trên node đó)\n<\/code><\/pre>"]]}, {"id": 44, "slug": "gateway-migrate-ingress", "dir": "44-gateway-migrate-ingress", "title": "Gateway API với controller thật - HTTPS và chuyển từ Ingress", "level": 4, "env": "any", "minutes": 40, "comps": ["net:3", "net:4"], "goal": "<p>Làm dạng câu Gateway API đề thi gần đây hay hỏi: đọc một Ingress đang chạy, tạo Gateway có listener HTTPS dùng Secret TLS sẵn có, viết HTTPRoute với cùng luật, chuyển HTTP sang HTTPS, kiểm tra bằng request thật, rồi gỡ Ingress cũ.<\/p>", "concepts": "<ul>\n<li>Đổi từ Ingress sang Gateway API: <code>spec.tls<\/code> của Ingress thành <strong>listener HTTPS<\/strong> trên Gateway (<code>tls.mode: Terminate<\/code>, <code>certificateRefs<\/code>). Mỗi <code>rules[].host<\/code> + <code>paths<\/code> thành <code>hostnames<\/code> + <code>rules[].matches<\/code> của HTTPRoute.<\/li>\n<li>HTTPRoute gắn vào <strong>một listener cụ thể<\/strong> bằng <code>parentRefs[].sectionName<\/code>. Không ghi <code>sectionName<\/code> thì route gắn vào mọi listener của Gateway.<\/li>\n<li>Chuyển HTTP sang HTTPS: một HTTPRoute riêng gắn vào listener <code>http<\/code>, với filter <code>RequestRedirect<\/code> (<code>scheme: https<\/code>, <code>statusCode: 301<\/code>).<\/li>\n<li>Gateway có điều kiện <code>Accepted<\/code> và <code>Programmed<\/code>. Controller (ở bài này là NGINX Gateway Fabric) tạo Deployment và Service riêng cho từng Gateway trong namespace của Gateway.<\/li>\n<li>Kiểm tra bằng <code>curl --resolve &lt;host&gt;:&lt;port&gt;:&lt;IP&gt;<\/code> để gửi đúng hostname mà không cần DNS.<\/li>\n<\/ul>", "setup_note": "<p>Cần internet. Setup cài CRD Gateway API v1.6.3 và NGINX Gateway Fabric v2.8.0 (GatewayClass <code>nginx<\/code>) nếu chưa có, rồi tạo trong <code>lab44<\/code>: Service <code>web<\/code> (trả về <code>web<\/code>) và <code>api<\/code> (trả về <code>api<\/code> ở <code>/api/health<\/code>), Secret TLS <code>shop-tls<\/code> cho <code>shop.lab44.local<\/code>, và Ingress <code>shop<\/code> cần chuyển đổi.<\/p>", "tasks": ["<p>Đọc Ingress <code>shop<\/code> trong <code>lab44<\/code>. Tạo Gateway <code>shop-gw<\/code> (class <code>nginx<\/code>) có hai listener cho hostname <code>shop.lab44.local<\/code>: <code>http<\/code> (HTTP, cổng 80) và <code>https<\/code> (HTTPS, cổng 443, dùng Secret <code>shop-tls<\/code>).<\/p>", "<p>Tạo HTTPRoute <code>shop<\/code> chỉ gắn vào listener <code>https<\/code>, có cùng luật với Ingress: <code>/api<\/code> (PathPrefix) tới <code>api:8080<\/code>, <code>/<\/code> tới <code>web:80<\/code>.<\/p>", "<p>Tạo HTTPRoute <code>shop-redirect<\/code> gắn vào listener <code>http<\/code>, chuyển mọi request sang <code>https<\/code> với mã 301.<\/p>", "<p>Kiểm tra bằng request thật tới Service mà controller tạo cho <code>shop-gw<\/code>: <code>https://shop.lab44.local/<\/code> trả <code>web<\/code>, <code>https://shop.lab44.local/api/health<\/code> trả <code>api<\/code>, <code>http://shop.lab44.local/<\/code> trả 301. Sau đó xóa Ingress <code>shop<\/code>.<\/p>"], "hints": [["Service của Gateway tên gì?", "<p><code>kubectl get svc -n lab44<\/code>, hoặc theo label: <code>kubectl get svc -n lab44 -l gateway.networking.k8s.io/gateway-name=shop-gw<\/code><\/p>"], ["Gửi request kèm hostname", "<p><code>kubectl run t -n lab44 --rm -it --restart=Never --image=curlimages/curl:8.11.1 -- curl -sk --resolve shop.lab44.local:443:&lt;ClusterIP&gt; https://shop.lab44.local/<\/code><\/p>"], ["Gateway chưa Programmed?", "<p><code>kubectl describe gateway shop-gw -n lab44<\/code>: xem điều kiện của từng listener (Secret có đúng tên, đúng namespace không).<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get ingress shop -n lab44 -o yaml\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata: {name: shop-gw, namespace: lab44}\nspec:\n  gatewayClassName: nginx\n  listeners:\n  - name: http\n    protocol: HTTP\n    port: 80\n    hostname: shop.lab44.local\n  - name: https\n    protocol: HTTPS\n    port: 443\n    hostname: shop.lab44.local\n    tls:\n      mode: Terminate\n      certificateRefs: [{kind: Secret, name: shop-tls}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: shop, namespace: lab44}\nspec:\n  parentRefs: [{name: shop-gw, sectionName: https}]\n  hostnames: [shop.lab44.local]\n  rules:\n  - matches: [{path: {type: PathPrefix, value: /api}}]\n    backendRefs: [{name: api, port: 8080}]\n  - matches: [{path: {type: PathPrefix, value: /}}]\n    backendRefs: [{name: web, port: 80}]\n---\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata: {name: shop-redirect, namespace: lab44}\nspec:\n  parentRefs: [{name: shop-gw, sectionName: http}]\n  hostnames: [shop.lab44.local]\n  rules:\n  - filters:\n    - type: RequestRedirect\n      requestRedirect: {scheme: https, statusCode: 301}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl wait --for=condition=Programmed gateway/shop-gw -n lab44 --timeout=120s\nIP=$(kubectl get svc -n lab44 -l gateway.networking.k8s.io/gateway-name=shop-gw -o jsonpath='{.items[0].spec.clusterIP}')\nkubectl run t -n lab44 --rm -it --restart=Never --image=curlimages/curl:8.11.1 -- \\\n  sh -c &quot;curl -sk --resolve shop.lab44.local:443:$IP https://shop.lab44.local/; curl -sk --resolve shop.lab44.local:443:$IP https://shop.lab44.local/api/health; curl -s -o /dev/null -w '%{http_code}\\n' --resolve shop.lab44.local:80:$IP http://shop.lab44.local/&quot;\nkubectl delete ingress shop -n lab44\n<\/code><\/pre>", "docs": [["Gateway API · Migrating from Ingress", "https://gateway-api.sigs.k8s.io/guides/migrating-from-ingress/"], ["Gateway API · HTTPS (TLS)", "https://gateway-api.sigs.k8s.io/guides/tls/"], ["Gateway API · HTTP redirects", "https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/"], ["NGINX Gateway Fabric · Install with manifests", "https://docs.nginx.com/nginx-gateway-fabric/install/manifests/"]], "support": "scaffold", "prereq": [18, 19], "guide": [["Ánh xạ Ingress → Gateway API", "<table>\n<thead>\n<tr>\n<th>Ingress<\/th>\n<th>Gateway API<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ingressClassName<\/code><\/td>\n<td><code>Gateway.spec.gatewayClassName<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>spec.tls[].secretName<\/code><\/td>\n<td>listener HTTPS, <code>tls.certificateRefs<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>rules[].host<\/code><\/td>\n<td><code>listeners[].hostname<\/code> và <code>HTTPRoute.spec.hostnames<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>paths[].path<\/code> + <code>pathType: Prefix<\/code><\/td>\n<td><code>matches[].path<\/code> kiểu <code>PathPrefix<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>backend.service<\/code><\/td>\n<td><code>backendRefs<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"], ["Câu 1 · Gateway hai listener", "<p><strong>Tra:<\/strong> trang <em>HTTPS<\/em> (TLS) trong hướng dẫn Gateway API có Gateway mẫu với listener HTTPS.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl describe gateway shop-gw -n lab44<\/code>: mỗi listener có <code>Programmed True<\/code>, và <code>Attached Routes<\/code> tăng khi bạn tạo route.<\/p>"], ["Câu 2 · Route chỉ cho HTTPS", "<p><strong>Khung:<\/strong> <code>parentRefs: [{name: shop-gw, sectionName: https}]<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get httproute -n lab44<\/code>, rồi <code>describe<\/code> xem <code>Accepted<\/code> và <code>ResolvedRefs<\/code>.<\/p>"], ["Câu 3 · Chuyển HTTP sang HTTPS", "<p><strong>Tra:<\/strong> trang <em>HTTP redirects and rewrites<\/em>.<\/p>\n<p><strong>Khung:<\/strong> route thứ hai gắn <code>sectionName: http<\/code>, một rule không có <code>backendRefs<\/code>, chỉ có filter <code>RequestRedirect<\/code>.<\/p>"], ["Câu 4 · Kiểm tra thật rồi gỡ Ingress", "<p><strong>Khung:<\/strong> tìm ClusterIP của Service do controller tạo cho Gateway, rồi <code>curl -sk --resolve shop.lab44.local:443:&lt;IP&gt; https://shop.lab44.local/<\/code> từ Pod <code>curlimages/curl<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> chỉ xóa Ingress <strong>sau khi<\/strong> request qua Gateway đã đúng. Thứ tự này áp dụng y hệt khi chuyển đổi trên hệ thống thật.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  ing[&quot;Ingress shop (cũ)&lt;br/&gt;tls shop-tls · /api · /&quot;] -.-&gt;|&quot;chuyển đổi rồi xóa&quot;| gw\n  subgraph lab44 [&quot;ns lab44&quot;]\n    gw[&quot;Gateway shop-gw · class nginx&lt;br/&gt;listener http:80 · https:443&quot;]\n    r1[&quot;HTTPRoute shop&lt;br/&gt;sectionName https&quot;]\n    r2[&quot;HTTPRoute shop-redirect&lt;br/&gt;sectionName http · 301 → https&quot;]\n    api[&quot;Service api:8080&quot;]\n    web[&quot;Service web:80&quot;]\n    sec[&quot;Secret shop-tls&quot;]\n  end\n  r1 --&gt; gw\n  r2 --&gt; gw\n  sec --&gt; gw\n  r1 --&gt;|&quot;/api&quot;| api\n  r1 --&gt;|&quot;/&quot;| web\n  ngf[&quot;NGINX Gateway Fabric&quot;] --&gt;|&quot;tạo Deployment + Service nginx cho Gateway&quot;| gw\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant C as client\n  participant N as nginx của shop-gw\n  participant W as Pod web\n  participant P as Pod api\n  C-&gt;&gt;N: GET http://shop.lab44.local/\n  N--&gt;&gt;C: 301 Location https://shop.lab44.local/\n  C-&gt;&gt;N: TLS handshake (chứng chỉ từ Secret shop-tls)\n  C-&gt;&gt;N: GET https://shop.lab44.local/api/health\n  N-&gt;&gt;N: hostname khớp, PathPrefix /api thắng /\n  N-&gt;&gt;P: chuyển tới api:8080\n  P--&gt;&gt;C: api\n  C-&gt;&gt;N: GET https://shop.lab44.local/\n  N-&gt;&gt;W: chuyển tới web:80\n  W--&gt;&gt;C: web\n<\/code><\/pre>"]]}, {"id": 20, "slug": "volumes", "dir": "20-volumes", "title": "Volume: emptyDir, hostPath, projected và Downward API", "level": 5, "env": "kind", "minutes": 30, "comps": ["stor:1"], "goal": "<p>Chọn đúng loại volume cho từng nhu cầu: chia sẻ dữ liệu giữa container trong Pod, đọc ghi thư mục của node, và gom nhiều nguồn cấu hình vào một thư mục.<\/p>", "concepts": "<ul>\n<li><strong>emptyDir<\/strong> sống theo Pod, dùng chung giữa các container. <code>medium: Memory<\/code> là tmpfs (tính vào memory limit), <code>sizeLimit<\/code> giới hạn dung lượng.<\/li>\n<li><strong>hostPath<\/strong> gắn thư mục của node vào Pod; dữ liệu gắn với một node và là rủi ro bảo mật. <code>type: DirectoryOrCreate<\/code> tự tạo thư mục.<\/li>\n<li><strong>projected<\/strong> gộp <code>configMap<\/code>, <code>secret<\/code>, <code>downwardAPI<\/code>, <code>serviceAccountToken<\/code> vào một thư mục.<\/li>\n<li><strong>Downward API<\/strong> đưa thông tin của chính Pod (tên, namespace, IP, node, label, resources) vào biến môi trường hoặc file.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab20<\/code>, tạo Pod <code>shared<\/code> có 2 container dùng chung emptyDir <code>data<\/code> (tmpfs, tối đa 64Mi) gắn tại <code>/data<\/code>: container <code>writer<\/code> (<code>busybox:1.36<\/code>) ghi <code>date<\/code> vào <code>/data/out.log<\/code> mỗi 2 giây; container <code>reader<\/code> (<code>busybox:1.36<\/code>) chạy <code>tail -F /data/out.log<\/code>.<\/p>", "<p>Tạo Pod <code>hostlog<\/code> (<code>busybox:1.36<\/code>) chạy trên <code>$NODE1<\/code>, gắn hostPath <code>/var/log/lab20<\/code> (tự tạo nếu chưa có) tại <code>/logs<\/code>, và ghi file <code>/logs/hello.txt<\/code> có nội dung <code>hello from pod<\/code>.<\/p>", "<p>Tạo Pod <code>info<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có biến <code>POD_IP<\/code> và <code>NODE_NAME<\/code> lấy từ Downward API, và một projected volume tại <code>/etc/info<\/code> gồm: ConfigMap <code>app-cfg<\/code> (có sẵn), label của Pod vào file <code>labels<\/code>, và token ServiceAccount hạn 3600 giây vào file <code>token<\/code>.<\/p>"], "hints": [["Ghi vào emptyDir trong vòng lặp", "<p><code>sh -c 'while true; do date &gt;&gt; /data/out.log; sleep 2; done'<\/code><\/p>"], ["Pod chạy trên một node cụ thể", "<p>Dùng <code>nodeName: &lt;node&gt;<\/code> hoặc <code>nodeSelector: {kubernetes.io/hostname: &lt;node&gt;}<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: shared, namespace: lab20}\nspec:\n  volumes:\n  - name: data\n    emptyDir: {medium: Memory, sizeLimit: 64Mi}\n  containers:\n  - name: writer\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;while true; do date &gt;&gt; /data/out.log; sleep 2; done&quot;]\n    volumeMounts: [{name: data, mountPath: /data}]\n  - name: reader\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -F /data/out.log&quot;]\n    volumeMounts: [{name: data, mountPath: /data}]\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: hostlog, namespace: lab20}\nspec:\n  nodeSelector: {kubernetes.io/hostname: &lt;NODE1&gt;}\n  volumes:\n  - name: logs\n    hostPath: {path: /var/log/lab20, type: DirectoryOrCreate}\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo 'hello from pod' &gt; /logs/hello.txt; sleep 3600&quot;]\n    volumeMounts: [{name: logs, mountPath: /logs}]\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: info, namespace: lab20, labels: {app: info, tier: demo}}\nspec:\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    env:\n    - name: POD_IP\n      valueFrom: {fieldRef: {fieldPath: status.podIP}}\n    - name: NODE_NAME\n      valueFrom: {fieldRef: {fieldPath: spec.nodeName}}\n    volumeMounts: [{name: info, mountPath: /etc/info}]\n  volumes:\n  - name: info\n    projected:\n      sources:\n      - configMap: {name: app-cfg}\n      - downwardAPI:\n          items: [{path: labels, fieldRef: {fieldPath: metadata.labels}}]\n      - serviceAccountToken: {path: token, expirationSeconds: 3600}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl logs shared -n lab20 -c reader\n./lab ssh $NODE1      # cat /var/log/lab20/hello.txt\nkubectl exec info -n lab20 -- sh -c 'env | grep -E &quot;POD_IP|NODE_NAME&quot;; ls /etc/info'\n<\/code><\/pre>", "docs": [["Volumes", "https://kubernetes.io/docs/concepts/storage/volumes/"], ["Projected volumes", "https://kubernetes.io/docs/concepts/storage/projected-volumes/"], ["Downward API", "https://kubernetes.io/docs/concepts/workloads/pods/downward-api/"]], "support": "scaffold", "prereq": [6, 8], "guide": [["Câu 1 · emptyDir dùng chung giữa 2 container", "<p><strong>Tra:<\/strong> trang <em>Volumes<\/em>, mục <em>emptyDir<\/em>: <code>medium: Memory<\/code> là tmpfs; <code>sizeLimit<\/code>.<\/p>\n<p><strong>Khung:<\/strong> một <code>volumes[]<\/code> ở cấp Pod, cả hai container cùng <code>volumeMounts<\/code> tới nó.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl logs shared -n lab20 -c reader<\/code> thấy ngày giờ tăng dần; <code>kubectl exec shared -c writer -n lab20 -- df -h /data<\/code> thấy <code>tmpfs 64M<\/code>.<\/p>"], ["Câu 2 · hostPath trên một node cụ thể", "<p><strong>Tra:<\/strong> cùng trang, mục <em>hostPath<\/em>, bảng các giá trị <code>type<\/code>. Giá trị nào \"tạo nếu chưa có\"?<\/p>\n<p><strong>Khung:<\/strong> ép Pod lên node bằng <code>nodeSelector<\/code> với label có sẵn <code>kubernetes.io/hostname<\/code>, hoặc bằng <code>nodeName<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>./lab ssh $NODE1<\/code>, rồi <code>cat /var/log/lab20/hello.txt<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> hostPath gắn Pod với một node và mở đường cho Pod đọc filesystem của host. Trong thực tế hạn chế dùng; mức <code>restricted<\/code> của PSA cấm nó.<\/p>"], ["Câu 3 · Downward API + projected volume", "<p><strong>Tra:<\/strong> trang <em>Expose Pod Information to Containers Through Environment Variables<\/em> (<code>fieldRef<\/code>), và <em>Projected Volumes<\/em> (có ví dụ gộp configMap + downwardAPI + serviceAccountToken).<\/p>\n<p><strong>Khung:<\/strong> <code>env[].valueFrom.fieldRef.fieldPath<\/code> cho <code>status.podIP<\/code>, <code>spec.nodeName<\/code>. <code>volumes[].projected.sources[]<\/code> có 3 nguồn.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec info -n lab20 -- sh -c 'env | grep -E \"POD_IP|NODE_NAME\"; ls /etc/info; cat /etc/info/labels'<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> Pod cần có label thì file <code>labels<\/code> mới có nội dung.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph shared [&quot;Pod shared&quot;]\n    w[&quot;writer: date &gt;&gt; /data/out.log&quot;] --&gt; v[(&quot;emptyDir data&lt;br/&gt;tmpfs 64Mi&quot;)]\n    v --&gt; r[&quot;reader: tail -F&quot;]\n  end\n  subgraph hostlog [&quot;Pod hostlog trên NODE1&quot;]\n    h[&quot;/logs/hello.txt&quot;]\n  end\n  h &lt;--&gt;|&quot;hostPath DirectoryOrCreate&quot;| hp[(&quot;NODE1:/var/log/lab20&quot;)]\n  subgraph info [&quot;Pod info&quot;]\n    e[&quot;env POD_IP, NODE_NAME&lt;br/&gt;(fieldRef)&quot;]\n    pv[&quot;/etc/info: projected&quot;]\n  end\n  cm[&quot;ConfigMap app-cfg&quot;] --&gt; pv\n  lb[&quot;metadata.labels&quot;] --&gt; pv\n  tok[&quot;token SA, hạn 3600 giây&quot;] --&gt; pv\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant KL as kubelet\n  participant FS as filesystem của node\n  participant C as container\n  KL-&gt;&gt;FS: emptyDir: tạo thư mục (hoặc tmpfs) khi Pod tới node\n  KL-&gt;&gt;FS: hostPath: dùng thẳng thư mục của node\n  KL-&gt;&gt;KL: projected: ghép ConfigMap + downwardAPI + token vào một thư mục\n  KL-&gt;&gt;C: mount các volume rồi khởi động container\n  Note over KL,C: token được kubelet làm mới trước khi hết hạn\n  KL-&gt;&gt;FS: Pod bị xóa: xóa emptyDir. hostPath vẫn giữ nguyên\n<\/code><\/pre>"]]}, {"id": 21, "slug": "pv-pvc", "dir": "21-pv-pvc", "title": "PersistentVolume, PVC và reclaim policy", "level": 5, "env": "any", "minutes": 30, "comps": ["stor:2", "stor:1"], "goal": "<p>Cấp phát lưu trữ thủ công: tạo PV, để PVC bind đúng PV, dùng trong Pod, và tái sử dụng một PV đã <code>Released<\/code> mà không mất dữ liệu.<\/p>", "concepts": "<ul>\n<li>PVC bind với PV khi khớp <strong>storageClassName<\/strong>, <strong>accessModes<\/strong> (PV phải có mode PVC xin) và <strong>dung lượng<\/strong> (PV ≥ PVC). Một PV chỉ bind với một PVC.<\/li>\n<li>Access mode: <code>ReadWriteOnce<\/code> (một node), <code>ReadOnlyMany<\/code>, <code>ReadWriteMany<\/code>, <code>ReadWriteOncePod<\/code> (một Pod).<\/li>\n<li>Reclaim policy: <code>Retain<\/code> (xóa PVC thì PV thành <code>Released<\/code>, dữ liệu còn), <code>Delete<\/code> (xóa luôn disk). PV <code>Released<\/code> vẫn giữ <code>claimRef<\/code> cũ nên không bind lại được cho tới khi admin gỡ <code>claimRef<\/code>.<\/li>\n<li><code>spec.volumeName<\/code> trong PVC chỉ định đích danh PV muốn bind.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo PV <code>pv-log<\/code>: 1Gi, <code>ReadWriteOnce<\/code>, reclaim <code>Retain<\/code>, storageClassName <code>manual<\/code>, hostPath <code>/mnt/lab21/log<\/code> (tự tạo).<\/p>", "<p>Trong <code>lab21<\/code>, tạo PVC <code>log-claim<\/code> xin 500Mi <code>ReadWriteOnce<\/code> class <code>manual<\/code>. Nó phải bind với <code>pv-log<\/code>.<\/p>", "<p>Tạo Pod <code>logger<\/code> (<code>busybox:1.36<\/code>) dùng <code>log-claim<\/code> tại <code>/log<\/code>, ghi <code>ok<\/code> vào <code>/log/app.log<\/code> rồi <code>sleep 3600<\/code>.<\/p>", "<p>PV <code>pv-old<\/code> đang ở trạng thái <code>Released<\/code> sau khi PVC cũ bị xóa. Đưa nó về <code>Available<\/code> <strong>mà không xóa và tạo lại PV<\/strong>, rồi tạo PVC <code>reuse<\/code> trong <code>lab21<\/code> bind <strong>đích danh<\/strong> vào <code>pv-old<\/code>.<\/p>"], "hints": [["PVC đứng Pending?", "<p><code>kubectl describe pvc log-claim -n lab21<\/code> và so storageClassName, accessModes, dung lượng với PV.<\/p>"], ["Gỡ claimRef", "<p><code>kubectl patch pv pv-old --type=json -p '[{\"op\":\"remove\",\"path\":\"/spec/claimRef\"}]'<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: PersistentVolume\nmetadata: {name: pv-log}\nspec:\n  capacity: {storage: 1Gi}\n  accessModes: [ReadWriteOnce]\n  persistentVolumeReclaimPolicy: Retain\n  storageClassName: manual\n  hostPath: {path: /mnt/lab21/log, type: DirectoryOrCreate}\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: log-claim, namespace: lab21}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual\n  resources: {requests: {storage: 500Mi}}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: logger, namespace: lab21}\nspec:\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo ok &gt; /log/app.log; sleep 3600&quot;]\n    volumeMounts: [{name: log, mountPath: /log}]\n  volumes:\n  - name: log\n    persistentVolumeClaim: {claimName: log-claim}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pv pv-old                     # STATUS Released, CLAIM lab21-old/data\nkubectl patch pv pv-old --type=json -p '[{&quot;op&quot;:&quot;remove&quot;,&quot;path&quot;:&quot;/spec/claimRef&quot;}]'\nkubectl get pv pv-old                     # Available\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: reuse, namespace: lab21}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual-old\n  volumeName: pv-old\n  resources: {requests: {storage: 1Gi}}\n<\/code><\/pre>", "docs": [["Persistent Volumes", "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"], ["Configure a Pod to use a PersistentVolume", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-persistent-volume-storage/"]], "support": "scaffold", "prereq": [20], "guide": [["Cách PVC tìm PV", "<p>Một PVC bind với một PV khi tất cả điều kiện sau thỏa:<\/p>\n<ul>\n<li><code>storageClassName<\/code> <strong>trùng nhau<\/strong>.<\/li>\n<li><code>accessModes<\/code> của PV chứa mode PVC xin.<\/li>\n<li><code>capacity<\/code> của PV ≥ dung lượng PVC xin.<\/li>\n<li>PV đang <code>Available<\/code>.<\/li>\n<\/ul>\n<p>PVC đứng Pending thì kiểm tra lần lượt từng điều kiện.<\/p>"], ["Câu 1 · PV hostPath", "<p><strong>Tra:<\/strong> trang <em>Configure a Pod to Use a PersistentVolume for Storage<\/em>, có YAML PV, PVC và Pod. Không có lệnh <code>kubectl create pv<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pv pv-log<\/code> hiện <code>Available<\/code>, RECLAIM POLICY <code>Retain<\/code>.<\/p>"], ["Câu 2 · PVC", "<p><strong>Tự kiểm:<\/strong> <code>kubectl get pvc -n lab21<\/code> hiện <code>Bound<\/code> và <code>VOLUME pv-log<\/code>. PVC xin 500Mi nhưng CAPACITY là <code>1Gi<\/code>, vì được cả PV.<\/p>"], ["Câu 3 · Pod dùng PVC", "<p><strong>Khung:<\/strong> <code>volumes[].persistentVolumeClaim.claimName<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec logger -n lab21 -- cat /log/app.log<\/code>.<\/p>"], ["Câu 4 · Tái sử dụng PV Released", "<p><code>Retain<\/code> giữ lại dữ liệu khi PVC bị xóa, nhưng PV vẫn nhớ PVC cũ qua <code>spec.claimRef<\/code> và đứng ở trạng thái <code>Released<\/code>.<\/p>\n<p><strong>Khung:<\/strong> xem <code>kubectl get pv pv-old -o yaml<\/code>, tìm trường giữ tham chiếu tới PVC cũ rồi gỡ nó (<code>kubectl edit<\/code> hoặc <code>patch<\/code> kiểu JSON <code>remove<\/code>).<\/p>\n<p><strong>Khung PVC:<\/strong> <code>spec.volumeName<\/code> để bind đích danh. Các điều kiện ở trên vẫn phải thỏa, nên xem <code>storageClassName<\/code> và dung lượng của <code>pv-old<\/code>.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  pvc[&quot;PVC log-claim&lt;br/&gt;500Mi · RWO · manual&quot;] --&gt;|&quot;bind&quot;| pv[&quot;PV pv-log&lt;br/&gt;1Gi · RWO · manual · Retain&lt;br/&gt;hostPath /mnt/lab21/log&quot;]\n  pod[&quot;Pod logger&quot;] --&gt;|&quot;claimName&quot;| pvc\n  old[&quot;PV pv-old&lt;br/&gt;Released · claimRef → PVC đã xóa&quot;] -.-&gt;|&quot;gỡ claimRef&quot;| av[&quot;Available&quot;]\n  reuse[&quot;PVC reuse&lt;br/&gt;volumeName: pv-old&quot;] --&gt; av\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class old bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">stateDiagram-v2\n  [*] --&gt; Available: tạo PV\n  Available --&gt; Bound: PVC khớp class, mode, dung lượng\n  Bound --&gt; Released: xóa PVC (reclaim Retain)\n  Released --&gt; Available: admin gỡ spec.claimRef\n  Bound --&gt; [*]: xóa PVC (reclaim Delete) → xóa luôn PV và dữ liệu\n  Released --&gt; [*]: admin xóa PV\n<\/code><\/pre>\n<p><code>Retain<\/code> giữ dữ liệu nhưng PV không tự dùng lại được, vì nó vẫn \"nhớ\" PVC cũ.<\/p>"]]}, {"id": 22, "slug": "storageclass-statefulset", "dir": "22-storageclass-statefulset", "title": "StorageClass, dynamic provisioning và StatefulSet", "level": 5, "env": "any", "minutes": 35, "comps": ["stor:0", "stor:2"], "goal": "<p>Để cluster tự cấp phát volume: tạo StorageClass, đặt nó làm mặc định, hiểu <code>WaitForFirstConsumer<\/code>, và cho mỗi replica của StatefulSet một volume riêng.<\/p>", "concepts": "<ul>\n<li>StorageClass gồm <code>provisioner<\/code>, <code>parameters<\/code>, <code>reclaimPolicy<\/code> (mặc định <code>Delete<\/code>), <code>volumeBindingMode<\/code> (<code>Immediate<\/code> hoặc <code>WaitForFirstConsumer<\/code>), <code>allowVolumeExpansion<\/code>.<\/li>\n<li><code>WaitForFirstConsumer<\/code>: PVC đứng <code>Pending<\/code> cho tới khi có Pod dùng nó, để disk được tạo đúng zone/node của Pod.<\/li>\n<li>Annotation <code>storageclass.kubernetes.io/is-default-class: \"true\"<\/code> chọn lớp mặc định cho PVC không ghi <code>storageClassName<\/code>. Chỉ nên có <strong>một<\/strong> lớp mặc định.<\/li>\n<li>StatefulSet với <code>volumeClaimTemplates<\/code> tạo PVC tên <code>&lt;template&gt;-&lt;sts&gt;-&lt;số&gt;<\/code>; PVC <strong>không<\/strong> bị xóa khi scale xuống (trừ khi đặt <code>persistentVolumeClaimRetentionPolicy<\/code>).<\/li>\n<\/ul>", "setup_note": "<p>Setup in ra provisioner của StorageClass mặc định hiện tại (với kind là <code>rancher.io/local-path<\/code>). Dùng đúng provisioner đó cho StorageClass mới.<\/p>", "tasks": ["<p>Tạo StorageClass <code>fast<\/code> dùng cùng provisioner với StorageClass mặc định hiện tại, reclaim <code>Retain<\/code>, <code>WaitForFirstConsumer<\/code>, cho phép mở rộng volume.<\/p>", "<p>Đặt <code>fast<\/code> làm StorageClass mặc định, và lớp mặc định cũ <strong>không<\/strong> còn là mặc định.<\/p>", "<p>Trong <code>lab22<\/code>, tạo PVC <code>data<\/code> 1Gi <code>ReadWriteOnce<\/code> <strong>không ghi<\/strong> <code>storageClassName<\/code>. Ghi trạng thái của nó ngay sau khi tạo (<code>Pending<\/code> hay <code>Bound<\/code>) vào <code>~/cka-answers/22-phase.txt<\/code>. Sau đó tạo Pod <code>app<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) dùng PVC này tại <code>/data<\/code> để PVC chuyển <code>Bound<\/code>.<\/p>", "<p>Tạo headless Service <code>db<\/code> và StatefulSet <code>db<\/code> (2 replica, <code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có <code>volumeClaimTemplates<\/code> tên <code>data<\/code>, 1Gi, class <code>fast<\/code>, gắn tại <code>/var/lib/db<\/code>.<\/p>"], "hints": [["Xem provisioner và lớp mặc định", "<p><code>kubectl get sc<\/code> (cột PROVISIONER, dòng có <code>(default)<\/code>)<\/p>"], ["Bỏ mặc định của lớp cũ", "<p><code>kubectl patch sc &lt;tên&gt; -p '{\"metadata\":{\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"false\"}}}'<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get sc        # standard (default)   rancher.io/local-path\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: fast\n  annotations: {storageclass.kubernetes.io/is-default-class: &quot;true&quot;}\nprovisioner: rancher.io/local-path\nreclaimPolicy: Retain\nvolumeBindingMode: WaitForFirstConsumer\nallowVolumeExpansion: true\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl patch sc standard -p '{&quot;metadata&quot;:{&quot;annotations&quot;:{&quot;storageclass.kubernetes.io/is-default-class&quot;:&quot;false&quot;}}}'\nkubectl create -f pvc-data.yaml &amp;&amp; kubectl get pvc data -n lab22   # Pending (chờ consumer)\necho Pending &gt; ~/cka-answers/22-phase.txt\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: app, namespace: lab22}\nspec:\n  containers:\n  - {name: c, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;], volumeMounts: [{name: d, mountPath: /data}]}\n  volumes:\n  - {name: d, persistentVolumeClaim: {claimName: data}}\n---\napiVersion: v1\nkind: Service\nmetadata: {name: db, namespace: lab22}\nspec:\n  clusterIP: None\n  selector: {app: db}\n  ports: [{port: 5432}]\n---\napiVersion: apps/v1\nkind: StatefulSet\nmetadata: {name: db, namespace: lab22}\nspec:\n  serviceName: db\n  replicas: 2\n  selector: {matchLabels: {app: db}}\n  template:\n    metadata: {labels: {app: db}}\n    spec:\n      containers:\n      - name: db\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        volumeMounts: [{name: data, mountPath: /var/lib/db}]\n  volumeClaimTemplates:\n  - metadata: {name: data}\n    spec:\n      accessModes: [ReadWriteOnce]\n      storageClassName: fast\n      resources: {requests: {storage: 1Gi}}\n<\/code><\/pre>", "docs": [["Storage classes", "https://kubernetes.io/docs/concepts/storage/storage-classes/"], ["Dynamic provisioning", "https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/"], ["StatefulSets", "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"]], "support": "scaffold", "prereq": [21], "guide": [["Câu 1 · StorageClass mới", "<p><strong>Khung:<\/strong> <code>kubectl get sc<\/code> để biết provisioner của lớp mặc định, rồi <code>kubectl get sc &lt;tên&gt; -o yaml &gt; fast.yaml<\/code> làm khung và sửa tên cùng các trường.<\/p>\n<p><strong>Tra:<\/strong> <code>kubectl explain storageclass<\/code> có các trường <code>reclaimPolicy<\/code>, <code>volumeBindingMode<\/code>, <code>allowVolumeExpansion<\/code>.<\/p>"], ["Câu 2 · Đổi lớp mặc định", "<p><strong>Tra:<\/strong> trang <em>Change the default StorageClass<\/em> nêu tên annotation.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get sc<\/code> chỉ có <strong>một<\/strong> dòng <code>(default)<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> quên bỏ mặc định ở lớp cũ thì cluster có 2 lớp mặc định. PVC không ghi class sẽ nhận lớp mặc định mới tạo gần nhất, và đề thi chấm sai.<\/p>"], ["Câu 3 · WaitForFirstConsumer", "<p><code>WaitForFirstConsumer<\/code> hoãn việc tạo volume tới khi có Pod dùng PVC, để volume được tạo đúng node Pod chạy.<\/p>\n<p><strong>Tự kiểm:<\/strong> ngay sau khi tạo PVC, <code>kubectl get pvc data -n lab22<\/code>, và <code>describe<\/code> có event <code>waiting for first consumer<\/code>. Sau khi tạo Pod thì PVC thành Bound.<\/p>"], ["Câu 4 · StatefulSet với volumeClaimTemplates", "<p><strong>Tra:<\/strong> trang <em>StatefulSets<\/em>, phần <em>Components<\/em>, có ví dụ đầy đủ gồm Service headless và <code>volumeClaimTemplates<\/code>. Không có lệnh <code>create<\/code> cho StatefulSet: sinh YAML Deployment rồi sửa <code>kind<\/code>, thêm <code>serviceName<\/code>, xóa <code>strategy<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pvc -n lab22<\/code> có <code>data-db-0<\/code>, <code>data-db-1<\/code>. Tên PVC là <code>&lt;template&gt;-&lt;pod&gt;<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> xóa StatefulSet <strong>không<\/strong> xóa PVC của nó.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  sc[&quot;StorageClass fast (default)&lt;br/&gt;Retain · WaitForFirstConsumer&lt;br/&gt;allowVolumeExpansion&quot;]\n  old[&quot;StorageClass cũ&lt;br/&gt;không còn default&quot;]\n  pvc[&quot;PVC data&lt;br/&gt;không ghi class&quot;] --&gt;|&quot;nhận class mặc định&quot;| sc\n  app[&quot;Pod app&quot;] --&gt; pvc\n  subgraph sts [&quot;StatefulSet db&quot;]\n    d0[&quot;db-0&quot;] --&gt; c0[&quot;PVC data-db-0&quot;]\n    d1[&quot;db-1&quot;] --&gt; c1[&quot;PVC data-db-1&quot;]\n  end\n  hs[&quot;Service db headless&quot;] --&gt; sts\n  c0 &amp; c1 --&gt; sc\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant U as Bạn\n  participant A as kube-apiserver\n  participant S as kube-scheduler\n  participant P as provisioner (local-path)\n  U-&gt;&gt;A: tạo PVC data\n  Note over A: WaitForFirstConsumer: PVC Pending, chưa tạo volume\n  U-&gt;&gt;A: tạo Pod app dùng PVC\n  S-&gt;&gt;A: chọn node cho Pod, ghi annotation selected-node lên PVC\n  P-&gt;&gt;A: watch PVC có selected-node\n  P-&gt;&gt;P: tạo thư mục trên đúng node đó\n  P-&gt;&gt;A: tạo PV, bind với PVC\n  Note over A: PVC Bound, Pod chạy được\n<\/code><\/pre>"]]}, {"id": 23, "slug": "rbac", "dir": "23-rbac", "title": "RBAC với Role, ClusterRole và ServiceAccount", "level": 6, "env": "any", "minutes": 35, "comps": ["arch:0"], "goal": "<p>Cấp đúng và đủ quyền theo nguyên tắc tối thiểu cho ServiceAccount, user và group; kiểm tra bằng <code>kubectl auth can-i<\/code>; tìm và gỡ một quyền thừa.<\/p>", "concepts": "<ul>\n<li><strong>Role<\/strong> (trong namespace) và <strong>ClusterRole<\/strong> (toàn cluster) chứa <code>rules<\/code>: <code>apiGroups<\/code>, <code>resources<\/code> (kể cả subresource như <code>pods/log<\/code>, <code>pods/exec<\/code>), <code>verbs<\/code>, tùy chọn <code>resourceNames<\/code>.<\/li>\n<li><strong>RoleBinding<\/strong> gắn Role <em>hoặc ClusterRole<\/em> cho chủ thể <strong>trong một namespace<\/strong>. <strong>ClusterRoleBinding<\/strong> gắn ClusterRole cho toàn cluster.<\/li>\n<li>Chủ thể: <code>User<\/code>, <code>Group<\/code>, <code>ServiceAccount<\/code> (<code>system:serviceaccount:&lt;ns&gt;:&lt;tên&gt;<\/code>). RBAC chỉ <strong>cho phép<\/strong>, không có luật từ chối.<\/li>\n<li>ClusterRole có sẵn: <code>view<\/code>, <code>edit<\/code>, <code>admin<\/code>, <code>cluster-admin<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab23<\/code>, tạo ServiceAccount <code>deployer<\/code> và Role <code>deploy-manager<\/code> cho phép <code>get, list, watch, create, update, patch, delete<\/code> trên <code>deployments<\/code> và chỉ <code>get, list<\/code> trên <code>pods<\/code>. Gắn Role cho <code>deployer<\/code> bằng RoleBinding <code>deployer-binding<\/code>.<\/p>", "<p>Tạo ClusterRole <code>node-reader<\/code> (<code>get, list, watch<\/code> trên <code>nodes<\/code>) và ClusterRoleBinding <code>ops-node-reader<\/code> gắn cho group <code>ops-team<\/code>.<\/p>", "<p>User <code>jane<\/code> chỉ được đọc Pod và log của Pod trong <code>lab23<\/code>. Tạo Role <code>log-reader<\/code> và RoleBinding <code>jane-logs<\/code>.<\/p>", "<p>ServiceAccount <code>auditor<\/code> (tạo mới trong <code>lab23<\/code>) được quyền của ClusterRole có sẵn <code>view<\/code>, nhưng <strong>chỉ trong<\/strong> namespace <code>lab23<\/code>.<\/p>", "<p>ServiceAccount <code>legacy-bot<\/code> trong <code>lab23<\/code> đang xóa được Secret, việc này không được phép. Tìm binding cấp quyền đó, ghi tên binding vào <code>~/cka-answers/23-binding.txt<\/code>, rồi xóa binding.<\/p>"], "hints": [["Kiểm tra quyền", "<p><code>kubectl auth can-i delete deployments -n lab23 --as=system:serviceaccount:lab23:deployer<\/code> hoặc <code>--as=jane<\/code>, <code>--as=x --as-group=ops-team<\/code><\/p>"], ["Tìm binding của một ServiceAccount", "<p><code>kubectl get rolebinding,clusterrolebinding -A -o wide | grep legacy-bot<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create sa deployer -n lab23\nkubectl create role deploy-manager -n lab23 --verb=get,list,watch,create,update,patch,delete --resource=deployments\n# Role tạo bằng lệnh chỉ có một bộ verb; thêm rule cho pods bằng edit:\nkubectl edit role deploy-manager -n lab23\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">rules:\n- apiGroups: [&quot;apps&quot;]\n  resources: [&quot;deployments&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;, &quot;watch&quot;, &quot;create&quot;, &quot;update&quot;, &quot;patch&quot;, &quot;delete&quot;]\n- apiGroups: [&quot;&quot;]\n  resources: [&quot;pods&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;]\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create rolebinding deployer-binding -n lab23 --role=deploy-manager --serviceaccount=lab23:deployer\nkubectl create clusterrole node-reader --verb=get,list,watch --resource=nodes\nkubectl create clusterrolebinding ops-node-reader --clusterrole=node-reader --group=ops-team\nkubectl create role log-reader -n lab23 --verb=get,list --resource=pods,pods/log\nkubectl create rolebinding jane-logs -n lab23 --role=log-reader --user=jane\nkubectl create sa auditor -n lab23\nkubectl create rolebinding auditor-view -n lab23 --clusterrole=view --serviceaccount=lab23:auditor\n\nkubectl get rolebinding,clusterrolebinding -A -o wide | grep legacy-bot\necho ci-secrets-admin &gt; ~/cka-answers/23-binding.txt\nkubectl delete clusterrolebinding ci-secrets-admin\n\nkubectl auth can-i delete secrets -n lab23 --as=system:serviceaccount:lab23:legacy-bot   # no\n<\/code><\/pre>", "docs": [["Using RBAC Authorization", "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"], ["Service accounts", "https://kubernetes.io/docs/concepts/security/service-accounts/"]], "support": "scaffold", "prereq": [2], "guide": [["Cách đọc RBAC", "<p>Mọi quyền đều trả lời câu hỏi: <strong>ai<\/strong> (subject: User, Group, ServiceAccount) được làm <strong>gì<\/strong> (verb) trên <strong>cái gì<\/strong> (resource, apiGroup), <strong>ở đâu<\/strong> (namespace hay toàn cluster).<\/p>\n<ul>\n<li><strong>Role/ClusterRole<\/strong> định nghĩa \"gì trên cái gì\".<\/li>\n<li><strong>RoleBinding/ClusterRoleBinding<\/strong> gắn nó cho \"ai\" và quyết định \"ở đâu\".<\/li>\n<\/ul>\n<p>Một RoleBinding có thể trỏ tới một ClusterRole: khi đó quyền chỉ có hiệu lực trong namespace của binding.<\/p>"], ["Câu 1 · Role nhiều rule", "<p><strong>Khung:<\/strong> <code>kubectl create role --help<\/code>. Một lệnh chỉ tạo một bộ verb cho mọi resource, nên rule thứ hai thêm bằng <code>edit<\/code> hoặc tạo YAML.<\/p>\n<p><strong>Tra:<\/strong> <code>kubectl api-resources | grep -E 'deployments|pods'<\/code> để biết apiGroup: <code>apps<\/code> cho Deployment, <code>\"\"<\/code> cho Pod.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i delete deployments -n lab23 --as=system:serviceaccount:lab23:deployer<\/code> trả về yes; với <code>delete pods<\/code> trả về no.<\/p>"], ["Câu 2 · ClusterRole cho group", "<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i list nodes --as=someone --as-group=ops-team<\/code>.<\/p>"], ["Câu 3 · Log của Pod là subresource", "<p><strong>Khung:<\/strong> quyền đọc log là resource <code>pods/log<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i get pods/log -n lab23 --as=jane<\/code>.<\/p>"], ["Câu 4 · ClusterRole dùng trong một namespace", "<p><strong>Khung:<\/strong> RoleBinding (không phải ClusterRoleBinding) + <code>--clusterrole=view<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>can-i list pods -n lab23<\/code> trả về yes; <code>-n default<\/code> trả về no.<\/p>"], ["Câu 5 · Tìm binding thừa", "<p><strong>Khung:<\/strong> liệt kê <code>rolebinding,clusterrolebinding -A -o wide<\/code> rồi <code>grep<\/code> tên ServiceAccount. Cột SERVICEACCOUNTS cho biết binding gắn cho ai.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i delete secrets -n lab23 --as=system:serviceaccount:lab23:legacy-bot<\/code> trả về no.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  sa1[&quot;SA deployer&quot;] --- rb1[&quot;RoleBinding deployer-binding&quot;] --- r1[&quot;Role deploy-manager&lt;br/&gt;deployments: full · pods: get,list&quot;]\n  g[&quot;Group ops-team&quot;] --- crb[&quot;ClusterRoleBinding ops-node-reader&quot;] --- cr1[&quot;ClusterRole node-reader&quot;]\n  u[&quot;User jane&quot;] --- rb2[&quot;RoleBinding jane-logs&quot;] --- r2[&quot;Role log-reader&lt;br/&gt;pods, pods/log&quot;]\n  sa2[&quot;SA auditor&quot;] --- rb3[&quot;RoleBinding trong lab23&quot;] --- cr2[&quot;ClusterRole view&quot;]\n  sa3[&quot;SA legacy-bot&quot;] -.- bad[&quot;binding thừa:&lt;br/&gt;xóa được Secret&quot;]\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class bad bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant C as client\n  participant AN as Authentication\n  participant AZ as Authorization (RBAC)\n  participant AD as Admission\n  participant E as etcd\n  C-&gt;&gt;AN: request + chứng chỉ hoặc token\n  AN--&gt;&gt;AZ: user, groups (SA: system:serviceaccount:ns:tên)\n  AZ-&gt;&gt;AZ: gom mọi binding có subject này\n  AZ-&gt;&gt;AZ: có rule nào cho phép verb + resource + namespace?\n  alt không\n    AZ--&gt;&gt;C: 403 Forbidden\n  else có\n    AZ-&gt;&gt;AD: tiếp tục\n    AD-&gt;&gt;E: ghi\n    E--&gt;&gt;C: thành công\n  end\n<\/code><\/pre>\n<p>RBAC chỉ có \"cho phép\". Không có rule nào cho phép thì bị từ chối.<\/p>"]]}, {"id": 24, "slug": "users-csr-kubeconfig", "dir": "24-users-csr-kubeconfig", "title": "User mới bằng chứng chỉ, CSR và kubeconfig", "level": 6, "env": "any", "minutes": 35, "comps": ["arch:0"], "goal": "<p>Cấp quyền truy cập cho một lập trình viên từ đầu: tạo khóa và CSR, để cluster ký chứng chỉ, dựng kubeconfig riêng, phân quyền theo group, và thử đăng nhập.<\/p>", "concepts": "<ul>\n<li>Kubernetes không có object User. Với chứng chỉ client: <strong>CN<\/strong> là tên user, <strong>O<\/strong> là group.<\/li>\n<li>CertificateSigningRequest với <code>signerName: kubernetes.io/kube-apiserver-client<\/code> và <code>usages: [client auth]<\/code>; admin chạy <code>kubectl certificate approve<\/code>, chứng chỉ nằm ở <code>.status.certificate<\/code>.<\/li>\n<li>kubeconfig gồm <code>clusters<\/code> (server + CA), <code>users<\/code> (cert + key), <code>contexts<\/code> (ghép hai cái trên). <code>--embed-certs<\/code> nhúng nội dung vào file thay vì trỏ đường dẫn.<\/li>\n<li>Phân quyền cho <strong>group<\/strong> tiện hơn từng user: thêm người chỉ cần cấp cert có <code>O=&lt;group&gt;<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo khóa RSA 2048 và CSR cho user <code>dev1<\/code> thuộc group <code>developers<\/code>, lưu tại <code>~/cka-answers/dev1.key<\/code> và <code>~/cka-answers/dev1.csr<\/code>.<\/p>", "<p>Gửi CertificateSigningRequest tên <code>dev1<\/code> (signer client của API server, hạn 1 ngày), duyệt nó, và lưu chứng chỉ vào <code>~/cka-answers/dev1.crt<\/code>.<\/p>", "<p>Tạo file kubeconfig <strong>riêng<\/strong> <code>~/cka-answers/dev1.kubeconfig<\/code> (không sửa <code>~/.kube/config<\/code>) có cluster giống cluster hiện tại, user <code>dev1<\/code> với cert nhúng sẵn, context <code>dev1@lab<\/code> dùng namespace <code>lab24<\/code>, và đặt nó là context hiện tại trong file đó.<\/p>", "<p>Group <code>developers<\/code> được <code>get, list, watch, create, delete<\/code> Pod và Deployment trong <code>lab24<\/code>, không gì khác.<\/p>", "<p>Kiểm tra: dùng <code>--kubeconfig ~/cka-answers/dev1.kubeconfig<\/code>, tạo được Deployment <code>hello<\/code> (<code>nginx:1.27<\/code>) trong <code>lab24<\/code> nhưng <strong>không<\/strong> xem được node.<\/p>"], "hints": [["Tạo CSR với group", "<p><code>openssl req -new -key dev1.key -subj \"/CN=dev1/O=developers\" -out dev1.csr<\/code><\/p>"], ["Lấy server và CA của cluster hiện tại", "<p><code>kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}'<\/code> và <code>…certificate-authority-data<\/code> (base64)<\/p>"]], "solution": "<pre><code class=\"language-bash\">cd ~/cka-answers\nopenssl genrsa -out dev1.key 2048\nopenssl req -new -key dev1.key -subj &quot;/CN=dev1/O=developers&quot; -out dev1.csr\ncat &lt;&lt;EOF | kubectl apply -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\nmetadata: {name: dev1}\nspec:\n  request: $(base64 -w0 &lt; dev1.csr)\n  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 86400\n  usages: [client auth]\nEOF\nkubectl certificate approve dev1\nkubectl get csr dev1 -o jsonpath='{.status.certificate}' | base64 -d &gt; dev1.crt\n\nSERVER=$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')\nkubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d &gt; ca.crt\nK=&quot;--kubeconfig=dev1.kubeconfig&quot;\nkubectl config set-cluster lab $K --server=&quot;$SERVER&quot; --certificate-authority=ca.crt --embed-certs\nkubectl config set-credentials dev1 $K --client-certificate=dev1.crt --client-key=dev1.key --embed-certs\nkubectl config set-context dev1@lab $K --cluster=lab --user=dev1 --namespace=lab24\nkubectl config use-context dev1@lab $K\n\nkubectl create role dev -n lab24 --verb=get,list,watch,create,delete --resource=pods,deployments\nkubectl create rolebinding developers -n lab24 --role=dev --group=developers\n
