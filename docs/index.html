&quot;]\n    volumeMounts: [{name: data, mountPath: /data}]\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: hostlog, namespace: lab20}\nspec:\n  nodeSelector: {kubernetes.io/hostname: &lt;NODE1&gt;}\n  volumes:\n  - name: logs\n    hostPath: {path: /var/log/lab20, type: DirectoryOrCreate}\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo 'hello from pod' &gt; /logs/hello.txt; sleep 3600&quot;]\n    volumeMounts: [{name: logs, mountPath: /logs}]\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: info, namespace: lab20, labels: {app: info, tier: demo}}\nspec:\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    env:\n    - name: POD_IP\n      valueFrom: {fieldRef: {fieldPath: status.podIP}}\n    - name: NODE_NAME\n      valueFrom: {fieldRef: {fieldPath: spec.nodeName}}\n    volumeMounts: [{name: info, mountPath: /etc/info}]\n  volumes:\n  - name: info\n    projected:\n      sources:\n      - configMap: {name: app-cfg}\n      - downwardAPI:\n          items: [{path: labels, fieldRef: {fieldPath: metadata.labels}}]\n      - serviceAccountToken: {path: token, expirationSeconds: 3600}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl logs shared -n lab20 -c reader\n./lab ssh $NODE1      # cat /var/log/lab20/hello.txt\nkubectl exec info -n lab20 -- sh -c 'env | grep -E &quot;POD_IP|NODE_NAME&quot;; ls /etc/info'\n<\/code><\/pre>", "docs": [["Volumes", "https://kubernetes.io/docs/concepts/storage/volumes/"], ["Projected volumes", "https://kubernetes.io/docs/concepts/storage/projected-volumes/"], ["Downward API", "https://kubernetes.io/docs/concepts/workloads/pods/downward-api/"]], "support": "scaffold", "prereq": [6, 8], "guide": [["Câu 1 · emptyDir dùng chung giữa 2 container", "<p><strong>Tra:<\/strong> trang <em>Volumes<\/em>, mục <em>emptyDir<\/em>: <code>medium: Memory<\/code> là tmpfs; <code>sizeLimit<\/code>.<\/p>\n<p><strong>Khung:<\/strong> một <code>volumes[]<\/code> ở cấp Pod, cả hai container cùng <code>volumeMounts<\/code> tới nó.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl logs shared -n lab20 -c reader<\/code> thấy ngày giờ tăng dần; <code>kubectl exec shared -c writer -n lab20 -- df -h /data<\/code> thấy <code>tmpfs 64M<\/code>.<\/p>"], ["Câu 2 · hostPath trên một node cụ thể", "<p><strong>Tra:<\/strong> cùng trang, mục <em>hostPath<\/em>, bảng các giá trị <code>type<\/code>. Giá trị nào \"tạo nếu chưa có\"?<\/p>\n<p><strong>Khung:<\/strong> ép Pod lên node bằng <code>nodeSelector<\/code> với label có sẵn <code>kubernetes.io/hostname<\/code>, hoặc bằng <code>nodeName<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>./lab ssh $NODE1<\/code>, rồi <code>cat /var/log/lab20/hello.txt<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> hostPath gắn Pod với một node và mở đường cho Pod đọc filesystem của host. Trong thực tế hạn chế dùng; mức <code>restricted<\/code> của PSA cấm nó.<\/p>"], ["Câu 3 · Downward API + projected volume", "<p><strong>Tra:<\/strong> trang <em>Expose Pod Information to Containers Through Environment Variables<\/em> (<code>fieldRef<\/code>), và <em>Projected Volumes<\/em> (có ví dụ gộp configMap + downwardAPI + serviceAccountToken).<\/p>\n<p><strong>Khung:<\/strong> <code>env[].valueFrom.fieldRef.fieldPath<\/code> cho <code>status.podIP<\/code>, <code>spec.nodeName<\/code>. <code>volumes[].projected.sources[]<\/code> có 3 nguồn.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec info -n lab20 -- sh -c 'env | grep -E \"POD_IP|NODE_NAME\"; ls /etc/info; cat /etc/info/labels'<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> Pod cần có label thì file <code>labels<\/code> mới có nội dung.<\/p>"]]}, {"id": 21, "slug": "pv-pvc", "dir": "21-pv-pvc", "title": "PersistentVolume, PVC và reclaim policy", "level": 5, "env": "any", "minutes": 30, "comps": ["stor:2", "stor:1"], "goal": "<p>Cấp phát lưu trữ thủ công: tạo PV, để PVC bind đúng PV, dùng trong Pod, và tái sử dụng một PV đã <code>Released<\/code> mà không mất dữ liệu.<\/p>", "concepts": "<ul>\n<li>PVC bind với PV khi khớp <strong>storageClassName<\/strong>, <strong>accessModes<\/strong> (PV phải có mode PVC xin) và <strong>dung lượng<\/strong> (PV ≥ PVC). Một PV chỉ bind với một PVC.<\/li>\n<li>Access mode: <code>ReadWriteOnce<\/code> (một node), <code>ReadOnlyMany<\/code>, <code>ReadWriteMany<\/code>, <code>ReadWriteOncePod<\/code> (một Pod).<\/li>\n<li>Reclaim policy: <code>Retain<\/code> (xóa PVC thì PV thành <code>Released<\/code>, dữ liệu còn), <code>Delete<\/code> (xóa luôn disk). PV <code>Released<\/code> vẫn giữ <code>claimRef<\/code> cũ nên không bind lại được cho tới khi admin gỡ <code>claimRef<\/code>.<\/li>\n<li><code>spec.volumeName<\/code> trong PVC chỉ định đích danh PV muốn bind.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo PV <code>pv-log<\/code>: 1Gi, <code>ReadWriteOnce<\/code>, reclaim <code>Retain<\/code>, storageClassName <code>manual<\/code>, hostPath <code>/mnt/lab21/log<\/code> (tự tạo).<\/p>", "<p>Trong <code>lab21<\/code>, tạo PVC <code>log-claim<\/code> xin 500Mi <code>ReadWriteOnce<\/code> class <code>manual<\/code>. Nó phải bind với <code>pv-log<\/code>.<\/p>", "<p>Tạo Pod <code>logger<\/code> (<code>busybox:1.36<\/code>) dùng <code>log-claim<\/code> tại <code>/log<\/code>, ghi <code>ok<\/code> vào <code>/log/app.log<\/code> rồi <code>sleep 3600<\/code>.<\/p>", "<p>PV <code>pv-old<\/code> đang ở trạng thái <code>Released<\/code> sau khi PVC cũ bị xóa. Đưa nó về <code>Available<\/code> <strong>mà không xóa và tạo lại PV<\/strong>, rồi tạo PVC <code>reuse<\/code> trong <code>lab21<\/code> bind <strong>đích danh<\/strong> vào <code>pv-old<\/code>.<\/p>"], "hints": [["PVC đứng Pending?", "<p><code>kubectl describe pvc log-claim -n lab21<\/code> và so storageClassName, accessModes, dung lượng với PV.<\/p>"], ["Gỡ claimRef", "<p><code>kubectl patch pv pv-old --type=json -p '[{\"op\":\"remove\",\"path\":\"/spec/claimRef\"}]'<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: PersistentVolume\nmetadata: {name: pv-log}\nspec:\n  capacity: {storage: 1Gi}\n  accessModes: [ReadWriteOnce]\n  persistentVolumeReclaimPolicy: Retain\n  storageClassName: manual\n  hostPath: {path: /mnt/lab21/log, type: DirectoryOrCreate}\n---\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: log-claim, namespace: lab21}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual\n  resources: {requests: {storage: 500Mi}}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: logger, namespace: lab21}\nspec:\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo ok &gt; /log/app.log; sleep 3600&quot;]\n    volumeMounts: [{name: log, mountPath: /log}]\n  volumes:\n  - name: log\n    persistentVolumeClaim: {claimName: log-claim}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pv pv-old                     # STATUS Released, CLAIM lab21-old/data\nkubectl patch pv pv-old --type=json -p '[{&quot;op&quot;:&quot;remove&quot;,&quot;path&quot;:&quot;/spec/claimRef&quot;}]'\nkubectl get pv pv-old                     # Available\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: PersistentVolumeClaim\nmetadata: {name: reuse, namespace: lab21}\nspec:\n  accessModes: [ReadWriteOnce]\n  storageClassName: manual-old\n  volumeName: pv-old\n  resources: {requests: {storage: 1Gi}}\n<\/code><\/pre>", "docs": [["Persistent Volumes", "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"], ["Configure a Pod to use a PersistentVolume", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-persistent-volume-storage/"]], "support": "scaffold", "prereq": [20], "guide": [["Cách PVC tìm PV", "<p>Một PVC bind với một PV khi tất cả điều kiện sau thỏa:<\/p>\n<ul>\n<li><code>storageClassName<\/code> <strong>trùng nhau<\/strong>.<\/li>\n<li><code>accessModes<\/code> của PV chứa mode PVC xin.<\/li>\n<li><code>capacity<\/code> của PV ≥ dung lượng PVC xin.<\/li>\n<li>PV đang <code>Available<\/code>.<\/li>\n<\/ul>\n<p>PVC đứng Pending thì kiểm tra lần lượt từng điều kiện.<\/p>"], ["Câu 1 · PV hostPath", "<p><strong>Tra:<\/strong> trang <em>Configure a Pod to Use a PersistentVolume for Storage<\/em>, có YAML PV, PVC và Pod. Không có lệnh <code>kubectl create pv<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pv pv-log<\/code> hiện <code>Available<\/code>, RECLAIM POLICY <code>Retain<\/code>.<\/p>"], ["Câu 2 · PVC", "<p><strong>Tự kiểm:<\/strong> <code>kubectl get pvc -n lab21<\/code> hiện <code>Bound<\/code> và <code>VOLUME pv-log<\/code>. PVC xin 500Mi nhưng CAPACITY là <code>1Gi<\/code>, vì được cả PV.<\/p>"], ["Câu 3 · Pod dùng PVC", "<p><strong>Khung:<\/strong> <code>volumes[].persistentVolumeClaim.claimName<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec logger -n lab21 -- cat /log/app.log<\/code>.<\/p>"], ["Câu 4 · Tái sử dụng PV Released", "<p><code>Retain<\/code> giữ lại dữ liệu khi PVC bị xóa, nhưng PV vẫn nhớ PVC cũ qua <code>spec.claimRef<\/code> và đứng ở trạng thái <code>Released<\/code>.<\/p>\n<p><strong>Khung:<\/strong> xem <code>kubectl get pv pv-old -o yaml<\/code>, tìm trường giữ tham chiếu tới PVC cũ rồi gỡ nó (<code>kubectl edit<\/code> hoặc <code>patch<\/code> kiểu JSON <code>remove<\/code>).<\/p>\n<p><strong>Khung PVC:<\/strong> <code>spec.volumeName<\/code> để bind đích danh. Các điều kiện ở trên vẫn phải thỏa, nên xem <code>storageClassName<\/code> và dung lượng của <code>pv-old<\/code>.<\/p>"]]}, {"id": 22, "slug": "storageclass-statefulset", "dir": "22-storageclass-statefulset", "title": "StorageClass, dynamic provisioning và StatefulSet", "level": 5, "env": "any", "minutes": 35, "comps": ["stor:0", "stor:2"], "goal": "<p>Để cluster tự cấp phát volume: tạo StorageClass, đặt nó làm mặc định, hiểu <code>WaitForFirstConsumer<\/code>, và cho mỗi replica của StatefulSet một volume riêng.<\/p>", "concepts": "<ul>\n<li>StorageClass gồm <code>provisioner<\/code>, <code>parameters<\/code>, <code>reclaimPolicy<\/code> (mặc định <code>Delete<\/code>), <code>volumeBindingMode<\/code> (<code>Immediate<\/code> hoặc <code>WaitForFirstConsumer<\/code>), <code>allowVolumeExpansion<\/code>.<\/li>\n<li><code>WaitForFirstConsumer<\/code>: PVC đứng <code>Pending<\/code> cho tới khi có Pod dùng nó, để disk được tạo đúng zone/node của Pod.<\/li>\n<li>Annotation <code>storageclass.kubernetes.io/is-default-class: \"true\"<\/code> chọn lớp mặc định cho PVC không ghi <code>storageClassName<\/code>. Chỉ nên có <strong>một<\/strong> lớp mặc định.<\/li>\n<li>StatefulSet với <code>volumeClaimTemplates<\/code> tạo PVC tên <code>&lt;template&gt;-&lt;sts&gt;-&lt;số&gt;<\/code>; PVC <strong>không<\/strong> bị xóa khi scale xuống (trừ khi đặt <code>persistentVolumeClaimRetentionPolicy<\/code>).<\/li>\n<\/ul>", "setup_note": "<p>Setup in ra provisioner của StorageClass mặc định hiện tại (với kind là <code>rancher.io/local-path<\/code>). Dùng đúng provisioner đó cho StorageClass mới.<\/p>", "tasks": ["<p>Tạo StorageClass <code>fast<\/code> dùng cùng provisioner với StorageClass mặc định hiện tại, reclaim <code>Retain<\/code>, <code>WaitForFirstConsumer<\/code>, cho phép mở rộng volume.<\/p>", "<p>Đặt <code>fast<\/code> làm StorageClass mặc định, và lớp mặc định cũ <strong>không<\/strong> còn là mặc định.<\/p>", "<p>Trong <code>lab22<\/code>, tạo PVC <code>data<\/code> 1Gi <code>ReadWriteOnce<\/code> <strong>không ghi<\/strong> <code>storageClassName<\/code>. Ghi trạng thái của nó ngay sau khi tạo (<code>Pending<\/code> hay <code>Bound<\/code>) vào <code>~/cka-answers/22-phase.txt<\/code>. Sau đó tạo Pod <code>app<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) dùng PVC này tại <code>/data<\/code> để PVC chuyển <code>Bound<\/code>.<\/p>", "<p>Tạo headless Service <code>db<\/code> và StatefulSet <code>db<\/code> (2 replica, <code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) có <code>volumeClaimTemplates<\/code> tên <code>data<\/code>, 1Gi, class <code>fast<\/code>, gắn tại <code>/var/lib/db<\/code>.<\/p>"], "hints": [["Xem provisioner và lớp mặc định", "<p><code>kubectl get sc<\/code> (cột PROVISIONER, dòng có <code>(default)<\/code>)<\/p>"], ["Bỏ mặc định của lớp cũ", "<p><code>kubectl patch sc &lt;tên&gt; -p '{\"metadata\":{\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"false\"}}}'<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get sc        # standard (default)   rancher.io/local-path\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: storage.k8s.io/v1\nkind: StorageClass\nmetadata:\n  name: fast\n  annotations: {storageclass.kubernetes.io/is-default-class: &quot;true&quot;}\nprovisioner: rancher.io/local-path\nreclaimPolicy: Retain\nvolumeBindingMode: WaitForFirstConsumer\nallowVolumeExpansion: true\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl patch sc standard -p '{&quot;metadata&quot;:{&quot;annotations&quot;:{&quot;storageclass.kubernetes.io/is-default-class&quot;:&quot;false&quot;}}}'\nkubectl create -f pvc-data.yaml &amp;&amp; kubectl get pvc data -n lab22   # Pending (chờ consumer)\necho Pending &gt; ~/cka-answers/22-phase.txt\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: app, namespace: lab22}\nspec:\n  containers:\n  - {name: c, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;], volumeMounts: [{name: d, mountPath: /data}]}\n  volumes:\n  - {name: d, persistentVolumeClaim: {claimName: data}}\n---\napiVersion: v1\nkind: Service\nmetadata: {name: db, namespace: lab22}\nspec:\n  clusterIP: None\n  selector: {app: db}\n  ports: [{port: 5432}]\n---\napiVersion: apps/v1\nkind: StatefulSet\nmetadata: {name: db, namespace: lab22}\nspec:\n  serviceName: db\n  replicas: 2\n  selector: {matchLabels: {app: db}}\n  template:\n    metadata: {labels: {app: db}}\n    spec:\n      containers:\n      - name: db\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        volumeMounts: [{name: data, mountPath: /var/lib/db}]\n  volumeClaimTemplates:\n  - metadata: {name: data}\n    spec:\n      accessModes: [ReadWriteOnce]\n      storageClassName: fast\n      resources: {requests: {storage: 1Gi}}\n<\/code><\/pre>", "docs": [["Storage classes", "https://kubernetes.io/docs/concepts/storage/storage-classes/"], ["Dynamic provisioning", "https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/"], ["StatefulSets", "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"]], "support": "scaffold", "prereq": [21], "guide": [["Câu 1 · StorageClass mới", "<p><strong>Khung:<\/strong> <code>kubectl get sc<\/code> để biết provisioner của lớp mặc định, rồi <code>kubectl get sc &lt;tên&gt; -o yaml &gt; fast.yaml<\/code> làm khung và sửa tên cùng các trường.<\/p>\n<p><strong>Tra:<\/strong> <code>kubectl explain storageclass<\/code> có các trường <code>reclaimPolicy<\/code>, <code>volumeBindingMode<\/code>, <code>allowVolumeExpansion<\/code>.<\/p>"], ["Câu 2 · Đổi lớp mặc định", "<p><strong>Tra:<\/strong> trang <em>Change the default StorageClass<\/em> nêu tên annotation.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get sc<\/code> chỉ có <strong>một<\/strong> dòng <code>(default)<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> quên bỏ mặc định ở lớp cũ thì cluster có 2 lớp mặc định. PVC không ghi class sẽ nhận lớp mặc định mới tạo gần nhất, và đề thi chấm sai.<\/p>"], ["Câu 3 · WaitForFirstConsumer", "<p><code>WaitForFirstConsumer<\/code> hoãn việc tạo volume tới khi có Pod dùng PVC, để volume được tạo đúng node Pod chạy.<\/p>\n<p><strong>Tự kiểm:<\/strong> ngay sau khi tạo PVC, <code>kubectl get pvc data -n lab22<\/code>, và <code>describe<\/code> có event <code>waiting for first consumer<\/code>. Sau khi tạo Pod thì PVC thành Bound.<\/p>"], ["Câu 4 · StatefulSet với volumeClaimTemplates", "<p><strong>Tra:<\/strong> trang <em>StatefulSets<\/em>, phần <em>Components<\/em>, có ví dụ đầy đủ gồm Service headless và <code>volumeClaimTemplates<\/code>. Không có lệnh <code>create<\/code> cho StatefulSet: sinh YAML Deployment rồi sửa <code>kind<\/code>, thêm <code>serviceName<\/code>, xóa <code>strategy<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pvc -n lab22<\/code> có <code>data-db-0<\/code>, <code>data-db-1<\/code>. Tên PVC là <code>&lt;template&gt;-&lt;pod&gt;<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> xóa StatefulSet <strong>không<\/strong> xóa PVC của nó.<\/p>"]]}, {"id": 23, "slug": "rbac", "dir": "23-rbac", "title": "RBAC với Role, ClusterRole và ServiceAccount", "level": 6, "env": "any", "minutes": 35, "comps": ["arch:0"], "goal": "<p>Cấp đúng và đủ quyền theo nguyên tắc tối thiểu cho ServiceAccount, user và group; kiểm tra bằng <code>kubectl auth can-i<\/code>; tìm và gỡ một quyền thừa.<\/p>", "concepts": "<ul>\n<li><strong>Role<\/strong> (trong namespace) và <strong>ClusterRole<\/strong> (toàn cluster) chứa <code>rules<\/code>: <code>apiGroups<\/code>, <code>resources<\/code> (kể cả subresource như <code>pods/log<\/code>, <code>pods/exec<\/code>), <code>verbs<\/code>, tùy chọn <code>resourceNames<\/code>.<\/li>\n<li><strong>RoleBinding<\/strong> gắn Role <em>hoặc ClusterRole<\/em> cho chủ thể <strong>trong một namespace<\/strong>. <strong>ClusterRoleBinding<\/strong> gắn ClusterRole cho toàn cluster.<\/li>\n<li>Chủ thể: <code>User<\/code>, <code>Group<\/code>, <code>ServiceAccount<\/code> (<code>system:serviceaccount:&lt;ns&gt;:&lt;tên&gt;<\/code>). RBAC chỉ <strong>cho phép<\/strong>, không có luật từ chối.<\/li>\n<li>ClusterRole có sẵn: <code>view<\/code>, <code>edit<\/code>, <code>admin<\/code>, <code>cluster-admin<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab23<\/code>, tạo ServiceAccount <code>deployer<\/code> và Role <code>deploy-manager<\/code> cho phép <code>get, list, watch, create, update, patch, delete<\/code> trên <code>deployments<\/code> và chỉ <code>get, list<\/code> trên <code>pods<\/code>. Gắn Role cho <code>deployer<\/code> bằng RoleBinding <code>deployer-binding<\/code>.<\/p>", "<p>Tạo ClusterRole <code>node-reader<\/code> (<code>get, list, watch<\/code> trên <code>nodes<\/code>) và ClusterRoleBinding <code>ops-node-reader<\/code> gắn cho group <code>ops-team<\/code>.<\/p>", "<p>User <code>jane<\/code> chỉ được đọc Pod và log của Pod trong <code>lab23<\/code>. Tạo Role <code>log-reader<\/code> và RoleBinding <code>jane-logs<\/code>.<\/p>", "<p>ServiceAccount <code>auditor<\/code> (tạo mới trong <code>lab23<\/code>) được quyền của ClusterRole có sẵn <code>view<\/code>, nhưng <strong>chỉ trong<\/strong> namespace <code>lab23<\/code>.<\/p>", "<p>ServiceAccount <code>legacy-bot<\/code> trong <code>lab23<\/code> đang xóa được Secret, việc này không được phép. Tìm binding cấp quyền đó, ghi tên binding vào <code>~/cka-answers/23-binding.txt<\/code>, rồi xóa binding.<\/p>"], "hints": [["Kiểm tra quyền", "<p><code>kubectl auth can-i delete deployments -n lab23 --as=system:serviceaccount:lab23:deployer<\/code> hoặc <code>--as=jane<\/code>, <code>--as=x --as-group=ops-team<\/code><\/p>"], ["Tìm binding của một ServiceAccount", "<p><code>kubectl get rolebinding,clusterrolebinding -A -o wide | grep legacy-bot<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create sa deployer -n lab23\nkubectl create role deploy-manager -n lab23 --verb=get,list,watch,create,update,patch,delete --resource=deployments\n# Role tạo bằng lệnh chỉ có một bộ verb; thêm rule cho pods bằng edit:\nkubectl edit role deploy-manager -n lab23\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">rules:\n- apiGroups: [&quot;apps&quot;]\n  resources: [&quot;deployments&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;, &quot;watch&quot;, &quot;create&quot;, &quot;update&quot;, &quot;patch&quot;, &quot;delete&quot;]\n- apiGroups: [&quot;&quot;]\n  resources: [&quot;pods&quot;]\n  verbs: [&quot;get&quot;, &quot;list&quot;]\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create rolebinding deployer-binding -n lab23 --role=deploy-manager --serviceaccount=lab23:deployer\nkubectl create clusterrole node-reader --verb=get,list,watch --resource=nodes\nkubectl create clusterrolebinding ops-node-reader --clusterrole=node-reader --group=ops-team\nkubectl create role log-reader -n lab23 --verb=get,list --resource=pods,pods/log\nkubectl create rolebinding jane-logs -n lab23 --role=log-reader --user=jane\nkubectl create sa auditor -n lab23\nkubectl create rolebinding auditor-view -n lab23 --clusterrole=view --serviceaccount=lab23:auditor\n\nkubectl get rolebinding,clusterrolebinding -A -o wide | grep legacy-bot\necho ci-secrets-admin &gt; ~/cka-answers/23-binding.txt\nkubectl delete clusterrolebinding ci-secrets-admin\n\nkubectl auth can-i delete secrets -n lab23 --as=system:serviceaccount:lab23:legacy-bot   # no\n<\/code><\/pre>", "docs": [["Using RBAC Authorization", "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"], ["Service accounts", "https://kubernetes.io/docs/concepts/security/service-accounts/"]], "support": "scaffold", "prereq": [2], "guide": [["Cách đọc RBAC", "<p>Mọi quyền đều trả lời câu hỏi: <strong>ai<\/strong> (subject: User, Group, ServiceAccount) được làm <strong>gì<\/strong> (verb) trên <strong>cái gì<\/strong> (resource, apiGroup), <strong>ở đâu<\/strong> (namespace hay toàn cluster).<\/p>\n<ul>\n<li><strong>Role/ClusterRole<\/strong> định nghĩa \"gì trên cái gì\".<\/li>\n<li><strong>RoleBinding/ClusterRoleBinding<\/strong> gắn nó cho \"ai\" và quyết định \"ở đâu\".<\/li>\n<\/ul>\n<p>Một RoleBinding có thể trỏ tới một ClusterRole: khi đó quyền chỉ có hiệu lực trong namespace của binding.<\/p>"], ["Câu 1 · Role nhiều rule", "<p><strong>Khung:<\/strong> <code>kubectl create role --help<\/code>. Một lệnh chỉ tạo một bộ verb cho mọi resource, nên rule thứ hai thêm bằng <code>edit<\/code> hoặc tạo YAML.<\/p>\n<p><strong>Tra:<\/strong> <code>kubectl api-resources | grep -E 'deployments|pods'<\/code> để biết apiGroup: <code>apps<\/code> cho Deployment, <code>\"\"<\/code> cho Pod.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i delete deployments -n lab23 --as=system:serviceaccount:lab23:deployer<\/code> trả về yes; với <code>delete pods<\/code> trả về no.<\/p>"], ["Câu 2 · ClusterRole cho group", "<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i list nodes --as=someone --as-group=ops-team<\/code>.<\/p>"], ["Câu 3 · Log của Pod là subresource", "<p><strong>Khung:<\/strong> quyền đọc log là resource <code>pods/log<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i get pods/log -n lab23 --as=jane<\/code>.<\/p>"], ["Câu 4 · ClusterRole dùng trong một namespace", "<p><strong>Khung:<\/strong> RoleBinding (không phải ClusterRoleBinding) + <code>--clusterrole=view<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>can-i list pods -n lab23<\/code> trả về yes; <code>-n default<\/code> trả về no.<\/p>"], ["Câu 5 · Tìm binding thừa", "<p><strong>Khung:<\/strong> liệt kê <code>rolebinding,clusterrolebinding -A -o wide<\/code> rồi <code>grep<\/code> tên ServiceAccount. Cột SERVICEACCOUNTS cho biết binding gắn cho ai.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl auth can-i delete secrets -n lab23 --as=system:serviceaccount:lab23:legacy-bot<\/code> trả về no.<\/p>"]]}, {"id": 24, "slug": "users-csr-kubeconfig", "dir": "24-users-csr-kubeconfig", "title": "User mới bằng chứng chỉ, CSR và kubeconfig", "level": 6, "env": "any", "minutes": 35, "comps": ["arch:0"], "goal": "<p>Cấp quyền truy cập cho một lập trình viên từ đầu: tạo khóa và CSR, để cluster ký chứng chỉ, dựng kubeconfig riêng, phân quyền theo group, và thử đăng nhập.<\/p>", "concepts": "<ul>\n<li>Kubernetes không có object User. Với chứng chỉ client: <strong>CN<\/strong> là tên user, <strong>O<\/strong> là group.<\/li>\n<li>CertificateSigningRequest với <code>signerName: kubernetes.io/kube-apiserver-client<\/code> và <code>usages: [client auth]<\/code>; admin chạy <code>kubectl certificate approve<\/code>, chứng chỉ nằm ở <code>.status.certificate<\/code>.<\/li>\n<li>kubeconfig gồm <code>clusters<\/code> (server + CA), <code>users<\/code> (cert + key), <code>contexts<\/code> (ghép hai cái trên). <code>--embed-certs<\/code> nhúng nội dung vào file thay vì trỏ đường dẫn.<\/li>\n<li>Phân quyền cho <strong>group<\/strong> tiện hơn từng user: thêm người chỉ cần cấp cert có <code>O=&lt;group&gt;<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo khóa RSA 2048 và CSR cho user <code>dev1<\/code> thuộc group <code>developers<\/code>, lưu tại <code>~/cka-answers/dev1.key<\/code> và <code>~/cka-answers/dev1.csr<\/code>.<\/p>", "<p>Gửi CertificateSigningRequest tên <code>dev1<\/code> (signer client của API server, hạn 1 ngày), duyệt nó, và lưu chứng chỉ vào <code>~/cka-answers/dev1.crt<\/code>.<\/p>", "<p>Tạo file kubeconfig <strong>riêng<\/strong> <code>~/cka-answers/dev1.kubeconfig<\/code> (không sửa <code>~/.kube/config<\/code>) có cluster giống cluster hiện tại, user <code>dev1<\/code> với cert nhúng sẵn, context <code>dev1@lab<\/code> dùng namespace <code>lab24<\/code>, và đặt nó là context hiện tại trong file đó.<\/p>", "<p>Group <code>developers<\/code> được <code>get, list, watch, create, delete<\/code> Pod và Deployment trong <code>lab24<\/code>, không gì khác.<\/p>", "<p>Kiểm tra: dùng <code>--kubeconfig ~/cka-answers/dev1.kubeconfig<\/code>, tạo được Deployment <code>hello<\/code> (<code>nginx:1.27<\/code>) trong <code>lab24<\/code> nhưng <strong>không<\/strong> xem được node.<\/p>"], "hints": [["Tạo CSR với group", "<p><code>openssl req -new -key dev1.key -subj \"/CN=dev1/O=developers\" -out dev1.csr<\/code><\/p>"], ["Lấy server và CA của cluster hiện tại", "<p><code>kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}'<\/code> và <code>…certificate-authority-data<\/code> (base64)<\/p>"]], "solution": "<pre><code class=\"language-bash\">cd ~/cka-answers\nopenssl genrsa -out dev1.key 2048\nopenssl req -new -key dev1.key -subj &quot;/CN=dev1/O=developers&quot; -out dev1.csr\ncat &lt;&lt;EOF | kubectl apply -f -\napiVersion: certificates.k8s.io/v1\nkind: CertificateSigningRequest\nmetadata: {name: dev1}\nspec:\n  request: $(base64 -w0 &lt; dev1.csr)\n  signerName: kubernetes.io/kube-apiserver-client\n  expirationSeconds: 86400\n  usages: [client auth]\nEOF\nkubectl certificate approve dev1\nkubectl get csr dev1 -o jsonpath='{.status.certificate}' | base64 -d &gt; dev1.crt\n\nSERVER=$(kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.server}')\nkubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d &gt; ca.crt\nK=&quot;--kubeconfig=dev1.kubeconfig&quot;\nkubectl config set-cluster lab $K --server=&quot;$SERVER&quot; --certificate-authority=ca.crt --embed-certs\nkubectl config set-credentials dev1 $K --client-certificate=dev1.crt --client-key=dev1.key --embed-certs\nkubectl config set-context dev1@lab $K --cluster=lab --user=dev1 --namespace=lab24\nkubectl config use-context dev1@lab $K\n\nkubectl create role dev -n lab24 --verb=get,list,watch,create,delete --resource=pods,deployments\nkubectl create rolebinding developers -n lab24 --role=dev --group=developers\n\nkubectl $K create deploy hello --image=nginx:1.27\nkubectl $K get nodes        # Forbidden\n<\/code><\/pre>", "docs": [["Certificates and certificate signing requests", "https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/"], ["Configure access to multiple clusters", "https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/"]], "support": "scaffold", "prereq": [23], "guide": [["Kubernetes nhận diện user thế nào", "<p>Kubernetes không có object User. Với chứng chỉ client, <strong>CN<\/strong> là tên user và <strong>O<\/strong> là group. Chứng chỉ phải do CA của cluster ký: CertificateSigningRequest là cách xin chữ ký đó qua API.<\/p>"], ["Câu 1 · Khóa và CSR", "<p><strong>Khung:<\/strong> <code>openssl genrsa -out … 2048<\/code>, rồi <code>openssl req -new -key … -subj \"/CN=&lt;user&gt;/O=&lt;group&gt;\" -out …<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>openssl req -in dev1.csr -noout -subject<\/code>.<\/p>"], ["Câu 2 · CertificateSigningRequest", "<p><strong>Tra:<\/strong> trang <em>Certificates and Certificate Signing Requests<\/em>, mục <em>Normal user<\/em>, có YAML đầy đủ (signerName, usages, expirationSeconds). Trường <code>request<\/code> là file CSR mã hóa base64 trên <strong>một dòng<\/strong> (<code>base64 -w0<\/code>).<\/p>\n<p><strong>Khung:<\/strong> apply, <code>kubectl certificate approve<\/code>, rồi lấy <code>status.certificate<\/code> và giải mã base64.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>openssl x509 -in dev1.crt -noout -subject -enddate<\/code>.<\/p>"], ["Câu 3 · kubeconfig riêng", "<p><strong>Khung:<\/strong> bốn lệnh <code>kubectl config set-cluster | set-credentials | set-context | use-context<\/code>, mỗi lệnh có <code>--kubeconfig=&lt;file&gt;<\/code>, và <code>--embed-certs<\/code> để nhúng nội dung thay vì đường dẫn. Server và CA lấy từ <code>kubectl config view --minify --raw<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> quên <code>--kubeconfig<\/code> thì bạn đã sửa vào <code>~/.kube/config<\/code>.<\/p>"], ["Câu 4 · Quyền cho group", "<p><strong>Khung:<\/strong> Role + RoleBinding với <code>--group<\/code>.<\/p>"], ["Câu 5 · Tự kiểm bằng chính kubeconfig mới", "<p><strong>Tự kiểm:<\/strong> <code>kubectl --kubeconfig ~/cka-answers/dev1.kubeconfig auth whoami<\/code>, rồi <code>create deploy<\/code>, rồi <code>get nodes<\/code> (phải Forbidden).<\/p>"]]}, {"id": 25, "slug": "security-context-psa", "dir": "25-security-context-psa", "title": "securityContext và Pod Security Admission", "level": 6, "env": "any", "minutes": 30, "comps": ["work:4", "arch:0"], "goal": "<p>Bắt một namespace tuân thủ chuẩn bảo mật <code>restricted<\/code>, sửa workload cũ cho đạt chuẩn, và chạy container với filesystem chỉ đọc.<\/p>", "concepts": "<ul>\n<li>Pod Security Admission bật bằng <strong>label namespace<\/strong>: <code>pod-security.kubernetes.io/&lt;enforce|audit|warn&gt;=&lt;privileged|baseline|restricted&gt;<\/code>. <code>enforce<\/code> từ chối Pod mới; Pod đang chạy <strong>không<\/strong> bị đuổi.<\/li>\n<li>Chuẩn <code>restricted<\/code> đòi: <code>runAsNonRoot: true<\/code>, <code>allowPrivilegeEscalation: false<\/code>, <code>capabilities.drop: [ALL]<\/code>, <code>seccompProfile.type: RuntimeDefault<\/code> (hoặc <code>Localhost<\/code>), không hostPath/hostNetwork/privileged.<\/li>\n<li>Với Deployment, Pod bị từ chối không xuất hiện: lỗi nằm ở event <code>FailedCreate<\/code> của ReplicaSet.<\/li>\n<li><code>readOnlyRootFilesystem: true<\/code> chặn ghi vào filesystem của image; chỗ cần ghi thì gắn <code>emptyDir<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Bật cho namespace <code>lab25<\/code> chế độ <code>enforce<\/code> và <code>warn<\/code> ở mức <code>restricted<\/code>.<\/p>", "<p>Deployment <code>api<\/code> trong <code>lab25<\/code> đang chạy với root. Sau khi bật enforce, nó không tạo được Pod mới. Sửa <code>api<\/code> đạt chuẩn <code>restricted<\/code>, chạy với UID <code>1000<\/code>, rồi rollout lại để Pod mới được tạo.<\/p>", "<p>Tạo Pod <code>secure<\/code> (<code>busybox:1.36<\/code>, <code>sleep 3600<\/code>) đạt chuẩn <code>restricted<\/code>, root filesystem <strong>chỉ đọc<\/strong>, và ghi được vào <code>/tmp<\/code> nhờ một emptyDir.<\/p>"], "hints": [["Xem vì sao Pod bị từ chối", "<p><code>kubectl rollout restart deploy api -n lab25<\/code> rồi <code>kubectl describe rs -n lab25 -l app=api | grep -A2 FailedCreate<\/code><\/p>"], ["Thử nhanh với dry-run phía server", "<p><code>kubectl apply -f pod.yaml --dry-run=server<\/code> báo ngay vi phạm PSA mà không tạo gì.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl label ns lab25 pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted\nkubectl edit deploy api -n lab25\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">    spec:\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 1000\n        seccompProfile: {type: RuntimeDefault}\n      containers:\n      - name: busybox\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        securityContext:\n          allowPrivilegeEscalation: false\n          capabilities: {drop: [&quot;ALL&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: secure, namespace: lab25}\nspec:\n  securityContext:\n    runAsNonRoot: true\n    runAsUser: 1000\n    seccompProfile: {type: RuntimeDefault}\n  containers:\n  - name: c\n    image: busybox:1.36\n    command: [&quot;sleep&quot;, &quot;3600&quot;]\n    securityContext:\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true\n      capabilities: {drop: [&quot;ALL&quot;]}\n    volumeMounts: [{name: tmp, mountPath: /tmp}]\n  volumes:\n  - {name: tmp, emptyDir: {}}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl exec secure -n lab25 -- touch /x        # Read-only file system\nkubectl exec secure -n lab25 -- touch /tmp/x    # được\n<\/code><\/pre>", "docs": [["Pod Security Standards", "https://kubernetes.io/docs/concepts/security/pod-security-standards/"], ["Pod Security Admission", "https://kubernetes.io/docs/concepts/security/pod-security-admission/"], ["Configure a Security Context", "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"]], "support": "scaffold", "prereq": [7, 23], "guide": [["Câu 1 · Bật Pod Security Admission", "<p>PSA đọc label của namespace: <code>pod-security.kubernetes.io/&lt;mode&gt;=&lt;level&gt;<\/code>. Có ba mode:<\/p>\n<ul>\n<li><code>enforce<\/code>: từ chối Pod vi phạm.<\/li>\n<li><code>warn<\/code>: in cảnh báo.<\/li>\n<li><code>audit<\/code>: ghi vào audit log.<\/li>\n<\/ul>\n<p><strong>Tra:<\/strong> trang <em>Enforce Pod Security Standards with Namespace Labels<\/em>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get ns lab25 --show-labels<\/code>.<\/p>"], ["Câu 2 · Đưa Deployment đạt chuẩn restricted", "<p>Enforce chỉ chặn Pod <strong>mới<\/strong>. Pod đang chạy không bị đuổi, nên Deployment trông vẫn ổn cho tới lần rollout kế tiếp.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl rollout restart deploy api -n lab25<\/code>, rồi xem lý do bị từ chối ở <code>kubectl describe rs -n lab25<\/code> hoặc <code>kubectl get events -n lab25<\/code>. Thông báo liệt kê <strong>từng<\/strong> trường còn thiếu.<\/p>\n<p><strong>Tra:<\/strong> trang <em>Pod Security Standards<\/em>, bảng mức <em>Restricted<\/em>. Bốn trường gần như luôn cần là <code>runAsNonRoot<\/code>, <code>seccompProfile<\/code>, <code>allowPrivilegeEscalation: false<\/code>, <code>capabilities.drop: [ALL]<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> thử nhanh mà không tạo gì: <code>kubectl apply -f api.yaml --dry-run=server<\/code>. Server áp dụng PSA và in cảnh báo nếu còn thiếu.<\/p>"], ["Câu 3 · Root filesystem chỉ đọc", "<p><strong>Khung:<\/strong> <code>securityContext.readOnlyRootFilesystem: true<\/code> ở cấp container, và một emptyDir gắn vào <code>/tmp<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl exec secure -n lab25 -- touch /x<\/code> phải lỗi; <code>touch /tmp/x<\/code> phải được.<\/p>\n<p><strong>Bẫy:<\/strong> có trường chỉ đặt được ở cấp <strong>Pod<\/strong> (<code>fsGroup<\/code>), có trường chỉ đặt được ở cấp <strong>container<\/strong> (<code>capabilities<\/code>, <code>readOnlyRootFilesystem<\/code>). Xem bằng <code>kubectl explain pod.spec.securityContext<\/code> và <code>kubectl explain pod.spec.containers.securityContext<\/code>.<\/p>"]]}, {"id": 26, "slug": "helm", "dir": "26-helm", "title": "Helm từ chart đến rollback", "level": 7, "env": "any", "minutes": 35, "comps": ["arch:5"], "goal": "<p>Dùng Helm như trong công việc thật: tạo chart, cài release với values, nâng cấp giữ values cũ, quay lại revision tốt, render YAML để kiểm tra trước, và gỡ release.<\/p>", "concepts": "<ul>\n<li><strong>Chart<\/strong> là gói template + <code>values.yaml<\/code>; <strong>release<\/strong> là một lần cài chart vào cluster; mỗi lần <code>upgrade<\/code> hoặc <code>rollback<\/code> tạo một <strong>revision<\/strong> mới (lưu dạng Secret trong namespace của release).<\/li>\n<li><code>--set<\/code> và <code>-f values.yaml<\/code> ghi đè giá trị. <code>helm upgrade<\/code> <strong>không<\/strong> giữ <code>--set<\/code> cũ trừ khi thêm <code>--reuse-values<\/code>.<\/li>\n<li><code>helm template<\/code> render YAML ở máy, không cần cluster. <code>helm get values<\/code>, <code>helm history<\/code>, <code>helm rollback &lt;release&gt; &lt;revision&gt;<\/code>.<\/li>\n<li>Chart từ repo: <code>helm repo add<\/code>, <code>helm search repo<\/code>, <code>helm install … --version<\/code>. Chart từ OCI registry: <code>helm install x oci://…<\/code>.<\/li>\n<\/ul>", "setup_note": "<p>Cần Helm v3 trên máy chạy lab (<code>helm version<\/code>). Lab dùng chart tạo tại chỗ bằng <code>helm create<\/code>, không cần internet.<\/p>", "tasks": ["<p>Tạo chart <code>webapp<\/code> trong <code>~/cka-answers/lab26/<\/code> bằng <code>helm create<\/code>.<\/p>", "<p>Cài release <code>web<\/code> từ chart đó vào namespace <code>lab26<\/code> với 2 replica và image <code>nginx:1.27<\/code> (chart mặc định dùng repository <code>nginx<\/code>, chỉ cần đặt tag).<\/p>", "<p>Nâng cấp <code>web<\/code> để Service thành <code>NodePort<\/code>, <strong>giữ<\/strong> các giá trị đã đặt trước đó.<\/p>", "<p>Nâng cấp tiếp với image tag <code>1.99<\/code> (không tồn tại), thấy Pod lỗi, rồi rollback về revision có NodePort và <code>nginx:1.27<\/code>.<\/p>", "<p>Không cài, chỉ render chart với release tên <code>preview<\/code> và 3 replica, lưu vào <code>~/cka-answers/26-rendered.yaml<\/code>.<\/p>", "<p>Cài thử release <code>tmp<\/code> vào <code>lab26<\/code> rồi gỡ nó.<\/p>"], "hints": [["Đặt nhiều giá trị", "<p><code>--set replicaCount=2,image.tag=1.27<\/code><\/p>"], ["Xem revision", "<p><code>helm history web -n lab26<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">mkdir -p ~/cka-answers/lab26 &amp;&amp; cd ~/cka-answers/lab26\nhelm create webapp\nhelm install web ./webapp -n lab26 --set replicaCount=2,image.tag=1.27\nhelm upgrade web ./webapp -n lab26 --reuse-values --set service.type=NodePort\nhelm upgrade web ./webapp -n lab26 --reuse-values --set image.tag=1.99\nkubectl get pods -n lab26                       # ImagePullBackOff\nhelm history web -n lab26\nhelm rollback web 2 -n lab26\nhelm template preview ./webapp --set replicaCount=3 &gt; ~/cka-answers/26-rendered.yaml\nhelm install tmp ./webapp -n lab26\nhelm uninstall tmp -n lab26\nhelm list -n lab26\n<\/code><\/pre>", "docs": [["Helm quickstart", "https://helm.sh/docs/intro/quickstart/"], ["helm upgrade", "https://helm.sh/docs/helm/helm_upgrade/"]], "support": "solo", "prereq": [5], "guide": [["Quy trình", "<ol>\n<li>Đọc <code>values.yaml<\/code> của chart trước khi đặt giá trị: <code>helm show values &lt;chart&gt;<\/code> cho biết tên khóa chính xác (<code>replicaCount<\/code>, <code>image.tag<\/code>, <code>service.type<\/code>).<\/li>\n<li>Mọi lệnh thay đổi đều có <code>-n &lt;ns&gt;<\/code>. Quên namespace là lỗi phổ biến nhất với Helm.<\/li>\n<li>Sau mỗi lần <code>install<\/code>/<code>upgrade<\/code>, kiểm tra bằng <code>helm list -n …<\/code>, <code>helm get values …<\/code> và <code>kubectl get<\/code> các object thật.<\/li>\n<\/ol>"], ["Tự tra cứu", "<p><code>helm &lt;lệnh&gt; --help<\/code> có ví dụ cho mọi tình huống của bài. Hãy chú ý các cờ:<\/p>\n<ul>\n<li>giữ giá trị cũ khi nâng cấp;<\/li>\n<li>chọn revision để quay lại;<\/li>\n<li>render mà không cài.<\/li>\n<\/ul>"], ["Kiểm chứng", "<ul>\n<li><code>helm history web -n lab26<\/code> thể hiện đúng câu chuyện: install → NodePort → 1.99 → rollback.<\/li>\n<li><code>helm get values web -n lab26<\/code> của revision cuối có đủ replica, tag và loại Service.<\/li>\n<\/ul>"]]}, {"id": 27, "slug": "kustomize", "dir": "27-kustomize", "title": "Kustomize với base và overlay", "level": 7, "env": "any", "minutes": 30, "comps": ["arch:5"], "goal": "<p>Tùy biến bộ manifest cho từng môi trường mà không sửa file gốc: overlay đổi namespace, tiền tố tên, label, số replica, image, cấu hình sinh tự động và patch.<\/p>", "concepts": "<ul>\n<li><code>kustomization.yaml<\/code> liệt kê <code>resources<\/code> rồi biến đổi: <code>namespace<\/code>, <code>namePrefix<\/code>, <code>labels<\/code>, <code>images<\/code>, <code>replicas<\/code>, <code>patches<\/code>.<\/li>\n<li><code>configMapGenerator<\/code> sinh ConfigMap có <strong>hậu tố hash<\/strong> theo nội dung, và tự sửa mọi chỗ tham chiếu. Đổi cấu hình là đổi tên ConfigMap, nên Deployment tự rollout. Trong overlay dùng <code>behavior: merge<\/code> để ghi đè key của base.<\/li>\n<li><code>kubectl kustomize &lt;dir&gt;<\/code> xem kết quả; <code>kubectl apply -k &lt;dir&gt;<\/code> áp dụng. kubectl có sẵn Kustomize, không cần cài thêm.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Base có sẵn ở <code>~/cka-answers/lab27/base<\/code> (Deployment <code>web<\/code>, Service <code>web<\/code>, ConfigMap <code>app-config<\/code> sinh bằng generator). Đọc nó.<\/p>", "<p>Tạo overlay <code>~/cka-answers/lab27/overlays/prod<\/code> dùng base đó, với: namespace <code>lab27<\/code>; tiền tố tên <code>prod-<\/code>; label <code>env=prod<\/code> gắn cả vào selector; 3 replica; image <code>nginx:1.28<\/code>; <code>MODE=prod<\/code> thay cho <code>MODE=dev<\/code>; container <code>web<\/code> có request <code>cpu: 100m<\/code>.<\/p>", "<p>Lưu kết quả render của overlay vào <code>~/cka-answers/27-rendered.yaml<\/code>, rồi áp dụng overlay vào cluster.<\/p>"], "hints": [["Ghi đè ConfigMap của base", "<pre><code class=\"language-yaml\">configMapGenerator:\n- name: app-config\n  behavior: merge\n  literals: [MODE=prod]\n<\/code><\/pre>"], ["Patch resources", "<p>File <code>resources.yaml<\/code> dạng strategic merge (Deployment tên <code>web<\/code>, container <code>web<\/code>) rồi <code>patches: [{path: resources.yaml}]<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\"># ~/cka-answers/lab27/overlays/prod/kustomization.yaml\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../../base]\nnamespace: lab27\nnamePrefix: prod-\nlabels:\n- pairs: {env: prod}\n  includeSelectors: true\nreplicas:\n- {name: web, count: 3}\nimages:\n- {name: nginx, newTag: &quot;1.28&quot;}\nconfigMapGenerator:\n- name: app-config\n  behavior: merge\n  literals: [MODE=prod]\npatches:\n- path: resources.yaml\n---\n# ~/cka-answers/lab27/overlays/prod/resources.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web}\nspec:\n  template:\n    spec:\n      containers:\n      - name: web\n        resources:\n          requests: {cpu: 100m}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl kustomize ~/cka-answers/lab27/overlays/prod &gt; ~/cka-answers/27-rendered.yaml\nkubectl apply -k ~/cka-answers/lab27/overlays/prod\nkubectl get deploy,svc,cm -n lab27\n<\/code><\/pre>", "docs": [["Declarative management with Kustomize", "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/"], ["Kustomize reference", "https://kubectl.docs.kubernetes.io/references/kustomize/kustomization/"]], "support": "solo", "prereq": [6, 26], "guide": [["Quy trình", "<ol>\n<li>Đọc base: <code>kustomization.yaml<\/code> liệt kê resource và generator gì. Render thử <code>kubectl kustomize &lt;base&gt;<\/code> để biết tên object thực tế.<\/li>\n<li>Mỗi yêu cầu của đề ứng với một trường trong <code>kustomization.yaml<\/code> của overlay. Lập bảng trước: namespace, tiền tố tên, label (có gắn vào selector không), số replica, image, ConfigMap, patch.<\/li>\n<li>Render overlay sau <strong>mỗi<\/strong> thay đổi và đọc kết quả, chưa apply vội.<\/li>\n<\/ol>"], ["Tự tra cứu", "<ul>\n<li>Trang <em>Declarative Management of Kubernetes Objects Using Kustomize<\/em> liệt kê các trường và ví dụ.<\/li>\n<li><code>kubectl explain<\/code> không áp dụng cho kustomization. Khi cần, dùng tài liệu tham chiếu của kustomize trên kubectl.docs.kubernetes.io.<\/li>\n<\/ul>"], ["Kiểm chứng", "<ul>\n<li>Trong file render: tên có tiền tố, selector có <code>env=prod<\/code>, ConfigMap có hậu tố hash và Deployment tham chiếu đúng tên mới đó.<\/li>\n<li><code>kubectl apply -k &lt;overlay&gt;<\/code>, rồi <code>kubectl get all,cm -n lab27<\/code>.<\/li>\n<\/ul>"]]}, {"id": 28, "slug": "crd-operator", "dir": "28-crd-operator", "title": "CustomResourceDefinition và Operator", "level": 7, "env": "any", "minutes": 30, "comps": ["arch:7", "arch:6"], "goal": "<p>Mở rộng Kubernetes API bằng loại object của riêng bạn, có kiểm tra dữ liệu, tên viết tắt và cột hiển thị; hiểu Operator dùng CRD thế nào.<\/p>", "concepts": "<ul>\n<li>CRD khai báo <code>group<\/code>, <code>names<\/code> (<code>kind<\/code>, <code>plural<\/code>, <code>singular<\/code>, <code>shortNames<\/code>), <code>scope<\/code> (<code>Namespaced<\/code> hoặc <code>Cluster<\/code>), và các <code>versions<\/code> (một version là <code>storage: true<\/code>).<\/li>\n<li><code>openAPIV3Schema<\/code> kiểm tra dữ liệu ngay khi tạo: kiểu, <code>required<\/code>, <code>minimum<\/code>/<code>maximum<\/code>, <code>enum<\/code>. Object sai bị API từ chối.<\/li>\n<li><code>additionalPrinterColumns<\/code> thêm cột cho <code>kubectl get<\/code>.<\/li>\n<li><strong>Operator<\/strong> = CRD + controller theo dõi các object đó và vận hành phần mềm thay con người (cert-manager, Prometheus Operator, CloudNativePG…). Cài thường bằng Helm hoặc manifest.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo CRD <code>backups.ops.example.com<\/code>: kind <code>Backup<\/code>, namespaced, tên ngắn <code>bk<\/code>, version <code>v1<\/code>. Schema: <code>spec.schedule<\/code> (string, <strong>bắt buộc<\/strong>), <code>spec.retention<\/code> (integer từ 1 tới 30). Thêm hai cột <code>Schedule<\/code> và <code>Retention<\/code> cho <code>kubectl get<\/code>.<\/p>", "<p>Trong <code>lab28<\/code>, tạo Backup <code>nightly<\/code> với schedule <code>0 2 * * *<\/code>, retention <code>7<\/code>.<\/p>", "<p>Thử tạo Backup <code>bad<\/code> với retention <code>100<\/code>. API phải từ chối; không được có object <code>bad<\/code>.<\/p>", "<p>Ghi các tên ngắn của resource thuộc group <code>ops.example.com<\/code> (theo <code>kubectl api-resources<\/code>) vào <code>~/cka-answers/28-short.txt<\/code>.<\/p>"], "hints": [["Khung CRD", "<p>Xem ví dụ trong tài liệu \"Extend the Kubernetes API with CustomResourceDefinitions\" rồi sửa tên. <code>kubectl explain backup.spec<\/code> chạy được khi schema đúng.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata: {name: backups.ops.example.com}\nspec:\n  group: ops.example.com\n  scope: Namespaced\n  names: {kind: Backup, plural: backups, singular: backup, shortNames: [bk]}\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n        type: object\n        properties:\n          spec:\n            type: object\n            required: [schedule]\n            properties:\n              schedule: {type: string}\n              retention: {type: integer, minimum: 1, maximum: 30}\n    additionalPrinterColumns:\n    - {name: Schedule, type: string, jsonPath: .spec.schedule}\n    - {name: Retention, type: integer, jsonPath: .spec.retention}\n---\napiVersion: ops.example.com/v1\nkind: Backup\nmetadata: {name: nightly, namespace: lab28}\nspec: {schedule: &quot;0 2 * * *&quot;, retention: 7}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get bk -n lab28                # có cột SCHEDULE, RETENTION\nkubectl explain backup.spec\n# bad: The Backup &quot;bad&quot; is invalid: spec.retention: Invalid value: 100: must be less than or equal to 30\nkubectl api-resources --api-group=ops.example.com\necho bk &gt; ~/cka-answers/28-short.txt\n<\/code><\/pre>", "docs": [["Custom resources", "https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/"], ["Extend the API with CRDs", "https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/"], ["Operator pattern", "https://kubernetes.io/docs/concepts/extend-kubernetes/operator/"]], "support": "solo", "prereq": [4], "guide": [["Quy trình", "<ol>\n<li>Chép CRD mẫu từ trang <em>Extend the Kubernetes API with CustomResourceDefinitions<\/em>, rồi sửa từng phần: <code>group<\/code>, <code>names<\/code> (plural, singular, kind, shortNames), <code>scope<\/code>, <code>versions[]<\/code>.<\/li>\n<li>Schema OpenAPI nằm ở <code>versions[].schema.openAPIV3Schema<\/code>. Ràng buộc bắt buộc (<code>required<\/code>) và khoảng giá trị (<code>minimum<\/code>/<code>maximum<\/code>) viết ở đây.<\/li>\n<li>Cột hiển thị là <code>versions[].additionalPrinterColumns<\/code> với <code>jsonPath<\/code>.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>kubectl get crd backups.ops.example.com<\/code>, rồi <code>kubectl api-resources --api-group=ops.example.com<\/code>.<\/li>\n<li>Tạo một object hợp lệ và một object sai: API phải trả lỗi validation <strong>ngay lúc tạo<\/strong>.<\/li>\n<li><code>kubectl get bk -n lab28<\/code> có cột Schedule và Retention.<\/li>\n<\/ul>"], ["Liên hệ thực tế", "<p>Operator = CRD + controller theo dõi object đó. Khi cài operator (cert-manager, Prometheus Operator…), bạn sẽ thấy CRD của nó trong <code>kubectl get crd<\/code>.<\/p>"]]}, {"id": 29, "slug": "etcd-backup-restore", "dir": "29-etcd-backup-restore", "title": "Sao lưu và khôi phục etcd", "level": 7, "env": "kind", "minutes": 40, "comps": ["arch:3", "arch:2"], "goal": "<p>Chụp snapshot etcd đúng cách, và khôi phục cluster về thời điểm chụp khi dữ liệu bị thay đổi sau đó.<\/p>", "concepts": "<ul>\n<li>etcd bật TLS hai chiều: <code>etcdctl<\/code> cần <code>--endpoints<\/code>, <code>--cacert<\/code>, <code>--cert<\/code>, <code>--key<\/code>. Lấy đường dẫn từ <code>/etc/kubernetes/manifests/etcd.yaml<\/code>.<\/li>\n<li><code>etcdctl snapshot save<\/code> chụp; <code>etcdutl snapshot status<\/code> kiểm tra; <code>etcdutl snapshot restore --data-dir &lt;thư mục mới&gt;<\/code> khôi phục ra thư mục <strong>mới<\/strong>.<\/li>\n<li>Sau khi restore, sửa <code>hostPath<\/code> của volume <code>etcd-data<\/code> trong <code>etcd.yaml<\/code> trỏ sang thư mục mới. kubelet tự tạo lại Pod etcd; API server có thể mất 1–2 phút để trở lại.<\/li>\n<li>Restore đưa <strong>toàn bộ<\/strong> cluster về thời điểm chụp: object tạo sau đó biến mất.<\/li>\n<\/ul>", "setup_note": "<p>Setup cài <code>etcdctl<\/code> và <code>etcdutl<\/code> v3.6.16 vào node control plane nếu chưa có (tải từ GitHub), và tạo namespace <code>lab29-before<\/code>.<\/p>", "tasks": ["<p>Vào node control plane (<code>./lab ssh $CP<\/code>). Ghi giá trị <code>--data-dir<\/code> của etcd vào <code>/root/29-datadir.txt<\/code> trên node.<\/p>", "<p>Chụp snapshot etcd vào <code>/opt/etcd-backup.db<\/code> trên node control plane và kiểm tra nó bằng <code>etcdutl snapshot status<\/code>.<\/p>", "<p><strong>Sau<\/strong> khi chụp, tạo namespace <code>lab29-after<\/code> (giả lập thay đổi xảy ra sau lần sao lưu).<\/p>", "<p>Khôi phục snapshot ra <code>/var/lib/etcd-restore<\/code> và cho etcd chạy trên dữ liệu đó. Kết quả: <code>lab29-before<\/code> còn, <code>lab29-after<\/code> không còn.<\/p>"], "hints": [["Biến cho đỡ gõ", "<p><code>export ETCDCTL_API=3; E=\"--endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key\"<\/code><\/p>"], ["API server không trả lời sau khi sửa etcd.yaml?", "<p>Chờ 1–2 phút; xem <code>crictl ps -a | grep -E 'etcd|apiserver'<\/code> và <code>crictl logs &lt;id&gt;<\/code> trên node.<\/p>"]], "solution": "<pre><code class=\"language-bash\">./lab ssh $CP\ngrep data-dir /etc/kubernetes/manifests/etcd.yaml | cut -d= -f2 &gt; /root/29-datadir.txt   # /var/lib/etcd\nE=&quot;--endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key&quot;\netcdctl $E snapshot save /opt/etcd-backup.db\netcdutl snapshot status /opt/etcd-backup.db -w table\nexit\n\nkubectl create ns lab29-after\n\n./lab ssh $CP\netcdutl snapshot restore /opt/etcd-backup.db --data-dir /var/lib/etcd-restore\nvi /etc/kubernetes/manifests/etcd.yaml\n#   volumes:\n#   - hostPath: {path: /var/lib/etcd-restore, type: DirectoryOrCreate}\n#     name: etcd-data\n# (chỉ cần đổi hostPath; --data-dir trong container vẫn là /var/lib/etcd)\nwatch crictl ps      # chờ etcd và kube-apiserver chạy lại\nexit\nkubectl get ns | grep lab29        # chỉ còn lab29-before\n<\/code><\/pre>", "docs": [["Operating etcd clusters for Kubernetes", "https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/"], ["etcd disaster recovery", "https://etcd.io/docs/v3.6/op-guide/recovery/"]], "support": "solo", "prereq": [14], "guide": [["Quy trình", "<ol>\n<li><strong>Thu thập trước khi gõ lệnh.<\/strong> Mọi tham số kết nối etcd (endpoint, cacert, cert, key, data-dir) đều có trong <code>/etc/kubernetes/manifests/etcd.yaml<\/code>. Đọc file đó, đặt biến shell, đừng gõ đường dẫn từ trí nhớ.<\/li>\n<li><strong>Snapshot<\/strong> bằng <code>etcdctl snapshot save<\/code> (cần TLS), <strong>kiểm tra<\/strong> bằng <code>etcdutl snapshot status<\/code>.<\/li>\n<li><strong>Restore<\/strong> bằng <code>etcdutl snapshot restore<\/code> ra thư mục <strong>mới<\/strong>. Không ghi đè thư mục đang chạy.<\/li>\n<li><strong>Trỏ etcd sang dữ liệu mới<\/strong>: sửa static pod manifest ở <strong>mọi<\/strong> chỗ nhắc tới data dir cũ.<\/li>\n<li><strong>Chờ<\/strong>: kubelet tạo lại etcd và API server. Trong 1–2 phút kubectl sẽ báo lỗi kết nối, đó là bình thường.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>crictl ps | grep -E 'etcd|apiserver'<\/code> trên node thấy container mới.<\/li>\n<li><code>kubectl get ns<\/code> có <code>lab29-before<\/code>, không có <code>lab29-after<\/code>.<\/li>\n<\/ul>"], ["Bẫy", "<p>Một manifest có hai chỗ dùng data dir: cờ <code>--data-dir<\/code> và <code>hostPath<\/code> của volume. Sửa thiếu một chỗ là etcd không lên, hoặc lên nhưng dùng dữ liệu cũ.<\/p>"]]}, {"id": 30, "slug": "kubeadm-upgrade", "dir": "30-kubeadm-upgrade", "title": "Nâng cấp cluster kubeadm 1.34 → 1.35", "level": 7, "env": "vm", "minutes": 60, "comps": ["arch:3", "arch:2"], "goal": "<p>Nâng một cluster đang chạy lên minor mới mà không làm gián đoạn ứng dụng: control plane trước, từng worker sau, đúng thứ tự drain và uncordon.<\/p>", "concepts": "<ul>\n<li>Mỗi lần chỉ nâng <strong>một<\/strong> minor. Thứ tự: <code>kubeadm<\/code> trên control plane → <code>kubeadm upgrade plan<\/code> → <code>kubeadm upgrade apply<\/code> → drain → nâng <code>kubelet<\/code> và <code>kubectl<\/code> → restart kubelet → uncordon. Control plane thứ hai trở đi và worker dùng <code>kubeadm upgrade node<\/code>.<\/li>\n<li>Version skew: kubelet được cũ hơn API server tối đa 3 minor, không bao giờ mới hơn. kubectl lệch ±1 minor.<\/li>\n<li>Gói bị <code>apt-mark hold<\/code> để không vô tình nâng; phải <code>unhold<\/code> trước khi cài phiên bản mới. Repo <code>pkgs.k8s.io<\/code> chia theo minor: đổi <code>/v1.34/<\/code> thành <code>/v1.35/<\/code>.<\/li>\n<li><code>kubeadm upgrade apply<\/code> tự gia hạn chứng chỉ control plane.<\/li>\n<\/ul>", "setup_note": "<p>Cần cluster từ lab 01 (Kubernetes v1.34). Chạy lab từ <code>cp-1<\/code>.<\/p>", "tasks": ["<p>Ghi phiên bản đích mà <code>kubeadm upgrade plan<\/code> đề xuất (sau khi nâng kubeadm) vào <code>~/cka-answers/30-target.txt<\/code>.<\/p>", "<p>Nâng control plane <code>cp-1<\/code> lên v1.35 (kubeadm, control plane, kubelet, kubectl).<\/p>", "<p>Nâng lần lượt <code>worker-1<\/code> rồi <code>worker-2<\/code>, mỗi node phải được drain trước và uncordon sau.<\/p>", "<p>Mọi node <code>Ready<\/code>, kubelet v1.35.x, không node nào còn <code>SchedulingDisabled<\/code>.<\/p>"], "hints": [["Xem phiên bản có trong repo", "<p><code>apt-cache madison kubeadm | head<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\"># cp-1\nsudo sed -i 's#/v1.34/#/v1.35/#' /etc/apt/sources.list.d/kubernetes.list\nsudo apt-get update &amp;&amp; apt-cache madison kubeadm | head -3\nsudo apt-mark unhold kubeadm &amp;&amp; sudo apt-get install -y kubeadm='1.35.*' &amp;&amp; sudo apt-mark hold kubeadm\nsudo kubeadm upgrade plan\nsudo kubeadm upgrade plan | grep -o 'kubeadm upgrade apply v[0-9.]*' | head -1 | awk '{print $4}' &gt; ~/cka-answers/30-target.txt\nsudo kubeadm upgrade apply $(cat ~/cka-answers/30-target.txt)\nkubectl drain cp-1 --ignore-daemonsets\nsudo apt-mark unhold kubelet kubectl &amp;&amp; sudo apt-get install -y kubelet='1.35.*' kubectl='1.35.*' &amp;&amp; sudo apt-mark hold kubelet kubectl\nsudo systemctl daemon-reload &amp;&amp; sudo systemctl restart kubelet\nkubectl uncordon cp-1\n\n# từng worker (ví dụ worker-1)\nkubectl drain worker-1 --ignore-daemonsets --delete-emptydir-data\nssh worker-1\n  sudo sed -i 's#/v1.34/#/v1.35/#' /etc/apt/sources.list.d/kubernetes.list &amp;&amp; sudo apt-get update\n  sudo apt-mark unhold kubeadm kubelet kubectl\n  sudo apt-get install -y kubeadm='1.35.*' &amp;&amp; sudo kubeadm upgrade node\n  sudo apt-get install -y kubelet='1.35.*' kubectl='1.35.*' &amp;&amp; sudo apt-mark hold kubeadm kubelet kubectl\n  sudo systemctl daemon-reload &amp;&amp; sudo systemctl restart kubelet\n  exit\nkubectl uncordon worker-1\nkubectl get nodes\n<\/code><\/pre>", "docs": [["Upgrading kubeadm clusters", "https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/"], ["Version skew policy", "https://kubernetes.io/releases/version-skew-policy/"]], "support": "solo", "prereq": [1, 14], "guide": [["Quy trình", "<p>Mở trang <em>Upgrading kubeadm clusters<\/em> và làm theo đúng thứ tự của nó. Đề thi chấm kết quả, nhưng sai thứ tự là cluster hỏng.<\/p>\n<ol>\n<li><strong>Repo gói<\/strong> trỏ sang minor mới (<code>/etc/apt/sources.list.d/kubernetes.list<\/code>), <code>apt update<\/code>, xem các phiên bản có sẵn.<\/li>\n<li><strong>Control plane<\/strong>: nâng <code>kubeadm<\/code>, chạy <code>kubeadm upgrade plan<\/code>, rồi <code>kubeadm upgrade apply<\/code>; sau đó drain, nâng <code>kubelet<\/code>/<code>kubectl<\/code>, <code>daemon-reload<\/code>, restart kubelet, uncordon.<\/li>\n<li><strong>Từng worker<\/strong>: nâng <code>kubeadm<\/code>, <code>kubeadm upgrade node<\/code>, drain (chạy từ cp-1), nâng <code>kubelet<\/code>/<code>kubectl<\/code>, restart, uncordon.<\/li>\n<\/ol>"], ["Kiểm chứng sau mỗi node", "<ul>\n<li><code>kubectl get nodes<\/code> cho thấy node vừa làm có VERSION mới và không còn <code>SchedulingDisabled<\/code>.<\/li>\n<li>Mọi Pod hệ thống <code>Running<\/code>.<\/li>\n<\/ul>"], ["Bẫy", "<p>Gói bị <code>apt-mark hold<\/code>. Phải <code>unhold<\/code> rồi <code>hold<\/code> lại (hoặc dùng <code>--allow-change-held-packages<\/code>).<\/p>"]]}, {"id": 31, "slug": "control-plane-config", "dir": "31-control-plane-config", "title": "Chứng chỉ, cấu hình control plane và kubelet", "level": 7, "env": "kind", "minutes": 35, "comps": ["arch:2", "trouble:1", "arch:6"], "goal": "<p>Biết cấu hình của từng thành phần nằm ở đâu, đọc và sửa cờ của static pod an toàn, gia hạn chứng chỉ, và đọc cấu hình kubelet.<\/p>", "concepts": "<ul>\n<li>Control plane kubeadm: manifest ở <code>/etc/kubernetes/manifests<\/code>, chứng chỉ ở <code>/etc/kubernetes/pki<\/code>, kubeconfig ở <code>/etc/kubernetes/*.conf<\/code>. Sửa manifest là kubelet tự tạo lại Pod.<\/li>\n<li><code>kubeadm certs check-expiration<\/code> xem hạn; <code>kubeadm certs renew &lt;tên&gt;|all<\/code> gia hạn, sau đó phải restart thành phần dùng cert đó (di chuyển manifest ra rồi vào lại, hoặc <code>crictl stop<\/code> container).<\/li>\n<li>kubelet: cấu hình ở <code>/var/lib/kubelet/config.yaml<\/code> (<code>cgroupDriver<\/code>, <code>clusterDNS<\/code>, <code>staticPodPath<\/code>…), cờ thêm ở <code>/var/lib/kubelet/kubeadm-flags.env<\/code>.<\/li>\n<li>Trước khi sửa manifest, luôn sao lưu ra <strong>ngoài<\/strong> thư mục manifests (kubelet đọc mọi file trong đó).<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi dải IP của Service (<code>--service-cluster-ip-range<\/code>) vào <code>~/cka-answers/31-svc-range.txt<\/code>.<\/p>", "<p>Ghi <code>cgroupDriver<\/code> và <code>clusterDNS<\/code> trong cấu hình kubelet của <code>$NODE1<\/code> vào <code>~/cka-answers/31-kubelet.txt<\/code> theo dạng <code>systemd 10.96.0.10<\/code>.<\/p>", "<p>Gia hạn chứng chỉ <code>apiserver<\/code> bằng kubeadm và cho kube-apiserver dùng chứng chỉ mới.<\/p>", "<p>Bật thêm admission plugin <code>AlwaysPullImages<\/code> cho kube-apiserver, giữ nguyên các plugin đang bật.<\/p>"], "hints": [["Restart kube-apiserver", "<p><code>mv /etc/kubernetes/manifests/kube-apiserver.yaml /root/ &amp;&amp; sleep 20 &amp;&amp; mv /root/kube-apiserver.yaml /etc/kubernetes/manifests/<\/code><\/p>"], ["Chứng chỉ apiserver đang dùng", "<p><code>openssl x509 -in /etc/kubernetes/pki/apiserver.crt -noout -dates<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">./lab ssh $CP\ngrep service-cluster-ip-range /etc/kubernetes/manifests/kube-apiserver.yaml   # 10.96.0.0/12\nkubeadm certs check-expiration\nkubeadm certs renew apiserver\ncp /etc/kubernetes/manifests/kube-apiserver.yaml /root/kube-apiserver.yaml.bak\nvi /etc/kubernetes/manifests/kube-apiserver.yaml\n#   - --enable-admission-plugins=NodeRestriction,AlwaysPullImages\n# sửa manifest cũng làm kubelet tạo lại Pod, nên chứng chỉ mới được nạp\nexit\necho 10.96.0.0/12 &gt; ~/cka-answers/31-svc-range.txt\n\n./lab ssh $NODE1\ngrep -E 'cgroupDriver|clusterDNS' -A1 /var/lib/kubelet/config.yaml\nexit\necho &quot;systemd 10.96.0.10&quot; &gt; ~/cka-answers/31-kubelet.txt\n<\/code><\/pre>", "docs": [["Certificate management with kubeadm", "https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/"], ["Admission controllers", "https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/"], ["Set kubelet parameters via a config file", "https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/"]], "support": "solo", "prereq": [29], "guide": [["Quy trình", "<ol>\n<li><strong>Biết cấu hình nằm ở đâu.<\/strong> Control plane nằm trong <code>/etc/kubernetes/manifests/*.yaml<\/code> (cờ dòng lệnh). Kubelet nằm trong <code>/var/lib/kubelet/config.yaml<\/code> và <code>/var/lib/kubelet/kubeadm-flags.env<\/code>. Chứng chỉ nằm trong <code>/etc/kubernetes/pki<\/code>.<\/li>\n<li><strong>Đọc trước khi sửa.<\/strong> <code>grep -- '--&lt;cờ&gt;' &lt;manifest&gt;<\/code> để biết giá trị hiện tại; với danh sách như admission plugin thì <strong>thêm vào<\/strong>, đừng thay thế.<\/li>\n<li><strong>Sao lưu ra ngoài thư mục manifests<\/strong> trước khi sửa: <code>cp kube-apiserver.yaml /root/<\/code>. Kubelet đọc <strong>mọi<\/strong> file trong thư mục manifests, kể cả bản sao lưu.<\/li>\n<li><strong>Áp dụng thay đổi.<\/strong> Sửa static pod manifest thì kubelet tự tạo lại Pod. Chứng chỉ mới không làm manifest đổi, nên phải tự buộc kube-apiserver khởi động lại.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>kubeadm certs check-expiration<\/code> thấy ngày hết hạn mới.<\/li>\n<li>So sánh chứng chỉ API server <strong>đang phục vụ<\/strong> với file trên đĩa (<code>openssl s_client<\/code> lấy chứng chỉ từ cổng 6443).<\/li>\n<li><code>kubectl -n kube-system get pod kube-apiserver-&lt;node&gt; -o yaml | grep admission<\/code> thấy plugin mới.<\/li>\n<\/ul>"]]}, {"id": 32, "slug": "control-plane-ha", "dir": "32-control-plane-ha", "title": "Thêm control plane cho cluster HA", "level": 7, "env": "vm", "minutes": 60, "comps": ["arch:4", "arch:2"], "goal": "<p>Biến cluster một control plane thành ba control plane với etcd xếp chồng (stacked), hiểu vai trò của endpoint chung và load balancer.<\/p>", "concepts": "<ul>\n<li>HA cần: một <strong>endpoint ổn định<\/strong> cho API (<code>--control-plane-endpoint<\/code>, thường là load balancer hoặc VIP như kube-vip), <strong>số lẻ<\/strong> control plane (3 hoặc 5) để etcd giữ quorum.<\/li>\n<li><code>kubeadm init --upload-certs<\/code> lưu cert control plane (mã hóa) vào Secret <code>kubeadm-certs<\/code>, hết hạn sau 2 giờ; tạo lại bằng <code>kubeadm init phase upload-certs --upload-certs<\/code>, lệnh này in ra <strong>certificate key<\/strong>.<\/li>\n<li>Join control plane: <code>kubeadm join &lt;endpoint&gt; --token … --discovery-token-ca-cert-hash … --control-plane --certificate-key …<\/code>.<\/li>\n<li>API server chạy song song trên cả 3 node; scheduler và controller-manager chỉ một bản làm việc (leader, giữ Lease trong <code>kube-system<\/code>).<\/li>\n<\/ul>", "setup_note": "<p>Cần cluster từ lab 01. Dựng thêm 2 máy ảo <code>cp-2<\/code> (192.168.56.13) và <code>cp-3<\/code> (192.168.56.14):<\/p>\n<pre><code class=\"language-bash\">cd env/kubeadm &amp;&amp; HA=1 vagrant up cp-2 cp-3\n<\/code><\/pre>\n<p>Lab dùng tên <code>k8s-api<\/code> trong <code>/etc/hosts<\/code> trỏ về cp-1 thay cho load balancer. Trong thực tế, đặt HAProxy hoặc kube-vip trước 3 API server.<\/p>", "tasks": ["<p>Trên <code>cp-1<\/code>, tạo lại certificate key và lệnh join.<\/p>", "<p>Join <code>cp-2<\/code> và <code>cp-3<\/code> làm control plane.<\/p>", "<p>Ghi số member etcd vào <code>~/cka-answers/32-etcd-members.txt<\/code>, và tên node đang giữ Lease <code>kube-scheduler<\/code> vào <code>~/cka-answers/32-leader.txt<\/code>.<\/p>"], "hints": [["Danh sách member etcd", "<p><code>kubectl -n kube-system exec etcd-cp-1 -- etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key member list -w table<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\"># cp-1\nsudo kubeadm init phase upload-certs --upload-certs        # in ra certificate key\nkubeadm token create --print-join-command\n# cp-2 và cp-3:\nsudo kubeadm join k8s-api:6443 --token &lt;t&gt; --discovery-token-ca-cert-hash sha256:&lt;h&gt; \\\n  --control-plane --certificate-key &lt;key&gt; --apiserver-advertise-address &lt;ip của node&gt;\nkubectl get nodes          # 3 control-plane\nkubectl -n kube-system exec etcd-cp-1 -- etcdctl … member list | wc -l &gt; ~/cka-answers/32-etcd-members.txt\nkubectl get lease kube-scheduler -n kube-system -o jsonpath='{.spec.holderIdentity}' | cut -d_ -f1 &gt; ~/cka-answers/32-leader.txt\n<\/code><\/pre>", "docs": [["Creating highly available clusters with kubeadm", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/high-availability/"], ["Options for HA topology", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/ha-topology/"]], "support": "solo", "prereq": [30], "guide": [["Quy trình", "<ol>\n<li><strong>Điều kiện tiên quyết.<\/strong> Cluster được init với <code>--control-plane-endpoint<\/code> (lab 01), và node mới đã chuẩn bị như worker (runtime, gói kube*).<\/li>\n<li><strong>Chứng chỉ dùng chung.<\/strong> Control plane mới cần CA và khóa của cluster. <code>--upload-certs<\/code> đẩy chúng lên Secret tạm (hết hạn sau 2 giờ) và trả về certificate key.<\/li>\n<li><strong>Lệnh join<\/strong> cho control plane = lệnh join của worker + <code>--control-plane --certificate-key &lt;key&gt;<\/code> + địa chỉ quảng bá của node mới.<\/li>\n<li>Join <strong>lần lượt<\/strong> từng node, chờ node trước Ready rồi mới làm node sau. etcd thêm member từng cái một.<\/li>\n<\/ol>"], ["Kiểm chứng", "<ul>\n<li><code>kubectl get nodes<\/code> có 3 node <code>control-plane<\/code>.<\/li>\n<li><code>etcdctl member list<\/code> (chạy trong Pod etcd, với các cờ TLS) có 3 member <code>started<\/code>.<\/li>\n<li>Leader election: <code>kubectl get lease -n kube-system<\/code>. Trường <code>holderIdentity<\/code> cho biết node nào đang giữ.<\/li>\n<\/ul>"], ["Liên hệ thực tế", "<p>Ba control plane chịu được mất <strong>một<\/strong> node: etcd cần quá bán số member (2/3). Hai control plane không tốt hơn một: mất một node là etcd mất quorum.<\/p>"]]}, {"id": 33, "slug": "troubleshoot-apps", "dir": "33-troubleshoot-apps", "title": "Troubleshooting ứng dụng: sáu Deployment hỏng", "level": 8, "env": "any", "minutes": 40, "comps": ["trouble:3", "trouble:2", "work:3"], "goal": "<p>Chẩn đoán nhanh và sửa đúng sáu lỗi ứng dụng hay gặp nhất trong đề: image sai, lệnh sai, OOM, không xếp được node, thiếu cấu hình, probe sai.<\/p>", "concepts": "<ul>\n<li>Quy trình: <code>kubectl get pods<\/code> (STATUS, RESTARTS) → <code>kubectl describe pod<\/code> (Events, Last State, Conditions) → <code>kubectl logs<\/code> và <code>logs --previous<\/code> → sửa Deployment, không sửa Pod.<\/li>\n<li>Bảng tra STATUS: <code>ImagePullBackOff<\/code>/<code>ErrImagePull<\/code> (image), <code>CrashLoopBackOff<\/code> (container chết lặp lại: xem exit code và log), <code>RunContainerError<\/code>/<code>StartError<\/code> (lệnh không chạy được), <code>CreateContainerConfigError<\/code> (thiếu ConfigMap/Secret), <code>Pending<\/code> (không xếp được node: đọc event <code>FailedScheduling<\/code>), <code>Running<\/code> nhưng <code>0/1<\/code> (readiness trượt).<\/li>\n<li>Exit code: <code>1<\/code> lỗi app, <code>126/127<\/code> lệnh không chạy được hoặc không tồn tại, <code>137<\/code> bị SIGKILL (thường <code>OOMKilled<\/code>), <code>143<\/code> SIGTERM.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Namespace <code>lab33<\/code> có sáu Deployment: <code>img<\/code>, <code>cmd<\/code>, <code>oom<\/code>, <code>pending<\/code>, <code>cfg<\/code>, <code>notready<\/code>. Mỗi cái hỏng một kiểu. Sửa để <strong>cả sáu<\/strong> đều sẵn sàng đủ replica.<\/p>", "<p>Ràng buộc khi sửa: <code>img<\/code> dùng <code>nginx:1.27<\/code>; <code>cmd<\/code> vẫn chạy <code>sleep 3600<\/code>; <code>oom<\/code> giữ nguyên lệnh và chỉ đổi memory limit thành <code>256Mi<\/code>; <code>cfg<\/code> phải đọc biến từ ConfigMap <code>app-settings<\/code> với <code>MODE=prod<\/code>; <code>notready<\/code> giữ readinessProbe nhưng kiểm tra đúng đường dẫn.<\/p>", "<p>Ghi lý do container của <code>oom<\/code> bị dừng (giá trị <code>reason<\/code> trong <code>lastState<\/code>) vào <code>~/cka-answers/33-oom.txt<\/code>.<\/p>"], "hints": [["Nhìn toàn cảnh", "<p><code>kubectl get pods -n lab33<\/code> rồi <code>kubectl get events -n lab33 --sort-by=.lastTimestamp | tail -20<\/code><\/p>"], ["Lý do lần chết trước", "<p><code>kubectl get pod &lt;pod&gt; -n lab33 -o jsonpath='{.status.containerStatuses[0].lastState.terminated.reason}'<\/code><\/p>"], ["Pod Pending", "<p><code>kubectl describe pod<\/code> → <code>0/3 nodes are available: … didn't match Pod's node affinity/selector<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl get pods -n lab33\n# img: ImagePullBackOff\nkubectl set image deploy/img -n lab33 nginx=nginx:1.27\n# cmd: StartError, &quot;slep&quot;: executable file not found\nkubectl patch deploy cmd -n lab33 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/command&quot;,&quot;value&quot;:[&quot;sleep&quot;,&quot;3600&quot;]}]'\n# oom: OOMKilled, exit 137\nkubectl get pod -n lab33 -l app=oom -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}' &gt; ~/cka-answers/33-oom.txt\nkubectl set resources deploy oom -n lab33 --limits=memory=256Mi\n# pending: nodeSelector disktype=nvme không node nào có\nkubectl patch deploy pending -n lab33 --type=json -p '[{&quot;op&quot;:&quot;remove&quot;,&quot;path&quot;:&quot;/spec/template/spec/nodeSelector&quot;}]'\n# cfg: CreateContainerConfigError, configmap &quot;app-settings&quot; not found\nkubectl create cm app-settings -n lab33 --from-literal=MODE=prod\n# notready: Readiness probe failed: HTTP probe failed with statuscode: 404\nkubectl patch deploy notready -n lab33 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/readinessProbe/httpGet/path&quot;,&quot;value&quot;:&quot;/&quot;}]'\nkubectl get deploy -n lab33\n<\/code><\/pre>\n<p>Pod của <code>cfg<\/code> tự chạy lại khi ConfigMap xuất hiện (kubelet thử lại). Nếu chậm: <code>kubectl rollout restart deploy cfg -n lab33<\/code>.<\/p>", "docs": [["Debug Pods", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"], ["Determine the reason for Pod failure", "https://kubernetes.io/docs/tasks/debug/debug-application/determine-reason-pod-failure/"]], "support": "solo", "prereq": [7, 10], "guide": [["Quy trình chẩn đoán ứng dụng", "<p>Làm cùng một vòng cho mọi Deployment, từ ngoài vào trong:<\/p>\n<p><strong>Bước 1 · Toàn cảnh.<\/strong> <code>kubectl get deploy,rs,pods -n lab33<\/code>. Ghi lại STATUS của từng Pod.<\/p>\n<p><strong>Bước 2 · STATUS nói lên loại lỗi.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>STATUS<\/th>\n<th>Nhìn vào đâu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ImagePullBackOff<\/code>, <code>ErrImagePull<\/code><\/td>\n<td>Events: tên image, tag, registry<\/td>\n<\/tr>\n<tr>\n<td><code>CrashLoopBackOff<\/code>, <code>Error<\/code><\/td>\n<td><code>logs --previous<\/code>, <code>lastState.terminated<\/code> (reason, exitCode)<\/td>\n<\/tr>\n<tr>\n<td><code>OOMKilled<\/code><\/td>\n<td>limits memory so với nhu cầu thật<\/td>\n<\/tr>\n<tr>\n<td><code>Pending<\/code><\/td>\n<td>Events của Pod: scheduler nói thiếu gì<\/td>\n<\/tr>\n<tr>\n<td><code>CreateContainerConfigError<\/code><\/td>\n<td>ConfigMap/Secret được tham chiếu có tồn tại không, đúng key không<\/td>\n<\/tr>\n<tr>\n<td><code>Running<\/code> nhưng <code>0/1<\/code><\/td>\n<td>readinessProbe: path, port, lệnh<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Bước 3 · Sửa ở Deployment, không sửa ở Pod.<\/strong> Pod sẽ bị thay ngay, nên sửa template của Deployment.<\/p>\n<p><strong>Bước 4 · Xác nhận từng cái<\/strong> trước khi sang cái tiếp: <code>kubectl rollout status<\/code>.<\/p>"], ["Kiểm chứng", "<p><code>kubectl get deploy -n lab33<\/code>: cả 6 dòng có READY bằng DESIRED.<\/p>"]]}, {"id": 34, "slug": "troubleshoot-network", "dir": "34-troubleshoot-network", "title": "Troubleshooting mạng: Service, NetworkPolicy và DNS", "level": 8, "env": "any", "minutes": 40, "comps": ["trouble:4", "net:1", "net:5"], "goal": "<p>Lần theo đường đi của một request bị hỏng ở nhiều chỗ cùng lúc: DNS, Service, endpoint, NetworkPolicy. Sửa từng lớp mà không phá bỏ chính sách bảo mật.<\/p>", "concepts": "<ul>\n<li>Thứ tự kiểm tra: <strong>DNS<\/strong> (<code>nslookup web.lab34<\/code>) → <strong>Service<\/strong> có tồn tại, đúng cổng → <strong>EndpointSlice<\/strong> có IP không (selector, readiness, targetPort) → gọi thẳng <strong>IP Pod<\/strong> → <strong>NetworkPolicy<\/strong> → kube-proxy/CNI trên node.<\/li>\n<li>Gọi bằng IP Pod được mà bằng tên Service không được: lỗi ở DNS hoặc Service. Gọi IP Pod cũng không được: app, NetworkPolicy hoặc CNI.<\/li>\n<li>CoreDNS là Deployment <code>coredns<\/code> trong <code>kube-system<\/code>, Service tên <code>kube-dns<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Pod <code>client<\/code> trong <code>lab34<\/code> (label <code>role=frontend<\/code>) không gọi được <code>http://web.lab34<\/code>. Sửa mọi lỗi trên đường đi để <code>client<\/code> nhận được trang nginx.<\/p>", "<p>Ràng buộc: <strong>không<\/strong> xóa hay sửa NetworkPolicy <code>default-deny<\/code>; <strong>không<\/strong> đổi label của <code>client<\/code> hay của Pod <code>web<\/code>; <strong>không<\/strong> tạo Service mới.<\/p>", "<p>Ghi số lỗi bạn đã sửa vào <code>~/cka-answers/34-faults.txt<\/code>.<\/p>"], "hints": [["Bắt đầu từ DNS", "<p><code>kubectl exec client -n lab34 -- nslookup web.lab34<\/code> báo lỗi? Xem <code>kubectl -n kube-system get deploy coredns<\/code>.<\/p>"], ["Gọi thẳng IP Pod để tách lỗi", "<p><code>kubectl get pod -n lab34 -l app=web -o wide<\/code> rồi <code>kubectl exec client -n lab34 -- wget -qO- -T3 &lt;pod-ip&gt;<\/code><\/p>"]], "solution": "<p>Có 4 lỗi chồng nhau:<\/p>\n<pre><code class=\"language-bash\"># 1. DNS: CoreDNS bị scale về 0\nkubectl -n kube-system get deploy coredns           # 0/0\nkubectl -n kube-system scale deploy coredns --replicas=2   # (k3s: 1)\n# 2. Service web chọn sai label\nkubectl get svc web -n lab34 -o jsonpath='{.spec.selector}'   # app=wbe\n# 3. targetPort sai (8080, nginx nghe 80)\nkubectl patch svc web -n lab34 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/selector&quot;,&quot;value&quot;:{&quot;app&quot;:&quot;web&quot;}},{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/ports/0/targetPort&quot;,&quot;value&quot;:80}]'\n# 4. Policy allow-frontend chọn sai label nguồn (role=front-end)\nkubectl get netpol allow-frontend -n lab34 -o yaml\nkubectl patch netpol allow-frontend -n lab34 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/ingress/0/from/0/podSelector/matchLabels&quot;,&quot;value&quot;:{&quot;role&quot;:&quot;frontend&quot;}}]'\nkubectl exec client -n lab34 -- wget -qO- -T3 http://web.lab34\necho 4 &gt; ~/cka-answers/34-faults.txt\n<\/code><\/pre>", "docs": [["Debug Services", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"], ["Debugging DNS resolution", "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"]], "support": "solo", "prereq": [16, 17], "guide": [["Quy trình chẩn đoán mạng", "<p>Đi theo đúng đường của một request, từ <code>client<\/code> tới container. Mỗi bước loại trừ một lớp:<\/p>\n<ol>\n<li><strong>DNS:<\/strong> <code>kubectl exec client -- nslookup web.lab34<\/code>. Thất bại thì xem Pod CoreDNS, Service <code>kube-dns<\/code> và endpoint của nó.<\/li>\n<li><strong>Service → Pod:<\/strong> <code>kubectl get endpointslices -l kubernetes.io/service-name=web<\/code>. Không có địa chỉ nghĩa là selector không khớp label.<\/li>\n<li><strong>Cổng:<\/strong> <code>port<\/code> của Service → <code>targetPort<\/code> → cổng container thực sự lắng nghe.<\/li>\n<li><strong>Gọi thẳng IP Pod<\/strong> (bỏ qua Service và DNS). Lệnh này thất bại thì vấn đề nằm ở NetworkPolicy hoặc ứng dụng.<\/li>\n<li><strong>NetworkPolicy:<\/strong> <code>kubectl get netpol -n lab34 -o yaml<\/code>. Với mỗi policy chọn Pod đích, tự hỏi: label của <code>client<\/code> có khớp <code>from<\/code> không, cổng có khớp không?<\/li>\n<\/ol>\n<p>Mỗi lần sửa một lỗi, chạy lại từ bước 1. Lỗi sau thường bị lỗi trước che mất.<\/p>"], ["Kiểm chứng", "<p><code>kubectl exec client -n lab34 -- wget -qO- -T3 http://web.lab34<\/code> in trang nginx.<\/p>"]]}, {"id": 35, "slug": "troubleshoot-control-plane", "dir": "35-troubleshoot-control-plane", "title": "Troubleshooting control plane: scheduler và controller-manager", "level": 8, "env": "kind", "minutes": 40, "comps": ["trouble:1"], "goal": "<p>Nhận ra thành phần control plane nào hỏng chỉ từ triệu chứng, đọc log khi kubectl không giúp được, và sửa static pod manifest.<\/p>", "concepts": "<ul>\n<li>Triệu chứng chỉ điểm: Deployment không có ReplicaSet → <strong>kube-controller-manager<\/strong>. Pod đứng <code>Pending<\/code> mà không có event → <strong>kube-scheduler<\/strong>. <code>kubectl<\/code> báo connection refused → <strong>kube-apiserver<\/strong> hoặc <strong>etcd<\/strong>.<\/li>\n<li>Control plane là static pod: log đọc bằng <code>kubectl -n kube-system logs &lt;pod&gt;<\/code>, hoặc trên node bằng <code>crictl ps -a<\/code> + <code>crictl logs &lt;id&gt;<\/code>, hoặc file trong <code>/var/log/pods/<\/code>. Pod không được tạo luôn thì xem <code>journalctl -u kubelet<\/code>.<\/li>\n<li>Sửa file trong <code>/etc/kubernetes/manifests<\/code> là đủ; kubelet tự tạo lại Pod (có thể mất 20–60 giây).<\/li>\n<\/ul>"
