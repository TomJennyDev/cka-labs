<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKA Labs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="46 bài lab thực hành CKA v1.37 từ cơ bản tới hai đề thi thử, có script tự chấm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sổ tay phòng lab — thanh lộ trình bên trái, trang bài lab ở giữa như một phiếu thực hành */
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --paper-2:#F5F7FA; --ink:#121C2B; --muted:#5A6779; --line:#D5DCE5;
  --accent:#2A5FD6; --accent-soft:#E2EAFB;
  --ok:#0F8A6A; --ok-soft:#DCF2EB; --warn:#C77A05; --warn-soft:#FCEFD9; --bad:#C63B36; --bad-soft:#FBE3E2;
  --term-bg:#111C2D; --term-fg:#DDE6F1; --term-dim:#8193AB; --term-acc:#F2B04A; --term-key:#9DBEFF; --term-ok:#5BD3B5;
  --d-trouble:#C63B36; --d-arch:#2A5FD6; --d-net:#C77A05; --d-work:#0F8A6A; --d-stor:#7A47C2;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1320; --paper:#121D2D; --paper-2:#0E1827; --ink:#E3E9F2; --muted:#95A3B7; --line:#26354B;
  --accent:#8AABFF; --accent-soft:#1B2C4C; --ok:#4CCBA6; --ok-soft:#10302A; --warn:#F2AE4B; --warn-soft:#3A2A11; --bad:#F27570; --bad-soft:#3D1E1E;
  --term-bg:#070E18; --d-trouble:#F27570; --d-arch:#8AABFF; --d-net:#F2AE4B; --d-work:#4CCBA6; --d-stor:#B993F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1320; --paper:#121D2D; --paper-2:#0E1827; --ink:#E3E9F2; --muted:#95A3B7; --line:#26354B;
  --accent:#8AABFF; --accent-soft:#1B2C4C; --ok:#4CCBA6; --ok-soft:#10302A; --warn:#F2AE4B; --warn-soft:#3A2A11; --bad:#F27570; --bad-soft:#3D1E1E;
  --term-bg:#070E18; --d-trouble:#F27570; --d-arch:#8AABFF; --d-net:#F2AE4B; --d-work:#4CCBA6; --d-stor:#B993F0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.62 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.87em;background:var(--paper-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:54px;display:flex;align-items:center;gap:14px;background:var(--paper);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:800 19px var(--f-display);letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:flex;gap:9px;align-items:center;white-space:nowrap}
.brand i{font:600 11px/1 var(--f-mono);font-style:normal;color:var(--accent);background:var(--accent-soft);padding:5px 7px;border-radius:4px}
.top nav{display:flex;gap:4px;margin-left:8px}
.top nav a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
.top nav a[aria-current="page"]{color:var(--ink);background:var(--paper-2)}
.top .meta{margin-left:auto;display:flex;gap:10px;align-items:center;font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.meter{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
@media (max-width:640px){.top nav{display:none}.meter{width:50px}}

.layout{display:grid;grid-template-columns:minmax(0,1fr)}
.side{background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side .search{width:100%;font:14px var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.side .levels{display:none}
.side.open .levels{display:block}
.side .toggle{margin-top:8px;font:600 13px var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
@media (min-width:1024px){
  .layout{grid-template-columns:270px minmax(0,1fr)}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);height:calc(100vh - 54px);overflow-y:auto;border-bottom:0;border-right:1px solid var(--line);padding:14px 12px 40px}
  .side .levels{display:block}
  .side .toggle{display:none}
}
.lvl{margin-top:14px}
.lvl h4{margin:0 0 4px;padding:0 8px;font:600 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lvl a{display:grid;grid-template-columns:24px minmax(0,1fr) 12px;gap:6px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.lvl a .n{font:600 11px var(--f-mono);color:var(--muted)}
.lvl a:hover{background:var(--paper)}
.lvl a[aria-current="page"]{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);align-self:center}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.wip{background:var(--warn-soft);border-color:var(--warn)}

main{min-width:0;padding-block:28px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page.wide{max-width:1180px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0}
h1{overflow-wrap:break-word;font:800 clamp(30px,4.6vw,50px)/1.05 var(--f-display);letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
h2{font:700 24px/1.2 var(--f-display);letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h3{font:600 18px/1.3 var(--f-display);margin:0 0 8px}
p{margin:0 0 10px}
.lead{font-size:16.5px;color:var(--muted);max-width:68ch;margin:10px 0 0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill .sw{width:8px;height:8px;border-radius:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills .pill{white-space:normal;line-height:1.35;max-width:100%}
.btn{font:600 13.5px var(--f-body);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.code{position:relative;min-width:0}
.code pre,.md pre{background:var(--term-bg);color:var(--term-fg);font:12.8px/1.6 var(--f-mono);padding:13px 58px 13px 15px;border-radius:8px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.copy{position:absolute;top:8px;right:8px;font:600 11px var(--f-mono);background:rgba(255,255,255,.08);color:var(--term-fg);border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:4px 8px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.16)}
.cmd{display:flex;align-items:center;gap:10px;background:var(--term-bg);color:var(--term-fg);font:14px var(--f-mono);border-radius:8px;padding:11px 14px;position:relative}
.cmd span{color:var(--term-acc)}
.md{min-width:0}
.md ul,.md ol{padding-left:22px;margin:0 0 10px}
.md li{margin:3px 0}
.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left}
.md p:last-child{margin-bottom:0}

/* lab page */
.labhead{display:flex;flex-direction:column;gap:12px}
.labno{font:800 15px var(--f-mono);color:var(--accent)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{display:flex;align-items:baseline;gap:10px}
.sec h2 small{font:600 12px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:t}
.task{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;counter-increment:t}
.task label{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.task label::before{content:counter(t);font:700 13px var(--f-mono);color:var(--muted)}
.task input{width:18px;height:18px;accent-color:var(--ok)}
.task.done{border-color:var(--ok);background:linear-gradient(90deg,var(--ok-soft),var(--paper) 40%)}
details.hint{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:0 14px}
details.hint summary{cursor:pointer;padding:11px 0;font-weight:600;list-style:none;display:flex;gap:8px}
details.hint summary::before{content:"?";font:700 12px/18px var(--f-mono);width:18px;height:18px;text-align:center;border-radius:50%;background:var(--warn-soft);color:var(--warn);flex:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint>div{padding:0 0 12px}
.solution{border:1px dashed var(--line);border-radius:10px;padding:16px}
.solution[data-open="1"]{border-style:solid;border-color:var(--accent)}
.navnext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.navnext a{overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);max-width:48%}
.navnext a small{font:600 11px var(--f-mono);color:var(--muted)}
.navnext a.next{text-align:right;margin-left:auto}
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer b{font:800 40px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.low b{color:var(--bad)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:end}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 12px 14px 0}
.stats b{display:block;font:800 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.path{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stage .lv{font:600 11px var(--f-mono);color:var(--accent);letter-spacing:.06em}
.stage h3{margin:0;font-size:16px}
.stage p{margin:0;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.chip{font:600 12px var(--f-mono);text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper-2);border-radius:6px;padding:3px 7px}
.chip.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.wip{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip:hover{border-color:var(--accent)}
.stagebar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.stagebar i{display:block;height:100%;background:var(--ok)}
.cov{width:100%;border-collapse:collapse;font-size:14px}
.cov td,.cov th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cov th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cov .dm td{font-weight:700;background:var(--paper-2)}
.covwrap{overflow-x:auto}
.domsw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:8px}

/* guided learning: support fades from walkthrough → approach → method */
.md blockquote{margin:10px 0;padding:9px 13px;border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:0 7px 7px 0}
.md blockquote p{margin:0}
.md h3{font-size:16px;margin:14px 0 6px}
.sup{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--f-mono);padding:5px 9px;border-radius:999px;border:1px solid}
.sup::before{content:"";width:22px;height:6px;border-radius:3px;background:linear-gradient(90deg,currentColor var(--f),transparent var(--f)),var(--line)}
.sup.guided{--f:100%;color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.sup.scaffold{--f:60%;color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.sup.solo{--f:25%;color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.prereq{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prereq .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{background:var(--paper);border:1px solid var(--line);border-radius:10px;counter-increment:s;min-width:0}
.step>header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.step>header::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12.5px var(--f-mono);background:var(--accent-soft);color:var(--accent)}
.step>header h3{margin:0;font-size:16px;flex:1;min-width:0}
.step>header label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.step>header input{width:17px;height:17px;accent-color:var(--ok)}
.step>.md{padding:14px 16px}
.step.done{border-color:var(--ok)}
.step.done>header::before{content:"✓";background:var(--ok);color:var(--paper)}
.method{display:flex;flex-direction:column;gap:14px}
.method>div{border-left:3px solid var(--warn);padding-left:14px}
.method h3{margin:0 0 6px}
.modes{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.modes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mode{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mode h3{margin:0}
.mode .sup{align-self:flex-start}
.mode p{margin:0;font-size:13.5px;color:var(--muted)}
.mode .lv{font:600 12px var(--f-mono);color:var(--ink)}
.diagrams{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.diagram{margin:0;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.diagram h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.diagram h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent)}
.mmd{overflow-x:auto;padding:4px 0;text-align:center}
.mmd pre.mermaid{background:none;color:var(--ink);padding:0;margin:0;font:12px/1.5 var(--f-mono);text-align:left;white-space:pre-wrap}
.mmd svg{height:auto}
@media (max-width:640px){.mmd svg{min-width:600px}}
.mmd.zoom svg{min-width:var(--nat)!important}
.zoomhint{display:none;font:600 11px var(--f-mono);color:var(--muted);margin-top:6px}
@media (max-width:640px){.zoomhint{display:block}}
.diagram .md>p{font-size:13.5px;color:var(--muted);margin-top:8px}
.fade{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0%,var(--accent) 45%,var(--warn) 80%,var(--line) 100%)}
.fade-l{display:flex;justify-content:space-between;font:600 11px var(--f-mono);color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
[hidden]{display:none!important}
</style>
</head>
<body>


<header class="top">
  <a class="brand" href="#home">CKA Labs <i>v1.37</i></a>
  <nav><a href="#home" data-nav="home">Lộ trình</a><a href="#setup" data-nav="setup">Môi trường</a><a href="#lab-38" data-nav="exam">Thi thử</a><a href="https://github.com/TomJennyDev/cka-labs" target="_blank" rel="noopener">GitHub ↗</a></nav>
  <div class="meta"><span id="progTxt">0/39</span><span class="meter" aria-hidden="true"><i id="progBar"></i></span></div>
</header>
<div class="layout">
  <aside class="side" id="side">
    <input class="search" id="q" type="search" placeholder="Tìm bài: etcd, probe, RBAC…" aria-label="Tìm bài lab">
    <button class="toggle" id="sideToggle" type="button">Hiện danh sách bài ▾</button>
    <div class="levels" id="levels"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
"use strict";
const DATA = {"levels": {"0": ["Chuẩn bị môi trường", "Dựng cluster lab và làm quen công cụ."], "1": ["Nền tảng kubectl", "Làm chủ kubectl, object, YAML và cách trích xuất dữ liệu."], "2": ["Workloads", "Deployment, cấu hình, probe, multi-container, Job, tài nguyên và autoscaling."], "3": ["Scheduling", "Điều khiển Pod chạy ở node nào, static pod, bảo trì node."], "4": ["Services & Networking", "Service, LoadBalancer, DNS, NetworkPolicy, Ingress và Gateway API."], "5": ["Storage", "Volume, PV/PVC, StorageClass và StatefulSet."], "6": ["Bảo mật", "RBAC, ServiceAccount, user và chứng chỉ, Pod Security."], "7": ["Vận hành cluster", "Helm, Kustomize, CRD, operator, runtime, CNI, etcd, nâng cấp, chứng chỉ, HA."], "8": ["Troubleshooting", "Chẩn đoán và sửa ứng dụng, mạng, control plane và node."], "9": ["Thi thử", "Hai đề tổng hợp 2 giờ theo trọng số đề thi thật, làm theo từng host."]}, "support": {"guided": ["Hướng dẫn từng bước", "Cầm tay chỉ việc", "Mỗi bước có lệnh, giải thích vì sao và kết quả bạn sẽ thấy. Lần đầu làm theo từng bước; lần hai đóng phần hướng dẫn lại và tự làm đề bài."], "scaffold": ["Cách tiếp cận", "Dẫn hướng", "Mỗi câu chỉ ra chỗ tra tài liệu, khung lệnh và cách tự kiểm, nhưng không đưa đáp án. Hãy thử tự làm trước, kẹt mới mở."], "solo": ["Quy trình tư duy", "Tự lực", "Đề bài kiểu phòng thi. Phần này chỉ đưa quy trình làm việc và cách kiểm chứng; chi tiết bạn tự tra như trong phòng thi."]}, "domains": {"trouble": ["Troubleshooting", 30, ["Troubleshoot cluster và node", "Troubleshoot thành phần control plane", "Theo dõi tài nguyên cluster và ứng dụng", "Quản lý và đánh giá output, log của container", "Troubleshoot Service và networking"]], "arch": ["Cluster Architecture, Installation & Configuration", 25, ["Quản lý RBAC", "Chuẩn bị hạ tầng để cài cluster", "Tạo và quản lý cluster bằng kubeadm", "Quản lý vòng đời cluster (nâng cấp)", "Control plane high-availability", "Cài thành phần bằng Helm và Kustomize", "Interface mở rộng: CNI, CSI, CRI", "CRD, cài và cấu hình Operator"]], "net": ["Services & Networking", 20, ["Kết nối giữa các Pod", "NetworkPolicy", "Service ClusterIP, NodePort, LoadBalancer và endpoints", "Gateway API", "Ingress controller và Ingress", "CoreDNS"]], "work": ["Workloads & Scheduling", 15, ["Deployment, rolling update, rollback", "ConfigMap và Secret", "Autoscaling", "Primitive cho ứng dụng tự phục hồi", "Admission và scheduling của Pod"]], "stor": ["Storage", 10, ["StorageClass và dynamic provisioning", "Volume type, access mode, reclaim policy", "PersistentVolume và PersistentVolumeClaim"]]}, "env": {"any": "kind hoặc kubeadm", "kind": "kind hoặc kubeadm (cần vào node)", "vm": "kubeadm trên máy ảo"}, "labs": [{"id": 0, "slug": "lab-environment", "dir": "00-lab-environment", "title": "Dựng cluster lab và làm quen công cụ", "level": 0, "env": "any", "minutes": 30, "comps": [], "goal": "<p>Có một cluster 3 node (1 control plane, 2 worker) chạy Kubernetes v1.37 (phiên bản của đề thi) để làm mọi bài lab, cấu hình terminal giống phòng thi và biết cách dùng <code>./lab<\/code>.<\/p>", "concepts": "<ul>\n<li><strong>kind<\/strong> (Kubernetes in Docker) dựng mỗi node thành một container. Bên trong là kubeadm, kubelet chạy bằng systemd và control plane dạng static pod, giống hệt cluster thật. Gần như mọi lab chạy trên kind.<\/li>\n<li><strong>Cluster kubeadm trên máy ảo<\/strong> (thư mục <code>env/kubeadm<\/code>) chỉ cần cho các bài cài đặt, nâng cấp và HA (lab 01, 30, 32).<\/li>\n<li><code>./lab start &lt;id&gt;<\/code> dựng tình huống, <code>./lab check &lt;id&gt;<\/code> chấm bài, <code>./lab reset &lt;id&gt;<\/code> dọn dẹp.<\/li>\n<li>Một số bài yêu cầu ghi đáp án ra file. Thư mục đáp án mặc định là <code>~/cka-answers<\/code>; đổi bằng biến <code>CKA_ANSWERS<\/code>.<\/li>\n<li>Trong bài, <code>$CP<\/code>, <code>$NODE1<\/code>, <code>$NODE2<\/code> là tên node control plane và hai worker. Nạp chúng bằng <code>eval \"$(./lab env)\"<\/code>. Với kind, tên là <code>cka-control-plane<\/code>, <code>cka-worker<\/code>, <code>cka-worker2<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Cài Docker, <a href=\"https://kind.sigs.k8s.io/docs/user/quick-start/#installation\">kind<\/a> v0.33+ và kubectl v1.37, rồi dựng cluster:<\/p>\n<pre><code class=\"language-bash\">./env/kind/up.sh\n<\/code><\/pre>", "<p>Cấu hình shell giống phòng thi. Thêm vào <code>~/.bashrc<\/code> rồi <code>source ~/.bashrc<\/code>:<\/p>\n<pre><code class=\"language-bash\">alias k=kubectl\nsource &lt;(kubectl completion bash)\ncomplete -o default -F __start_kubectl k\nexport do=&quot;--dry-run=client -o yaml&quot;\nexport now=&quot;--force --grace-period 0&quot;\n<\/code><\/pre>", "<p>Chạy <code>./lab doctor<\/code> và <code>eval \"$(./lab env)\"<\/code>. Ghi tên node control plane vào <code>~/cka-answers/00-cp.txt<\/code>.<\/p>", "<p>Ghi phiên bản kubelet của <code>$NODE1<\/code> (ví dụ <code>v1.37.0<\/code>) vào <code>~/cka-answers/00-kubelet.txt<\/code>. Lấy từ <code>kubectl get node<\/code>, không gõ tay.<\/p>", "<p>Vào shell của <code>$NODE1<\/code> bằng <code>./lab ssh $NODE1<\/code>, chạy <code>crictl ps<\/code> để thấy container trên node, rồi <code>exit<\/code>.<\/p>"], "hints": [["Lấy phiên bản kubelet", "<p><code>kubectl get node $NODE1 -o jsonpath='{.status.nodeInfo.kubeletVersion}'<\/code><\/p>"], ["Máy dùng chip Apple", "<p>kind tự chọn image arm64. Cần Docker Desktop hoặc OrbStack với ít nhất 4 CPU và 6 GB RAM.<\/p>"]], "solution": "<pre><code class=\"language-bash\">./env/kind/up.sh\ncat &gt;&gt; ~/.bashrc &lt;&lt;'EOF'\nalias k=kubectl\nsource &lt;(kubectl completion bash)\ncomplete -o default -F __start_kubectl k\nexport do=&quot;--dry-run=client -o yaml&quot;\nexport now=&quot;--force --grace-period 0&quot;\nEOF\nsource ~/.bashrc\neval &quot;$(./lab env)&quot;\nmkdir -p ~/cka-answers\necho &quot;$CP&quot; &gt; ~/cka-answers/00-cp.txt\nkubectl get node &quot;$NODE1&quot; -o jsonpath='{.status.nodeInfo.kubeletVersion}' &gt; ~/cka-answers/00-kubelet.txt\n./lab ssh &quot;$NODE1&quot;     # rồi: crictl ps ; exit\n<\/code><\/pre>", "docs": [["kind quick start", "https://kind.sigs.k8s.io/docs/user/quick-start/"], ["kubectl cheat sheet", "https://kubernetes.io/docs/reference/kubectl/quick-reference/"]], "support": "guided", "prereq": [], "guide": [["Dựng cluster 3 node", "<p><code>up.sh<\/code> gọi <code>kind create cluster<\/code> với file <code>env/kind/cluster.yaml<\/code> (1 control plane + 2 worker), rồi cài metrics-server cho <code>kubectl top<\/code> và HPA. Thành phần riêng của từng bài (ingress controller, Gateway API…) do <code>./lab start<\/code> của bài đó cài.<\/p>\n<pre><code class=\"language-bash\">git clone https://github.com/TomJennyDev/cka-labs &amp;&amp; cd cka-labs\n./env/kind/up.sh\nkubectl get nodes -o wide\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 3 node <code>cka-control-plane<\/code>, <code>cka-worker<\/code>, <code>cka-worker2<\/code> ở trạng thái <code>Ready<\/code>, cột VERSION là <code>v1.37.x<\/code>.<\/p>\n<\/blockquote>\n<p>Nếu node đứng <code>NotReady<\/code> quá 2 phút: <code>kubectl describe node &lt;tên&gt;<\/code> và đọc phần <code>Conditions<\/code>.<\/p>"], ["Cấu hình terminal như phòng thi", "<p>Phòng thi có sẵn <code>alias k=kubectl<\/code> và bash completion. Hai biến <code>$do<\/code> và <code>$now<\/code> giúp bạn gõ nhanh hơn rất nhiều ở các bài sau.<\/p>\n<pre><code class=\"language-bash\">cat &gt;&gt; ~/.bashrc &lt;&lt;'EOF'\nalias k=kubectl\nsource &lt;(kubectl completion bash)\ncomplete -o default -F __start_kubectl k\nexport do=&quot;--dry-run=client -o yaml&quot;\nexport now=&quot;--force --grace-period 0&quot;\nEOF\nsource ~/.bashrc\nk get no          # thử: gõ &quot;k get no&quot; rồi bấm Tab\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>k get nodes<\/code> chạy được; gõ <code>k get po -n kube-<\/code> rồi bấm Tab thì bash tự điền namespace.<\/p>\n<\/blockquote>"], ["Kiểm tra công cụ và nạp tên node", "<p><code>./lab doctor<\/code> kiểm tra kubectl, docker, kind, helm và kết nối cluster. <code>./lab env<\/code> in ra 3 biến <code>CP<\/code>, <code>NODE1<\/code>, <code>NODE2<\/code>; <code>eval<\/code> biến chúng thành biến shell để dùng trong lệnh.<\/p>\n<pre><code class=\"language-bash\">./lab doctor\neval &quot;$(./lab env)&quot;\necho &quot;$CP $NODE1 $NODE2&quot;\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>cka-control-plane cka-worker cka-worker2<\/code>.<\/p>\n<\/blockquote>"], ["Ghi file đáp án đầu tiên", "<p>Nhiều bài yêu cầu ghi kết quả ra file. Luôn để lệnh tự sinh nội dung thay vì gõ tay, tránh sai chính tả.<\/p>\n<pre><code class=\"language-bash\">./lab start 0\nmkdir -p ~/cka-answers\necho &quot;$CP&quot; &gt; ~/cka-answers/00-cp.txt\n<\/code><\/pre>"], ["Lấy một trường bằng jsonpath", "<p><code>kubectl get -o jsonpath<\/code> đọc thẳng một trường trong object. Muốn biết đường dẫn trường, xem <code>kubectl get node $NODE1 -o yaml<\/code> trước.<\/p>\n<pre><code class=\"language-bash\">kubectl get node &quot;$NODE1&quot; -o yaml | grep -n kubeletVersion       # thấy nó nằm dưới status.nodeInfo\nkubectl get node &quot;$NODE1&quot; -o jsonpath='{.status.nodeInfo.kubeletVersion}' &gt; ~/cka-answers/00-kubelet.txt\ncat ~/cka-answers/00-kubelet.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> một dòng như <code>v1.37.0<\/code>.<\/p>\n<\/blockquote>"], ["Nhìn vào bên trong một node", "<p>Mỗi node kind là một container. Bên trong có kubelet và containerd thật. <code>crictl<\/code> là công cụ nói chuyện với container runtime: đề thi hay dùng nó khi kubectl không dùng được.<\/p>\n<pre><code class=\"language-bash\">./lab ssh &quot;$NODE1&quot;\ncrictl ps               # các container đang chạy trên node này\nsystemctl status kubelet --no-pager | head -5\nexit\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> thấy container <code>kube-proxy<\/code>, <code>kindnet-cni<\/code>… và kubelet <code>active (running)<\/code>.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">./lab check 0\n<\/code><\/pre>\n<p>Mọi dòng phải là ✔. Dòng nào ✘ có kèm giá trị hiện tại và giá trị cần có.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  you([&quot;Bạn: kubectl, ./lab&quot;]) --&gt;|&quot;~/.kube/config&quot;| api\n  subgraph docker [&quot;Docker trên laptop&quot;]\n    subgraph cp [&quot;cka-control-plane&quot;]\n      api[&quot;kube-apiserver&quot;]\n      etcd[(&quot;etcd&quot;)]\n      sch[&quot;kube-scheduler&quot;]\n      cm[&quot;kube-controller-manager&quot;]\n      k0[&quot;kubelet + containerd&quot;]\n    end\n    subgraph w1 [&quot;cka-worker&quot;]\n      k1[&quot;kubelet + containerd&quot;]\n    end\n    subgraph w2 [&quot;cka-worker2&quot;]\n      k2[&quot;kubelet + containerd&quot;]\n    end\n  end\n  api &lt;--&gt; etcd\n  sch --&gt; api\n  cm --&gt; api\n  k0 --&gt; api\n  k1 --&gt; api\n  k2 --&gt; api\n<\/code><\/pre>\n<p>Mỗi node của kind là một container Docker. Control plane chạy dưới dạng static pod, do kubelet trên <code>cka-control-plane<\/code> khởi động.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant L as ./lab\n  participant A as kube-apiserver\n  participant F as ~/cka-answers\n  U-&gt;&gt;L: ./lab start 0\n  L-&gt;&gt;A: setup.sh tạo tình huống\n  U-&gt;&gt;A: kubectl get node ... -o jsonpath\n  A--&gt;&gt;U: v1.37.x\n  U-&gt;&gt;F: ghi 00-kubelet.txt\n  U-&gt;&gt;L: ./lab check 0\n  L-&gt;&gt;A: đọc trạng thái cluster\n  L-&gt;&gt;F: đọc file đáp án\n  L--&gt;&gt;U: ✔ / ✘ từng tiêu chí\n<\/code><\/pre>\n<p>Mọi bài đều theo vòng này: <code>start<\/code> dựng tình huống, bạn sửa cluster hoặc ghi file, <code>check<\/code> so trạng thái thật với yêu cầu.<\/p>"]]}, {"id": 1, "slug": "kubeadm-install", "dir": "01-kubeadm-install", "title": "Cài cluster bằng kubeadm trên máy ảo", "level": 0, "env": "vm", "minutes": 60, "comps": ["arch:1", "arch:2", "arch:6"], "goal": "<p>Tự tay dựng cluster kubeadm 3 node: chuẩn bị node, <code>kubeadm init<\/code>, cài CNI, join worker. Đây là năng lực \"Prepare underlying infrastructure\" và \"Create and manage clusters using kubeadm\" của đề thi.<\/p>", "concepts": "<ul>\n<li>Mỗi node cần: tắt swap, module <code>overlay<\/code> và <code>br_netfilter<\/code>, sysctl <code>net.ipv4.ip_forward=1<\/code>, container runtime (containerd với <code>SystemdCgroup = true<\/code>), và 3 gói <code>kubeadm kubelet kubectl<\/code> cùng phiên bản, được <code>apt-mark hold<\/code>.<\/li>\n<li><code>kubeadm init<\/code> sinh chứng chỉ trong <code>/etc/kubernetes/pki<\/code>, kubeconfig trong <code>/etc/kubernetes/*.conf<\/code>, static pod trong <code>/etc/kubernetes/manifests<\/code>, rồi in lệnh <code>kubeadm join<\/code>.<\/li>\n<li>Node chỉ <code>Ready<\/code> khi đã có CNI. Lab này dùng Calico vì nó hỗ trợ NetworkPolicy.<\/li>\n<li><code>--control-plane-endpoint k8s-api:6443<\/code> đặt tên chung cho API server, để sau này thêm control plane thứ hai (lab 32).<\/li>\n<\/ul>", "setup_note": "<p>Lab này không dùng <code>./lab start<\/code>. Dựng 3 máy ảo trước:<\/p>\n<pre><code class=\"language-bash\">cd env/kubeadm &amp;&amp; vagrant up      # cp-1, worker-1, worker-2 với Kubernetes v1.36\nvagrant ssh cp-1\n<\/code><\/pre>\n<p><code>prepare-node.sh<\/code> đã chuẩn bị sẵn từng node (swap, module, sysctl, containerd, các gói kube*). Hãy đọc file đó: đề thi có thể yêu cầu bạn tự làm từng bước.<\/p>", "tasks": ["<p>Trên <code>cp-1<\/code>, kiểm tra node đã sẵn sàng: <code>swapon --show<\/code> trống, <code>sysctl net.ipv4.ip_forward<\/code> bằng 1, <code>systemctl is-active containerd<\/code> là active, <code>kubeadm version<\/code>.<\/p>", "<p>Khởi tạo control plane với: endpoint <code>k8s-api:6443<\/code>, pod CIDR <code>10.244.0.0/16<\/code>, địa chỉ quảng bá <code>192.168.56.10<\/code>, và tải cert lên để join control plane sau này.<\/p>", "<p>Cấu hình kubectl cho user <code>vagrant<\/code>.<\/p>", "<p>Cài Calico v3.33.0 với pool IP <code>10.244.0.0/16<\/code>.<\/p>", "<p>Join <code>worker-1<\/code> và <code>worker-2<\/code>. Chờ cả 3 node <code>Ready<\/code>.<\/p>", "<p>Clone repo này trên <code>cp-1<\/code> và chạy <code>./lab check 1<\/code>.<\/p>"], "hints": [["Lệnh init", "<p><code>kubeadm init --control-plane-endpoint ... --pod-network-cidr ... --apiserver-advertise-address ... --upload-certs<\/code><\/p>"], ["Mất lệnh join?", "<p><code>kubeadm token create --print-join-command<\/code><\/p>"], ["Calico manifest", "<p>Tải <code>calico.yaml<\/code>, bỏ comment biến <code>CALICO_IPV4POOL_CIDR<\/code> và đặt giá trị <code>10.244.0.0/16<\/code> trước khi apply.<\/p>"]], "solution": "<pre><code class=\"language-bash\"># trên cp-1\nsudo kubeadm init --control-plane-endpoint k8s-api:6443 \\\n  --pod-network-cidr 10.244.0.0/16 --apiserver-advertise-address 192.168.56.10 --upload-certs\nmkdir -p $HOME/.kube\nsudo cp /etc/kubernetes/admin.conf $HOME/.kube/config\nsudo chown $(id -u):$(id -g) $HOME/.kube/config\n\ncurl -LO https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml\nsed -i 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|; s|#   value: &quot;192.168.0.0/16&quot;|  value: &quot;10.244.0.0/16&quot;|' calico.yaml\nkubectl apply -f calico.yaml\n\nkubeadm token create --print-join-command\n# chạy lệnh in ra trên worker-1 và worker-2 với sudo:\nssh worker-1 sudo kubeadm join k8s-api:6443 --token &lt;token&gt; --discovery-token-ca-cert-hash sha256:&lt;hash&gt;\nssh worker-2 sudo kubeadm join k8s-api:6443 --token &lt;token&gt; --discovery-token-ca-cert-hash sha256:&lt;hash&gt;\nkubectl get nodes -w\n<\/code><\/pre>\n<p>Nếu node đứng <code>NotReady<\/code>: <code>kubectl -n kube-system get pods -l k8s-app=calico-node<\/code> và <code>journalctl -u kubelet<\/code> trên node đó.<\/p>", "docs": [["Creating a cluster with kubeadm", "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/create-cluster-kubeadm/"], ["Container runtimes", "https://kubernetes.io/docs/setup/production-environment/container-runtimes/"]], "support": "guided", "prereq": [0], "guide": [["Kiểm tra node đã được chuẩn bị", "<p>Trước <code>kubeadm init<\/code>, mọi node phải đạt 4 điều kiện. Đề thi có thể bắt bạn tự làm từng điều kiện, nên hãy đọc <code>env/kubeadm/prepare-node.sh<\/code> để biết mỗi điều kiện ứng với lệnh nào.<\/p>\n<pre><code class=\"language-bash\">vagrant ssh cp-1\nswapon --show                                  # không in gì = đã tắt swap\nlsmod | grep -E 'overlay|br_netfilter'\nsysctl net.ipv4.ip_forward                     # = 1\nsystemctl is-active containerd                 # active\ngrep SystemdCgroup /etc/containerd/config.toml # = true\nkubeadm version -o short\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> tất cả đúng như chú thích. Nếu <code>SystemdCgroup = false<\/code>, kubelet và containerd dùng hai cgroup driver khác nhau và Pod sẽ restart liên tục.<\/p>\n<\/blockquote>"], ["Khởi tạo control plane", "<p>Mỗi cờ có lý do:<\/p>\n<ul>\n<li><code>--control-plane-endpoint k8s-api:6443<\/code> là tên chung cho API server (có trong <code>/etc/hosts<\/code>), để lab 32 thêm control plane thứ hai mà không phải cấp lại chứng chỉ.<\/li>\n<li><code>--pod-network-cidr<\/code> phải khớp pool IP của CNI.<\/li>\n<li><code>--apiserver-advertise-address<\/code> chọn card mạng host-only, không dùng card NAT của Vagrant.<\/li>\n<li><code>--upload-certs<\/code> đẩy chứng chỉ lên Secret để control plane khác join được.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">sudo kubeadm init --control-plane-endpoint k8s-api:6443 \\\n  --pod-network-cidr 10.244.0.0/16 \\\n  --apiserver-advertise-address 192.168.56.10 --upload-certs | tee ~/init.log\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> dòng <code>Your Kubernetes control-plane has initialized successfully!<\/code> và hai lệnh <code>kubeadm join<\/code> (một cho control plane, một cho worker).<\/p>\n<\/blockquote>"], ["Cấu hình kubectl", "<p><code>admin.conf<\/code> chứa chứng chỉ quyền cao nhất cluster. Chép nó cho user thường dùng.<\/p>\n<pre><code class=\"language-bash\">mkdir -p $HOME/.kube\nsudo cp /etc/kubernetes/admin.conf $HOME/.kube/config\nsudo chown $(id -u):$(id -g) $HOME/.kube/config\nkubectl get nodes\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>cp-1   NotReady<\/code>. NotReady là đúng: chưa có CNI nên kubelet báo mạng Pod chưa sẵn sàng.<\/p>\n<\/blockquote>"], ["Cài CNI Calico", "<p>CNI cấp IP cho Pod và nối mạng giữa các node. Pool IP của Calico phải trùng <code>--pod-network-cidr<\/code>.<\/p>\n<pre><code class=\"language-bash\">curl -LO https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml\ngrep -n -A1 CALICO_IPV4POOL_CIDR calico.yaml        # xem 2 dòng đang bị comment\nsed -i 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|; s|#   value: &quot;192.168.0.0/16&quot;|  value: &quot;10.244.0.0/16&quot;|' calico.yaml\nkubectl apply -f calico.yaml\nkubectl get pods -n kube-system -w                  # chờ calico-node Running, Ctrl+C để thoát\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> sau 1–2 phút <code>kubectl get nodes<\/code> báo <code>cp-1 Ready<\/code>.<\/p>\n<\/blockquote>"], ["Join hai worker", "<p>Token trong <code>init.log<\/code> hết hạn sau 24 giờ. Lệnh dưới luôn in ra một lệnh join mới.<\/p>\n<pre><code class=\"language-bash\">JOIN=$(kubeadm token create --print-join-command)\necho &quot;$JOIN&quot;\nssh worker-1 &quot;sudo $JOIN&quot;\nssh worker-2 &quot;sudo $JOIN&quot;\nkubectl get nodes -w\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 3 node <code>Ready<\/code>. Worker chưa có ROLES, đó là bình thường.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">git clone https://github.com/TomJennyDev/cka-labs &amp;&amp; cd cka-labs\n./lab check 1\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart TB\n  subgraph cp1 [&quot;cp-1 · 192.168.56.10&quot;]\n    direction LR\n    m[&quot;/etc/kubernetes/manifests&quot;] --&gt; kl0[&quot;kubelet&quot;]\n    kl0 --&gt; sp[&quot;static pod: apiserver, etcd,&lt;br/&gt;scheduler, controller-manager&quot;]\n    pki[&quot;/etc/kubernetes/pki&quot;]\n  end\n  w1[&quot;worker-1&lt;br/&gt;kubelet + containerd&quot;] --&gt;|&quot;kubeadm join&quot;| ep\n  w2[&quot;worker-2&lt;br/&gt;kubelet + containerd&quot;] --&gt;|&quot;kubeadm join&quot;| ep\n  ep([&quot;k8s-api:6443&quot;]) --&gt; sp\n  cni[&quot;Calico&lt;br/&gt;pool 10.244.0.0/16&quot;] -.-&gt;|&quot;DaemonSet trên mọi node&quot;| w1\n  cni -.-&gt; w2\n  cni -.-&gt; cp1\n<\/code><\/pre>\n<p><code>k8s-api<\/code> là tên chung cho API server. Hiện nó trỏ về cp-1; ở lab 32 nó sẽ trỏ tới cả 3 control plane.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor U as Bạn\n  participant KA as kubeadm init\n  participant KL as kubelet cp-1\n  participant API as kube-apiserver\n  participant W as worker\n  U-&gt;&gt;KA: kubeadm init --control-plane-endpoint ...\n  KA-&gt;&gt;KA: preflight: swap, cgroup, cổng\n  KA-&gt;&gt;KA: sinh CA và chứng chỉ trong pki\n  KA-&gt;&gt;KL: ghi manifest static pod\n  KL-&gt;&gt;API: khởi động etcd và control plane\n  KA-&gt;&gt;API: tạo token, ConfigMap kubeadm-config\n  KA--&gt;&gt;U: lệnh kubeadm join\n  U-&gt;&gt;API: kubectl apply calico.yaml\n  Note over API: node chuyển NotReady → Ready\n  U-&gt;&gt;W: kubeadm join k8s-api:6443 --token ...\n  W-&gt;&gt;API: TLS bootstrap, xin chứng chỉ kubelet\n  API--&gt;&gt;W: chứng chỉ đã ký\n  W-&gt;&gt;API: đăng ký Node\n<\/code><\/pre>"]]}, {"id": 2, "slug": "kubectl-api", "dir": "02-kubectl-api", "title": "kubectl, namespace, context và Kubernetes API", "level": 1, "env": "any", "minutes": 20, "comps": [], "goal": "<p>Thao tác nhanh với namespace và context, tra cứu API bằng <code>api-resources<\/code> và <code>explain<\/code>, đọc trạng thái cluster mà không cần mở tài liệu.<\/p>", "concepts": "<ul>\n<li>Mọi object có <code>apiVersion<\/code>, <code>kind<\/code>, <code>metadata<\/code>, <code>spec<\/code>, <code>status<\/code>. Deployment thuộc group <code>apps<\/code>, version <code>v1<\/code>; Pod thuộc core group nên chỉ ghi <code>v1<\/code>.<\/li>\n<li>Một số resource thuộc namespace (Pod, Service), một số thuộc cả cluster (Node, PersistentVolume, ClusterRole). <code>kubectl api-resources --namespaced=false<\/code> liệt kê nhóm sau.<\/li>\n<li>Context = cluster + user + namespace mặc định. Mỗi câu thi bắt đầu bằng <code>kubectl config use-context …<\/code>.<\/li>\n<li><code>kubectl explain pod.spec.containers --recursive<\/code> là cách nhanh nhất để nhớ tên field.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo namespace <code>lab02<\/code> có label <code>team=blue<\/code>.<\/p>", "<p>Tạo context <code>lab02-ctx<\/code> dùng cùng cluster và user với context hiện tại, namespace mặc định <code>lab02<\/code>. <strong>Không<\/strong> chuyển sang context đó.<\/p>", "<p>Ghi <code>apiVersion<\/code> của CronJob (ví dụ dạng <code>group/version<\/code>) vào <code>~/cka-answers/02-cronjob-api.txt<\/code>.<\/p>", "<p>Ghi <strong>số lượng<\/strong> loại resource cluster-scoped mà cluster hỗ trợ vào <code>~/cka-answers/02-cluster-scoped.txt<\/code>.<\/p>", "<p>Namespace <code>lab02-apps<\/code> (đã tạo sẵn) có nhiều Pod. Ghi tên Pod có label <code>tier=db<\/code> vào <code>~/cka-answers/02-db-pod.txt<\/code>, và tên node nó đang chạy vào <code>~/cka-answers/02-db-node.txt<\/code>.<\/p>"], "hints": [["Tạo context", "<p><code>kubectl config set-context lab02-ctx --cluster=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}') --user=... --namespace=lab02<\/code><\/p>"], ["Đếm resource", "<p><code>kubectl api-resources --namespaced=false --no-headers | wc -l<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create ns lab02\nkubectl label ns lab02 team=blue\n\nCL=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')\nUS=$(kubectl config view --minify -o jsonpath='{.users[0].name}')\nkubectl config set-context lab02-ctx --cluster=&quot;$CL&quot; --user=&quot;$US&quot; --namespace=lab02\n\nkubectl api-resources | grep -i cronjob          # cronjobs  cj  batch/v1  true  CronJob\necho batch/v1 &gt; ~/cka-answers/02-cronjob-api.txt\n\nkubectl api-resources --namespaced=false --no-headers | wc -l &gt; ~/cka-answers/02-cluster-scoped.txt\n\nkubectl get pods -n lab02-apps -l tier=db -o wide\nkubectl get pods -n lab02-apps -l tier=db -o jsonpath='{.items[0].metadata.name}' &gt; ~/cka-answers/02-db-pod.txt\nkubectl get pods -n lab02-apps -l tier=db -o jsonpath='{.items[0].spec.nodeName}' &gt; ~/cka-answers/02-db-node.txt\n<\/code><\/pre>", "docs": [["Namespaces", "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"], ["Organizing access with kubeconfig", "https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/"]], "support": "guided", "prereq": [0], "guide": [["Tạo namespace rồi gắn label", "<p>Namespace là \"thư mục\" chứa object. Lệnh <code>create<\/code> tạo object, lệnh <code>label<\/code> gắn nhãn vào object đã có.<\/p>\n<pre><code class=\"language-bash\">./lab start 2\nkubectl create ns lab02\nkubectl label ns lab02 team=blue\nkubectl get ns lab02 --show-labels\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> cột LABELS có <code>team=blue<\/code> (cùng label tự động <code>kubernetes.io/metadata.name=lab02<\/code>).<\/p>\n<\/blockquote>"], ["Hiểu kubeconfig: cluster, user, context", "<p>File <code>~/.kube/config<\/code> có 3 danh sách. <strong>cluster<\/strong> là địa chỉ API và CA, <strong>user<\/strong> là chứng chỉ hoặc token, còn <strong>context<\/strong> là một cặp cluster + user + namespace mặc định. <code>--minify<\/code> chỉ in phần của context hiện tại.<\/p>\n<pre><code class=\"language-bash\">kubectl config get-contexts\nkubectl config view --minify\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> dấu <code>*<\/code> đánh dấu context đang dùng; thấy tên cluster và tên user của nó.<\/p>\n<\/blockquote>"], ["Tạo context mới mà không chuyển sang", "<p>Lấy tên cluster và user bằng jsonpath để khỏi gõ sai. <code>set-context<\/code> chỉ thêm hoặc sửa context, không đổi context hiện tại. Lệnh chuyển là <code>use-context<\/code>, và bài này <strong>không<\/strong> dùng nó.<\/p>\n<pre><code class=\"language-bash\">CL=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')\nUS=$(kubectl config view --minify -o jsonpath='{.users[0].name}')\nkubectl config set-context lab02-ctx --cluster=&quot;$CL&quot; --user=&quot;$US&quot; --namespace=lab02\nkubectl config get-contexts\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> có dòng <code>lab02-ctx<\/code>, dấu <code>*<\/code> vẫn nằm ở context cũ.<\/p>\n<\/blockquote>\n<p>Trong phòng thi, <strong>mỗi câu<\/strong> bắt đầu bằng một lệnh <code>kubectl config use-context …<\/code>. Luôn chạy lệnh đó trước khi làm.<\/p>"], ["Khám phá API bằng api-resources", "<p><code>api-resources<\/code> liệt kê mọi loại object cluster hỗ trợ: tên, tên tắt, API group/version, có thuộc namespace không. Đây là cách nhanh nhất để biết <code>apiVersion<\/code> cần ghi trong YAML.<\/p>\n<pre><code class=\"language-bash\">kubectl api-resources | head\nkubectl api-resources | grep -i cronjob\necho batch/v1 &gt; ~/cka-answers/02-cronjob-api.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>cronjobs  cj  batch/v1  true  CronJob<\/code>: tên tắt <code>cj<\/code>, apiVersion <code>batch/v1<\/code>, <code>true<\/code> là có namespace.<\/p>\n<\/blockquote>"], ["Đếm resource cluster-scoped", "<p>Object không thuộc namespace nào (Node, PV, ClusterRole…) gọi là cluster-scoped. <code>--no-headers<\/code> bỏ dòng tiêu đề để <code>wc -l<\/code> đếm đúng.<\/p>\n<pre><code class=\"language-bash\">kubectl api-resources --namespaced=false\nkubectl api-resources --namespaced=false --no-headers | wc -l &gt; ~/cka-answers/02-cluster-scoped.txt\n<\/code><\/pre>"], ["Lọc Pod theo label và xem node", "<p><code>-l<\/code> lọc theo label, <code>-o wide<\/code> thêm cột IP và NODE. Khi đã tìm được, dùng jsonpath để ghi đúng một giá trị.<\/p>\n<pre><code class=\"language-bash\">kubectl get pods -n lab02-apps --show-labels\nkubectl get pods -n lab02-apps -l tier=db -o wide\nkubectl get pods -n lab02-apps -l tier=db -o jsonpath='{.items[0].metadata.name}' &gt; ~/cka-answers/02-db-pod.txt\nkubectl get pods -n lab02-apps -l tier=db -o jsonpath='{.items[0].spec.nodeName}' &gt; ~/cka-answers/02-db-node.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> đúng một Pod tên <code>pg-…<\/code>. Kết quả <code>get<\/code> nhiều object là một List, nên jsonpath bắt đầu bằng <code>.items[0]<\/code>.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">./lab check 2\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph kc [&quot;~/.kube/config&quot;]\n    c1[&quot;cluster: địa chỉ API + CA&quot;]\n    u1[&quot;user: chứng chỉ client&quot;]\n    x1[&quot;context hiện tại&quot;] --&gt; c1\n    x1 --&gt; u1\n    x2[&quot;lab02-ctx&lt;br/&gt;namespace: lab02&quot;] --&gt; c1\n    x2 --&gt; u1\n  end\n  subgraph cl [&quot;Cluster&quot;]\n    ns1[&quot;ns lab02&lt;br/&gt;team=blue&quot;]\n    subgraph ns2 [&quot;ns lab02-apps&quot;]\n      p1[&quot;web · tier=front&quot;]\n      p2[&quot;api · tier=back&quot;]\n      p3[&quot;cache · tier=back&quot;]\n      p4[&quot;pg · tier=db&quot;]\n    end\n  end\n  x1 ==&gt; cl\n<\/code><\/pre>\n<p>Context chỉ là một cặp cluster + user + namespace mặc định. Tạo context mới không đổi context đang dùng.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant K as kubectl\n  participant A as kube-apiserver\n  participant E as etcd\n  K-&gt;&gt;K: đọc context hiện tại trong kubeconfig\n  K-&gt;&gt;A: GET /apis (discovery)\n  A--&gt;&gt;K: danh sách group/version/resource\n  Note over K: kubectl api-resources đọc từ đây\n  K-&gt;&gt;A: GET /api/v1/namespaces/lab02-apps/pods?labelSelector=tier=db\n  A-&gt;&gt;A: xác thực, phân quyền RBAC\n  A-&gt;&gt;E: đọc object\n  E--&gt;&gt;A: dữ liệu\n  A--&gt;&gt;K: PodList JSON\n  K-&gt;&gt;K: áp jsonpath .items[0].spec.nodeName\n<\/code><\/pre>"]]}, {"id": 3, "slug": "pods", "dir": "03-pods", "title": "Pod, label, log và exec", "level": 1, "env": "any", "minutes": 25, "comps": ["trouble:3"], "goal": "<p>Tạo và sửa Pod thật nhanh bằng lệnh imperative, đọc log, chạy lệnh trong container, và biết field nào của Pod đang chạy thì sửa được.<\/p>", "concepts": "<ul>\n<li><code>kubectl run<\/code> tạo Pod; <code>--labels<\/code>, <code>--env<\/code>, <code>--port<\/code>, <code>--command -- …<\/code> bao phủ phần lớn yêu cầu.<\/li>\n<li>Phần lớn spec của Pod đang chạy là bất biến. Sửa được tại chỗ: <code>image<\/code> của container, <code>activeDeadlineSeconds<\/code>, <code>tolerations<\/code> (chỉ thêm), label và annotation.<\/li>\n<li>Field khác (command, env, resources…) phải xóa rồi tạo lại: <code>kubectl get pod x -o yaml &gt; x.yaml<\/code>, sửa, <code>kubectl replace --force -f x.yaml<\/code>.<\/li>\n<li><code>kubectl logs<\/code> đọc stdout/stderr; <code>--previous<\/code> cho lần chạy trước khi container bị restart; <code>-c<\/code> chọn container.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong namespace <code>lab03<\/code>, tạo Pod <code>web<\/code> image <code>nginx:1.27<\/code>, label <code>app=web<\/code> và <code>tier=front<\/code>, khai báo containerPort 80.<\/p>", "<p>Tạo Pod <code>worker<\/code> image <code>busybox:1.36<\/code>, biến môi trường <code>MODE=lab<\/code>, chạy lệnh <code>sh -c 'echo started; sleep 3600'<\/code>.<\/p>", "<p>Pod <code>noisy<\/code> đang ghi log. Ghi mọi dòng chứa <code>ERROR<\/code> trong log của nó vào <code>~/cka-answers/03-errors.txt<\/code>.<\/p>", "<p>Pod <code>broken<\/code> đứng <code>ImagePullBackOff<\/code>. Sửa nó chạy được với image <code>nginx:1.27<\/code> mà <strong>không xóa Pod<\/strong>.<\/p>", "<p>Ghi hostname bên trong container của Pod <code>web<\/code> vào <code>~/cka-answers/03-hostname.txt<\/code> (lấy bằng <code>kubectl exec<\/code>).<\/p>", "<p>Xóa ngay Pod <code>old<\/code> (không chờ grace period).<\/p>"], "hints": [["Đặt namespace mặc định cho đỡ gõ", "<p><code>kubectl config set-context --current --namespace=lab03<\/code> (nhớ đổi lại <code>default<\/code> sau lab).<\/p>"], ["Sửa image tại chỗ", "<p><code>kubectl set image pod/broken &lt;tên-container&gt;=nginx:1.27<\/code>. Tên container xem bằng <code>kubectl get pod broken -o jsonpath='{.spec.containers[*].name}'<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl run web -n lab03 --image=nginx:1.27 --labels=app=web,tier=front --port=80\nkubectl run worker -n lab03 --image=busybox:1.36 --env=MODE=lab --command -- sh -c 'echo started; sleep 3600'\nkubectl logs noisy -n lab03 | grep ERROR &gt; ~/cka-answers/03-errors.txt\nkubectl get pod broken -n lab03 -o jsonpath='{.spec.containers[*].name}'   # app\nkubectl set image pod/broken -n lab03 app=nginx:1.27\nkubectl exec web -n lab03 -- hostname &gt; ~/cka-answers/03-hostname.txt\nkubectl delete pod old -n lab03 --force --grace-period 0\n<\/code><\/pre>", "docs": [["Pods", "https://kubernetes.io/docs/concepts/workloads/pods/"], ["kubectl run", "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/"]], "support": "guided", "prereq": [2], "guide": [["Tạo Pod bằng kubectl run", "<p><code>kubectl run<\/code> tạo một Pod. <code>--labels<\/code> gắn nhiều label cách nhau dấu phẩy, <code>--port<\/code> khai báo <code>containerPort<\/code>. Muốn xem YAML nó sẽ tạo, thêm <code>$do<\/code>.<\/p>\n<pre><code class=\"language-bash\">./lab start 3\nkubectl run web -n lab03 --image=nginx:1.27 --labels=app=web,tier=front --port=80 $do   # chỉ xem\nkubectl run web -n lab03 --image=nginx:1.27 --labels=app=web,tier=front --port=80\nkubectl get pod web -n lab03 --show-labels\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>web 1/1 Running<\/code>, labels <code>app=web,tier=front<\/code>.<\/p>\n<\/blockquote>"], ["Pod có biến môi trường và lệnh riêng", "<p>Mọi thứ sau <code>--<\/code> là lệnh của container. Có <code>--command<\/code> thì lệnh thay <strong>ENTRYPOINT<\/strong> của image, không có thì nó chỉ thay <strong>CMD<\/strong>. Với busybox, dùng <code>--command -- sh -c '…'<\/code> cho chắc.<\/p>\n<pre><code class=\"language-bash\">kubectl run worker -n lab03 --image=busybox:1.36 --env=MODE=lab --command -- sh -c 'echo started; sleep 3600'\nkubectl logs worker -n lab03\nkubectl exec worker -n lab03 -- printenv MODE\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> log in <code>started<\/code>, biến <code>MODE<\/code> là <code>lab<\/code>.<\/p>\n<\/blockquote>"], ["Đọc và lọc log", "<p><code>kubectl logs<\/code> in stdout và stderr của container. Các cờ hay dùng: <code>-f<\/code> theo dõi, <code>--tail=20<\/code>, <code>--previous<\/code> (log của lần chạy trước khi restart), <code>-c<\/code> chọn container.<\/p>\n<pre><code class=\"language-bash\">kubectl logs noisy -n lab03\nkubectl logs noisy -n lab03 | grep ERROR &gt; ~/cka-answers/03-errors.txt\ncat ~/cka-answers/03-errors.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 3 dòng <code>ERROR timeout calling payments (…)<\/code>.<\/p>\n<\/blockquote>"], ["Chẩn đoán ImagePullBackOff", "<p>Khi Pod không chạy, <code>describe<\/code> là lệnh đầu tiên, và phần <strong>Events<\/strong> ở cuối cho biết lý do. Image của Pod là trường được phép sửa trực tiếp, nên không cần xóa Pod.<\/p>\n<pre><code class=\"language-bash\">kubectl get pod broken -n lab03\nkubectl describe pod broken -n lab03 | tail -8                 # Failed to pull image &quot;nginx:1.27-does-not-exist&quot;\nkubectl get pod broken -n lab03 -o jsonpath='{.spec.containers[*].name}'   # tên container: app\nkubectl set image pod/broken -n lab03 app=nginx:1.27\nkubectl get pod broken -n lab03 -w                             # Ctrl+C khi thấy Running\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>broken<\/code> chuyển sang <code>Running<\/code>, cột RESTARTS vẫn giữ, và UID không đổi (cùng một Pod).<\/p>\n<\/blockquote>"], ["Chạy lệnh trong container", "<p><code>kubectl exec &lt;pod&gt; -- &lt;lệnh&gt;<\/code> chạy lệnh rồi trả kết quả. Thêm <code>-it<\/code> và <code>sh<\/code> để vào shell tương tác.<\/p>\n<pre><code class=\"language-bash\">kubectl exec web -n lab03 -- hostname &gt; ~/cka-answers/03-hostname.txt\ncat ~/cka-answers/03-hostname.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>web<\/code>. Hostname của Pod mặc định trùng tên Pod.<\/p>\n<\/blockquote>"], ["Xóa Pod ngay lập tức", "<p>Bình thường kubelet gửi SIGTERM rồi chờ 30 giây. Pod <code>old<\/code> cố tình bỏ qua SIGTERM, nên <code>delete<\/code> thường sẽ treo 30 giây. <code>$now<\/code> (đặt ở lab 00) là <code>--force --grace-period 0<\/code>.<\/p>\n<pre><code class=\"language-bash\">time kubectl delete pod old -n lab03 $now\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> xong trong khoảng 1 giây, kèm cảnh báo <code>Immediate deletion does not wait for confirmation…<\/code>.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">./lab check 3\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph ns [&quot;ns lab03&quot;]\n    web[&quot;web&lt;br/&gt;nginx · app=web,tier=front&quot;]\n    worker[&quot;worker&lt;br/&gt;busybox · MODE=lab&quot;]\n    noisy[&quot;noisy&lt;br/&gt;ghi INFO/ERROR ra stdout&quot;]\n    broken[&quot;broken&lt;br/&gt;image sai tag&quot;]\n    old[&quot;old&lt;br/&gt;bỏ qua SIGTERM&quot;]\n  end\n  you([&quot;Bạn&quot;]) --&gt;|&quot;kubectl run&quot;| web\n  you --&gt;|&quot;kubectl run --env --command&quot;| worker\n  you --&gt;|&quot;logs | grep&quot;| noisy\n  you --&gt;|&quot;set image&quot;| broken\n  you --&gt;|&quot;delete --force --grace-period 0&quot;| old\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class broken bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant K as kubectl\n  participant A as kube-apiserver\n  participant S as kube-scheduler\n  participant KL as kubelet\n  participant R as containerd\n  K-&gt;&gt;A: POST Pod web\n  A--&gt;&gt;K: 201 Created (Pending)\n  S-&gt;&gt;A: watch Pod chưa có node\n  S-&gt;&gt;A: bind Pod → node (điền spec.nodeName)\n  KL-&gt;&gt;A: watch Pod của node mình\n  KL-&gt;&gt;R: kéo image, tạo container\n  alt image không tồn tại\n    R--&gt;&gt;KL: lỗi pull\n    KL-&gt;&gt;A: status ErrImagePull → ImagePullBackOff\n  else thành công\n    KL-&gt;&gt;A: status Running\n  end\n  K-&gt;&gt;A: GET pods/web/log\n  A-&gt;&gt;KL: chuyển tiếp tới kubelet\n  KL--&gt;&gt;K: stdout của container\n<\/code><\/pre>\n<p><code>kubectl logs<\/code> và <code>kubectl exec<\/code> đi qua API server rồi tới kubelet trên node. Log không nằm trong etcd.<\/p>"]]}, {"id": 4, "slug": "yaml-jsonpath", "dir": "04-yaml-jsonpath", "title": "Sinh YAML nhanh và trích xuất bằng jsonpath", "level": 1, "env": "any", "minutes": 25, "comps": ["trouble:2"], "goal": "<p>Viết YAML bằng <code>--dry-run=client -o yaml<\/code> thay vì gõ tay, và trích đúng dữ liệu đề yêu cầu bằng jsonpath, custom-columns, sort-by.<\/p>", "concepts": "<ul>\n<li><code>kubectl create deploy … $do &gt; file.yaml<\/code> cho khung YAML đúng cú pháp; chỉ cần sửa phần còn thiếu.<\/li>\n<li>jsonpath: <code>{.items[*].metadata.name}<\/code> lấy danh sách; <code>{range .items[*]}{.a} {.b}{\"\\n\"}{end}<\/code> in từng dòng; <code>[?(@.type==\"InternalIP\")]<\/code> lọc phần tử.<\/li>\n<li><code>-o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[*].image<\/code> in bảng theo ý muốn; <code>--sort-by=.metadata.name<\/code> sắp xếp.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Sinh YAML Deployment <code>api<\/code> (image <code>nginx:1.27<\/code>, 2 replica) bằng dry-run, lưu vào <code>~/cka-answers/04-api.yaml<\/code>. Sửa file để Pod template có thêm label <code>tier=backend<\/code>, rồi apply vào namespace <code>lab04<\/code>.<\/p>", "<p>Ghi vào <code>~/cka-answers/04-pod-ips.txt<\/code> mỗi dòng một Pod trong <code>lab04<\/code> theo dạng <code>&lt;tên&gt; &lt;podIP&gt;<\/code>.<\/p>", "<p>Ghi InternalIP của mọi node vào <code>~/cka-answers/04-node-ips.txt<\/code>, cách nhau bởi dấu cách, trên một dòng.<\/p>", "<p>Ghi vào <code>~/cka-answers/04-images.txt<\/code> bảng hai cột <code>POD<\/code> và <code>IMAGE<\/code> của các Pod trong <code>lab04<\/code>, sắp xếp theo tên Pod.<\/p>"], "hints": [["Một dòng cho mỗi Pod", "<p><code>kubectl get pods -n lab04 -o jsonpath='{range .items[*]}{.metadata.name} {.status.podIP}{\"\\n\"}{end}'<\/code><\/p>"], ["Lọc theo type", "<p><code>{.items[*].status.addresses[?(@.type==\"InternalIP\")].address}<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create deploy api --image=nginx:1.27 --replicas=2 $do &gt; ~/cka-answers/04-api.yaml\n# sửa file: dưới spec.template.metadata.labels thêm  tier: backend\nkubectl apply -n lab04 -f ~/cka-answers/04-api.yaml\nkubectl rollout status deploy/api -n lab04\n\nkubectl get pods -n lab04 -o jsonpath='{range .items[*]}{.metadata.name} {.status.podIP}{&quot;\\n&quot;}{end}' &gt; ~/cka-answers/04-pod-ips.txt\nkubectl get nodes -o jsonpath='{.items[*].status.addresses[?(@.type==&quot;InternalIP&quot;)].address}' &gt; ~/cka-answers/04-node-ips.txt\nkubectl get pods -n lab04 --sort-by=.metadata.name -o custom-columns=POD:.metadata.name,IMAGE:.spec.containers[*].image &gt; ~/cka-answers/04-images.txt\n<\/code><\/pre>", "docs": [["JSONPath support", "https://kubernetes.io/docs/reference/kubectl/jsonpath/"], ["kubectl quick reference", "https://kubernetes.io/docs/reference/kubectl/quick-reference/"]], "support": "guided", "prereq": [3], "guide": [["Sinh YAML thay vì viết từ đầu", "<p>Trong phòng thi gần như không ai gõ YAML từ con số 0. Quy trình chuẩn: <code>create … $do &gt; file<\/code>, sửa file, rồi <code>apply<\/code>.<\/p>\n<pre><code class=\"language-bash\">./lab start 4\nkubectl create deploy api --image=nginx:1.27 --replicas=2 $do &gt; ~/cka-answers/04-api.yaml\ncat ~/cka-answers/04-api.yaml\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> một Deployment có <code>metadata<\/code>, <code>spec.selector<\/code>, <code>spec.template<\/code> và trường thừa <code>creationTimestamp: null<\/code>, <code>status: {}<\/code> (để nguyên cũng không sao).<\/p>\n<\/blockquote>"], ["Sửa Pod template", "<p>Deployment có hai chỗ chứa label. <code>spec.selector.matchLabels<\/code> chọn Pod và <strong>không đổi được<\/strong> sau khi tạo. <code>spec.template.metadata.labels<\/code> là label của Pod; label mới thêm vào chỗ này. Selector phải là tập con của label template.<\/p>\n<pre><code class=\"language-bash\">vi ~/cka-answers/04-api.yaml\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">  template:\n    metadata:\n      labels:\n        app: api\n        tier: backend      # thêm dòng này\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -n lab04 -f ~/cka-answers/04-api.yaml\nkubectl get pods -n lab04 -l tier=backend\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 2 Pod <code>api-…<\/code> Running có label <code>tier=backend<\/code>.<\/p>\n<\/blockquote>\n<p>Tra nhanh tên trường bằng <code>kubectl explain deploy.spec.template.metadata<\/code> hoặc <code>kubectl explain pod.spec --recursive | less<\/code>.<\/p>"], ["jsonpath với range", "<p><code>{range .items[*]}…{end}<\/code> lặp qua từng phần tử, <code>{\"\\n\"}<\/code> xuống dòng. Hãy thử từng phần trước khi ghi file.<\/p>\n<pre><code class=\"language-bash\">kubectl get pods -n lab04 -o jsonpath='{.items[*].metadata.name}'; echo\nkubectl get pods -n lab04 -o jsonpath='{range .items[*]}{.metadata.name} {.status.podIP}{&quot;\\n&quot;}{end}'\nkubectl get pods -n lab04 -o jsonpath='{range .items[*]}{.metadata.name} {.status.podIP}{&quot;\\n&quot;}{end}' &gt; ~/cka-answers/04-pod-ips.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 3 dòng (<code>cache<\/code> và 2 Pod <code>api<\/code>), mỗi dòng <code>tên IP<\/code>.<\/p>\n<\/blockquote>"], ["Lọc mảng bằng điều kiện", "<p><code>status.addresses<\/code> của node là một mảng gồm nhiều loại địa chỉ. <code>[?(@.type==\"InternalIP\")]<\/code> chỉ giữ phần tử thỏa điều kiện.<\/p>\n<pre><code class=\"language-bash\">kubectl get node &quot;$NODE1&quot; -o jsonpath='{.status.addresses}'; echo\nkubectl get nodes -o jsonpath='{.items[*].status.addresses[?(@.type==&quot;InternalIP&quot;)].address}' &gt; ~/cka-answers/04-node-ips.txt\ncat ~/cka-answers/04-node-ips.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 3 IP trên một dòng, cách nhau dấu cách.<\/p>\n<\/blockquote>"], ["Bảng tùy biến và sắp xếp", "<p><code>custom-columns=TIÊU_ĐỀ:đường.dẫn,…<\/code> dựng bảng theo ý bạn. <code>--sort-by<\/code> nhận một đường dẫn jsonpath.<\/p>\n<pre><code class=\"language-bash\">kubectl get pods -n lab04 --sort-by=.metadata.name \\\n  -o custom-columns=POD:.metadata.name,IMAGE:.spec.containers[*].image &gt; ~/cka-answers/04-images.txt\ncat ~/cka-answers/04-images.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> tiêu đề <code>POD  IMAGE<\/code>, rồi 3 dòng xếp theo tên.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">./lab check 4\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  gen[&quot;kubectl create deploy api&lt;br/&gt;--dry-run=client -o yaml&quot;] --&gt; file[&quot;04-api.yaml&quot;]\n  file --&gt;|&quot;sửa: thêm tier=backend&lt;br/&gt;vào template&quot;| file2[&quot;04-api.yaml đã sửa&quot;]\n  file2 --&gt;|&quot;kubectl apply -n lab04&quot;| d[&quot;Deployment api&quot;]\n  d --&gt; rs[&quot;ReplicaSet&quot;] --&gt; p1[&quot;Pod api-1&quot;]\n  rs --&gt; p2[&quot;Pod api-2&quot;]\n  c[&quot;Pod cache (có sẵn)&quot;]\n  p1 &amp; p2 &amp; c --&gt;|&quot;jsonpath / custom-columns&quot;| out[&quot;04-pod-ips.txt&lt;br/&gt;04-images.txt&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant K as kubectl\n  participant A as kube-apiserver\n  Note over K: --dry-run=client: không gửi gì lên server\n  K-&gt;&gt;K: dựng object Deployment trong bộ nhớ\n  K--&gt;&gt;K: in YAML ra file\n  K-&gt;&gt;A: apply: PATCH (server-side merge)\n  A--&gt;&gt;K: Deployment đã tạo\n  K-&gt;&gt;A: GET pods -o json\n  A--&gt;&gt;K: PodList\n  K-&gt;&gt;K: jsonpath range .items[*] ... end\n  K-&gt;&gt;K: lọc [?(@.type==&quot;InternalIP&quot;)]\n<\/code><\/pre>\n<p>jsonpath và custom-columns xử lý ở phía kubectl, trên JSON mà API server trả về.<\/p>"]]}, {"id": 5, "slug": "deployment-rollout", "dir": "05-deployment-rollout", "title": "Deployment: scale, rolling update, rollback", "level": 2, "env": "any", "minutes": 30, "comps": ["work:0"], "goal": "<p>Điều khiển vòng đời một Deployment: scale, chỉnh chiến lược cập nhật, nâng image có ghi chú, nhận ra rollout bị kẹt và quay lại phiên bản tốt.<\/p>", "concepts": "<ul>\n<li>Deployment quản lý ReplicaSet; mỗi lần đổi <strong>Pod template<\/strong> (image, env…) tạo ReplicaSet mới. Đổi <code>replicas<\/code> thì không.<\/li>\n<li><code>RollingUpdate<\/code> với <code>maxSurge<\/code> (được tạo dư bao nhiêu Pod) và <code>maxUnavailable<\/code> (được thiếu bao nhiêu Pod sẵn sàng). <code>maxUnavailable: 0<\/code> là không gián đoạn. <code>Recreate<\/code> xóa hết Pod cũ rồi mới tạo mới.<\/li>\n<li><code>kubectl rollout history<\/code> đọc annotation <code>kubernetes.io/change-cause<\/code> của từng ReplicaSet. <code>rollout undo --to-revision=N<\/code> quay về một revision; revision đó được đánh số mới.<\/li>\n<li>Image sai thì Pod mới đứng <code>ImagePullBackOff<\/code>. Với <code>maxUnavailable: 0<\/code>, Pod cũ vẫn phục vụ: rollout kẹt nhưng không sập dịch vụ.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Scale Deployment <code>shop<\/code> trong namespace <code>lab05<\/code> lên <strong>4<\/strong> replica.<\/p>", "<p>Đặt chiến lược cho <code>shop<\/code>: <code>RollingUpdate<\/code>, <code>maxSurge: 1<\/code>, <code>maxUnavailable: 0<\/code>, và giữ tối đa <strong>5<\/strong> revision.<\/p>", "<p>Nâng <code>shop<\/code> lên <code>nginx:1.28<\/code> với change-cause <code>nang cap nginx 1.28<\/code>. Chờ rollout xong.<\/p>", "<p>Một đồng nghiệp đẩy <code>nginx:1.99<\/code> (không tồn tại) lên <code>shop<\/code>. Hãy làm điều đó, quan sát rollout kẹt, rồi <strong>rollback<\/strong> về revision chạy <code>nginx:1.28<\/code>.<\/p>", "<p>Deployment <code>legacy<\/code> không được phép chạy hai phiên bản cùng lúc. Đổi chiến lược của nó sang <code>Recreate<\/code>.<\/p>"], "hints": [["Ghi change-cause", "<p>Sau <code>kubectl set image<\/code>, chạy <code>kubectl annotate deploy/shop kubernetes.io/change-cause='…' --overwrite<\/code>.<\/p>"], ["Đổi sang Recreate", "<p>Khi chuyển sang <code>Recreate<\/code> phải xóa luôn khối <code>rollingUpdate<\/code>, nếu không API báo lỗi. <code>kubectl edit<\/code> hoặc patch với <code>\"rollingUpdate\": null<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl scale deploy shop -n lab05 --replicas=4\nkubectl patch deploy shop -n lab05 -p '{&quot;spec&quot;:{&quot;revisionHistoryLimit&quot;:5,&quot;strategy&quot;:{&quot;type&quot;:&quot;RollingUpdate&quot;,&quot;rollingUpdate&quot;:{&quot;maxSurge&quot;:1,&quot;maxUnavailable&quot;:0}}}}'\n\nkubectl set image deploy/shop -n lab05 nginx=nginx:1.28\nkubectl annotate deploy/shop -n lab05 kubernetes.io/change-cause='nang cap nginx 1.28' --overwrite\nkubectl rollout status deploy/shop -n lab05\n\nkubectl set image deploy/shop -n lab05 nginx=nginx:1.99\nkubectl annotate deploy/shop -n lab05 kubernetes.io/change-cause='thu nginx 1.99' --overwrite\nkubectl rollout status deploy/shop -n lab05 --timeout=30s     # kẹt\nkubectl get pods -n lab05                                     # 1 Pod ImagePullBackOff, 4 Pod cũ vẫn chạy\nkubectl rollout history deploy/shop -n lab05\nkubectl rollout undo deploy/shop -n lab05                     # về revision trước (1.28)\n\nkubectl patch deploy legacy -n lab05 -p '{&quot;spec&quot;:{&quot;strategy&quot;:{&quot;type&quot;:&quot;Recreate&quot;,&quot;rollingUpdate&quot;:null}}}'\n<\/code><\/pre>", "docs": [["Deployments", "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"], ["kubectl rollout", "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/"]], "support": "guided", "prereq": [4], "guide": [["Xem quan hệ Deployment → ReplicaSet → Pod", "<p>Deployment không tạo Pod trực tiếp. Nó tạo một ReplicaSet cho mỗi phiên bản của Pod template, và ReplicaSet giữ đúng số Pod.<\/p>\n<pre><code class=\"language-bash\">./lab start 5\nkubectl get deploy,rs,pods -n lab05 -l app=shop\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 1 Deployment, 1 ReplicaSet <code>shop-&lt;hash&gt;<\/code>, 2 Pod <code>shop-&lt;hash&gt;-&lt;id&gt;<\/code>. Phần <code>&lt;hash&gt;<\/code> là hash của Pod template.<\/p>\n<\/blockquote>"], ["Scale", "<p>Scale chỉ đổi <code>spec.replicas<\/code>, không đổi template, nên <strong>không<\/strong> sinh ReplicaSet mới.<\/p>\n<pre><code class=\"language-bash\">kubectl scale deploy shop -n lab05 --replicas=4\nkubectl get rs -n lab05 -l app=shop\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> vẫn 1 ReplicaSet, DESIRED 4.<\/p>\n<\/blockquote>"], ["Đặt chiến lược rolling update", "<p><code>maxSurge: 1<\/code> cho phép tạo thêm tối đa 1 Pod vượt số replica. <code>maxUnavailable: 0<\/code> không cho Pod cũ nào bị tắt trước khi Pod mới Ready. Kết hợp lại thì không bao giờ thiếu Pod phục vụ. <code>revisionHistoryLimit<\/code> là số ReplicaSet cũ được giữ lại để rollback.<\/p>\n<pre><code class=\"language-bash\">kubectl patch deploy shop -n lab05 -p '{&quot;spec&quot;:{&quot;revisionHistoryLimit&quot;:5,&quot;strategy&quot;:{&quot;type&quot;:&quot;RollingUpdate&quot;,&quot;rollingUpdate&quot;:{&quot;maxSurge&quot;:1,&quot;maxUnavailable&quot;:0}}}}'\nkubectl get deploy shop -n lab05 -o jsonpath='{.spec.strategy}{&quot;\\n&quot;}{.spec.revisionHistoryLimit}{&quot;\\n&quot;}'\n<\/code><\/pre>\n<p>Làm bằng <code>kubectl edit deploy shop -n lab05<\/code> cũng được. Patch nhanh hơn khi bạn đã thuộc cấu trúc.<\/p>"], ["Nâng phiên bản và ghi lý do", "<p><code>set image<\/code> đổi template, nên Deployment tạo ReplicaSet mới và chuyển Pod dần sang đó. Annotation <code>kubernetes.io/change-cause<\/code> hiện trong cột CHANGE-CAUSE của <code>rollout history<\/code>.<\/p>\n<pre><code class=\"language-bash\">kubectl get deploy shop -n lab05 -o jsonpath='{.spec.template.spec.containers[0].name}'; echo   # tên container: nginx\nkubectl set image deploy/shop -n lab05 nginx=nginx:1.28\nkubectl annotate deploy/shop -n lab05 kubernetes.io/change-cause='nang cap nginx 1.28' --overwrite\nkubectl rollout status deploy/shop -n lab05\nkubectl get rs -n lab05 -l app=shop\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 2 ReplicaSet: cái mới 4/4, cái cũ 0/0 (được giữ lại để rollback).<\/p>\n<\/blockquote>"], ["Quan sát rollout kẹt", "<p>Với image không tồn tại, Pod mới không bao giờ Ready. Vì <code>maxUnavailable: 0<\/code>, 4 Pod cũ vẫn phục vụ: ứng dụng không chết.<\/p>\n<pre><code class=\"language-bash\">kubectl set image deploy/shop -n lab05 nginx=nginx:1.99\nkubectl annotate deploy/shop -n lab05 kubernetes.io/change-cause='thu nginx 1.99' --overwrite\nkubectl rollout status deploy/shop -n lab05 --timeout=30s       # báo lỗi timeout\nkubectl get pods -n lab05 -l app=shop                          # 4 Running + 1 ImagePullBackOff\n<\/code><\/pre>"], ["Rollback", "<p><code>rollout undo<\/code> quay về revision ngay trước đó. Dùng <code>--to-revision=N<\/code> để chọn revision cụ thể.<\/p>\n<pre><code class=\"language-bash\">kubectl rollout history deploy/shop -n lab05\nkubectl rollout undo deploy/shop -n lab05\nkubectl rollout status deploy/shop -n lab05\nkubectl get deploy shop -n lab05 -o jsonpath='{.spec.template.spec.containers[0].image}'; echo\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> image trở về <code>nginx:1.28<\/code>. Trong history, revision của 1.28 được đánh số mới (revision cũ được \"dời lên\").<\/p>\n<\/blockquote>"], ["Chiến lược Recreate", "<p><code>Recreate<\/code> tắt hết Pod cũ rồi mới tạo Pod mới, nên hai phiên bản không bao giờ chạy cùng lúc. Đổi sang Recreate phải xóa luôn khối <code>rollingUpdate<\/code>, nếu không API sẽ từ chối.<\/p>\n<pre><code class=\"language-bash\">kubectl patch deploy legacy -n lab05 -p '{&quot;spec&quot;:{&quot;strategy&quot;:{&quot;type&quot;:&quot;Recreate&quot;,&quot;rollingUpdate&quot;:null}}}'\nkubectl get deploy legacy -n lab05 -o jsonpath='{.spec.strategy}'; echo\n./lab check 5\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  d[&quot;Deployment shop&lt;br/&gt;replicas 4 · maxSurge 1 · maxUnavailable 0&quot;]\n  d --&gt; rs1[&quot;ReplicaSet rev 1&lt;br/&gt;nginx:1.27 · 0 Pod&quot;]\n  d --&gt; rs2[&quot;ReplicaSet rev 2&lt;br/&gt;nginx:1.28 · 4 Pod&quot;]\n  d -.-&gt; rs3[&quot;ReplicaSet rev 3&lt;br/&gt;nginx:1.99 · ImagePullBackOff&quot;]\n  rs2 --&gt; p[&quot;4 Pod đang phục vụ&quot;]\n  l[&quot;Deployment legacy&lt;br/&gt;strategy: Recreate&quot;]\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class rs3 bad\n<\/code><\/pre>\n<p>Mỗi lần đổi Pod template sinh một ReplicaSet mới. ReplicaSet cũ được giữ lại (tối đa <code>revisionHistoryLimit<\/code>) để rollback.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant K as kubectl\n  participant A as kube-apiserver\n  participant DC as Deployment controller\n  participant N as ReplicaSet mới\n  participant O as ReplicaSet cũ\n  K-&gt;&gt;A: set image nginx=nginx:1.28\n  DC-&gt;&gt;A: watch: template đổi\n  DC-&gt;&gt;A: tạo ReplicaSet mới (hash mới)\n  loop đến khi mới = 4, cũ = 0\n    DC-&gt;&gt;N: scale +1 (maxSurge 1)\n    N--&gt;&gt;DC: Pod mới Ready\n    DC-&gt;&gt;O: scale -1 (maxUnavailable 0)\n  end\n  K-&gt;&gt;A: set image nginx=nginx:1.99\n  DC-&gt;&gt;N: scale +1\n  N--&gt;&gt;DC: Pod không bao giờ Ready\n  Note over DC: rollout kẹt, Pod cũ vẫn phục vụ\n  K-&gt;&gt;A: rollout undo\n  DC-&gt;&gt;N: template quay về rev trước\n<\/code><\/pre>"]]}, {"id": 6, "slug": "configmap-secret", "dir": "06-configmap-secret", "title": "ConfigMap và Secret", "level": 2, "env": "any", "minutes": 30, "comps": ["work:1"], "goal": "<p>Tách cấu hình khỏi image: tạo ConfigMap và Secret từ literal và file, đưa vào container qua biến môi trường và volume, đọc giá trị Secret có sẵn.<\/p>", "concepts": "<ul>\n<li><code>envFrom<\/code> nạp mọi key của ConfigMap/Secret thành biến môi trường; <code>env[].valueFrom.secretKeyRef<\/code> lấy một key.<\/li>\n<li>ConfigMap gắn qua volume: mỗi key thành một file. File tự cập nhật khi ConfigMap đổi (trừ khi dùng <code>subPath<\/code>); biến môi trường thì <strong>không<\/strong>, phải restart Pod.<\/li>\n<li>Secret chỉ được <strong>base64<\/strong>, không mã hóa. Đọc: <code>kubectl get secret x -o jsonpath='{.data.key}' | base64 -d<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong namespace <code>lab06<\/code>, tạo ConfigMap <code>app-config<\/code> với <code>APP_MODE=production<\/code> và <code>APP_PORT=8080<\/code>.<\/p>", "<p>Tạo ConfigMap <code>app-files<\/code> từ file <code>~/cka-answers/06-app.properties<\/code> (setup đã tạo sẵn), key là <code>app.properties<\/code>.<\/p>", "<p>Tạo Secret <code>db-cred<\/code> với <code>username=admin<\/code> và <code>password=S3cr3t-pass<\/code>.<\/p>", "<p>Tạo Deployment <code>app<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) sao cho container có:\nmọi key của <code>app-config<\/code> thành biến môi trường; biến <code>DB_PASSWORD<\/code> lấy từ key <code>password<\/code> của <code>db-cred<\/code>; ConfigMap <code>app-files<\/code> gắn chỉ đọc tại <code>/etc/app<\/code>.<\/p>", "<p>Secret <code>legacy-token<\/code> có sẵn. Giải mã key <code>token<\/code> và ghi giá trị vào <code>~/cka-answers/06-token.txt<\/code>.<\/p>"], "hints": [["Khung YAML", "<p><code>kubectl create deploy app --image=busybox:1.36 $do -- sleep 3600 &gt; app.yaml<\/code> rồi thêm <code>envFrom<\/code>, <code>env<\/code>, <code>volumes<\/code>, <code>volumeMounts<\/code>.<\/p>"], ["Thêm biến từ Secret bằng lệnh", "<p><code>kubectl set env deploy/app --from=secret/db-cred --keys=password --prefix=DB_<\/code> tạo <code>DB_PASSWORD<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl create cm app-config -n lab06 --from-literal=APP_MODE=production --from-literal=APP_PORT=8080\nkubectl create cm app-files -n lab06 --from-file=app.properties=$HOME/cka-answers/06-app.properties\nkubectl create secret generic db-cred -n lab06 --from-literal=username=admin --from-literal=password=S3cr3t-pass\nkubectl get secret legacy-token -n lab06 -o jsonpath='{.data.token}' | base64 -d &gt; ~/cka-answers/06-token.txt\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: app, namespace: lab06}\nspec:\n  selector: {matchLabels: {app: app}}\n  template:\n    metadata: {labels: {app: app}}\n    spec:\n      containers:\n      - name: busybox\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        envFrom:\n        - configMapRef: {name: app-config}\n        env:\n        - name: DB_PASSWORD\n          valueFrom: {secretKeyRef: {name: db-cred, key: password}}\n        volumeMounts:\n        - {name: files, mountPath: /etc/app, readOnly: true}\n      volumes:\n      - name: files\n        configMap: {name: app-files}\n<\/code><\/pre>\n<p>Kiểm tra: <code>kubectl exec -n lab06 deploy/app -- sh -c 'env | grep -E \"APP_|DB_\"; cat /etc/app/app.properties'<\/code><\/p>", "docs": [["ConfigMaps", "https://kubernetes.io/docs/concepts/configuration/configmap/"], ["Secrets", "https://kubernetes.io/docs/concepts/configuration/secret/"], ["Configure a Pod to use a ConfigMap", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/"]], "support": "guided", "prereq": [5], "guide": [["ConfigMap từ literal", "<p>Mỗi <code>--from-literal<\/code> tạo một key. ConfigMap chứa cấu hình không bí mật.<\/p>\n<pre><code class=\"language-bash\">./lab start 6\nkubectl create cm app-config -n lab06 --from-literal=APP_MODE=production --from-literal=APP_PORT=8080\nkubectl get cm app-config -n lab06 -o yaml\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> khối <code>data:<\/code> có 2 key.<\/p>\n<\/blockquote>"], ["ConfigMap từ file", "<p><code>--from-file=&lt;key&gt;=&lt;đường dẫn&gt;<\/code> lấy cả nội dung file làm giá trị của key. Bỏ phần <code>&lt;key&gt;=<\/code> thì tên file thành key.<\/p>\n<pre><code class=\"language-bash\">cat ~/cka-answers/06-app.properties\nkubectl create cm app-files -n lab06 --from-file=app.properties=$HOME/cka-answers/06-app.properties\nkubectl describe cm app-files -n lab06\n<\/code><\/pre>"], ["Secret và base64", "<p>Secret <code>generic<\/code> lưu giá trị dạng <strong>base64<\/strong>. Đây chỉ là mã hóa, <strong>không<\/strong> phải mật mã: ai đọc được Secret thì giải mã được. Quyền đọc Secret phải được giới hạn bằng RBAC (lab 23).<\/p>\n<pre><code class=\"language-bash\">kubectl create secret generic db-cred -n lab06 --from-literal=username=admin --from-literal=password=S3cr3t-pass\nkubectl get secret db-cred -n lab06 -o jsonpath='{.data.password}'; echo          # UzNjcjN0LXBhc3M=\nkubectl get secret db-cred -n lab06 -o jsonpath='{.data.password}' | base64 -d; echo\n<\/code><\/pre>"], ["Giải mã Secret có sẵn", "<pre><code c
