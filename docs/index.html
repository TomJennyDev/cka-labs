lass=\"language-bash\">kubectl get secret legacy-token -n lab06 -o jsonpath='{.data.token}' | base64 -d &gt; ~/cka-answers/06-token.txt\ncat ~/cka-answers/06-token.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> chuỗi dạng <code>tok-12345…<\/code>, không có dấu xuống dòng thừa.<\/p>\n<\/blockquote>"], ["Dùng cấu hình trong Deployment", "<p>Có ba cách đưa dữ liệu vào container:<\/p>\n<ul>\n<li><code>envFrom.configMapRef<\/code>: mọi key thành biến môi trường.<\/li>\n<li><code>env[].valueFrom.secretKeyRef<\/code>: một key thành một biến.<\/li>\n<li><code>volumes[].configMap<\/code> + <code>volumeMounts<\/code>: mỗi key thành một file.<\/li>\n<\/ul>\n<p>Sinh khung rồi thêm 3 khối đó:<\/p>\n<pre><code class=\"language-bash\">kubectl create deploy app -n lab06 --image=busybox:1.36 $do -- sleep 3600 &gt; app.yaml\nvi app.yaml\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">      containers:\n      - name: busybox\n        image: busybox:1.36\n        command: [&quot;sleep&quot;, &quot;3600&quot;]\n        envFrom:\n        - configMapRef: {name: app-config}\n        env:\n        - name: DB_PASSWORD\n          valueFrom: {secretKeyRef: {name: db-cred, key: password}}\n        volumeMounts:\n        - {name: files, mountPath: /etc/app, readOnly: true}\n      volumes:\n      - name: files\n        configMap: {name: app-files}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f app.yaml\n<\/code><\/pre>\n<p><code>volumes<\/code> nằm ngang hàng với <code>containers<\/code>, còn <code>volumeMounts<\/code> nằm trong từng container. Đặt sai cấp là lỗi YAML hay gặp nhất.<\/p>"], ["Kiểm tra từ bên trong container", "<pre><code class=\"language-bash\">kubectl exec -n lab06 deploy/app -- sh -c 'env | grep -E &quot;APP_|DB_&quot;; ls /etc/app; cat /etc/app/app.properties'\n./lab check 6\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> thấy <code>APP_MODE<\/code>, <code>APP_PORT<\/code>, <code>DB_PASSWORD<\/code> và file <code>app.properties<\/code>. Biến môi trường chỉ đọc lúc container khởi động. File mount từ ConfigMap thì tự cập nhật sau khoảng một phút khi ConfigMap đổi (trừ khi dùng <code>subPath<\/code>).<\/p>\n<\/blockquote>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  cm1[&quot;ConfigMap app-config&lt;br/&gt;APP_MODE, APP_PORT&quot;]\n  cm2[&quot;ConfigMap app-files&lt;br/&gt;key app.properties&quot;]\n  s1[&quot;Secret db-cred&lt;br/&gt;username, password&quot;]\n  subgraph pod [&quot;Pod của Deployment app&quot;]\n    env[&quot;biến môi trường&quot;]\n    vol[&quot;/etc/app/app.properties&quot;]\n  end\n  cm1 --&gt;|&quot;envFrom: mọi key&quot;| env\n  s1 --&gt;|&quot;env.valueFrom.secretKeyRef: password&quot;| env\n  cm2 --&gt;|&quot;volume configMap, readOnly&quot;| vol\n  s2[&quot;Secret legacy-token&quot;] --&gt;|&quot;base64 -d&quot;| f[&quot;06-token.txt&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant A as kube-apiserver\n  participant KL as kubelet\n  participant C as container\n  KL-&gt;&gt;A: Pod mới được gán cho node\n  KL-&gt;&gt;A: đọc ConfigMap và Secret được tham chiếu\n  alt thiếu ConfigMap/Secret hoặc key\n    KL-&gt;&gt;A: status CreateContainerConfigError\n  else đủ\n    KL-&gt;&gt;KL: ghi file vào volume (tmpfs cho Secret)\n    KL-&gt;&gt;C: khởi động với biến môi trường\n  end\n  Note over A,KL: ConfigMap đổi sau đó\n  KL-&gt;&gt;A: watch ConfigMap\n  KL-&gt;&gt;C: cập nhật file trong volume (~1 phút)\n  Note over C: biến môi trường KHÔNG đổi tới khi container khởi động lại\n<\/code><\/pre>"]]}, {"id": 7, "slug": "probes", "dir": "07-probes", "title": "Liveness, readiness và startup probe", "level": 2, "env": "any", "minutes": 30, "comps": ["work:3", "trouble:3"], "goal": "<p>Chẩn đoán một ứng dụng bị kubelet giết liên tục vì probe sai, sửa bằng startupProbe, và thêm readiness để Service chỉ gửi traffic khi Pod sẵn sàng.<\/p>", "concepts": "<ul>\n<li><strong>liveness<\/strong> trượt <code>failureThreshold<\/code> lần liên tiếp thì kubelet giết container. <strong>readiness<\/strong> trượt chỉ rút Pod khỏi EndpointSlice, không restart. <strong>startup<\/strong> chặn hai probe kia cho tới khi app khởi động xong; thời gian tối đa = <code>failureThreshold × periodSeconds<\/code>.<\/li>\n<li>Kiểu probe: <code>httpGet<\/code> (mã 200–399), <code>tcpSocket<\/code>, <code>exec<\/code> (thoát 0), <code>grpc<\/code>. Mặc định <code>periodSeconds: 10<\/code>, <code>timeoutSeconds: 1<\/code>, <code>failureThreshold: 3<\/code>.<\/li>\n<li>Dấu hiệu probe sai: event <code>Unhealthy<\/code> và <code>Killing<\/code>, RESTARTS tăng dần, <code>READY 0/1<\/code> dù <code>STATUS Running<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Deployment <code>slow-api<\/code> trong <code>lab07<\/code> cần khoảng <strong>25 giây<\/strong> để khởi động và restart liên tục. Tìm probe nào gây restart, ghi tên probe (<code>liveness<\/code>, <code>readiness<\/code> hoặc <code>startup<\/code>) vào <code>~/cka-answers/07-culprit.txt<\/code>.<\/p>", "<p>Sửa <code>slow-api<\/code> mà <strong>không<\/strong> tăng <code>initialDelaySeconds<\/code> của liveness: thêm <code>startupProbe<\/code> HTTP <code>GET /healthz<\/code> cổng 8080, cho phép tối đa ít nhất 60 giây để khởi động.<\/p>", "<p>Readiness của <code>slow-api<\/code> đang trỏ sai cổng. Sửa để nó kiểm tra <code>GET /ready<\/code> cổng 8080. Cả 2 Pod phải <code>READY 1/1<\/code> và không restart nữa.<\/p>", "<p>Deployment <code>cache<\/code> chưa có readiness. Thêm <code>readinessProbe<\/code> kiểu <code>exec<\/code> chạy <code>cat /tmp/ready<\/code>, chu kỳ 5 giây.<\/p>"], "hints": [["Xem probe nào đang trượt", "<p><code>kubectl describe pod -n lab07 -l app=slow-api | grep -E 'Liveness|Readiness|Startup|Killing'<\/code><\/p>"], ["Sửa nhanh", "<p><code>kubectl edit deploy slow-api -n lab07<\/code>. Thêm <code>startupProbe<\/code> ngang hàng với <code>livenessProbe<\/code>.<\/p>"]], "solution": "<p><code>kubectl describe pod<\/code> cho thấy event <code>Liveness probe failed … connection refused<\/code> và <code>Killing<\/code>: liveness giết app trước khi nó kịp khởi động.<\/p>\n<pre><code class=\"language-bash\">echo liveness &gt; ~/cka-answers/07-culprit.txt\nkubectl edit deploy slow-api -n lab07\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">        startupProbe:\n          httpGet: {path: /healthz, port: 8080}\n          periodSeconds: 5\n          failureThreshold: 12        # 60 giây\n        livenessProbe:                # giữ nguyên\n          httpGet: {path: /healthz, port: 8080}\n          periodSeconds: 5\n          failureThreshold: 2\n        readinessProbe:\n          httpGet: {path: /ready, port: 8080}   # trước đây là 8081\n          periodSeconds: 5\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl patch deploy cache -n lab07 --type=json -p '[{&quot;op&quot;:&quot;add&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/readinessProbe&quot;,&quot;value&quot;:{&quot;exec&quot;:{&quot;command&quot;:[&quot;cat&quot;,&quot;/tmp/ready&quot;]},&quot;periodSeconds&quot;:5}}]'\nkubectl rollout status deploy/slow-api -n lab07 --timeout=180s\nkubectl get pods -n lab07\n<\/code><\/pre>", "docs": [["Configure liveness, readiness and startup probes", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"], ["Pod lifecycle", "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"]], "support": "guided", "prereq": [5], "guide": [["Ba loại probe làm gì", "<ul>\n<li><strong>startupProbe<\/strong>: chạy đầu tiên. Khi nó chưa thành công, kubelet chưa chạy hai probe còn lại. Thất bại quá <code>failureThreshold<\/code> thì kubelet restart container.<\/li>\n<li><strong>livenessProbe<\/strong>: container còn sống không? Thất bại thì kubelet <strong>restart<\/strong> container.<\/li>\n<li><strong>readinessProbe<\/strong>: container sẵn sàng nhận traffic chưa? Thất bại thì Pod bị <strong>gỡ khỏi Service<\/strong> (READY 0/1) nhưng không bị restart.<\/li>\n<\/ul>\n<p>Thời gian tối đa cho một probe là <code>failureThreshold × periodSeconds<\/code>.<\/p>"], ["Quan sát lỗi", "<pre><code class=\"language-bash\">./lab start 7\nkubectl get pods -n lab07 -w          # thấy RESTARTS tăng dần, Ctrl+C\nkubectl describe pod -n lab07 -l app=slow-api | grep -A12 Events\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> event <code>Liveness probe failed: … connection refused<\/code> rồi <code>Container api failed liveness probe, will be restarted<\/code>. App cần 25 giây nhưng liveness chỉ cho <code>2 × 5 = 10<\/code> giây.<\/p>\n<\/blockquote>\n<pre><code class=\"language-bash\">echo liveness &gt; ~/cka-answers/07-culprit.txt\n<\/code><\/pre>"], ["Thêm startupProbe", "<p>Không kéo dài liveness, vì kéo dài thì khi app treo thật sẽ lâu mới bị phát hiện. Thay vào đó, startupProbe cho thời gian khởi động rộng rãi: <code>12 × 5 = 60<\/code> giây.<\/p>\n<pre><code class=\"language-bash\">kubectl edit deploy slow-api -n lab07\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">        startupProbe:\n          httpGet: {path: /healthz, port: 8080}\n          periodSeconds: 5\n          failureThreshold: 12\n<\/code><\/pre>"], ["Sửa readinessProbe", "<p>Trong cùng lần edit, sửa readiness đang trỏ cổng 8081 (không có gì lắng nghe) về 8080:<\/p>\n<pre><code class=\"language-yaml\">        readinessProbe:\n          httpGet: {path: /ready, port: 8080}\n          periodSeconds: 5\n<\/code><\/pre>\n<p>Lưu thoát thì Deployment rollout Pod mới.<\/p>\n<pre><code class=\"language-bash\">kubectl rollout status deploy/slow-api -n lab07 --timeout=180s\nkubectl get pods -n lab07 -l app=slow-api\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> sau khoảng 30 giây cả 2 Pod <code>1/1 Running<\/code>, RESTARTS 0.<\/p>\n<\/blockquote>"], ["readinessProbe kiểu exec", "<p>Probe <code>exec<\/code> chạy một lệnh trong container: mã thoát 0 là thành công. Thêm bằng JSON patch để khỏi mở editor:<\/p>\n<pre><code class=\"language-bash\">kubectl patch deploy cache -n lab07 --type=json -p '[{&quot;op&quot;:&quot;add&quot;,&quot;path&quot;:&quot;/spec/template/spec/containers/0/readinessProbe&quot;,&quot;value&quot;:{&quot;exec&quot;:{&quot;command&quot;:[&quot;cat&quot;,&quot;/tmp/ready&quot;]},&quot;periodSeconds&quot;:5}}]'\nkubectl get pods -n lab07 -l app=cache -w\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> Pod mới <code>0/1<\/code> trong khoảng 8 giây đầu (file chưa có), rồi <code>1/1<\/code>.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">./lab check 7\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph slow [&quot;Pod slow-api (khởi động mất 25 giây)&quot;]\n    sp[&quot;startupProbe /healthz:8080&lt;br/&gt;cho tối đa 60 giây&quot;]\n    lp[&quot;livenessProbe /healthz:8080&lt;br/&gt;2 × 5 giây&quot;]\n    rp[&quot;readinessProbe /ready&lt;br/&gt;cổng phải là 8080&quot;]\n  end\n  sp --&gt;|&quot;thành công thì mới bật&quot;| lp\n  sp --&gt; rp\n  lp --&gt;|&quot;thất bại&quot;| restart[&quot;kubelet restart container&quot;]\n  rp --&gt;|&quot;thất bại&quot;| ep[&quot;gỡ Pod khỏi endpoint của Service&quot;]\n  cache[&quot;Pod cache&lt;br/&gt;readiness exec: cat /tmp/ready&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant KL as kubelet\n  participant C as container\n  participant EP as EndpointSlice\n  KL-&gt;&gt;C: khởi động\n  loop startupProbe mỗi 5 giây, tối đa 12 lần\n    KL-&gt;&gt;C: GET /healthz\n    C--&gt;&gt;KL: connection refused (đang khởi động)\n  end\n  C--&gt;&gt;KL: 200 OK\n  Note over KL: startup xong, bật liveness và readiness\n  par liveness\n    KL-&gt;&gt;C: GET /healthz mỗi 5 giây\n  and readiness\n    KL-&gt;&gt;C: GET /ready\n    C--&gt;&gt;KL: 200 OK\n    KL-&gt;&gt;EP: Pod Ready, thêm vào endpoint\n  end\n<\/code><\/pre>\n<p>Không có startupProbe, liveness chạy ngay từ giây đầu và giết container trước khi nó kịp khởi động xong.<\/p>"]]}, {"id": 8, "slug": "init-sidecar", "dir": "08-init-sidecar", "title": "Init container và sidecar container", "level": 2, "env": "any", "minutes": 30, "comps": ["work:3", "trouble:3"], "goal": "<p>Dùng init container để chờ phụ thuộc, và thêm sidecar đọc log file của ứng dụng cũ ra stdout để <code>kubectl logs<\/code> đọc được.<\/p>", "concepts": "<ul>\n<li>Init container chạy <strong>tuần tự<\/strong> trước container chính, mỗi cái phải thoát 0. Pod hiển thị <code>Init:0/1<\/code> trong lúc chờ.<\/li>\n<li>Sidecar kiểu mới (GA từ v1.33): khai báo trong <code>initContainers<\/code> với <code>restartPolicy: Always<\/code>. Nó khởi động trước app, chạy suốt đời Pod và dừng sau app.<\/li>\n<li>Các container trong Pod dùng chung volume (<code>emptyDir<\/code>) và network namespace (gọi nhau qua <code>localhost<\/code>).<\/li>\n<li>Spec của Pod đang chạy gần như bất biến: muốn thêm container phải xuất YAML, sửa, rồi <code>kubectl replace --force -f<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab08<\/code>, tạo Pod <code>web<\/code> (image <code>nginx:1.27<\/code>) có init container <code>wait-db<\/code> (image <code>busybox:1.36<\/code>) chờ tới khi phân giải được tên <code>db.lab08.svc.cluster.local<\/code>. Pod phải đứng ở <code>Init:0/1<\/code>.<\/p>", "<p>Tạo Service <code>db<\/code> kiểu ClusterIP cổng 5432 (không cần selector). Xác nhận Pod <code>web<\/code> chuyển sang <code>Running<\/code>.<\/p>", "<p>Pod <code>legacy<\/code> ghi log vào file <code>/var/log/app/app.log<\/code> (volume <code>logs<\/code>). Thêm sidecar tên <code>log-tail<\/code> (image <code>busybox:1.36<\/code>) dạng native sidecar, chạy <code>tail -n+1 -F /var/log/app/app.log<\/code>, để <code>kubectl logs legacy -c log-tail<\/code> thấy log.<\/p>"], "hints": [["Lệnh chờ DNS", "<p><code>until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done<\/code><\/p>"], ["Thêm container vào Pod đang chạy", "<p><code>kubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml<\/code>, sửa, rồi <code>kubectl replace --force -f legacy.yaml<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: web, namespace: lab08}\nspec:\n  initContainers:\n  - name: wait-db\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done&quot;]\n  containers:\n  - {name: web, image: nginx:1.27}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pod web -n lab08          # Init:0/1\nkubectl create svc clusterip db -n lab08 --tcp=5432\nkubectl get pod web -n lab08 -w       # → Running\nkubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code> của <code>legacy.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  initContainers:\n  - name: log-tail\n    image: busybox:1.36\n    restartPolicy: Always\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -n+1 -F /var/log/app/app.log&quot;]\n    volumeMounts:\n    - {name: logs, mountPath: /var/log/app}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl replace --force -f legacy.yaml\nkubectl logs legacy -n lab08 -c log-tail\n<\/code><\/pre>", "docs": [["Init containers", "https://kubernetes.io/docs/concepts/workloads/pods/init-containers/"], ["Sidecar containers", "https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/"], ["Logging architecture", "https://kubernetes.io/docs/concepts/cluster-administration/logging/"]], "support": "guided", "prereq": [3, 7], "guide": [["Init container chạy trước, lần lượt", "<p>Init container chạy lần lượt và phải <strong>thoát thành công<\/strong> thì container chính mới khởi động. Dùng nó để chờ phụ thuộc (DB, migration, tải cấu hình).<\/p>\n<pre><code class=\"language-bash\">./lab start 8\nkubectl run web -n lab08 --image=nginx:1.27 $do &gt; web.yaml\nvi web.yaml\n<\/code><\/pre>\n<p>Thêm <code>initContainers<\/code> vào <code>spec<\/code>, ngang hàng với <code>containers<\/code>:<\/p>\n<pre><code class=\"language-yaml\">spec:\n  initContainers:\n  - name: wait-db\n    image: busybox:1.36\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;until nslookup db.lab08.svc.cluster.local; do echo waiting; sleep 2; done&quot;]\n  containers:\n  - name: web\n    image: nginx:1.27\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -n lab08 -f web.yaml\nkubectl get pod web -n lab08\nkubectl logs web -n lab08 -c wait-db --tail=3\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>STATUS Init:0/1<\/code>; log init container lặp <code>waiting<\/code> vì tên <code>db<\/code> chưa tồn tại.<\/p>\n<\/blockquote>"], ["Tạo phụ thuộc và xem Pod chạy tiếp", "<p>Service không có selector vẫn có ClusterIP và tên DNS, đủ để <code>nslookup<\/code> thành công.<\/p>\n<pre><code class=\"language-bash\">kubectl create svc clusterip db -n lab08 --tcp=5432\nkubectl get pod web -n lab08 -w        # Init:0/1 → PodInitializing → Running\n<\/code><\/pre>"], ["Vì sao cần sidecar", "<p>Pod <code>legacy<\/code> ghi log vào file chứ không ra stdout, nên <code>kubectl logs<\/code> không thấy gì. Mẫu chuẩn: một container phụ cùng mount volume đó và <code>tail<\/code> file ra stdout của nó.<\/p>\n<pre><code class=\"language-bash\">kubectl logs legacy -n lab08                 # trống\nkubectl exec legacy -n lab08 -- tail -2 /var/log/app/app.log\n<\/code><\/pre>"], ["Native sidecar", "<p>Từ Kubernetes 1.29, sidecar \"chuẩn\" là <strong>init container có <code>restartPolicy: Always<\/code><\/strong>. Nó khởi động trước container chính, chạy suốt đời Pod và được tắt sau cùng. Hầu hết trường của Pod không sửa được khi đang chạy, nên xuất YAML, sửa rồi <code>replace --force<\/code> (xóa và tạo lại).<\/p>\n<pre><code class=\"language-bash\">kubectl get pod legacy -n lab08 -o yaml &gt; legacy.yaml\nvi legacy.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  initContainers:\n  - name: log-tail\n    image: busybox:1.36\n    restartPolicy: Always\n    command: [&quot;sh&quot;, &quot;-c&quot;, &quot;tail -n+1 -F /var/log/app/app.log&quot;]\n    volumeMounts:\n    - {name: logs, mountPath: /var/log/app}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl replace --force -f legacy.yaml\nkubectl get pod legacy -n lab08          # READY 2/2\nkubectl logs legacy -n lab08 -c log-tail\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> thấy các dòng <code>… heartbeat order-service<\/code>.<\/p>\n<\/blockquote>"], ["Chấm bài", "<pre><code class=\"language-bash\">./lab check 8\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph web [&quot;Pod web&quot;]\n    i1[&quot;init: wait-db&lt;br/&gt;until nslookup db&quot;] --&gt; c1[&quot;nginx&quot;]\n  end\n  svc[&quot;Service db&lt;br/&gt;ClusterIP, không selector&quot;] -.-&gt;|&quot;tên DNS có rồi thì init xong&quot;| i1\n  subgraph legacy [&quot;Pod legacy&quot;]\n    app[&quot;app: ghi /var/log/app/app.log&quot;]\n    sc[&quot;log-tail: init container&lt;br/&gt;restartPolicy: Always&quot;]\n    v[(&quot;emptyDir logs&quot;)]\n    app --&gt; v\n    v --&gt; sc\n  end\n  sc --&gt;|&quot;stdout&quot;| logs[&quot;kubectl logs legacy -c log-tail&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant KL as kubelet\n  participant I as init container\n  participant S as sidecar (native)\n  participant M as container chính\n  KL-&gt;&gt;I: chạy wait-db\n  loop tới khi tên db phân giải được\n    I-&gt;&gt;I: nslookup db.lab08... thất bại, sleep 2\n  end\n  I--&gt;&gt;KL: thoát mã 0\n  Note over KL: Pod Init:0/1 → PodInitializing\n  KL-&gt;&gt;S: chạy sidecar, KHÔNG chờ nó thoát\n  KL-&gt;&gt;M: chạy container chính\n  Note over S,M: chạy song song suốt đời Pod\n  KL-&gt;&gt;M: khi xóa Pod: dừng container chính trước\n  KL-&gt;&gt;S: rồi mới dừng sidecar\n<\/code><\/pre>"]]}, {"id": 9, "slug": "daemonset-job-cronjob", "dir": "09-daemonset-job-cronjob", "title": "DaemonSet, Job và CronJob", "level": 2, "env": "any", "minutes": 30, "comps": ["work:3"], "goal": "<p>Chọn đúng loại workload: một Pod trên mỗi node (DaemonSet), tác vụ chạy tới khi xong (Job), tác vụ theo lịch (CronJob).<\/p>", "concepts": "<ul>\n<li>Không có <code>kubectl create daemonset<\/code>: sinh YAML Deployment rồi đổi <code>kind: DaemonSet<\/code>, bỏ <code>replicas<\/code> và <code>strategy<\/code>. Muốn chạy cả trên control plane phải tolerate taint <code>node-role.kubernetes.io/control-plane:NoSchedule<\/code>.<\/li>\n<li>Job: <code>completions<\/code> (cần bao nhiêu lần thành công), <code>parallelism<\/code> (chạy song song bao nhiêu), <code>backoffLimit<\/code> (số lần thử lại), <code>ttlSecondsAfterFinished<\/code> (tự xóa). <code>restartPolicy<\/code> chỉ được <code>Never<\/code> hoặc <code>OnFailure<\/code>.<\/li>\n<li>CronJob: <code>schedule<\/code> theo cú pháp cron, <code>concurrencyPolicy<\/code> (<code>Allow<\/code>, <code>Forbid<\/code>, <code>Replace<\/code>), giới hạn lịch sử job. <code>kubectl create job x --from=cronjob/y<\/code> chạy ngay một lần.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab09<\/code>, tạo DaemonSet <code>node-agent<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) chạy trên <strong>mọi<\/strong> node, kể cả control plane.<\/p>", "<p>Tạo Job <code>batch-sum<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sh -c 'echo done'<\/code>) cần <strong>4<\/strong> lần thành công, chạy song song tối đa <strong>2<\/strong>, thử lại tối đa <strong>2<\/strong> lần, tự xóa sau <strong>300<\/strong> giây khi xong. Job phải hoàn thành.<\/p>", "<p>Tạo CronJob <code>report<\/code> chạy mỗi 15 phút (image <code>busybox:1.36<\/code>, lệnh <code>date<\/code>), không cho chạy chồng (<code>Forbid<\/code>), giữ lại 2 job thành công.<\/p>", "<p>Chạy ngay một lần CronJob <code>report<\/code> bằng Job tên <code>report-now<\/code>. Job phải hoàn thành.<\/p>"], "hints": [["Sinh YAML Job và CronJob", "<p><code>kubectl create job batch-sum --image=busybox:1.36 $do -- sh -c 'echo done'<\/code> và <code>kubectl create cronjob report --image=busybox:1.36 --schedule='*/15 * * * *' $do -- date<\/code><\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: DaemonSet\nmetadata: {name: node-agent, namespace: lab09}\nspec:\n  selector: {matchLabels: {app: node-agent}}\n  template:\n    metadata: {labels: {app: node-agent}}\n    spec:\n      tolerations:\n      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}\n      containers:\n      - {name: agent, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n---\napiVersion: batch/v1\nkind: Job\nmetadata: {name: batch-sum, namespace: lab09}\nspec:\n  completions: 4\n  parallelism: 2\n  backoffLimit: 2\n  ttlSecondsAfterFinished: 300\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n      - {name: sum, image: busybox:1.36, command: [&quot;sh&quot;, &quot;-c&quot;, &quot;echo done&quot;]}\n---\napiVersion: batch/v1\nkind: CronJob\nmetadata: {name: report, namespace: lab09}\nspec:\n  schedule: &quot;*/15 * * * *&quot;\n  concurrencyPolicy: Forbid\n  successfulJobsHistoryLimit: 2\n  jobTemplate:\n    spec:\n      template:\n        spec:\n          restartPolicy: OnFailure\n          containers:\n          - {name: report, image: busybox:1.36, command: [&quot;date&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl create job report-now -n lab09 --from=cronjob/report\nkubectl get ds,job,cronjob -n lab09\n<\/code><\/pre>", "docs": [["DaemonSet", "https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/"], ["Jobs", "https://kubernetes.io/docs/concepts/workloads/controllers/job/"], ["CronJob", "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"]], "support": "guided", "prereq": [5], "guide": [["DaemonSet: mỗi node một Pod", "<p><code>kubectl create<\/code> không có lệnh cho DaemonSet. Mẹo: sinh YAML Deployment rồi đổi <code>kind<\/code>, xóa <code>replicas<\/code> và <code>strategy<\/code>.<\/p>\n<pre><code class=\"language-bash\">./lab start 9\nkubectl create deploy node-agent -n lab09 --image=busybox:1.36 $do -- sleep 3600 &gt; ds.yaml\nsed -i 's/kind: Deployment/kind: DaemonSet/; /replicas:/d; /strategy: {}/d' ds.yaml\nkubectl apply -f ds.yaml\nkubectl get ds,pods -n lab09 -o wide\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> DESIRED 2: chỉ 2 worker. Control plane có taint <code>node-role.kubernetes.io/control-plane:NoSchedule<\/code> nên Pod không được đặt lên đó.<\/p>\n<\/blockquote>"], ["Toleration để chạy cả trên control plane", "<pre><code class=\"language-bash\">kubectl describe node &quot;$CP&quot; | grep Taints\nvi ds.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec.template.spec<\/code>:<\/p>\n<pre><code class=\"language-yaml\">      tolerations:\n      - key: node-role.kubernetes.io/control-plane\n        operator: Exists\n        effect: NoSchedule\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f ds.yaml\nkubectl get ds node-agent -n lab09\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> DESIRED 3, READY 3.<\/p>\n<\/blockquote>"], ["Job chạy nhiều lần", "<ul>\n<li><code>completions<\/code>: số lần cần thành công.<\/li>\n<li><code>parallelism<\/code>: số Pod chạy cùng lúc.<\/li>\n<li><code>backoffLimit<\/code>: số lần thử lại khi lỗi.<\/li>\n<li><code>ttlSecondsAfterFinished<\/code>: tự xóa Job sau khi xong.<\/li>\n<\/ul>\n<p>Pod của Job phải có <code>restartPolicy<\/code> là <code>Never<\/code> hoặc <code>OnFailure<\/code>.<\/p>\n<pre><code class=\"language-bash\">kubectl create job batch-sum -n lab09 --image=busybox:1.36 $do -- sh -c 'echo done' &gt; job.yaml\nvi job.yaml        # thêm 4 trường trên vào spec (ngang hàng template)\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">spec:\n  completions: 4\n  parallelism: 2\n  backoffLimit: 2\n  ttlSecondsAfterFinished: 300\n  template:\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f job.yaml\nkubectl get pods -n lab09 -l job-name=batch-sum -w\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> Pod chạy theo từng cặp, Job đạt <code>COMPLETIONS 4/4<\/code>.<\/p>\n<\/blockquote>"], ["CronJob", "<p>Lịch theo cú pháp cron: <code>phút giờ ngày tháng thứ<\/code>. <code>*/15 * * * *<\/code> là mỗi 15 phút. <code>concurrencyPolicy: Forbid<\/code> bỏ qua lần chạy mới nếu lần trước chưa xong.<\/p>\n<pre><code class=\"language-bash\">kubectl create cronjob report -n lab09 --image=busybox:1.36 --schedule='*/15 * * * *' $do -- date &gt; cj.yaml\nvi cj.yaml         # thêm vào spec:\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">spec:\n  concurrencyPolicy: Forbid\n  successfulJobsHistoryLimit: 2\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f cj.yaml\n<\/code><\/pre>"], ["Chạy CronJob ngay", "<p>Không cần chờ 15 phút: tạo Job từ template của CronJob. Đây là cách kiểm tra CronJob hay dùng nhất.<\/p>\n<pre><code class=\"language-bash\">kubectl create job report-now -n lab09 --from=cronjob/report\nkubectl logs -n lab09 job/report-now\n./lab check 9\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> log in ngày giờ hiện tại.<\/p>\n<\/blockquote>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart TB\n  ds[&quot;DaemonSet node-agent&lt;br/&gt;+ toleration control-plane&quot;] --&gt; n0[&quot;Pod trên control plane&quot;]\n  ds --&gt; n1[&quot;Pod trên worker 1&quot;]\n  ds --&gt; n2[&quot;Pod trên worker 2&quot;]\n  job[&quot;Job batch-sum&lt;br/&gt;completions 4 · parallelism 2&quot;] --&gt; j[&quot;Pod 1,2 chạy → Pod 3,4 chạy&quot;]\n  cj[&quot;CronJob report&lt;br/&gt;*/15 * * * * · Forbid&quot;] --&gt;|&quot;mỗi 15 phút&quot;| jt[&quot;Job&quot;]\n  cj --&gt;|&quot;kubectl create job --from&quot;| now[&quot;Job report-now&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant CJ as CronJob controller\n  participant JC as Job controller\n  participant A as kube-apiserver\n  participant P as Pod\n  CJ-&gt;&gt;CJ: tới giờ theo schedule\n  alt Job trước chưa xong và concurrencyPolicy Forbid\n    CJ-&gt;&gt;CJ: bỏ qua lần này\n  else\n    CJ-&gt;&gt;A: tạo Job từ jobTemplate\n  end\n  JC-&gt;&gt;A: tạo tối đa parallelism Pod\n  P--&gt;&gt;JC: thoát 0 (1 completion)\n  JC-&gt;&gt;A: tạo Pod tiếp tới đủ completions\n  P--&gt;&gt;JC: thoát khác 0\n  JC-&gt;&gt;A: thử lại, tối đa backoffLimit lần\n  JC-&gt;&gt;A: Job Complete\n  Note over A: ttlSecondsAfterFinished hết hạn thì Job bị xóa\n<\/code><\/pre>"]]}, {"id": 10, "slug": "resources-quota", "dir": "10-resources-quota", "title": "Requests, limits, LimitRange và ResourceQuota", "level": 2, "env": "any", "minutes": 35, "comps": ["work:4", "trouble:2"], "goal": "<p>Hiểu requests/limits tác động thế nào tới scheduling và QoS, tìm vì sao Deployment không đủ Pod khi namespace có quota, và đặt giá trị mặc định bằng LimitRange.<\/p>", "concepts": "<ul>\n<li>Scheduler chỉ nhìn <strong>requests<\/strong>. Vượt memory <strong>limit<\/strong> thì container bị OOMKilled; vượt CPU limit thì bị throttle.<\/li>\n<li>QoS: <code>Guaranteed<\/code> (mọi container có requests = limits cho CPU và memory), <code>Burstable<\/code>, <code>BestEffort<\/code> (không đặt gì, bị evict đầu tiên).<\/li>\n<li>ResourceQuota giới hạn tổng của namespace. Khi quota có <code>requests.cpu<\/code>, mọi Pod <strong>bắt buộc<\/strong> khai báo requests CPU, nếu không bị từ chối.<\/li>\n<li>Pod bị quota từ chối không tồn tại, nên lỗi nằm ở <strong>event của ReplicaSet<\/strong> (<code>FailedCreate<\/code>), không ở Deployment.<\/li>\n<li>LimitRange điền requests/limits mặc định cho container không khai báo, và có thể đặt min/max.<\/li>\n<li>Quota sát giới hạn có thể làm rolling update <strong>kẹt<\/strong>: Deployment cần tạo Pod mới (maxSurge) trước khi xóa Pod cũ, nhưng quota không cho tạo. Gỡ bằng cách tạm tăng <code>maxUnavailable<\/code>, giảm <code>replicas<\/code>, hoặc nới quota.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Deployment <code>heavy<\/code> trong <code>lab10<\/code> muốn 3 replica nhưng chỉ có 2 Pod. Tìm resource nào của quota bị vượt (ví dụ <code>limits.memory<\/code>) và ghi vào <code>~/cka-answers/10-quota.txt<\/code>.<\/p>", "<p>Sửa <code>heavy<\/code> để đủ 3 replica: requests <code>cpu: 200m<\/code>, <code>memory: 128Mi<\/code>; limits <code>memory: 256Mi<\/code>.<\/p>", "<p>Tạo LimitRange <code>defaults<\/code> trong <code>lab10<\/code>: container không khai báo sẽ nhận request <code>cpu: 100m<\/code>, <code>memory: 64Mi<\/code> và limit <code>cpu: 200m<\/code>, <code>memory: 128Mi<\/code>.<\/p>", "<p>Tạo Pod <code>plain<\/code> (image <code>nginx:1.27<\/code>, không khai báo resources). Nó phải chạy được nhờ LimitRange.<\/p>", "<p>Tạo Pod <code>gold<\/code> (image <code>nginx:1.27<\/code>) thuộc QoS class <code>Guaranteed<\/code> với CPU 100m và memory 64Mi.<\/p>"], "hints": [["Tìm lý do", "<p><code>kubectl describe rs -n lab10 -l app=heavy | grep -A3 FailedCreate<\/code> và <code>kubectl describe quota -n lab10<\/code><\/p>"], ["Sửa resources nhanh", "<p><code>kubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl describe rs -n lab10 -l app=heavy | grep FailedCreate\n#   exceeded quota: team-quota, requested: requests.cpu=800m, used: requests.cpu=1600m, limited: requests.cpu=2\necho requests.cpu &gt; ~/cka-answers/10-quota.txt\nkubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: LimitRange\nmetadata: {name: defaults, namespace: lab10}\nspec:\n  limits:\n  - type: Container\n    defaultRequest: {cpu: 100m, memory: 64Mi}\n    default: {cpu: 200m, memory: 128Mi}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl run plain -n lab10 --image=nginx:1.27\nkubectl get pod plain -n lab10 -o jsonpath='{.spec.containers[0].resources}'\nkubectl run gold -n lab10 --image=nginx:1.27 $do &gt; gold.yaml\n# thêm resources: requests và limits đều cpu: 100m, memory: 64Mi\nkubectl apply -f gold.yaml\nkubectl get pod gold -n lab10 -o jsonpath='{.status.qosClass}'   # Guaranteed\n<\/code><\/pre>", "docs": [["Resource management for Pods and containers", "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"], ["Resource quotas", "https://kubernetes.io/docs/concepts/policy/resource-quotas/"], ["Limit ranges", "https://kubernetes.io/docs/concepts/policy/limit-range/"], ["Pod QoS classes", "https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/"]], "support": "guided", "prereq": [5], "guide": [["Requests và limits khác nhau thế nào", "<ul>\n<li><strong>requests<\/strong>: lượng tài nguyên scheduler <strong>giữ chỗ<\/strong> trên node; Pod chỉ được đặt lên node còn đủ.<\/li>\n<li><strong>limits<\/strong>: mức trần lúc chạy. Vượt limit CPU thì bị bóp (throttle). Vượt limit memory thì bị kill (<code>OOMKilled<\/code>).<\/li>\n<\/ul>\n<p>ResourceQuota giới hạn <strong>tổng<\/strong> requests và limits của cả namespace.<\/p>"], ["Tìm vì sao thiếu Pod", "<p>Khi Deployment thiếu Pod mà không thấy Pod lỗi nào, lỗi nằm ở <strong>ReplicaSet<\/strong>: nó không tạo được Pod. Xem event của nó.<\/p>\n<pre><code class=\"language-bash\">./lab start 10\nkubectl get deploy heavy -n lab10                  # READY 2/3\nkubectl describe rs -n lab10 -l app=heavy | grep -i -A2 FailedCreate\nkubectl describe quota team-quota -n lab10\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>exceeded quota: team-quota, requested: requests.cpu=800m, used: requests.cpu=1600m, limited: requests.cpu=2<\/code>.<\/p>\n<\/blockquote>\n<pre><code class=\"language-bash\">echo requests.cpu &gt; ~/cka-answers/10-quota.txt\n<\/code><\/pre>"], ["Giảm requests", "<pre><code class=\"language-bash\">kubectl set resources deploy heavy -n lab10 --requests=cpu=200m,memory=128Mi --limits=memory=256Mi\nkubectl rollout status deploy heavy -n lab10\nkubectl describe quota team-quota -n lab10\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> 3/3 Pod, cột Used của <code>requests.cpu<\/code> là <code>600m<\/code>.<\/p>\n<\/blockquote>\n<p>Rolling update cần chỗ cho Pod mới <strong>trước khi<\/strong> xóa Pod cũ. Nếu quota đã kín, Pod mới không được tạo và rollout đứng im. Khi gặp tình huống này, tạm scale về ít replica hơn hoặc nới quota.<\/p>"], ["LimitRange: giá trị mặc định cho container", "<p>Khi namespace có quota cho <code>requests.cpu<\/code>, Pod <strong>không<\/strong> khai báo requests sẽ bị từ chối. LimitRange điền sẵn giá trị mặc định:<\/p>\n<ul>\n<li><code>defaultRequest<\/code>: request mặc định.<\/li>\n<li><code>default<\/code>: limit mặc định.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">cat &lt;&lt;'EOF' | kubectl apply -f -\napiVersion: v1\nkind: LimitRange\nmetadata: {name: defaults, namespace: lab10}\nspec:\n  limits:\n  - type: Container\n    defaultRequest: {cpu: 100m, memory: 64Mi}\n    default: {cpu: 200m, memory: 128Mi}\nEOF\nkubectl run plain -n lab10 --image=nginx:1.27\nkubectl get pod plain -n lab10 -o jsonpath='{.spec.containers[0].resources}'; echo\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> Pod <code>plain<\/code> có requests và limits do LimitRange điền vào.<\/p>\n<\/blockquote>"], ["QoS class", "<ul>\n<li><strong>Guaranteed<\/strong>: mọi container có requests <strong>bằng<\/strong> limits cho cả CPU lẫn memory.<\/li>\n<li><strong>Burstable<\/strong>: có requests nhưng không đạt Guaranteed.<\/li>\n<li><strong>BestEffort<\/strong>: không có gì.<\/li>\n<\/ul>\n<p>Khi node thiếu memory, kubelet đuổi BestEffort trước, Guaranteed sau cùng.<\/p>\n<pre><code class=\"language-bash\">kubectl run gold -n lab10 --image=nginx:1.27 $do &gt; gold.yaml\nvi gold.yaml       # trong container:\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">    resources:\n      requests: {cpu: 100m, memory: 64Mi}\n      limits: {cpu: 100m, memory: 64Mi}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f gold.yaml\nkubectl get pod gold plain -n lab10 -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass\n./lab check 10\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>gold Guaranteed<\/code>, <code>plain Burstable<\/code>.<\/p>\n<\/blockquote>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  q[&quot;ResourceQuota team-quota&lt;br/&gt;requests.cpu 2 · memory 1Gi · pods 6&quot;]\n  lr[&quot;LimitRange defaults&lt;br/&gt;request 100m/64Mi · limit 200m/128Mi&quot;]\n  heavy[&quot;Deployment heavy&lt;br/&gt;3 × 800m CPU = 2400m&quot;] --&gt;|&quot;vượt quota&quot;| q\n  plain[&quot;Pod plain&lt;br/&gt;không khai báo resources&quot;] --&gt;|&quot;được điền mặc định&quot;| lr\n  gold[&quot;Pod gold&lt;br/&gt;requests = limits&quot;] --&gt; qos[&quot;QoS Guaranteed&quot;]\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class heavy bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant RS as ReplicaSet controller\n  participant A as kube-apiserver\n  participant LR as admission LimitRanger\n  participant RQ as admission ResourceQuota\n  participant S as kube-scheduler\n  RS-&gt;&gt;A: POST Pod\n  A-&gt;&gt;LR: điền requests/limits mặc định\n  A-&gt;&gt;RQ: tổng requests + Pod mới có vượt hard?\n  alt vượt quota\n    RQ--&gt;&gt;A: từ chối 403 exceeded quota\n    A--&gt;&gt;RS: lỗi, ghi event FailedCreate trên ReplicaSet\n  else trong hạn mức\n    A--&gt;&gt;RS: Pod đã tạo\n    S-&gt;&gt;A: chọn node còn đủ requests, bind\n  end\n<\/code><\/pre>\n<p>Lỗi quota không tạo ra Pod lỗi nào, nên phải xem event của <strong>ReplicaSet<\/strong>, không phải của Pod.<\/p>"]]}, {"id": 11, "slug": "hpa-metrics", "dir": "11-hpa-metrics", "title": "metrics-server và HorizontalPodAutoscaler", "level": 2, "env": "any", "minutes": 30, "comps": ["work:2", "trouble:2"], "goal": "<p>Theo dõi CPU/RAM bằng <code>kubectl top<\/code>, tạo HPA có behavior, và sửa HPA hiện <code>&lt;unknown&gt;<\/code> vì Pod không khai báo requests.<\/p>", "concepts": "<ul>\n<li>metrics-server lấy số liệu từ kubelet và phục vụ Metrics API cho <code>kubectl top<\/code> và HPA. Lab 00 đã cài nó trên kind.<\/li>\n<li>HPA tính <code>desiredReplicas = ceil(replicas × giá trị hiện tại / mục tiêu)<\/code>. Utilization tính theo <strong>requests<\/strong>, nên Pod không có CPU request thì HPA không tính được (<code>&lt;unknown&gt;<\/code>).<\/li>\n<li><code>behavior.scaleDown.stabilizationWindowSeconds<\/code> (mặc định 300) chống dao động: khi giảm, HPA lấy khuyến nghị cao nhất trong cửa sổ.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi tên Pod trong namespace <code>kube-system<\/code> đang dùng <strong>nhiều memory nhất<\/strong> vào <code>~/cka-answers/11-top-pod.txt<\/code>.<\/p>", "<p>Trong <code>lab11<\/code>, tạo HPA cho Deployment <code>web<\/code>: tối thiểu 2, tối đa 6 replica, mục tiêu CPU <strong>50%<\/strong>, và scale down chờ <strong>60 giây<\/strong>.<\/p>", "<p>HPA <code>api<\/code> đã có sẵn nhưng hiển thị <code>&lt;unknown&gt;<\/code>. Sửa Deployment <code>api<\/code> để HPA đọc được metric (CPU request <code>100m<\/code>).<\/p>", "<p>(Không chấm) Tạo tải để thấy HPA scale up: <code>kubectl run load -n lab11 --image=busybox:1.36 -- sh -c 'while true; do wget -qO- http://web &gt;/dev/null; done'<\/code> rồi <code>kubectl get hpa -n lab11 -w<\/code>.<\/p>"], "hints": [["Sắp xếp theo memory", "<p><code>kubectl top pod -n kube-system --sort-by=memory --no-headers | head -1<\/code><\/p>"], ["HPA có behavior", "<p><code>kubectl autoscale<\/code> không đặt được behavior. Sinh YAML (<code>$do<\/code>) rồi thêm <code>spec.behavior<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl top pod -n kube-system --sort-by=memory --no-headers | head -1 | awk '{print $1}' &gt; ~/cka-answers/11-top-pod.txt\nkubectl autoscale deploy web -n lab11 --min=2 --max=6 --cpu=50% $do &gt; hpa.yaml\n<\/code><\/pre>\n<p>Thêm vào <code>spec<\/code> của <code>hpa.yaml<\/code> rồi <code>kubectl apply -f hpa.yaml<\/code>:<\/p>\n<pre><code class=\"language-yaml\">  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 60\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl describe hpa api -n lab11        # failed to get cpu utilization: missing request for cpu\nkubectl set resources deploy api -n lab11 --requests=cpu=100m\nkubectl get hpa -n lab11                 # sau khoảng 1 phút TARGETS hiện %\n<\/code><\/pre>", "docs": [["Horizontal Pod Autoscaling", "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"], ["HPA walkthrough", "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale-walkthrough/"], ["Resource metrics pipeline", "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"]], "support": "guided", "prereq": [10], "guide": [["metrics-server là gì", "<p>metrics-server thu CPU và memory từ kubelet của mỗi node 15 giây một lần, rồi phục vụ qua API <code>metrics.k8s.io<\/code>. Cả <code>kubectl top<\/code> và HPA đọc từ API này. Nó <strong>không<\/strong> lưu lịch sử; muốn có lịch sử thì cần Prometheus.<\/p>\n<pre><code class=\"language-bash\">./lab start 11\nkubectl get apiservice v1beta1.metrics.k8s.io       # AVAILABLE True\nkubectl top nodes\n<\/code><\/pre>"], ["Tìm Pod tốn memory nhất", "<pre><code class=\"language-bash\">kubectl top pod -n kube-system --sort-by=memory\nkubectl top pod -n kube-system --sort-by=memory --no-headers | head -1 | awk '{print $1}' &gt; ~/cka-answers/11-top-pod.txt\ncat ~/cka-answers/11-top-pod.txt\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> thường là <code>kube-apiserver-…<\/code> hoặc <code>etcd-…<\/code>. Thêm <code>--containers<\/code> để xem theo từng container.<\/p>\n<\/blockquote>"], ["Tạo HPA", "<p>HPA tính <code>số replica mong muốn = ceil(replica hiện tại × mức dùng hiện tại / mục tiêu)<\/code>. Mức dùng tính theo <strong>phần trăm của CPU request<\/strong>, nên Pod không có request thì HPA không tính được.<\/p>\n<pre><code class=\"language-bash\">kubectl autoscale deploy web -n lab11 --min=2 --max=6 --cpu=50% $do &gt; hpa.yaml\ncat hpa.yaml\n<\/code><\/pre>\n<p>Cờ cũ <code>--cpu-percent=50<\/code> vẫn chạy nhưng đã bị đánh dấu deprecated từ kubectl v1.34.<\/p>"], ["Thêm behavior", "<p><code>kubectl autoscale<\/code> không có cờ cho <code>behavior<\/code>, phải sửa YAML. <code>stabilizationWindowSeconds<\/code> của scaleDown là số giây HPA chờ, sau khi tải giảm, trước khi giảm replica. Nó chống việc scale lên xuống liên tục.<\/p>\n<pre><code class=\"language-bash\">vi hpa.yaml        # thêm vào spec:\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">  behavior:\n    scaleDown:\n      stabilizationWindowSeconds: 60\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl apply -f hpa.yaml\nkubectl get hpa -n lab11\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> <code>web<\/code> có MINPODS 2, MAXPODS 6; Deployment <code>web<\/code> lên 2 replica.<\/p>\n<\/blockquote>"], ["Sửa HPA hiển thị unknown", "<pre><code class=\"language-bash\">kubectl get hpa api -n lab11                         # TARGETS cpu: &lt;unknown&gt;/70%\nkubectl describe hpa api -n lab11 | grep -i -A3 warning\nkubectl set resources deploy api -n lab11 --requests=cpu=100m\n<\/code><\/pre>\n<blockquote>\n<p><strong>Kết quả:<\/strong> event <code>missing request for cpu<\/code>. Sau khi thêm request và chờ khoảng 1 phút, TARGETS hiện dạng <code>0%/70%<\/code>.<\/p>\n<\/blockquote>"], ["Xem HPA scale (không chấm)", "<pre><code class=\"language-bash\">kubectl run load -n lab11 --image=busybox:1.36 -- sh -c 'while true; do wget -qO- http://web &gt;/dev/null; done'\nkubectl get hpa web -n lab11 -w          # chờ 1–2 phút\nkubectl delete pod load -n lab11\n./lab check 11\n<\/code><\/pre>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  kl[&quot;kubelet trên mỗi node&lt;br/&gt;/metrics/resource&quot;] --&gt; ms[&quot;metrics-server&quot;]\n  ms --&gt; mapi[&quot;API metrics.k8s.io&quot;]\n  mapi --&gt; top[&quot;kubectl top&quot;]\n  mapi --&gt; hpa[&quot;HPA web&lt;br/&gt;min 2 · max 6 · CPU 50%&quot;]\n  hpa --&gt;|&quot;scale&quot;| d[&quot;Deployment web&lt;br/&gt;request cpu 100m&quot;]\n  hpa2[&quot;HPA api&lt;br/&gt;TARGETS unknown&quot;] -.-&gt;|&quot;thiếu CPU request&quot;| d2[&quot;Deployment api&quot;]\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class hpa2 bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant H as HPA controller\n  participant M as metrics.k8s.io\n  participant A as kube-apiserver\n  loop mỗi 15 giây\n    H-&gt;&gt;M: CPU hiện tại của các Pod web\n    M--&gt;&gt;H: tổng millicore\n    H-&gt;&gt;H: % = dùng / request\n    H-&gt;&gt;H: mong muốn = ceil(hiện tại × % / 50%)\n    alt tăng\n      H-&gt;&gt;A: scale Deployment lên (≤ max)\n    else giảm\n      H-&gt;&gt;H: chờ hết stabilizationWindowSeconds\n      H-&gt;&gt;A: scale xuống (≥ min)\n    end\n  end\n<\/code><\/pre>"]]}, {"id": 12, "slug": "node-selection", "dir": "12-node-selection", "title": "nodeSelector, node affinity, taint và toleration", "level": 3, "env": "any", "minutes": 30, "comps": ["work:4"], "goal": "<p>Đặt Pod lên đúng node: chọn node bằng label, giữ riêng một node cho workload đặc biệt bằng taint, và cho đúng workload đó vào bằng toleration cộng affinity.<\/p>", "concepts": "<ul>\n<li><code>nodeSelector<\/code> là điều kiện cứng đơn giản. <code>nodeAffinity<\/code> có <code>requiredDuringScheduling…<\/code> (cứng) và <code>preferredDuringScheduling…<\/code> (cộng điểm, có <code>weight<\/code>).<\/li>\n<li><strong>Taint<\/strong> đẩy Pod ra khỏi node (<code>NoSchedule<\/code>, <code>PreferNoSchedule<\/code>, <code>NoExecute<\/code>). <strong>Toleration<\/strong> chỉ <em>cho phép<\/em> Pod vào node có taint, không <em>ép<\/em> Pod vào đó. Muốn dành riêng node: taint + toleration + affinity.<\/li>\n<li><code>IgnoredDuringExecution<\/code>: đổi label node sau khi Pod đã chạy không đuổi Pod. Riêng taint <code>NoExecute<\/code> thì đuổi.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Gắn label <code>disktype=ssd<\/code> cho <code>$NODE1<\/code> và <code>disktype=hdd<\/code> cho <code>$NODE2<\/code>.<\/p>", "<p>Trong <code>lab12<\/code>, tạo Pod <code>fast<\/code> (image <code>nginx:1.27<\/code>) chỉ chạy trên node có <code>disktype=ssd<\/code>, dùng <code>nodeSelector<\/code>.<\/p>", "<p>Dành <code>$NODE2<\/code> cho workload GPU: gắn taint <code>dedicated=gpu:NoSchedule<\/code> và label <code>accelerator=nvidia<\/code>.<\/p>", "<p>Tạo Deployment <code>gpu-job<\/code> (2 replica, image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) chạy <strong>chỉ<\/strong> trên <code>$NODE2<\/code>: tolerate taint ở trên và dùng <code>requiredDuringSchedulingIgnoredDuringExecution<\/code> với label <code>accelerator=nvidia<\/code>.<\/p>", "<p>Tạo Pod <code>flex<\/code> (image <code>nginx:1.27<\/code>) <strong>ưu tiên<\/strong> (không bắt buộc) node có <code>disktype=hdd<\/code>, weight 80.<\/p>"], "hints": [["Gỡ taint", "<p>Thêm dấu <code>-<\/code> ở cuối: <code>kubectl taint node $NODE2 dedicated-<\/code><\/p>"], ["Vì sao Pod tolerate rồi vẫn chạy sang node khác?", "<p>Toleration không chọn node. Cần thêm affinity hoặc nodeSelector.<\/p>"]], "solution": "<pre><code class=\"language-bash\">eval &quot;$(./lab env)&quot;\nkubectl label node $NODE1 disktype=ssd\nkubectl label node $NODE2 disktype=hdd accelerator=nvidia\nkubectl taint node $NODE2 dedicated=gpu:NoSchedule\nkubectl run fast -n lab12 --image=nginx:1.27 $do &gt; fast.yaml   # thêm nodeSelector rồi apply\n<\/code><\/pre>\n<pre><code class=\"language-yaml\"># fast\nspec:\n  nodeSelector: {disktype: ssd}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: gpu-job, namespace: lab12}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: gpu-job}}\n  template:\n    metadata: {labels: {app: gpu-job}}\n    spec:\n      tolerations:\n      - {key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}\n      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n            nodeSelectorTerms:\n            - matchExpressions:\n              - {key: accelerator, operator: In, values: [nvidia]}\n      containers:\n      - {name: job, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n---\napiVersion: v1\nkind: Pod\nmetadata: {name: flex, namespace: lab12}\nspec:\n  affinity:\n    nodeAffinity:\n      preferredDuringSchedulingIgnoredDuringExecution:\n      - weight: 80\n        preference:\n          matchExpressions:\n          - {key: disktype, operator: In, values: [hdd]}\n  containers:\n  - {name: flex, image: nginx:1.27}\n<\/code><\/pre>", "docs": [["Assigning Pods to nodes", "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"], ["Taints and tolerations", "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"]], "support": "scaffold", "prereq": [5, 9], "guide": [["Câu 1 · Gắn label cho node", "<p><strong>Khung:<\/strong> <code>kubectl label node &lt;node&gt; &lt;key&gt;=&lt;value&gt;<\/code>. Hai node, hai lệnh.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get nodes -L disktype<\/code> thêm cột <code>DISKTYPE<\/code>.<\/p>"], ["Câu 2 · nodeSelector", "<p><strong>Tra:<\/strong> <code>kubectl explain pod.spec.nodeSelector<\/code>. Đây là một map, đặt ngang hàng <code>containers<\/code>.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl run fast … $do &gt; fast.yaml<\/code>, thêm <code>nodeSelector:<\/code> vào <code>spec<\/code>, rồi apply.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pod fast -n lab12 -o wide<\/code>. Cột NODE phải là <code>$NODE1<\/code>.<\/p>"], ["Câu 3 · Taint", "<p><strong>Khung:<\/strong> <code>kubectl taint node &lt;node&gt; &lt;key&gt;=&lt;value&gt;:&lt;effect&gt;<\/code>. Label <code>accelerator<\/code> gắn như câu 1.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl describe node $NODE2 | grep Taints<\/code>.<\/p>"], ["Câu 4 · Toleration + node affinity bắt buộc", "<p>Hai cơ chế giải quyết hai việc khác nhau:<\/p>\n<ul>\n<li><strong>Toleration<\/strong> chỉ <em>cho phép<\/em> Pod chạy trên node có taint, không <em>kéo<\/em> Pod về đó.<\/li>\n<li><strong>Affinity bắt buộc<\/strong> mới <em>giới hạn<\/em> Pod chỉ chạy ở node có label.<\/li>\n<\/ul>\n<p>Bài này cần cả hai.<\/p>\n<p><strong>Tra:<\/strong> trang <em>Assigning Pods to Nodes<\/em>, mục <em>Node affinity<\/em>, có sẵn YAML mẫu để chép. <code>kubectl explain pod.spec.affinity.nodeAffinity<\/code> cho cấu trúc.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl create deploy gpu-job --replicas=2 … $do -- sleep 3600 &gt; gpu.yaml<\/code>. Trong <code>template.spec<\/code> thêm <code>tolerations:<\/code> (key, operator <code>Equal<\/code>, value, effect) và <code>affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[].matchExpressions[]<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -n lab12 -l app=gpu-job -o wide<\/code>. Cả hai Pod nằm trên <code>$NODE2<\/code>.<\/p>"], ["Câu 5 · Affinity ưu tiên", "<p><strong>Tra:<\/strong> cùng trang, ví dụ <code>preferredDuringSchedulingIgnoredDuringExecution<\/code>. Cấu trúc khác bản required: mỗi phần tử có <code>weight<\/code> và <code>preference.matchExpressions<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> <code>$NODE2<\/code> có taint, mà <code>flex<\/code> không tolerate. Vì vậy dù ưu tiên <code>hdd<\/code>, Pod vẫn phải chạy ở node khác. Đó là hành vi đúng: preferred không bao giờ thắng taint.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart TB\n  subgraph n1 [&quot;NODE1 · disktype=ssd&quot;]\n    fast[&quot;Pod fast&lt;br/&gt;nodeSelector disktype=ssd&quot;]\n  end\n  subgraph n2 [&quot;NODE2 · disktype=hdd · accelerator=nvidia&lt;br/&gt;taint dedicated=gpu:NoSchedule&quot;]\n    g1[&quot;gpu-job Pod 1&quot;]\n    g2[&quot;gpu-job Pod 2&quot;]\n  end\n  flex[&quot;Pod flex&lt;br/&gt;ưu tiên hdd, weight 80&lt;br/&gt;không tolerate taint&quot;] -.-&gt;|&quot;bị taint chặn&quot;| n2\n  flex --&gt; n1\n<\/code><\/pre>\n<p>Taint <strong>đẩy<\/strong> Pod không phù hợp ra. Affinity <strong>kéo<\/strong> Pod về. gpu-job cần cả hai mới chỉ chạy trên NODE2.<\/p>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant S as kube-scheduler\n  participant A as kube-apiserver\n  S-&gt;&gt;A: watch Pod chưa có node\n  Note over S: Filter: loại node không đạt\n  S-&gt;&gt;S: nodeSelector / required affinity khớp label?\n  S-&gt;&gt;S: taint của node có được tolerate?\n  S-&gt;&gt;S: node còn đủ requests?\n  Note over S: Score: chấm điểm node còn lại\n  S-&gt;&gt;S: preferred affinity cộng weight\n  S-&gt;&gt;S: cân bằng tài nguyên, spread...\n  S-&gt;&gt;A: bind Pod vào node điểm cao nhất\n  Note over S,A: không node nào qua Filter thì Pod Pending + event FailedScheduling\n<\/code><\/pre>"]]}, {"id": 13, "slug": "spread-priority", "dir": "13-spread-priority", "title": "Anti-affinity, topology spread và PriorityClass", "level": 3, "env": "any", "minutes": 30, "comps": ["work:4"], "goal": "<p>Tách replica ra các node khác nhau để chịu lỗi, chia đều Pod theo topology, và gán độ ưu tiên cho workload quan trọng.<\/p>", "concepts": "<ul>\n<li><code>podAntiAffinity<\/code> với <code>topologyKey: kubernetes.io/hostname<\/code> cấm hai Pod cùng label nằm chung node. Nếu <code>required<\/code> mà không đủ node, Pod thừa đứng Pending.<\/li>\n<li><code>topologySpreadConstraints<\/code>: <code>maxSkew<\/code> là chênh lệch tối đa giữa các miền, <code>whenUnsatisfiable: DoNotSchedule<\/code> (cứng) hoặc <code>ScheduleAnyway<\/code>. <code>nodeTaintsPolicy: Honor<\/code> loại khỏi phép tính các node có taint mà Pod không tolerate (mặc định là <code>Ignore<\/code>, tức vẫn tính).<\/li>\n<li>PriorityClass gán số ưu tiên; Pod ưu tiên cao có thể <strong>preempt<\/strong> (đuổi) Pod thấp hơn khi thiếu chỗ. Một PriorityClass có thể là <code>globalDefault<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab13<\/code>, tạo Deployment <code>web<\/code> (2 replica, <code>nginx:1.27<\/code>, label <code>app=web<\/code>) mà hai Pod <strong>bắt buộc<\/strong> nằm trên hai node khác nhau.<\/p>", "<p>Tạo Deployment <code>spread<\/code> (4 replica, <code>nginx:1.27<\/code>, label <code>app=spread<\/code>) chia đều theo node (<code>kubernetes.io/hostname<\/code>), <code>maxSkew: 1<\/code>, không được vi phạm. Cả 4 Pod phải chạy.<\/p>", "<p>Cluster có một PriorityClass là mặc định toàn cục. Ghi tên của nó vào <code>~/cka-answers/13-default-pc.txt<\/code>.<\/p>", "<p>Tạo PriorityClass <code>critical-app<\/code> với value <code>1000000<\/code>, không phải mặc định, mô tả <code>payment<\/code>. Tạo Pod <code>vip<\/code> (<code>nginx:1.27<\/code>) dùng nó.<\/p>"], "hints": [["spread chỉ chạy được 2 Pod?", "<p>Control plane cũng được tính là một \"miền\" với 0 Pod, nên mỗi worker chỉ được 1 Pod. Đặt <code>nodeTaintsPolicy: Honor<\/code> để bỏ qua node có taint mà Pod không tolerate.<\/p>"], ["Tìm PriorityClass mặc định", "<p><code>kubectl get priorityclass<\/code> rồi xem cột <code>GLOBAL-DEFAULT<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-yaml\">apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web, namespace: lab13}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: web}}\n  template:\n    metadata: {labels: {app: web}}\n    spec:\n      affinity:\n        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n          - topologyKey: kubernetes.io/hostname\n            labelSelector: {matchLabels: {app: web}}\n      containers:\n      - {name: nginx, image: nginx:1.27}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: spread, namespace: lab13}\nspec:\n  replicas: 4\n  selector: {matchLabels: {app: spread}}\n  template:\n    metadata: {labels: {app: spread}}\n    spec:\n      topologySpreadConstraints:\n      - maxSkew: 1\n        topologyKey: kubernetes.io/hostname\n        whenUnsatisfiable: DoNotSchedule\n        nodeTaintsPolicy: Honor\n        labelSelector: {matchLabels: {app: spread}}\n      containers:\n      - {name: nginx, image: nginx:1.27}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl get pc                     # cột GLOBAL-DEFAULT\necho team-default &gt; ~/cka-answers/13-default-pc.txt\nkubectl create priorityclass critical-app --value=1000000 --description=payment\nkubectl run vip -n lab13 --image=nginx:1.27 $do &gt; vip.yaml   # thêm spec.priorityClassName: critical-app\nkubectl apply -f vip.yaml\nkubectl get pod vip -n lab13 -o jsonpath='{.spec.priority}'   # 1000000\n<\/code><\/pre>\n<p>Nếu thiếu <code>nodeTaintsPolicy: Honor<\/code>, control plane (có taint) vẫn được tính là một miền với 0 Pod, nên mỗi worker chỉ nhận 1 Pod và 2 Pod còn lại đứng Pending. Có <code>Honor<\/code> thì chỉ tính 2 worker: 2 + 2.<\/p>", "docs": [["Inter-pod affinity and anti-affinity", "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity"], ["Pod topology spread constraints", "https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"], ["Pod priority and preemption", "https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/"]], "support": "scaffold", "prereq": [12], "guide": [["Câu 1 · Pod anti-affinity bắt buộc", "<p><strong>Tra:<\/strong> trang <em>Assigning Pods to Nodes<\/em>, mục <em>Inter-pod affinity and anti-affinity<\/em>.<\/p>\n<p><strong>Khung:<\/strong> trong <code>template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[]<\/code> cần hai trường: <code>topologyKey<\/code> (miền: mỗi node là một miền) và <code>labelSelector<\/code> (tránh Pod nào: chính các Pod <code>app=web<\/code>).<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -n lab13 -l app=web -o wide<\/code>. Hai Pod nằm ở hai NODE khác nhau. Thử <code>kubectl scale … --replicas=3<\/code>: Pod thứ 3 phải Pending, rồi scale lại về 2.<\/p>"], ["Câu 2 · Topology spread", "<p><strong>Tra:<\/strong> trang <em>Pod Topology Spread Constraints<\/em>. Các trường cần có: <code>maxSkew<\/code>, <code>topologyKey<\/code>, <code>whenUnsatisfiable<\/code>, <code>labelSelector<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -n lab13 -l app=spread -o wide<\/code>. Phải có 4 Pod Running, 2 + 2.<\/p>\n<p><strong>Bẫy:<\/strong> nếu chỉ 2 Pod chạy và 2 Pending, đọc <code>kubectl describe pod<\/code> của Pod Pending, rồi xem lại trong trang tài liệu trường nào quyết định node <strong>có taint<\/strong> có được tính là một miền không.<\/p>"], ["Câu 3 · PriorityClass mặc định", "<p><strong>Khung:<\/strong> <code>kubectl get priorityclass<\/code>, rồi xem cột <code>GLOBAL-DEFAULT<\/code>.<\/p>"], ["Câu 4 · Tạo và dùng PriorityClass", "<p><strong>Khung:<\/strong> <code>kubectl create priorityclass --help<\/code> có đủ cờ: value, description, global-default. Pod dùng nó qua trường <code>spec.priorityClassName<\/code>.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pod vip -n lab13 -o jsonpath='{.spec.priority}'<\/code>. Admission controller đã điền số <code>1000000<\/code> vào Pod.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart TB\n  subgraph w1 [&quot;worker 1&quot;]\n    a1[&quot;web&quot;]\n    s1[&quot;spread&quot;]\n    s2[&quot;spread&quot;]\n  end\n  subgraph w2 [&quot;worker 2&quot;]\n    a2[&quot;web&quot;]\n    s3[&quot;spread&quot;]\n    s4[&quot;spread&quot;]\n  end\n  cp[&quot;control plane (taint)&lt;br/&gt;không được tính là miền&quot;]\n  a1 &lt;-.-&gt;|&quot;anti-affinity: không chung node&quot;| a2\n  pc[&quot;PriorityClass critical-app&lt;br/&gt;value 1000000&quot;] --&gt; vip[&quot;Pod vip&quot;]\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant S as kube-scheduler\n  participant N as các node\n  S-&gt;&gt;N: đếm Pod app=spread theo từng miền (hostname)\n  Note over S: skew = max − min, phải ≤ maxSkew 1\n  alt nodeTaintsPolicy Honor\n    S-&gt;&gt;S: chỉ tính 2 worker → 2 + 2 hợp lệ\n  else mặc định (Ignore)\n    S-&gt;&gt;S: control plane là miền có 0 Pod\n    S-&gt;&gt;S: worker thứ 2 lên 2 Pod thì skew = 2 → Pending\n  end\n  Note over S: Pod priority cao, không node nào trống\n  S-&gt;&gt;N: preemption: đuổi Pod priority thấp hơn\n<\/code><\/pre>"]]}, {"id": 14, "slug": "static-pod-maintenance", "dir": "14-static-pod-maintenance", "title": "Static pod, lập lịch thủ công và bảo trì node", "level": 3, "env": "kind", "minutes": 35, "comps": ["work:4", "work:3", "trouble:0"], "goal": "<p>Chạy Pod không qua scheduler (static pod, <code>nodeName<\/code>), và đưa một node vào bảo trì an toàn với PodDisruptionBudget, <code>cordon<\/code> và <code>drain<\/code>.<\/p>", "concepts": "<ul>\n<li><strong>Static pod<\/strong>: kubelet đọc file YAML trong <code>staticPodPath<\/code> (kubeadm: <code>/etc/kubernetes/manifests<\/code>) và chạy Pod mà không cần API server. API chỉ thấy một \"mirror pod\" tên <code>&lt;tên&gt;-&lt;node&gt;<\/code>; xóa bằng kubectl không có tác dụng, phải xóa file.<\/li>\n<li>Đặt <code>spec.nodeName<\/code> thì bỏ qua scheduler: kubelet của node đó nhận Pod luôn. Hữu ích khi scheduler chết.<\/li>\n<li><code>cordon<\/code> chặn Pod mới; <code>drain<\/code> = cordon + đuổi Pod qua Eviction API, tôn trọng <strong>PodDisruptionBudget<\/strong>. DaemonSet và mirror pod không bị đuổi; cần <code>--ignore-daemonsets<\/code>, <code>--delete-emptydir-data<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Tạo static pod <code>static-web<\/code> (image <code>nginx:1.27<\/code>) trên <code>$NODE1<\/code>. Tìm đúng thư mục từ cấu hình kubelet của node.<\/p>", "<p>Giả sử scheduler đang hỏng. Tạo Pod <code>manual<\/code> (image <code>nginx:1.27<\/code>) trong <code>lab14<\/code> chạy trên <code>$NODE2<\/code> <strong>mà không qua scheduler<\/strong>.<\/p>", "<p>Deployment <code>web<\/code> trong <code>lab14<\/code> có 3 replica. Tạo PodDisruptionBudget <code>web-pdb<\/code> đảm bảo luôn còn ít nhất 2 Pod <code>app=web<\/code>.<\/p>", "<p>Đưa <code>$NODE1<\/code> vào bảo trì: không nhận Pod mới và mọi Pod thường đã dời đi. Để nguyên trạng thái này khi chấm; <code>./lab reset 14<\/code> sẽ đưa node trở lại.<\/p>"], "hints": [["Tìm thư mục static pod", "<p><code>./lab ssh $NODE1<\/code> rồi <code>grep staticPodPath /var/lib/kubelet/config.yaml<\/code><\/p>"], ["Drain bị chặn?", "<p>Đọc thông báo: thường do DaemonSet (<code>--ignore-daemonsets<\/code>), Pod dùng emptyDir (<code>--delete-emptydir-data<\/code>), hoặc Pod không có controller (Pod trần, cần <code>--force<\/code>, và Pod đó sẽ mất hẳn). Pod trần còn sót từ lab khác: <code>./lab reset &lt;id&gt;<\/code> hoặc thêm <code>--force<\/code>.<\/p>"]], "solution": "<pre><code class=\"language-bash\">eval &quot;$(./lab env)&quot;\nkubectl run static-web --image=nginx:1.27 $do &gt; static-web.yaml\n./lab ssh $NODE1\n#   trên node:\n#   grep staticPodPath /var/lib/kubelet/config.yaml     → /etc/kubernetes/manifests\n#   cat &gt; /etc/kubernetes/manifests/static-web.yaml     (dán nội dung) ; exit\nkubectl get pod static-web-$NODE1                         # mirror pod\n\nkubectl run manual -n lab14 --image=nginx:1.27 $do &gt; manual.yaml\n# thêm  spec.nodeName: &lt;tên NODE2&gt;  rồi apply\nkubectl apply -f manual.yaml\n\nkubectl create pdb web-pdb -n lab14 --selector=app=web --min-available=2\nkubectl drain $NODE1 --ignore-daemonsets --delete-emptydir-data\nkubectl get nodes          # NODE1: Ready,SchedulingDisabled\n<\/code><\/pre>", "docs": [["Create static Pods", "https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/"], ["Safely drain a node", "https://kubernetes.io/docs/tasks/administer-cluster/safely-drain-node/"], ["Disruptions", "https://kubernetes.io/docs/concepts/workloads/pods/disruptions/"]], "support": "scaffold", "prereq": [12], "guide": [["Câu 1 · Static pod", "<p>Static pod do <strong>kubelet<\/strong> đọc từ một thư mục trên node, không qua API server. API server chỉ thấy một \"mirror pod\" tên <code>&lt;tên&gt;-&lt;node&gt;<\/code>.<\/p>\n<p><strong>Tra:<\/strong> cấu hình kubelet ở <code>/var/lib/kubelet/config.yaml<\/code>, trường <code>staticPodPath<\/code>. Nếu không có file đó, xem cờ kubelet: <code>ps aux | grep kubelet<\/code>.<\/p>\n<p><strong>Khung:<\/strong> sinh YAML bằng <code>kubectl run … $do<\/code> ở máy bạn, <code>./lab ssh $NODE1<\/code>, rồi ghi file vào thư mục tìm được.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pods -A | grep static-web<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> xóa mirror pod bằng kubectl thì nó sống lại ngay. Muốn xóa static pod thì xóa file trên node.<\/p>"], ["Câu 2 · Lập lịch thủ công", "<p>Scheduler chỉ làm một việc: điền trường <code>spec.nodeName<\/code>. Tự điền trường này thì Pod bỏ qua scheduler.<\/p>\n<p><strong>Khung:<\/strong> YAML Pod + <code>nodeName: &lt;tên node&gt;<\/code> trong <code>spec<\/code>.<\/p>\n<p><strong>Bẫy:<\/strong> <code>nodeName<\/code> phải có <strong>khi tạo<\/strong> Pod. Pod đã Pending thì không sửa được, phải xóa đi tạo lại.<\/p>"], ["Câu 3 · PodDisruptionBudget", "<p><strong>Khung:<\/strong> <code>kubectl create pdb --help<\/code> (<code>--selector<\/code>, <code>--min-available<\/code>).<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get pdb -n lab14<\/code>. Cột <code>ALLOWED DISRUPTIONS<\/code> là 1 (3 Pod − 2 tối thiểu).<\/p>"], ["Câu 4 · Bảo trì node", "<p><code>cordon<\/code> chỉ chặn Pod mới. <code>drain<\/code> = cordon + đuổi Pod đang chạy (có tôn trọng PDB).<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl drain &lt;node&gt;<\/code> cùng các cờ cho DaemonSet và emptyDir. Đọc thông báo lỗi: nó nói đúng cờ còn thiếu.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get nodes<\/code> thấy <code>SchedulingDisabled<\/code>; <code>kubectl get pods -A -o wide | grep $NODE1<\/code> chỉ còn Pod của DaemonSet và static pod.<\/p>\n<p><strong>Bẫy:<\/strong> Pod không có controller (Pod trần) chặn drain. Đọc kỹ thông báo trước khi thêm <code>--force<\/code>, vì Pod đó sẽ mất hẳn.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  subgraph n1 [&quot;NODE1&quot;]\n    f[&quot;staticPodPath/static-web.yaml&quot;] --&gt; kl[&quot;kubelet&quot;]\n    kl --&gt; sp[&quot;static-web (chạy thật)&quot;]\n  end\n  kl --&gt;|&quot;tạo mirror pod&quot;| api[&quot;kube-apiserver&lt;br/&gt;static-web-NODE1&quot;]\n  manual[&quot;Pod manual&lt;br/&gt;spec.nodeName: NODE2&quot;] --&gt;|&quot;bỏ qua scheduler&quot;| n2[&quot;NODE2&quot;]\n  pdb[&quot;PDB web-pdb&lt;br/&gt;minAvailable 2&quot;] --&gt; web[&quot;Deployment web × 3&quot;]\n  drain[&quot;kubectl drain NODE1&quot;] --&gt;|&quot;tôn trọng&quot;| pdb\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant K as kubectl drain\n  participant A as kube-apiserver\n  participant P as PDB\n  participant RS as ReplicaSet controller\n  K-&gt;&gt;A: cordon: spec.unschedulable = true\n  loop từng Pod trên node (trừ DaemonSet, static pod)\n    K-&gt;&gt;A: POST eviction\n    A-&gt;&gt;P: còn đủ minAvailable nếu đuổi Pod này?\n    alt đủ\n      A--&gt;&gt;K: 201, Pod bị xóa\n      RS-&gt;&gt;A: tạo Pod thay thế ở node khác\n    else không đủ\n      A--&gt;&gt;K: 429, thử lại sau\n    end\n  end\n  K--&gt;&gt;K: node drained\n<\/code><\/pre>"]]}, {"id": 15, "slug": "services", "dir": "15-services", "title": "Service, EndpointSlice và kết nối giữa các Pod", "level": 4, "env": "any", "minutes": 35, "comps": ["net:2", "net:0", "trouble:4"], "goal": "<p>Tạo đủ loại Service, hiểu Service tìm Pod bằng selector và EndpointSlice, sửa Service không có endpoint, và trỏ Service ra ngoài cluster.<\/p>", "concepts": "<ul>\n<li>Service chọn Pod bằng <strong>label selector<\/strong>; EndpointSlice controller ghi IP:port của các Pod <strong>Ready<\/strong> khớp selector. Service không có endpoint gần như luôn do selector sai hoặc Pod chưa Ready.<\/li>\n<li><code>port<\/code> là cổng của Service, <code>targetPort<\/code> là cổng của container (có thể dùng tên cổng), <code>nodePort<\/code> là cổng mở trên mọi node (30000–32767).<\/li>\n<li><strong>Headless<\/strong> (<code>clusterIP: None<\/code>): DNS trả thẳng IP Pod; với StatefulSet mỗi Pod có tên riêng <code>db-0.db.&lt;ns&gt;.svc.cluster.local<\/code>.<\/li>\n<li>Service <strong>không selector<\/strong> cộng EndpointSlice tự tạo (label <code>kubernetes.io/service-name<\/code>) để trỏ tới máy ngoài cluster.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Trong <code>lab15<\/code>, expose Deployment <code>web<\/code> thành Service ClusterIP tên <code>web<\/code>, cổng 80. Ghi ClusterIP của nó vào <code>~/cka-answers/15-web-ip.txt<\/code>.<\/p>", "<p>Tạo Service <code>web-np<\/code> kiểu NodePort cho <code>web<\/code>: cổng 80, nodePort <code>30080<\/code>.<\/p>", "<p>Service <code>api-svc<\/code> không trả lời. Sửa nó (không sửa Deployment <code>api<\/code>) để gọi <code>http://api-svc.lab15<\/code> từ Pod khác nhận được trang nginx.<\/p>", "<p>StatefulSet <code>db<\/code> đã có nhưng thiếu Service. Tạo headless Service <code>db<\/code> cổng 5432 để tên <code>db-0.db.lab15.svc.cluster.local<\/code> phân giải được.<\/p>", "<p>Tạo Service <code>legacy-db<\/code> (cổng 5432, không selector) trỏ tới máy <code>10.0.5.20:5432<\/code> bằng một EndpointSlice tự viết tên <code>legacy-db-1<\/code>.<\/p>"], "hints": [["Vì sao Service không có endpoint?", "<p>So <code>kubectl get svc api-svc -n lab15 -o jsonpath='{.spec.selector}'<\/code> với <code>kubectl get pods -n lab15 --show-labels<\/code>, và <code>targetPort<\/code> với cổng container.<\/p>"], ["Thử gọi Service", "<p><code>kubectl run t -n lab15 --rm -it --image=busybox:1.36 --restart=Never -- wget -qO- -T3 api-svc<\/code><\/p>"]], "solution": "<pre><code class=\"language-bash\">kubectl expose deploy web -n lab15 --port=80\nkubectl get svc web -n lab15 -o jsonpath='{.spec.clusterIP}' &gt; ~/cka-answers/15-web-ip.txt\nkubectl expose deploy web -n lab15 --name=web-np --type=NodePort --port=80 $do &gt; np.yaml\n# thêm nodePort: 30080 dưới ports[0], rồi\nkubectl apply -f np.yaml\n\nkubectl get svc api-svc -n lab15 -o yaml       # selector app=apis, targetPort 8080\nkubectl get pods -n lab15 --show-labels        # Pod có app=api, nginx nghe cổng 80\nkubectl patch svc api-svc -n lab15 --type=json -p '[{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/selector&quot;,&quot;value&quot;:{&quot;app&quot;:&quot;api&quot;}},{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/spec/ports/0/targetPort&quot;,&quot;value&quot;:80}]'\nkubectl get endpointslices -n lab15 -l kubernetes.io/service-name=api-svc\n\nkubectl create svc clusterip db -n lab15 --clusterip=None --tcp=5432\n# selector của Service tạo bằng lệnh trên là app=db, khớp label Pod của StatefulSet\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Service\nmetadata: {name: legacy-db, namespace: lab15}\nspec:\n  ports: [{port: 5432, protocol: TCP}]\n---\napiVersion: discovery.k8s.io/v1\nkind: EndpointSlice\nmetadata:\n  name: legacy-db-1\n  namespace: lab15\n  labels: {kubernetes.io/service-name: legacy-db}\naddressType: IPv4\nports: [{port: 5432, protocol: TCP}]\nendpoints: [{addresses: [&quot;10.0.5.20&quot;]}]\n<\/code><\/pre>", "docs": [["Service", "https://kubernetes.io/docs/concepts/services-networking/service/"], ["EndpointSlices", "https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/"], ["Debug Services", "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"]], "support": "scaffold", "prereq": [5], "guide": [["Câu 1 · Expose ClusterIP", "<p><strong>Khung:<\/strong> <code>kubectl expose deploy &lt;tên&gt; --port=…<\/code>, rồi lấy <code>spec.clusterIP<\/code> bằng jsonpath và ghi vào file.<\/p>"], ["Câu 2 · NodePort cố định", "<p><code>kubectl expose<\/code> không có cờ để chọn nodePort.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl expose … --name=web-np --type=NodePort $do &gt; np.yaml<\/code>, thêm <code>nodePort: 30080<\/code> vào <code>ports[0]<\/code>, rồi apply.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get svc web-np -n lab15<\/code> hiện cột PORT(S) <code>80:30080/TCP<\/code>.<\/p>"], ["Câu 3 · Service không trả lời", "<p>Service nối với Pod qua hai thứ, phải kiểm tra <strong>cả hai<\/strong>:<\/p>\n<ol>\n<li><code>selector<\/code> của Service phải khớp <strong>label<\/strong> của Pod.<\/li>\n<li><code>targetPort<\/code> phải là cổng container <strong>thật sự lắng nghe<\/strong>.<\/li>\n<\/ol>\n<p><strong>Khung:<\/strong> so <code>kubectl get svc api-svc -o yaml<\/code> với <code>kubectl get pods --show-labels<\/code> và <code>containerPort<\/code> của Pod.<\/p>\n<p><strong>Tự kiểm:<\/strong> <code>kubectl get endpointslices -n lab15 -l kubernetes.io/service-name=api-svc<\/code> có địa chỉ, rồi <code>kubectl run t --rm -it --image=busybox:1.36 -n lab15 --restart=Never -- wget -qO- -T3 api-svc<\/code>.<\/p>"], ["Câu 4 · Headless Service cho StatefulSet", "<p>Headless (<code>clusterIP: None<\/code>) không có IP ảo. DNS trả thẳng IP của Pod, và mỗi Pod của StatefulSet có tên riêng <code>&lt;pod&gt;.&lt;service&gt;<\/code>.<\/p>\n<p><strong>Khung:<\/strong> <code>kubectl create svc clusterip --help<\/code>, tìm cờ cho clusterIP None.<\/p>\n<p><strong>Bẫy:<\/strong> tên Service phải trùng <code>spec.serviceName<\/code> của StatefulSet. Selector phải khớp label Pod: kiểm tra Service <code>create svc<\/code> sinh selector gì.<\/p>"], ["Câu 5 · Service trỏ ra ngoài cluster", "<p>Service <strong>không có selector<\/strong> thì control plane không tạo EndpointSlice, bạn tự viết.<\/p>\n<p><strong>Tra:<\/strong> trang <em>Service<\/em>, mục <em>Services without selectors<\/em>, có YAML EndpointSlice mẫu.<\/p>\n<p><strong>Bẫy:<\/strong> label <code>kubernetes.io/service-name<\/code> nối EndpointSlice với Service. Thiếu label này thì Service không dùng nó.<\/p>"]], "diagrams": [["Lab dựng gì", "<pre><code class=\"language-mermaid\">flowchart LR\n  c([&quot;Pod client&quot;]) --&gt;|&quot;web.lab15:80&quot;| s1[&quot;Service web&lt;br/&gt;ClusterIP&quot;]\n  out([&quot;ngoài cluster&quot;]) --&gt;|&quot;NodeIP:30080&quot;| s2[&quot;Service web-np&lt;br/&gt;NodePort&quot;]\n  s1 &amp; s2 --&gt; w[&quot;Pod web&quot;]\n  s3[&quot;Service api-svc&quot;] -.-&gt;|&quot;selector? targetPort?&quot;| a[&quot;Pod api · app=api · cổng 80&quot;]\n  h[&quot;Service db&lt;br/&gt;clusterIP None&quot;] --&gt; d0[&quot;db-0.db.lab15...&quot;]\n  h --&gt; d1[&quot;db-1.db.lab15...&quot;]\n  l[&quot;Service legacy-db&lt;br/&gt;không selector&quot;] --&gt; es[&quot;EndpointSlice legacy-db-1&lt;br/&gt;10.0.5.20:5432&quot;]\n  classDef bad stroke:#C63B36,stroke-width:2px,stroke-dasharray:5 3\n  class s3 bad\n<\/code><\/pre>"], ["Luồng hoạt động", "<pre><code class=\"language-mermaid\">sequenceDiagram\n  participant EC as EndpointSlice controller\n  participant A as kube-apiserver\n  participant KP as kube-proxy (mỗi node)\n  participant C as Pod client\n  participant P as Pod đích\n  EC-&gt;&gt;A: watch Service và Pod\n  EC-&gt;&gt;A: Pod Ready khớp selector → ghi EndpointSlice\n  KP-&gt;&gt;A: watch Service + EndpointSlice\n  KP-&gt;&gt;KP: viết luật iptables/nftables: ClusterIP → IP Pod\n  C-&gt;&gt;C: DNS: web.lab15 → ClusterIP\n  C-&gt;&gt;P: gói tới ClusterIP:80, bị DNAT sang PodIP:targetPort\n  P--&gt;&gt;C: trả lời\n<\/code><\/pre>\n<p>ClusterIP là IP ảo: không có tiến trình nào lắng nghe trên nó, chỉ có luật NAT trên mỗi node.<\/p>"]]}, {"id": 16, "slug": "dns-coredns", "dir": "16-dns-coredns", "title": "DNS trong cluster và CoreDNS", "level": 4, "env": "any", "minutes": 30, "comps": ["net:5", "trouble:4"], "goal": "<p>Hiểu tên DNS của Service và Pod, đọc cấu hình DNS của Pod, tùy chỉnh <code>dnsPolicy<\/code>, và sửa Corefile của CoreDNS để phân giải tên nội bộ của công ty.<\/p>", "concepts": "<ul>\n<li>Service: <code>&lt;svc&gt;.&lt;ns&gt;.svc.&lt;cluster-domain&gt;<\/code> (mặc định <code>cluster.local<\/code>). Pod đọc <code>/etc/resolv.conf<\/code>: nameserver là ClusterIP của Service <code>kube-dns<\/code>, có <code>search &lt;ns&gt;.svc.cluster.local svc.cluster.local cluster.local<\/code> và <code>ndots:5<\/code>.<\/li>\n<li><code>dnsPolicy<\/code>: <code>ClusterFirst<\/code> (mặc định, dùng CoreDNS), <code>Default<\/code> (dùng DNS của node, <strong>không<\/strong> phân giải được Service), <code>None<\/code> (tự khai báo trong <code>dnsConfig<\/code>).<\/li>\n<li>CoreDNS cấu hình bằng ConfigMap <code>coredns<\/code> trong <code>kube-system<\/code> (Corefile). Có thể thêm server block riêng cho một zone. Plugin <code>reload<\/code> tự nạp lại sau khoảng 30 giây; muốn nhanh thì <code>kubectl -n kube-system rollout restart deploy coredns<\/code>.<\/li>\n<\/ul>", "setup_note": "", "tasks": ["<p>Ghi ClusterIP của Service DNS của cluster vào <code>~/cka-answers/16-dns-ip.txt<\/code>, và cluster domain vào <code>~/cka-answers/16-domain.txt<\/code>.<\/p>", "<p>Pod <code>client<\/code> trong <code>lab16<\/code> không phân giải được tên Service nào. Tìm nguyên nhân và sửa để từ <code>client<\/code> chạy <code>nslookup web.lab16<\/code> thành công. Giữ nguyên tên Pod và image.<\/p>", "<p>Tạo Pod <code>custom-dns<\/code> (image <code>busybox:1.36<\/code>, lệnh <code>sleep 3600<\/code>) <strong>chỉ<\/strong> dùng nameserver <code>1.1.1.1<\/code>, search domain <code>lab16.svc.cluster.local<\/code>, option <code>ndots: 2<\/code>.<\/p>", "<p>Công ty có máy <code>legacy.corp.internal<\/code> ở <code>10.10.10.10<\/code> mà DNS công cộng không biết. Sửa CoreDNS để mọi Pod phân giải được tên này, không làm hỏng DNS của cluster.<\/p>"], "hints": [["Tìm cluster domain", "<p><code>kubectl -n kube-system get cm coredns -o yaml<\/code> (dòng <code>kubernetes cluster.local …<\/code>) hoặc <code>clusterDomain<\/code> trong <code>/var/lib/kubelet/config.yaml<\/code> của node.<\/p>"], ["Thêm zone vào Corefile", "<p>Thêm một server block mới ở cuối Corefile, dùng plugin <code>hosts<\/code>:<\/p>\n<pre><code>corp.internal:53 {\n    errors\n    hosts {\n        10.10.10.10 legacy.corp.internal\n    }\n}\n<\/code><\/pre>"]], "solution": "<pre><code class=\"language-bash\">kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}' &gt; ~/cka-answers/16-dns-ip.txt\necho cluster.local &gt; ~/cka-answers/16-domain.txt\n\nkubectl get pod client -n lab16 -o jsonpath='{.spec.dnsPolicy}'   # Default → dùng DNS của node\nkubectl get pod client -n lab16 -o yaml &gt; client.yaml\n# đổi dnsPolicy: Default → ClusterFirst (hoặc xóa dòng), rồi\nkubectl replace --force -f client.yaml\nkubectl exec client -n lab16 -- nslookup web.lab16\n<\/code><\/pre>\n<pre><code class=\"language-yaml\">apiVersion: v1\nkind: Pod\nmetadata: {name: custom-dns, namespace: lab16}\nspec:\n  dnsPolicy: None\n  dnsConfig:\n    nameservers: [&quot;1.1.1.1&quot;]\n    searches: [&quot;lab16.svc.cluster.local&quot;]\n    options: [{name: ndots, value: &quot;2&quot;}]\n  containers:\n  - {name: c, image: busybox:1.36, command: [&quot;sleep&quot;, &quot;3600&quot;]}\n<\/code><\/pre>\n<pre><code class=\"language-bash\">kubectl -n kube-system edit cm coredns     # thêm server block corp.internal ở cuối Corefile\nkubectl -n kube-system rollout restart deploy coredns\nkubectl run t --rm -it --image=busybox:1.36 --restart=Never --
