# Namespace của ứng dụng. Thường do đội platform tạo, kèm giới hạn tài nguyên và Pod Security.
apiVersion: v1
kind: Namespace
metadata:
  name: web-api
  labels:
    # Pod Security Admission: từ chối Pod không đạt chuẩn "restricted"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
# Trần tổng tài nguyên của cả namespace: một ứng dụng lỗi không ăn hết cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: web-api
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 16Gi
    pods: "50"
---
# Giá trị mặc định cho container quên khai báo resources.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: web-api
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 50m, memory: 64Mi}
    default: {memory: 256Mi}
