apiVersion: v1
kind: Service
metadata:
  name: web-api
  labels:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/part-of: shop
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-api
    app.kubernetes.io/instance: web-api
  ports:
  - {name: http, port: 80, targetPort: http, protocol: TCP}   # targetPort theo tên: đổi cổng container không phải sửa Service
