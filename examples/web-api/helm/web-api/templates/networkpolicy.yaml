{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    {{- range .Values.networkPolicy.allowFromNamespaces }}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ . }}}
    {{- end }}
    ports: [{protocol: TCP, port: http}]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:
        matchLabels: {k8s-app: kube-dns}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
