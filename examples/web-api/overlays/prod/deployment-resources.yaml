# strategic merge patch: chỉ ghi trường cần đổi, container khớp theo name
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
spec:
  template:
    spec:
      containers:
      - name: web-api
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {memory: 512Mi}
