# overlay prod: phiên bản ghim, nhiều bản sao hơn, tài nguyên lớn hơn.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web-api-prod
resources:
- ../../base
labels:
- pairs: {environment: prod}
  includeSelectors: false
  includeTemplates: true
images:
- name: ghcr.io/stefanprodan/podinfo
  newTag: "6.15.0"               # CI đổi dòng này khi phát hành (kustomize edit set image …)
patches:
- path: deployment-resources.yaml
- target: {kind: HorizontalPodAutoscaler, name: web-api}
  patch: |-
    - {op: replace, path: /spec/minReplicas, value: 3}
    - {op: replace, path: /spec/maxReplicas, value: 20}
