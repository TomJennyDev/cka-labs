- id: 20
  slug: volumes
  title: "Volume: emptyDir, hostPath, projected và Downward API"
  level: 5
  minutes: 30
  env: kind
  competencies: ["stor:1"]
  goal: |
    Chọn đúng loại volume cho từng nhu cầu: chia sẻ dữ liệu giữa container trong Pod, đọc ghi thư mục của node, và gom nhiều nguồn cấu hình vào một thư mục.
  concepts: |
    - **emptyDir** sống theo Pod, dùng chung giữa các container. `medium: Memory` là tmpfs (tính vào memory limit), `sizeLimit` giới hạn dung lượng.
    - **hostPath** gắn thư mục của node vào Pod; dữ liệu gắn với một node và là rủi ro bảo mật. `type: DirectoryOrCreate` tự tạo thư mục.
    - **projected** gộp `configMap`, `secret`, `downwardAPI`, `serviceAccountToken` vào một thư mục.
    - **Downward API** đưa thông tin của chính Pod (tên, namespace, IP, node, label, resources) vào biến môi trường hoặc file.
  tasks:
    - |
      Trong `lab20`, tạo Pod `shared` có 2 container dùng chung emptyDir `data` (tmpfs, tối đa 64Mi) gắn tại `/data`: container `writer` (`busybox:1.36`) ghi `date` vào `/data/out.log` mỗi 2 giây; container `reader` (`busybox:1.36`) chạy `tail -F /data/out.log`.
    - |
      Tạo Pod `hostlog` (`busybox:1.36`) chạy trên `$NODE1`, gắn hostPath `/var/log/lab20` (tự tạo nếu chưa có) tại `/logs`, và ghi file `/logs/hello.txt` có nội dung `hello from pod`.
    - |
      Tạo Pod `info` (`busybox:1.36`, `sleep 3600`) có biến `POD_IP` và `NODE_NAME` lấy từ Downward API, và một projected volume tại `/etc/info` gồm: ConfigMap `app-cfg` (có sẵn), label của Pod vào file `labels`, và token ServiceAccount hạn 3600 giây vào file `token`.
  hints:
    - |
      Ghi vào emptyDir trong vòng lặp
      `sh -c 'while true; do date >> /data/out.log; sleep 2; done'`
    - |
      Pod chạy trên một node cụ thể
      Dùng `nodeName: <node>` hoặc `nodeSelector: {kubernetes.io/hostname: <node>}`.
  solution: |
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata: {name: shared, namespace: lab20}
    spec:
      volumes:
      - name: data
        emptyDir: {medium: Memory, sizeLimit: 64Mi}
      containers:
      - name: writer
        image: busybox:1.36
        command: ["sh", "-c", "while true; do date >> /data/out.log; sleep 2; done"]
        volumeMounts: [{name: data, mountPath: /data}]
      - name: reader
        image: busybox:1.36
        command: ["sh", "-c", "tail -F /data/out.log"]
        volumeMounts: [{name: data, mountPath: /data}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: hostlog, namespace: lab20}
    spec:
      nodeSelector: {kubernetes.io/hostname: <NODE1>}
      volumes:
      - name: logs
        hostPath: {path: /var/log/lab20, type: DirectoryOrCreate}
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "echo 'hello from pod' > /logs/hello.txt; sleep 3600"]
        volumeMounts: [{name: logs, mountPath: /logs}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: info, namespace: lab20, labels: {app: info, tier: demo}}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sleep", "3600"]
        env:
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        volumeMounts: [{name: info, mountPath: /etc/info}]
      volumes:
      - name: info
        projected:
          sources:
          - configMap: {name: app-cfg}
          - downwardAPI:
              items: [{path: labels, fieldRef: {fieldPath: metadata.labels}}]
          - serviceAccountToken: {path: token, expirationSeconds: 3600}
    ```
    ```bash
    kubectl logs shared -n lab20 -c reader
    ./lab ssh $NODE1      # cat /var/log/lab20/hello.txt
    kubectl exec info -n lab20 -- sh -c 'env | grep -E "POD_IP|NODE_NAME"; ls /etc/info'
    ```
  setup: |
    ns_fresh lab20
    node_exec "$NODE1" 'rm -rf /var/log/lab20' >/dev/null 2>&1 || true
    kubectl create cm app-cfg -n lab20 --from-literal=feature.flags=beta >/dev/null
  verify: |
    expect "emptyDir data là tmpfs giới hạn 64Mi" "$(jp pod shared -n lab20 '{.spec.volumes[?(@.name=="data")].emptyDir.medium}:{.spec.volumes[?(@.name=="data")].emptyDir.sizeLimit}')" "Memory:64Mi"
    expect "shared có 2 container writer, reader" "$(jp pod shared -n lab20 '{.spec.containers[*].name}')" "writer reader"
    check "reader đọc được log writer ghi" bash -c "kubectl logs shared -n lab20 -c reader | grep -Eq '[0-9]{2}:[0-9]{2}:[0-9]{2}'"
    expect "hostlog chạy trên $NODE1" "$(jp pod hostlog -n lab20 '{.spec.nodeName}')" "$NODE1"
    expect "hostlog gắn hostPath /var/log/lab20" "$(jp pod hostlog -n lab20 '{.spec.volumes[0].hostPath.path}')" "/var/log/lab20"
    check "File /var/log/lab20/hello.txt có trên $NODE1" bash -c "source '$LAB_ROOT/lib/common.sh'; node_exec '$NODE1' 'cat /var/log/lab20/hello.txt' | grep -q 'hello from pod'"
    envs=$(kubectl exec info -n lab20 -- env 2>/dev/null)
    expect "info có POD_IP đúng" "$(grep '^POD_IP=' <<<"$envs" | cut -d= -f2)" "$(jp pod info -n lab20 '{.status.podIP}')"
    expect "info có NODE_NAME đúng" "$(grep '^NODE_NAME=' <<<"$envs" | cut -d= -f2)" "$(jp pod info -n lab20 '{.spec.nodeName}')"
    files=$(kubectl exec info -n lab20 -- ls /etc/info 2>/dev/null | xargs)
    expect "/etc/info có feature.flags, labels, token" "$(tr ' ' '\n' <<<"$files" | grep -E '^(feature.flags|labels|token)$' | sort | xargs)" "feature.flags labels token"
    toks=$(jp pod info -n lab20 '{range .spec.volumes[*].projected.sources[*]}{.serviceAccountToken.path}:{.serviceAccountToken.expirationSeconds}{"\n"}{end}')
    check "Token ServiceAccount ở file token, hạn 3600 giây" grep -qx 'token:3600' <<<"$toks"
  cleanup: |
    kubectl delete ns lab20 --ignore-not-found --wait=false >/dev/null
    node_exec "$NODE1" 'rm -rf /var/log/lab20' >/dev/null 2>&1 || true
  solve: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Pod
    metadata: {name: shared, namespace: lab20}
    spec:
      volumes:
      - name: data
        emptyDir: {medium: Memory, sizeLimit: 64Mi}
      containers:
      - name: writer
        image: busybox:1.36
        command: ["sh", "-c", "while true; do date >> /data/out.log; sleep 2; done"]
        volumeMounts: [{name: data, mountPath: /data}]
      - name: reader
        image: busybox:1.36
        command: ["sh", "-c", "tail -F /data/out.log"]
        volumeMounts: [{name: data, mountPath: /data}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: hostlog, namespace: lab20}
    spec:
      nodeSelector: {kubernetes.io/hostname: $NODE1}
      volumes:
      - name: logs
        hostPath: {path: /var/log/lab20, type: DirectoryOrCreate}
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "echo 'hello from pod' > /logs/hello.txt; sleep 3600"]
        volumeMounts: [{name: logs, mountPath: /logs}]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: info, namespace: lab20, labels: {app: info, tier: demo}}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sleep", "3600"]
        env:
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        volumeMounts: [{name: info, mountPath: /etc/info}]
      volumes:
      - name: info
        projected:
          sources:
          - configMap: {name: app-cfg}
          - downwardAPI:
              items: [{path: labels, fieldRef: {fieldPath: metadata.labels}}]
          - serviceAccountToken: {path: token, expirationSeconds: 3600}
    EOF
    kubectl wait --for=condition=Ready pod/shared pod/hostlog pod/info -n lab20 --timeout=120s
    sleep 5
  docs:
    - [Volumes, "https://kubernetes.io/docs/concepts/storage/volumes/"]
    - [Projected volumes, "https://kubernetes.io/docs/concepts/storage/projected-volumes/"]
    - [Downward API, "https://kubernetes.io/docs/concepts/workloads/pods/downward-api/"]

- id: 21
  slug: pv-pvc
  title: PersistentVolume, PVC và reclaim policy
  level: 5
  minutes: 30
  competencies: ["stor:2", "stor:1"]
  goal: |
    Cấp phát lưu trữ thủ công: tạo PV, để PVC bind đúng PV, dùng trong Pod, và tái sử dụng một PV đã `Released` mà không mất dữ liệu.
  concepts: |
    - PVC bind với PV khi khớp **storageClassName**, **accessModes** (PV phải có mode PVC xin) và **dung lượng** (PV ≥ PVC). Một PV chỉ bind với một PVC.
    - Access mode: `ReadWriteOnce` (một node), `ReadOnlyMany`, `ReadWriteMany`, `ReadWriteOncePod` (một Pod).
    - Reclaim policy: `Retain` (xóa PVC thì PV thành `Released`, dữ liệu còn), `Delete` (xóa luôn disk). PV `Released` vẫn giữ `claimRef` cũ nên không bind lại được cho tới khi admin gỡ `claimRef`.
    - `spec.volumeName` trong PVC chỉ định đích danh PV muốn bind.
  tasks:
    - |
      Tạo PV `pv-log`: 1Gi, `ReadWriteOnce`, reclaim `Retain`, storageClassName `manual`, hostPath `/mnt/lab21/log` (tự tạo).
    - |
      Trong `lab21`, tạo PVC `log-claim` xin 500Mi `ReadWriteOnce` class `manual`. Nó phải bind với `pv-log`.
    - |
      Tạo Pod `logger` (`busybox:1.36`) dùng `log-claim` tại `/log`, ghi `ok` vào `/log/app.log` rồi `sleep 3600`.
    - |
      PV `pv-old` đang ở trạng thái `Released` sau khi PVC cũ bị xóa. Đưa nó về `Available` **mà không xóa và tạo lại PV**, rồi tạo PVC `reuse` trong `lab21` bind **đích danh** vào `pv-old`.
  hints:
    - |
      PVC đứng Pending?
      `kubectl describe pvc log-claim -n lab21` và so storageClassName, accessModes, dung lượng với PV.
    - |
      Gỡ claimRef
      `kubectl patch pv pv-old --type=json -p '[{"op":"remove","path":"/spec/claimRef"}]'`
  solution: |
    ```yaml
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: pv-log}
    spec:
      capacity: {storage: 1Gi}
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: manual
      hostPath: {path: /mnt/lab21/log, type: DirectoryOrCreate}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: log-claim, namespace: lab21}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: manual
      resources: {requests: {storage: 500Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: logger, namespace: lab21}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "echo ok > /log/app.log; sleep 3600"]
        volumeMounts: [{name: log, mountPath: /log}]
      volumes:
      - name: log
        persistentVolumeClaim: {claimName: log-claim}
    ```
    ```bash
    kubectl get pv pv-old                     # STATUS Released, CLAIM lab21-old/data
    kubectl patch pv pv-old --type=json -p '[{"op":"remove","path":"/spec/claimRef"}]'
    kubectl get pv pv-old                     # Available
    ```
    ```yaml
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: reuse, namespace: lab21}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: manual-old
      volumeName: pv-old
      resources: {requests: {storage: 1Gi}}
    ```
  setup: |
    kubectl delete ns lab21 lab21-old --ignore-not-found --wait=true >/dev/null 2>&1
    kubectl delete pv pv-log pv-old --ignore-not-found --wait=true >/dev/null 2>&1
    kubectl create ns lab21 >/dev/null; kubectl create ns lab21-old >/dev/null
    kubectl apply -f - >/dev/null <<'EOF'
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: pv-old}
    spec:
      capacity: {storage: 1Gi}
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: manual-old
      hostPath: {path: /mnt/lab21/old, type: DirectoryOrCreate}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: data, namespace: lab21-old}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: manual-old
      resources: {requests: {storage: 1Gi}}
    EOF
    wait_for 60 bash -c "[ \"\$(kubectl get pvc data -n lab21-old -o jsonpath='{.status.phase}')\" = Bound ]"
    kubectl delete ns lab21-old --wait=true >/dev/null
    wait_for 60 bash -c "[ \"\$(kubectl get pv pv-old -o jsonpath='{.status.phase}')\" = Released ]"
    kubectl create cm lab-state -n lab21 --from-literal=pv-old-uid="$(jp pv pv-old '{.metadata.uid}')" >/dev/null
  verify: |
    expect "pv-log 1Gi RWO Retain manual" "$(jp pv pv-log '{.spec.capacity.storage}:{.spec.accessModes[0]}:{.spec.persistentVolumeReclaimPolicy}:{.spec.storageClassName}')" "1Gi:ReadWriteOnce:Retain:manual"
    expect "pv-log dùng hostPath /mnt/lab21/log" "$(jp pv pv-log '{.spec.hostPath.path}')" "/mnt/lab21/log"
    expect "log-claim Bound với pv-log" "$(jp pvc log-claim -n lab21 '{.status.phase}:{.spec.volumeName}')" "Bound:pv-log"
    expect "logger Running" "$(jp pod logger -n lab21 '{.status.phase}')" "Running"
    expect "/log/app.log có nội dung ok" "$(kubectl exec logger -n lab21 -- cat /log/app.log 2>/dev/null)" "ok"
    expect "pv-old là PV cũ (không tạo lại)" "$(jp pv pv-old '{.metadata.uid}')" "$(jp cm lab-state -n lab21 '{.data.pv-old-uid}')"
    expect "reuse Bound đích danh pv-old" "$(jp pvc reuse -n lab21 '{.status.phase}:{.spec.volumeName}')" "Bound:pv-old"
  cleanup: |
    kubectl delete ns lab21 lab21-old --ignore-not-found --wait=true >/dev/null 2>&1
    kubectl delete pv pv-log pv-old --ignore-not-found >/dev/null
  solve: |
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolume
    metadata: {name: pv-log}
    spec:
      capacity: {storage: 1Gi}
      accessModes: [ReadWriteOnce]
      persistentVolumeReclaimPolicy: Retain
      storageClassName: manual
      hostPath: {path: /mnt/lab21/log, type: DirectoryOrCreate}
    ---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: log-claim, namespace: lab21}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: manual
      resources: {requests: {storage: 500Mi}}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: logger, namespace: lab21}
    spec:
      containers:
      - name: c
        image: busybox:1.36
        command: ["sh", "-c", "echo ok > /log/app.log; sleep 3600"]
        volumeMounts: [{name: log, mountPath: /log}]
      volumes:
      - name: log
        persistentVolumeClaim: {claimName: log-claim}
    EOF
    kubectl patch pv pv-old --type=json -p '[{"op":"remove","path":"/spec/claimRef"}]'
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: reuse, namespace: lab21}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: manual-old
      volumeName: pv-old
      resources: {requests: {storage: 1Gi}}
    EOF
    kubectl wait --for=condition=Ready pod/logger -n lab21 --timeout=120s
    for i in $(seq 1 30); do [ "$(kubectl get pvc reuse -n lab21 -o jsonpath='{.status.phase}')" = Bound ] && break; sleep 2; done
  docs:
    - [Persistent Volumes, "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"]
    - [Configure a Pod to use a PersistentVolume, "https://kubernetes.io/docs/tasks/configure-pod-container/configure-persistent-volume-storage/"]

- id: 22
  slug: storageclass-statefulset
  title: StorageClass, dynamic provisioning và StatefulSet
  level: 5
  minutes: 35
  competencies: ["stor:0", "stor:2"]
  goal: |
    Để cluster tự cấp phát volume: tạo StorageClass, đặt nó làm mặc định, hiểu `WaitForFirstConsumer`, và cho mỗi replica của StatefulSet một volume riêng.
  concepts: |
    - StorageClass gồm `provisioner`, `parameters`, `reclaimPolicy` (mặc định `Delete`), `volumeBindingMode` (`Immediate` hoặc `WaitForFirstConsumer`), `allowVolumeExpansion`.
    - `WaitForFirstConsumer`: PVC đứng `Pending` cho tới khi có Pod dùng nó, để disk được tạo đúng zone/node của Pod.
    - Annotation `storageclass.kubernetes.io/is-default-class: "true"` chọn lớp mặc định cho PVC không ghi `storageClassName`. Chỉ nên có **một** lớp mặc định.
    - StatefulSet với `volumeClaimTemplates` tạo PVC tên `<template>-<sts>-<số>`; PVC **không** bị xóa khi scale xuống (trừ khi đặt `persistentVolumeClaimRetentionPolicy`).
  setup_note: |
    Setup in ra provisioner của StorageClass mặc định hiện tại (với kind là `rancher.io/local-path`). Dùng đúng provisioner đó cho StorageClass mới.
  tasks:
    - |
      Tạo StorageClass `fast` dùng cùng provisioner với StorageClass mặc định hiện tại, reclaim `Retain`, `WaitForFirstConsumer`, cho phép mở rộng volume.
    - |
      Đặt `fast` làm StorageClass mặc định, và lớp mặc định cũ **không** còn là mặc định.
    - |
      Trong `lab22`, tạo PVC `data` 1Gi `ReadWriteOnce` **không ghi** `storageClassName`. Ghi trạng thái của nó ngay sau khi tạo (`Pending` hay `Bound`) vào `~/cka-answers/22-phase.txt`. Sau đó tạo Pod `app` (`busybox:1.36`, `sleep 3600`) dùng PVC này tại `/data` để PVC chuyển `Bound`.
    - |
      Tạo headless Service `db` và StatefulSet `db` (2 replica, `busybox:1.36`, `sleep 3600`) có `volumeClaimTemplates` tên `data`, 1Gi, class `fast`, gắn tại `/var/lib/db`.
  hints:
    - |
      Xem provisioner và lớp mặc định
      `kubectl get sc` (cột PROVISIONER, dòng có `(default)`)
    - |
      Bỏ mặc định của lớp cũ
      `kubectl patch sc <tên> -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'`
  solution: |
    ```bash
    kubectl get sc        # standard (default)   rancher.io/local-path
    ```
    ```yaml
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: fast
      annotations: {storageclass.kubernetes.io/is-default-class: "true"}
    provisioner: rancher.io/local-path
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    ```
    ```bash
    kubectl patch sc standard -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
    kubectl create -f pvc-data.yaml && kubectl get pvc data -n lab22   # Pending (chờ consumer)
    echo Pending > ~/cka-answers/22-phase.txt
    ```
    ```yaml
    apiVersion: v1
    kind: Pod
    metadata: {name: app, namespace: lab22}
    spec:
      containers:
      - {name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: d, mountPath: /data}]}
      volumes:
      - {name: d, persistentVolumeClaim: {claimName: data}}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: db, namespace: lab22}
    spec:
      clusterIP: None
      selector: {app: db}
      ports: [{port: 5432}]
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: db, namespace: lab22}
    spec:
      serviceName: db
      replicas: 2
      selector: {matchLabels: {app: db}}
      template:
        metadata: {labels: {app: db}}
        spec:
          containers:
          - name: db
            image: busybox:1.36
            command: ["sleep", "3600"]
            volumeMounts: [{name: data, mountPath: /var/lib/db}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast
          resources: {requests: {storage: 1Gi}}
    ```
  setup: |
    answers_dir; rm -f "$ANS/22-phase.txt"
    ns_fresh lab22
    kubectl delete sc fast --ignore-not-found >/dev/null
    def=$(kubectl get sc -o jsonpath='{range .items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")]}{.metadata.name}{end}')
    [ -n "$def" ] || die "Cluster chưa có StorageClass mặc định."
    kubectl create cm lab-state -n lab22 --from-literal=old-default="$def" --from-literal=provisioner="$(jp sc "$def" '{.provisioner}')" >/dev/null
    kubectl get cm lab-state -n lab22 -o yaml > "$ANS/.22-state.yaml"
    echo "StorageClass mặc định hiện tại: $def (provisioner $(jp sc "$def" '{.provisioner}'))"
  verify: |
    old=$(jp cm lab-state -n lab22 '{.data.old-default}'); prov=$(jp cm lab-state -n lab22 '{.data.provisioner}')
    expect "fast dùng provisioner $prov" "$(jp sc fast '{.provisioner}')" "$prov"
    expect "fast: Retain, WaitForFirstConsumer, cho mở rộng" "$(jp sc fast '{.reclaimPolicy}:{.volumeBindingMode}:{.allowVolumeExpansion}')" "Retain:WaitForFirstConsumer:true"
    expect "fast là mặc định" "$(jp sc fast '{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}')" "true"
    expect_match "$old không còn là mặc định" "$(jp sc "$old" '{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}')" '^(false)?$'
    expect "22-phase.txt" "$(ans 22-phase.txt)" "Pending"
    expect "PVC data dùng fast và Bound" "$(jp pvc data -n lab22 '{.spec.storageClassName}:{.status.phase}')" "fast:Bound"
    expect "app Running" "$(jp pod app -n lab22 '{.status.phase}')" "Running"
    expect "db là headless" "$(jp svc db -n lab22 '{.spec.clusterIP}')" "None"
    expect "StatefulSet db 2/2 sẵn sàng" "$(jp sts db -n lab22 '{.status.readyReplicas}')" "2"
    expect "data-db-0 và data-db-1 Bound, class fast" "$(jp pvc data-db-0 -n lab22 '{.status.phase}:{.spec.storageClassName}') $(jp pvc data-db-1 -n lab22 '{.status.phase}:{.spec.storageClassName}')" "Bound:fast Bound:fast"
  cleanup: |
    old=$(jp cm lab-state -n lab22 '{.data.old-default}')
    [ -z "$old" ] && [ -f "$ANS/.22-state.yaml" ] && old=$(grep 'old-default:' "$ANS/.22-state.yaml" | awk '{print $2}')
    kubectl delete ns lab22 --ignore-not-found --wait=true >/dev/null 2>&1
    for pv in $(kubectl get pv -o jsonpath='{range .items[?(@.spec.claimRef.namespace=="lab22")]}{.metadata.name}{" "}{end}'); do kubectl delete pv "$pv" --wait=false >/dev/null 2>&1; done
    kubectl delete sc fast --ignore-not-found >/dev/null
    [ -n "$old" ] && kubectl patch sc "$old" -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}' >/dev/null 2>&1
    rm -f "$ANS/22-phase.txt" "$ANS/.22-state.yaml"
  solve: |
    old=$(kubectl get cm lab-state -n lab22 -o jsonpath='{.data.old-default}')
    prov=$(kubectl get cm lab-state -n lab22 -o jsonpath='{.data.provisioner}')
    kubectl apply -f - <<EOF
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: fast
      annotations: {storageclass.kubernetes.io/is-default-class: "true"}
    provisioner: $prov
    reclaimPolicy: Retain
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    EOF
    kubectl patch sc "$old" -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: data, namespace: lab22}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
    EOF
    sleep 2
    kubectl get pvc data -n lab22 -o jsonpath='{.status.phase}' > "$ANS/22-phase.txt"
    kubectl apply -f - <<'EOF'
    apiVersion: v1
    kind: Pod
    metadata: {name: app, namespace: lab22}
    spec:
      containers:
      - {name: c, image: busybox:1.36, command: ["sleep", "3600"], volumeMounts: [{name: d, mountPath: /data}]}
      volumes:
      - {name: d, persistentVolumeClaim: {claimName: data}}
    ---
    apiVersion: v1
    kind: Service
    metadata: {name: db, namespace: lab22}
    spec:
      clusterIP: None
      selector: {app: db}
      ports: [{port: 5432}]
    ---
    apiVersion: apps/v1
    kind: StatefulSet
    metadata: {name: db, namespace: lab22}
    spec:
      serviceName: db
      replicas: 2
      selector: {matchLabels: {app: db}}
      template:
        metadata: {labels: {app: db}}
        spec:
          containers:
          - name: db
            image: busybox:1.36
            command: ["sleep", "3600"]
            volumeMounts: [{name: data, mountPath: /var/lib/db}]
      volumeClaimTemplates:
      - metadata: {name: data}
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: fast
          resources: {requests: {storage: 1Gi}}
    EOF
    kubectl wait --for=condition=Ready pod/app -n lab22 --timeout=180s
    kubectl rollout status sts/db -n lab22 --timeout=240s
  docs:
    - [Storage classes, "https://kubernetes.io/docs/concepts/storage/storage-classes/"]
    - [Dynamic provisioning, "https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/"]
    - [StatefulSets, "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"]
