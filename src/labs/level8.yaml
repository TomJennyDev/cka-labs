- id: 33
  slug: troubleshoot-apps
  title: "Troubleshooting ứng dụng: sáu Deployment hỏng"
  level: 8
  minutes: 40
  competencies: ["trouble:3", "trouble:2", "work:3"]
  goal: |
    Chẩn đoán nhanh và sửa đúng sáu lỗi ứng dụng hay gặp nhất trong đề: image sai, lệnh sai, OOM, không xếp được node, thiếu cấu hình, probe sai.
  concepts: |
    - Quy trình: `kubectl get pods` (STATUS, RESTARTS) → `kubectl describe pod` (Events, Last State, Conditions) → `kubectl logs` và `logs --previous` → sửa Deployment, không sửa Pod.
    - Bảng tra STATUS: `ImagePullBackOff`/`ErrImagePull` (image), `CrashLoopBackOff` (container chết lặp lại: xem exit code và log), `RunContainerError`/`StartError` (lệnh không chạy được), `CreateContainerConfigError` (thiếu ConfigMap/Secret), `Pending` (không xếp được node: đọc event `FailedScheduling`), `Running` nhưng `0/1` (readiness trượt).
    - Exit code: `1` lỗi app, `126/127` lệnh không chạy được hoặc không tồn tại, `137` bị SIGKILL (thường `OOMKilled`), `143` SIGTERM.
  tasks:
    - |
      Namespace `lab33` có sáu Deployment: `img`, `cmd`, `oom`, `pending`, `cfg`, `notready`. Mỗi cái hỏng một kiểu. Sửa để **cả sáu** đều sẵn sàng đủ replica.
    - |
      Ràng buộc khi sửa: `img` dùng `nginx:1.27`; `cmd` vẫn chạy `sleep 3600`; `oom` giữ nguyên lệnh và chỉ đổi memory limit thành `256Mi`; `cfg` phải đọc biến từ ConfigMap `app-settings` với `MODE=prod`; `notready` giữ readinessProbe nhưng kiểm tra đúng đường dẫn.
    - |
      Ghi lý do container của `oom` bị dừng (giá trị `reason` trong `lastState`) vào `~/cka-answers/33-oom.txt`.
  hints:
    - |
      Nhìn toàn cảnh
      `kubectl get pods -n lab33` rồi `kubectl get events -n lab33 --sort-by=.lastTimestamp | tail -20`
    - |
      Lý do lần chết trước
      `kubectl get pod <pod> -n lab33 -o jsonpath='{.status.containerStatuses[0].lastState.terminated.reason}'`
    - |
      Pod Pending
      `kubectl describe pod` → `0/3 nodes are available: … didn't match Pod's node affinity/selector`
  solution: |
    ```bash
    kubectl get pods -n lab33
    # img: ImagePullBackOff
    kubectl set image deploy/img -n lab33 nginx=nginx:1.27
    # cmd: StartError, "slep": executable file not found
    kubectl patch deploy cmd -n lab33 --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["sleep","3600"]}]'
    # oom: OOMKilled, exit 137
    kubectl get pod -n lab33 -l app=oom -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}' > ~/cka-answers/33-oom.txt
    kubectl set resources deploy oom -n lab33 --limits=memory=256Mi
    # pending: nodeSelector disktype=nvme không node nào có
    kubectl patch deploy pending -n lab33 --type=json -p '[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]'
    # cfg: CreateContainerConfigError, configmap "app-settings" not found
    kubectl create cm app-settings -n lab33 --from-literal=MODE=prod
    # notready: Readiness probe failed: HTTP probe failed with statuscode: 404
    kubectl patch deploy notready -n lab33 --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'
    kubectl get deploy -n lab33
    ```
    Pod của `cfg` tự chạy lại khi ConfigMap xuất hiện (kubelet thử lại). Nếu chậm: `kubectl rollout restart deploy cfg -n lab33`.
  setup: |
    answers_dir; rm -f "$ANS/33-oom.txt"
    ns_fresh lab33
    kubectl apply -n lab33 -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: img}
    spec:
      selector: {matchLabels: {app: img}}
      template:
        metadata: {labels: {app: img}}
        spec:
          containers: [{name: nginx, image: "nginx:1.27-alpne"}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cmd}
    spec:
      selector: {matchLabels: {app: cmd}}
      template:
        metadata: {labels: {app: cmd}}
        spec:
          containers: [{name: app, image: busybox:1.36, command: ["slep", "3600"]}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: oom}
    spec:
      selector: {matchLabels: {app: oom}}
      template:
        metadata: {labels: {app: oom}}
        spec:
          containers:
          - name: app
            image: busybox:1.36
            command: ["sh", "-c", "x=$(head -c 100m /dev/zero | tr '\\000' a); echo loaded ${#x} bytes; sleep 3600"]
            resources: {limits: {memory: 48Mi}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: pending}
    spec:
      replicas: 2
      selector: {matchLabels: {app: pending}}
      template:
        metadata: {labels: {app: pending}}
        spec:
          nodeSelector: {disktype: nvme}
          containers: [{name: nginx, image: nginx:1.27}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: cfg}
    spec:
      selector: {matchLabels: {app: cfg}}
      template:
        metadata: {labels: {app: cfg}}
        spec:
          containers:
          - name: app
            image: busybox:1.36
            command: ["sh", "-c", "echo MODE=$MODE; sleep 3600"]
            envFrom: [{configMapRef: {name: app-settings}}]
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: notready}
    spec:
      selector: {matchLabels: {app: notready}}
      template:
        metadata: {labels: {app: notready}}
        spec:
          containers:
          - name: nginx
            image: nginx:1.27
            readinessProbe:
              httpGet: {path: /healthz, port: 80}
              periodSeconds: 5
    EOF
    sleep 20
  verify: |
    for d in img cmd oom pending cfg notready; do
      want=$(jp deploy $d -n lab33 '{.spec.replicas}')
      expect "$d sẵn sàng ${want:-?}/${want:-?}" "$(jp deploy $d -n lab33 '{.status.readyReplicas}')" "${want:-x}"
    done
    expect "img dùng nginx:1.27" "$(jp deploy img -n lab33 '{.spec.template.spec.containers[0].image}')" "nginx:1.27"
    expect "cmd chạy sleep 3600" "$(jp deploy cmd -n lab33 '{.spec.template.spec.containers[0].command[*]} {.spec.template.spec.containers[0].args[*]}' | xargs)" "sleep 3600"
    check "oom giữ nguyên lệnh" bash -c "kubectl get deploy oom -n lab33 -o jsonpath='{.spec.template.spec.containers[0].command[2]}' | grep -q 'head -c 100m /dev/zero'"
    expect "oom memory limit 256Mi" "$(jp deploy oom -n lab33 '{.spec.template.spec.containers[0].resources.limits.memory}')" "256Mi"
    expect "pending vẫn 2 replica" "$(jp deploy pending -n lab33 '{.spec.replicas}')" "2"
    expect "ConfigMap app-settings có MODE=prod" "$(jp cm app-settings -n lab33 '{.data.MODE}')" "prod"
    check "cfg đọc MODE=prod" bash -c "kubectl logs -n lab33 deploy/cfg | grep -q MODE=prod"
    expect "notready vẫn có readinessProbe, path /" "$(jp deploy notready -n lab33 '{.spec.template.spec.containers[0].readinessProbe.httpGet.path}')" "/"
    expect "33-oom.txt" "$(ans 33-oom.txt)" "OOMKilled"
  cleanup: |
    kubectl delete ns lab33 --ignore-not-found --wait=false >/dev/null
    rm -f "$ANS/33-oom.txt"
  solve: |
    for i in $(seq 1 40); do r=$(kubectl get pod -n lab33 -l app=oom -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}'); [ -n "$r" ] && break; sleep 3; done
    echo "$r" > "$ANS/33-oom.txt"
    kubectl set image deploy/img -n lab33 nginx=nginx:1.27
    kubectl patch deploy cmd -n lab33 --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/command","value":["sleep","3600"]}]'
    kubectl set resources deploy oom -n lab33 --limits=memory=256Mi
    kubectl patch deploy pending -n lab33 --type=json -p '[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]'
    kubectl create cm app-settings -n lab33 --from-literal=MODE=prod
    kubectl patch deploy notready -n lab33 --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/httpGet/path","value":"/"}]'
    for d in img cmd oom pending notready; do kubectl rollout status deploy/$d -n lab33 --timeout=180s; done
    for i in $(seq 1 30); do [ "$(kubectl get deploy cfg -n lab33 -o jsonpath='{.status.readyReplicas}')" = 1 ] && break; sleep 3; done
  docs:
    - [Debug Pods, "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"]
    - [Determine the reason for Pod failure, "https://kubernetes.io/docs/tasks/debug/debug-application/determine-reason-pod-failure/"]

- id: 34
  slug: troubleshoot-network
  title: "Troubleshooting mạng: Service, NetworkPolicy và DNS"
  level: 8
  minutes: 40
  competencies: ["trouble:4", "net:1", "net:5"]
  goal: |
    Lần theo đường đi của một request bị hỏng ở nhiều chỗ cùng lúc: DNS, Service, endpoint, NetworkPolicy. Sửa từng lớp mà không phá bỏ chính sách bảo mật.
  concepts: |
    - Thứ tự kiểm tra: **DNS** (`nslookup web.lab34`) → **Service** có tồn tại, đúng cổng → **EndpointSlice** có IP không (selector, readiness, targetPort) → gọi thẳng **IP Pod** → **NetworkPolicy** → kube-proxy/CNI trên node.
    - Gọi bằng IP Pod được mà bằng tên Service không được: lỗi ở DNS hoặc Service. Gọi IP Pod cũng không được: app, NetworkPolicy hoặc CNI.
    - CoreDNS là Deployment `coredns` trong `kube-system`, Service tên `kube-dns`.
  tasks:
    - |
      Pod `client` trong `lab34` (label `role=frontend`) không gọi được `http://web.lab34`. Sửa mọi lỗi trên đường đi để `client` nhận được trang nginx.
    - |
      Ràng buộc: **không** xóa hay sửa NetworkPolicy `default-deny`; **không** đổi label của `client` hay của Pod `web`; **không** tạo Service mới.
    - |
      Ghi số lỗi bạn đã sửa vào `~/cka-answers/34-faults.txt`.
  hints:
    - |
      Bắt đầu từ DNS
      `kubectl exec client -n lab34 -- nslookup web.lab34` báo lỗi? Xem `kubectl -n kube-system get deploy coredns`.
    - |
      Gọi thẳng IP Pod để tách lỗi
      `kubectl get pod -n lab34 -l app=web -o wide` rồi `kubectl exec client -n lab34 -- wget -qO- -T3 <pod-ip>`
  solution: |
    Có 4 lỗi chồng nhau:
    ```bash
    # 1. DNS: CoreDNS bị scale về 0
    kubectl -n kube-system get deploy coredns           # 0/0
    kubectl -n kube-system scale deploy coredns --replicas=2   # (k3s: 1)
    # 2. Service web chọn sai label
    kubectl get svc web -n lab34 -o jsonpath='{.spec.selector}'   # app=wbe
    # 3. targetPort sai (8080, nginx nghe 80)
    kubectl patch svc web -n lab34 --type=json -p '[{"op":"replace","path":"/spec/selector","value":{"app":"web"}},{"op":"replace","path":"/spec/ports/0/targetPort","value":80}]'
    # 4. Policy allow-frontend chọn sai label nguồn (role=front-end)
    kubectl get netpol allow-frontend -n lab34 -o yaml
    kubectl patch netpol allow-frontend -n lab34 --type=json -p '[{"op":"replace","path":"/spec/ingress/0/from/0/podSelector/matchLabels","value":{"role":"frontend"}}]'
    kubectl exec client -n lab34 -- wget -qO- -T3 http://web.lab34
    echo 4 > ~/cka-answers/34-faults.txt
    ```
  setup: |
    answers_dir; rm -f "$ANS/34-faults.txt"
    ns_fresh lab34
    orig=$(jp deploy coredns -n kube-system '{.spec.replicas}')
    [ "${orig:-0}" -ge 1 ] || orig=2
    kubectl create cm lab-state -n lab34 --from-literal=coredns="$orig" >/dev/null
    echo "$orig" > "$ANS/.34-coredns"
    kubectl create deploy web -n lab34 --image=nginx:1.27 --replicas=2 >/dev/null
    kubectl create svc clusterip web -n lab34 --tcp=80:8080 >/dev/null
    kubectl patch svc web -n lab34 -p '{"spec":{"selector":{"app":"wbe"}}}' >/dev/null
    kubectl run client -n lab34 --image=busybox:1.36 --labels=role=frontend --command -- sleep 3600 >/dev/null
    kubectl apply -n lab34 -f - >/dev/null <<'EOF'
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: default-deny}
    spec:
      podSelector: {}
      policyTypes: [Ingress]
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: allow-frontend}
    spec:
      podSelector: {matchLabels: {app: web}}
      policyTypes: [Ingress]
      ingress:
      - from: [{podSelector: {matchLabels: {role: front-end}}}]
        ports: [{protocol: TCP, port: 80}]
    EOF
    kubectl wait --for=condition=Ready pod/client -n lab34 --timeout=90s >/dev/null
    kubectl -n kube-system scale deploy coredns --replicas=0 >/dev/null
  verify: |
    orig=$(jp cm lab-state -n lab34 '{.data.coredns}')
    expect_ge "CoreDNS có Pod sẵn sàng" "$(jp deploy coredns -n kube-system '{.status.readyReplicas}')" 1
    check "client gọi được http://web.lab34" kubectl exec client -n lab34 -- wget -qO- -T5 http://web.lab34
    expect "default-deny còn nguyên" "$(jp netpol default-deny -n lab34 '{.spec.podSelector}:{.spec.policyTypes[*]}')" "{}:Ingress"
    expect "client giữ label role=frontend" "$(jp pod client -n lab34 '{.metadata.labels.role}')" "frontend"
    expect "Pod web giữ label app=web" "$(jp pods -n lab34 -l app=web '{.items[*].metadata.labels.app}' | tr ' ' '\n' | sort -u)" "web"
    expect "Không có Service mới (chỉ web)" "$(jp svc -n lab34 '{.items[*].metadata.name}')" "web"
    check_not "Pod khác (không phải frontend) vẫn bị chặn" can_reach lab34 http://web.lab34 role=other
    expect "34-faults.txt" "$(ans 34-faults.txt)" "4"
  cleanup: |
    orig=$(jp cm lab-state -n lab34 '{.data.coredns}')
    [ -z "$orig" ] && orig=$(cat "$ANS/.34-coredns" 2>/dev/null)
    [ -n "$orig" ] && kubectl -n kube-system scale deploy coredns --replicas="$orig" >/dev/null 2>&1
    kubectl delete ns lab34 --ignore-not-found --wait=false >/dev/null
    rm -f "$ANS/34-faults.txt" "$ANS/.34-coredns"
  solve: |
    orig=$(kubectl get cm lab-state -n lab34 -o jsonpath='{.data.coredns}')
    kubectl -n kube-system scale deploy coredns --replicas="$orig"
    kubectl patch svc web -n lab34 --type=json -p '[{"op":"replace","path":"/spec/selector","value":{"app":"web"}},{"op":"replace","path":"/spec/ports/0/targetPort","value":80}]'
    kubectl patch netpol allow-frontend -n lab34 --type=json -p '[{"op":"replace","path":"/spec/ingress/0/from/0/podSelector/matchLabels","value":{"role":"frontend"}}]'
    kubectl -n kube-system rollout status deploy coredns --timeout=120s
    echo 4 > "$ANS/34-faults.txt"
    sleep 5
  docs:
    - [Debug Services, "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"]
    - [Debugging DNS resolution, "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"]

- id: 35
  slug: troubleshoot-control-plane
  title: "Troubleshooting control plane: scheduler và controller-manager"
  level: 8
  minutes: 40
  env: kind
  test: false
  competencies: ["trouble:1"]
  goal: |
    Nhận ra thành phần control plane nào hỏng chỉ từ triệu chứng, đọc log khi kubectl không giúp được, và sửa static pod manifest.
  concepts: |
    - Triệu chứng chỉ điểm: Deployment không có ReplicaSet → **kube-controller-manager**. Pod đứng `Pending` mà không có event → **kube-scheduler**. `kubectl` báo connection refused → **kube-apiserver** hoặc **etcd**.
    - Control plane là static pod: log đọc bằng `kubectl -n kube-system logs <pod>`, hoặc trên node bằng `crictl ps -a` + `crictl logs <id>`, hoặc file trong `/var/log/pods/`. Pod không được tạo luôn thì xem `journalctl -u kubelet`.
    - Sửa file trong `/etc/kubernetes/manifests` là đủ; kubelet tự tạo lại Pod (có thể mất 20–60 giây).
  tasks:
    - |
      Deployment `probe` trong `lab35` (2 replica) đã được tạo nhưng không có Pod nào. Tìm thành phần control plane hỏng và sửa.
    - |
      Sau đó Pod của `probe` vẫn không chạy. Tìm và sửa thành phần thứ hai.
    - |
      Ghi tên hai thành phần đã sửa (ví dụ `kube-apiserver`), mỗi tên một dòng, vào `~/cka-answers/35-components.txt`.
  hints:
    - |
      Không có ReplicaSet
      `kubectl get rs -n lab35` trống → ai tạo ReplicaSet? `kubectl -n kube-system get pods | grep controller`
    - |
      Container control plane chết ngay khi khởi động
      `./lab ssh $CP` rồi `crictl ps -a | grep -E 'scheduler|controller'` và `crictl logs <container-id>`
  solution: |
    ```bash
    kubectl get rs -n lab35                       # trống
    kubectl -n kube-system get pods | grep -E 'scheduler|controller'
    ./lab ssh $CP
    crictl ps -a | grep controller-manager        # Exited
    crictl logs <id>                              # exec: "kube-controller-manegr": executable file not found
    vi /etc/kubernetes/manifests/kube-controller-manager.yaml     # sửa thành kube-controller-manager
    crictl ps -a | grep scheduler
    crictl logs <id>                              # stat /etc/kubernetes/scheduler.config: no such file or directory
    vi /etc/kubernetes/manifests/kube-scheduler.yaml              # --kubeconfig=/etc/kubernetes/scheduler.conf
    exit
    kubectl get pods -n lab35 -w
    printf 'kube-controller-manager\nkube-scheduler\n' > ~/cka-answers/35-components.txt
    ```
  setup: |
    answers_dir; rm -f "$ANS/35-components.txt"
    ns_fresh lab35
    node_exec "$CP" 'set -e; mkdir -p /root/lab35; cp -n /etc/kubernetes/manifests/kube-scheduler.yaml /etc/kubernetes/manifests/kube-controller-manager.yaml /root/lab35/
      sed -i "s#- kube-controller-manager\$#- kube-controller-manegr#" /etc/kubernetes/manifests/kube-controller-manager.yaml
      sed -i "s#--kubeconfig=/etc/kubernetes/scheduler.conf#--kubeconfig=/etc/kubernetes/scheduler.config#" /etc/kubernetes/manifests/kube-scheduler.yaml'
    sleep 40
    kubectl create deploy probe -n lab35 --image=nginx:1.27 --replicas=2 >/dev/null
  verify: |
    expect "kube-controller-manager Running" "$(jp pod "kube-controller-manager-$CP" -n kube-system '{.status.phase}')" "Running"
    expect "kube-scheduler Running" "$(jp pod "kube-scheduler-$CP" -n kube-system '{.status.phase}')" "Running"
    expect "probe 2/2 sẵn sàng" "$(jp deploy probe -n lab35 '{.status.readyReplicas}')" "2"
    check "Manifest scheduler dùng scheduler.conf" node_exec "$CP" 'grep -q "kubeconfig=/etc/kubernetes/scheduler.conf" /etc/kubernetes/manifests/kube-scheduler.yaml'
    expect "35-components.txt" "$(sort "$ANS/35-components.txt" 2>/dev/null | xargs)" "kube-controller-manager kube-scheduler"
  cleanup: |
    node_exec "$CP" 'if [ -d /root/lab35 ]; then cp /root/lab35/*.yaml /etc/kubernetes/manifests/; rm -rf /root/lab35; fi' >/dev/null 2>&1 || true
    kubectl delete ns lab35 --ignore-not-found --wait=false >/dev/null
    rm -f "$ANS/35-components.txt"
  docs:
    - [Troubleshooting clusters, "https://kubernetes.io/docs/tasks/debug/debug-cluster/"]
    - [Debugging Kubernetes nodes with crictl, "https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/"]

- id: 36
  slug: troubleshoot-node
  title: "Troubleshooting node: worker NotReady"
  level: 8
  minutes: 35
  env: kind
  test: false
  competencies: ["trouble:0"]
  goal: |
    Đưa một worker `NotReady` trở lại: xác định kubelet có chạy không, đọc journal để tìm cấu hình sai, sửa và bảo đảm kubelet tự chạy sau khi khởi động lại máy.
  concepts: |
    - Node `NotReady` (hoặc `Unknown`) phần lớn do kubelet: không chạy, chạy rồi chết vì cấu hình sai, không nói chuyện được với container runtime, hoặc chứng chỉ hết hạn.
    - Trên node: `systemctl status kubelet`, `journalctl -u kubelet -n 50`, cấu hình ở `/var/lib/kubelet/config.yaml`, cờ ở `/var/lib/kubelet/kubeadm-flags.env`, unit drop-in ở `/usr/lib/systemd/system/kubelet.service.d/10-kubeadm.conf`.
    - `systemctl enable --now kubelet` vừa chạy ngay vừa tự chạy khi boot. Chỉ `start` thì sau reboot lại hỏng.
  tasks:
    - |
      `$NODE2` đang `NotReady`. Đưa nó về `Ready`.
    - |
      Bảo đảm kubelet trên `$NODE2` tự khởi động cùng máy.
    - |
      Ghi đường dẫn file cấu hình mà bạn đã sửa vào `~/cka-answers/36-file.txt`.
  hints:
    - |
      kubelet có chạy không?
      `./lab ssh $NODE2` rồi `systemctl status kubelet`
    - |
      kubelet chạy rồi chết
      `journalctl -u kubelet -n 30 --no-pager` và tìm dòng `failed to load` / `no such file`.
  solution: |
    ```bash
    kubectl get nodes                     # NODE2 NotReady
    ./lab ssh $NODE2
    systemctl status kubelet              # inactive (dead), disabled
    systemctl enable --now kubelet
    journalctl -u kubelet -n 30 --no-pager
    #   unable to load client CA file /etc/kubernetes/pki/ca-bundle.crt: no such file
    vi /var/lib/kubelet/config.yaml       # authentication.x509.clientCAFile: /etc/kubernetes/pki/ca.crt
    systemctl restart kubelet
    exit
    echo /var/lib/kubelet/config.yaml > ~/cka-answers/36-file.txt
    kubectl get nodes -w
    ```
  setup: |
    answers_dir; rm -f "$ANS/36-file.txt"
    node_exec "$NODE2" 'set -e; cp -n /var/lib/kubelet/config.yaml /root/lab36-config.yaml
      sed -i "s#clientCAFile: .*#clientCAFile: /etc/kubernetes/pki/ca-bundle.crt#" /var/lib/kubelet/config.yaml
      systemctl disable --now kubelet'
    info "Chờ node $NODE2 chuyển NotReady (khoảng 50 giây)"
    wait_for 120 bash -c "[ \"\$(kubectl get node $NODE2 -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}')\" != True ]"
  verify: |
    expect "$NODE2 Ready" "$(jp node "$NODE2" '{.status.conditions[?(@.type=="Ready")].status}')" "True"
    expect "kubelet active" "$(node_exec "$NODE2" 'systemctl is-active kubelet')" "active"
    expect "kubelet enabled" "$(node_exec "$NODE2" 'systemctl is-enabled kubelet')" "enabled"
    expect "clientCAFile đúng" "$(node_exec "$NODE2" "awk '/clientCAFile:/{print \$2}' /var/lib/kubelet/config.yaml")" "/etc/kubernetes/pki/ca.crt"
    expect "36-file.txt" "$(ans 36-file.txt)" "/var/lib/kubelet/config.yaml"
  cleanup: |
    node_exec "$NODE2" 'if [ -f /root/lab36-config.yaml ]; then cp /root/lab36-config.yaml /var/lib/kubelet/config.yaml; rm -f /root/lab36-config.yaml; fi; systemctl enable --now kubelet; systemctl restart kubelet' >/dev/null 2>&1 || true
    rm -f "$ANS/36-file.txt"
  docs:
    - [Troubleshooting clusters, "https://kubernetes.io/docs/tasks/debug/debug-cluster/"]
    - [kubelet configuration file, "https://kubernetes.io/docs/tasks/administer-cluster/kubelet-config-file/"]

- id: 37
  slug: monitoring-logs
  title: Theo dõi tài nguyên, event và log
  level: 8
  minutes: 30
  competencies: ["trouble:2", "trouble:3"]
  goal: |
    Trả lời nhanh các câu hỏi "cái gì đang ngốn CPU", "vì sao nó chết", "log lần trước nói gì" bằng `kubectl top`, event và log, và ghi đáp án ra file đúng định dạng.
  concepts: |
    - `kubectl top pod/node` cần metrics-server; `--sort-by=cpu|memory`, `--containers`, `-A`.
    - `kubectl get events --sort-by=.lastTimestamp`, lọc `--field-selector involvedObject.name=<pod>,type=Warning`; hoặc `kubectl events --for pod/<tên>`.
    - `kubectl logs`: `-c <container>`, `--previous`, `--since=10m`, `--tail=50`, `-l <selector> --all-containers --prefix`.
    - Exit code và lý do: `.status.containerStatuses[*].lastState.terminated`.
  tasks:
    - |
      Trong `lab37`, ghi tên Pod dùng **nhiều CPU nhất** vào `~/cka-answers/37-cpu.txt`.
    - |
      Pod `crashy` đang khởi động lại liên tục. Ghi các dòng chứa `FATAL` trong log **lần chạy trước** vào `~/cka-answers/37-fatal.txt`, và exit code lần chết gần nhất vào `~/cka-answers/37-exit.txt`.
    - |
      Pod `multi` có hai container. Đếm số dòng chứa `upstream timeout` trong log của container `proxy`, ghi vào `~/cka-answers/37-timeouts.txt`.
    - |
      Ghi `reason` của event cảnh báo mới nhất liên quan tới `crashy` vào `~/cka-answers/37-event.txt`.
  hints:
    - |
      Sắp xếp theo CPU
      `kubectl top pod -n lab37 --sort-by=cpu --no-headers | head -1`
    - |
      Event của một Pod
      `kubectl get events -n lab37 --field-selector involvedObject.name=crashy,type=Warning --sort-by=.lastTimestamp`
  solution: |
    ```bash
    kubectl top pod -n lab37 --sort-by=cpu --no-headers | head -1 | awk '{print $1}' > ~/cka-answers/37-cpu.txt
    kubectl logs crashy -n lab37 --previous | grep FATAL > ~/cka-answers/37-fatal.txt
    kubectl get pod crashy -n lab37 -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}' > ~/cka-answers/37-exit.txt
    kubectl logs multi -n lab37 -c proxy | grep -c 'upstream timeout' > ~/cka-answers/37-timeouts.txt
    kubectl get events -n lab37 --field-selector involvedObject.name=crashy,type=Warning --sort-by=.lastTimestamp \
      -o jsonpath='{.items[-1:].reason}' > ~/cka-answers/37-event.txt     # BackOff
    ```
  setup: |
    answers_dir; rm -f "$ANS"/37-*
    kubectl get apiservice v1beta1.metrics.k8s.io >/dev/null 2>&1 || die "Chưa có metrics-server. Chạy lại env/kind/up.sh"
    ns_fresh lab37
    kubectl apply -n lab37 -f - >/dev/null <<'EOF'
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: burner}
    spec:
      selector: {matchLabels: {app: burner}}
      template:
        metadata: {labels: {app: burner}}
        spec:
          containers:
          - {name: burn, image: busybox:1.36, command: ["sh", "-c", "while :; do :; done"], resources: {limits: {cpu: 300m}}}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata: {name: idle}
    spec:
      replicas: 2
      selector: {matchLabels: {app: idle}}
      template:
        metadata: {labels: {app: idle}}
        spec:
          containers:
          - {name: idle, image: busybox:1.36, command: ["sleep", "3600"]}
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: crashy}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "echo 'INFO starting order-service'; echo 'INFO connecting to db:5432'; sleep 2; echo 'FATAL db unreachable after 3 retries'; exit 3"]
    ---
    apiVersion: v1
    kind: Pod
    metadata: {name: multi}
    spec:
      containers:
      - {name: app, image: busybox:1.36, command: ["sh", "-c", "echo app ready; sleep 3600"]}
      - name: proxy
        image: busybox:1.36
        command: ["sh", "-c", "for i in 1 2 3 4 5 6 7; do echo \"req $i ok\"; done; for i in 1 2 3 4 5; do echo \"WARN upstream timeout after 5s (req $i)\"; done; sleep 3600"]
    EOF
    info "Chờ crashy restart vài lần và metrics được thu thập (khoảng 60 giây)"
    sleep 60
  verify: |
    top=$(kubectl top pod -n lab37 --sort-by=cpu --no-headers 2>/dev/null | head -1 | awk '{print $1}')
    expect "37-cpu.txt" "$(ans 37-cpu.txt)" "$top"
    expect "37-fatal.txt" "$(ansraw 37-fatal.txt | sed '/^$/d')" "FATAL db unreachable after 3 retries"
    expect "37-exit.txt" "$(ans 37-exit.txt)" "3"
    expect "37-timeouts.txt" "$(ans 37-timeouts.txt)" "5"
    expect "37-event.txt" "$(ans 37-event.txt)" "BackOff"
  cleanup: |
    kubectl delete ns lab37 --ignore-not-found --wait=false >/dev/null
    rm -f "$ANS"/37-*
  solve: |
    for i in $(seq 1 30); do kubectl top pod -n lab37 --no-headers 2>/dev/null | grep -q burner && break; sleep 5; done
    kubectl top pod -n lab37 --sort-by=cpu --no-headers | head -1 | awk '{print $1}' > "$ANS/37-cpu.txt"
    kubectl logs crashy -n lab37 --previous | grep FATAL > "$ANS/37-fatal.txt"
    kubectl get pod crashy -n lab37 -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}' > "$ANS/37-exit.txt"
    kubectl logs multi -n lab37 -c proxy | grep -c 'upstream timeout' > "$ANS/37-timeouts.txt"
    kubectl get events -n lab37 --field-selector involvedObject.name=crashy,type=Warning --sort-by=.lastTimestamp -o jsonpath='{.items[-1:].reason}' > "$ANS/37-event.txt"
  docs:
    - [Resource metrics pipeline, "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"]
    - [Logging architecture, "https://kubernetes.io/docs/concepts/cluster-administration/logging/"]
    - [kubectl events, "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_events/"]
